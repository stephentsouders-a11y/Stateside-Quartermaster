name: Homepage Logo + Army NG Chromium Audit 0909
on:
  push:
    paths:
      - '.github/workflows/home-logo-army-ng-chromium-audit-0909.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 >/dev/null 2>&1 && npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Chromium visual audit
        run: |
          mkdir -p audit-output/home-logo-army-ng
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const url='https://www.statesideqm.com/?preview_theme_id=158561894555';
          const out='audit-output/home-logo-army-ng';
          const expected={
            'stateside-quartermaster-logo-merch':'stateside-quartermaster-logo-merch-seal-2026-09-09.png',
            'army-national-guard-series':'army-national-guard-seal-2026-09-09.png'
          };
          const browser=await chromium.launch({headless:true});
          let failed=false;
          const results=[];
          for(const vp of [{name:'desktop',width:1440,height:1150},{name:'mobile',width:390,height:844}]){
            const page=await browser.newPage({viewport:{width:vp.width,height:vp.height},deviceScaleFactor:1});
            let response=null;
            for(let i=0;i<3;i++){
              response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000}).catch(()=>null);
              await page.waitForTimeout(2500);
              if(response&&response.status()===200) break;
            }
            if(!response||response.status()!==200){results.push({viewport:vp.name,status:'LOAD_FAIL'});failed=true;await page.close();continue;}
            await page.locator('[data-sq-series-handle="stateside-quartermaster-logo-merch"]').scrollIntoViewIfNeeded();
            await page.waitForTimeout(1200);
            const data=await page.evaluate(()=>{
              const handles=['stateside-quartermaster-logo-merch','army-national-guard-series','air-national-guard-series','state-guard-series','products-built-for-the-line-u-s-army'];
              return handles.map(h=>{
                const card=document.querySelector(`[data-sq-series-handle="${h}"]`);
                const logo=card?.querySelector('.sqhc-series-logo');
                const img=logo?.querySelector('img');
                const lr=logo?.getBoundingClientRect();
                const ir=img?.getBoundingClientRect();
                return {handle:h,exists:!!card,src:img?.currentSrc||img?.src||'',logoRect:lr?{x:+lr.x.toFixed(1),y:+lr.y.toFixed(1),w:+lr.width.toFixed(1),h:+lr.height.toFixed(1)}:null,imgRect:ir?{x:+ir.x.toFixed(1),y:+ir.y.toFixed(1),w:+ir.width.toFixed(1),h:+ir.height.toFixed(1)}:null,transform:img?getComputedStyle(img).transform:null,objectFit:img?getComputedStyle(img).objectFit:null};
              });
            });
            for(const [h,file] of Object.entries(expected)){
              const x=data.find(d=>d.handle===h);
              if(!x?.exists||!x.src.includes(file)){failed=true;}
            }
            results.push({viewport:vp.name,httpStatus:response.status(),data});
            await page.locator('[data-sq-line-series-root]').screenshot({path:`${out}/${vp.name}-series.png`});
            await page.screenshot({path:`${out}/${vp.name}-full.png`,fullPage:true});
            await page.close();
          }
          await browser.close();
          fs.writeFileSync(`${out}/audit.json`,JSON.stringify({failed,results},null,2));
          if(failed) process.exit(1);
          EOF
          node audit.mjs
          base64 -w0 audit-output/home-logo-army-ng/desktop-series.png > audit-output/home-logo-army-ng/desktop-series.b64
          base64 -w0 audit-output/home-logo-army-ng/mobile-series.png > audit-output/home-logo-army-ng/mobile-series.b64
      - name: Commit audit evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-output/home-logo-army-ng
          git diff --cached --quiet || git commit -m 'Store Chromium audit evidence for homepage logo fixes'
          git push
