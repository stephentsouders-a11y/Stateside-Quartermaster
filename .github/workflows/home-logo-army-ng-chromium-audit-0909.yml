name: Homepage Logo + Army NG Chromium Audit 0909
on:
  push:
    paths:
      - '.github/workflows/home-logo-army-ng-chromium-audit-0909.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 >/dev/null 2>&1 && npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Chromium visual audit
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          const url='https://www.statesideqm.com/?preview_theme_id=158561894555';
          const expected={
            'stateside-quartermaster-logo-merch':'stateside-quartermaster-logo-merch-seal-2026-09-09.png',
            'army-national-guard-series':'army-national-guard-seal-2026-09-09.png'
          };
          const browser=await chromium.launch({headless:true});
          let failed=false;
          for(const vp of [{name:'desktop',width:1440,height:1150},{name:'mobile',width:390,height:844}]){
            const page=await browser.newPage({viewport:{width:vp.width,height:vp.height},deviceScaleFactor:1});
            let response=null;
            for(let i=0;i<3;i++){
              response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000}).catch(()=>null);
              await page.waitForTimeout(2500);
              if(response&&response.status()===200) break;
            }
            if(!response||response.status()!==200){console.log('LOAD_FAIL',vp.name);failed=true;await page.close();continue;}
            await page.locator('[data-sq-series-handle="stateside-quartermaster-logo-merch"]').scrollIntoViewIfNeeded();
            await page.waitForTimeout(1200);
            const data=await page.evaluate((expected)=>{
              const handles=['stateside-quartermaster-logo-merch','army-national-guard-series','air-national-guard-series','state-guard-series','products-built-for-the-line-u-s-army'];
              return handles.map(h=>{
                const card=document.querySelector(`[data-sq-series-handle="${h}"]`);
                const logo=card?.querySelector('.sqhc-series-logo');
                const img=logo?.querySelector('img');
                const lr=logo?.getBoundingClientRect();
                const ir=img?.getBoundingClientRect();
                return {
                  handle:h,
                  exists:!!card,
                  src:img?.currentSrc||img?.src||'',
                  logoRect:lr?{x:+lr.x.toFixed(1),y:+lr.y.toFixed(1),w:+lr.width.toFixed(1),h:+lr.height.toFixed(1)}:null,
                  imgRect:ir?{x:+ir.x.toFixed(1),y:+ir.y.toFixed(1),w:+ir.width.toFixed(1),h:+ir.height.toFixed(1)}:null,
                  transform:img?getComputedStyle(img).transform:null,
                  objectFit:img?getComputedStyle(img).objectFit:null
                };
              });
            },expected);
            console.log('AUDIT',vp.name,JSON.stringify(data));
            for(const [h,file] of Object.entries(expected)){
              const x=data.find(d=>d.handle===h);
              if(!x?.exists||!x.src.includes(file)){console.log('ASSET_FAIL',vp.name,h,x?.src);failed=true;}
            }
            const root=page.locator('[data-sq-line-series-root]');
            await root.screenshot({path:`homepage-series-${vp.name}.png`});
            await page.screenshot({path:`homepage-full-${vp.name}.png`,fullPage:true});
            await page.close();
          }
          await browser.close();
          if(failed) process.exit(1);
          EOF
          node audit.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-logo-army-ng-chromium-audit
          path: homepage-*.png
          if-no-files-found: error
