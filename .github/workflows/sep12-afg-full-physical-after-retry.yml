name: Sep12 AFG full physical after retry
on:
  workflow_run:
    workflows: ['Sep12 Refine v5 failure-only physical retry']
    types: [completed]
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Physically certify every AFG Refine checkbox
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
          ROUTE: armed-forces-gear
        run: |
          cat > afg.mjs <<'EOF'
          import {chromium} from 'playwright';import fs from 'fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms)),BASE=process.env.BASE,THEME=process.env.THEME,route=process.env.ROUTE,sel='#MainContent .sq-refine-v3-choice input[type=checkbox]';
          fs.mkdirSync('out/video',{recursive:true});
          const browser=await chromium.launch({headless:true}),ctx=await browser.newContext({viewport:{width:1365,height:900},recordVideo:{dir:'out/video',size:{width:960,height:633}}}),page=await ctx.newPage();page.setDefaultTimeout(14000);page.setDefaultNavigationTimeout(40000);
          const base=()=>{const u=new URL('/collections/'+route,BASE);u.searchParams.set('preview_theme_id',THEME);return u.toString()};
          async function strip(){await page.evaluate(()=>{for(const s of ['#PBarNextFrameWrapper','#PBarNextFrame','iframe[src*="shopifycloud/preview-bar"]'])document.querySelectorAll(s).forEach(e=>{try{e.hidePopover?.()}catch{}e.style.setProperty('display','none','important');e.style.setProperty('pointer-events','none','important')})}).catch(()=>{})}
          async function load(){let last;for(let a=0;a<8;a++){try{const r=await page.goto(base(),{waitUntil:'domcontentloaded',timeout:40000});if(!r||r.status()===429||r.status()>=500){last=new Error('HTTP '+(r?.status()||0));await sleep(2500*(a+1));continue}await page.locator('#MainContent').waitFor({state:'attached',timeout:15000});await page.waitForFunction(()=>{const m=document.getElementById('MainContent');return m&&(m.dataset.sqRefineV3Ready==='true'||!!m.querySelector('.sq-refine-v3-sidebar'))},null,{timeout:14000}).catch(()=>{});const err=await page.locator('#MainContent').getAttribute('data-sq-refine-v3-error').catch(()=>null);if(/429|too many requests|503|server/i.test(err||'')){last=new Error(err);await sleep(2500*(a+1));continue}await page.locator('#MainContent details.sq-refine-v3-group').evaluateAll(ds=>ds.forEach(d=>d.open=true)).catch(()=>{});await strip();let sig='',stable=0;for(let n=0;n<30;n++){const ls=await page.locator(sel).evaluateAll(xs=>xs.map(x=>(x.getAttribute('aria-label')||x.parentElement?.querySelector('span')?.textContent||'').replace(/\s+/g,' ').trim())).catch(()=>[]);const s=ls.join('|');if(ls.length&&s===sig)stable++;else stable=0;sig=s;if(stable>=5)return r;await sleep(180)}return r}catch(e){last=e;await sleep(2500*(a+1))}}throw last||new Error('load failed')}
          async function byLabel(label){for(let n=0;n<30;n++){const i=await page.locator(sel).evaluateAll((xs,l)=>xs.findIndex(x=>((x.getAttribute('aria-label')||x.parentElement?.querySelector('span')?.textContent||'').replace(/\s+/g,' ').trim())===l),label).catch(()=>-1);if(i>=0){const x=page.locator(sel).nth(i);if(await x.evaluate(e=>e.isConnected).catch(()=>false))return x}await sleep(120)}throw new Error('label unavailable '+label)}
          async function point(loc){await loc.scrollIntoViewIfNeeded();await strip();await sleep(100);const b=await loc.boundingBox();if(!b)throw new Error('no bbox');const pt={x:b.x+b.width/2,y:b.y+b.height/2};const hit=await page.evaluate(({x,y})=>{const e=document.elementFromPoint(x,y);return {tag:e?.tagName||null,cls:String(e?.className||'')}} ,pt);await page.mouse.click(pt.x,pt.y);return hit}
          const rec={route,checks:[],failures:[]};try{const r=await load();rec.status=r.status();rec.sidebar=await page.locator('#MainContent .sq-refine-v3-sidebar:visible').count();rec.horizontal=await page.locator('#MainContent .facets-block-wrapper--horizontal:visible').count();rec.labels=await page.locator(sel).evaluateAll(xs=>xs.map(x=>(x.getAttribute('aria-label')||x.parentElement?.querySelector('span')?.textContent||'').replace(/\s+/g,' ').trim()));rec.controlCount=rec.labels.length;if(rec.status!==200)rec.failures.push('HTTP_'+rec.status);if(rec.sidebar!==1)rec.failures.push('SIDEBAR_'+rec.sidebar);if(rec.horizontal)rec.failures.push('HORIZONTAL_'+rec.horizontal);if(!rec.controlCount)rec.failures.push('NO_CONTROLS');for(const label of rec.labels){const c={label,outcome:'PASS'};try{await load();let x=await byLabel(label);const before=page.url(),checked=await x.isChecked();c.textHit=await point(x.locator('xpath=..').locator('span').first());await sleep(350);x=await byLabel(label);c.textNoOp=page.url()===before&&(await x.isChecked())===checked;if(!c.textNoOp){c.outcome='FAIL_TEXT_ACTIVATED';rec.checks.push(c);continue}c.boxHit=await point(x);if(c.boxHit.tag!=='INPUT')throw new Error('box hit '+JSON.stringify(c.boxHit));await Promise.race([page.waitForURL(u=>u.toString()!==before,{timeout:7000}).catch(()=>{}),sleep(1400)]);c.after=page.url();if(c.after===before){x=await byLabel(label).catch(()=>null);c.afterChecked=x?await x.isChecked().catch(()=>null):null}c.action=c.after!==before||c.afterChecked===true;if(!c.action)c.outcome='FAIL_CHECKBOX_NO_ACTION';if(c.after!==before){const body=((await page.locator('body').innerText().catch(()=>''))||'').slice(0,12000);if(/something went wrong|internal server error|page not found|404 not found/i.test(body))c.outcome='FAIL_ERROR_PAGE'}}catch(e){c.outcome='FAIL_EXCEPTION';c.error=String(e)}rec.checks.push(c);console.log(JSON.stringify(c));fs.writeFileSync('out/result.json',JSON.stringify(rec,null,2));await sleep(900)}}catch(e){rec.fatal=String(e);rec.failures.push('FATAL')}
          rec.failedControls=rec.checks.filter(x=>x.outcome!=='PASS').length;if(rec.failedControls)rec.failures.push('FAILED_CONTROLS_'+rec.failedControls);rec.coverage=rec.checks.length===rec.controlCount;if(!rec.coverage)rec.failures.push('INCOMPLETE_COVERAGE');rec.pass=rec.failures.length===0;fs.writeFileSync('out/result.json',JSON.stringify(rec,null,2));console.log(JSON.stringify({route,status:rec.status,controls:rec.controlCount,tested:rec.checks.length,failed:rec.failedControls,failures:rec.failures},null,2));const v=page.video();await ctx.close();if(v){try{fs.renameSync(await v.path(),'out/video/armed-forces-gear.webm')}catch{}}await browser.close();if(!rec.pass)process.exitCode=2;
          EOF
          node afg.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afg-full-physical-after-retry
          path: out
          retention-days: 7
