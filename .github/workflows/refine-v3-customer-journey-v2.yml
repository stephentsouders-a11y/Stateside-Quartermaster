name: Refine V3 customer journey certification v2
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/scripts/refine-v3-customer-journey-v2.mjs'
      - '.github/workflows/refine-v3-customer-journey-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-journey-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run corrected customer journey
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const f='.github/scripts/refine-v3-customer-journey-v2.mjs';
          let s=fs.readFileSync(f,'utf8');
          s='globalThis.CSS={escape:(s)=>String(s)};\n'+s;
          s=s.replaceAll('await input.check();await page.waitForLoadState', 'await input.evaluate(el=>{const d=el.closest("details");if(d)d.open=true});await input.check();await page.waitForLoadState');
          fs.writeFileSync(f,s);
          NODE
          node .github/scripts/refine-v3-customer-journey-v2.mjs
