name: Refine V3 customer journey certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-customer-journey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Use the draft like a customer and fail on real regressions
        run: |
          cat > customer.mjs <<'EOF'
          import { chromium } from 'playwright';
          const BASE='https://www.statesideqm.com', THEME='158561894555';
          const routes=[
          ['Accessories','/collections/accessories-gifts-collectibles'],['Airsoft','/collections/airsoft-milsim'],['Apparel','/collections/apparel'],['Armed Forces Gear','/collections/armed-forces-gear'],['Art','/collections/art'],['Body Armor','/collections/body-armor-ballistic-protection'],['Books','/collections/literature'],['Child Safety','/collections/child-safety-shop'],['DIVE / SCUBA','/collections/dive-scuba'],['Firearm Accessories','/collections/firearm-accessories'],['First Aid','/collections/first-aid-medical-ifak'],['Flags','/collections/flags-patriotic-decor'],['Flashlights','/collections/flashlights-lighting'],['Footwear','/collections/footwear-gloves-eyewear'],['K9','/collections/k9-dog-gear'],['Knives','/collections/knives-axes-cutlery'],['Morale Patches','/collections/morale-patches-tactical-id'],['Outdoor','/collections/outdoor-preparedness-gear'],['Patriotic','/collections/patriotic-american-heritage'],['Safety Rescue','/collections/safety-rescue-climbing'],['Sta-Brite','/collections/sta-brite-insignia'],['Tactical Gear','/collections/tactical-gear'],['Thin Line','/collections/thin-line'],['Uniforms','/collections/uniforms'],['Watches','/collections/watches'],['Lighters','/collections/zippos-lighters-torches'],['Logo Merch','/collections/stateside-quartermaster-logo-merch'],['Army National Guard','/collections/army-national-guard-series'],['Air National Guard','/collections/air-national-guard-series'],['U.S. Army','/collections/products-built-for-the-line-u-s-army'],['U.S. Navy','/collections/products-built-for-the-line-u-s-navy'],['U.S. Air Force','/collections/products-built-for-the-line-u-s-air-force'],['U.S. Marines','/collections/products-built-for-the-line-u-s-marine-corps'],['U.S. Coast Guard','/collections/products-built-for-the-line-u-s-coast-guard'],['U.S. Space Force','/collections/products-built-for-the-line-u-s-space-force'],['ROTC','/collections/rotc-series'],['JROTC','/collections/jrotc-series'],['Military Schools','/collections/military-schools-academies'],['Law Enforcement','/collections/law-enforcement-corrections'],['Fire EMS SAR','/collections/firefighting-ems-search-rescue']];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function url(path,extra={}){const u=new URL(path,BASE);u.searchParams.set('preview_theme_id',THEME);for(const[k,v] of Object.entries(extra))u.searchParams.set(k,v);return u.toString()}
          async function go(p,path,extra={}){let last;for(let i=0;i<5;i++){try{const r=await p.goto(url(path,extra),{waitUntil:'domcontentloaded',timeout:90000});if(r?.status()===200){await settle(p);return}last=new Error('HTTP '+(r?.status()||0))}catch(e){last=e}await sleep([4000,7000,11000,16000,22000][i])}throw last}
          async function settle(p){await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000});await p.waitForFunction(()=>{const m=document.querySelector('#MainContent');const grids=[...m.querySelectorAll('.sq-refine-v3-results .product-grid')];const vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};return !!m.querySelector('.sq-refine-v3-sidebar') && grids.some(g=>vis(g)&&[...g.querySelectorAll(':scope > .product-grid__item')].some(x=>vis(x)&&x.querySelector('a[href*="/products/"]')))},null,{timeout:45000});await sleep(1000)}
          async function snapshot(p){return p.evaluate(()=>{const m=document.querySelector('#MainContent');const vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0};const v3=[...m.querySelectorAll('.sq-refine-v3-sidebar')].filter(vis);const legacy=[...m.querySelectorAll('.sq-global-refine-sidebar,.sq-collection-sidebar,.facets-block-wrapper,.facets-container,.facets-wrapper,[class*="filter-sidebar"]')].filter(e=>vis(e)&&!e.classList.contains('sq-refine-v3-sidebar'));const grids=[...m.querySelectorAll('.sq-refine-v3-results .product-grid')];const grid=grids.find(g=>g.classList.contains('sq-v3-authoritative-grid')&&vis(g))||grids.find(vis);const cards=grid?[...grid.querySelectorAll(':scope > .product-grid__item')].filter(x=>vis(x)&&x.querySelector('a[href*="/products/"]')):[];const rs=cards.slice(0,12).map(x=>{const r=x.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width}});const row=rs.length?rs.filter(x=>Math.abs(x.y-rs[0].y)<4):[];const s=v3[0],t=s?.querySelector('.sq-refine-v3-sidebar__title'),sr=s?.getBoundingClientRect(),tr=t?.getBoundingClientRect();const groups=s?[...s.querySelectorAll(':scope > details.sq-refine-v3-group')].map(d=>({label:(d.querySelector(':scope > summary')?.textContent||'').trim(),inputs:d.querySelectorAll('input[type=checkbox]').length,open:d.open,targets:[...d.querySelectorAll('input[data-kind=structural][data-target]')].map(i=>i.dataset.target||''),native:[...d.querySelectorAll('input[data-kind=native]')].map(i=>({name:i.dataset.filterName||'',value:i.dataset.filterValue||''}))})):[];return{v3:v3.length,legacy:legacy.map(e=>e.className),title:(t?.textContent||'').trim(),titleBg:t?getComputedStyle(t).backgroundColor:'',sideBg:s?getComputedStyle(s).backgroundColor:'',gap:sr&&tr?Math.max(0,sr.right-tr.right):999,position:s?getComputedStyle(s).position:'',cards:cards.length,row:row.length,width:row.length?Math.round(row.map(x=>x.w).sort((a,b)=>a-b)[Math.floor(row.length/2)]):0,groups,pageSizes:[...m.querySelectorAll('.sq-refine-v3-page-size input')].map(i=>i.value)}})}
          function validate(d,path){const e=[];if(d.v3!==1)e.push('visible V3 sidebars='+d.v3);if(d.legacy.length)e.push('visible legacy sidebars='+d.legacy.join(','));if(d.title.toUpperCase()!=='REFINE PRODUCTS')e.push('bad title');if(d.titleBg!=='rgb(8, 40, 63)'||d.sideBg!=='rgb(8, 40, 63)'||d.gap>1.5)e.push('header edge/color');if(d.position!=='sticky')e.push('sidebar '+d.position);if(d.cards<1)e.push('no visible products');if(d.row!==3)e.push('desktop row='+d.row);if(d.width<250)e.push('card width='+d.width);if(d.pageSizes.join(',')!=='50,100,250')e.push('page sizes='+d.pageSizes.join(','));for(const g of d.groups){if(!g.inputs)e.push('empty '+g.label);for(const x of g.targets){if(x.startsWith('/collections/')&&!new URL(x,location.origin).searchParams.get('sq_root'))e.push('missing sq_root '+g.label);if(!x.startsWith('/collections/'))e.push('non-collection structural '+g.label)}}return e}
          const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({viewport:{width:1440,height:1000}});const p=await ctx.newPage();let failures=[];
          p.on('pageerror',e=>{if(/sq-refine|sq-v3/i.test(e.stack||e.message||''))failures.push('V3 pageerror '+e.message)});
          for(let i=0;i<routes.length;i++){const[n,path]=routes[i];try{await go(p,path);const d=await snapshot(p);const e=validate(d,path);if(e.length)failures.push(n+': '+e.join(' | '));console.log((e.length?'FAIL ':'PASS ')+(i+1)+'/40 '+n+' '+JSON.stringify(d));}catch(e){failures.push(n+': '+String(e));console.log('FAIL '+n+' '+e)}await sleep(1200)}
          // State Guard must remain outside V3.
          try{const r=await p.goto(url('/collections/state-guard-series'),{waitUntil:'domcontentloaded',timeout:90000});await sleep(1500);const x=await p.evaluate(()=>({v3:!!document.querySelector('[data-sq-refine-v3]'),side:!!document.querySelector('.sq-refine-v3-sidebar')}));if(r?.status()!==200||x.v3||x.side)failures.push('State Guard freeze failed '+JSON.stringify(x));console.log('STATE-GUARD '+JSON.stringify(x))}catch(e){failures.push('State Guard '+e)}
          // Armored Vehicles must remain legacy/non-V3.
          try{const r=await p.goto(url('/pages/armored-vehicles-purchase-inquiry'),{waitUntil:'domcontentloaded',timeout:90000});await sleep(1000);const x=await p.evaluate(()=>({v3:!!document.querySelector('[data-sq-refine-v3]'),side:!!document.querySelector('.sq-refine-v3-sidebar')}));if(r?.status()!==200||x.v3||x.side)failures.push('Armored Vehicles isolation failed '+JSON.stringify(x));console.log('ARMORED '+JSON.stringify(x))}catch(e){failures.push('Armored '+e)}
          // Deep customer interactions on representative roots.
          for(const path of ['/collections/accessories-gifts-collectibles','/collections/apparel','/collections/firearm-accessories','/collections/products-built-for-the-line-u-s-navy']){try{await go(p,path);const group=p.locator('.sq-refine-v3-sidebar details.sq-refine-v3-group').filter({has:p.locator('input[type=checkbox]')}).first();const was=await group.getAttribute('open');await group.locator(':scope > summary').click();await sleep(150);const now=await group.getAttribute('open');await group.locator(':scope > summary').click();await sleep(150);const end=await group.getAttribute('open');if(was!==null||now===null||end!==null)failures.push(path+' disclosure toggle failed');const product=p.locator('.sq-refine-v3-results .product-grid:visible .product-grid__item:visible a[href*="/products/"]').first();const href=await product.getAttribute('href');if(!href)throw new Error('no product link');await product.click();await p.waitForURL(/\/products\//,{timeout:30000});if(!p.url().includes('/products/'))failures.push(path+' product click did not open product');await p.goBack({waitUntil:'domcontentloaded',timeout:90000});await settle(p);const after=await snapshot(p);if(after.v3!==1)failures.push(path+' back navigation lost V3 sidebar');console.log('DEEP PASS '+path+' product='+href)}catch(e){failures.push(path+' deep journey '+String(e))}}
          // Native checkbox URL + reload/back persistence.
          for(const path of ['/collections/accessories-gifts-collectibles','/collections/apparel']){try{await go(p,path);const input=p.locator('.sq-refine-v3-sidebar input[data-kind=native][data-filter-name][data-filter-value]:not(:checked)').first();if(await input.count()){const name=await input.getAttribute('data-filter-name'),value=await input.getAttribute('data-filter-value');await input.check();await p.waitForLoadState('domcontentloaded',{timeout:30000}).catch(()=>{});await sleep(1600);const u=new URL(p.url());if(!u.searchParams.getAll(name).includes(value))failures.push(path+' native filter URL missing '+name+'='+value);await settle(p);const checked=await p.locator(`.sq-refine-v3-sidebar input[data-kind=native][data-filter-name="${name}"][data-filter-value="${value}"]`).first().isChecked().catch(()=>false);if(!checked)failures.push(path+' native filter not preserved after navigation');await p.reload({waitUntil:'domcontentloaded',timeout:90000});await settle(p);const checked2=await p.locator(`.sq-refine-v3-sidebar input[data-kind=native][data-filter-name="${name}"][data-filter-value="${value}"]`).first().isChecked().catch(()=>false);if(!checked2)failures.push(path+' native filter not preserved after reload');console.log('FILTER PASS '+path+' '+name+'='+value)}else console.log('FILTER SKIP '+path+' no native candidate')}catch(e){failures.push(path+' native filter '+String(e))}}
          // Structural checkbox must stay in collection V3 and keep sq_root.
          for(const path of ['/collections/products-built-for-the-line-u-s-navy','/collections/literature']){try{await go(p,path);const input=p.locator('.sq-refine-v3-sidebar input[data-kind=structural][data-target^="/collections/"]').first();if(await input.count()){const target=await input.getAttribute('data-target');const tu=new URL(target,BASE);if(!tu.searchParams.get('sq_root'))failures.push(path+' structural target missing sq_root');await input.check();await p.waitForLoadState('domcontentloaded',{timeout:30000}).catch(()=>{});await sleep(1200);if(!p.url().includes('/collections/'))failures.push(path+' structural click left collections');await settle(p);if((await snapshot(p)).v3!==1)failures.push(path+' structural click lost sidebar');console.log('STRUCTURAL PASS '+path+' -> '+p.url())}else console.log('STRUCTURAL SKIP '+path)}catch(e){failures.push(path+' structural '+String(e))}}
          // Page-size controls, including clicks.
          for(const target of ['50','100','250']){try{await go(p,'/collections/accessories-gifts-collectibles');const input=p.locator(`.sq-refine-v3-page-size input[value="${target}"]`);await input.check();await p.waitForLoadState('domcontentloaded',{timeout:30000}).catch(()=>{});await settle(p);await sleep(target==='250'?3000:1500);const u=new URL(p.url());if(u.searchParams.get('sq_per_page')!==target)failures.push('page size '+target+' URL not applied');const count=await p.locator('.sq-refine-v3-results .product-grid:visible .product-grid__item:visible').count();if(count!==Number(target))failures.push('page size '+target+' rendered '+count);console.log('PAGE-SIZE '+target+' count='+count)}catch(e){failures.push('page size '+target+' '+String(e))}}
          // Mobile: one sidebar, static, two cards.
          const mc=await browser.newContext({viewport:{width:390,height:844}});const mp=await mc.newPage();for(const path of ['/collections/accessories-gifts-collectibles','/collections/apparel','/collections/literature','/collections/products-built-for-the-line-u-s-navy']){try{await go(mp,path);const d=await mp.evaluate(()=>{const vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};const m=document.querySelector('#MainContent'),s=[...m.querySelectorAll('.sq-refine-v3-sidebar')].filter(vis),g=[...m.querySelectorAll('.sq-refine-v3-results .product-grid')].find(x=>x.classList.contains('sq-v3-authoritative-grid')&&vis(x))||[...m.querySelectorAll('.sq-refine-v3-results .product-grid')].find(vis);const cards=g?[...g.querySelectorAll(':scope > .product-grid__item')].filter(x=>vis(x)&&x.querySelector('a[href*="/products/"]')).slice(0,8):[];const r=cards.map(x=>x.getBoundingClientRect()),row=r.length?r.filter(x=>Math.abs(x.y-r[0].y)<4).length:0;return{sidebars:s.length,position:s[0]?getComputedStyle(s[0]).position:'',row,cards:cards.length}});if(d.sidebars!==1||d.position==='sticky'||d.row!==2)failures.push('mobile '+path+' '+JSON.stringify(d));console.log('MOBILE '+path+' '+JSON.stringify(d))}catch(e){failures.push('mobile '+path+' '+String(e))}}await mc.close();
          await ctx.close();await browser.close();
          console.log('CUSTOMER-JOURNEY-SUMMARY failures='+failures.length);for(const f of failures)console.log('FAILURE '+f);if(failures.length)process.exit(1);
          EOF
          node customer.mjs
