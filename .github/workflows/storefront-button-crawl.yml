name: Storefront button-path certification
on:
  push:
    paths:
      - '.github/workflows/storefront-button-crawl.yml'
permissions:
  contents: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Crawl rendered navigation buttons
        run: |
          cat > crawl.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('out/failures',{recursive:true});
          const base='https://www.statesideqm.com',theme='158561894555';
          const seeds=['/','/collections/products-built-for-the-line-u-s-army','/collections/army-national-guard-series','/collections/products-built-for-the-line-u-s-air-force','/collections/air-national-guard-series','/collections/state-guard-series','/collections/armed-forces-gear','/collections/thin-line','/collections/law-enforcement-corrections','/collections/firefighting-ems-search-rescue','/collections/rotc-series','/collections/jrotc-series','/collections/military-schools-academies'];
          const browser=await chromium.launch({headless:true});
          const discovered=new Map();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function clean(h){try{const u=new URL(h,base);if(u.origin!==base||!/^\/(collections|products)\//.test(u.pathname))return null;u.searchParams.delete('preview_theme_id');u.searchParams.delete('filter.v.availability');u.hash='';return u.pathname+(u.searchParams.toString()?'?'+u.searchParams.toString():'')}catch{return null}}
          async function nav(route,viewport={width:1440,height:1100}){
            for(let attempt=0;attempt<2;attempt++){
              const ctx=await browser.newContext({viewport});
              const page=await ctx.newPage(); page.setDefaultNavigationTimeout(30000);
              const u=new URL(route,base);u.searchParams.delete('filter.v.availability');u.searchParams.set('preview_theme_id',theme);
              const start=Date.now();let status=null,error=null;
              try{const r=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:30000});status=r?.status()??null}catch(e){error=String(e)}
              if(status===429){await ctx.close();if(attempt===0){await sleep(12000);continue}}
              return{ctx,page,status,error,start};
            }
          }
          for(const seed of seeds){
            const n=await nav(seed); if(!n)continue; const {ctx,page}=n;
            if(n.status===200){await page.waitForTimeout(1500).catch(()=>{});const links=await page.evaluate(()=>[...document.querySelectorAll('#MainContent a[href]')].filter(a=>{const r=a.getBoundingClientRect();if(r.width<30||r.height<20)return false;const c=a.className||'';return /sq|card|button|tile|entity|branch|category|type|manufacturer/i.test(String(c))&&!/product-card|sqbfl-product/i.test(String(c))}).map(a=>({href:a.href,label:(a.innerText||a.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim().slice(0,160)}))).catch(()=>[]);for(const l of links){const h=clean(l.href);if(h&&!discovered.has(h))discovered.set(h,l.label)}}
            await ctx.close(); await sleep(1800);
          }
          const routes=[...discovered.entries()]; const results=[];
          for(let i=0;i<routes.length;i++){
            const [route,label]=routes[i]; const n=await nav(route); if(!n)continue; const {ctx,page,status,error,start}=n;
            let usable=null;
            if(status===200&&!error){for(let j=0;j<24;j++){const s=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),t=(m?.innerText||'').replace(/\s+/g,' ').trim();return{bad:/just a moment|something went wrong|internal server error|there was a problem/i.test(document.title+' '+t),loading:/loading items|checking items|tree unavailable|building the customer-facing product tree/i.test(t),visible:[...(m?.querySelectorAll('a,.product-card,.product-grid__item,.sqbfl-card,.sq-subcategory-card,.sg-entity,.sq-afg-branch-card,.sq-ts-match-card,.sq-type-family-product')||[])].some(e=>{const r=e.getBoundingClientRect();return r.width>30&&r.height>20})}}).catch(()=>({bad:true,loading:false,visible:false}));if(!s.bad&&!s.loading&&s.visible){usable=Date.now()-start;break}await page.waitForTimeout(200)}}
            const d=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),t=(m?.innerText||'').replace(/\s+/g,' ').trim();return{bad:/just a moment|something went wrong|internal server error|there was a problem/i.test(document.title+' '+t),loading:/loading items|checking items|tree unavailable|building the customer-facing product tree/i.test(t),availability:[...(m?.querySelectorAll('a[href*="filter.v.availability"]')||[])].length,broken:[...(m?.querySelectorAll('img')||[])].filter(x=>x.complete&&x.naturalWidth===0).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4}}).catch(()=>({bad:true,loading:false,availability:0,broken:0,overflow:false}));
            const failed=status!==200||!!error||d.bad||d.loading||usable===null||usable>5000||d.availability>0||d.broken>0||d.overflow;
            if(failed)await page.screenshot({path:`out/failures/${String(i+1).padStart(3,'0')}.png`,fullPage:true}).catch(()=>{});
            results.push({route,label,status,error,usableMs:usable,failed,...d});console.log(`${i+1}/${routes.length}`,failed?'FAIL':'PASS',status,usable,route);
            await ctx.close(); await sleep(1800);
          }
          await browser.close();
          fs.writeFileSync('out/report.json',JSON.stringify({discovered:discovered.size,tested:routes.length,results},null,2));
          const failures=results.filter(x=>x.failed);console.log(JSON.stringify({discovered:discovered.size,tested:routes.length,failures:failures.length,failedRoutes:failures},null,2));if(failures.length)process.exitCode=2;
          EOF
          node crawl.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: storefront-button-crawl, path: out, retention-days: 7}
