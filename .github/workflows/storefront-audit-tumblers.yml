name: Storefront audit - tumblers
on:
  push:
    paths:
      - '.github/workflows/storefront-audit-tumblers.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render Tumblers exact route
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
        run: |
          cat > audit.mjs <<'EOF'
          import {chromium} from 'playwright';import fs from 'fs';
          const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:1440,height:1100}}),p=await c.newPage();p.setDefaultNavigationTimeout(60000);
          const u=new URL('/collections/drinkware-gifts/sq-type-tumblers?filter.v.availability=1',process.env.BASE);u.searchParams.set('preview_theme_id',process.env.THEME);
          let status=null,error=null;try{const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded'});status=r?.status()??null;await p.waitForTimeout(8500)}catch(e){error=String(e)}
          await p.addStyleTag({content:'html,body{height:auto!important;min-height:100%!important;overflow:visible!important}.page-wrapper{height:auto!important;min-height:100vh!important;overflow:visible!important;max-height:none!important}'}).catch(()=>{});
          const d=await p.evaluate(()=>{const tx=e=>(e?.textContent||'').replace(/\s+/g,' ').trim(),rr=e=>e?({x:Math.round(e.getBoundingClientRect().x),y:Math.round(e.getBoundingClientRect().y),w:Math.round(e.getBoundingClientRect().width),h:Math.round(e.getBoundingClientRect().height)}):null;
            const side=document.querySelector('#MainContent .sq-collection-sidebar,#MainContent .sq-custom-render-sidebar'),main=document.querySelector('#MainContent .sq-collection-products-column,#MainContent .sq-custom-render-main'),grid=document.querySelector('#MainContent .sq-collection-products-column #product-grid,#MainContent .sq-collection-products-column .product-grid,#MainContent .sq-custom-render-main .sqbfl-products,#MainContent .sq-custom-render-main .sqsg-products');
            const products=[...document.querySelectorAll('#MainContent .product-grid__item,#MainContent .sqbfl-product,#MainContent .sqsg-product,#MainContent .sq-custom-color-product')].map(e=>({text:tx(e).slice(0,250),rect:rr(e)}));
            return{title:document.title,finalUrl:location.href,height:document.documentElement.scrollHeight,availabilityLinks:document.querySelectorAll('#MainContent a[href*="filter.v.availability"]').length,sidebar:!!side,manufacturer:!!document.querySelector('#MainContent [data-sq-sidebar-facet="manufacturer"],#MainContent .sq-custom-render-sidebar details:nth-of-type(1)'),color:!!document.querySelector('#MainContent [data-sq-sidebar-facet="color-pattern"],#MainContent .sq-custom-render-sidebar details:nth-of-type(2)'),sidebarRect:rr(side),mainRect:rr(main),gridRect:rr(grid),gridTemplateColumns:grid?getComputedStyle(grid).gridTemplateColumns:'',products};});
          fs.mkdirSync('audit-out',{recursive:true});fs.writeFileSync('audit-out/report.json',JSON.stringify({status,error,...d},null,2));await p.screenshot({path:'audit-out/tumblers.png',fullPage:true});await b.close();
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: storefront-audit-tumblers
          path: audit-out
          retention-days: 7
