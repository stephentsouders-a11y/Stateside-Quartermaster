name: Refine V3 Pagination Final Chromium Gate
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/refine-v3-pagination-final-cert.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0,1,2,3,4]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify pagination
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cat > cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('out',{recursive:true});
          const origin='https://www.statesideqm.com',theme='158561894555',marker='assembly-rescue-20260911-v4';
          const routes=[
          ['accessories-gifts-collectibles'],['airsoft-milsim'],['apparel'],['armed-forces-gear'],['art'],['body-armor-ballistic-protection'],['literature'],['child-safety-shop'],['dive-scuba'],['firearm-accessories'],['first-aid-medical-ifak'],['flags-patriotic-decor'],['flashlights-lighting'],['footwear-gloves-eyewear'],['k9-dog-gear'],['knives-axes-cutlery'],['morale-patches-tactical-id'],['outdoor-preparedness-gear'],['patriotic-american-heritage'],['safety-rescue-climbing'],['sta-brite-insignia'],['tactical-gear'],['thin-line'],['uniforms'],['watches'],['zippos-lighters-torches'],['stateside-quartermaster-logo-merch'],['army-national-guard-series'],['air-national-guard-series'],['products-built-for-the-line-u-s-army'],['products-built-for-the-line-u-s-navy'],['products-built-for-the-line-u-s-air-force'],['products-built-for-the-line-u-s-marine-corps'],['products-built-for-the-line-u-s-coast-guard'],['products-built-for-the-line-u-s-space-force'],['rotc-series'],['jrotc-series'],['military-schools-academies'],['law-enforcement-corrections'],['firefighting-ems-search-rescue'],['literature-u-s-army','literature']
          ].map(([handle,root])=>({handle,root}));
          const shard=Number(process.env.SHARD||0), mine=routes.filter((_,i)=>i%5===shard);
          const browser=await chromium.launch({headless:true}),ctx=await browser.newContext({viewport:{width:1440,height:1000}});
          const failures=[],rows=[]; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const fail=(k,m)=>failures.push(`${k}: ${m}`);
          const make=(r,n,p)=>{const u=new URL(`/collections/${r.handle}`,origin);u.searchParams.set('preview_theme_id',theme);if(r.root)u.searchParams.set('sq_root',r.root);u.searchParams.set('sq_per_page',String(n));u.searchParams.set('sq_view_page',String(p));u.searchParams.set('sq_final_cert',`${Date.now()}-${shard}-${n}-${p}`);return u.toString()};
          async function go(page,u,label){let last='';for(let i=0;i<6;i++){try{const r=await page.goto(u,{waitUntil:'domcontentloaded',timeout:90000});if(r?.ok())return;last=`HTTP ${r?.status()}`;if(r?.status()!==429&&(r?.status()||0)<500)throw new Error(last)}catch(e){last=String(e);if(!/429|5\d\d|Timeout/i.test(last))throw e}await sleep(Math.min(12000,1200*2**i))}throw new Error(`${label}: ${last}`)}
          async function ready(page){await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset?.sqRefineV3Ready==='true',undefined,{timeout:110000});await page.waitForTimeout(1200)}
          async function products(page){return page.evaluate(()=>[...new Set([...document.querySelectorAll('#MainContent .sq-refine-v3-results .product-grid a[href*="/products/"]')].filter(a=>{const r=a.getBoundingClientRect(),s=getComputedStyle(a);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'}).map(a=>a.href.split('?')[0]))])}
          async function pager(page){return page.evaluate(()=>{const p=document.querySelector('#MainContent .sq-refine-v3-pager');if(!p)return{exists:false,visible:false,links:[]};const r=p.getBoundingClientRect(),s=getComputedStyle(p);return{exists:true,visible:r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0',links:[...p.querySelectorAll('a')].map(a=>({text:(a.textContent||'').trim(),href:a.href}))}})}
          async function controls(page,size){return page.evaluate(size=>{const b=document.querySelector('#MainContent .sq-refine-v3-page-size'),i=b?[...b.querySelectorAll('input')]:[];const v=i.map(x=>String(x.value)),c=i.filter(x=>x.checked).map(x=>String(x.value));return{ok:!!b&&['50','100','250'].every(x=>v.includes(x))&&c.includes(String(size))}},size)}
          async function data(page){return page.$eval('#MainContent',e=>({...e.dataset})).catch(()=>({}))}
          if(shard===0){const p=await ctx.newPage();await go(p,make({handle:'literature-u-s-army',root:'literature'},50,1),'preflight');const rev=await p.getAttribute('script[data-sq-refine-v3-pagination-repair]','data-revision');if(rev!==marker)fail('PREFLIGHT',`expected ${marker}, got ${rev||'missing'}`);await p.close()}
          for(const route of mine){for(const size of [50,100,250]){const key=`${route.handle}[${size}]`,p1=await ctx.newPage(),e1=[];p1.on('pageerror',e=>e1.push(String(e)));const row={route:route.handle,size};try{await go(p1,make(route,size,1),`${key} p1`);await ready(p1);const a=await products(p1),g1=await pager(p1),c=await controls(p1,size),d1=await data(p1);row.page1=a.length;if(!a.length)fail(key,'page1 empty');if(a.length>size)fail(key,`page1 ${a.length}>${size}`);if(!c.ok)fail(key,'50/100/250 control state incorrect');if(g1.exists&&!g1.visible)fail(key,'page1 pager hidden');if(d1.sqRefineV3PaginationRepairError)fail(key,`page1 repair error ${d1.sqRefineV3PaginationRepairError}`);
          const p2=await ctx.newPage(),e2=[];p2.on('pageerror',e=>e2.push(String(e)));let b=[],g2={exists:false,visible:false,links:[]},d2={},ok2=false;try{await go(p2,make(route,size,2),`${key} p2`);await ready(p2);ok2=true;b=await products(p2);g2=await pager(p2);d2=await data(p2)}catch(e){row.page2Error=String(e)}row.page2=b.length;if(ok2&&b.length){const next=g1.links.find(x=>/next/i.test(x.text)||new URL(x.href).searchParams.get('sq_view_page')==='2'),prev=g2.links.find(x=>/previous/i.test(x.text)||new URL(x.href).searchParams.get('sq_view_page')==='1'),over=b.filter(x=>a.includes(x));if(!g1.visible||!next)fail(key,'page2 has products but page1 lacks visible Next');if(!g2.visible||!prev)fail(key,'page2 has products but lacks visible Previous');if(b.length>size)fail(key,`page2 ${b.length}>${size}`);if(over.length)fail(key,`page overlap ${over.length}`);if(d2.sqRefineV3PaginationRepairError)fail(key,`page2 repair error ${d2.sqRefineV3PaginationRepairError}`);if(next){await go(p1,next.href,`${key} next`);await ready(p1);if(new URL(p1.url()).searchParams.get('sq_view_page')!=='2')fail(key,'Next URL wrong')}}else if(ok2&&!b.length){const next=g1.links.find(x=>/next/i.test(x.text)||new URL(x.href).searchParams.get('sq_view_page')==='2');if(next)fail(key,'empty page2 but Next shown')}else fail(key,`page2 not ready: ${row.page2Error||'unknown'}`);if(e1.length)fail(key,`page1 JS ${e1[0]}`);if(e2.length)fail(key,`page2 JS ${e2[0]}`);await p2.close()}catch(e){fail(key,String(e))}if(failures.some(x=>x.startsWith(key+':'))||route.root)await p1.screenshot({path:`out/${route.handle}-${size}.png`,fullPage:true}).catch(()=>{});rows.push(row);await p1.close();await sleep(900)}}
          await browser.close();fs.writeFileSync(`out/report-${shard}.json`,JSON.stringify({shard,rows,failures},null,2));console.log(JSON.stringify({shard,rows,failures},null,2));if(failures.length)process.exitCode=2;
          EOF
          node cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-pagination-final-${{ matrix.shard }}
          path: out
          retention-days: 14
