name: Literature every Refine choice Chromium audit
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/literature-every-refine-choice-0911.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click every Literature Refine checkbox one by one
        run: |
          mkdir -p out
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const BASE='https://www.statesideqm.com';
          const ROOT='/collections/literature';
          const THEME='158561894555';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000}});
          const page=await context.newPage();
          page.setDefaultNavigationTimeout(70000); page.setDefaultTimeout(30000);
          const report={started:new Date().toISOString(),root:ROOT,theme:THEME,choices:[],failures:[],groups:[]};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const vis=e=>e&&e.offsetWidth>0&&e.offsetHeight>0;
          function rootUrl(){const u=new URL(ROOT,BASE);u.searchParams.set('preview_theme_id',THEME);u.searchParams.set('sq_root','literature');return u.toString()}
          async function loadRoot(){let last;for(let a=0;a<4;a++){try{const r=await page.goto(rootUrl(),{waitUntil:'domcontentloaded'});if(r?.status()===200){await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:40000});await sleep(2200);return}}catch(e){last=e}await sleep(1500*(a+1))}throw last||new Error('root failed')}
          async function inventory(){return page.evaluate(()=>{const side=[...document.querySelectorAll('.sq-refine-v3-sidebar')].find(e=>e.offsetWidth>0&&e.offsetHeight>0);if(!side)return[];return [...side.querySelectorAll(':scope > details.sq-refine-v3-group')].map((g,gi)=>({group:(g.querySelector(':scope > summary')?.textContent||'').replace(/\s+/g,' ').trim(),gi,choices:[...g.querySelectorAll('input[type=checkbox]')].map((i,ci)=>({ci,text:(i.closest('label')?.textContent||'').replace(/\s+/g,' ').trim(),kind:i.dataset.kind||'',target:i.dataset.target||'',author:i.dataset.author||'',name:i.name||'',value:i.value||''}))}))})}
          await loadRoot();
          const groups=await inventory(); report.groups=groups.map(g=>({group:g.group,count:g.choices.length}));
          const flat=groups.flatMap(g=>g.choices.map(c=>({...c,group:g.group,gi:g.gi})));
          console.log('CHOICE_COUNT',flat.length,JSON.stringify(report.groups));
          for(let n=0;n<flat.length;n++){
            const spec=flat[n]; const row={index:n+1,group:spec.group,text:spec.text,kind:spec.kind,target:spec.target,ok:false,errors:[]};
            const errs=[]; const onerr=e=>errs.push(String(e)); page.on('pageerror',onerr);
            try{
              await loadRoot();
              const locator=page.locator('.sq-refine-v3-sidebar:visible > details.sq-refine-v3-group').nth(spec.gi).locator('input[type=checkbox]').nth(spec.ci);
              await locator.scrollIntoViewIfNeeded();
              const before=page.url();
              await locator.check({force:true});
              await page.waitForFunction(b=>location.href!==b,before,{timeout:30000}).catch(()=>{});
              await page.waitForLoadState('domcontentloaded').catch(()=>{}); await sleep(1600);
              row.url=page.url(); row.urlChanged=row.url!==before;
              row.state=await page.evaluate(()=>{const m=document.querySelector('#MainContent');const visible=e=>e&&e.offsetWidth>0&&e.offsetHeight>0;const side=[...document.querySelectorAll('.sq-refine-v3-sidebar')].find(visible);const grids=[...document.querySelectorAll('.sq-refine-v3-results .product-grid')].filter(visible);return{ready:m?.dataset.sqRefineV3Ready||'',author:m?.dataset.sqRefineV3Author||'',authorError:m?.dataset.sqRefineV3AuthorError||'',cards:grids.reduce((a,g)=>Math.max(a,[...g.children].filter(x=>x.querySelector('a[href*="/products/"]')).length),0),checked:side?[...side.querySelectorAll('input[type=checkbox]:checked')].map(i=>({text:(i.closest('label')?.textContent||'').replace(/\s+/g,' ').trim(),target:i.dataset.target||'',author:i.dataset.author||'',value:i.value||''})):[],path:location.pathname,query:location.search};});
              const target=spec.target?new URL(spec.target,BASE):null;
              const targetPathOk=!target||row.state.path===target.pathname;
              const queryOk=!target||[...target.searchParams.entries()].every(([k,v])=>new URL(row.url).searchParams.getAll(k).includes(v));
              const authorOk=spec.kind!=='author'||(!row.state.authorError&&new URL(row.url).searchParams.get('sq_author')===spec.author&&row.state.author===spec.author);
              const hasGrid=row.state.cards>0;
              row.ok=!!(row.urlChanged&&targetPathOk&&queryOk&&authorOk&&hasGrid&&errs.length===0);
              if(!row.urlChanged)row.errors.push('URL did not change after click');
              if(!targetPathOk)row.errors.push('wrong destination path');
              if(!queryOk)row.errors.push('target query not preserved');
              if(!authorOk)row.errors.push('author state failed');
              if(!hasGrid)row.errors.push('no visible product cards');
              if(errs.length)row.errors.push(...errs.map(x=>'runtime: '+x));
            }catch(e){row.errors.push(String(e));}
            page.off('pageerror',onerr); report.choices.push(row); if(!row.ok)report.failures.push({index:row.index,group:row.group,text:row.text,errors:row.errors,url:row.url||''});
            fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));
            console.log('CHOICE',row.index,'/',flat.length,row.ok?'PASS':'FAIL',row.group,'::',row.text,row.url||'',row.errors.join(' | '));
          }
          report.finished=new Date().toISOString(); report.total=report.choices.length; report.passed=report.choices.filter(x=>x.ok).length; report.failed=report.failures.length;
          fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));
          await page.goto(rootUrl(),{waitUntil:'domcontentloaded'}).catch(()=>{}); await sleep(2000); await page.screenshot({path:'out/final-root.png',fullPage:true}).catch(()=>{});
          console.log('SUMMARY',JSON.stringify({total:report.total,passed:report.passed,failed:report.failed,failures:report.failures}));
          await context.close();await browser.close();
          if(report.failed)process.exit(1);
          JS
          timeout 1950 node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: literature-every-refine-choice-0911
          path: out
          retention-days: 7