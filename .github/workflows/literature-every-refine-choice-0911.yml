name: Literature every Refine choice Chromium audit
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/literature-every-refine-choice-0911.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Exhaustive Literature click certification
        run: |
          mkdir -p out
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const BASE='https://www.statesideqm.com',ROOT='/collections/literature',THEME='158561894555';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000}});
          const report={started:new Date().toISOString(),theme:THEME,groups:[],choices:[],failures:[],smokes:[]};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const challenged=t=>/connection needs to be verified|verify you are human|cloudflare/i.test(t||'');
          function rootUrl(){const u=new URL(ROOT,BASE);u.searchParams.set('preview_theme_id',THEME);u.searchParams.set('sq_root','literature');return u.toString()}
          async function checkChallenge(page){const txt=await page.locator('body').innerText().catch(()=> '');if(challenged(txt))throw new Error('CLOUDFLARE_CHALLENGE')}
          const seed=await context.newPage();seed.setDefaultTimeout(20000);seed.setDefaultNavigationTimeout(45000);
          const seedResponse=await seed.goto(rootUrl(),{waitUntil:'domcontentloaded'});if(!seedResponse||seedResponse.status()>=400)throw new Error('root HTTP '+(seedResponse?.status()??'none'));
          const rootHTML=await seedResponse.text();await checkChallenge(seed);await seed.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:30000});await sleep(1000);await checkChallenge(seed);
          const groups=await seed.evaluate(()=>{const vis=e=>e&&e.offsetWidth>0&&e.offsetHeight>0;const side=[...document.querySelectorAll('.sq-refine-v3-sidebar')].find(vis);if(!side)return[];return [...side.querySelectorAll(':scope > details.sq-refine-v3-group')].map((g,gi)=>({group:(g.querySelector(':scope > summary')?.textContent||'').replace(/\s+/g,' ').trim(),gi,choices:[...g.querySelectorAll('input[type=checkbox]')].map((i,ci)=>({ci,text:(i.closest('label')?.textContent||'').replace(/\s+/g,' ').trim(),kind:i.dataset.kind||'',target:i.dataset.target||'',filterName:i.dataset.filterName||'',filterValue:i.dataset.filterValue||'',param:i.dataset.sqPolishParam||'',polishValue:i.dataset.sqPolishValue||'',author:i.dataset.author||''}))}))});
          report.groups=groups.map(g=>({group:g.group,count:g.choices.length}));const flat=groups.flatMap(g=>g.choices.map(c=>({...c,group:g.group,gi:g.gi})));
          console.log('CHOICE_COUNT',flat.length,JSON.stringify(report.groups));if(flat.length!==101)report.failures.push({scope:'inventory',error:'expected 101 choices, got '+flat.length});
          await seed.screenshot({path:'out/root.png',fullPage:true});await seed.close();
          async function testChoice(s,index){const page=await context.newPage();page.setDefaultTimeout(12000);page.setDefaultNavigationTimeout(20000);let armed=false,captured='';const row={index,group:s.group,text:s.text,kind:s.kind,target:s.target,ok:false,errors:[]};
            await page.route('**/*',async route=>{const req=route.request();if(req.isNavigationRequest()&&req.frame()===page.mainFrame()){
              if(armed){captured=req.url();armed=false;return route.abort('blockedbyclient')}
              const u=new URL(req.url());if(u.pathname===ROOT){return route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:rootHTML})}
            }return route.continue()});
            try{await page.goto(rootUrl(),{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:12000});
              const group=page.locator('.sq-refine-v3-sidebar:visible > details.sq-refine-v3-group').nth(s.gi);await group.evaluate(el=>{el.open=true});const input=group.locator('input[type=checkbox]').nth(s.ci);await input.evaluate(el=>{el.checked=false});armed=true;await input.evaluate(el=>el.click()).catch(()=>{});for(let i=0;i<40&&!captured;i++)await sleep(25);row.captured=captured;
              if(!captured)row.errors.push('click emitted no navigation');else{const actual=new URL(captured),expected=s.target?new URL(s.target,BASE):null;if(expected&&actual.pathname!==expected.pathname)row.errors.push('wrong path: '+actual.pathname+' != '+expected.pathname);if(expected){for(const [k,v] of expected.searchParams){if(k==='preview_theme_id')continue;if(!actual.searchParams.getAll(k).includes(v))row.errors.push('missing expected '+k+'='+v)}}const name=s.filterName||s.param,value=s.filterValue||s.polishValue;if(!expected&&name&&value&&!actual.searchParams.getAll(name).includes(value))row.errors.push('missing native '+name+'='+value);if(!expected&&!name&&s.author&&actual.searchParams.get('sq_author')!==s.author)row.errors.push('author route mismatch');if(actual.searchParams.get('sq_root')!=='literature')row.errors.push('sq_root not preserved')}
              row.ok=row.errors.length===0;
            }catch(e){row.errors.push(String(e))}finally{await page.close().catch(()=>{})}return row}
          const concurrency=3;for(let start=0;start<flat.length;start+=concurrency){const batch=flat.slice(start,start+concurrency);const rows=await Promise.all(batch.map((s,j)=>testChoice(s,start+j+1)));for(const row of rows){report.choices.push(row);if(!row.ok)report.failures.push({scope:'choice',index:row.index,group:row.group,text:row.text,errors:row.errors,captured:row.captured||''});console.log('CHOICE',row.index,'/',flat.length,row.ok?'PASS':'FAIL',row.group,'::',row.text,row.captured||'',row.errors.join(' | '))}fs.writeFileSync('out/report.json',JSON.stringify(report,null,2))}
          const smokePaths=['/collections/literature-u-s-army?sq_root=literature','/collections/literature-u-s-conflicts-world-war-i?sq_root=literature','/collections/literature?sq_root=literature&filter.p.vendor=Books%20by%20splitShops'];
          for(const path of smokePaths){const page=await context.newPage();page.setDefaultNavigationTimeout(30000);const s={path,ok:false,errors:[]};try{const u=new URL(path,BASE);u.searchParams.set('preview_theme_id',THEME);const r=await page.goto(u.toString(),{waitUntil:'domcontentloaded'});await checkChallenge(page);await page.waitForSelector('#MainContent',{timeout:15000});await sleep(700);await checkChallenge(page);const st=await page.evaluate(()=>({products:new Set([...document.querySelectorAll('#MainContent a[href*="/products/"]')].map(a=>a.href.split('?')[0])).size,error:document.querySelector('#MainContent')?.dataset.sqRefineV3Error||''}));s.state=st;if(r?.status()!==200)s.errors.push('HTTP '+r?.status());if(st.error)s.errors.push('Refine error '+st.error);if(!st.products)s.errors.push('no product links');s.ok=s.errors.length===0}catch(e){s.errors.push(String(e))}finally{await page.close().catch(()=>{})}report.smokes.push(s);if(!s.ok)report.failures.push({scope:'smoke',path,errors:s.errors});console.log('SMOKE',s.ok?'PASS':'FAIL',path,JSON.stringify(s.state||{}),s.errors.join(' | '));if(s.errors.some(x=>x.includes('CLOUDFLARE_CHALLENGE')))break}
          report.finished=new Date().toISOString();report.total=report.choices.length;report.passed=report.choices.filter(x=>x.ok).length;report.failed=report.failures.length;fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));console.log('SUMMARY',JSON.stringify({total:report.total,passed:report.passed,failed:report.failed,smokes:report.smokes,failures:report.failures}));await context.close();await browser.close();if(report.failed)process.exit(1);
          JS
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: literature-every-refine-choice-0911
          path: out
          retention-days: 7