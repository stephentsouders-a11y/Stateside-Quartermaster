name: Sidebar Plus Buttons Chromium Certification
on:
  push:
    paths: ['.github/workflows/sidebar-plus-buttons-cert.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify sidebar plus body buttons
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cat > cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const base='https://www.statesideqm.com',theme='158770561179',shard=Number(process.env.SHARD),shards=8;
          const all=[
          ['Tactical Gear','/collections/tactical-gear'],['Uniforms','/collections/uniforms'],['Firearm Accessories','/collections/firearm-accessories'],['Body Armor & Ballistic Protection','/collections/body-armor-ballistic-protection'],['Apparel','/collections/apparel'],['Flags & Patriotic Decor','/collections/flags-patriotic-decor'],['Literature','/collections/literature'],['Outdoor & Preparedness Gear','/collections/outdoor-preparedness-gear'],['First Aid, Medical & IFAK','/collections/first-aid-medical-ifak'],['Flashlights & Lighting','/collections/flashlights-lighting'],['Knives, Axes & Cutlery','/collections/knives-axes-cutlery'],['Dive & Scuba','/collections/dive-scuba'],['Armed Forces Gear','/collections/armed-forces-gear'],['Morale Patches & Tactical ID','/collections/morale-patches-tactical-id'],['Footwear, Gloves & Eyewear','/collections/footwear-gloves-eyewear'],['Accessories, Gifts & Collectibles','/collections/accessories-gifts-collectibles'],['Safety, Rescue & Climbing','/collections/safety-rescue-climbing'],['Airsoft & Milsim','/collections/airsoft-milsim'],['K9 & Dog Gear','/collections/k9-dog-gear'],['Patriotic & American Heritage','/collections/patriotic-american-heritage'],['Art','/collections/art'],['Zippos, Lighters & Torches','/collections/zippos-lighters-torches'],['Watches','/collections/watches'],['Armored Vehicles','/pages/armored-vehicles-purchase-inquiry'],['Child Safety Shop','/collections/child-safety-shop'],['Thin Line','/collections/thin-line'],['Sta-Brite Insignia','/collections/sta-brite-insignia'],['Stateside Quartermaster Logo Merch','/collections/stateside-quartermaster-logo-merch'],['Army National Guard Series','/collections/army-national-guard-series'],['Air National Guard Series','/collections/air-national-guard-series'],['U.S. Army','/collections/products-built-for-the-line-u-s-army'],['U.S. Navy','/collections/products-built-for-the-line-u-s-navy'],['U.S. Air Force','/collections/products-built-for-the-line-u-s-air-force'],['U.S. Marine Corps','/collections/products-built-for-the-line-u-s-marine-corps'],['U.S. Coast Guard','/collections/products-built-for-the-line-u-s-coast-guard'],['U.S. Space Force','/collections/products-built-for-the-line-u-s-space-force'],['ROTC','/collections/rotc-series'],['JROTC','/collections/jrotc-series'],['Military Schools & Academies','/collections/military-schools-academies'],['Law Enforcement & Corrections','/collections/law-enforcement-corrections'],['Firefighting, EMS & Search & Rescue','/collections/firefighting-ems-search-rescue']];
          if(all.length!==41||all.some(([,r])=>/state-guard-series/i.test(r)))throw new Error('Scope violation: State Guard is forbidden');
          const serviceRoots=new Set(['/collections/army-national-guard-series','/collections/air-national-guard-series','/collections/products-built-for-the-line-u-s-army','/collections/products-built-for-the-line-u-s-navy','/collections/products-built-for-the-line-u-s-air-force','/collections/products-built-for-the-line-u-s-marine-corps','/collections/products-built-for-the-line-u-s-coast-guard','/collections/products-built-for-the-line-u-s-space-force']);
          const routes=all.filter((_,i)=>i%shards===shard),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          fs.mkdirSync('evidence/screens',{recursive:true});fs.mkdirSync('evidence/videos',{recursive:true});
          const browser=await chromium.launch({headless:true}),results=[];
          const badBody=t=>/Just a moment|Something went wrong|Too Many Requests|429 Too Many Requests/i.test(t||'');
          async function load(page,url){
            const attempts=[];let resp=null;const waits=[0,10000,20000,40000,60000];
            for(let i=0;i<waits.length;i++){
              if(waits[i])await sleep(waits[i]);
              resp=await page.goto(url,{waitUntil:'domcontentloaded'}).catch(()=>null);await sleep(2500);
              const txt=(await page.locator('body').innerText().catch(()=>'' )).slice(0,5000);
              attempts.push({attempt:i+1,status:resp?.status()||0,bad:badBody(txt)});
              if(resp?.status()===200&&!badBody(txt))break;
            }
            return {resp,attempts};
          }
          const bodySurfaceSelector=['[data-sqbfl-root]','.sqbfl','.sq-subcategory-section','.sq-third-level','.sq-books-tree','[data-sq-afg-mode]','.sq-afg-branch-section','.sq-line-series-categories','.sq-line-program-tree','.sq-ps-root','.sq-ts-match-section','.sq-child-safety-section','.sq-maker-browser','.vac-unified-maker-browser','.vac-merged-browser','.vac-firearm-browser','.vac-dive-browser','.vac-knives-browser','.vac-armor-browser','.vac-gift-categories','.vac-guard-folders','.sq-ptype-browser','.sqsg-orgs'].join(',');
          async function waitForReady(page,route){
            const timeline=[];const deadline=Date.now()+(serviceRoots.has(route)?120000:15000);
            while(Date.now()<deadline){
              const s=await page.evaluate((bodySurfaceSelector)=>{
                const vis=e=>{if(!e)return false;const st=getComputedStyle(e),r=e.getBoundingClientRect();return st.display!=='none'&&st.visibility!=='hidden'&&Number(st.opacity)!==0&&r.width>1&&r.height>1};
                const main=document.getElementById('MainContent'),root=document.querySelector('[data-sqbfl-root],.sqbfl');
                const surfaces=[...document.querySelectorAll(bodySurfaceSelector)].filter(vis);
                const clickables=surfaces.flatMap(s=>[...s.querySelectorAll('a[href],button')]).filter(vis).filter(e=>!e.closest('[data-sq-collection-rail]'));
                return {bflState:root?.getAttribute('data-sqbfl-load-state')||'',bflText:(root?.innerText||'').slice(0,500),surfaces:surfaces.length,clickables:clickables.length,white:[...document.querySelectorAll('.sq-global-refine-sidebar,.sqsg-refine-sidebar')].filter(vis).length,native:[...document.querySelectorAll('.facets__filters-wrapper,.facets-horizontal-remove,.facets--filters-title,.facets-toggle__wrapper,theme-drawer#filters-drawer')].filter(vis).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,mainText:(main?.innerText||'').slice(0,700)};
              },bodySurfaceSelector);
              timeline.push({ms:Date.now(),...s});
              if(serviceRoots.has(route)){
                if(s.bflState==='ready'&&!/Loading available items|Building the customer-facing product tree|Tree unavailable/i.test(s.bflText)&&s.surfaces>0&&s.clickables>0)return {ok:true,state:s,timeline};
                if(/Tree unavailable/i.test(s.bflText))return {ok:false,state:s,timeline,reason:'Tree unavailable'};
              }else if(s.surfaces>0&&s.clickables>0)return {ok:true,state:s,timeline};
              await sleep(1000);
            }
            return {ok:false,state:timeline.at(-1)||{},timeline,reason:'body navigation readiness timeout'};
          }
          async function snapshot(page){
            return page.evaluate((bodySurfaceSelector)=>{
              const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>1&&r.height>1};
              const visible=q=>[...document.querySelectorAll(q)].filter(vis),rails=visible('[data-sq-collection-rail]'),surfaces=visible(bodySurfaceSelector),clickables=surfaces.flatMap(s=>[...s.querySelectorAll('a[href],button')]).filter(vis).filter(e=>!e.closest('[data-sq-collection-rail]')),root=document.querySelector('[data-sqbfl-root],.sqbfl');
              return {railVisible:rails.length,bodySurfaceCount:surfaces.length,clickableCount:clickables.length,bodySurfaceClasses:surfaces.slice(0,10).map(e=>String(e.className||e.getAttribute('data-sqbfl-root')||e.tagName)),bflState:root?.getAttribute('data-sqbfl-load-state')||'',bflText:(root?.innerText||'').slice(0,500),white:visible('.sq-global-refine-sidebar,.sqsg-refine-sidebar').length,native:visible('.facets__filters-wrapper,.facets-horizontal-remove,.facets--filters-title,.facets-toggle__wrapper,theme-drawer#filters-drawer').length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,title:(document.querySelector('h1')?.innerText||'').trim(),text:(document.getElementById('MainContent')?.innerText||'').slice(0,1200)};
            },bodySurfaceSelector);
          }
          for(const [vp,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
            for(const [label,route] of routes){
              if(/state-guard-series/i.test(route))throw new Error(`Forbidden route reached: ${route}`);
              const ctx=await browser.newContext({viewport,recordVideo:{dir:'evidence/videos',size:viewport}}),page=await ctx.newPage();page.setDefaultNavigationTimeout(60000);
              const consoleErrors=[];page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              await page.goto(`${base}/?preview_theme_id=${theme}`,{waitUntil:'domcontentloaded'}).catch(()=>null);await sleep(1200);
              const u=new URL(route,base);u.searchParams.set('preview_theme_id',theme);if(route.startsWith('/collections/'))u.searchParams.set('filter.v.availability','1');
              const loaded=await load(page,u.toString());let readiness={ok:true,state:{},timeline:[]};
              if(route.startsWith('/collections/'))readiness=await waitForReady(page,route);
              const snap=await snapshot(page),safe=label.toLowerCase().replace(/[^a-z0-9]+/g,'-');
              const samples=[];for(let i=0;i<8;i++){samples.push(await snapshot(page));await sleep(250);}
              await page.screenshot({path:`evidence/screens/${vp}-${safe}.png`,fullPage:true});
              results.push({vp,label,route,status:loaded.resp?.status()||0,attempts:loaded.attempts,readiness,snap,samples,consoleErrors:consoleErrors.slice(-30)});
              await ctx.close();await sleep(5000);
            }
          }
          await browser.close();fs.writeFileSync(`evidence/shard-${shard}.json`,JSON.stringify({shard,results},null,2));
          const failures=[];
          for(const r of results){
            if(r.status!==200)failures.push(`${r.vp} ${r.label}: HTTP ${r.status}`);
            if(r.route.startsWith('/collections/')){
              if(r.snap.railVisible!==1)failures.push(`${r.vp} ${r.label}: expected one visible navy sidebar, got ${r.snap.railVisible}`);
              if(!r.readiness.ok)failures.push(`${r.vp} ${r.label}: ${r.readiness.reason||'body nav not ready'}`);
              if(r.snap.bodySurfaceCount<1)failures.push(`${r.vp} ${r.label}: no visible in-page navigation surface`);
              if(r.snap.clickableCount<1)failures.push(`${r.vp} ${r.label}: no visible in-page buttons/links`);
              if(serviceRoots.has(r.route)&&(r.snap.bflState!=='ready'||/Loading available items|Building the customer-facing product tree|Tree unavailable/i.test(r.snap.bflText)))failures.push(`${r.vp} ${r.label}: BFL tree not ready`);
              if(r.snap.white||r.snap.native||r.samples.some(x=>x.white||x.native))failures.push(`${r.vp} ${r.label}: duplicate white/native filters visible`);
            }else if(r.label==='Armored Vehicles'&&r.snap.railVisible!==0)failures.push(`${r.vp} Armored Vehicles: collection sidebar appeared on page route`);
            if(r.snap.overflow||r.samples.some(x=>x.overflow))failures.push(`${r.vp} ${r.label}: horizontal overflow`);
          }
          if(failures.length){console.error(failures.join('\n'));process.exit(2)}
          console.log(JSON.stringify(results.map(r=>({vp:r.vp,label:r.label,status:r.status,rail:r.snap.railVisible,surfaces:r.snap.bodySurfaceCount,buttons:r.snap.clickableCount,bflState:r.snap.bflState})),null,2));
          EOF
          node cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar-plus-buttons-${{ matrix.shard }}
          path: evidence/
          retention-days: 14
