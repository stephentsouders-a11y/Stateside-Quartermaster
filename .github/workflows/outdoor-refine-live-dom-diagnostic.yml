name: Outdoor Refine live DOM diagnostic

on:
  push:
    paths:
      - '.github/workflows/outdoor-refine-live-dom-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect live Outdoor page
        run: |
          mkdir -p out
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const url='https://www.statesideqm.com/collections/outdoor-preparedness-gear?sq_per_page=50';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1200}});
          const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForTimeout(15000);
          const data=await page.evaluate(()=>{
            const main=document.querySelector('#MainContent');
            const inputs=[...document.querySelectorAll('input[type=checkbox]')].map((i,n)=>({n,id:i.id,name:i.name,value:i.value,checked:i.checked,classes:i.className,dataset:{...i.dataset},label:(i.closest('label')?.innerText||document.querySelector(`label[for="${CSS.escape(i.id||'')}"]`)?.innerText||'').replace(/\s+/g,' ').trim()}));
            const details=[...document.querySelectorAll('details')].map((d,n)=>({n,classes:d.className,summary:(d.querySelector(':scope > summary')?.innerText||'').replace(/\s+/g,' ').trim(),text:(d.innerText||'').replace(/\s+/g,' ').trim().slice(0,1200)}));
            const links=[...document.querySelectorAll('a[href]')].filter(a=>/survival|emergency|hydration|shelter|sleep|bushcraft|fire start|navigation|binocular|lighting|headlamp|pack|pouch|dry bag|solar|portable power|camp cooking|cold weather|thermal|fishing|hunting|trail/i.test((a.innerText||'')+' '+a.href)).map(a=>({text:(a.innerText||'').replace(/\s+/g,' ').trim(),href:a.getAttribute('href'),classes:a.className})).slice(0,200);
            return {
              href:location.href,
              title:document.title,
              statusText:document.readyState,
              mainExists:!!main,
              mainDataset:main?{...main.dataset}:null,
              mainClasses:main?.className||'',
              bodyClasses:document.body.className,
              bodyText:(document.body.innerText||'').replace(/\s+/g,' ').trim().slice(0,15000),
              inputs,
              details,
              links,
              counts:{checkboxes:inputs.length,details:details.length,products:document.querySelectorAll('a[href*="/products/"]').length,productGrids:document.querySelectorAll('.product-grid').length}
            };
          });
          fs.writeFileSync('out/diag.json',JSON.stringify({httpStatus:response?.status(),...data},null,2));
          fs.writeFileSync('out/page.html',await page.content());
          await page.screenshot({path:'out/page.png',fullPage:true});
          console.log(JSON.stringify({httpStatus:response?.status(),href:data.href,title:data.title,mainExists:data.mainExists,mainDataset:data.mainDataset,counts:data.counts,inputs:data.inputs,details:data.details,links:data.links,bodyText:data.bodyText},null,2));
          await browser.close();
          EOF
          node diag.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outdoor-refine-live-dom-diagnostic
          path: out
          retention-days: 7
