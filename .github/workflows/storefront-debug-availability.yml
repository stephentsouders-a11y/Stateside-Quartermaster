name: Storefront debug - availability redirect
on:
  push:
    paths:
      - '.github/workflows/storefront-debug-availability.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Trace Apparel navigation
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
        run: |
          cat > trace.mjs <<'EOF'
          import {chromium} from 'playwright';import fs from 'fs';
          const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:1440,height:900}}),p=await c.newPage();
          const events=[];p.on('framenavigated',f=>{if(f===p.mainFrame())events.push({kind:'framenavigated',at:Date.now(),url:f.url()})});p.on('request',r=>{if(r.isNavigationRequest()&&r.frame()===p.mainFrame())events.push({kind:'nav-request',at:Date.now(),url:r.url()})});p.on('response',r=>{if(r.request().isNavigationRequest()&&r.request().frame()===p.mainFrame())events.push({kind:'nav-response',at:Date.now(),url:r.url(),status:r.status()})});
          const u=new URL('/collections/apparel',process.env.BASE);u.searchParams.set('preview_theme_id',process.env.THEME);const start=Date.now();let r;try{r=await p.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:60000})}catch(e){events.push({kind:'goto-error',error:String(e)})}
          for(const ms of [0,250,500,1000,2000,4000,7000]){if(ms)await p.waitForTimeout(ms-(events._last||0));events._last=ms;events.push({kind:'sample',elapsed:Date.now()-start,url:p.url(),ready:await p.evaluate(()=>document.readyState).catch(()=>null)})}
          delete events._last;fs.mkdirSync('trace-out',{recursive:true});fs.writeFileSync('trace-out/trace.json',JSON.stringify({initial:u.toString(),gotoResponse:r?{url:r.url(),status:r.status()}:null,events},null,2));await b.close();
          EOF
          node trace.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: availability-trace
          path: trace-out
          retention-days: 7
