name: Refine geometry DOM diagnostic
# ordinary collection ancestry diagnostic after exact-row alignment
on:
  push:
    paths:
      - '.github/workflows/refine-geometry-dom-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          cat > diagnose.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const path='/collections/accessories-gifts-collectibles';
          const page=await browser.newPage({viewport:{width:1440,height:1100}});const u=new URL(path,'https://www.statesideqm.com');u.searchParams.set('preview_theme_id','158561894555');await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(2800);
          const d=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),body=m?.querySelector('.sq-global-refine-main'),vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity!==0&&r.width>2&&r.height>2};const sb=[...m.querySelectorAll('.sq-global-refine-sidebar')].find(vis);const sel='.product-grid__item,.product-card,.sqbfl-product,.sq-type-family-product,.sq-ts-match-card,.sq-custom-color-products__item,.sq-subcategory-card,.sqbfl-card,.sg-entity,.sq-afg-branch-card,.sq-third-level__type,.sq-books-tree a,.sq-msa-card,.sq-thin-line-card,a[href*="/products/"]';const sort=a=>a.filter(vis).filter(e=>!sb?.contains(e)).sort((x,y)=>x.getBoundingClientRect().top-y.getBoundingClientRect().top||x.getBoundingClientRect().left-y.getBoundingClientRect().left);const all=sort([...m.querySelectorAll(sel)]),inside=body?sort([...body.querySelectorAll(sel)]):[];function info(e){if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return{tag:e.tagName,id:e.id,cls:e.className?.toString().slice(0,220),x:r.x,y:r.y,w:r.width,h:r.height,display:s.display,position:s.position,text:(e.innerText||'').replace(/\s+/g,' ').slice(0,140),href:e.getAttribute?.('href')}}const ancestors=e=>{const a=[];for(let x=e,i=0;x&&i<10;i++,x=x.parentElement)a.push(info(x));return a};return{sidebar:info(sb),body:info(body),globalFirst:info(all[0]),bodyFirst:info(inside[0]),globalFirstAncestors:ancestors(all[0]),bodyFirstAncestors:ancestors(inside[0]),globalCount:all.length,bodyCount:inside.length}});console.log(JSON.stringify(d,null,2));await page.close();await browser.close();
          EOF
          node diagnose.mjs
