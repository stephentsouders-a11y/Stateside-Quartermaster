name: Refine geometry DOM diagnostic
on:
  push:
    paths:
      - '.github/workflows/refine-geometry-dom-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          cat > diagnose.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          for(const path of ['/collections/bfl-army-awards-ribbon-mounting-bars','/collections/body-armor-ballistic-protection']){
            const page=await browser.newPage({viewport:{width:1440,height:1100}});const u=new URL(path,'https://www.statesideqm.com');u.searchParams.set('preview_theme_id','158561894555');await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(2500);
            const d=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};const sb=[...m.querySelectorAll('.sq-global-refine-sidebar')].find(vis);const candidates=[...m.querySelectorAll('.product-grid__item,.product-card,.sqbfl-product,.sq-type-family-product,.sq-ts-match-card,.sq-custom-color-products__item,.sq-subcategory-card,.sqbfl-card,.sg-entity,.sq-afg-branch-card,.sq-third-level__type,a[href*="/products/"]')].filter(vis).filter(e=>!sb?.contains(e)).sort((a,b)=>a.getBoundingClientRect().top-b.getBoundingClientRect().top||a.getBoundingClientRect().left-b.getBoundingClientRect().left);const first=candidates[0];function info(e){if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return{tag:e.tagName,id:e.id,cls:e.className?.toString().slice(0,180),x:r.x,y:r.y,w:r.width,h:r.height,display:s.display,position:s.position,marginTop:s.marginTop,paddingTop:s.paddingTop,gap:s.gap,text:(e.innerText||'').replace(/\s+/g,' ').slice(0,100)}}const ancestors=[];let x=first;for(let i=0;x&&i<8;i++,x=x.parentElement)ancestors.push(info(x));const before=[];const mainBody=m.querySelector('.sq-global-refine-main');if(mainBody){for(const e of [...mainBody.querySelectorAll('*')].filter(vis)){const r=e.getBoundingClientRect(),fr=first?.getBoundingClientRect();if(fr&&r.top<fr.top&&r.bottom<=fr.top+2&&r.height>5&&r.width>100)before.push(info(e));if(before.length>=25)break}}return{sidebar:info(sb),first:info(first),ancestors,before}});console.log('\nPATH '+path+'\n'+JSON.stringify(d,null,2));await page.close()}
          await browser.close();
          EOF
          node diagnose.mjs
