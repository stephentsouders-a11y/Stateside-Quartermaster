name: Case 0109 Parallel Nearby Frames
on:
  push:
    branches: [case-0109-aerial-audit]
    paths: ['.github/workflows/case-0109-parallel-nearby.yml']
  workflow_dispatch:
jobs:
  frame:
    strategy:
      fail-fast: false
      matrix:
        frame: ['01-35_AK','01-36_AK','01-37_AK','01-38_AK','01-39_AK','01-40_AK','01-41_AK']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Locate and download ${{ matrix.frame }}
        env:
          FRAME: ${{ matrix.frame }}
        run: |
          mkdir out work && cd work
          npm init -y >/dev/null
          npm install playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > run.mjs <<'NODE'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          const frame=process.env.FRAME;
          const root='https://maine.primo.exlibrisgroup.com/nde/collectionDiscovery?collectionId=81521275480008681&vid=01MAINE_INST:DigCol&lang=en';
          const browser=await chromium.launch({headless:true}); const ctx=await browser.newContext({viewport:{width:1400,height:1000}}); const page=await ctx.newPage();
          let infoUrl=null; page.on('response',r=>{const u=r.url(); if(!infoUrl&&u.includes('na-img02.ext.exlibrisgroup.com/iiif/2/')&&u.endsWith('/info.json')) infoUrl=u;});
          await page.goto(root,{waitUntil:'domcontentloaded',timeout:60000}); await page.waitForTimeout(5000);
          const inp=page.locator('input[aria-label="Search inside the collection"]'); await inp.fill(frame); await inp.press('Enter'); await page.waitForTimeout(5500);
          const title=page.getByText(frame,{exact:false}).first(); if(await title.count()===0) throw new Error('not found '+frame);
          await title.click(); await page.waitForTimeout(7000); if(!infoUrl) throw new Error('no IIIF '+frame);
          const base=infoUrl.replace(/\/info\.json$/,''); const full=base+'/full/full/0/default.jpg';
          const r=await ctx.request.get(full,{timeout:120000}); if(!r.ok()) throw new Error('download '+r.status()); const buf=await r.body();
          fs.writeFileSync('../out/'+frame+'.jpg',buf); fs.writeFileSync('../out/meta.json',JSON.stringify({frame,infoUrl,full,bytes:buf.length,record:page.url()},null,2));
          console.log(frame,'DOWNLOADED',buf.length,full); await browser.close();
          NODE
          node run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fullres-${{ matrix.frame }}
          path: out/**
          if-no-files-found: error
          retention-days: 30
