name: Storefront audit - current smoke
on:
  push:
    paths:
      - '.github/workflows/storefront-audit-current-smoke.yml'
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slug: apparel, path: /collections/apparel}
          - {slug: accessories, path: /collections/accessories-gifts-collectibles}
          - {slug: tumblers, path: '/collections/drinkware-gifts/sq-type-tumblers'}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render current draft page
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
          SLUG: ${{ matrix.slug }}
          PATHNAME: ${{ matrix.path }}
        run: |
          cat > audit.mjs <<'EOF'
          import {chromium} from 'playwright';import fs from 'fs';
          const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:1440,height:1100}}),p=await c.newPage();p.setDefaultNavigationTimeout(60000);
          const u=new URL(process.env.PATHNAME,process.env.BASE);u.searchParams.set('preview_theme_id',process.env.THEME);let status=null,error=null;try{const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded'});status=r?.status()??null;await p.waitForTimeout(10000)}catch(e){error=String(e)}
          await p.addStyleTag({content:'html,body{height:auto!important;min-height:100%!important;overflow:visible!important}.page-wrapper{height:auto!important;min-height:100vh!important;overflow:visible!important;max-height:none!important}'}).catch(()=>{});
          const d=await p.evaluate(()=>{const tx=e=>(e?.textContent||'').replace(/\s+/g,' ').trim(),rr=e=>e?({x:Math.round(e.getBoundingClientRect().x),y:Math.round(e.getBoundingClientRect().y),w:Math.round(e.getBoundingClientRect().width),h:Math.round(e.getBoundingClientRect().height)}):null;
            const side=document.querySelector('#MainContent .sq-collection-sidebar,#MainContent .sq-custom-render-sidebar'),main=document.querySelector('#MainContent .sq-collection-products-column,#MainContent .sq-custom-render-main'),grid=document.querySelector('#MainContent .sq-type-family-products__grid,#MainContent .sq-collection-products-column #product-grid,#MainContent .sq-collection-products-column .product-grid,#MainContent .sq-custom-render-main .sqbfl-products,#MainContent .sq-custom-render-main .sqsg-products');
            const products=[...document.querySelectorAll('#MainContent .sq-type-family-product,#MainContent .product-grid__item,#MainContent .sqbfl-product,#MainContent .sqsg-product,#MainContent .sq-custom-color-product')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0}).map(e=>({text:tx(e).slice(0,220),rect:rr(e)}));
            const categoryCards=[...document.querySelectorAll('#MainContent .sq-subcategory-card,#MainContent .sq-third-level__type')].map(e=>{const im=e.querySelector('img');return{text:tx(e).slice(0,160),href:e.getAttribute('href'),rect:rr(e),naturalWidth:im?.naturalWidth||0,img:im?.currentSrc||im?.src||''}});
            return{finalUrl:location.href,title:document.title,height:document.documentElement.scrollHeight,availabilityInUrl:new URL(location.href).searchParams.has('filter.v.availability'),availabilityLinks:document.querySelectorAll('#MainContent a[href*="filter.v.availability"]').length,side:!!side,manufacturer:!!document.querySelector('#MainContent .sq-type-family-sidebar details:nth-of-type(1),#MainContent [data-sq-sidebar-facet="manufacturer"],#MainContent [data-sq-facet-browser="manufacturer"]'),color:!!document.querySelector('#MainContent .sq-type-family-sidebar details:nth-of-type(2),#MainContent [data-sq-sidebar-facet="color-pattern"],#MainContent [data-sq-facet-browser="color-pattern"]'),sidebarRect:rr(side),mainRect:rr(main),gridRect:rr(grid),gridTemplateColumns:grid?getComputedStyle(grid).gridTemplateColumns:'',productCount:products.length,products,categoryCardCount:categoryCards.length,brokenCategoryImages:categoryCards.filter(x=>x.img&&!x.naturalWidth).length,categoryCards,standaloneFacetCount:document.querySelectorAll('#MainContent .sq-facet-browser').length};});
          fs.mkdirSync('audit-out',{recursive:true});fs.writeFileSync('audit-out/report.json',JSON.stringify({slug:process.env.SLUG,status,error,...d},null,2));await p.screenshot({path:'audit-out/page.png',fullPage:true});await b.close();
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.slug }}
          path: audit-out
          retention-days: 7
