name: Literature independent Chromium verification
on:
  push:
    paths:
      - '.github/workflows/literature-independent-chromium.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium tooling
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0 agent-browser >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify Literature draft in Chromium
        run: |
          mkdir -p out
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const target='https://www.statesideqm.com/collections/literature?preview_theme_id=158561894555';
          const results=[];
          for (const [name,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]) {
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport,recordVideo:{dir:'out/videos',size:viewport}});
            const page=await context.newPage();
            const row={name,errors:[],failures:[]};
            page.on('pageerror',e=>row.errors.push(String(e)));
            await page.addInitScript(()=>{window.__sqTicks=0;setInterval(()=>window.__sqTicks++,100);});
            try {
              const res=await page.goto(target,{waitUntil:'domcontentloaded',timeout:45000});
              row.status=res?.status();
              await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:25000});
              await page.waitForTimeout(2500);
              row.state=await page.evaluate(()=>{
                const m=document.querySelector('#MainContent');
                const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>1&&r.height>1};
                const side=[...m.querySelectorAll('.sq-refine-v3-sidebar')].filter(vis);
                return {
                  theme:window.Shopify?.theme,
                  ready:m.dataset.sqRefineV3Ready,
                  sidebars:side.length,
                  groups:side[0]?[...side[0].querySelectorAll('details')].map(d=>({title:d.querySelector('summary')?.textContent.trim(),choices:d.querySelectorAll('input[type=checkbox]').length})):[],
                  grids:[...m.querySelectorAll('.product-grid')].filter(vis).map(g=>({cards:[...g.children].filter(e=>e.querySelector('a[href*="/products/"]')).length,columns:getComputedStyle(g).gridTemplateColumns})),
                  oldVisible:[...m.querySelectorAll('.sq-books-tree,.sq-subcategory-section,.sq-subcategory-card')].filter(vis).length,
                  overflow:document.documentElement.scrollWidth>innerWidth+3,
                  ticks:window.__sqTicks
                };
              });
              if(row.state.theme?.id!==158561894555) row.failures.push('wrong theme');
              if(row.state.sidebars!==1) row.failures.push('sidebar count');
              if(!row.state.grids.some(g=>g.cards>=50)) row.failures.push('product grid');
              if(row.state.oldVisible!==0) row.failures.push('legacy grid visible');
              if(row.state.overflow) row.failures.push('horizontal overflow');
              const summaries=page.locator('.sq-refine-v3-sidebar:visible details > summary');
              row.toggles=[];
              for(let i=0;i<await summaries.count();i++){
                const s=summaries.nth(i),title=await s.innerText();
                const before=await s.evaluate(e=>e.parentElement.open);
                await s.click();await page.waitForTimeout(350);
                const open=await s.evaluate(e=>e.parentElement.open);
                await page.waitForTimeout(350);
                const stable=await s.evaluate(e=>e.parentElement.open);
                row.toggles.push({title,before,open,stable,ok:open!==before&&stable===open});
                if(!(open!==before&&stable===open)) row.failures.push('unstable disclosure '+title);
                await s.click();
              }
              const t1=await page.evaluate(()=>window.__sqTicks);await page.waitForTimeout(1500);const t2=await page.evaluate(()=>window.__sqTicks);
              row.heartbeatDelta=t2-t1;if(row.heartbeatDelta<10)row.failures.push('unresponsive heartbeat');
              if(row.errors.length)row.failures.push('runtime errors');
              await page.screenshot({path:`out/${name}.png`,fullPage:false});
            } catch(e) { row.failures.push(String(e)); }
            results.push(row);
            fs.writeFileSync(`out/${name}.json`,JSON.stringify(row,null,2));
            await context.close();await browser.close();
          }
          fs.writeFileSync('out/summary.json',JSON.stringify(results,null,2));
          console.log(JSON.stringify(results));
          if(results.some(r=>r.failures.length))process.exit(1);
          JS
          timeout 220 node verify.mjs
      - name: Independent agent-browser screenshot
        if: always()
        continue-on-error: true
        run: |
          export AGENT_BROWSER_EXECUTABLE_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          timeout 30 npx agent-browser --session literature-independent open 'https://www.statesideqm.com/collections/literature?preview_theme_id=158561894555'
          timeout 15 npx agent-browser --session literature-independent snapshot -i > out/agent-browser.txt
          timeout 15 npx agent-browser --session literature-independent screenshot out/agent-browser.png
          timeout 10 npx agent-browser --session literature-independent close
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: literature-independent-chromium
          path: out
          retention-days: 7
