name: K9 color pattern functional Chromium verification
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/k9-color-pattern-functional-0911.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null
          npm install playwright@1.55.0 agent-browser >/dev/null
          npx playwright install chromium >/dev/null
          npx agent-browser install >/dev/null
      - name: Functional desktop and mobile Chromium tests
        run: |
          mkdir -p proof
          cat > verify.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base='https://www.statesideqm.com/collections/k9-dog-gear';
          const browser=await chromium.launch({headless:true});
          const report={testedAt:new Date().toISOString(),commit:process.env.GITHUB_SHA,tests:[],errors:[]};
          const ctx=await browser.newContext({viewport:{width:1440,height:1000},recordVideo:{dir:'proof/video',size:{width:1440,height:1000}}});
          const page=await ctx.newPage();page.on('pageerror',e=>report.errors.push(e.message));
          const ready=async p=>{await p.waitForFunction(()=>{const d=document.querySelector('#MainContent')?.dataset;return d?.sqK9ColorReady==='true'||d?.sqK9ColorError},null,{timeout:90000});const e=await p.locator('#MainContent').getAttribute('data-sq-k9-color-error');assert.ok(!e,e||'');};
          const state=async p=>p.evaluate(()=>({theme:Shopify.theme.id,labels:[...document.querySelectorAll('.sq-refine-v3-sidebar>details>summary')].map(x=>x.textContent.trim()),chosen:[...document.querySelectorAll('[data-sq-k9-color]:checked')].map(i=>i.value),total:document.querySelector('#MainContent')?.dataset.sqK9ColorTotal,handles:[...document.querySelectorAll('.sq-refine-v3-results .product-grid>.product-grid__item')].map(c=>decodeURIComponent(new URL(c.querySelector('a[href*="/products/"]').href).pathname.split('/products/')[1])),grids:[...document.querySelectorAll('#MainContent .product-grid')].filter(g=>g.getBoundingClientRect().width&&getComputedStyle(g).display!=='none').length,overflow:document.documentElement.scrollWidth>innerWidth+2}));
          async function test(name,fn){try{await fn();report.tests.push({name,pass:true});console.log('PASS '+name)}catch(e){report.tests.push({name,pass:false,error:e.message});console.error('FAIL '+name+' '+e.message);await page.screenshot({path:'proof/failure-'+report.tests.length+'.png'}).catch(()=>{});}}
          let products=[],blackExpected=[],multiExpected=[];
          function norm(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/\s+for\s+\d+\s*dogs?$/,'').replace(/(?:\s+(?:harness|leash|set\d*))+$/,'').replace(/^small\s+(black|white|blue)$/,'$1');}
          function has(p,wanted){const o=p.options.filter(o=>/colou?r|pattern|camo/i.test(o.name));if(o.some(o=>o.values.some(v=>norm(v)===wanted)))return true;if(!o.length){const tags=Array.isArray(p.tags)?p.tags:String(p.tags||'').split(',');return tags.some(t=>new RegExp('^(?:SQ Color/Pattern|color|colour|pattern|camouflage):\\s*'+wanted+'$','i').test(t.trim()))||p.options.some(o=>/^size$/i.test(o.name)&&o.values.some(v=>new RegExp('^'+wanted+'[ -]+(?:small|medium|large|s\\b|m\\b|l\\b|xl\\b)','i').test(v)));}return false;}
          const same=(actual,expected)=>assert.deepEqual([...actual].sort(),[...expected].sort());
          try{
            await page.goto(base+'?preview_theme_id=158561894555',{waitUntil:'domcontentloaded',timeout:90000});await ready(page);
            products=(await (await ctx.request.get(base+'/products.json?limit=250')).json()).products;
            blackExpected=products.filter(p=>has(p,'black')).map(p=>p.handle);multiExpected=products.filter(p=>has(p,'multicam')).map(p=>p.handle);
            await test('deployed draft and one color group',async()=>{const s=await state(page);assert.equal(s.theme,158561894555);assert.equal(s.labels.filter(x=>x==='Shop by Color / Pattern').length,1);assert.equal(s.grids,1);assert.ok(s.labels.includes('Shop by Category'));assert.ok(s.labels.includes('Shop by Type'));report.baseline=s;});
            await page.locator('[data-sq-k9-color-group]>summary').click();
            await test('real color choices exclude dimensions and SKU values',async()=>{const v=await page.locator('[data-sq-k9-color]').evaluateAll(a=>a.map(i=>i.value));assert.ok(v.includes('black'));assert.ok(v.includes('multicam'));assert.ok(!v.some(x=>/\d\s*(cm|inch)|^cv-|^size|^default title/.test(x)));report.choices=v;});
            await test('black returns all and only matching products',async()=>{await page.locator('[data-sq-k9-color][value="black"]').check();await ready(page);const s=await state(page);same(s.handles,blackExpected);assert.equal(Number(s.total),blackExpected.length);assert.equal(s.grids,1);report.black=s;await page.locator('.sq-refine-v3-layout').scrollIntoViewIfNeeded();await page.screenshot({path:'proof/k9-desktop-black.png'});});
            await test('multi-select is union, not duplicate product cards',async()=>{await page.locator('[data-sq-k9-color][value="multicam"]').check();await ready(page);const s=await state(page),expected=[...new Set([...blackExpected,...multiExpected])];assert.equal(Number(s.total),expected.length);same(s.handles,expected.slice(0,50));assert.equal(new Set(s.handles).size,s.handles.length);});
            await test('removing black leaves only MultiCam',async()=>{await page.locator('[data-sq-k9-color][value="black"]').uncheck();await ready(page);const s=await state(page);same(s.handles,multiExpected);same(s.chosen,['multicam']);report.multicam=s;});
            await test('reload preserves selection and matching products',async()=>{await page.reload({waitUntil:'domcontentloaded'});await ready(page);const s=await state(page);same(s.chosen,['multicam']);same(s.handles,multiExpected);await page.waitForTimeout(3000);same((await state(page)).handles,multiExpected);});
            await test('clear restores original collection',async()=>{await page.locator('[data-sq-k9-clear]').click();await ready(page);const s=await state(page);assert.equal(s.chosen.length,0);assert.equal(Number(s.total),products.length);assert.equal(s.handles.length,50);report.cleared=s;});
            await test('100 and 250 page sizes preserve complete nonduplicated results',async()=>{await page.locator('.sq-refine-v3-page-size input[value="100"]').check();await ready(page);assert.equal((await state(page)).handles.length,100);await page.locator('.sq-refine-v3-page-size input[value="250"]').check();await ready(page);same((await state(page)).handles,products.map(p=>p.handle));});
            await test('pagination has no overlap or duplicates',async()=>{await page.locator('.sq-refine-v3-page-size input[value="50"]').check();await ready(page);const a=(await state(page)).handles;await page.locator('[data-sq-k9-pager]').getByRole('link',{name:'Next',exact:true}).click();await ready(page);const b=(await state(page)).handles;assert.equal(b.length,50);assert.ok(!b.some(x=>a.includes(x)));});
            await test('color plus manufacturer stays scoped',async()=>{await page.locator('[data-sq-k9-color][value="black"]').check();await ready(page);const candidates=products.filter(p=>has(p,'black')),vendor=candidates.find(p=>p.vendor==='kiloninerpets')?.vendor||candidates[0].vendor;const group=page.locator('.sq-refine-v3-sidebar>details').filter({has:page.locator('summary',{hasText:'Shop by Manufacturers'})});await group.locator('summary').click();const input=group.locator('input').filter({visible:true});const target=group.locator('input[data-sq-polish-value='+JSON.stringify(vendor)+']');await target.check();await page.waitForLoadState('domcontentloaded');await ready(page);const s=await state(page);same(s.chosen,['black']);same(s.handles,candidates.filter(p=>p.vendor===vendor).map(p=>p.handle));report.vendor=s;});
            await test('K9 category preserves color refinement',async()=>{await page.goto(base+'?preview_theme_id=158561894555&sq_k9_color=black',{waitUntil:'domcontentloaded'});await ready(page);const cg=page.locator('.sq-refine-v3-sidebar>details').filter({has:page.locator('summary',{hasText:'Shop by Category'})});await cg.locator('summary').click();await cg.getByText('Harnesses, Vests & Protection',{exact:true}).click();await page.waitForLoadState('domcontentloaded');await ready(page);const s=await state(page);assert.ok(page.url().includes('sq_root=k9-dog-gear'));same(s.chosen,['black']);assert.ok(s.handles.length);assert.ok(s.handles.every(h=>blackExpected.includes(h)));report.category=s;});
          }catch(e){report.tests.push({name:'setup or uncaught error',pass:false,error:e.stack});}
          const mctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,recordVideo:{dir:'proof/video-mobile',size:{width:390,height:844}}});const mobile=await mctx.newPage();mobile.on('pageerror',e=>report.errors.push(e.message));
          await test('mobile color checkbox, layout and clearing',async()=>{await mobile.goto(base+'?preview_theme_id=158561894555',{waitUntil:'domcontentloaded',timeout:90000});await ready(mobile);await mobile.locator('[data-sq-k9-color-group]>summary').click();await mobile.locator('[data-sq-k9-color][value="multicam"]').check();await ready(mobile);const s=await state(mobile);same(s.handles,multiExpected);assert.equal(s.theme,158561894555);assert.equal(s.overflow,false);assert.equal(s.grids,1);report.mobile=s;await mobile.locator('[data-sq-k9-color-group]').scrollIntoViewIfNeeded();await mobile.screenshot({path:'proof/k9-mobile-multicam.png'});await mobile.locator('[data-sq-k9-clear]').click();await ready(mobile);assert.equal((await state(mobile)).chosen.length,0);});
          await test('no JavaScript runtime errors',async()=>{assert.deepEqual(report.errors,[])});
          await ctx.close();await mctx.close();await browser.close();
          fs.writeFileSync('proof/report.json',JSON.stringify(report,null,2));console.log('K9_RESULT '+JSON.stringify(report));
          if(report.tests.some(t=>!t.pass))process.exit(1);
          EOF
          node verify.mjs
      - name: Agent-browser Chromium snapshot
        if: always()
        run: |
          npx agent-browser open 'https://www.statesideqm.com/collections/k9-dog-gear?preview_theme_id=158561894555&sq_k9_color=multicam'
          npx agent-browser wait '[data-sq-k9-color-group]'
          npx agent-browser snapshot -i > proof/k9-after-snapshot.txt
          npx agent-browser screenshot proof/k9-agent-after.png
          npx agent-browser close
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k9-color-pattern-functional-proof
          path: proof
          retention-days: 7
