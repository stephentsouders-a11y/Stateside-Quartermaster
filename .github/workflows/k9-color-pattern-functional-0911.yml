name: K9 color pattern functional Chromium verification
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/k9-color-pattern-functional-0911.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null
          npm install playwright@1.55.0 agent-browser @shopify/liquid-html-parser >/dev/null
          npx playwright install chromium >/dev/null
          npx agent-browser install >/dev/null
      - name: Validate Liquid and JavaScript
        run: |
          mkdir -p proof
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),{toLiquidHtmlAST}=require('@shopify/liquid-html-parser');
          const files=['snippets/sq-refine-v3-k9-color-pattern.liquid','snippets/sq-refine-v3-sidebar-polish.liquid'];
          for(const f of files){const s=fs.readFileSync(f,'utf8');toLiquidHtmlAST(s);for(const m of s.matchAll(/<script(?![^>]*application\/json)[^>]*>([\s\S]*?)<\/script>/g)){new vm.Script(m[1]);}console.log('PASS '+f)}
          fs.writeFileSync('proof/syntax-validation.json',JSON.stringify({pass:true,files,commit:process.env.GITHUB_SHA},null,2));
          NODE
      - name: Functional desktop and mobile Chromium tests
        run: |
          cat > verify.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base='https://www.statesideqm.com/collections/k9-dog-gear',preview='preview_theme_id=158561894555';
          const browser=await chromium.launch({headless:true});
          const report={testedAt:new Date().toISOString(),testCommit:process.env.GITHUB_SHA,theme:158561894555,tests:[],errors:[]};
          const ctx=await browser.newContext({viewport:{width:1440,height:1000},recordVideo:{dir:'proof/video',size:{width:1440,height:1000}}});
          const page=await ctx.newPage();page.setDefaultTimeout(25000);page.on('pageerror',e=>report.errors.push(e.message));
          const ready=async p=>{await p.waitForFunction(()=>{const d=document.querySelector('#MainContent')?.dataset;return d?.sqK9ColorReady==='true'||d?.sqK9ColorError},null,{timeout:60000});assert.ok(!await p.locator('#MainContent').getAttribute('data-sq-k9-color-error'));assert.equal(await p.evaluate(()=>Shopify.theme.id),158561894555)};
          const state=async p=>p.evaluate(()=>{const rect=e=>{const b=e.getBoundingClientRect();return{x:b.x,y:b.y,width:b.width,height:b.height,right:b.right}},vis=e=>e.checkVisibility({checkVisibilityCSS:true,checkOpacity:true}),grid=document.querySelector('[data-sq-k9-grid]');return{url:location.href,theme:Shopify.theme.id,main:{...document.querySelector('#MainContent')?.dataset},core:!!window.__sqRefineV3,loaded:!!window.__sqK9ColorPattern,scriptCount:document.querySelectorAll('script[data-sq-k9-color-pattern]').length,labels:[...document.querySelectorAll('.sq-refine-v3-sidebar>details>summary')].map(x=>x.textContent.trim()),chosen:[...document.querySelectorAll('[data-sq-k9-color]:checked')].map(i=>i.value),total:document.querySelector('#MainContent')?.dataset.sqK9ColorTotal,handles:[...grid?.querySelectorAll(':scope>.product-grid__item')||[]].map(c=>{const a=c.querySelector('a[href*="/products/"]');return a?decodeURIComponent(new URL(a.href).pathname.split('/products/')[1]):''}),grids:[...document.querySelectorAll('#MainContent .product-grid')].map(g=>({class:g.className,visible:vis(g),...rect(g),cards:g.querySelectorAll(':scope>.product-grid__item').length})),geometry:{side:document.querySelector('.sq-refine-v3-sidebar')?rect(document.querySelector('.sq-refine-v3-sidebar')):null,grid:grid?rect(grid):null,cards:[...grid?.querySelectorAll(':scope>.product-grid__item')||[]].slice(0,6).map(rect)},overflow:document.documentElement.scrollWidth>innerWidth+2}});
          const save=async(p,name)=>{fs.writeFileSync('proof/'+name+'.json',JSON.stringify(await state(p),null,2));await p.screenshot({path:'proof/'+name+'.png'});};
          async function test(name,fn,p=page){try{await fn();report.tests.push({name,pass:true});console.log('PASS '+name)}catch(e){report.tests.push({name,pass:false,error:e.message});console.error('FAIL '+name+' '+e.message);await save(p,'failure-'+report.tests.length).catch(()=>{});}}
          const same=(actual,expected)=>assert.deepEqual([...actual].sort(),[...expected].sort());
          const oneGrid=s=>assert.equal(s.grids.filter(g=>g.visible).length,1);
          function norm(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/\s+for\s+\d+\s*dogs?$/,'').replace(/(?:\s+(?:harness|leash|set\d*))+$/,'').replace(/^small\s*(black|white|blue)$/,'$1');}
          function has(p,wanted){const o=p.options.filter(o=>/colou?r|pattern|camo/i.test(o.name));if(o.some(o=>o.values.some(v=>norm(v)===wanted)))return true;if(!o.length){const tags=Array.isArray(p.tags)?p.tags:String(p.tags||'').split(',');return tags.some(t=>new RegExp('^(?:SQ Color/Pattern|color|colour|pattern|camouflage):\\s*'+wanted+'$','i').test(t.trim()))||p.options.some(o=>/^size$/i.test(o.name)&&o.values.some(v=>new RegExp('^'+wanted+'[ -]+(?:small|medium|large|s\\b|m\\b|l\\b|xl\\b)','i').test(v)));}return false;}
          async function catalog(context,path){const out=[];for(let n=1;n<=20;n++){const r=await context.request.get(path+'/products.json?limit=250&page='+n);assert.equal(r.status(),200);const p=(await r.json()).products;out.push(...p);if(p.length<250)return out;}throw Error('Catalog pagination limit');}
          async function goto(p,url){const r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:90000});assert.equal(r.status(),200);await ready(p);}
          async function capture(p,name){await p.locator('[data-sq-k9-color-group]').scrollIntoViewIfNeeded();await save(p,name);}
          let products=[],blackExpected=[],multiExpected=[];
          try{
            await goto(page,base+'?'+preview);products=await catalog(ctx,base);blackExpected=products.filter(p=>has(p,'black')).map(p=>p.handle);multiExpected=products.filter(p=>has(p,'multicam')).map(p=>p.handle);
            await test('cold desktop: one color group and one visible grid',async()=>{const s=await state(page);assert.equal(s.labels.filter(x=>x==='Shop by Color / Pattern').length,1);oneGrid(s);assert.ok(s.labels.includes('Shop by Category'));assert.ok(s.labels.includes('Shop by Type'));report.baseline=s;});
            await page.locator('[data-sq-k9-color-group]>summary').click();
            await test('actual colors and patterns, not dimensions or SKU labels',async()=>{const v=await page.locator('[data-sq-k9-color]').evaluateAll(a=>a.map(i=>i.value));assert.ok(v.includes('black'));assert.ok(v.includes('multicam'));assert.ok(!v.some(x=>/\d\s*(cm|inch)|^cv-|^size|^default title/.test(x)));report.choices=v;});
            await test('Black exact product matches and bounded desktop cards',async()=>{await page.locator('[data-sq-k9-color][value="black"]').check();await ready(page);const s=await state(page);same(s.handles,blackExpected);assert.equal(Number(s.total),blackExpected.length);oneGrid(s);const g=s.geometry.grid;assert.ok(s.geometry.cards.every(c=>c.x>=g.x-2&&c.right<=g.right+2));assert.ok(g.x>=s.geometry.side.right);const y=s.geometry.cards[0].y;assert.equal(s.geometry.cards.filter(c=>Math.abs(c.y-y)<3).length,3);report.black=s;await capture(page,'k9-desktop-black');});
            await test('multiple colors return OR union without duplicates',async()=>{await page.locator('[data-sq-k9-color][value="multicam"]').check();await ready(page);const s=await state(page),expected=[...new Set([...blackExpected,...multiExpected])];assert.equal(Number(s.total),expected.length);same(s.handles,expected);assert.equal(new Set(s.handles).size,s.handles.length);});
            await test('unchecking Black leaves only MultiCam',async()=>{await page.locator('[data-sq-k9-color][value="black"]').uncheck();await ready(page);const s=await state(page);same(s.handles,multiExpected);same(s.chosen,['multicam']);report.multicam=s;});
            await test('reload retains selected color and stable results',async()=>{await page.reload({waitUntil:'domcontentloaded'});await ready(page);same((await state(page)).handles,multiExpected);await page.waitForTimeout(3000);const s=await state(page);same(s.chosen,['multicam']);same(s.handles,multiExpected);oneGrid(s);});
            await test('clearing restores the original collection',async()=>{await page.locator('[data-sq-k9-clear]').click();await ready(page);const s=await state(page);assert.equal(s.chosen.length,0);assert.equal(Number(s.total),products.length);assert.equal(s.handles.length,50);report.cleared=s;});
            await test('100 and 250 controls retain all unique products',async()=>{await page.locator('.sq-refine-v3-page-size input[value="100"]').check();await ready(page);assert.equal((await state(page)).handles.length,100);await page.locator('.sq-refine-v3-page-size input[value="250"]').check();await ready(page);same((await state(page)).handles,products.map(p=>p.handle));});
            await test('pagination has no overlapping products',async()=>{await page.locator('.sq-refine-v3-page-size input[value="50"]').check();await ready(page);const a=(await state(page)).handles;await page.locator('[data-sq-k9-pager]').getByRole('link',{name:'Next',exact:true}).click();await ready(page);const b=(await state(page)).handles;assert.equal(b.length,50);assert.ok(!b.some(x=>a.includes(x)));});
            await test('Black combined with manufacturer matches exactly',async()=>{await page.locator('[data-sq-k9-color][value="black"]').check();await ready(page);const candidates=products.filter(p=>has(p,'black')),vendor=candidates.find(p=>p.vendor==='kiloninerpets')?.vendor||candidates[0].vendor;const g=page.locator('.sq-refine-v3-sidebar>details').filter({has:page.locator('summary',{hasText:'Shop by Manufacturers'})});await g.locator('summary').click();await Promise.all([page.waitForURL(u=>u.searchParams.get('filter.p.vendor')===vendor),g.locator('input[data-sq-polish-value='+JSON.stringify(vendor)+']').check()]);await ready(page);const s=await state(page);same(s.chosen,['black']);same(s.handles,candidates.filter(p=>p.vendor===vendor).map(p=>p.handle));oneGrid(s);report.vendor=s;});
            await test('child category retains color and matches its own catalog',async()=>{await goto(page,base+'?'+preview+'&sq_k9_color=black');const g=page.locator('.sq-refine-v3-sidebar>details').filter({has:page.locator('summary',{hasText:'Shop by Category'})});await g.locator('summary').click();await Promise.all([page.waitForURL(u=>!u.pathname.endsWith('/k9-dog-gear')),g.getByText('Harnesses, Vests & Protection',{exact:true}).click()]);await ready(page);const s=await state(page);assert.ok(page.url().includes('sq_root=k9-dog-gear'));same(s.chosen,['black']);const child=await catalog(ctx,new URL(page.url()).origin+new URL(page.url()).pathname);same(s.handles,child.filter(p=>has(p,'black')).map(p=>p.handle));oneGrid(s);assert.ok(await page.locator('[data-sq-k9-color-group]').isVisible());report.category=s;await capture(page,'k9-child-black');});
          }catch(e){report.tests.push({name:'setup or uncaught error',pass:false,error:e.stack});await save(page,'setup-failure').catch(()=>{});}
          const mctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,recordVideo:{dir:'proof/video-mobile',size:{width:390,height:844}}});const mobile=await mctx.newPage();mobile.setDefaultTimeout(25000);mobile.on('pageerror',e=>report.errors.push(e.message));
          await test('fresh mobile: filter, two columns, no overflow, clear and back',async()=>{await goto(mobile,base+'?'+preview);await mobile.locator('[data-sq-k9-color-group]>summary').click();await mobile.locator('[data-sq-k9-color][value="multicam"]').check();await ready(mobile);const s=await state(mobile);same(s.handles,multiExpected);assert.equal(s.overflow,false);oneGrid(s);const y=s.geometry.cards[0].y;assert.equal(s.geometry.cards.filter(c=>Math.abs(c.y-y)<3).length,2);report.mobile=s;await capture(mobile,'k9-mobile-multicam');await mobile.locator('[data-sq-k9-clear]').click();await ready(mobile);assert.equal((await state(mobile)).chosen.length,0);await mobile.goBack();await ready(mobile);same((await state(mobile)).handles,multiExpected);},mobile);
          await test('no JavaScript runtime errors',async()=>assert.deepEqual(report.errors,[]));
          await ctx.close();await mctx.close();await browser.close();fs.writeFileSync('proof/report.json',JSON.stringify(report,null,2));console.log('K9_RESULT '+JSON.stringify(report));if(report.tests.some(t=>!t.pass))process.exit(1);
          EOF
          node verify.mjs
      - name: Agent-browser Chromium snapshot
        if: always()
        run: |
          npx agent-browser open 'https://www.statesideqm.com/collections/k9-dog-gear?preview_theme_id=158561894555&sq_k9_color=multicam'
          npx agent-browser wait '[data-sq-k9-color-group]'
          npx agent-browser snapshot -i > proof/k9-after-snapshot.txt
          npx agent-browser screenshot proof/k9-agent-after.png
          npx agent-browser close
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k9-color-pattern-functional-proof
          path: proof
          retention-days: 7
