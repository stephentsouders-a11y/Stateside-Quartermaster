name: Storefront Chromium click-video audit
on:
  push:
    paths:
      - '.github/workflows/storefront-click-video-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm init -y
          npm install playwright@1.55.0 fast-xml-parser@4.5.0
          npx playwright install --with-deps chromium
      - name: Run live storefront click audit with video
        env:
          BASE: https://www.statesideqm.com
        run: |
          cat > click-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { XMLParser } from 'fast-xml-parser';
          import fs from 'fs';
          import crypto from 'crypto';
          const BASE=process.env.BASE;
          const parser=new XMLParser({ignoreAttributes:false});
          const OUT='out'; fs.mkdirSync(`${OUT}/videos`,{recursive:true}); fs.mkdirSync(`${OUT}/screens`,{recursive:true});
          const sha=s=>crypto.createHash('sha1').update(s).digest('hex').slice(0,12);
          const norm=raw=>{try{const u=new URL(raw,BASE); if(u.origin!==new URL(BASE).origin)return null; if(!u.pathname.startsWith('/collections/')&&u.pathname!=='/')return null; ['page','sort_by'].forEach(k=>u.searchParams.delete(k)); u.hash=''; return u.pathname+(u.search?u.search:'')}catch{return null}};
          async function getSeeds(){const seeds=new Set(['/']); try{const x=parser.parse(await (await fetch(`${BASE}/sitemap.xml`)).text()); let maps=x?.sitemapindex?.sitemap||[]; if(!Array.isArray(maps))maps=[maps]; for(const m of maps){if(!/sitemap_collections/i.test(m.loc||''))continue; const sx=parser.parse(await (await fetch(m.loc)).text()); let urls=sx?.urlset?.url||[]; if(!Array.isArray(urls))urls=[urls]; for(const r of urls){const n=norm(r.loc); if(n)seeds.add(n)}}}catch{} return [...seeds]}
          const browser=await chromium.launch({headless:true});
          const queue=await getSeeds(), seen=new Set(), results=[]; let qi=0;
          while(qi<queue.length && seen.size<1400){
            const path=queue[qi++]; if(seen.has(path))continue; seen.add(path);
            const ctx=await browser.newContext({viewport:{width:1365,height:768},recordVideo:{dir:`${OUT}/videos`,size:{width:960,height:540}}});
            const page=await ctx.newPage(); page.setDefaultTimeout(15000); page.setDefaultNavigationTimeout(30000);
            const rec={path,buttons:[],errors:[]};
            page.on('pageerror',e=>rec.errors.push(`pageerror:${e.message}`));
            page.on('console',m=>{if(m.type()==='error')rec.errors.push(`console:${m.text()}`)});
            try{
              const res=await page.goto(new URL(path,BASE).toString(),{waitUntil:'domcontentloaded'}); rec.status=res?.status()??null;
              await page.waitForTimeout(800);
              rec.pageTitle=(await page.title()).trim();
              rec.h1=await page.locator('h1').first().textContent().catch(()=>null);
              rec.spinner=await page.locator('text=/loading items|building the customer-facing product tree|checking items|organizing .* products/i').count().catch(()=>0);
              rec.sidebarCount=await page.locator('#MainContent .sq-global-refine-sidebar:visible').count().catch(()=>0);
              rec.brokenImages=await page.locator('#MainContent img').evaluateAll(imgs=>imgs.filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.alt||i.src).slice(0,20)).catch(()=>[]);
              rec.overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+4).catch(()=>false);
              rec.textLinkInsideSidebar=await page.locator('#MainContent .sq-global-refine-sidebar a:visible').evaluateAll(as=>as.filter(a=>{const r=a.getBoundingClientRect(); const p=a.parentElement?.getBoundingClientRect(); return p&&r.width>0&&r.height>0&&r.width>p.width*.85}).map(a=>({text:(a.textContent||'').trim(),href:a.getAttribute('href')})).slice(0,50)).catch(()=>[]);
              const items=await page.locator('#MainContent a:visible').evaluateAll(as=>as.map((a,i)=>({i,text:(a.textContent||'').replace(/\s+/g,' ').trim().slice(0,180),href:a.href,cls:a.className||'',role:a.getAttribute('role')||'',aria:a.getAttribute('aria-label')||''})).filter(x=>x.href&&(/button|card|pagination|next|previous|sq-|sg-|refine/i.test(`${x.cls} ${x.role} ${x.aria} ${x.text}`)||x.href.includes('/collections/'))).slice(0,450));
              for(const item of items){
                const dest=norm(item.href); if(dest&&!seen.has(dest)&&!queue.includes(dest))queue.push(dest);
                const before=page.url(); let outcome='PASS', after=null, err=null;
                try{
                  const loc=page.locator('#MainContent a:visible').filter({hasText:item.text}).first();
                  if(await loc.count()){await loc.scrollIntoViewIfNeeded(); await loc.click({timeout:8000}); await page.waitForTimeout(500); after=page.url(); const title=await page.title(); const body=(await page.locator('body').innerText().catch(()=>'' )).slice(0,5000); if(/something went wrong|internal server error|there was a problem|404 not found/i.test(title+' '+body))outcome='FAIL_ERROR_PAGE'; if(after===before&&item.href!==before&&item.href!==before+'#')outcome='FAIL_NO_NAV'; if(page.url()!==before){await page.goBack({waitUntil:'domcontentloaded'}).catch(()=>page.goto(before,{waitUntil:'domcontentloaded'})); await page.waitForTimeout(250)}} else outcome='FAIL_NOT_FOUND';
                }catch(e){outcome='FAIL_EXCEPTION'; err=String(e); await page.goto(before,{waitUntil:'domcontentloaded'}).catch(()=>{})}
                rec.buttons.push({label:item.text||item.aria||'(unlabeled)',href:item.href,outcome,after,error:err});
              }
              await page.screenshot({path:`${OUT}/screens/${String(seen.size).padStart(4,'0')}-${sha(path)}.png`,fullPage:true}).catch(()=>{});
            }catch(e){rec.errors.push(`fatal:${String(e)}`)}
            const v=page.video(); await ctx.close(); if(v){try{const old=await v.path(); fs.renameSync(old,`${OUT}/videos/${String(seen.size).padStart(4,'0')}-${sha(path)}.webm`)}catch{}}
            rec.failedButtons=rec.buttons.filter(b=>b.outcome!=='PASS').length;
            rec.fail=rec.status!==200||!rec.pageTitle||rec.spinner>0||rec.brokenImages.length>0||rec.overflow||rec.failedButtons>0||rec.errors.length>0;
            results.push(rec); fs.writeFileSync(`${OUT}/progress.json`,JSON.stringify(results,null,2));
          }
          await browser.close();
          const summary={auditedRoutes:results.length,discoveredRoutes:queue.length,totalButtons:results.reduce((n,r)=>n+r.buttons.length,0),failedRoutes:results.filter(r=>r.fail).length,failedButtons:results.reduce((n,r)=>n+r.failedButtons,0),missingH1:results.filter(r=>!(r.h1||'').trim()).map(r=>r.path),duplicateSidebars:results.filter(r=>r.sidebarCount>1).map(r=>r.path),spinnerRoutes:results.filter(r=>r.spinner>0).map(r=>r.path),brokenImageRoutes:results.filter(r=>r.brokenImages.length>0).map(r=>r.path)};
          fs.writeFileSync(`${OUT}/summary.json`,JSON.stringify(summary,null,2)); fs.writeFileSync(`${OUT}/results.json`,JSON.stringify(results,null,2)); console.log(JSON.stringify(summary,null,2)); if(summary.failedRoutes||summary.failedButtons)process.exitCode=2;
          EOF
          node click-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-click-video-audit
          path: out
          retention-days: 7
