name: CASE 0109 BrowserAct public extraction test

on:
  push:
    branches:
      - research/browseract-case0109
  workflow_dispatch:

jobs:
  test-browseract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BrowserAct CLI
        run: |
          python -m pip install --upgrade pip uv
          uv tool install browser-act-cli --python 3.12
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Load advanced instructions
        run: |
          mkdir -p browseract_test
          export PATH="$HOME/.local/bin:$PATH"
          browser-act get-skills advanced | tee browseract_test/advanced_skill.txt
      - name: Test public stealth extraction
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          set +e
          browser-act stealth-extract 'https://dpaa-mil.sites.crmforce.mil/dpaaProfile?id=a0Jt0000000KYjOEAW' --content-type markdown > browseract_test/dpaa_stdout.txt 2> browseract_test/dpaa_stderr.txt
          echo $? > browseract_test/dpaa_exit.txt
          browser-act stealth-extract 'https://projectdelta-b52.com/' --content-type markdown > browseract_test/projectdelta_stdout.txt 2> browseract_test/projectdelta_stderr.txt
          echo $? > browseract_test/projectdelta_exit.txt
          browser-act stealth-extract 'https://historicexplorations.com/american-history/sergeant-first-class-fred-taylor/' --content-type markdown > browseract_test/historic_stdout.txt 2> browseract_test/historic_stderr.txt
          echo $? > browseract_test/historic_exit.txt
          printf '\nDPAA exit: '; cat browseract_test/dpaa_exit.txt
          printf 'Project Delta exit: '; cat browseract_test/projectdelta_exit.txt
          printf 'Historic Explorations exit: '; cat browseract_test/historic_exit.txt
          echo '--- DPAA stderr ---'; cat browseract_test/dpaa_stderr.txt
          echo '--- Project Delta stderr ---'; cat browseract_test/projectdelta_stderr.txt
          echo '--- Historic stderr ---'; cat browseract_test/historic_stderr.txt
          set -e
      - name: Upload BrowserAct diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case0109-browseract-public-extract-test
          path: browseract_test/
          retention-days: 7
