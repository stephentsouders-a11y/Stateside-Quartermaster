name: Refine V3 Shopify Post-Deploy Chromium Certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-shopify-postdeploy-cert.yml'
      - 'snippets/sq-refine-v3-single-grid-guard.liquid'
      - 'snippets/sq-refine-v3-footwear-color-pattern.liquid'
      - 'snippets/sq-refine-v3-sidebar-header-edge-fix.liquid'
      - 'snippets/sq-refine-v3-pagination-repair.liquid'
      - 'snippets/sq-refine-v3.liquid'
      - 'layout/theme.liquid'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Record and certify deployed Shopify draft theme
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cat > postdeploy.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const shard=Number(process.env.SHARD||0);
          const out=`out/shard-${shard}`;
          fs.mkdirSync(`${out}/videos`,{recursive:true});
          fs.mkdirSync(`${out}/screenshots`,{recursive:true});
          const theme='158561894555';
          const base='https://www.statesideqm.com/collections/';
          const allRoots=['accessories-gifts-collectibles','airsoft-milsim','apparel','armed-forces-gear','art','body-armor-ballistic-protection','literature','child-safety-shop','dive-scuba','firearm-accessories','first-aid-medical-ifak','flags-patriotic-decor','flashlights-lighting','footwear-gloves-eyewear','k9-dog-gear','knives-axes-cutlery','morale-patches-tactical-id','outdoor-preparedness-gear','patriotic-american-heritage','safety-rescue-climbing','sta-brite-insignia','tactical-gear','thin-line','uniforms','watches','zippos-lighters-torches','stateside-quartermaster-logo-merch','army-national-guard-series','air-national-guard-series','products-built-for-the-line-u-s-army','products-built-for-the-line-u-s-navy','products-built-for-the-line-u-s-air-force','products-built-for-the-line-u-s-marine-corps','products-built-for-the-line-u-s-coast-guard','products-built-for-the-line-u-s-space-force','rotc-series','jrotc-series','military-schools-academies','law-enforcement-corrections','firefighting-ems-search-rescue'];
          const roots=allRoots.filter((_,i)=>i%4===shard);
          const report={theme,shard,checkedAt:new Date().toISOString(),routes:[],failures:[]};
          const browser=await chromium.launch({headless:true});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const benign=(text,url='')=>text.includes("Refused to frame 'https://shop.app/'")||(text.includes('Failed to load resource')&&/shop\.app|monorail|analytics|shopifycloud/i.test(url));
          async function gotoStable(page,url){
            let last;
            for(let attempt=1;attempt<=6;attempt++){
              try{
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
                if(response&&response.status()===429) throw new Error('HTTP 429');
                await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:45000});
                await page.waitForTimeout(1800);
                return;
              }catch(e){last=e;await sleep(Math.min(15000,2500*attempt));}
            }
            throw last;
          }
          async function inspect(page){
            return page.evaluate(()=>{
              const main=document.querySelector('#MainContent');
              const visible=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0};
              const sidebars=[...(main?.querySelectorAll('.sq-refine-v3-sidebar')||[])].filter(visible);
              const results=[...(main?.querySelectorAll('.sq-refine-v3-results')||[])].filter(visible);
              const grids=[...(main?.querySelectorAll('.product-grid')||[])].filter(visible);
              const cards=[...(results[0]?.querySelectorAll('.product-grid > *')||[])].filter(visible);
              const summaries=[...(sidebars[0]?.querySelectorAll(':scope > details > summary')||[])].map(s=>s.textContent.replace(/\s+/g,' ').trim());
              const controls=[...(sidebars[0]?.querySelectorAll('input[type="checkbox"],input[type="radio"]')||[])].map((el,index)=>({index,label:(el.labels?.[0]?.textContent||el.closest('label')?.textContent||'').replace(/\s+/g,' ').trim(),kind:el.dataset.kind||'',target:el.dataset.target||'',visible:visible(el)}));
              return {ready:main?.dataset.sqRefineV3Ready||null,singleGridMarker:main?.dataset.sqRefineV3SingleGridCertified||null,paginationError:main?.dataset.sqRefineV3PaginationRepairError||null,footwearReady:main?.dataset.sqFootwearColorReady||null,footwearError:main?.dataset.sqFootwearColorError||null,visibleSidebars:sidebars.length,visibleResults:results.length,visibleGrids:grids.length,products:cards.length,summaries,controls,nextHref:results[0]?.querySelector('.sq-refine-v3-pager a[href*="sq_view_page=2"]')?.href||null,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth};
            });
          }
          async function activateControl(page,index){
            const ctl=page.locator('.sq-refine-v3-sidebar input[type="checkbox"],.sq-refine-v3-sidebar input[type="radio"]').nth(index);
            const meta=await ctl.evaluate(el=>({kind:el.dataset.kind||'',target:el.dataset.target||'',label:(el.labels?.[0]?.textContent||el.closest('label')?.textContent||'').replace(/\s+/g,' ').trim(),hasLabel:!!el.closest('label')}));
            if(meta.kind==='structural'&&meta.target){
              const target=new URL(meta.target,location.origin);
              target.searchParams.set('preview_theme_id','158561894555');
              await gotoStable(page,target.href);
              return {...meta,mode:'structural-route'};
            }
            const before=page.url();
            if(meta.hasLabel) await ctl.evaluate(el=>el.closest('label').click());
            else await ctl.check({force:true});
            await page.waitForTimeout(1100);
            return {...meta,mode:'filter',before,checked:await ctl.isChecked().catch(()=>false)};
          }
          async function certifyViewport(handle,viewportName,viewport){
            const context=await browser.newContext({viewport,recordVideo:{dir:`${out}/videos`,size:viewportName==='mobile'?{width:390,height:844}:{width:1280,height:720}}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(`pageerror: ${String(e)}`));
            page.on('console',m=>{if(m.type()==='error'){const t=m.text(),u=m.location()?.url||'';if(!benign(t,u)&&!/^Failed to load resource: the server responded with a status of 429/.test(t))errors.push(`console: ${t}${u?` @ ${u}`:''}`)}});
            const url=new URL(`${base}${handle}`);url.searchParams.set('preview_theme_id',theme);url.searchParams.set('sq_per_page','50');url.searchParams.set('sq_view_page','1');
            const row={handle,viewport:viewportName,startUrl:url.href,checks:[],errors};report.routes.push(row);
            const fail=m=>report.failures.push(`${handle} [${viewportName}]: ${m}`);
            try{
              await gotoStable(page,url.href);
              if(handle==='footwear-gloves-eyewear') await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqFootwearColorReady==='true'||[...document.querySelectorAll('.sq-refine-v3-sidebar summary')].some(s=>/Shop by Color \/ Pattern/i.test(s.textContent)),{timeout:30000}).catch(()=>{});
              let audit=await inspect(page);row.initial=audit;
              if(audit.ready!=='true')fail(`V3 not ready (${audit.ready})`);
              if(audit.visibleSidebars!==1)fail(`expected exactly one visible Refine sidebar, got ${audit.visibleSidebars}`);
              if(audit.visibleResults!==1)fail(`expected exactly one results region, got ${audit.visibleResults}`);
              if(audit.visibleGrids!==1)fail(`expected exactly one visible product grid, got ${audit.visibleGrids}`);
              if(audit.products<1)fail('no visible products');
              if(audit.singleGridMarker!=='true')fail(`single-grid guard did not certify (${audit.singleGridMarker})`);
              if(audit.paginationError)fail(`pagination repair error: ${audit.paginationError}`);
              if(audit.overflow)fail(`horizontal overflow detected (${audit.scrollWidth}px > ${audit.clientWidth}px)`);
              if(handle==='footwear-gloves-eyewear'&&!audit.summaries.some(x=>/^Shop by Color \/ Pattern$/i.test(x)))fail(`Shop by Color / Pattern missing; groups=${audit.summaries.join(' | ')}`);
              if(handle==='armed-forces-gear'){
                const got=audit.summaries.map(x=>x.toLowerCase().replace(/^shop by\s+/,''));
                const allowed=['branch','availability','type'];
                if(got.length!==3||!allowed.every(x=>got.includes(x)))fail(`AFG filter policy wrong: ${audit.summaries.join(' | ')}`);
              }
              for(let i=0;i<audit.controls.length;i++){
                await sleep(500);
                await gotoStable(page,url.href);
                const meta=await activateControl(page,i);
                const after=await inspect(page);
                row.checks.push({kind:'control',index:i,label:meta.label,mode:meta.mode,target:meta.target||null,products:after.products,url:page.url()});
                if(after.products<1)fail(`control produced zero products: ${meta.label}`);
                if(after.visibleSidebars!==1)fail(`control ${meta.label} produced ${after.visibleSidebars} visible sidebars`);
                if(after.visibleGrids!==1)fail(`control ${meta.label} produced ${after.visibleGrids} visible grids`);
                if(meta.mode==='filter'&&page.url()===meta.before&&!meta.checked)fail(`control did not change state: ${meta.label}`);
              }
              await gotoStable(page,url.href);audit=await inspect(page);
              if(audit.nextHref){
                const first=await page.locator('.sq-refine-v3-results a[href*="/products/"]').evaluateAll(as=>[...new Set(as.map(a=>new URL(a.href).pathname))]);
                await gotoStable(page,audit.nextHref);
                const second=await page.locator('.sq-refine-v3-results a[href*="/products/"]').evaluateAll(as=>[...new Set(as.map(a=>new URL(a.href).pathname))]);
                row.pagination={nextHref:audit.nextHref,firstCount:first.length,secondCount:second.length,overlap:first.filter(x=>second.includes(x)).length};
                if(second.length<1)fail('Next page returned no products');
                if(first.length&&second.length&&first.every(x=>second.includes(x)))fail('Next page duplicated the entire first page');
              }
              await page.screenshot({path:`${out}/screenshots/${handle}-${viewportName}.png`,fullPage:true});
            }catch(e){row.exception=String(e?.stack||e);fail(`HARNESS_EXCEPTION: ${String(e)}`);await page.screenshot({path:`${out}/screenshots/${handle}-${viewportName}-exception.png`,fullPage:true}).catch(()=>{});}
            if(errors.length)fail(`${errors.length} browser error(s): ${errors.join(' || ')}`);
            await page.close();await context.close();await sleep(2500);
          }
          for(const handle of roots){await certifyViewport(handle,'desktop',{width:1440,height:1000});await certifyViewport(handle,'mobile',{width:390,height:844});}
          await browser.close();fs.writeFileSync(`${out}/postdeploy-report.json`,JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));if(report.failures.length)process.exitCode=2;
          EOF
          node postdeploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-shopify-postdeploy-cert-shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}
          retention-days: 14
