name: Sep18 State Guard lazy image retest
on:
  push:
    paths:
      - '.github/workflows/sep18-sg-lazy-retest.yml'
      - '.github/scripts/sep18-sg-lazy-retest.mjs'
permissions: { contents: read }
jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { key: ohio, label: "Ohio State Guard", route: "/collections/state-guard-series-ohio" }
          - { key: south-carolina, label: "South Carolina State Guard", route: "/collections/state-guard-series-south-carolina" }
          - { key: oregon, label: "Oregon Civil Defense Force", route: "/collections/state-guard-series-oregon" }
          - { key: indiana, label: "Indiana Guard Reserve", route: "/collections/state-guard-series-indiana" }
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KEY: ${{ matrix.key }}
      LABEL: ${{ matrix.label }}
      ROUTE: ${{ matrix.route }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/scripts/sep18-sg-lazy-retest.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep18-sg-lazy-retest-${{ matrix.key }}-${{ github.run_id }}
          path: sep18-sg-lazy-retest-${{ matrix.key }}/
          retention-days: 14
