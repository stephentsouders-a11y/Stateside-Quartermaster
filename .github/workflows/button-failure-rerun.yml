name: Button failure isolated reruns
on:
  push:
    paths:
      - '.github/workflows/button-failure-rerun.yml'
permissions:
  contents: read
jobs:
  retest:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { key: marine, route: '/collections/products-built-for-the-line-u-s-marine-corps' }
          - { key: af-yellow-gold, route: '/collections/products-built-for-the-line-u-s-air-force?sq_color_pattern=Yellow+%2F+Gold' }
          - { key: ang-foreverwave, route: '/collections/air-national-guard-series?filter.p.vendor=ForeverWaveFlags' }
          - { key: ang-sq-ltd, route: '/collections/air-national-guard-series?filter.p.vendor=Stateside+Quartermaster%2C+Ltd.' }
          - { key: ang-flint-gray, route: '/collections/air-national-guard-series?sq_color_pattern=Flint+Gray' }
          - { key: ang-neon-pink, route: '/collections/air-national-guard-series?sq_color_pattern=Neon+Pink' }
          - { key: ang-true-red, route: '/collections/air-national-guard-series?sq_color_pattern=True+Red' }
          - { key: ang-uniforms, route: '/collections/air-national-guard-series?sq_bfl_category=Uniforms+%26+Uniform+Accessories' }
          - { key: ang-books, route: '/collections/air-national-guard-series?sq_bfl_category=Books%2C+Manuals+%26+Reference' }
          - { key: afg-coast-guard, route: '/collections/armed-forces-gear-u-s-coast-guard' }
          - { key: fire-vest-guy, route: '/collections/firefighting-ems-search-rescue?sq_maker=The+Vest+Guy' }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Retest exact route
        env:
          ROUTE: ${{ matrix.route }}
          KEY: ${{ matrix.key }}
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright'; import fs from 'fs'; fs.mkdirSync('out',{recursive:true});
          const route=process.env.ROUTE,key=process.env.KEY,base='https://www.statesideqm.com',theme='158561894555';
          const browser=await chromium.launch({headless:true}); let result=null;
          for(let attempt=1;attempt<=2;attempt++){
            const ctx=await browser.newContext({viewport:{width:1440,height:1100}}), page=await ctx.newPage(); const u=new URL(route,base);u.searchParams.delete('filter.v.availability');u.searchParams.set('preview_theme_id',theme); const start=Date.now();let status=null,error=null;
            try{const r=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:30000});status=r?.status()??null}catch(e){error=String(e)}
            let usable=null,state=null;
            if(status===200&&!error){for(let i=0;i<35;i++){state=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),t=(m?.innerText||'').replace(/\s+/g,' ').trim(),title=document.title;const visible=[...(m?.querySelectorAll('a,.product-card,.product-grid__item,.sqbfl-card,.sq-subcategory-card,.sg-entity,.sq-afg-branch-card,.sq-ts-match-card,.sq-type-family-product,.sqaca-card,.sqaca-all')||[])].some(e=>{const r=e.getBoundingClientRect();return r.width>30&&r.height>20});return{title,text:t.slice(0,500),bad:/just a moment|something went wrong|internal server error|there was a problem/i.test(title+' '+t),loading:/loading items|checking items|tree unavailable|building the customer-facing product tree|loading all products/i.test(t),visible,availability:[...(m?.querySelectorAll('a[href*="filter.v.availability"]')||[])].length,broken:[...(m?.querySelectorAll('img')||[])].filter(x=>x.complete&&x.naturalWidth===0).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4}}).catch(()=>({bad:true,loading:false,visible:false,availability:0,broken:0,overflow:false,title:'',text:''}));if(!state.bad&&!state.loading&&state.visible){usable=Date.now()-start;break}await page.waitForTimeout(200)}}
            state ||= {bad:true,loading:false,visible:false,availability:0,broken:0,overflow:false,title:'',text:''};
            const failed=status!==200||!!error||state.bad||state.loading||!state.visible||usable===null||usable>5000||state.availability>0||state.broken>0||state.overflow;
            result={key,route,attempt,status,error,usableMs:usable,failed,...state}; console.log(JSON.stringify(result)); await page.screenshot({path:`out/${key}-attempt${attempt}.png`,fullPage:true}).catch(()=>{});await ctx.close();
            if(!failed) break; if(attempt===1) await new Promise(r=>setTimeout(r,12000));
          }
          await browser.close();fs.writeFileSync('out/report.json',JSON.stringify(result,null,2));if(result?.failed)process.exitCode=2;
          EOF
          node check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'retest-${{ matrix.key }}', path: out, retention-days: 7}
