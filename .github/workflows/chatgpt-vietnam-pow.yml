name: Vietnam POW Data Process
on:
  push:
    branches:
      - chatgpt-vietnam-casualty-data-process
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Download official DPAA returned-alive list
        run: |
          python - <<'PY'
          import urllib.request
          url='https://dpaa-mil.sites.crmforce.mil/resource/1646075089000/additionalStaticListsKoreanVietnamWar/pmsea_returnee.pdf'
          urllib.request.urlretrieve(url,'pmsea_returnee.pdf')
          PY
          ls -lh pmsea_returnee.pdf
      - name: Extract PDF text
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          r=PdfReader('pmsea_returnee.pdf')
          print('pages',len(r.pages))
          with open('pmsea_returnee.txt','w',encoding='utf-8') as f:
              for i,p in enumerate(r.pages,1):
                  f.write(f'\\n===== PAGE {i} =====\\n')
                  f.write(p.extract_text() or '')
          PY
          wc -l pmsea_returnee.txt
      - name: Upload POW artifact
        uses: actions/upload-artifact@v4
        with:
          name: vietnam-pow-returned-alive
          path: |
            pmsea_returnee.pdf
            pmsea_returnee.txt
          retention-days: 1
