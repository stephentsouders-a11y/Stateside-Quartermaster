name: Sep16 current draft 42 Chromium cert
on:
  push:
    paths:
      - '.github/workflows/sep16-current-draft-42-chromium-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify-current-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Retarget certifier to current unpublished draft
        run: |
          node - <<'EOF'
          const fs=require('fs');
          const p='.github/scripts/refine-taxonomy-route-cert.mjs';
          let s=fs.readFileSync(p,'utf8');
          if(!s.includes("THEME='158561894555'")) throw new Error('Expected stale theme id not found; inspect certifier before continuing');
          s=s.replace("THEME='158561894555'","THEME='158770561179'");
          fs.writeFileSync(p,s);
          console.log('Certifier runtime target: theme 158770561179');
          EOF
      - name: Run all 42 route certifications
        run: |
          node - <<'EOF'
          const fs=require('fs');
          const {spawnSync}=require('child_process');
          const text=fs.readFileSync('.github/workflows/refine-taxonomy-42-progress.yml','utf8');
          const re=/run:\s*"([^"]*refine-taxonomy-route-cert\.mjs[^"]*)"/g;
          const cmds=[]; let m;
          while((m=re.exec(text))) cmds.push(m[1]);
          if(cmds.length!==42) throw new Error(`Expected 42 route commands, found ${cmds.length}`);
          for(const cmd of cmds){
            console.log(`\n=== ${cmd} ===`);
            const r=spawnSync(cmd,{shell:true,stdio:'inherit'});
            if(r.error) console.error(r.error);
            console.log(`exit=${r.status}`);
          }
          EOF
      - name: Capture Accessories rendered screenshot and text
        if: always()
        run: |
          node - <<'EOF'
          const {chromium}=require('playwright');
          const fs=require('fs');
          fs.mkdirSync('taxonomy-cert',{recursive:true});
          const b=await chromium.launch({headless:true});
          const c=await b.newContext({viewport:{width:1440,height:1200}});
          const p=await c.newPage();
          await p.goto('https://www.statesideqm.com/?preview_theme_id=158770561179',{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForTimeout(1200);
          await p.goto('https://www.statesideqm.com/collections/accessories-gifts-collectibles',{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForTimeout(3500);
          await p.screenshot({path:'taxonomy-cert/accessories-current-draft-desktop.png',fullPage:true});
          const info=await p.evaluate(()=>({
            title:document.title,
            h1:(document.querySelector('h1')?.textContent||'').trim(),
            visibleText:(document.body?.innerText||'').slice(0,30000),
            headings:[...document.querySelectorAll('h1,h2,h3,h4,summary')].map(x=>(x.textContent||'').trim()).filter(Boolean),
            sidebarCount:[...document.querySelectorAll('.sq-global-refine-sidebar')].filter(x=>{const s=getComputedStyle(x),r=x.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2}).length,
            groups:[...document.querySelectorAll('.sq-global-refine-sidebar summary,.sq-refine-taxonomy__group>summary')].map(x=>(x.textContent||'').trim()).filter(Boolean),
            productTitles:[...document.querySelectorAll('a[href*="/products/"]')].map(a=>(a.textContent||'').trim()).filter(Boolean).slice(0,30),
            overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4
          }));
          fs.writeFileSync('taxonomy-cert/accessories-current-draft-render.json',JSON.stringify(info,null,2));
          await b.close();
          EOF
      - name: Final 42-route gate
        if: always()
        run: |
          node - <<'EOF'
          const fs=require('fs');
          const files=fs.existsSync('taxonomy-cert')?fs.readdirSync('taxonomy-cert').filter(x=>/^\d\d\.json$/.test(x)).sort():[];
          const rows=files.map(f=>JSON.parse(fs.readFileSync('taxonomy-cert/'+f)));
          for(const r of rows) console.log(`${String(r.idx).padStart(2,'0')} ${r.outcome} ${r.name}${r.reasons.length?' :: '+r.reasons.join('; '):''}`);
          console.log(`TOTAL=${rows.length} PASS=${rows.filter(r=>r.outcome==='PASS').length} FAIL=${rows.filter(r=>r.outcome==='FAIL').length} INFRA=${rows.filter(r=>r.outcome==='INFRA').length}`);
          if(rows.length!==42||rows.some(r=>r.outcome!=='PASS')) process.exit(1);
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep16-current-draft-42-results
          path: taxonomy-cert/
          if-no-files-found: warn
          retention-days: 7
