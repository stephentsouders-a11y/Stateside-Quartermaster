name: Refine V3 customer journey v5
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/refine-v3-customer-journey-v5.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: { shard: [0,1,2,3,4] }
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Exercise route shard like a customer
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cat > route.mjs <<'EOF'
          import { chromium } from 'playwright';
          const B='https://www.statesideqm.com',T='158561894555',S=Number(process.env.SHARD),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const all=['accessories-gifts-collectibles','airsoft-milsim','apparel','armed-forces-gear','art','body-armor-ballistic-protection','literature','child-safety-shop','dive-scuba','firearm-accessories','first-aid-medical-ifak','flags-patriotic-decor','flashlights-lighting','footwear-gloves-eyewear','k9-dog-gear','knives-axes-cutlery','morale-patches-tactical-id','outdoor-preparedness-gear','patriotic-american-heritage','safety-rescue-climbing','sta-brite-insignia','tactical-gear','thin-line','uniforms','watches','zippos-lighters-torches','stateside-quartermaster-logo-merch','army-national-guard-series','air-national-guard-series','products-built-for-the-line-u-s-army','products-built-for-the-line-u-s-navy','products-built-for-the-line-u-s-air-force','products-built-for-the-line-u-s-marine-corps','products-built-for-the-line-u-s-coast-guard','products-built-for-the-line-u-s-space-force','rotc-series','jrotc-series','military-schools-academies','law-enforcement-corrections','firefighting-ems-search-rescue'];
          const routes=all.filter((_,i)=>i%5===S),browser=await chromium.launch({headless:true}),ctx=await browser.newContext({viewport:{width:1440,height:1000}}),p=await ctx.newPage(),fail=[];
          const url=h=>{const u=new URL('/collections/'+h,B);u.searchParams.set('preview_theme_id',T);return u.toString()};
          async function nav(u){let r;for(let a=0;a<6;a++){r=await p.goto(u,{waitUntil:'domcontentloaded',timeout:80000}).catch(()=>null);if(r?.status()===200)return;console.log('RETRY',u,a+1,r?.status());await sleep(2500*(a+1))}throw new Error('HTTP '+r?.status())}
          async function ready(){await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:60000});await p.waitForSelector('#MainContent .sq-refine-v3-sidebar',{state:'visible',timeout:20000});await sleep(1200)}
          for(const h of routes){try{await nav(url(h));await ready();const d=await p.evaluate(()=>{const m=document.querySelector('#MainContent'),vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0};const side=[...m.querySelectorAll('.sq-refine-v3-sidebar')].filter(vis),legacy=[...m.querySelectorAll('.sq-global-refine-sidebar,.sq-collection-sidebar,.facets-block-wrapper,.facets-container,.facets-wrapper,[class*="filter-sidebar"]')].filter(e=>vis(e)&&!e.classList.contains('sq-refine-v3-sidebar')),grid=[...m.querySelectorAll('.sq-refine-v3-results .product-grid')].find(vis),cards=grid?[...grid.querySelectorAll(':scope > .product-grid__item')].filter(x=>vis(x)&&x.querySelector('a[href*="/products/"]')):[],rr=cards.slice(0,9).map(x=>x.getBoundingClientRect()),row=rr.length?rr.filter(x=>Math.abs(x.y-rr[0].y)<4).length:0,layout=m.querySelector('.sq-refine-v3-layout');const interior=[...m.querySelectorAll('section,div,nav,ul')].filter(e=>vis(e)&&!e.closest('.sq-refine-v3-sidebar,.sq-refine-v3-results,.sq-refine-v3-page-size')&&!(layout&&layout.contains(e))).filter(e=>[...e.querySelectorAll('a[href*="/collections/"]')].filter(vis).length>=2&&!e.querySelector('a[href*="/products/"]')).length;return{side:side.length,legacy:legacy.length,cards:cards.length,row,width:rr[0]?Math.round(rr[0].width):0,page:[...m.querySelectorAll('.sq-refine-v3-page-size input')].map(i=>i.value).join(','),interior,href:cards[0]?.querySelector('a[href*="/products/"]')?.href||'',error:m.dataset.sqRefineV3Error||''}});const e=[];if(d.side!==1)e.push('sidebar');if(d.legacy)e.push('legacy');if(d.cards<1)e.push('products');if(d.row!==3)e.push('row='+d.row);if(d.width<250)e.push('width='+d.width);if(d.page!=='50,100,250')e.push('page='+d.page);if(d.interior)e.push('interior='+d.interior);if(d.error)e.push('error='+d.error);const group=p.locator('.sq-refine-v3-sidebar details.sq-refine-v3-group').first();if(await group.count()){const before=await group.getAttribute('open')!==null;await group.locator(':scope > summary').click();if((await group.getAttribute('open')!==null)===before)e.push('disclosure')}if(d.href){await nav(d.href);if(!p.url().includes('/products/'))e.push('product nav');await p.goBack({waitUntil:'domcontentloaded',timeout:80000});await ready()}else e.push('product link');if(e.length){fail.push(h+': '+e.join('|'));console.log('FAIL',h,e.join('|'))}else console.log('PASS',h);await sleep(1800)}catch(e){fail.push(h+': '+String(e));console.log('FAIL',h,String(e));await sleep(5000)}}
          await browser.close();console.log('FAILURES',JSON.stringify(fail));if(fail.length)process.exit(1);console.log('ROUTE SHARD GREEN',S);
          EOF
          node route.mjs
  interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Exercise filters page sizes protected routes and mobile
        run: |
          cat > interact.mjs <<'EOF'
          import { chromium } from 'playwright';
          const B='https://www.statesideqm.com',T='158561894555',sleep=ms=>new Promise(r=>setTimeout(r,ms)),fail=[];
          const browser=await chromium.launch({headless:true}),c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();
          const make=(path)=>{const u=new URL(path,B);u.searchParams.set('preview_theme_id',T);return u.toString()};
          async function nav(u){let r;for(let a=0;a<6;a++){r=await p.goto(u,{waitUntil:'domcontentloaded',timeout:80000}).catch(()=>null);if(r?.status()===200)return;await sleep(2500*(a+1))}throw new Error('HTTP '+r?.status())}
          async function ready(){await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:60000});await p.waitForSelector('.sq-refine-v3-sidebar',{state:'visible',timeout:20000});await sleep(1200)}
          try{for(const path of ['/collections/state-guard-series','/pages/armored-vehicles-purchase-inquiry']){await nav(make(path));const x=await p.evaluate(()=>({v3:!!document.querySelector('[data-sq-refine-v3]'),side:!!document.querySelector('.sq-refine-v3-sidebar')}));if(x.v3||x.side)fail.push(path+' protected V3 leak')}}catch(e){fail.push('protected '+e)}
          for(const path of ['/collections/accessories-gifts-collectibles','/collections/apparel']){try{await nav(make(path));await ready();const i=p.locator('.sq-refine-v3-sidebar input[data-kind=native][data-filter-name][data-filter-value]:not(:checked)').first();if(await i.count()){const d=i.locator('xpath=ancestor::details[1]');if(await d.getAttribute('open')===null)await d.locator(':scope > summary').click();const n=await i.getAttribute('data-filter-name'),v=await i.getAttribute('data-filter-value');await i.check();await p.waitForLoadState('domcontentloaded',{timeout:40000}).catch(()=>{});await ready();if(!new URL(p.url()).searchParams.getAll(n).includes(v))fail.push(path+' native URL');await p.reload({waitUntil:'domcontentloaded',timeout:80000});await ready();if(!await p.locator(`.sq-refine-v3-sidebar input[data-kind=native][data-filter-name="${n}"][data-filter-value="${v}"]`).first().isChecked().catch(()=>false))fail.push(path+' native persistence')}console.log('NATIVE DONE',path)}catch(e){fail.push(path+' native '+e)}await sleep(4000)}
          for(const path of ['/collections/products-built-for-the-line-u-s-navy','/collections/literature']){try{await nav(make(path));await ready();const i=p.locator('.sq-refine-v3-sidebar input[data-kind=structural][data-target^="/collections/"]').first();if(!await i.count()){fail.push(path+' no structural');continue}const target=await i.getAttribute('data-target');if(!new URL(target,B).searchParams.get('sq_root'))fail.push(path+' no sq_root');const d=i.locator('xpath=ancestor::details[1]');if(await d.getAttribute('open')===null)await d.locator(':scope > summary').click();await i.check();await p.waitForLoadState('domcontentloaded',{timeout:40000}).catch(()=>{});await ready();if(!p.url().includes('/collections/'))fail.push(path+' structural nav');console.log('STRUCTURAL DONE',path)}catch(e){fail.push(path+' structural '+e)}await sleep(4000)}
          for(const n of ['50','100','250']){try{await nav(make('/collections/accessories-gifts-collectibles'));await ready();const i=p.locator(`.sq-refine-v3-page-size input[value="${n}"]`);await i.check();await p.waitForLoadState('domcontentloaded',{timeout:40000}).catch(()=>{});await ready();await sleep(n==='250'?3000:1500);if(new URL(p.url()).searchParams.get('sq_per_page')!==n)fail.push('page '+n+' URL');const count=await p.locator('.sq-refine-v3-results .product-grid:visible > .product-grid__item:visible').count();if(count!==Number(n))fail.push('page '+n+' count='+count);console.log('PAGE',n,count)}catch(e){fail.push('page '+n+' '+e)}await sleep(5000)}
          const mc=await browser.newContext({viewport:{width:390,height:844}}),mp=await mc.newPage();for(const path of ['/collections/accessories-gifts-collectibles','/collections/apparel','/collections/literature','/collections/products-built-for-the-line-u-s-navy']){try{let r;for(let a=0;a<6;a++){r=await mp.goto(make(path),{waitUntil:'domcontentloaded',timeout:80000}).catch(()=>null);if(r?.status()===200)break;await sleep(2500*(a+1))}await mp.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:60000});await mp.waitForSelector('.sq-refine-v3-sidebar',{state:'visible',timeout:20000});const d=await mp.evaluate(()=>{const vis=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'},side=[...document.querySelectorAll('.sq-refine-v3-sidebar')].filter(vis),g=[...document.querySelectorAll('.sq-refine-v3-results .product-grid')].find(vis),cards=g?[...g.querySelectorAll(':scope > .product-grid__item')].filter(vis).slice(0,8):[],r=cards.map(x=>x.getBoundingClientRect());return{side:side.length,pos:side[0]?getComputedStyle(side[0]).position:'',row:r.length?r.filter(x=>Math.abs(x.y-r[0].y)<4).length:0}});if(d.side!==1||d.pos==='sticky'||d.row!==2)fail.push(path+' mobile '+JSON.stringify(d));console.log('MOBILE',path,JSON.stringify(d))}catch(e){fail.push(path+' mobile '+e)}await sleep(4000)}
          await browser.close();console.log('FAILURES',JSON.stringify(fail));if(fail.length)process.exit(1);console.log('INTERACTIONS GREEN');
          EOF
          node interact.mjs
