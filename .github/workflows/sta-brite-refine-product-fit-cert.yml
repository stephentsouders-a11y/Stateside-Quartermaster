name: Sta-Brite Refine Products Chromium certification
on:
  push:
    paths:
      - '.github/workflows/sta-brite-refine-product-fit-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click every Sta-Brite refinement and verify product fit
        env:
          BASE: https://www.statesideqm.com
        run: |
          cat > certify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('out',{recursive:true});
          const root='/collections/sta-brite-insignia';
          const expectations={
            '/collections/sta-brite-air-force':{tag:'Service Branch - Air Force',forbid:['Army','Navy','Marine Corps','Coast Guard','Space Force','ROTC','JROTC']},
            '/collections/sta-brite-army':{tag:'Service Branch - Army',forbid:['Air Force','Navy','Marine Corps','Coast Guard','Space Force','ROTC','JROTC']},
            '/collections/sta-brite-coast-guard':{tag:'Service Branch - Coast Guard',forbid:['Air Force','Army','Navy','Marine Corps','Space Force','ROTC','JROTC']},
            '/collections/sta-brite-marine-corps':{tag:'Service Branch - Marine Corps',forbid:['Air Force','Army','Navy','Coast Guard','Space Force','ROTC','JROTC']},
            '/collections/sta-brite-navy':{tag:'Service Branch - Navy',forbid:['Air Force','Army','Marine Corps','Coast Guard','Space Force','ROTC','JROTC']},
            '/collections/sta-brite-space-force':{tag:'Service Branch - Space Force',forbid:['Air Force','Army','Navy','Marine Corps','Coast Guard','ROTC','JROTC']},
            '/collections/sta-brite-rotc':{tag:'Program - ROTC',forbid:['JROTC']},
            '/collections/sta-brite-jrotc':{tag:'Program - JROTC',forbid:[]},
            '/collections/sta-brite-military-service-academies':{tag:'Program - Military Schools & Academies',forbid:[]},
            '/collections/sta-brite-law-enforcement':{tag:'Law Enforcement Insignia',forbid:[]},
            '/collections/sta-brite-firefighting':{tag:'Public Safety - Firefighting',forbid:[]}
          };
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1200}});
          const page=await ctx.newPage();
          page.setDefaultTimeout(15000); page.setDefaultNavigationTimeout(60000);
          const report={root:null,selections:[],errors:[],summary:{tested:0,pass:0,fail:0}};
          const challenge=async()=>page.evaluate(()=>/verify you are human|just a moment|attention required|performing security verification/i.test((document.title||'')+' '+(document.body?.innerText||''))).catch(()=>false);
          async function productsFor(path){
            const out=[]; const seen=new Set();
            for(let pg=1;pg<=24;pg++){
              const u=new URL(path+'/products.json',process.env.BASE);u.searchParams.set('limit','250');u.searchParams.set('page',String(pg));
              const r=await ctx.request.get(u.toString(),{timeout:30000});
              if(!r.ok()) throw new Error(`products.json ${r.status()} ${u.pathname}`);
              const j=await r.json(); const a=Array.isArray(j?.products)?j.products:[];
              for(const p of a){if(p?.handle&&!seen.has(p.handle)){seen.add(p.handle);out.push(p)}}
              if(a.length<250)break;
            }
            return out;
          }
          async function openRoot(){
            const r=await page.goto(process.env.BASE+root,{waitUntil:'domcontentloaded'}); await sleep(1800);
            if(!r||r.status()>=400||await challenge()) throw new Error(`root unavailable status=${r?.status()}`);
            await page.locator('#MainContent').waitFor({state:'visible'});
          }
          await openRoot();
          report.root={url:page.url(),title:await page.title(),sidebar:await page.locator('.sq-global-refine-sidebar').count()};
          await page.screenshot({path:'out/root.png',fullPage:true});
          const links=await page.locator('a[href*="/collections/sta-brite-"]').evaluateAll(as=>{
            const m=new Map(); for(const a of as){const href=new URL(a.href).pathname; if(!m.has(href))m.set(href,{label:(a.textContent||'').replace(/\s+/g,' ').trim(),href});} return [...m.values()];
          });
          const ordered=[]; for(const l of links){if(l.href==='/collections/sta-brite-insignia'||expectations[l.href])ordered.push(l)}
          for(const [path,exp] of Object.entries(expectations)){if(!ordered.some(x=>x.href===path))ordered.push({label:path.split('/').pop(),href:path,missingFromRoot:true})}
          for(let i=0;i<ordered.length;i++){
            const sel=ordered[i]; const rec={label:sel.label,path:sel.href,missingFromRoot:!!sel.missingFromRoot,clicked:false,status:null,count:0,vendorMismatch:[],missingExpectedTag:[],suspiciousTitle:[],visibleProductLinks:0,outcome:'PASS',reasons:[]};
            try{
              await openRoot();
              const a=page.locator(`a[href^="${sel.href}"],a[href="${sel.href}"]`).first();
              if(await a.count()){await a.click();rec.clicked=true;await page.waitForLoadState('domcontentloaded').catch(()=>{});await sleep(1200)}else{await page.goto(process.env.BASE+sel.href,{waitUntil:'domcontentloaded'});await sleep(1000)}
              rec.status=(await page.request.get(page.url())).status();
              if(await challenge())rec.reasons.push('challenge page');
              rec.visibleProductLinks=await page.locator('#MainContent a[href*="/products/"]').count();
              const ps=await productsFor(sel.href);rec.count=ps.length;
              const exp=expectations[sel.href];
              for(const p of ps){
                const vendor=String(p.vendor||'').trim(); const tags=Array.isArray(p.tags)?p.tags:[]; const title=String(p.title||'');
                if(vendor.toLowerCase()!=='sta-brite insignia inc.')rec.vendorMismatch.push({handle:p.handle,title,vendor});
                if(exp&&!tags.includes(exp.tag))rec.missingExpectedTag.push({handle:p.handle,title,tags});
                if(exp){for(const bad of exp.forbid){if(new RegExp(`\\b${bad.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')}\\b`,'i').test(title)){rec.suspiciousTitle.push({handle:p.handle,title,term:bad});break}}}
              }
              if(rec.missingFromRoot)rec.reasons.push('selection missing from root page');
              if(rec.status>=400)rec.reasons.push(`HTTP ${rec.status}`);
              if(rec.vendorMismatch.length)rec.reasons.push(`${rec.vendorMismatch.length} wrong-vendor products`);
              if(rec.missingExpectedTag.length)rec.reasons.push(`${rec.missingExpectedTag.length} products missing expected tag`);
              if(rec.suspiciousTitle.length)rec.reasons.push(`${rec.suspiciousTitle.length} suspicious cross-branch titles`);
              if(sel.href!==root&&rec.count===0)rec.reasons.push('zero products');
              rec.outcome=rec.reasons.length?'FAIL':'PASS';
              await page.screenshot({path:`out/${String(i+1).padStart(2,'0')}-${sel.href.split('/').pop()}.png`,fullPage:false}).catch(()=>{});
            }catch(e){rec.outcome='FAIL';rec.reasons.push(String(e?.message||e))}
            report.selections.push(rec);report.summary.tested++;report.summary[rec.outcome==='PASS'?'pass':'fail']++;
            console.log(`${rec.outcome} ${rec.path} count=${rec.count} ${rec.reasons.join('; ')}`);
          }
          fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));
          fs.writeFileSync('out/summary.txt',report.selections.map(r=>`${r.outcome}\t${r.path}\t${r.count}\t${r.reasons.join('; ')}`).join('\n'));
          await ctx.close(); await browser.close();
          console.log(JSON.stringify(report.summary));
          if(report.summary.fail)process.exitCode=2;
          EOF
          node certify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sta-brite-refine-product-fit-cert
          path: out
          retention-days: 7