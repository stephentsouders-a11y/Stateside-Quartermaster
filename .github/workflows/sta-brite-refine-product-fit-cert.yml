name: Sta-Brite Refine Products Chromium certification
on:
  push:
    paths:
      - '.github/workflows/sta-brite-refine-product-fit-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify Sta-Brite root refinements on current preview theme
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
        run: |
          cat > certify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('out',{recursive:true});
          const cats=[
            ['sta-brite-air-force','Service Branch - Air Force'],
            ['sta-brite-army','Service Branch - Army'],
            ['sta-brite-coast-guard','Service Branch - Coast Guard'],
            ['sta-brite-marine-corps','Service Branch - Marine Corps'],
            ['sta-brite-navy','Service Branch - Navy'],
            ['sta-brite-space-force','Service Branch - Space Force'],
            ['sta-brite-rotc','Program - ROTC'],
            ['sta-brite-jrotc','Program - JROTC'],
            ['sta-brite-military-service-academies','Program - Military Schools & Academies'],
            ['sta-brite-law-enforcement','Law Enforcement Insignia'],
            ['sta-brite-firefighting','Public Safety - Firefighting']
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const results=[],failures=[];
          async function allProducts(request,handle){
            const out=[],seen=new Set();
            for(let pg=1;pg<=24;pg++){
              const u=new URL(`/collections/${handle}/products.json`,process.env.BASE);u.searchParams.set('limit','250');u.searchParams.set('page',String(pg));
              const r=await request.get(u.toString(),{timeout:30000});if(!r.ok())throw new Error(`${handle} products.json HTTP ${r.status()}`);
              const a=(await r.json())?.products||[];for(const p of a){if(p?.handle&&!seen.has(p.handle)){seen.add(p.handle);out.push(p)}}if(a.length<250)break;
            }return out;
          }
          for(const [device,viewport] of [['desktop',{width:1440,height:1100}],['mobile',{width:390,height:844}]]){
            const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({viewport});const page=await ctx.newPage();page.setDefaultTimeout(20000);page.setDefaultNavigationTimeout(60000);
            const target=`${process.env.BASE}/collections/sta-brite-insignia?preview_theme_id=${process.env.THEME}`;
            const response=await page.goto(target,{waitUntil:'domcontentloaded'});await page.locator('[data-sq-stabrite-refine-shell]').waitFor({state:'visible',timeout:20000});await sleep(1000);
            const visibleSidebars=await page.locator('.sq-global-refine-sidebar').evaluateAll(es=>es.filter(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2}).length);
            const choices=await page.locator('.sq-stabrite-refine__choice input').count();
            const rootRec={device,status:response?.status()??null,visibleSidebars,choices,url:page.url()};results.push(rootRec);
            if(rootRec.status!==200)failures.push(`${device}: root HTTP ${rootRec.status}`);if(visibleSidebars!==1)failures.push(`${device}: expected 1 visible sidebar, got ${visibleSidebars}`);if(choices!==cats.length)failures.push(`${device}: expected ${cats.length} category choices, got ${choices}`);
            await page.screenshot({path:`out/${device}-root.png`,fullPage:false});
            for(let i=0;i<cats.length;i++){
              const [handle,tag]=cats[i],input=page.locator(`.sq-stabrite-refine__choice input[data-handle="${handle}"]`),rec={device,handle,tag,checked:false,visible:0,expected:0,vendorBad:0,tagBad:0,subsetBad:0,outcome:'PASS',reasons:[]};
              if(await input.count()!==1){rec.reasons.push('checkbox missing');rec.outcome='FAIL';results.push(rec);failures.push(`${device} ${handle}: checkbox missing`);continue}
              const expected=await allProducts(ctx.request,handle);rec.expected=expected.length;const expectedSet=new Set(expected.map(p=>p.handle));
              for(const p of expected){if(String(p.vendor||'').trim().toLowerCase()!=='sta-brite insignia inc.')rec.vendorBad++;if(!(Array.isArray(p.tags)?p.tags:[]).includes(tag))rec.tagBad++;}
              await input.check();await page.waitForFunction(h=>document.querySelector('.sq-stabrite-refine__head h2')?.textContent&&document.querySelector(`.sq-stabrite-refine__choice input[data-handle="${h}"]`)?.checked,handle);await page.waitForFunction(()=>document.querySelector('.sq-stabrite-refine__loading')?.style.display==='none');await sleep(250);
              rec.checked=await input.isChecked();const handles=await page.locator('[data-sq-stabrite-products] a.sq-stabrite-product').evaluateAll(as=>as.map(a=>new URL(a.href).pathname.split('/').pop()));rec.visible=handles.length;rec.subsetBad=handles.filter(h=>!expectedSet.has(h)).length;
              const expectedVisible=Math.min(50,expected.length);if(!rec.checked)rec.reasons.push('checkbox did not remain checked');if(rec.vendorBad)rec.reasons.push(`${rec.vendorBad} wrong-vendor products`);if(rec.tagBad)rec.reasons.push(`${rec.tagBad} products missing expected tag`);if(rec.subsetBad)rec.reasons.push(`${rec.subsetBad} visible products outside selected collection`);if(rec.visible!==expectedVisible)rec.reasons.push(`visible ${rec.visible}, expected ${expectedVisible}`);
              rec.outcome=rec.reasons.length?'FAIL':'PASS';results.push(rec);if(rec.outcome==='FAIL')failures.push(`${device} ${handle}: ${rec.reasons.join('; ')}`);
              await page.screenshot({path:`out/${device}-${String(i+1).padStart(2,'0')}-${handle}.png`,fullPage:false});await input.uncheck();await sleep(150);
            }
            await ctx.close();await browser.close();
          }
          fs.writeFileSync('out/report.json',JSON.stringify({results,failures},null,2));console.log(JSON.stringify({failures,results},null,2));if(failures.length)process.exitCode=2;
          EOF
          node certify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sta-brite-refine-product-fit-cert
          path: out
          retention-days: 7