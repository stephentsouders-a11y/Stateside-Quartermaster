name: Refine V3 native filter metadata diagnostic
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/refine-v3-product-race-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect native filter metadata
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const B='https://www.statesideqm.com',T='158561894555',routes=['apparel','accessories-gifts-collectibles','sta-brite-insignia'];
          const browser=await chromium.launch({headless:true}),c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();
          for(const h of routes){const u=new URL('/collections/'+h,B);u.searchParams.set('preview_theme_id',T);const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:70000});console.log('ROUTE',h,r?.status());await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000});await p.waitForTimeout(2500);const d=await p.evaluate(()=>[...document.querySelectorAll('.sq-refine-v3-sidebar > details.sq-refine-v3-group')].map(g=>({label:(g.querySelector(':scope>summary')?.textContent||'').replace(/\s+/g,' ').trim(),inputs:[...g.querySelectorAll('input[type=checkbox]')].slice(0,12).map(i=>({text:(i.closest('label')?.textContent||'').replace(/\s+/g,' ').trim(),kind:i.dataset.kind||'',name:i.dataset.filterName||'',value:i.dataset.filterValue||'',target:i.dataset.target||''}))})));console.log('META='+JSON.stringify(d))}
          await c.close();await browser.close();
          EOF
          node diag.mjs
