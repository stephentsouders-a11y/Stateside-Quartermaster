name: Refine V3 native filter click diagnostic
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/refine-v3-product-race-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click and persist real native Availability filter
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const B='https://www.statesideqm.com',T='158561894555';
          const browser=await chromium.launch({headless:true}),c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();
          const u=new URL('/collections/apparel',B);u.searchParams.set('preview_theme_id',T);
          const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:70000});if(r?.status()!==200)throw new Error('HTTP '+r?.status());
          await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000});await p.waitForTimeout(1800);
          const input=p.locator('.sq-refine-v3-sidebar input[data-kind="native"][data-filter-name][data-filter-value]:not(:checked)').first();if(!await input.count())throw new Error('native input missing');
          const g=input.locator('xpath=ancestor::details[1]');if(await g.count()&&await g.getAttribute('open')===null)await g.locator(':scope > summary').click();
          const d=await input.evaluate(i=>({name:i.dataset.filterName,value:i.dataset.filterValue,text:(i.closest('label')?.textContent||'').replace(/\s+/g,' ').trim()}));
          const before=p.url();await input.evaluate(i=>i.click());await p.waitForFunction(x=>location.href!==x,before,{timeout:30000});await p.waitForLoadState('domcontentloaded',{timeout:30000}).catch(()=>{});await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000});
          let now=new URL(p.url());if(!now.searchParams.getAll(d.name).includes(d.value))throw new Error('URL filter missing '+JSON.stringify(d)+' '+p.url());
          await p.reload({waitUntil:'domcontentloaded',timeout:70000});await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000});await p.waitForTimeout(1200);
          const persisted=await p.locator(`.sq-refine-v3-sidebar input[data-kind="native"][data-filter-name="${d.name}"][data-filter-value="${d.value}"]`).first().isChecked().catch(()=>false);if(!persisted)throw new Error('native filter did not persist');
          console.log('NATIVE FILTER PASS',JSON.stringify(d),p.url());await c.close();await browser.close();
          EOF
          node diag.mjs
