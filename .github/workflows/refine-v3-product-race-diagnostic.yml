name: Refine V3 native filter click diagnostic
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/refine-v3-product-race-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click and persist real native Availability filter
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const B='https://www.statesideqm.com',T='158561894555',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({headless:true}),c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();
          async function go(url){let r;for(let a=0;a<4;a++){r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:70000}).catch(()=>null);if(r?.status()===200)return r;console.log('GO RETRY',a+1,r?.status(),p.url());await sleep(3000*(a+1))}return r}
          const u=new URL('/collections/apparel',B);u.searchParams.set('preview_theme_id',T);
          let r=await go(u.toString());if(r?.status()!==200)throw new Error('initial HTTP '+r?.status());
          await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000});await sleep(1600);
          const input=p.locator('.sq-refine-v3-sidebar input[data-kind="native"][data-filter-name][data-filter-value]:not(:checked)').first();if(!await input.count())throw new Error('native input missing');
          const g=input.locator('xpath=ancestor::details[1]');if(await g.count()&&await g.getAttribute('open')===null)await g.locator(':scope > summary').click();
          const d=await input.evaluate(i=>({name:i.dataset.filterName,value:i.dataset.filterValue,text:(i.closest('label')?.textContent||'').replace(/\s+/g,' ').trim(),target:i.dataset.target||''}));
          const before=p.url();const nav=p.waitForNavigation({waitUntil:'domcontentloaded',timeout:35000}).catch(()=>null);await input.evaluate(i=>i.click());const nr=await nav;await sleep(800);
          console.log('NAV_STATUS',nr?.status(),'DEST',p.url(),'INPUT',JSON.stringify(d));
          const state=await p.evaluate(()=>({ready:document.querySelector('#MainContent')?.dataset.sqRefineV3Ready||'',error:document.querySelector('#MainContent')?.dataset.sqRefineV3Error||'',title:document.title,body:(document.body?.innerText||'').slice(0,220)}));console.log('DEST_STATE',JSON.stringify(state));
          if(nr&&nr.status()!==200){if([429,500,502,503,504].includes(nr.status())){r=await go(p.url());if(r?.status()!==200)throw new Error('destination HTTP '+r?.status())}else throw new Error('destination HTTP '+nr.status())}
          if(p.url()===before)throw new Error('native click did not navigate');
          await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:60000});
          let now=new URL(p.url());if(!now.searchParams.getAll(d.name).includes(d.value))throw new Error('URL filter missing '+JSON.stringify(d)+' '+p.url());
          r=await go(p.url());if(r?.status()!==200)throw new Error('reload HTTP '+r?.status());await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:60000});await sleep(1200);
          const persisted=await p.locator(`.sq-refine-v3-sidebar input[data-kind="native"][data-filter-name="${d.name}"][data-filter-value="${d.value}"]`).first().isChecked().catch(()=>false);if(!persisted)throw new Error('native filter did not persist');
          console.log('NATIVE FILTER PASS',JSON.stringify(d),p.url());await c.close();await browser.close();
          EOF
          node diag.mjs
