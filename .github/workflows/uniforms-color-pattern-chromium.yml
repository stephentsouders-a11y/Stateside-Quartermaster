name: Uniforms color pattern Chromium verification
on:
  push:
    paths:
      - '.github/workflows/uniforms-color-pattern-chromium.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium
        run: |
          mkdir -p out
          npm install --no-save agent-browser playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify deployed Uniforms feature
        run: |
          cat > verify.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const BASE='https://www.statesideqm.com',THEME='158561894555';
          const report={passed:false,theme:THEME,checks:[],pageErrors:[],dataResponses:[],started:new Date().toISOString()};
          const browser=await chromium.launch({headless:true});report.chromium=browser.version();
          const context=await browser.newContext({viewport:{width:1440,height:1100},recordVideo:{dir:'out/video',size:{width:1280,height:900}}});
          const page=await context.newPage();page.setDefaultTimeout(25000);page.setDefaultNavigationTimeout(90000);
          page.on('pageerror',e=>report.pageErrors.push(String(e)));
          page.on('response',async r=>{if(r.url().includes('view=sq-uniform-color-data')){report.dataResponses.push({url:r.url(),status:r.status()});if(!fs.existsSync('out/catalog-page-1.txt'))fs.writeFileSync('out/catalog-page-1.txt',(await r.text().catch(()=>'')))}});
          const check=(name,details={})=>{report.checks.push({name,passed:true,...details});console.log('PASS',name,JSON.stringify(details))};
          function preview(path='/collections/uniforms',params={}){const u=new URL(path,BASE);u.searchParams.set('preview_theme_id',THEME);for(const [k,v]of Object.entries(params))u.searchParams.set(k,v);return u.href}
          async function ready(p=page){await p.waitForFunction(()=>window.__sqUniformColor?.ready||window.__sqUniformColor?.error,{},{timeout:100000});const state=await p.evaluate(()=>({ready:window.__sqUniformColor.ready,error:window.__sqUniformColor.error,total:window.__sqUniformColor.total,matches:window.__sqUniformColor.matches,choices:window.__sqUniformColor.choices,ids:window.__sqUniformColor.resultIds,page:window.__sqUniformColor.page,pageSize:window.__sqUniformColor.pageSize,theme:Shopify.theme.id}));assert(!state.error,state.error);assert.equal(String(state.theme),THEME);assert(state.ready);return state}
          async function goto(params={}){await page.goto(preview('/collections/uniforms',params),{waitUntil:'domcontentloaded'});return ready()}
          async function color(value,on=true,p=page){const g=p.locator('[data-sq-ucp-group]');if(!await g.evaluate(n=>n.open))await g.locator('summary').click();const box=g.locator('input[data-sq-ucp-value='+JSON.stringify(value)+']');await Promise.all([p.waitForURL(u=>u.searchParams.getAll('sq_ucp').includes(value)===on,{waitUntil:'domcontentloaded'}),on?box.check():box.uncheck()]);return ready(p)}
          async function native(param,value){const box=page.locator('.sq-refine-v3-sidebar input[data-sq-polish-param='+JSON.stringify(param)+'][data-sq-polish-value='+JSON.stringify(value)+'],.sq-refine-v3-sidebar input[data-filter-name='+JSON.stringify(param)+'][data-filter-value='+JSON.stringify(value)+']').first();await box.evaluate(n=>n.closest('details').open=true);await Promise.all([page.waitForURL(u=>u.searchParams.getAll(param).includes(value),{waitUntil:'domcontentloaded'}),box.check()]);return ready()}
          async function singleGrid(p=page){const grids=await p.locator('.sq-refine-v3-results .product-grid').evaluateAll(ns=>ns.filter(n=>{const r=n.getBoundingClientRect(),s=getComputedStyle(n);return r.width>0&&r.height>0&&s.visibility!=='hidden'}).map(n=>({count:n.querySelectorAll(':scope>.product-grid__item').length,columns:getComputedStyle(n).gridTemplateColumns.split(' ').length,ids:[...n.querySelectorAll(':scope>.product-grid__item')].map(x=>x.dataset.productId)})));assert.equal(grids.length,1,'exactly one visible grid');assert.equal(new Set(grids[0].ids).size,grids[0].ids.length,'no duplicated products');return grids[0]}
          async function photograph(name,p=page){await p.locator('.sq-refine-v3-layout').evaluate(n=>window.scrollTo(0,n.getBoundingClientRect().top+window.scrollY-12));await p.screenshot({path:'out/'+name+'.png'});}
          async function confirmProducts(colorName,vendor=null,inStock=false){const links=await page.locator('[data-sq-ucp-results] a.sq-ucp-card').evaluateAll(ns=>ns.slice(0,3).map(n=>n.href));assert(links.length>0);const evidence=[];for(const href of links){const u=new URL(href),handle=u.pathname.split('/').pop(),r=await context.request.get(BASE+'/products/'+handle+'.js');assert(r.ok());const p=await r.json(),v=p.variants.find(v=>String(v.id)===u.searchParams.get('variant'));assert(v,'matching variant link');if(vendor)assert.equal(p.vendor,vendor);if(inStock)assert(v.available,'matching color variant must be available');const options=p.options.map(x=>typeof x==='string'?x:x.name),ix=options.findIndex(x=>/color|colour|pattern|camo/i.test(x));const value=ix>=0?String(v['option'+(ix+1)]||''):'';const text=value&&!/sergeant|lieutenant|private|captain|major|corporal|colonel/i.test(value)?value:p.title+' '+(Array.isArray(p.tags)?p.tags.join(' '):p.tags);if(colorName==='black'){assert(/\bblack\b/i.test(text),text);assert(!/multicam black/i.test(value),text)}if(colorName==='multicam-ocp'){assert(/multicam|ocp|scorpion/i.test(text),text);assert(!/multicam (black|alpine|arid|tropic)/i.test(value),text)}evidence.push({id:p.id,title:p.title,variantId:v.id,colorValue:value,vendor:p.vendor,available:v.available,type:p.type})}return evidence}
          let mobile;
          try{
            let deployed=false;
            for(let attempt=0;attempt<24;attempt++){await page.goto(preview(),{waitUntil:'domcontentloaded'});if(await page.locator('[data-sq-uniform-color-pattern]').count()){deployed=true;break}await new Promise(r=>setTimeout(r,10000))}
            assert(deployed,'feature must be deployed, not merely committed');
            let state=await ready();assert.equal(await page.locator('[data-sq-ucp-group]').count(),1);assert(state.total>250);assert(state.choices.length>20);assert(state.choices.every(c=>c.count>0));assert(!state.choices.some(c=>/sergeant|lieutenant|captain|corporal|count/i.test(c.label)));check('complete collection and valid single color group',{products:state.total,choices:state.choices.length});
            await page.locator('[data-sq-ucp-group]>summary').click();await photograph('desktop-color-options');
            state=await color('black');const firstIds=state.ids.slice();assert.equal((await singleGrid()).columns,3);assert.equal(state.ids.length,50);const blackEvidence=await confirmProducts('black');check('Black checkbox and exact product variants',{matches:state.matches,evidence:blackEvidence});await photograph('desktop-black-filter');
            await page.reload({waitUntil:'domcontentloaded'});await ready();assert(await page.locator('[data-sq-ucp-value="black"]').isChecked());check('selection survives reload');
            await Promise.all([page.waitForURL(u=>u.searchParams.get('sq_view_page')==='2',{waitUntil:'domcontentloaded'}),page.locator('[data-sq-ucp-results] .sq-refine-v3-pager').getByText('Next',{exact:true}).click()]);state=await ready();assert(!state.ids.some(id=>firstIds.includes(id)));await singleGrid();check('next page does not repeat products');
            for(const size of [100,250]){await Promise.all([page.waitForURL(u=>u.searchParams.get('sq_per_page')===String(size)&&u.searchParams.get('sq_view_page')==='1',{waitUntil:'domcontentloaded'}),page.locator('input[name="sq_per_page_control"][value="'+size+'"]').check()]);state=await ready();assert.equal(state.ids.length,Math.min(size,state.matches));await singleGrid();check(size+' products per page',{rendered:state.ids.length})}
            const blackMatches=state.matches;state=await color('multicam-ocp');assert(state.matches>=blackMatches);assert(await page.locator('[data-sq-ucp-value="black"]').isChecked());assert(await page.locator('[data-sq-ucp-value="multicam-ocp"]').isChecked());check('multiple colors combine without losing selections',{matches:state.matches});
            state=await color('black',false);const ocpEvidence=await confirmProducts('multicam-ocp');check('MultiCam / OCP matches real variants',{matches:state.matches,evidence:ocpEvidence});await photograph('desktop-ocp-filter');
            state=await color('multicam-ocp',false);assert(!new URL(page.url()).searchParams.has('sq_ucp'));assert.equal(await page.locator('[data-sq-ucp-results]').count(),0);await singleGrid();check('clearing restores normal Uniforms results');
            await goto({'sq_ucp':'black'});state=await native('filter.p.vendor','Sta-Brite Insignia Inc.');assert(new URL(page.url()).searchParams.has('sq_ucp'));state=await native('filter.v.availability','1');let combinedEvidence=await confirmProducts('black','Sta-Brite Insignia Inc.',true);check('manufacturer and availability compose with color',{matches:state.matches,evidence:combinedEvidence});
            const type=combinedEvidence[0].type;state=await native('filter.p.product_type',type);combinedEvidence=await confirmProducts('black','Sta-Brite Insignia Inc.',true);assert(combinedEvidence.every(p=>p.type===type));check('type checkbox composes with other filters',{type,matches:state.matches});
            await goto({'sq_ucp':'black'});const category=page.locator('.sq-refine-v3-sidebar input[data-kind="structural"][data-target*="uniforms-agsu-insignia-uniform-accessories"]').first();if(await category.count()){await category.evaluate(n=>n.closest('details').open=true);await Promise.all([page.waitForURL(u=>u.pathname.includes('uniforms-agsu-insignia-uniform-accessories'),{waitUntil:'domcontentloaded'}),category.check()]);state=await ready();assert(new URL(page.url()).searchParams.getAll('sq_ucp').includes('black'));check('category routing retains color and collection scope',{url:page.url(),catalogProducts:state.total,matches:state.matches})}else throw Error('Expected original category checkbox missing');
            await goto();const g=page.locator('[data-sq-ucp-group]');if(!await g.evaluate(n=>n.open))await g.locator('summary').click();const keyBox=g.locator('[data-sq-ucp-value="black"]');await keyBox.focus();await Promise.all([page.waitForURL(u=>u.searchParams.getAll('sq_ucp').includes('black'),{waitUntil:'domcontentloaded'}),page.keyboard.press('Space')]);await ready();check('keyboard checkbox interaction');
            mobile=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1});const mp=await mobile.newPage();mp.setDefaultNavigationTimeout(90000);mp.setDefaultTimeout(25000);await mp.goto(preview('/collections/uniforms',{'sq_ucp':'multicam-ocp'}),{waitUntil:'domcontentloaded'});const ms=await ready(mp),mg=await singleGrid(mp);assert.equal(mg.columns,2);const overflow=await mp.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1);assert(!overflow,'mobile horizontal overflow');await mp.locator('[data-sq-ucp-results]').evaluate(n=>window.scrollTo(0,n.getBoundingClientRect().top+scrollY-10));await mp.screenshot({path:'out/mobile-ocp-products.png'});await color('multicam-ocp',false,mp);assert.equal(await mp.locator('[data-sq-ucp-results]').count(),0);check('mobile two-column grid and clear checkbox',{matches:ms.matches,columns:mg.columns});
            await page.goto(preview('/collections/watches'),{waitUntil:'domcontentloaded'});assert.equal(await page.locator('[data-sq-ucp-group]').count(),0);assert.equal(await page.evaluate(()=>!!window.__sqUniformColor),false);check('other collection roots excluded');
            await page.goto(preview('/collections/state-guard-series'),{waitUntil:'domcontentloaded'});assert.equal(await page.locator('[data-sq-uniform-color-pattern]').count(),0);check('State Guard excluded');
            report.passed=true;
          }catch(e){report.failure=String(e.stack||e);console.error(report.failure);await page.screenshot({path:'out/failure.png'}).catch(()=>{});fs.writeFileSync('out/failure.html',await page.content().catch(()=>''));console.log('FEATURE_STATE',await page.evaluate(()=>({url:location.href,theme:window.Shopify?.theme,api:window.__sqUniformColor,main:document.getElementById('MainContent')?.dataset})).catch(()=>null));}
          finally{if(mobile)await mobile.close();await context.close();await browser.close();report.finished=new Date().toISOString();fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));console.log('UNIFORMS_VERIFICATION',JSON.stringify(report));if(!report.passed)process.exitCode=1}
          EOF
          node verify.mjs
      - name: Agent-browser independent snapshot
        if: success()
        run: |
          export AGENT_BROWSER_EXECUTABLE_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          npx agent-browser open 'https://www.statesideqm.com/collections/uniforms?preview_theme_id=158561894555&sq_ucp=black'
          npx agent-browser wait '[data-sq-uniform-color-ready="true"]'
          npx agent-browser snapshot -i > out/agent-browser-snapshot.txt
          npx agent-browser screenshot out/agent-browser-black.png
          npx agent-browser close
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uniforms-color-pattern-chromium
          path: out
          retention-days: 7
