name: Storefront audit - homepage roots v2
on:
  push:
    paths:
      - '.github/workflows/storefront-audit-homepage-roots-v2.yml'
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {slug: accessories, path: /collections/accessories-gifts-collectibles}
          - {slug: airsoft, path: /collections/airsoft-milsim}
          - {slug: apparel, path: /collections/apparel}
          - {slug: afg, path: /collections/armed-forces-gear}
          - {slug: armored, path: /collections/armored-vehicles}
          - {slug: art, path: /collections/art}
          - {slug: armor, path: /collections/body-armor-ballistic-protection}
          - {slug: literature, path: /collections/literature}
          - {slug: child-safety, path: /collections/child-safety-shop}
          - {slug: dive, path: /collections/dive-scuba}
          - {slug: firearm-accessories, path: /collections/firearm-accessories}
          - {slug: fire-ems-sar, path: /collections/firefighting-ems-search-rescue}
          - {slug: first-aid, path: /collections/first-aid-medical-ifak}
          - {slug: flags, path: /collections/flags-patriotic-decor}
          - {slug: flashlights, path: /collections/flashlights-lighting}
          - {slug: footwear, path: /collections/footwear-gloves-eyewear}
          - {slug: k9, path: /collections/k9-dog-gear}
          - {slug: knives, path: /collections/knives-axes-cutlery}
          - {slug: law, path: /collections/law-enforcement-corrections}
          - {slug: morale, path: /collections/morale-patches-tactical-id}
          - {slug: outdoor, path: /collections/outdoor-preparedness-gear}
          - {slug: patriotic, path: /collections/patriotic-american-heritage}
          - {slug: safety, path: /collections/safety-rescue-climbing}
          - {slug: stabrite, path: /collections/sta-brite-insignia}
          - {slug: tactical, path: /collections/tactical-gear}
          - {slug: thin-line, path: /collections/thin-line}
          - {slug: uniforms, path: /collections/uniforms}
          - {slug: watches, path: /collections/watches}
          - {slug: zippo, path: /collections/zippos-lighters-torches}
          - {slug: logo-merch, path: /collections/stateside-quartermaster-logo-merch}
          - {slug: arng, path: /collections/army-national-guard-series}
          - {slug: ang, path: /collections/air-national-guard-series}
          - {slug: state-guard, path: /collections/state-guard-series}
          - {slug: army, path: /collections/products-built-for-the-line-u-s-army}
          - {slug: navy, path: /collections/products-built-for-the-line-u-s-navy}
          - {slug: air-force, path: /collections/products-built-for-the-line-u-s-air-force}
          - {slug: marines, path: /collections/products-built-for-the-line-u-s-marine-corps}
          - {slug: coast-guard, path: /collections/products-built-for-the-line-u-s-coast-guard}
          - {slug: space-force, path: /collections/products-built-for-the-line-u-s-space-force}
          - {slug: rotc, path: /collections/rotc-series}
          - {slug: jrotc, path: /collections/jrotc-series}
          - {slug: msa, path: /collections/military-schools-academies}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render one homepage root
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
          SLUG: ${{ matrix.slug }}
          PATHNAME: ${{ matrix.path }}
        run: |
          cat > audit.mjs <<'EOF'
          import {chromium} from 'playwright';import fs from 'fs';
          const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:1440,height:1100}}),p=await c.newPage();p.setDefaultNavigationTimeout(60000);
          const u=new URL(process.env.PATHNAME,process.env.BASE);u.searchParams.set('preview_theme_id',process.env.THEME);let status=null,error=null;
          try{const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded'});status=r?.status()??null;await p.waitForTimeout(8000)}catch(e){error=String(e)}
          await p.addStyleTag({content:'html,body{height:auto!important;min-height:100%!important;overflow:visible!important}.page-wrapper{height:auto!important;min-height:100vh!important;overflow:visible!important;max-height:none!important}'}).catch(()=>{});
          await p.evaluate(async()=>{document.querySelectorAll('img').forEach(i=>i.loading='eager');const H=Math.min(document.documentElement.scrollHeight,45000);for(let y=0;y<H;y+=950){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,80))}window.scrollTo(0,0)}).catch(()=>{});await p.waitForTimeout(1000);
          const data=await p.evaluate(()=>{const tx=e=>(e?.textContent||'').replace(/\s+/g,' ').trim(),rr=e=>e?({x:Math.round(e.getBoundingClientRect().x),y:Math.round(e.getBoundingClientRect().y),w:Math.round(e.getBoundingClientRect().width),h:Math.round(e.getBoundingClientRect().height)}):null;
            const links=[...document.querySelectorAll('#MainContent a[href]')].map(a=>({text:tx(a).slice(0,150),href:a.getAttribute('href')||''}));
            const categoryCards=[...document.querySelectorAll('#MainContent .sq-subcategory-card,#MainContent .sq-third-level__type,#MainContent .sqbfl-card,#MainContent .sqsg-card,#MainContent .sqaca-card,#MainContent .sq-line-program-tree__card,#MainContent .sq-ps-root__card')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0}).map(e=>{const im=e.querySelector('img');return{text:tx(e).slice(0,180),href:e.getAttribute('href')||'',rect:rr(e),img:im?.currentSrc||im?.src||'',naturalWidth:im?.naturalWidth||0}});
            const productCards=[...document.querySelectorAll('#MainContent .product-grid__item,#MainContent .sqbfl-product,#MainContent .sqsg-product,#MainContent .sq-custom-color-product,#MainContent .sq-type-family-product')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0}).map(e=>{const im=e.querySelector('img');return{text:tx(e).slice(0,210),rect:rr(e),img:im?.currentSrc||im?.src||'',naturalWidth:im?.naturalWidth||0}});
            const side=document.querySelector('#MainContent .sq-collection-sidebar,#MainContent .sq-custom-render-sidebar'),main=document.querySelector('#MainContent .sq-collection-products-column,#MainContent .sq-custom-render-main'),grid=document.querySelector('#MainContent .sq-type-family-products__grid,#MainContent .sq-collection-products-column #product-grid,#MainContent .sq-collection-products-column .product-grid,#MainContent .sq-custom-render-main .sqbfl-products,#MainContent .sq-custom-render-main .sqsg-products');
            return{title:document.title,finalUrl:location.href,height:document.documentElement.scrollHeight,headings:[...document.querySelectorAll('#MainContent h1,#MainContent h2,#MainContent h3')].slice(0,60).map(tx).filter(Boolean),availabilityInUrl:new URL(location.href).searchParams.has('filter.v.availability'),availabilityLinks:links.filter(x=>x.href.includes('filter.v.availability')).length,categoryCards,categoryCardCount:categoryCards.length,brokenCategoryImages:categoryCards.filter(x=>x.img&&!x.naturalWidth).length,productCards,productCount:productCards.length,brokenProductImages:productCards.filter(x=>x.img&&!x.naturalWidth).length,sidebar:!!side,manufacturer:!!document.querySelector('#MainContent [data-sq-sidebar-facet="manufacturer"],#MainContent [data-sq-facet-browser="manufacturer"],#MainContent .sq-type-family-sidebar details:nth-of-type(1)'),color:!!document.querySelector('#MainContent [data-sq-sidebar-facet="color-pattern"],#MainContent [data-sq-facet-browser="color-pattern"],#MainContent .sq-type-family-sidebar details:nth-of-type(2)'),sidebarRect:rr(side),mainRect:rr(main),gridRect:rr(grid),gridTemplateColumns:grid?getComputedStyle(grid).gridTemplateColumns:'',standaloneFacetCount:document.querySelectorAll('#MainContent .sq-facet-browser').length,allLinks:links};});
          fs.mkdirSync('audit-out',{recursive:true});fs.writeFileSync('audit-out/report.json',JSON.stringify({slug:process.env.SLUG,status,error,...data},null,2));await p.screenshot({path:'audit-out/page.png',fullPage:true});await b.close();
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: root-v2-${{ matrix.slug }}
          path: audit-out
          retention-days: 7
  aggregate:
    if: always()
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: root-v2-*
          path: all-roots
      - uses: actions/upload-artifact@v4
        with:
          name: storefront-audit-homepage-roots-v2-all
          path: all-roots
          retention-days: 7
