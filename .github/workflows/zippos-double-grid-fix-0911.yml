name: Zippos Chromium certification 0911
on:
  push:
    paths:
      - '.github/workflows/zippos-double-grid-fix-0911.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-restart-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify repaired source is present
        run: |
          grep -q "function guardSingleProductGrid()" snippets/sq-refine-v3.liquid
          grep -q "data-sq-refine-v3-duplicate-grid" snippets/sq-refine-v3.liquid
          grep -q "collection-interior-20260911" snippets/sq-refine-v3.liquid
      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Chromium Playwright certification
        run: |
          mkdir -p out
          cat > cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const targets = [
            ['preview-desktop',{width:1440,height:1000},'https://www.statesideqm.com/collections/zippos-lighters-torches?preview_theme_id=158561894555'],
            ['preview-mobile',{width:390,height:844},'https://www.statesideqm.com/collections/zippos-lighters-torches?preview_theme_id=158561894555'],
            ['live-desktop',{width:1440,height:1000},'https://www.statesideqm.com/collections/zippos-lighters-torches']
          ];
          const browser = await chromium.launch({headless:true});
          const report=[];
          for (const [name,viewport,url] of targets) {
            const context = await browser.newContext({viewport});
            const page = await context.newPage();
            const errors=[]; const consoleErrors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
            const response = await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(8000);
            const h=Math.min(await page.evaluate(()=>document.documentElement.scrollHeight),70000);
            for(let y=0;y<h;y+=1000){await page.evaluate(y=>scrollTo(0,y),y);await page.waitForTimeout(90)}
            await page.waitForTimeout(1500);
            const state=await page.evaluate(()=>{
              const m=document.querySelector('#MainContent');
              const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
              const all=m?[...m.querySelectorAll('.product-grid')]:[];
              const grids=all.filter(visible);
              const cards=grids.flatMap(g=>[...g.querySelectorAll(':scope > .product-grid__item')].filter(visible));
              const paths=cards.map(c=>c.querySelector('a[href*="/products/"]')?.pathname).filter(Boolean).map(x=>x.split('?')[0]);
              const duplicates=[...new Set(paths.filter((x,i)=>paths.indexOf(x)!==i))];
              return {
                title:document.title,
                ready:m?.dataset.sqRefineV3Ready||'',
                categorySource:m?.dataset.sqRefineV3CategorySource||'',
                visibleGrids:grids.length,
                totalGrids:all.length,
                cards:cards.length,
                duplicateCount:duplicates.length,
                duplicates:duplicates.slice(0,20),
                guard:!!window.__sqZipposGridGuard,
                hiddenDuplicateGrids:m?[...m.querySelectorAll('[data-sq-refine-v3-duplicate-grid="true"]')].length:0,
                sidebar:!!document.querySelector('.sq-refine-v3-sidebar'),
                pageSizes:[...document.querySelectorAll('.sq-refine-v3-page-size input')].map(x=>x.value)
              };
            });
            await page.screenshot({path:`out/${name}.png`,fullPage:true});
            report.push({name,url,status:response?.status(),errors,consoleErrors,state});
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          const previews=report.filter(x=>x.name.startsWith('preview'));
          const bad=previews.some(x=>x.status!==200 || x.errors.length || x.state.ready!=='true' || x.state.visibleGrids!==1 || x.state.duplicateCount!==0 || !x.state.guard || !x.state.sidebar || JSON.stringify(x.state.pageSizes)!==JSON.stringify(['50','100','250']));
          if(bad) process.exit(2);
          EOF
          node cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zippos-chromium-cert-0911
          path: out
          retention-days: 7
