name: Refine V3 Final Sharded Chromium Certification
on:
  push:
    paths:
      - '.github/workflows/refine-v3-final-sharded-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard:
          - 'accessories-gifts-collectibles,thin-line,tactical-gear,literature,k9-dog-gear'
          - 'patriotic-american-heritage,apparel,child-safety-shop,watches,morale-patches-tactical-id'
          - 'safety-rescue-climbing,zippos-lighters-torches,body-armor-ballistic-protection,armed-forces-gear,footwear-gloves-eyewear'
          - 'sta-brite-insignia,uniforms,flags-patriotic-decor,flashlights-lighting,first-aid-medical-ifak'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Chromium certify shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cat > certify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('out',{recursive:true});
          const theme='158561894555';
          const base='https://www.statesideqm.com/collections/';
          const handles=process.env.SHARD.split(',');
          const colorRequired=new Set(['tactical-gear','k9-dog-gear','patriotic-american-heritage','child-safety-shop','morale-patches-tactical-id','safety-rescue-climbing','body-armor-ballistic-protection','footwear-gloves-eyewear','uniforms']);
          const report={theme,shard:process.env.SHARD,routes:[],failures:[],infraBlocked:[]};
          const browser=await chromium.launch({headless:true});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const visible=async loc=>{try{return await loc.isVisible()}catch{return false}};
          for(const [device,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
            for(const handle of handles){
              let page=null,response=null,attempt=0,rateLimited=false,challenge=false,throttles=[];
              for(attempt=1;attempt<=3;attempt++){
                const context=await browser.newContext({viewport});
                page=await context.newPage();
                page.on('response',r=>{if(r.status()===429)throttles.push(r.url())});
                const url=`${base}${handle}?preview_theme_id=${theme}`;
                try{response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});await page.waitForTimeout(3500)}catch{}
                const status=response?.status()||0;
                const body=(await page.locator('body').innerText().catch(()=>'' )).slice(0,3000);
                challenge=/cloudflare|verify you are human|just a moment|turnstile/i.test(body);
                rateLimited=status===429||challenge;
                if(!rateLimited)break;
                await context.close();page=null;
                await sleep(attempt*7000);
              }
              if(!page){report.infraBlocked.push(`${device}/${handle}: Shopify rate-limit/challenge after 3 attempts`);continue;}
              await page.waitForTimeout(2500);
              const data=await page.evaluate(()=>{
                const main=document.querySelector('#MainContent');
                const side=main?.querySelector('.sq-refine-v3-sidebar');
                const results=main?.querySelector('.sq-refine-v3-results');
                const vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0};
                const cards=[...(results?.querySelectorAll('.product-grid > *')||[])].filter(vis);
                const grids=[...document.querySelectorAll('#MainContent .product-grid')].filter(vis);
                const summaries=[...(side?.querySelectorAll(':scope > details > summary')||[])].map(x=>x.textContent.replace(/\s+/g,' ').trim());
                const cols=[...new Set(cards.slice(0,12).map(x=>Math.round(x.getBoundingClientRect().left)))].length;
                return {side:!!side,results:!!results,products:cards.length,grids:grids.length,summaries,cols,singleGrid:document.documentElement.dataset.sqRefineV3SingleGridCertified||document.body.dataset.sqRefineV3SingleGridCertified||null};
              });
              const row={device,handle,status:response?.status()||0,attempts:attempt,throttles:[...new Set(throttles)],...data};
              report.routes.push(row);
              const fail=m=>report.failures.push(`${device}/${handle}: ${m}`);
              if(!data.side)fail('sidebar missing');
              if(!data.results)fail('results missing');
              if(data.products<1)fail('no visible products');
              if(data.grids!==1)fail(`expected exactly one visible product grid, got ${data.grids}`);
              if(data.products>0&&device==='desktop'&&data.cols!==3)fail(`expected 3 columns, got ${data.cols}`);
              if(data.products>0&&device==='mobile'&&data.cols!==2)fail(`expected 2 columns, got ${data.cols}`);
              if(colorRequired.has(handle)&&!data.summaries.some(x=>/^Shop by Color \/ Pattern$/i.test(x))){
                if(throttles.length)report.infraBlocked.push(`${device}/${handle}: Color / Pattern could not be certified because auxiliary Shopify requests were rate-limited`);
                else fail('Shop by Color / Pattern missing');
              }
              if(handle==='armed-forces-gear'){
                const got=data.summaries.map(x=>x.toLowerCase().replace(/^shop by\s+/,''));
                const need=['branch','availability','type'];
                if(got.length!==3||!need.every(x=>got.includes(x)))fail(`AFG filter policy wrong: ${data.summaries.join(' | ')}`);
              }
              if(handle==='apparel'){
                const got=data.summaries.map(x=>x.toLowerCase());
                const need=['shop by category','shop by type','shop by manufacturer / artist','availability'];
                if(got.length!==4||!need.every(x=>got.includes(x)))fail(`Apparel filter policy wrong: ${data.summaries.join(' | ')}`);
              }
              if(handle==='flags-patriotic-decor'&&data.side){
                await page.evaluate(()=>window.scrollTo(0,1200));await page.waitForTimeout(500);
                const bg=await page.$eval('.sq-refine-v3-sidebar',e=>getComputedStyle(e).backgroundColor);
                if(bg!=='rgb(255, 255, 255)'&&bg!=='rgba(255, 255, 255, 1)')fail(`sidebar background after scroll is ${bg}`);
              }
              if(report.failures.some(x=>x.startsWith(`${device}/${handle}:`)))await page.screenshot({path:`out/${device}-${handle}.png`,fullPage:true});
              await page.context().close();
              await sleep(3000);
            }
          }
          await browser.close();
          fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(report.failures.length)process.exitCode=2;
          else if(report.infraBlocked.length)process.exitCode=3;
          EOF
          node certify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-final-${{ strategy.job-index }}
          path: out
          retention-days: 14
