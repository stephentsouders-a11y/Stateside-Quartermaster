name: Storefront Chromium isolated route audit
on:
  push:
    paths:
      - '.github/workflows/storefront-chromium-isolated-route-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {slug: accessories-gifts-collectibles, name: 'Accessories, Gifts & Collectibles', path: /collections/accessories-gifts-collectibles, type: collection}
          - {slug: airsoft-milsim, name: 'Airsoft & Milsim', path: /collections/airsoft-milsim, type: collection}
          - {slug: apparel-headwear, name: 'Apparel & Headwear', path: /collections/apparel, type: collection}
          - {slug: armed-forces-gear, name: 'Armed Forces Gear', path: /collections/armed-forces-gear, type: collection}
          - {slug: armored-vehicles, name: 'Armored Vehicles', path: /pages/armored-vehicles-purchase-inquiry, type: page}
          - {slug: art-military-prints, name: 'Art & Military Prints', path: /collections/art, type: collection}
          - {slug: body-armor-ballistic-protection, name: 'Body Armor & Ballistic Protection', path: /collections/body-armor-ballistic-protection, type: collection}
          - {slug: books-literature-manuals-reference, name: 'Books, Literature, Manuals & Reference', path: /collections/literature, type: collection}
          - {slug: child-safety-shop, name: 'Child Safety Shop', path: /collections/child-safety-shop, type: collection}
          - {slug: dive-scuba, name: 'DIVE / SCUBA', path: /collections/dive-scuba, type: collection}
          - {slug: firearm-accessories, name: 'Firearm Accessories, Holsters & Shooting Gear', path: /collections/firearm-accessories, type: collection}
          - {slug: first-aid-medical-ifak, name: 'First Aid, Medical & IFAK', path: /collections/first-aid-medical-ifak, type: collection}
          - {slug: flags-displays-memorials, name: 'Flags, Displays & Memorials', path: /collections/flags-patriotic-decor, type: collection}
          - {slug: flashlights-lighting-power, name: 'Flashlights, Lighting & Power', path: /collections/flashlights-lighting, type: collection}
          - {slug: footwear-gloves-eyewear, name: 'Footwear, Gloves & Eyewear', path: /collections/footwear-gloves-eyewear, type: collection}
          - {slug: k9-working-dog-gear, name: 'K9 & Working Dog Gear', path: /collections/k9-dog-gear, type: collection}
          - {slug: knives-axes-multi-tools, name: 'Knives, Axes & Multi-Tools', path: /collections/knives-axes-cutlery, type: collection}
          - {slug: morale-patches-tactical-id, name: 'Morale Patches, Stickers & Tactical ID', path: /collections/morale-patches-tactical-id, type: collection}
          - {slug: outdoor-survival-preparedness, name: 'Outdoor, Survival & Preparedness', path: /collections/outdoor-preparedness-gear, type: collection}
          - {slug: patriotic-american-heritage, name: 'Patriotic & American Heritage', path: /collections/patriotic-american-heritage, type: collection}
          - {slug: safety-rescue-climbing, name: 'Safety, Rescue & Climbing', path: /collections/safety-rescue-climbing, type: collection}
          - {slug: sta-brite-insignia, name: 'Sta-Brite Insignia', path: /collections/sta-brite-insignia, type: collection}
          - {slug: tactical-gear, name: 'Tactical Gear, Packs & Load Carriage', path: /collections/tactical-gear, type: collection}
          - {slug: thin-line-shop, name: 'Thin Line Shop', path: /collections/thin-line, type: collection}
          - {slug: uniforms-insignia-identification, name: 'Uniforms, Insignia & Identification', path: /collections/uniforms, type: collection}
          - {slug: watches-timepieces, name: 'Watches & Timepieces', path: /collections/watches, type: collection}
          - {slug: zippo-lighters-fire-starters, name: 'Zippo, Lighters & Fire Starters', path: /collections/zippos-lighters-torches, type: collection}
          - {slug: logo-merch, name: 'Logo Merch', path: /collections/stateside-quartermaster-logo-merch, type: collection}
          - {slug: army-national-guard-series, name: 'Army National Guard Series', path: /collections/army-national-guard-series, type: collection}
          - {slug: air-national-guard-series, name: 'Air National Guard Series', path: /collections/air-national-guard-series, type: collection}
          - {slug: state-guard-series, name: 'State Guard Series', path: /collections/state-guard-series, type: collection}
          - {slug: us-army-series, name: 'U.S. Army Series', path: /collections/products-built-for-the-line-u-s-army, type: collection}
          - {slug: us-navy-series, name: 'U.S. Navy Series', path: /collections/products-built-for-the-line-u-s-navy, type: collection}
          - {slug: us-air-force-series, name: 'U.S. Air Force Series', path: /collections/products-built-for-the-line-u-s-air-force, type: collection}
          - {slug: us-marine-corps-series, name: 'U.S. Marine Corps Series', path: /collections/products-built-for-the-line-u-s-marine-corps, type: collection}
          - {slug: us-coast-guard-series, name: 'U.S. Coast Guard Series', path: /collections/products-built-for-the-line-u-s-coast-guard, type: collection}
          - {slug: us-space-force-series, name: 'U.S. Space Force Series', path: /collections/products-built-for-the-line-u-s-space-force, type: collection}
          - {slug: rotc-series, name: 'ROTC Series', path: /collections/rotc-series, type: collection}
          - {slug: jrotc-series, name: 'JROTC Series', path: /collections/jrotc-series, type: collection}
          - {slug: military-schools-academies, name: 'Military Schools & Academies', path: /collections/military-schools-academies, type: collection}
          - {slug: law-enforcement-corrections, name: 'Law Enforcement & Corrections', path: /collections/law-enforcement-corrections, type: collection}
          - {slug: firefighting-ems-sar, name: 'Firefighting, EMS & Search & Rescue', path: /collections/firefighting-ems-search-rescue, type: collection}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify one route in a fresh runner
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
          SLUG: ${{ matrix.slug }}
          NAME: ${{ matrix.name }}
          ROUTE: ${{ matrix.path }}
          TYPE: ${{ matrix.type }}
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('out',{recursive:true});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const challengeText=/verify you are human|just a moment|attention required|performing security verification/i;
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
          const page=await ctx.newPage();
          page.setDefaultTimeout(12000); page.setDefaultNavigationTimeout(60000);
          const rate429=[]; const consoleErrors=[];
          page.on('response',r=>{if(r.status()===429)rate429.push(r.url())});
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          const target=new URL(process.env.ROUTE,process.env.BASE); target.searchParams.delete('filter.v.availability'); target.searchParams.set('preview_theme_id',process.env.THEME);
          const result={name:process.env.NAME,slug:process.env.SLUG,path:process.env.ROUTE,type:process.env.TYPE,status:null,usableMs:null,outcome:'FAIL',reasons:[],base:{},refine:{expected:process.env.TYPE==='collection',attempted:false,vendor:null,urlFiltered:false,checked:false,sampleSelector:null,productsChecked:0,vendors:[],allMatch:null,cleared:false},rateLimitUrls:[],consoleErrors:[]};
          const isChallenge=async()=>page.evaluate(re=>re.test((document.title||'')+' '+(document.body?.innerText||'')),challengeText).catch(()=>false);
          async function visibleProductLinks(){
            const selectors=['#MainContent [data-sq-category-universe-products] a[href*="/products/"]','#MainContent [data-sq-custom-color-products] a[href*="/products/"]','#MainContent .sq-custom-color-products a[href*="/products/"]','#MainContent .sqbfl-products a[href*="/products/"]','#MainContent .sqsg-products a[href*="/products/"]','#MainContent .sq-type-family-products__grid a[href*="/products/"]','#MainContent .product-grid a[href*="/products/"]','#MainContent #product-grid a[href*="/products/"]','#MainContent collection-component a[href*="/products/"]'];
            for(const sel of selectors){const links=await page.locator(sel).evaluateAll(as=>[...new Set(as.filter(a=>{const s=getComputedStyle(a),r=a.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2}).map(a=>a.href))].slice(0,2)).catch(()=>[]);if(links.length)return {selector:sel,links}}
            return {selector:null,links:[]};
          }
          async function vendorFor(href){
            try{const u=new URL(href,process.env.BASE),m=u.pathname.match(/^\/products\/([^/?#]+)/);if(!m)return {vendor:null,status:null};for(const d of [0,5000]){if(d)await sleep(d);const r=await ctx.request.get(`${process.env.BASE}/products/${m[1]}.js`,{timeout:15000});if(r.status()===429)continue;if(!r.ok())return {vendor:null,status:r.status()};return {vendor:String((await r.json()).vendor||'').trim(),status:r.status()}}return {vendor:null,status:429}}catch{return {vendor:null,status:null}}
          }
          try{
            await sleep(2500);
            const started=Date.now(); const resp=await page.goto(target.toString(),{waitUntil:'domcontentloaded'}); result.status=resp?.status()??null;
            if(result.status===429||result.status>=500){result.outcome='INFRA';result.reasons.push(`navigation status ${result.status}`)}
            if(result.outcome!=='INFRA'&&await isChallenge()){result.outcome='INFRA';result.reasons.push('anti-bot challenge page')}
            if(result.outcome!=='INFRA'){
              for(let i=0;i<60;i++){
                if(await isChallenge()){result.outcome='INFRA';result.reasons.push('anti-bot challenge during load');break}
                const ok=await page.evaluate(()=>{const m=document.querySelector('#MainContent');if(!m)return false;const ms=getComputedStyle(m),mr=m.getBoundingClientRect();if(ms.display==='none'||ms.visibility==='hidden'||mr.width<3||mr.height<3)return false;return [...m.querySelectorAll('h1,.collection-title,.title,.product-grid,#product-grid,.sqbfl-products,.sq-type-family-products,.sq-subcategory-section,.sq-books-tree,.sq-custom-color-products,collection-component,[data-sqsg-view],.rte')].some(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2})}).catch(()=>false);
                if(ok){result.usableMs=Date.now()-started;break} await sleep(250);
              }
            }
            if(result.outcome!=='INFRA'){
              if(process.env.TYPE==='collection')await page.locator('.sq-global-refine-sidebar').first().waitFor({state:'visible',timeout:12000}).catch(()=>{});
              if(process.env.TYPE==='collection')await page.locator('.sq-global-refine-manufacturer-checkbox').first().waitFor({state:'attached',timeout:14000}).catch(()=>{});
              await sleep(500);
              if(await isChallenge()){result.outcome='INFRA';result.reasons.push('anti-bot challenge after load')}
            }
            if(result.outcome!=='INFRA'){
              result.base=await page.evaluate(()=>{const main=document.querySelector('#MainContent');if(!main)return {main:false};const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};return {main:true,sidebarCount:[...main.querySelectorAll('.sq-global-refine-sidebar')].filter(vis).length,nativeFilters:[...main.querySelectorAll('.facets-block-wrapper--horizontal .facets__filters-wrapper,.facets-toggle__wrapper,theme-drawer#filters-drawer')].filter(vis).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,brokenImages:[...main.querySelectorAll('img')].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.currentSrc||i.src).filter(Boolean),manufacturerDetails:[...main.querySelectorAll('.sq-global-refine-sidebar details')].filter(d=>/manufacturer/i.test(d.querySelector(':scope>summary')?.textContent||'')).length,checkboxes:[...main.querySelectorAll('.sq-global-refine-manufacturer-checkbox')].length}}).catch(()=>({main:false}));
              await page.screenshot({path:'out/base.png',fullPage:false}).catch(()=>{});
              if(process.env.TYPE==='collection'&&result.base.main){
                const md=page.locator('.sq-global-refine-sidebar details').filter({hasText:/Manufacturer/i}).first();
                if(await md.count()){
                  if((await md.getAttribute('open'))===null)await md.locator('summary').click().catch(()=>{});
                  const box=md.locator('.sq-global-refine-manufacturer-checkbox').first();
                  if(await box.count()){
                    result.refine.attempted=true; result.refine.vendor=await box.inputValue();
                    await box.evaluate(el=>{setTimeout(()=>{el.checked=true;el.dispatchEvent(new Event('change',{bubbles:true}))},0)}).catch(()=>result.reasons.push('select dispatch failed'));
                    await page.waitForURL(u=>{const q=new URL(u).searchParams;return q.get('filter.p.vendor')===result.refine.vendor&&q.get('sq_maker')===result.refine.vendor},{timeout:18000}).catch(()=>{});
                    await page.waitForLoadState('domcontentloaded').catch(()=>{}); await sleep(1200);
                    if(await isChallenge()){result.outcome='INFRA';result.reasons.push('anti-bot challenge after manufacturer select')}
                    if(result.outcome!=='INFRA'){
                      const q=new URL(page.url()).searchParams; result.refine.urlFiltered=q.get('filter.p.vendor')===result.refine.vendor&&q.get('sq_maker')===result.refine.vendor;
                      await page.locator('.sq-global-refine-manufacturer-checkbox:checked').first().waitFor({state:'attached',timeout:12000}).catch(()=>{}); result.refine.checked=await page.locator('.sq-global-refine-manufacturer-checkbox:checked').first().isChecked().catch(()=>false);
                      let sample={selector:null,links:[]};for(let i=0;i<12;i++){sample=await visibleProductLinks();if(sample.links.length)break;await sleep(500)}result.refine.sampleSelector=sample.selector;
                      for(const href of sample.links){const r=await vendorFor(href);if(r.vendor)result.refine.vendors.push(r.vendor);if(r.status===429)result.reasons.push('vendor verification API rate-limited')}
                      result.refine.productsChecked=result.refine.vendors.length; result.refine.allMatch=result.refine.vendors.length?result.refine.vendors.every(v=>v.toLowerCase()===String(result.refine.vendor).toLowerCase()):null;
                      await page.screenshot({path:'out/filtered.png',fullPage:false}).catch(()=>{});
                      const active=page.locator('.sq-global-refine-manufacturer-checkbox:checked').first(); if(await active.count()){await active.evaluate(el=>{setTimeout(()=>{el.checked=false;el.dispatchEvent(new Event('change',{bubbles:true}))},0)}).catch(()=>result.reasons.push('clear dispatch failed'));await page.waitForURL(u=>{const q2=new URL(u).searchParams;return !q2.has('filter.p.vendor')&&!q2.has('sq_maker')},{timeout:18000}).catch(()=>{});const q2=new URL(page.url()).searchParams;result.refine.cleared=!q2.has('filter.p.vendor')&&!q2.has('sq_maker')}
                    }
                  }
                }
              }
            }
          }catch(e){result.reasons.push(`route exception: ${String(e).split('\n')[0]}`)}
          result.rateLimitUrls=[...new Set(rate429)].slice(0,20); result.consoleErrors=consoleErrors.filter(x=>!x.includes('shop.app')).slice(0,10);
          if(await isChallenge()){result.outcome='INFRA';if(!result.reasons.some(x=>x.includes('challenge')))result.reasons.push('anti-bot challenge at final state')}
          if(result.outcome!=='INFRA'&&result.rateLimitUrls.length){result.outcome='INFRA';result.reasons.push(`${result.rateLimitUrls.length} HTTP 429 response(s) contaminated this attempt`)}
          if(result.outcome!=='INFRA'){
            if(result.status!==200)result.reasons.push(`HTTP ${result.status}`);
            if(result.usableMs===null||result.usableMs>5000)result.reasons.push(`usable ${result.usableMs}ms`);
            if(!result.base.main)result.reasons.push('#MainContent missing');
            if(result.base.overflow)result.reasons.push('horizontal overflow');
            if(result.base.brokenImages?.length)result.reasons.push(`${result.base.brokenImages.length} broken image(s)`);
            if(process.env.TYPE==='collection'){
              if(result.base.sidebarCount!==1)result.reasons.push(`refine sidebar count ${result.base.sidebarCount}`);
              if(result.base.nativeFilters!==0)result.reasons.push(`duplicate native filters ${result.base.nativeFilters}`);
              if((result.base.manufacturerDetails??0)<1||!result.refine.attempted)result.reasons.push('Manufacturer checkbox surface missing/not testable');
              else{
                if(!result.refine.urlFiltered)result.reasons.push('dual manufacturer filter URL did not apply');
                if(!result.refine.checked)result.reasons.push('manufacturer checkbox did not remain checked');
                if(result.refine.productsChecked<1)result.reasons.push('no visible filtered products could be vendor-verified');
                if(result.refine.allMatch===false)result.reasons.push(`visible filtered results include wrong manufacturer(s): ${result.refine.vendors.join(', ')}`);
                if(!result.refine.cleared)result.reasons.push('manufacturer filter did not clear');
              }
            }
            result.outcome=result.reasons.length?'FAIL':'PASS';
          }
          await page.screenshot({path:'out/final.png',fullPage:false}).catch(()=>{});
          fs.writeFileSync('out/report.json',JSON.stringify(result,null,2));
          console.log('\nCERTIFICATION RESULT\n'+JSON.stringify(result,null,2));
          await ctx.close(); await browser.close();
          if(result.outcome!=='PASS')process.exitCode=2;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cert-${{ matrix.slug }}
          path: out
          retention-days: 7
