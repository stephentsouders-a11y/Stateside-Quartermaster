name: Uniforms Refine sharded Chromium certification

on:
  push:
    paths:
      - '.github/workflows/uniforms-color-pattern-audit.yml'
      - 'snippets/sq-refine-v3.liquid'
      - 'snippets/sq-uniform-color-pattern-core.liquid'
      - 'snippets/sq-uniform-color-pattern.liquid'
      - 'sections/sq-refine-v3-product-grid.liquid'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  every-choice:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Audit Uniforms Refine shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p out/screens
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const SHARD=Number(process.env.SHARD||0), SHARDS=4, THEME='158561894555';
          const BASE=`https://www.statesideqm.com/collections/uniforms?preview_theme_id=${THEME}&sq_per_page=50`;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
          const report={shard:SHARD,base:BASE,startedAt:new Date().toISOString(),chromium:'',inventoryTotal:0,choices:[],failures:[],warnings:[],pageErrors:[],rateLimitRetries:0};
          const browser=await chromium.launch({headless:true}); report.chromium=browser.version();
          const ctx=await browser.newContext({viewport:{width:1440,height:1050}});
          const page=await ctx.newPage(); page.setDefaultNavigationTimeout(70000); page.setDefaultTimeout(25000);
          page.on('pageerror',e=>report.pageErrors.push(String(e)));
          async function waitReady(){await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:30000});await page.waitForTimeout(250)}
          async function go(url){for(let a=0;a<6;a++){const r=await page.goto(url,{waitUntil:'domcontentloaded'});if(r?.status()===200){await waitReady();return}if(r?.status()===429){report.rateLimitRetries++;await sleep(Math.min(2500*(a+1),15000));continue}throw new Error(`HTTP ${r?.status()} ${url}`)}throw new Error(`429 exhausted ${url}`)}
          async function state(){return page.evaluate(()=>{const m=document.querySelector('#MainContent'),vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};const grid=m?.querySelector('.sq-refine-v3-results .product-grid'),cards=grid?[...grid.children].filter(x=>vis(x)&&x.querySelector('a[href*="/products/"]')):[];return{ready:m?.dataset.sqRefineV3Ready||null,error:m?.dataset.sqRefineV3Error||null,sidebar:!!m?.querySelector('.sq-refine-v3-sidebar'),products:cards.map(x=>{const a=x.querySelector('a[href*="/products/"]');return{title:clean(x.innerText).slice(0,200),href:a?.href||''}}),duplicate:[...m.querySelectorAll('.product-grid')].filter(g=>vis(g)&&g!==grid&&g.querySelector('a[href*="/products/"]')).length,oldNative:[...m.querySelectorAll('.facets-block-wrapper--horizontal .facets__filters-wrapper,.facets-toggle__wrapper,theme-drawer#filters-drawer')].filter(vis).length}})}
          async function pjson(href){const h=new URL(href).pathname.split('/').filter(Boolean).pop();for(let a=0;a<4;a++){const r=await ctx.request.get(`https://www.statesideqm.com/products/${h}.js`);if(r.status()===200)return r.json();if(r.status()===429){report.rateLimitRetries++;await sleep(1800*(a+1));continue}throw new Error(`product.js ${r.status()} ${h}`)}throw new Error(`product.js 429 ${h}`)}
          function match(meta,p){const n=meta.filterName||meta.polish||'',v=clean(meta.value);if(n==='filter.p.vendor')return clean(p.vendor)===v;if(n==='filter.p.product_type')return clean(p.type)===v;if(n==='filter.p.tag')return(p.tags||[]).some(t=>clean(t)===v);if(n==='filter.v.availability'){const any=(p.variants||[]).some(x=>x.available);return v==='1'?any:v==='0'?!any:true}if(/^filter\.v\.option\./.test(n)){const needle=v.toLowerCase();return(p.variants||[]).some(x=>(x.options||[]).some(y=>clean(y).toLowerCase()===needle))}return null}
          await go(BASE);
          const baseState=await state();
          if(!baseState.sidebar)report.failures.push('base sidebar missing');if(baseState.oldNative)report.failures.push(`base old native filters ${baseState.oldNative}`);if(baseState.duplicate)report.failures.push(`base duplicate grids ${baseState.duplicate}`);
          const inventory=await page.evaluate(()=>{const side=document.querySelector('#MainContent .sq-refine-v3-sidebar');return side?[...side.querySelectorAll('details.sq-refine-v3-group')].flatMap((d,gi)=>{const group=(d.querySelector(':scope>summary')?.textContent||'').replace(/\s+/g,' ').trim();return[...d.querySelectorAll('input[type="checkbox"]')].map((i,ii)=>{const row=i.closest('.sq-refine-v3-choice')||i.closest('label')||i.parentElement,span=row?.querySelector('span');return{group,gi,ii,label:(span?.textContent||row?.textContent||i.value||'').replace(/\s+/g,' ').trim(),value:i.value||'',target:i.dataset.target||'',filterName:i.dataset.filterName||'',polish:i.dataset.sqPolishParam||'',ucp:i.dataset.sqUcpValue||''}}) }):[]});
          report.inventoryTotal=inventory.length;
          const mine=inventory.map((x,i)=>({...x,index:i})).filter(x=>x.index%SHARDS===SHARD);
          console.log('UNIFORMS_SHARD_START',JSON.stringify({shard:SHARD,total:inventory.length,mine:mine.length}));
          for(const meta of mine){
            await go(BASE);await sleep(300);
            const d=page.locator('#MainContent details.sq-refine-v3-group').nth(meta.gi);if(!(await d.getAttribute('open')))await d.locator(':scope>summary').click();const input=d.locator('input[type="checkbox"]').nth(meta.ii);await input.scrollIntoViewIfNeeded().catch(()=>{});
            const before=page.url();let clickError='';try{await Promise.all([page.waitForURL(u=>u.href!==before,{timeout:18000}).catch(()=>null),input.click({force:true})]);await page.waitForLoadState('domcontentloaded').catch(()=>{});await waitReady().catch(()=>{});if(meta.ucp)await page.waitForFunction(()=>window.__sqUniformColor?.ready||window.__sqUniformColor?.error,null,{timeout:30000}).catch(()=>{})}catch(e){clickError=String(e)}
            const u=new URL(page.url()),s=await state().catch(()=>({ready:null,products:[],duplicate:0,oldNative:0,sidebar:false,error:'eval failed'})),errors=[],semantic=[];
            if(clickError)errors.push(clickError);if(s.ready!=='true')errors.push(`V3 not ready ${s.ready} ${s.error||''}`);if(!s.sidebar)errors.push('sidebar missing');if(s.duplicate)errors.push(`duplicate grids ${s.duplicate}`);if(s.oldNative)errors.push(`old native filters ${s.oldNative}`);
            if(meta.ucp){if(!u.searchParams.getAll('sq_ucp').includes(meta.ucp))errors.push(`missing sq_ucp=${meta.ucp}`);if(!s.products.length)errors.push('zero products')}
            else if(meta.target){const t=new URL(meta.target,'https://www.statesideqm.com');if(u.pathname!==t.pathname)errors.push(`wrong target ${u.pathname} expected ${t.pathname}`);if(!u.searchParams.getAll('sq_root').includes('uniforms'))errors.push('lost sq_root=uniforms');if(!s.products.length)errors.push('zero products')}
            else{const param=meta.filterName||meta.polish;if(param&&!u.searchParams.getAll(param).includes(meta.value))errors.push(`missing ${param}=${meta.value}`);if(!param)errors.push('no filter metadata');for(const card of s.products.slice(0,5)){try{const p=await pjson(card.href),ok=match(meta,p);if(ok===false)semantic.push({title:p.title,vendor:p.vendor,type:p.type,reason:`fails ${param}=${meta.value}`})}catch(e){report.warnings.push(`${meta.group} > ${meta.label}: ${e}`)}}if(semantic.length)errors.push(`${semantic.length} sampled products violate selected filter`)}
            const entry={index:meta.index+1,group:meta.group,label:meta.label,url:u.href,products:s.products.length,semantic,errors};report.choices.push(entry);console.log('UNIFORMS_CHOICE',JSON.stringify(entry));if(errors.length){report.failures.push(`${meta.group} > ${meta.label}: ${errors.join('; ')}`);await page.screenshot({path:`out/screens/${String(meta.index+1).padStart(3,'0')}.png`,fullPage:true}).catch(()=>{})}
          }
          report.finishedAt=new Date().toISOString();fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));console.log('UNIFORMS_SHARD_SUMMARY',JSON.stringify({shard:SHARD,chromium:report.chromium,inventoryTotal:report.inventoryTotal,tested:report.choices.length,failures:report.failures,warnings:report.warnings,pageErrors:report.pageErrors,rateLimitRetries:report.rateLimitRetries},null,2));await browser.close();if(report.failures.length||report.pageErrors.length)process.exitCode=2;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uniforms-refine-shard-${{ matrix.shard }}
          path: out
          retention-days: 14
