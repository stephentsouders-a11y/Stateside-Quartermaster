name: Patriotic Color Pattern Chromium Proof
on:
  push:
    paths:
      - '.github/workflows/patriotic-color-pattern-proof.yml'
      - 'snippets/sq-refine-v3-morale-color-pattern.liquid'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify Refine Products color pattern filter in Chromium
        run: |
          mkdir -p proof
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const url='https://www.statesideqm.com/collections/patriotic-american-heritage?preview_theme_id=158561894555';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1100}});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
          if(!response || !response.ok()) throw new Error('Collection HTTP status '+(response&&response.status()));
          await page.waitForSelector('.sq-refine-v3-sidebar',{timeout:60000});
          await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:60000});
          await page.waitForTimeout(1500);
          const group=page.locator('.sq-refine-v3-sidebar details').filter({has:page.locator('summary', {hasText:'Shop by Color / Pattern'})}).first();
          if(await group.count()!==1) throw new Error('Shop by Color / Pattern group is missing');
          const summary=group.locator('summary');
          await summary.click();
          const choices=group.locator('input[type="checkbox"]');
          const choiceCount=await choices.count();
          if(choiceCount<1) throw new Error('Shop by Color / Pattern has no checkboxes');
          const labels=await group.locator('.sq-refine-v3-choice').allTextContents();
          const before=await page.locator('.product-grid__item a[href*="/products/"]').evaluateAll(nodes=>[...new Set(nodes.map(n=>n.getAttribute('href')).filter(Boolean))]);
          if(before.length<1) throw new Error('No products rendered before filtering');
          await page.screenshot({path:'proof/before.png',fullPage:true});
          let success=null;
          const max=Math.min(choiceCount,5);
          for(let i=0;i<max;i++){
            if(i>0){
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForSelector('.sq-refine-v3-sidebar',{timeout:60000});
              await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:60000});
              await page.waitForTimeout(1000);
              const g=page.locator('.sq-refine-v3-sidebar details').filter({has:page.locator('summary',{hasText:'Shop by Color / Pattern'})}).first();
              if(!(await g.getAttribute('open'))) await g.locator('summary').click();
            }
            const currentGroup=page.locator('.sq-refine-v3-sidebar details').filter({has:page.locator('summary',{hasText:'Shop by Color / Pattern'})}).first();
            const checkbox=currentGroup.locator('input[type="checkbox"]').nth(i);
            const label=(await checkbox.locator('xpath=ancestor::label[1]').innerText()).trim();
            await Promise.all([
              page.waitForNavigation({waitUntil:'domcontentloaded',timeout:90000}),
              checkbox.check()
            ]);
            await page.waitForSelector('.sq-refine-v3-sidebar',{timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:60000});
            await page.waitForTimeout(1000);
            const decoded=decodeURIComponent(page.url().replace(/\+/g,' '));
            const after=await page.locator('.product-grid__item a[href*="/products/"]').evaluateAll(nodes=>[...new Set(nodes.map(n=>n.getAttribute('href')).filter(Boolean))]);
            const checked=await page.locator('.sq-refine-v3-sidebar details').filter({has:page.locator('summary',{hasText:'Shop by Color / Pattern'})}).first().locator('input[type="checkbox"]:checked').count();
            const changed=JSON.stringify(after)!==JSON.stringify(before);
            if(decoded.includes('filter.p.tag=SQ Color/Pattern:') && checked>0 && after.length>0 && changed){success={label,afterCount:after.length,url:page.url(),checked,changed};break;}
          }
          if(!success) throw new Error('No tested color/pattern checkbox produced a non-empty changed product result');
          await page.screenshot({path:'proof/after.png',fullPage:true});
          const report={status:'PASS',group:'Shop by Color / Pattern',choiceCount,labels,beforeCount:before.length,selected:success,consoleErrors:errors};
          await fs.writeFile('proof/report.json',JSON.stringify(report,null,2));
          console.log('PATRIOTIC_COLOR_PATTERN_PASS '+JSON.stringify(report));
          await browser.close();
          EOF
          node verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patriotic-color-pattern-proof
          path: proof
          retention-days: 7
