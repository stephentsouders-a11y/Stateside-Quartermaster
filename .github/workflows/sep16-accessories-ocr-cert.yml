name: Sep16 Accessories Chromium OCR cert
on:
  push:
    paths:
      - '.github/workflows/sep16-accessories-ocr-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accessories-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and OCR
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr >/dev/null
      - name: Capture current unpublished Accessories page
        run: |
          mkdir -p accessories-ocr
          node - <<'EOF'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const c=await b.newContext({viewport:{width:1440,height:1200}});
            const p=await c.newPage();
            await p.goto('https://www.statesideqm.com/?preview_theme_id=158770561179',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(1000);
            const r=await p.goto('https://www.statesideqm.com/collections/accessories-gifts-collectibles',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(8000);
            const status=r?r.status():null;
            const info=await p.evaluate((status)=>{
              const rail=document.querySelector('[data-sq-collection-rail]');
              const visible=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&!e.hidden&&r.width>2&&r.height>2};
              const groups=[['Categories','[data-sq-context-categories]','[data-sq-context-categories-list]'],['Subcategories','[data-sq-context-subcategories]','[data-sq-context-subcategories-list]'],['Types','[data-sq-context-types]','[data-sq-context-types-list]']].map(([name,i,l])=>{const item=rail?.querySelector(i),list=rail?.querySelector(l);return{name,visible:visible(item),labels:[...(list?.querySelectorAll('.sq-collection-rail__link-label')||[])].map(x=>(x.textContent||'').trim()).filter(Boolean)}});
              return{status,title:document.title,h1:(document.querySelector('#MainContent h1')?.textContent||'').trim(),groups,sourceButtonCount:Number(rail?.dataset.sqSourceButtonCount||0),mirroredLinkCount:Number(rail?.dataset.sqMirroredLinkCount||0),visibleProductTitles:[...document.querySelectorAll('#MainContent a[href*="/products/"]')].filter(visible).map(a=>(a.textContent||'').replace(/\s+/g,' ').trim()).filter(Boolean).slice(0,30),bodyText:(document.body?.innerText||'').slice(0,30000)};
            },status);
            fs.writeFileSync('accessories-ocr/dom.json',JSON.stringify(info,null,2));
            await p.screenshot({path:'accessories-ocr/accessories-current-draft.png',fullPage:true});
            await b.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          EOF
      - name: OCR rendered screenshot
        run: |
          tesseract accessories-ocr/accessories-current-draft.png accessories-ocr/accessories-current-draft-ocr --psm 6 2>accessories-ocr/tesseract-stderr.txt
          echo '--- OCR HEAD ---'
          sed -n '1,180p' accessories-ocr/accessories-current-draft-ocr.txt
          echo '--- DOM ---'
          cat accessories-ocr/dom.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep16-accessories-ocr-evidence
          path: accessories-ocr/
          if-no-files-found: error
          retention-days: 7
