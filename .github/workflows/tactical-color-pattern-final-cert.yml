name: Tactical Gear final color-pattern Chromium certification
on:
  push:
    paths:
      - '.github/workflows/tactical-color-pattern-final-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate and certify in real Chromium
        run: |
          cat > certify.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'node:fs';import vm from 'node:vm';import crypto from 'node:crypto';
          fs.mkdirSync('out/videos',{recursive:true});
          const source=fs.readFileSync('snippets/sq-refine-v3-tactical-color-pattern.liquid','utf8');
          new vm.Script(source.match(/<script[^>]*>([\s\S]*?)<\/script>/)[1]);
          const BASE='https://www.statesideqm.com/collections/tactical-gear?preview_theme_id=158561894555';
          const report={url:BASE,commit:process.env.GITHUB_SHA,sourceMd5:crypto.createHash('md5').update(source).digest('hex'),checks:[],states:[],failures:[]};
          function check(name,pass,detail){const row={name,pass:!!pass,detail};report.checks.push(row);if(!pass)report.failures.push(name);console.log(JSON.stringify(row));}
          function clean(v){return String(v??'').replace(/\s+/g,' ').trim().toLowerCase();}
          function normalize(v){return clean(v).replace(/^\(\d+\)\s*/,'').replace(/^\d{2,5}\s*[-:]\s*/,'').replace(/^(?:\.\d+|\d+)\s+caliber\s*\([^)]*\)\s*&\s*/,'').replace(/\s*\+\s*\$\s*[\d.,]+\s*$/,'').replace(/\s+\d+\s*(?:[- ]?pack)(?:\s+safe bundle)?$/,'').replace(/\bgrey\b/g,'gray').replace(/\bmulti[ -]?cam\b/g,'multicam');}
          function variantMatches(p,v,q){
            const selected=q.getAll('sq_tactical_color').map(normalize),indices=(p.options||[]).map((n,i)=>/colou?r|pattern|camo/i.test(n)?i:-1).filter(i=>i>=0);
            const tags=(p.tags||[]).map(t=>t.match(/^(?:SQ\s+)?(?:colou?r\s*\/\s*pattern|colou?r|pattern|camouflage)\s*:\s*(.+)$/i)?.[1]).filter(Boolean);
            const colors=(indices.length?indices.map(i=>v.options[i]):tags).map(normalize);
            const availability=q.getAll('filter.v.availability').flatMap(x=>x.split(',')),low=q.get('filter.v.price.gte'),high=q.get('filter.v.price.lte');
            return (!selected.length||selected.some(c=>colors.includes(c)))&&(!availability.length||availability.includes(v.available?'1':'0'))&&(low===null||low===''||v.price>=Number(low)*100)&&(high===null||high===''||v.price<=Number(high)*100);
          }
          function expected(products,url){const q=new URL(url).searchParams,vs=q.getAll('filter.p.vendor').map(clean),ts=q.getAll('filter.p.product_type').map(clean);return products.filter(p=>!/options[_ ]hidden[_ ]product/i.test(p.type)&&(!vs.length||vs.includes(clean(p.vendor)))&&(!ts.length||ts.includes(clean(p.type)))&&p.variants.some(v=>variantMatches(p,v,q)));}
          async function ready(p,filtered=false){await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqTacticalColorVersion==='2',null,{timeout:65000});if(filtered)await choices(p,true);}
          async function choices(p,filtered=false){await p.waitForFunction(filtered=>document.querySelector('#MainContent')?.dataset.sqTacticalColorError||(document.querySelector('[data-sq-tactical-colors]')?.dataset.sqTacticalColorReady==='true'&&(!filtered||document.querySelector('[data-sq-tactical-color-results]')?.dataset.sqTacticalColorReady==='true')),filtered,{timeout:120000});const error=await p.locator('#MainContent').getAttribute('data-sq-tactical-color-error');if(error)throw new Error(error);}
          async function nav(p,fn){await Promise.all([p.waitForNavigation({waitUntil:'domcontentloaded',timeout:90000}),fn()]);await ready(p,new URL(p.url()).searchParams.has('sq_tactical_color'));}
          async function state(p){return p.evaluate(()=>{const vis=e=>!!e&&e.getBoundingClientRect().width>1&&e.getBoundingClientRect().height>1&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden';const cards=[...document.querySelectorAll('.sq-tactical-color-grid>li')],surface=document.querySelector('[data-sq-tactical-color-results]');return {url:location.href,theme:Shopify.theme.id,main:{...document.querySelector('#MainContent').dataset},groups:[...document.querySelectorAll('.sq-refine-v3-sidebar>details>summary')].map(e=>e.textContent.trim()),total:Number(surface?.dataset.sqTacticalColorTotal||0),handles:cards.map(e=>e.dataset.productHandle),variants:cards.map(e=>new URL(e.querySelector('a').href).searchParams.get('variant')),customVisible:vis(surface),nativeVisible:[...document.querySelectorAll('#MainContent .product-grid')].filter(vis).length,columns:cards.length?new Set(cards.slice(0,6).map(e=>Math.round(e.getBoundingClientRect().left))).size:0,overflow:document.documentElement.scrollWidth>innerWidth+3,broken:[...document.querySelectorAll('.sq-tactical-color-grid img')].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),selected:[...document.querySelectorAll('input[name="sq_tactical_color"]:checked')].map(e=>e.value)};});}
          async function verify(p,name,products,columns){
            const s=await state(p),q=new URL(p.url()).searchParams,all=expected(products,p.url()),size=Number(q.get('sq_per_page')||50),pages=Math.max(1,Math.ceil(all.length/size)),pg=Math.min(pages,Math.max(1,Number(q.get('sq_view_page')||1))),batch=all.slice((pg-1)*size,pg*size);
            report.states.push({name,...s});check(name+' exact count',s.total===all.length,{actual:s.total,expected:all.length});check(name+' exact page',JSON.stringify(s.handles)===JSON.stringify(batch.map(p=>p.handle)),{actual:s.handles.length,expected:batch.length});check(name+' matching variant links',s.handles.every((h,i)=>{const product=products.find(p=>p.handle===h),variant=product?.variants.find(v=>String(v.id)===s.variants[i]);return variant&&variantMatches(product,variant,q);}));check(name+' single result grid',s.customVisible&&s.nativeVisible===0,s.nativeVisible);check(name+' no duplicate cards',new Set(s.handles).size===s.handles.length);check(name+' responsive columns',!s.overflow&&(!s.handles.length||s.columns===Math.min(columns,s.handles.length)),{columns:s.columns,overflow:s.overflow});check(name+' no broken loaded images',s.broken.length===0,s.broken);return s;
          }
          async function shot(p,name,grid=false){const group=p.locator('[data-sq-tactical-colors]');if(grid&&await group.evaluate(e=>e.open))await group.locator('summary').click();await p.locator(grid?'[data-sq-tactical-color-results]':'.sq-refine-v3-sidebar').scrollIntoViewIfNeeded();await p.screenshot({path:'out/'+name+'.png'});}
          async function openDetails(input){const d=input.locator('xpath=ancestor::details[1]');if(!await d.evaluate(e=>e.open))await d.locator(':scope>summary').click();}
          const browser=await chromium.launch({headless:true});
          for(const [device,viewport,columns] of [['desktop',{width:1440,height:1000},3],['mobile',{width:390,height:844},2]]){
            const context=await browser.newContext({viewport,recordVideo:{dir:'out/videos',size:viewport}}),p=await context.newPage(),errors=[],pages=new Map(),pending=[];p.setDefaultTimeout(25000);p.on('pageerror',e=>errors.push(String(e)));
            p.on('response',r=>{if(r.ok()&&r.url().includes('view=sq-tactical-color-data'))pending.push(r.json().then(j=>{if(j.schema==='sq-tactical-colors-1')pages.set(j.page,j);}).catch(e=>{console.log('CAPTURE '+e);}));});
            try{
              const response=await p.goto(BASE,{waitUntil:'domcontentloaded',timeout:90000});await ready(p);check(device+' HTTP200',response.status()===200);check(device+' correct theme',await p.evaluate(()=>Shopify.theme.id===158561894555));const g=p.locator('[data-sq-tactical-colors]');check(device+' one correct group',await g.count()===1&&(await g.locator('summary').innerText()).trim()==='Shop by Color / Pattern');await shot(p,device+'-closed');
              await g.locator('summary').click();await choices(p);await Promise.all(pending);const pageData=[...pages.values()].sort((a,b)=>a.page-b.page),products=pageData.flatMap(x=>x.products);fs.writeFileSync('out/'+device+'-catalog.json',JSON.stringify(products));check(device+' all catalog pages captured',products.length===pageData[0]?.total&&new Set(products.map(x=>x.id)).size===products.length,{products:products.length,pages:pageData.length});if(!products.length)throw new Error('Missing independent catalog response data');
              const opts=await g.locator('input[name="sq_tactical_color"]').evaluateAll(xs=>xs.map(x=>x.value));check(device+' Black and Multicam present',opts.includes('Black')&&opts.includes('Multicam'),{options:opts.length});check(device+' rank and kit noise removed',!opts.some(x=>/^(?:Captain|Major|Colonel|Private|Sergeant|E\d |O\d |Only Ptt|Empty Bag|Full Set|\d+pc )/i.test(x)));check(device+' compressed cache stored',await p.locator('#MainContent').getAttribute('data-sq-tactical-color-cache-stored')==='true');fs.writeFileSync('out/'+device+'-options.json',JSON.stringify(opts,null,2));
              await g.locator('input[type="search"]').fill('black');check(device+' search filters choices',await g.locator('[data-sq-tactical-color-label]:visible').evaluateAll(xs=>xs.length>0&&xs.every(x=>x.textContent.toLowerCase().includes('black'))));await g.locator('input[type="search"]').fill('');await shot(p,device+'-options');await g.locator('summary').click();check(device+' disclosure closes',!await g.evaluate(e=>e.open));await g.locator('summary').click();
              await nav(p,()=>p.locator('input[name="sq_tactical_color"][value="Black"]').check());await p.waitForTimeout(3300);await verify(p,device+' Black',products,columns);check(device+' cache reused',await p.locator('#MainContent').getAttribute('data-sq-tactical-color-cache')==='hit');check(device+' checked state retained',await p.locator('input[name="sq_tactical_color"][value="Black"]').isChecked());await shot(p,device+'-black',true);
              const black=p.locator('input[name="sq_tactical_color"][value="Black"]');await openDetails(black);await nav(p,()=>black.uncheck());check(device+' uncheck removes color',!new URL(p.url()).searchParams.has('sq_tactical_color'));await g.locator('summary').click();await choices(p);await nav(p,()=>p.locator('input[name="sq_tactical_color"][value="Multicam"]').check());await verify(p,device+' Multicam',products,columns);await shot(p,device+'-multicam',true);
              if(device==='desktop'){
                await openDetails(p.locator('input[name="sq_tactical_color"][value="Black"]'));await nav(p,()=>p.locator('input[name="sq_tactical_color"][value="Black"]').check());await verify(p,'desktop multiselect',products,columns);
                for(const size of [100,250,50]){await nav(p,()=>p.locator('input[name="sq_per_page_control"][value="'+size+'"]').check());await verify(p,'desktop '+size+' per page',products,columns);}
                const next=p.locator('[data-sq-tactical-color-results] .sq-refine-v3-pager a').filter({hasText:'Next'});check('next page available',await next.count()>0);if(await next.count()){await nav(p,()=>next.click());await verify(p,'desktop next page',products,columns);await nav(p,()=>p.locator('[data-sq-tactical-color-results] .sq-refine-v3-pager a').filter({hasText:'Previous'}).click());}
                const avail=p.locator('.sq-refine-v3-sidebar input[data-filter-name="filter.v.availability"][data-filter-value="1"]');check('availability checkbox exists',await avail.count()>0);if(await avail.count()){await openDetails(avail);await nav(p,()=>avail.check());await verify(p,'desktop availability combined',products,columns);check('availability retained both colors',new URL(p.url()).searchParams.getAll('sq_tactical_color').length===2);}
                const maker=p.locator('.sq-refine-v3-sidebar input[data-sq-polish-param="filter.p.vendor"]').first();if(await maker.count()){const value=await maker.getAttribute('data-sq-polish-value');await openDetails(maker);await nav(p,()=>maker.check());await verify(p,'desktop manufacturer combined',products,columns);check('manufacturer filter applied',new URL(p.url()).searchParams.get('filter.p.vendor')===value);}
              }
              await nav(p,()=>p.locator('[data-sq-tactical-color-results] a').filter({hasText:'Clear color / pattern'}).click());check(device+' clear removes custom filter',!new URL(p.url()).searchParams.has('sq_tactical_color'));check(device+' original results restored',await p.locator('.sq-refine-v3-results .product-grid').first().isVisible());check(device+' zero runtime errors',errors.length===0,errors);await shot(p,device+'-cleared');
            }catch(e){report.failures.push(device+': '+String(e));console.log('DEVICE ERROR '+e.stack);report.states.push({name:device+' failure',error:String(e),errors,state:await state(p).catch(()=>null)});await p.screenshot({path:'out/'+device+'-failure.png'}).catch(()=>{});}
            fs.writeFileSync('out/'+device+'-final.html',await p.content());await context.close();
          }
          await browser.close();fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));console.log('FINAL '+JSON.stringify({checks:report.checks.length,failures:report.failures}));if(report.failures.length)process.exitCode=1;
          EOF
          node certify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-color-pattern-final-cert
          path: out
          retention-days: 14
# certification trigger 2026-09-11 after Shopify 429 retry hardening
