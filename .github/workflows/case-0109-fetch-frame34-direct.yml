name: Case 0109 Fetch Frame34 Direct
on:
  push:
    branches: [case-0109-aerial-audit]
    paths: ['.github/workflows/case-0109-fetch-frame34-direct.yml']
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download full-resolution 01-34_AK
        run: |
          mkdir -p out
          URL='https://na-img02.ext.exlibrisgroup.%3D%3D/full/full/0/default.jpg'
          curl -fL "$URL" -o out/01-34_AK_3500x3500.jpg
          file out/01-34_AK_3500x3500.jpg
          ls -lh out/01-34_AK_3500x3500.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: case-0109-frame34-fullres
          path: out/**
          retention-days: 30
