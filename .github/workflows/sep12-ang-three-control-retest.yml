name: Sep12 ANG three-control physical retest
on:
  push:
    paths: ['.github/workflows/sep12-ang-three-control-retest.yml']
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Retest ANG controls
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
        run: |
          cat > t.mjs <<'EOF'
          import {chromium} from 'playwright';
          const labels=['Patches, Nametapes & Identification','Air Force History & Studies','Air Force Honor Guard Insignia'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));const b=await chromium.launch({headless:true});let failed=0;
          const strip=async p=>p.evaluate(()=>{for(const s of ['#PBarNextFrameWrapper','#PBarNextFrame','iframe[src*="shopifycloud/preview-bar"]'])document.querySelectorAll(s).forEach(e=>{try{e.hidePopover?.()}catch{}e.style.setProperty('display','none','important');e.style.setProperty('pointer-events','none','important')})}).catch(()=>{});
          for(const label of labels){let pass=false,last={label};for(let a=1;a<=5&&!pass;a++){const c=await b.newContext({viewport:{width:1365,height:900}}),p=await c.newPage();try{const u=new URL('/collections/air-national-guard-series',process.env.BASE);u.searchParams.set('preview_theme_id',process.env.THEME);const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:40000});if(!r||r.status()===429)throw new Error('HTTP '+(r?.status()||0));await p.locator('#MainContent').waitFor({state:'attached',timeout:15000});await p.waitForFunction(()=>!!document.querySelector('#MainContent .sq-refine-v3-sidebar'),null,{timeout:15000}).catch(()=>{});await p.locator('#MainContent details.sq-refine-v3-group').evaluateAll(ds=>ds.forEach(d=>d.open=true));await strip(p);await sleep(700);const sel='#MainContent .sq-refine-v3-choice input[type=checkbox]';const i=await p.locator(sel).evaluateAll((xs,l)=>xs.findIndex(x=>((x.getAttribute('aria-label')||x.parentElement?.querySelector('span')?.textContent||'').replace(/\s+/g,' ').trim())===l),label);if(i<0)throw new Error('label unavailable');let x=p.locator(sel).nth(i);const before=p.url(),checked=await x.isChecked();const span=x.locator('xpath=..').locator('span').first();let bb=await span.boundingBox();if(!bb)throw new Error('text bbox');await p.mouse.click(bb.x+bb.width/2,bb.y+bb.height/2);await sleep(300);x=p.locator(sel).nth(i);const textNoOp=p.url()===before&&(await x.isChecked())===checked;await strip(p);bb=await x.boundingBox();if(!bb)throw new Error('box bbox');const hit=await p.evaluate(({x,y})=>document.elementFromPoint(x,y)?.tagName||null,{x:bb.x+bb.width/2,y:bb.y+bb.height/2});if(hit!=='INPUT')throw new Error('hit '+hit);await p.mouse.click(bb.x+bb.width/2,bb.y+bb.height/2);await Promise.race([p.waitForURL(z=>z.toString()!==before,{timeout:7000}).catch(()=>{}),sleep(1400)]);const after=p.url();pass=textNoOp&&after!==before;last={label,attempt:a,status:r.status(),textNoOp,hit,after,pass};console.log(JSON.stringify(last))}catch(e){last={label,attempt:a,error:String(e),pass:false};console.log(JSON.stringify(last))}await c.close();if(!pass)await sleep(1800*a)}if(!pass)failed++}
          await b.close();if(failed)process.exitCode=2;
          EOF
          node t.mjs
