name: REFINE V3 Button 01 Filter Event Diagnostic

on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-button01-filter-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Diagnose Type and Availability event paths
        run: |
          node <<'NODE'
          const { chromium } = await import('playwright');
          const BASE='https://www.statesideqm.com';
          const URL=BASE+'/collections/accessories-gifts-collectibles?preview_theme_id=158561894555';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function ready(p){
            await p.waitForLoadState('domcontentloaded',{timeout:90000}).catch(()=>{});
            await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:60000});
            await p.waitForSelector('#MainContent .sq-refine-v3-sidebar',{state:'visible',timeout:20000});
            await sleep(2600);
          }
          async function run(label,wanted){
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
            const p=await ctx.newPage();
            await p.addInitScript(()=>{
              window.__earlyDiag=[];
              const rec=(kind,e)=>{const t=e&&e.target;window.__earlyDiag.push({kind,target:t?.tagName||'',cls:t?.className||'',type:t?.type||'',checked:t?.checked,defaultPrevented:e?.defaultPrevented||false,url:location.href})};
              window.addEventListener('click',e=>rec('window-click-capture',e),true);
              window.addEventListener('change',e=>rec('window-change-capture',e),true);
              document.addEventListener('click',e=>rec('document-click-capture',e),true);
              document.addEventListener('change',e=>rec('document-change-capture',e),true);
              addEventListener('beforeunload',e=>rec('beforeunload',e));
            });
            p.on('framenavigated',f=>{if(f===p.mainFrame())console.log('MAIN_NAV',f.url())});
            await p.goto(URL,{waitUntil:'domcontentloaded',timeout:90000});await ready(p);
            const det=p.locator('#MainContent .sq-refine-v3-sidebar details.sq-refine-v3-group').filter({has:p.locator(':scope>summary',{hasText:label})}).first();
            if(await det.getAttribute('open')===null)await det.locator(':scope>summary').click();
            const row=wanted?det.locator('.sq-refine-v3-choice',{hasText:wanted}).first():det.locator('.sq-refine-v3-choice').filter({has:p.locator('input:not(:checked)')}).first();
            const inp=row.locator('input').first();
            const before=p.url();
            const pre=await inp.evaluate(i=>({
              ownerScript:!!document.querySelector('script[data-sq-refine-v3-button01-filter-owner-v2]'),
              availabilityScript:!!document.querySelector('script[data-sq-refine-v3-button01-availability-v3]'),
              owner:window.__sqButton01WindowOwnerV2||false,
              mainConnected:document.getElementById('MainContent')?.isConnected||false,
              inputConnected:i.isConnected,
              group:i.closest('details')?.querySelector(':scope>summary')?.textContent?.trim(),
              groupAvailabilityV3:i.closest('details')?.dataset.sqButton01AvailabilityV3||null,
              rowAvailabilityV3:i.closest('label')?.dataset.sqButton01AvailabilityV3||null,
              label:i.closest('label')?.querySelector('span')?.textContent?.trim(),
              name:i.dataset.filterName||i.dataset.sqPolishParam||'',
              value:i.dataset.filterValue||i.dataset.sqPolishValue||i.value||'',
              checked:i.checked,
              outerHTML:i.closest('label')?.outerHTML||i.outerHTML,
              earlyDiag:window.__earlyDiag.slice(-20)
            }));
            let rowError=null;
            try{await row.click({noWaitAfter:true,timeout:10000});}catch(e){rowError=String(e)}
            for(let i=0;i<40&&p.url()===before;i++)await sleep(150);
            const rowState=await p.evaluate(()=>({url:location.href,owned:window.__sqButton01LastOwnedClick||null,diag:(window.__earlyDiag||[]).slice(-30)})).catch(()=>({url:p.url()}));
            console.log(JSON.stringify({label,mode:'visible-row-click',before,pre,rowError,after:p.url(),state:rowState},null,2));
            if(p.url()===before){
              await inp.evaluate(i=>{i.checked=true;i.dispatchEvent(new Event('change',{bubbles:true,cancelable:true}))}).catch(()=>{});
              for(let i=0;i<40&&p.url()===before;i++)await sleep(150);
              const changeState=await p.evaluate(()=>({url:location.href,owned:window.__sqButton01LastOwnedClick||null,diag:(window.__earlyDiag||[]).slice(-30)})).catch(()=>({url:p.url()}));
              console.log(JSON.stringify({label,mode:'explicit-change',after:p.url(),state:changeState},null,2));
            }
            await browser.close();
          }
          await run('Shop by Type',null);
          await run('Availability','In stock');
          NODE
