name: Thin Line final native-owner Chromium certification
on:
  push:
    paths:
      - '.github/workflows/thin-line-native-owner-final-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPT_OUT_INSTRUMENTATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Shopify validation
        run: |
          mkdir -p out/screens out/videos out/source out/validation out/root/screens out/root/videos out/categories/screens out/categories/videos validation-tools validation-context/sections validation-context/templates validation-context/locales
          npm install --no-save playwright@1.55.0 agent-browser yaml @shopify/theme-check-common @shopify/theme-check-node @shopify/theme-check-docs-updater
          npx playwright install --with-deps chromium
          curl --fail --retry 3 -L https://raw.githubusercontent.com/openai/plugins/main/plugins/shopify/skills/shopify-liquid/scripts/search_docs.mjs -o validation-tools/search_docs.mjs
          curl --fail --retry 3 -L https://raw.githubusercontent.com/openai/plugins/main/plugins/shopify/skills/shopify-liquid/scripts/validate.mjs -o validation-tools/validate.mjs
      - name: Validate all four changed theme files
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import YAML from 'yaml';
          const workflow=YAML.parse(fs.readFileSync('.github/workflows/thin-line-evidence-validation-gate.yml','utf8'));
          for(const name of ['Search template validation requirements','Build exact section context from deployed source','Validate Liquid sections and contextual JSON template']){
            const step=workflow.jobs.validate.steps.find(s=>s.name===name);
            if(!step?.run)throw new Error('Missing validation step '+name);
            execFileSync('bash',['-e','-c',step.run],{stdio:'inherit'});
          }
          JS
      - name: Inspect deployed Thin Line in agent-browser
        run: |
          npx agent-browser --session thin-native-final open 'https://www.statesideqm.com/collections/thin-line?preview_theme_id=158561894555'
          npx agent-browser --session thin-native-final snapshot -i > out/agent-browser-snapshot.txt
          npx agent-browser --session thin-native-final screenshot out/screens/agent-browser.png
          npx agent-browser --session thin-native-final close
      - name: Build fresh root and category regression suites
        run: |
          cat > root-native-case.txt <<'JS'
          {
            const row={name:'root-native-type-filter',checks:[],errors:[],documents:[]};
            const context=await browser.newContext({viewport:{width:1440,height:1000},recordVideo:{dir:'out/videos',size:{width:1440,height:1000}}});
            const page=await context.newPage();await instrument(page);
            page.on('pageerror',e=>row.errors.push(String(e)));
            page.on('response',r=>{try{if(r.request().isNavigationRequest()&&r.request().frame()===page.mainFrame())row.documents.push({url:r.url(),status:r.status()});}catch(_){}});
            try{
              await page.goto(base+'?preview_theme_id='+preview,{waitUntil:'domcontentloaded',timeout:90000});await ready(page);
              const group=page.locator('.sq-refine-v3-group').filter({has:page.locator('summary',{hasText:/^Shop by Type$/})}).first();
              if(!(await group.getAttribute('open')))await group.locator('summary').click();
              const option=group.locator('input[data-filter-name="filter.p.product_type"],input[data-sq-polish-param="filter.p.product_type"]').first();
              const value=(await option.getAttribute('data-filter-value'))||(await option.getAttribute('data-sq-polish-value'));
              await Promise.all([page.waitForURL(u=>u.searchParams.get('filter.p.product_type')===value,{timeout:90000,waitUntil:'domcontentloaded'}),option.click({noWaitAfter:true})]);
              await ready(page);await page.waitForTimeout(7000);row.final=await state(page);row.type=value;const s=row.final,u=new URL(s.url);
              check(row,'Root native filter remains stable without legacy-family redirects',u.pathname==='/collections/thin-line'&&u.searchParams.get('filter.p.product_type')===value&&!u.searchParams.has('sq_type_family')&&row.documents.length<=3&&row.documents.every(d=>!new URL(d.url).searchParams.has('sq_type_family')),{url:s.url,documents:row.documents});
              check(row,'Root native owner is deployed',s.nativeTypeOwner);
              check(row,'Filtered root has one populated unique grid',s.grids===1&&s.sidebar===1&&s.cards>0&&s.duplicates===0,{cards:s.cards,grids:s.grids,duplicates:s.duplicates});
              check(row,'Filtered root never displays old buttons',s.trace.length>0&&s.trace.every(f=>f.legacy===0),s.trace);
              check(row,'Filtered root footer does not intrude during load',s.footerFrames.length===0,s.footerFrames);
              check(row,'All root filter document requests succeed',row.documents.length>0&&row.documents.every(d=>d.status===200||[301,302,303,307,308].includes(d.status)),row.documents);
              check(row,'No root filter runtime exceptions',row.errors.length===0,row.errors);
              await page.screenshot({path:'out/screens/root-native-type-filter.png',fullPage:true});
            }catch(e){row.exception=String(e);check(row,'Root native filter completes',false,String(e));row.last=await state(page).catch(()=>null);await page.screenshot({path:'out/screens/root-native-type-filter-failure.png',fullPage:true}).catch(()=>{});}
            row.pass=row.checks.every(c=>c.ok);results.push(row);const video=page.video();await page.close();await context.close();await video.saveAs('out/videos/root-native-type-filter.webm');console.log(row.name,row.pass,JSON.stringify(row.checks));
          }
          JS
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import YAML from 'yaml';
          function generate(workflowPath,stepName,lastInvocation){
            const w=YAML.parse(fs.readFileSync(workflowPath,'utf8'));
            const run=w.jobs.certify.steps.find(s=>s.name===stepName)?.run;
            if(!run||!run.trimEnd().endsWith(lastInvocation))throw new Error('Generator source changed '+workflowPath);
            execFileSync('bash',['-e','-c',run.trimEnd().slice(0,-lastInvocation.length)],{stdio:'inherit'});
          }
          generate('.github/workflows/thin-line-final-loading-cert-0911.yml','Repeat full Chromium suite with footer regression test','node thin-line-final-cert.mjs');
          let root=fs.readFileSync('thin-line-final-cert.mjs','utf8');
          if(!root.includes('return {footerFrames:')||!root.includes('for(const nojs of [false,true])'))throw new Error('Root test anchors changed');
          root=root.replace('return {footerFrames:','return {nativeTypeOwner:window.__sqThinLineNativeTypeOwner===true,footerFrames:');
          root=root.replace("check(row,'Loading-space patch deployed',s.spaceMarker);","check(row,'Loading-space patch deployed',s.spaceMarker);check(row,'Native type owner deployed',s.nativeTypeOwner);");
          root=root.replace('for(const nojs of [false,true])',fs.readFileSync('root-native-case.txt','utf8')+'\nfor(const nojs of [false,true])');
          root=root.replaceAll('out/','out/root/');fs.writeFileSync('thin-root-complete.mjs',root);fs.writeFileSync('out/root/test-source.mjs',root);
          generate('.github/workflows/thin-line-final-integrated-cert.yml','Repeat all 14 category scenarios with HTTP diagnostics','node thin-child-final-cert.mjs');
          let child=fs.readFileSync('thin-child-final-cert.mjs','utf8');
          if(!child.includes('return {url:location.href,theme:')||!child.includes("check(row,'No runtime exceptions'"))throw new Error('Child test anchors changed');
          child=child.replace('return {url:location.href,theme:','return {nativeTypeOwner:window.__sqThinLineNativeTypeOwner===true,url:location.href,theme:');
          child=child.replace("check(row,'Child prepaint patch deployed',s.marker);","check(row,'Child prepaint patch deployed',s.marker);check(row,'Child native type owner deployed',s.nativeTypeOwner);");
          child=child.replace("check(row,'No runtime exceptions',row.errors.length===0,row.errors);","check(row,'No obsolete type-family redirect or loop',row.documents.length<=3&&row.documents.every(d=>!new URL(d.url).searchParams.has('sq_type_family')),row.documents);check(row,'No runtime exceptions',row.errors.length===0,row.errors);");
          child=child.replaceAll('out/','out/categories/');fs.writeFileSync('thin-category-complete.mjs',child);fs.writeFileSync('out/categories/test-source.mjs',child);
          JS
          node --check thin-root-complete.mjs
          node --check thin-category-complete.mjs
      - name: Chromium root cold-load pagination and native-type checks
        id: root
        continue-on-error: true
        run: node thin-root-complete.mjs
      - name: Chromium all categories mobile and native-type checks
        id: categories
        continue-on-error: true
        run: node thin-category-complete.mjs
      - name: Enforce combined browser and source gate
        if: always()
        env:
          ROOT_OUTCOME: ${{ steps.root.outcome }}
          CATEGORY_OUTCOME: ${{ steps.categories.outcome }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          assert.equal(process.env.ROOT_OUTCOME,'success');assert.equal(process.env.CATEGORY_OUTCOME,'success');
          const root=JSON.parse(fs.readFileSync('out/root/report.json','utf8'));
          const categories=JSON.parse(fs.readFileSync('out/categories/report.json','utf8'));
          assert.equal(root.pass,true);assert.equal(categories.pass,true);assert.equal(categories.results.length,14);
          assert(root.results.some(r=>r.name==='root-native-type-filter'&&r.pass));
          const names=['sections/sq-thin-stabrite-subcategories.liquid','sections/sq-thin-line-loading-space.liquid','templates/collection.thin-stabrite-parent.json','sections/sq-thin-stabrite-type-browser.liquid'];
          const files=names.map(filename=>({filename,md5:crypto.createHash('md5').update(fs.readFileSync(filename)).digest('hex')}));
          assert.equal(files[0].md5,root.sectionMd5);assert.equal(files[3].md5,categories.sourceMd5);
          const checks=[...root.results,...categories.results].flatMap(r=>r.checks||[]);assert(checks.length>0&&checks.every(c=>c.ok));
          const report={pass:true,checkedAt:new Date().toISOString(),gateRun:process.env.GITHUB_RUN_ID,gateCommit:process.env.GITHUB_SHA,rootRun:process.env.GITHUB_RUN_ID,categoryRun:process.env.GITHUB_RUN_ID,themeId:158561894555,publication:'Unpublished working draft; no live publication performed',checksPassed:checks.length,files};
          fs.writeFileSync('out/final-gate.json',JSON.stringify(report,null,2));fs.writeFileSync('out/deployment-manifest.json',JSON.stringify({commit:process.env.GITHUB_SHA,files},null,2));console.log(JSON.stringify(report,null,2));
          JS
      - name: Upload complete Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thin-line-native-owner-final-cert
          path: out
          retention-days: 14
