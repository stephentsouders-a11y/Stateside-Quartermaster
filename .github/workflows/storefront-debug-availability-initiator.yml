name: Sep15 Air Force availability initiator trace
on:
  push:
    paths:
      - '.github/workflows/storefront-debug-availability-initiator.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Trace Air Force child availability initiators
        env:
          BASE: https://www.statesideqm.com
          THEME: '158770561179'
        run: |
          cat > trace.mjs <<'EOF'
          import {chromium} from 'playwright';import fs from 'fs';
          const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage(),cdp=await c.newCDPSession(p);await cdp.send('Network.enable');
          const events=[];
          cdp.on('Network.requestWillBeSent',e=>{const u=String(e.request?.url||'');if(/filter\.v\.availability|u-s-air-force-(flags-displays-memorials|gifts-collectibles|patches-identification|insignia-ranks-awards|uniforms-accessories)/i.test(u))events.push({kind:'cdp-request',url:u,type:e.type,documentURL:e.documentURL,initiator:e.initiator,redirectResponse:e.redirectResponse?{url:e.redirectResponse.url,status:e.redirectResponse.status}:null})});
          cdp.on('Network.responseReceived',e=>{const u=String(e.response?.url||'');if(/filter\.v\.availability|u-s-air-force-(flags-displays-memorials|gifts-collectibles|patches-identification|insignia-ranks-awards|uniforms-accessories)/i.test(u))events.push({kind:'response',url:u,status:e.response.status,type:e.type})});
          await p.addInitScript(()=>{
            window.__sqAfOrigin=[];const rec=(kind,data)=>window.__sqAfOrigin.push({t:performance.now(),kind,...data,stack:new Error().stack});
            const of=window.fetch;window.fetch=function(input,init){const u=String(typeof input==='string'?input:input?.url||input);if(/filter\.v\.availability|u-s-air-force-(flags-displays-memorials|gifts-collectibles|patches-identification|insignia-ranks-awards|uniforms-accessories)/i.test(u))rec('fetch',{url:u});return of.apply(this,arguments)};
            const xo=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){if(/filter\.v\.availability|u-s-air-force-(flags-displays-memorials|gifts-collectibles|patches-identification|insignia-ranks-awards|uniforms-accessories)/i.test(String(u)))rec('xhr',{method:m,url:String(u)});return xo.apply(this,arguments)};
          });
          const u=new URL('/collections/products-built-for-the-line-u-s-air-force',process.env.BASE);u.searchParams.set('preview_theme_id',process.env.THEME);u.searchParams.set('_sq_origin_trace','1');let status=null,error=null;try{const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:60000});status=r?.status()??null;await p.waitForTimeout(12000)}catch(e){error=String(e)}
          const state=await p.evaluate(()=>({title:document.title,h1:document.querySelector('#MainContent h1,h1')?.textContent?.trim()||null,origin:window.__sqAfOrigin||[],scripts:[...document.scripts].map(s=>({src:s.src||null,markers:[...s.attributes].filter(a=>a.name.startsWith('data-sq')).map(a=>a.name+'='+a.value)})).filter(x=>x.src||x.markers.length)})).catch(e=>({evalError:String(e)}));
          fs.mkdirSync('trace-out',{recursive:true});fs.writeFileSync('trace-out/trace.json',JSON.stringify({status,error,finalUrl:p.url(),events,state},null,2));console.log(JSON.stringify({status,error,finalUrl:p.url(),events,state},null,2));await b.close();
          EOF
          node trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep15-air-force-availability-initiator
          path: trace-out
          retention-days: 7
