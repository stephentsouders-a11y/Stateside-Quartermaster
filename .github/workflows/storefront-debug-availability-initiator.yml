name: Storefront debug - availability initiator
on:
  push:
    paths:
      - '.github/workflows/storefront-debug-availability-initiator.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Trace initiator
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
        run: |
          cat > trace.mjs <<'EOF'
          import {chromium} from 'playwright';import fs from 'fs';
          const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:1440,height:900}}),p=await c.newPage(),cdp=await c.newCDPSession(p);await cdp.send('Network.enable');
          const events=[];cdp.on('Network.requestWillBeSent',e=>{if(e.type==='Document'||String(e.request?.url||'').includes('filter.v.availability'))events.push({url:e.request?.url,type:e.type,documentURL:e.documentURL,initiator:e.initiator,redirectResponse:e.redirectResponse?{url:e.redirectResponse.url,status:e.redirectResponse.status}:null})});
          const u=new URL('/collections/apparel',process.env.BASE);u.searchParams.set('preview_theme_id',process.env.THEME);let status=null,error=null;try{const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:60000});status=r?.status()??null;await p.waitForTimeout(5000)}catch(e){error=String(e)}
          fs.mkdirSync('trace-out',{recursive:true});fs.writeFileSync('trace-out/trace.json',JSON.stringify({status,error,finalUrl:p.url(),events},null,2));await b.close();
          EOF
          node trace.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: availability-initiator-trace
          path: trace-out
          retention-days: 7
