# Fresh post-patch run: manufacturer enumeration bypass + no-network Air Force root audit
name: Sep15 Air Force repeated runtime verification
on:
  push:
    paths:
      - '.github/workflows/storefront-debug-availability-initiator.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify Air Force three times
        env:
          BASE: https://www.statesideqm.com
          THEME: '158770561179'
        run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright'; import fs from 'fs';
          const browser=await chromium.launch({headless:true}); const rows=[];
          for(let attempt=1;attempt<=3;attempt++){
            const context=await browser.newContext({viewport:{width:1440,height:1000}}); const page=await context.newPage();
            const rec={attempt,status:null,requests:[],failures:[]};
            page.on('response',r=>{const u=r.url();if(r.status()>=400||/filter\.v\.availability=1|products\.json/.test(u))rec.requests.push({status:r.status(),url:u})});
            const u=new URL('/collections/products-built-for-the-line-u-s-air-force',process.env.BASE);u.searchParams.set('preview_theme_id',process.env.THEME);u.searchParams.set('_sq_af_verify',String(attempt));
            try{
              const r=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:60000}); rec.status=r?.status()??null; await page.waitForTimeout(10000);
              rec.title=await page.title(); rec.h1=await page.locator('#MainContent h1,h1').first().innerText().catch(()=>null);
              rec.loadState=await page.locator('[data-sqbfl-load-state]').first().getAttribute('data-sqbfl-load-state').catch(()=>null);
              rec.nodes=await page.evaluate(()=>{const rx=/checking items|loading items|counting items|building the customer-facing product tree|organizing .* products/i;return [...document.querySelectorAll('#MainContent *')].filter(e=>e.children.length===0&&rx.test((e.textContent||'').trim())).map(e=>(e.textContent||'').trim()).slice(0,30)});
              rec.rate429=rec.requests.filter(x=>x.status===429).length;
              rec.status5xx=rec.requests.filter(x=>x.status>=500).length;
              rec.overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+4).catch(()=>false);
              if(rec.status!==200) rec.failures.push('HTTP_'+rec.status);
              if(!rec.h1) rec.failures.push('MISSING_H1');
              if(rec.loadState&&rec.loadState!=='ready') rec.failures.push('LOAD_STATE_'+rec.loadState);
              if(rec.nodes.length) rec.failures.push('UNRESOLVED_LOADING');
              if(rec.rate429) rec.failures.push('BACKGROUND_429_'+rec.rate429);
              if(rec.overflow) rec.failures.push('HORIZONTAL_OVERFLOW');
              await page.screenshot({path:`af-${attempt}.png`,fullPage:true}).catch(()=>{});
            }catch(e){rec.failures.push('EXCEPTION');rec.error=String(e)}
            rec.pass=rec.failures.length===0; rows.push(rec); console.log(JSON.stringify(rec)); await context.close();
            if(attempt<3) await new Promise(r=>setTimeout(r,18000));
          }
          await browser.close(); fs.mkdirSync('out',{recursive:true}); fs.writeFileSync('out/results.json',JSON.stringify(rows,null,2)); if(rows.some(r=>!r.pass)) process.exitCode=2;
          EOF
          node verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep15-air-force-repeated-runtime-verification
          path: |
            out
            af-*.png
          retention-days: 7
