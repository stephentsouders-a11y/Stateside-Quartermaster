name: Category source priority Chromium
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/category-source-priority.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: category-source-priority
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install chromium
      - name: Run existing focused source diagnosis
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('.github/workflows/category-source-diagnostic.yml','utf8');
          const m=s.match(/cat > \.category-source\.mjs <<'NODE'\n([\s\S]*?)\n          NODE/);
          if(!m)throw new Error('Diagnostic source block missing');
          fs.writeFileSync('.category-source.mjs',m[1].replace(/^          /gm,''));
          NODE
          node .category-source.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-source-priority
          path: category-source-diagnostic
          retention-days: 7
