name: Zippos Refine Every Choice Chromium Cert macOS 0911
on:
  push:
    paths:
      - '.github/workflows/zippos-refine-every-choice-cert-macos-0911.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Exhaustive Refine Products Chromium certification
        run: |
          mkdir -p out/screens
          cat > cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const BASE='https://www.statesideqm.com/collections/zippos-lighters-torches';
          const PREVIEW='158561894555';
          const browser=await chromium.launch({headless:true});
          const report={browser:browser.version(),cases:[]};
          const context=await browser.newContext({viewport:{width:1440,height:1000}});
          async function settle(page){await page.waitForLoadState('domcontentloaded',{timeout:90000}).catch(()=>{});await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true'||document.querySelector('#MainContent')?.dataset.sqRefineV3Error,{timeout:30000}).catch(()=>{});await page.waitForTimeout(800)}
          async function snap(page){return page.evaluate(()=>{const m=document.querySelector('#MainContent');const vis=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'};const grids=[...m.querySelectorAll('.product-grid')].filter(vis);const products=grids.flatMap(g=>[...g.querySelectorAll(':scope > .product-grid__item')].filter(vis).map(c=>c.querySelector('a[href*="/products/"]')?.pathname||'')).filter(Boolean);const groups=[...document.querySelectorAll('.sq-refine-v3-sidebar .sq-refine-v3-group')].map((d,gi)=>({gi,label:(d.querySelector(':scope>summary')?.textContent||'').trim(),choices:[...d.querySelectorAll('input[data-kind]')].map((i,ci)=>({ci,label:(i.closest('label')?.querySelector('span')?.textContent||'').trim(),kind:i.dataset.kind||'',target:i.dataset.target||'',name:i.dataset.filterName||'',value:i.dataset.filterValue||'',checked:i.checked}))}));return{url:location.href,ready:m?.dataset.sqRefineV3Ready||'',error:m?.dataset.sqRefineV3Error||'',grids:grids.length,products,groups}})}
          async function fresh(preview=true){const p=await context.newPage();const errs=[];p.on('pageerror',e=>errs.push(String(e)));const u=new URL(BASE);if(preview)u.searchParams.set('preview_theme_id',PREVIEW);const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:90000});await settle(p);return{p,errs,status:r?.status()||0}}
          const b=await fresh(true),base=await snap(b.p);await b.p.screenshot({path:'out/screens/base.png',fullPage:true});await b.p.close();let n=0;
          for(const g of base.groups){for(const c of g.choices){n++;const r=await fresh(true),p=r.p,e={n,group:g.label,label:c.label,kind:c.kind,status:r.status,errors:r.errs};try{const loc=p.locator('.sq-refine-v3-sidebar .sq-refine-v3-group').nth(g.gi).locator('input[data-kind]').nth(c.ci);await Promise.all([p.waitForNavigation({waitUntil:'domcontentloaded',timeout:90000}).catch(()=>null),loc.click({force:true})]);await settle(p);const a=await snap(p),u=new URL(a.url);e.navigationOk=c.kind==='structural'?u.pathname===new URL(c.target,BASE).pathname:u.searchParams.getAll(c.name).includes(c.value);e.checkedOk=a.groups.some(x=>x.choices.some(y=>y.checked&&y.label===c.label));e.surfaceOk=a.grids===1&&a.products.length>0;e.v3Ok=a.ready==='true'&&!a.error;e.pass=e.navigationOk&&e.checkedOk&&e.surfaceOk&&e.v3Ok&&!e.errors.length;if(!e.pass)await p.screenshot({path:`out/screens/fail-${n}.png`,fullPage:true})}catch(err){e.exception=String(err);e.pass=false}report.cases.push(e);await p.close()}}
          const l=await fresh(false),live=await snap(l.p);await l.p.screenshot({path:'out/screens/live.png',fullPage:true});await l.p.close();report.live={status:l.status,errors:l.errs,...live};report.summary={choices:report.cases.length,passed:report.cases.filter(x=>x.pass).length,failed:report.cases.filter(x=>!x.pass).length,previewReady:base.ready,previewGrids:base.grids,liveReady:live.ready,liveGrids:live.grids};fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));fs.writeFileSync('out/failures.json',JSON.stringify(report.cases.filter(x=>!x.pass),null,2));console.log(JSON.stringify(report.summary,null,2));await browser.close();if(report.summary.failed||base.ready!=='true'||base.grids!==1||live.grids!==1)process.exit(2)
          EOF
          node cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zippos-refine-every-choice-cert-macos-0911
          path: out
          retention-days: 7
