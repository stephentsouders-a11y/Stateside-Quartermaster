name: Shard 0 isolated retest
on:
  push:
    paths:
      - '.github/workflows/shard0-isolated-retest.yml'
permissions:
  contents: read
jobs:
  retest:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { key: accessories-root, route: '/collections/accessories-gifts-collectibles' }
          - { key: army-gray-coyote, route: '/collections/products-built-for-the-line-u-s-army?sq_color_pattern=GRAY%2FCOYOTE+BROWN' }
          - { key: army-silver-carbon, route: '/collections/products-built-for-the-line-u-s-army?sq_color_pattern=Silver+Carbon+Fiber' }
          - { key: army-flags, route: '/collections/products-built-for-the-line-u-s-army?sq_bfl_category=Flags%2C+Displays+%26+Memorials' }
          - { key: arng-redemption, route: '/collections/army-national-guard-series?filter.p.vendor=Redemption+Tactical' }
          - { key: arng-blue, route: '/collections/army-national-guard-series?sq_color_pattern=Blue' }
          - { key: arng-gold, route: '/collections/army-national-guard-series?sq_color_pattern=Gold' }
          - { key: arng-ocp, route: '/collections/army-national-guard-series?sq_color_pattern=Ocp' }
          - { key: arng-tricolor, route: '/collections/army-national-guard-series?sq_color_pattern=TRI-COLOR+DESERT' }
          - { key: arng-field-gear, route: '/collections/army-national-guard-series?sq_bfl_category=Field+Gear%2C+Packs+%26+Equipment' }
          - { key: af-gift-store, route: '/collections/products-built-for-the-line-u-s-air-force?sq_ang_mirror=1&filter.p.vendor=The+Military+Gift+Store' }
          - { key: af-gray, route: '/collections/products-built-for-the-line-u-s-air-force?sq_ang_mirror=1&sq_color_pattern=Gray' }
          - { key: af-maroon, route: '/collections/products-built-for-the-line-u-s-air-force?sq_ang_mirror=1&sq_color_pattern=Maroon' }
          - { key: af-silver, route: '/collections/products-built-for-the-line-u-s-air-force?sq_ang_mirror=1&sq_color_pattern=Silver' }
          - { key: ang-awards, route: '/collections/air-national-guard-series?sq_bfl_category=Awards%2C+Medals+%26+Ribbons' }
          - { key: sg-jupiter, route: '/collections/state-guard-series?sq_maker=Jupiter+Gear' }
          - { key: sg-brown-tan, route: '/collections/state-guard-series?sq_color_pattern=Brown+%2F+Tan' }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Retest exact route
        env:
          ROUTE: ${{ matrix.route }}
          KEY: ${{ matrix.key }}
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const route=process.env.ROUTE,key=process.env.KEY,base='https://www.statesideqm.com',theme='158561894555';
          const browser=await chromium.launch({headless:true}); let finalResult=null;
          for(let attempt=1;attempt<=2;attempt++){
            const ctx=await browser.newContext({viewport:{width:1440,height:1100}}),page=await ctx.newPage(); const u=new URL(route,base);u.searchParams.delete('filter.v.availability');u.searchParams.set('preview_theme_id',theme); const start=Date.now();let status=null,error=null;
            try{const r=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:30000});status=r?.status()??null}catch(e){error=String(e)}
            let usable=null,state={bad:true,loading:false,visible:false,availability:0,broken:0,overflow:false};
            if(status===200&&!error){for(let i=0;i<35;i++){state=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),t=(m?.innerText||'').replace(/\s+/g,' ').trim(),title=document.title;const visible=[...(m?.querySelectorAll('a,.product-card,.product-grid__item,.sqbfl-card,.sq-subcategory-card,.sg-entity,.sq-afg-branch-card,.sq-third-level__type,.sq-ts-match-card,.sq-type-family-product,.sqaca-card,.sqaca-all')||[])].some(e=>{const r=e.getBoundingClientRect();return r.width>30&&r.height>20});return{bad:/just a moment|something went wrong|internal server error|there was a problem/i.test(title+' '+t),loading:/loading items|checking items|tree unavailable|building the customer-facing product tree|loading all products/i.test(t),visible,availability:[...(m?.querySelectorAll('a[href*="filter.v.availability"]')||[])].length,broken:[...(m?.querySelectorAll('img')||[])].filter(x=>x.complete&&x.naturalWidth===0).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4}});if(!state.bad&&!state.loading&&state.visible){usable=Date.now()-start;break}await page.waitForTimeout(200)}}
            const failed=status!==200||!!error||state.bad||state.loading||!state.visible||usable===null||usable>5000||state.availability>0||state.broken>0||state.overflow;finalResult={key,route,attempt,status,error,usableMs:usable,failed,...state};console.log(JSON.stringify(finalResult));await ctx.close();if(!failed)break;if(attempt===1)await new Promise(r=>setTimeout(r,12000));
          }
          await browser.close();if(finalResult?.failed)process.exitCode=2;
          EOF
          node check.mjs
