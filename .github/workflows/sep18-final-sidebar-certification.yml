name: Sep18 final State Guard sidebar certification
on:
  push:
    paths:
      - '.github/workflows/sep18-final-sidebar-certification.yml'
      - '.github/scripts/sep18-final-sidebar-route.mjs'
      - '.github/scripts/sep18-final-sidebar-aggregate.mjs'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - id: discover
        run: node .github/scripts/sep18-sg-sidebar-discover-v3.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sep18-final-sidebar-discovery-${{ github.run_id }}
          path: sep18-sg-sidebar-discovery/
          retention-days: 14
  audit:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEY: ${{ matrix.key }}
      LABEL: ${{ matrix.label }}
      ROUTE: ${{ matrix.route }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/scripts/sep18-final-sidebar-route.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep18-final-sidebar-${{ matrix.key }}-${{ github.run_id }}
          path: sep18-final-sidebar-${{ matrix.key }}/
          if-no-files-found: warn
          retention-days: 14
  aggregate:
    needs: [discover, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sep18-final-sidebar-*-${{ github.run_id }}
          path: sep18-final-sidebar-combined
      - run: node .github/scripts/sep18-final-sidebar-aggregate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep18-final-sidebar-certification-${{ github.run_id }}
          path: sep18-final-sidebar-final/
          retention-days: 14
