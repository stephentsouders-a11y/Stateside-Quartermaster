name: Storefront Chromium video certification
# strict full PBTL root rerun after scheduler fix 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/storefront-chromium-video-certification.yml'
permissions:
  contents: read
jobs:
  certify:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { slug: home, path: / }
          - { slug: state-guard, path: /collections/state-guard-series }
          - { slug: state-guard-alabama, path: /collections/state-guard-series-alabama }
          - { slug: army, path: /collections/products-built-for-the-line-u-s-army }
          - { slug: arng, path: /collections/army-national-guard-series }
          - { slug: air-force, path: /collections/products-built-for-the-line-u-s-air-force }
          - { slug: ang, path: /collections/air-national-guard-series }
          - { slug: navy, path: /collections/products-built-for-the-line-u-s-navy }
          - { slug: marines, path: /collections/products-built-for-the-line-u-s-marine-corps }
          - { slug: coast-guard, path: /collections/products-built-for-the-line-u-s-coast-guard }
          - { slug: space-force, path: /collections/products-built-for-the-line-u-s-space-force }
          - { slug: afg, path: /collections/armed-forces-gear }
          - { slug: thin-line, path: /collections/thin-line }
          - { slug: thin-yellow, path: '/collections/thin-line-shop-thin-yellow-line?sq_type_family=First%20Responder%20Patches&sort_by=title-ascending' }
          - { slug: sta-brite, path: /collections/sta-brite-insignia }
          - { slug: law, path: /collections/law-enforcement-corrections }
          - { slug: fire-ems-sar, path: /collections/firefighting-ems-search-rescue }
          - { slug: rotc, path: /collections/rotc-series }
          - { slug: jrotc, path: /collections/jrotc-series }
          - { slug: msa, path: /collections/military-schools-academies }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Record and certify route
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
          SLUG: ${{ matrix.slug }}
          ROUTE: ${{ matrix.path }}
        run: |
          cat > certify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('out/videos',{recursive:true});
          fs.mkdirSync('out/screens',{recursive:true});
          const results=[];
          const HARD_LOAD_LIMIT_MS=5000;
          const TARGET_LOAD_MS=3500;
          const lineRoots=new Set(['army','arng','air-force','ang','navy','marines','coast-guard','space-force']);
          async function run(device,viewport){
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport,recordVideo:{dir:'out/videos',size:viewport}});
            const page=await ctx.newPage(); page.setDefaultNavigationTimeout(60000);
            const u=new URL(process.env.ROUTE,process.env.BASE); u.searchParams.delete('filter.v.availability'); u.searchParams.set('preview_theme_id',process.env.THEME);
            await page.waitForTimeout(2500);
            const start=Date.now(); let status=null,error=null;
            try{const r=await page.goto(u.toString(),{waitUntil:'domcontentloaded'});status=r?.status()??null}catch(e){error=String(e)}
            let usableMs=null;
            for(let i=0;i<60;i++){
              const s=await page.evaluate(()=>{const main=document.querySelector('#MainContent');const visibleEl=e=>{if(!e)return false;const cs=getComputedStyle(e),r=e.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>30&&r.height>20};const visible=[...(main?.querySelectorAll('a,.product-card,.product-grid__item,.sq-subcategory-card,.sqbfl-card,.sg-entity,.sq-afg-branch-card,.sq-ts-match-card,.sq-type-family-product')||[])].some(visibleEl);const visibleLoading=[...(main?.querySelectorAll('[data-sqbfl-load-state],p,small,span,div')||[])].filter(visibleEl).some(e=>/loading items|checking items|tree unavailable|building the customer-facing product tree/i.test((e.innerText||'').trim()));const text=(main?.innerText||'').replace(/\s+/g,' ').trim();const blocked=/just a moment/i.test(document.title+' '+text);return{blocked,loading:visibleLoading,visible}}).catch(()=>({blocked:false,loading:true,visible:false}));
              if(!s.blocked&&!s.loading&&s.visible){usableMs=Date.now()-start;break} await page.waitForTimeout(250);
            }
            await page.waitForTimeout(750);
            await page.evaluate(()=>window.scrollTo({top:Math.min(document.body.scrollHeight,1000),behavior:'smooth'})).catch(()=>{}); await page.waitForTimeout(750); await page.evaluate(()=>window.scrollTo({top:0,behavior:'smooth'})).catch(()=>{}); await page.waitForTimeout(500);
            const details=await page.evaluate(()=>{const main=document.querySelector('#MainContent');const text=(main?.innerText||'').replace(/\s+/g,' ').trim();const vis=e=>!!e&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden'&&e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0;const side=[...(main?.querySelectorAll('.sq-global-refine-sidebar')||[])].filter(vis);const cards=[...(main?.querySelectorAll('.sq-subcategory-card,.sqbfl-card,.sg-entity,.sq-afg-branch-card,.sq-ts-match-card,.product-card,.product-grid__item,.sq-type-family-product')||[])].filter(vis).filter(e=>!side.some(s=>s.contains(e)));const first=cards.slice(0,3).map(e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height}});const visibleLoading=[...(main?.querySelectorAll('[data-sqbfl-load-state],p,small,span,div')||[])].filter(vis).some(e=>/loading items|checking items|tree unavailable|building the customer-facing product tree/i.test((e.innerText||'').trim()));return{title:document.title,url:location.href,challenge:/just a moment/i.test(document.title+' '+text),errorPage:/something went wrong|internal server error|there was a problem/i.test(document.title+' '+text),loading:visibleLoading,sidebarCount:side.length,cardCount:cards.length,sameRow:first.length>=3&&Math.max(...first.map(x=>x.y))-Math.min(...first.map(x=>x.y))<8,availabilityLinks:[...(main?.querySelectorAll('a[href*="filter.v.availability"]')||[])].map(a=>a.getAttribute('href')).slice(0,20),brokenImages:[...(main?.querySelectorAll('img')||[])].filter(i=>i.complete&&i.naturalWidth===0).map(i=>({alt:i.alt,src:i.currentSrc||i.src})).slice(0,20),overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,stateGuardPromoBeforeGrid:(()=>{const p=document.querySelector('[data-sq-state-guard-merch-feature]'),g=document.querySelector('[data-sq-state-guard-root] .sg-entity-grid');return !!(p&&g&&(p.compareDocumentPosition(g)&Node.DOCUMENT_POSITION_FOLLOWING))})(),text:text.slice(0,3500)}}).catch(e=>({extractError:String(e)}));
            await page.screenshot({path:`out/screens/${process.env.SLUG}-${device}.png`,fullPage:true}).catch(()=>{});
            const video=page.video(); await page.close(); await ctx.close(); let videoPath=null; if(video){const p=await video.path().catch(()=>null);if(p){videoPath=`out/videos/${process.env.SLUG}-${device}.webm`;fs.copyFileSync(p,videoPath)}}
            const hardSlow=usableMs===null||usableMs>HARD_LOAD_LIMIT_MS;
            const targetSlow=usableMs===null||usableMs>TARGET_LOAD_MS;
            const desktopGridFailure=device==='desktop'&&lineRoots.has(process.env.SLUG)&&(details.sidebarCount!==1||details.cardCount<3||details.sameRow!==true);
            results.push({device,status,error,usableMs,hardSlow,targetSlow,desktopGridFailure,videoPath,...details}); await browser.close();
          }
          await run('desktop',{width:1440,height:1100}); await new Promise(r=>setTimeout(r,5000)); await run('mobile',{width:390,height:844});
          fs.writeFileSync('out/report.json',JSON.stringify({slug:process.env.SLUG,route:process.env.ROUTE,hardLoadLimitMs:HARD_LOAD_LIMIT_MS,targetLoadMs:TARGET_LOAD_MS,results},null,2));
          console.log(JSON.stringify({slug:process.env.SLUG,results:results.map(x=>({device:x.device,status:x.status,usableMs:x.usableMs,hardSlow:x.hardSlow,targetSlow:x.targetSlow,desktopGridFailure:x.desktopGridFailure,challenge:x.challenge,errorPage:x.errorPage,loading:x.loading,sidebar:x.sidebarCount,cards:x.cardCount,sameRow:x.sameRow,availability:x.availabilityLinks?.length||0,broken:x.brokenImages?.length||0,overflow:x.overflowX,stateGuardPromoBeforeGrid:x.stateGuardPromoBeforeGrid,video:x.videoPath}))},null,2));
          const failed=results.some(x=>x.status!==200||x.challenge||x.errorPage||x.loading||x.hardSlow||x.desktopGridFailure||x.overflowX||(x.brokenImages?.length||0)>0||(x.availabilityLinks?.length||0)>0||x.stateGuardPromoBeforeGrid===true);
          if(failed)process.exitCode=2;
          EOF
          node certify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-cert-${{ matrix.slug }}
          path: out
          retention-days: 7
