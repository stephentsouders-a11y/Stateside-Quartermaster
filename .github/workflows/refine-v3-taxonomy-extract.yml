name: Refine V3 taxonomy extract
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/scripts/extract-root-taxonomy-v3.mjs'
      - '.github/scripts/refine-v3-semantic-taxonomy-audit.mjs'
      - '.github/workflows/refine-v3-taxonomy-extract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-map:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Extract legacy structural source map
        run: node .github/scripts/extract-root-taxonomy-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-taxonomy-source-map
          path: taxonomy-v3/
          retention-days: 7
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2,3,4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify current V3 semantic hierarchy
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 5
        run: node .github/scripts/refine-v3-semantic-taxonomy-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-semantic-${{ matrix.shard }}
          path: taxonomy-v3/
          retention-days: 7
