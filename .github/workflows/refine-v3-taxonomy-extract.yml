name: Refine V3 taxonomy extract
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/scripts/extract-root-taxonomy-v3.mjs'
      - '.github/workflows/refine-v3-taxonomy-extract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/scripts/extract-root-taxonomy-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-taxonomy
          path: taxonomy-v3/
          retention-days: 7
