name: Sep18 State Guard duplicate fetch scope verification
on:
  push:
    paths:
      - '.github/workflows/sep18-sg-fetch-scope-verify.yml'
      - '.github/scripts/sep18-sg-fetch-scope-verify.mjs'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { key: ohio-uniforms, label: "Ohio Uniforms", route: "/collections/state-guard-series-ohio?sg_category=uniforms" }
          - { key: ohio-tactical, label: "Ohio Tactical", route: "/collections/state-guard-series-ohio?sg_category=tactical&filter.v.availability=1" }
          - { key: sc-uniforms, label: "South Carolina Uniforms", route: "/collections/state-guard-series-south-carolina?sg_category=uniforms" }
          - { key: sc-tactical, label: "South Carolina Tactical", route: "/collections/state-guard-series-south-carolina?sg_category=tactical&filter.v.availability=1" }
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KEY: ${{ matrix.key }}
      LABEL: ${{ matrix.label }}
      ROUTE: ${{ matrix.route }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/scripts/sep18-sg-fetch-scope-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep18-sg-fetch-scope-${{ matrix.key }}-${{ github.run_id }}
          path: sep18-sg-fetch-scope-${{ matrix.key }}/
          retention-days: 14
