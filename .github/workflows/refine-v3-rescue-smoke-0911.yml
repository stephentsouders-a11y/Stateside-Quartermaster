name: Refine V3 rescue smoke
on:
  push:
    paths:
      - '.github/workflows/refine-v3-rescue-smoke-0911.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Smoke Flags Army ThinLine
        run: |
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true});
          const routes=[['Flags','/collections/flags-patriotic-decor'],['Army','/collections/products-built-for-the-line-u-s-army'],['ThinLine','/collections/thin-line']];
          let fail=0;
          for(const [name,path] of routes){for(const [device,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){const c=await b.newContext({viewport});const p=await c.newPage();const u=new URL(path,'https://www.statesideqm.com');u.searchParams.set('preview_theme_id','158561894555');let status=null;try{const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:60000});status=r?.status()??null}catch{}let s={};const end=Date.now()+10000;while(Date.now()<end){s=await p.evaluate(()=>{const v=e=>{if(!e)return false;const r=e.getBoundingClientRect(),x=getComputedStyle(e);return r.width>2&&r.height>2&&x.display!=='none'&&x.visibility!=='hidden'&&Number(x.opacity||1)>0};const m=document.querySelector('#MainContent'),all=m?[...m.querySelectorAll('.product-grid')]:[],g=all.filter(x=>v(x)&&[...x.querySelectorAll(':scope>.product-grid__item')].some(y=>v(y)&&y.querySelector('a[href*="/products/"]')));return{rescue:!!document.querySelector('[data-sq-refine-v3-visible-grid-rescue]'),ready:m?.dataset.sqRefineV3Ready||null,grids:g.length,cards:g[0]?[...g[0].querySelectorAll(':scope>.product-grid__item')].filter(v).length:0}});if(status===200&&s.rescue&&s.grids===1&&s.cards>0)break;await p.waitForTimeout(100)}const ok=status===200&&s.rescue&&s.grids===1&&s.cards>0;console.log(`${ok?'PASS':'FAIL'} ${device} ${name} status=${status} rescue=${s.rescue} grids=${s.grids} cards=${s.cards} ready=${s.ready}`);if(!ok)fail++;await c.close()}}
          await b.close();console.log(`SMOKE_SUMMARY failures=${fail}`);if(fail)process.exit(2);
          EOF
          node smoke.mjs
# post-Shopify-sync rerun 2026-09-11
