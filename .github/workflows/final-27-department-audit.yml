name: Final 27 Department Chromium Audit
on:
  push:
    paths:
      - '.github/workflows/final-27-department-audit.yml'
      - '.github/scripts/final-27-department-audit.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [1,2,3,4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Audit batch ${{ matrix.batch }}
        run: node .github/scripts/final-27-department-audit.mjs ${{ matrix.batch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-27-department-audit-batch-${{ matrix.batch }}
          path: final-27-audit/
          if-no-files-found: warn
          retention-days: 7
