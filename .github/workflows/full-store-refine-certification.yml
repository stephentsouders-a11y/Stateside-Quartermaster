name: Full store refine and speed certification
on:
  push:
    paths:
      - '.github/workflows/full-store-refine-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Audit every homepage and Products Built for the Line button
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('full-cert/screens',{recursive:true});
          const theme='158561894555';
          const routes=[
            ['Accessories, Gifts & Collectibles','/collections/accessories-gifts-collectibles','collection'],
            ['Airsoft & Milsim','/collections/airsoft-milsim','collection'],
            ['Apparel & Headwear','/collections/apparel','collection'],
            ['Armed Forces Gear','/collections/armed-forces-gear','collection'],
            ['Armored Vehicles','/pages/armored-vehicles-purchase-inquiry','page'],
            ['Art & Military Prints','/collections/art','collection'],
            ['Body Armor & Ballistic Protection','/collections/body-armor-ballistic-protection','collection'],
            ['Books, Literature, Manuals & Reference','/collections/literature','collection'],
            ['Child Safety Shop','/collections/child-safety-shop','collection'],
            ['DIVE / SCUBA','/collections/dive-scuba','collection'],
            ['Firearm Accessories, Holsters & Shooting Gear','/collections/firearm-accessories','collection'],
            ['First Aid, Medical & IFAK','/collections/first-aid-medical-ifak','collection'],
            ['Flags, Displays & Memorials','/collections/flags-patriotic-decor','collection'],
            ['Flashlights, Lighting & Power','/collections/flashlights-lighting','collection'],
            ['Footwear, Gloves & Eyewear','/collections/footwear-gloves-eyewear','collection'],
            ['K9 & Working Dog Gear','/collections/k9-dog-gear','collection'],
            ['Knives, Axes & Multi-Tools','/collections/knives-axes-cutlery','collection'],
            ['Morale Patches, Stickers & Tactical ID','/collections/morale-patches-tactical-id','collection'],
            ['Outdoor, Survival & Preparedness','/collections/outdoor-preparedness-gear','collection'],
            ['Patriotic & American Heritage','/collections/patriotic-american-heritage','collection'],
            ['Safety, Rescue & Climbing','/collections/safety-rescue-climbing','collection'],
            ['Sta-Brite Insignia','/collections/sta-brite-insignia','collection'],
            ['Tactical Gear, Packs & Load Carriage','/collections/tactical-gear','collection'],
            ['Thin Line Shop','/collections/thin-line','collection'],
            ['Uniforms, Insignia & Identification','/collections/uniforms','collection'],
            ['Watches & Timepieces','/collections/watches','collection'],
            ['Zippo, Lighters & Fire Starters','/collections/zippos-lighters-torches','collection'],
            ['Logo Merch','/collections/stateside-quartermaster-logo-merch','collection'],
            ['Army National Guard Series','/collections/army-national-guard-series','collection'],
            ['Air National Guard Series','/collections/air-national-guard-series','collection'],
            ['State Guard Series','/collections/state-guard-series','collection'],
            ['U.S. Army Series','/collections/products-built-for-the-line-u-s-army','collection'],
            ['U.S. Navy Series','/collections/products-built-for-the-line-u-s-navy','collection'],
            ['U.S. Air Force Series','/collections/products-built-for-the-line-u-s-air-force','collection'],
            ['U.S. Marine Corps Series','/collections/products-built-for-the-line-u-s-marine-corps','collection'],
            ['U.S. Coast Guard Series','/collections/products-built-for-the-line-u-s-coast-guard','collection'],
            ['U.S. Space Force Series','/collections/products-built-for-the-line-u-s-space-force','collection'],
            ['ROTC Series','/collections/rotc-series','collection'],
            ['JROTC Series','/collections/jrotc-series','collection'],
            ['Military Schools & Academies','/collections/military-schools-academies','collection'],
            ['Law Enforcement & Corrections','/collections/law-enforcement-corrections','collection'],
            ['Firefighting, EMS & Search & Rescue','/collections/firefighting-ems-search-rescue','collection']
          ];
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
          const rows=[], failures=[];
          const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
          const visible=async loc=>await loc.isVisible().catch(()=>false);
          async function productVendorFromLink(href){
            try{
              const u=new URL(href,'https://www.statesideqm.com');
              const m=u.pathname.match(/^\/products\/([^/?#]+)/); if(!m)return null;
              const r=await ctx.request.get('https://www.statesideqm.com/products/'+m[1]+'.js',{timeout:15000});
              if(!r.ok())return null;
              const j=await r.json(); return String(j.vendor||'').trim();
            }catch{return null}
          }
          for(const [name,path,type] of routes){
            const page=await ctx.newPage();
            page.setDefaultTimeout(12000); page.setDefaultNavigationTimeout(60000);
            const consoleErrors=[]; page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const target='https://www.statesideqm.com'+path+(path.includes('?')?'&':'?')+'preview_theme_id='+theme;
            const started=Date.now(); let resp=null, navError=null;
            try{resp=await page.goto(target,{waitUntil:'domcontentloaded'})}catch(e){navError=String(e)}
            let usableMs=null;
            if(!navError){
              for(let i=0;i<40;i++){
                const ok=await page.evaluate(()=>{const m=document.querySelector('#MainContent');if(!m)return false;const h=m.querySelector('h1,.collection-title,.title');if(!h)return false;const r=h.getBoundingClientRect();return r.width>0&&r.height>0}).catch(()=>false);
                if(ok){usableMs=Date.now()-started;break} await page.waitForTimeout(125);
              }
            }
            await page.waitForTimeout(2200);
            const base=await page.evaluate(()=>{
              const main=document.querySelector('#MainContent'); if(!main)return {main:false};
              const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>2&&r.height>2};
              const side=[...main.querySelectorAll('.sq-global-refine-sidebar')].filter(vis);
              const native=[...main.querySelectorAll('.facets-block-wrapper--horizontal .facets__filters-wrapper,.facets-toggle__wrapper,theme-drawer#filters-drawer')].filter(vis);
              const nav=performance.getEntriesByType('navigation')[0];
              return {main:true,url:location.href,title:document.title,sidebarCount:side.length,nativeFilters:native.length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,brokenImages:[...main.querySelectorAll('img')].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.currentSrc||i.src).filter(Boolean),manufacturerDetails:[...main.querySelectorAll('.sq-global-refine-sidebar details')].filter(d=>/manufacturer/i.test(d.querySelector(':scope>summary')?.textContent||'')).length,checkboxes:[...main.querySelectorAll('.sq-global-refine-manufacturer-checkbox')].length,productLinks:[...new Set([...main.querySelectorAll('a[href*="/products/"]')].map(a=>a.href))].slice(0,20),perf:nav?{ttfb:Math.round(nav.responseStart),dcl:Math.round(nav.domContentLoadedEventEnd),load:Math.round(nav.loadEventEnd),transferSize:nav.transferSize,decodedBodySize:nav.decodedBodySize}:null};
            }).catch(()=>({main:false}));
            let refine={expected:type==='collection',attempted:false,vendor:null,checked:false,urlFiltered:false,productsChecked:0,vendors:[],allMatch:null,cleared:false};
            if(type==='collection'&&base.main){
              const side=page.locator('.sq-global-refine-sidebar').first();
              if(await visible(side)){
                const md=page.locator('.sq-global-refine-sidebar details').filter({hasText:/Manufacturer/i}).first();
                if(await md.count()){
                  if(!(await md.getAttribute('open')))await md.locator('summary').click().catch(()=>{});
                  await page.waitForTimeout(150);
                  const boxes=page.locator('.sq-global-refine-manufacturer-checkbox');
                  if(await boxes.count()){
                    refine.attempted=true;
                    const box=boxes.first(); refine.vendor=await box.inputValue();
                    await Promise.all([page.waitForLoadState('domcontentloaded').catch(()=>{}),box.check().catch(async()=>box.click())]);
                    await page.waitForTimeout(1800);
                    refine.checked=await page.locator('.sq-global-refine-manufacturer-checkbox').filter({has:undefined}).first().isChecked().catch(()=>false);
                    refine.urlFiltered=new URL(page.url()).searchParams.get('filter.p.vendor')===refine.vendor;
                    const links=await page.locator('#MainContent a[href*="/products/"]').evaluateAll(as=>[...new Set(as.map(a=>a.href))].slice(0,12)).catch(()=>[]);
                    const vendors=[]; for(const href of links){const v=await productVendorFromLink(href);if(v)vendors.push(v)}
                    refine.productsChecked=vendors.length; refine.vendors=vendors; refine.allMatch=vendors.length?vendors.every(v=>v.toLowerCase()===String(refine.vendor).toLowerCase()):null;
                    const active=page.locator('.sq-global-refine-manufacturer-checkbox:checked').first();
                    if(await active.count()){
                      await Promise.all([page.waitForLoadState('domcontentloaded').catch(()=>{}),active.uncheck().catch(async()=>active.click())]);
                      await page.waitForTimeout(800); refine.cleared=!new URL(page.url()).searchParams.has('filter.p.vendor');
                    }
                  }
                }
              }
            }
            await page.screenshot({path:'full-cert/screens/'+slug(name)+'.png',fullPage:false}).catch(()=>{});
            const row={name,path,type,status:resp?.status()??null,navError,usableMs,base,refine,consoleErrors:consoleErrors.slice(0,8)}; rows.push(row);
            if(row.status!==200)failures.push(`${name}: HTTP ${row.status}`);
            if(navError)failures.push(`${name}: navigation error`);
            if(usableMs===null||usableMs>5000)failures.push(`${name}: usable ${usableMs}ms`);
            if(!base.main)failures.push(`${name}: #MainContent missing`);
            if(base.overflow)failures.push(`${name}: horizontal overflow`);
            if(base.brokenImages?.length)failures.push(`${name}: ${base.brokenImages.length} broken images`);
            if(type==='collection'){
              if(base.sidebarCount!==1)failures.push(`${name}: refine sidebar count ${base.sidebarCount}`);
              if(base.nativeFilters!==0)failures.push(`${name}: duplicate native filters ${base.nativeFilters}`);
              if(base.manufacturerDetails<1)failures.push(`${name}: Manufacturer group missing`);
              if(base.checkboxes<1)failures.push(`${name}: manufacturer checkboxes missing`);
              if(!refine.attempted)failures.push(`${name}: manufacturer checkbox was not testable`);
              else {
                if(!refine.urlFiltered)failures.push(`${name}: manufacturer filter URL did not apply`);
                if(refine.productsChecked<1)failures.push(`${name}: no product vendors could be verified after filtering`);
                if(refine.allMatch===false)failures.push(`${name}: filtered results include wrong manufacturer(s): ${refine.vendors.join(', ')}`);
                if(!refine.cleared)failures.push(`${name}: manufacturer filter did not clear`);
              }
            }
            console.log(JSON.stringify(row));
            await page.close();
          }
          await ctx.close(); await browser.close();
          const summary={theme,routes:rows.length,passed:rows.length-new Set(failures.map(f=>f.split(':')[0])).size,failures,rows};
          fs.writeFileSync('full-cert/report.json',JSON.stringify(summary,null,2));
          fs.writeFileSync('full-cert/failures.txt',failures.join('\n'));
          console.log('\nFINAL\n'+JSON.stringify({routes:rows.length,failures},null,2));
          if(failures.length)process.exitCode=2;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-store-refine-speed-cert
          path: full-cert
          retention-days: 7
