name: Accessories progressive sidebar Chromium certification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accessories-preview-perfect-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Chromium Playwright video audit of unpublished Accessories draft
        run: |
          cat > certify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('cert-out',{recursive:true});
          fs.mkdirSync('cert-out/video',{recursive:true});
          const theme='158770561179';
          const root=`https://www.statesideqm.com/collections/accessories-gifts-collectibles?preview_theme_id=${theme}&filter.v.availability=1`;
          const failures=[],results=[];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const vis=async (page,sel)=>page.locator(sel).evaluateAll(els=>els.filter(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>2&&r.height>2}).length);
          const auditPage=async(page,label)=>{
            const audit=await page.evaluate(()=>{
              const isVisible=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>2&&r.height>2};
              const rail=[...document.querySelectorAll('[data-sq-collection-rail]')].filter(isVisible);
              const white=[...document.querySelectorAll('#MainContent .sq-global-refine-sidebar,#MainContent .sqsg-refine-sidebar')].filter(e=>isVisible(e)&&e.getAttribute('data-sq-ohio-refine')!=='true');
              const native=[...document.querySelectorAll('#MainContent .facets__filters-wrapper,#MainContent .facets-toggle__wrapper,#MainContent theme-drawer#filters-drawer')].filter(isVisible);
              const maker=[...document.querySelectorAll('#MainContent .sq-maker-browser,#MainContent .vac-unified-maker-browser,#MainContent .vac-merged-browser')].filter(isVisible);
              const visibleItems=[...document.querySelectorAll('[data-sq-collection-rail] > *')];
              const item=(sel)=>{const e=document.querySelector(sel);return e?{hidden:e.hidden,visible:isVisible(e),text:(e.textContent||'').replace(/\s+/g,' ').trim()}:null};
              return {
                url:location.href,
                title:document.title,
                railVisible:rail.length,
                whiteRefineVisible:white.length,
                nativeFilterVisible:native.length,
                bodyMakerVisible:maker.length,
                categories:item('[data-sq-context-categories]'),
                subcategories:item('[data-sq-context-subcategories]'),
                types:item('[data-sq-context-types]'),
                manufacturer:item('[data-sq-refinement-key="manufacturer"]'),
                colorPattern:item('[data-sq-refinement-key="color-pattern"]'),
                price:item('[data-sq-refinement-key="price"]'),
                horizontalOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4
              };
            });
            await page.screenshot({path:`cert-out/${label}.png`,fullPage:true});
            return audit;
          };
          for(const [device,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport,recordVideo:{dir:'cert-out/video',size:viewport}});
            const page=await context.newPage();
            page.setDefaultNavigationTimeout(60000);
            let response=null,navError=null;
            try{response=await page.goto(root,{waitUntil:'domcontentloaded'});}catch(e){navError=String(e)}
            await sleep(7000);
            if(device==='mobile'){
              const toggle=page.locator('[data-sq-rail-mobile-toggle]');
              if(await toggle.count())await toggle.click().catch(()=>{});
              await sleep(700);
            }
            const rootAudit=await auditPage(page,`${device}-root`);
            if(response?.status()!==200)failures.push(`${device} root: HTTP ${response?.status()}`);
            if(navError)failures.push(`${device} root: navigation ${navError}`);
            if(rootAudit.railVisible!==1)failures.push(`${device} root: expected one navy rail, got ${rootAudit.railVisible}`);
            if(rootAudit.whiteRefineVisible!==0)failures.push(`${device} root: white Refine Products sidebar still visible (${rootAudit.whiteRefineVisible})`);
            if(rootAudit.nativeFilterVisible!==0)failures.push(`${device} root: native filter UI still visible (${rootAudit.nativeFilterVisible})`);
            if(rootAudit.bodyMakerVisible!==0)failures.push(`${device} root: body manufacturer block still visible (${rootAudit.bodyMakerVisible})`);
            if(!rootAudit.categories?.visible)failures.push(`${device} root: Categories is not visible`);
            if(rootAudit.subcategories?.visible)failures.push(`${device} root: Subcategories must not be visible before category selection`);
            if(rootAudit.types?.visible)failures.push(`${device} root: Types must not be visible before category/subcategory selection`);
            if(!rootAudit.manufacturer?.visible)failures.push(`${device} root: Manufacturer refinement missing from navy rail`);
            if(!rootAudit.price?.visible)failures.push(`${device} root: Price refinement missing from navy rail`);
            if(rootAudit.horizontalOverflow)failures.push(`${device} root: horizontal overflow`);

            const categories=page.locator('[data-sq-context-categories] [data-sq-rail-trigger]');
            if(await categories.count())await categories.click().catch(()=>{});
            await sleep(900);
            const catLinks=page.locator('[data-sq-context-categories-list] a[href]');
            const catCount=await catLinks.count();
            if(catCount<1)failures.push(`${device}: Categories flyout has no links`);
            let childAudit=null;
            if(catCount){
              const href=await catLinks.first().getAttribute('href');
              const child=new URL(href,root);child.searchParams.set('preview_theme_id',theme);child.searchParams.set('filter.v.availability','1');
              await page.goto(child.toString(),{waitUntil:'domcontentloaded'}).catch(e=>failures.push(`${device} child navigation: ${e}`));
              await sleep(7000);
              if(device==='mobile'){
                const toggle=page.locator('[data-sq-rail-mobile-toggle]');if(await toggle.count())await toggle.click().catch(()=>{});await sleep(500);
              }
              childAudit=await auditPage(page,`${device}-category`);
              if(childAudit.railVisible!==1)failures.push(`${device} child: expected one navy rail`);
              if(childAudit.whiteRefineVisible!==0)failures.push(`${device} child: white Refine Products sidebar visible`);
              if(childAudit.nativeFilterVisible!==0)failures.push(`${device} child: native filter UI visible`);
              if(!childAudit.categories?.visible)failures.push(`${device} child: Categories disappeared`);
              if(!childAudit.types?.visible)failures.push(`${device} child: Subcategory stage is not exposed after category selection`);
              const typeText=(childAudit.types?.text||'').toLowerCase();
              if(childAudit.types?.visible && !typeText.includes('subcategor'))failures.push(`${device} child: second stage is not labeled Subcategories`);
            }
            results.push({device,status:response?.status()??null,rootAudit,childAudit});
            await context.close();
            await browser.close();
          }
          const report={theme,root,results,failures,passed:failures.length===0};
          fs.writeFileSync('cert-out/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(failures.length)process.exit(2);
          EOF
          node certify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessories-progressive-sidebar-chromium-video
          path: cert-out
          retention-days: 7
