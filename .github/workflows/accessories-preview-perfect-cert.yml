name: Accessories live single-refine certification
on:
  push:
    branches: [main]
    paths:
      - 'snippets/sq-single-refine-authority.liquid'
      - 'snippets/sq-storefront-content-guard.liquid'
      - '.github/workflows/accessories-preview-perfect-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify live Accessories single Refine authority
        run: |
          cat > certify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('cert-out',{recursive:true});
          const target='https://www.statesideqm.com/collections/accessories-gifts-collectibles';
          const failures=[],results=[];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          for(const [device,viewport] of [['desktop',{width:1440,height:1100}],['mobile',{width:390,height:844}]]){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            page.setDefaultNavigationTimeout(60000);
            let response=null,navError=null;
            try{response=await page.goto(target,{waitUntil:'domcontentloaded'});}catch(e){navError=String(e);}
            await sleep(5000);
            const audit=await page.evaluate(()=>{
              const main=document.querySelector('#MainContent');
              const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>2&&r.height>2};
              const custom=[...(main?.querySelectorAll('.sq-global-refine-sidebar')||[])].filter(vis);
              const nativeSelectors=['.facets-block-wrapper--horizontal .facets__filters-wrapper','.facets-toggle__wrapper','theme-drawer#filters-drawer','#filters-drawer','.facets-block-wrapper--vertical','.facets__form-vertical','facet-filters-form','.mobile-facets__wrapper','.mobile-facets__open-wrapper'];
              const native=[];
              nativeSelectors.forEach(sel=>{[...(main?.querySelectorAll(sel)||[])].forEach(el=>{if(!custom.some(c=>c===el||c.contains(el)||el.contains(c))&&vis(el))native.push(el);});});
              return {
                url:location.href,
                title:document.title,
                customVisible:custom.length,
                refineTitles:[...(main?.querySelectorAll('.sq-global-refine-sidebar__title')||[])].filter(vis).length,
                detailGroups:[...(main?.querySelectorAll('.sq-global-refine-sidebar details')||[])].filter(vis).length,
                nativeVisible:native.length,
                bodyClass:document.body.className,
                authority:custom[0]?.getAttribute('data-sq-refine-authority')||null,
                guardCustom:document.documentElement.dataset.sqRefineCustomVisible||null,
                guardNative:document.documentElement.dataset.sqRefineNativeVisible||null,
                horizontalOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4
              };
            }).catch(e=>({error:String(e)}));
            await page.screenshot({path:`cert-out/${device}.png`,fullPage:true}).catch(()=>{});
            results.push({device,status:response?.status()??null,navError,audit});
            if(response?.status()!==200)failures.push(`${device}: HTTP ${response?.status()}`);
            if(navError)failures.push(`${device}: navigation error ${navError}`);
            if(audit.error)failures.push(`${device}: audit error ${audit.error}`);
            if(audit.customVisible!==1)failures.push(`${device}: expected exactly 1 visible custom Refine sidebar, found ${audit.customVisible}`);
            if(audit.refineTitles!==1)failures.push(`${device}: expected exactly 1 visible Refine Products title, found ${audit.refineTitles}`);
            if(audit.detailGroups<1)failures.push(`${device}: Refine Products has no functional groups`);
            if(audit.nativeVisible!==0)failures.push(`${device}: duplicate native filter UI still visible (${audit.nativeVisible})`);
            if(audit.horizontalOverflow)failures.push(`${device}: horizontal overflow`);
            await browser.close();
          }
          const report={target,results,failures};
          fs.writeFileSync('cert-out/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(failures.length)process.exit(2);
          EOF
          node certify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessories-live-single-refine-cert
          path: cert-out
          retention-days: 7
