name: Footwear Refine Products every-choice Chromium audit 0911
on:
  push:
    paths:
      - '.github/workflows/footwear-refine-every-choice-chromium-0911.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Syntax check Footwear audit
        run: node --check scripts/footwear-refine-cert-0911.mjs
      - name: Click and verify every Refine Products choice
        run: node scripts/footwear-refine-cert-0911.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footwear-refine-every-choice-0911
          path: out/footwear-refine-audit.json
          retention-days: 7
