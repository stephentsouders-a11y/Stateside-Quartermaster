name: Storefront Chromium refine semantic audit
on:
  push:
    paths:
      - '.github/workflows/storefront-refine-semantic-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Click every candidate Refine V3 checkbox and inspect product fit
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
          SHARD: ${{ matrix.shard }}
          SHARDS: '8'
        run: |
          cat > refine-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          import crypto from 'crypto';
          const BASE=process.env.BASE, THEME=process.env.THEME, shard=Number(process.env.SHARD), shards=Number(process.env.SHARDS);
          const ROOTS=['accessories-gifts-collectibles','airsoft-milsim','apparel','armed-forces-gear','art','body-armor-ballistic-protection','literature','child-safety-shop','dive-scuba','firearm-accessories','first-aid-medical-ifak','flags-patriotic-decor','flashlights-lighting','footwear-gloves-eyewear','k9-dog-gear','knives-axes-cutlery','morale-patches-tactical-id','outdoor-preparedness-gear','patriotic-american-heritage','safety-rescue-climbing','sta-brite-insignia','tactical-gear','thin-line','uniforms','watches','zippos-lighters-torches','stateside-quartermaster-logo-merch','army-national-guard-series','air-national-guard-series','products-built-for-the-line-u-s-army','products-built-for-the-line-u-s-navy','products-built-for-the-line-u-s-air-force','products-built-for-the-line-u-s-marine-corps','products-built-for-the-line-u-s-coast-guard','products-built-for-the-line-u-s-space-force','rotc-series','jrotc-series','military-schools-academies','law-enforcement-corrections','firefighting-ems-search-rescue'];
          const H=s=>parseInt(crypto.createHash('sha1').update(s).digest('hex').slice(0,8),16), safe=s=>crypto.createHash('sha1').update(s).digest('hex').slice(0,12);
          const roots=ROOTS.filter(x=>H(x)%shards===shard).sort();
          const OUT='out'; fs.mkdirSync(`${OUT}/videos`,{recursive:true}); fs.mkdirSync(`${OUT}/screens`,{recursive:true});
          function rootUrl(handle){const u=new URL('/collections/'+handle,BASE);u.searchParams.set('preview_theme_id',THEME);return u.toString()}
          async function ready(page){await page.waitForLoadState('domcontentloaded').catch(()=>{});await page.locator('#MainContent').waitFor({state:'attached',timeout:15000});await page.waitForFunction(()=>{const m=document.getElementById('MainContent');return m&&(m.dataset.sqRefineV3Ready==='true'||!!m.dataset.sqRefineV3Error)},null,{timeout:25000}).catch(()=>{});await page.waitForTimeout(250)}
          function mismatch(label,titles){const l=label.toLowerCase(),bad=[];const add=(re,why)=>titles.forEach(t=>{if(re.test(t.toLowerCase()))bad.push({title:t,why})});
            if(/chest rig|chest rigs/.test(l))add(/\bbelt\b|buckle|waist belt|duty belt|web belt/,'belt-like product under Chest Rigs');
            if(/belt|belts/.test(l))add(/chest rig|plate carrier|body armor|helmet/,'non-belt carrier/armor under Belts');
            if(/helmet/.test(l))add(/\bboot|glove|belt|shirt|pants?|trouser|backpack|pack\b|chest rig/,'non-helmet product under Helmets');
            if(/flashlight|lighting/.test(l))add(/shirt|pants?|trouser|boot|belt|patch|insignia|book/,'non-lighting product under Flashlights/Lighting');
            if(/first aid|medical|ifak/.test(l))add(/shirt|pants?|trouser|boot|belt buckle|book|flag/,'obvious non-medical product under First Aid/Medical');
            if(/footwear|boots?/.test(l))add(/shirt|pants?|trouser|belt|patch|insignia|chest rig|plate carrier/,'non-footwear product under Footwear/Boots');
            if(/gloves?/.test(l))add(/shirt|pants?|trouser|boot|belt|patch|insignia|chest rig/,'non-glove product under Gloves');
            if(/eyewear|glasses|goggles/.test(l))add(/shirt|pants?|trouser|boot|belt|patch|insignia|chest rig/,'non-eyewear product under Eyewear');
            if(/knives|knife|axes|multi-tools?/.test(l))add(/shirt|pants?|trouser|boot|belt|patch|insignia|chest rig|plate carrier/,'obvious non-tool product under Knives/Axes/Multi-Tools');
            if(/patch|patches/.test(l)&&!/morale/.test(l))add(/shirt|pants?|trouser|boot|belt|book|flashlight/,'obvious non-patch product under Patches');
            return bad.slice(0,50)}
          async function controls(page){await page.locator('#MainContent details.sq-refine-v3-group').evaluateAll(ds=>ds.forEach(d=>d.open=true));return page.locator('#MainContent .sq-refine-v3-sidebar .sq-refine-v3-choice input[type=checkbox]').evaluateAll(xs=>xs.map((x,i)=>({i,kind:x.dataset.kind||'',target:x.dataset.target||'',name:x.dataset.filterName||x.name||'',value:x.dataset.filterValue||x.value||'',label:(x.parentElement?.querySelector('span')?.innerText||x.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim(),group:(x.closest('details')?.querySelector(':scope>summary')?.innerText||'').replace(/\s+/g,' ').trim()})).filter(x=>x.label))}
          async function locate(page,c){return page.locator('#MainContent .sq-refine-v3-sidebar .sq-refine-v3-choice input[type=checkbox]').filter({has:undefined}).evaluateAll((xs,c)=>{let n=-1;for(let i=0;i<xs.length;i++){const x=xs[i],lab=(x.parentElement?.querySelector('span')?.innerText||x.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim(),kind=x.dataset.kind||'',target=x.dataset.target||'',name=x.dataset.filterName||x.name||'',value=x.dataset.filterValue||x.value||'';if(lab===c.label&&kind===c.kind&&target===c.target&&name===c.name&&value===c.value){n=i;break}}return n},c)}
          const browser=await chromium.launch({headless:true}); const results=[];
          for(let ri=0;ri<roots.length;ri++){
            const handle=roots[ri], base=rootUrl(handle), ctx=await browser.newContext({viewport:{width:1365,height:900},recordVideo:{dir:`${OUT}/videos`,size:{width:960,height:540}}}),page=await ctx.newPage();page.setDefaultTimeout(12000);page.setDefaultNavigationTimeout(30000);
            const rec={handle,base,checks:[],pageErrors:[]};page.on('pageerror',e=>rec.pageErrors.push(String(e.message||e)));
            try{
              let res=await page.goto(base,{waitUntil:'domcontentloaded'});rec.status=res?.status()??null;await ready(page);
              rec.refineError=await page.locator('#MainContent').getAttribute('data-sq-refine-v3-error').catch(()=>null);rec.sidebarCount=await page.locator('#MainContent .sq-refine-v3-sidebar').count();rec.nativeHorizontalFacets=await page.locator('#MainContent .facets-block-wrapper--horizontal:visible').count();
              const cs=await controls(page);rec.controlCount=cs.length;
              for(let ci=0;ci<cs.length;ci++){
                const c=cs[ci],out={group:c.group,label:c.label,kind:c.kind,name:c.name,value:c.value,target:c.target,outcome:'PASS',semanticCandidates:[]};
                try{
                  // Test text/label separately: only the checkbox square may activate.
                  await page.goto(base,{waitUntil:'domcontentloaded'});await ready(page);await page.locator('#MainContent details.sq-refine-v3-group').evaluateAll(ds=>ds.forEach(d=>d.open=true));let idx=await locate(page,c);if(idx<0)throw new Error('control disappeared before label test');let row=page.locator('#MainContent .sq-refine-v3-sidebar .sq-refine-v3-choice').filter({has:page.locator('input[type=checkbox]')}).nth(idx);let box=row.locator('input[type=checkbox]'),text=row.locator('span').first();const beforeUrl=page.url(),beforeChecked=await box.isChecked();await text.click({timeout:8000});await page.waitForTimeout(350);if(page.url()!==beforeUrl||(await box.isChecked())!==beforeChecked){out.outcome='FAIL_LABEL_ACTIVATED';out.labelUrlAfter=page.url()}
                  // Test the actual square and wait for its intentional navigation.
                  await page.goto(base,{waitUntil:'domcontentloaded'});await ready(page);await page.locator('#MainContent details.sq-refine-v3-group').evaluateAll(ds=>ds.forEach(d=>d.open=true));idx=await locate(page,c);if(idx<0)throw new Error('control disappeared before checkbox test');row=page.locator('#MainContent .sq-refine-v3-sidebar .sq-refine-v3-choice').filter({has:page.locator('input[type=checkbox]')}).nth(idx);box=row.locator('input[type=checkbox]');const start=page.url();const nav=page.waitForNavigation({waitUntil:'domcontentloaded',timeout:15000}).catch(()=>null);await box.click({timeout:8000});await nav;await ready(page);out.destination=page.url();if(page.url()===start&&out.outcome==='PASS')out.outcome='FAIL_CHECKBOX_NO_NAV';
                  const body=((await page.locator('#MainContent').innerText().catch(()=>''))||'').slice(0,16000),title=await page.title();if(/something went wrong|internal server error|there was a problem|page not found/i.test(title+' '+body))out.outcome='FAIL_ERROR_PAGE';
                  const titles=await page.locator('#MainContent .product-grid__item:visible').evaluateAll(es=>[...new Set(es.map(e=>{const a=e.querySelector('a[href*="/products/"]');return (a?.innerText||e.innerText||'').replace(/\s+/g,' ').trim().slice(0,220)}).filter(Boolean))].slice(0,120)).catch(()=>[]);out.productCountSample=titles.length;out.semanticCandidates=mismatch(c.label,titles);if(out.semanticCandidates.length)out.outcome='FAIL_SEMANTIC_CANDIDATES';if(!titles.length&&out.outcome==='PASS')out.outcome='FAIL_ZERO_PRODUCTS';
                }catch(e){out.outcome='FAIL_EXCEPTION';out.error=String(e)}
                rec.checks.push(out);fs.writeFileSync(`${OUT}/progress-${shard}.json`,JSON.stringify(results.concat([rec]),null,2));
              }
              await page.goto(base,{waitUntil:'domcontentloaded'}).catch(()=>{});await ready(page).catch(()=>{});await page.screenshot({path:`${OUT}/screens/${String(ri+1).padStart(3,'0')}-${handle}.png`,fullPage:true}).catch(()=>{});
            }catch(e){rec.fatal=String(e)}
            const v=page.video();await ctx.close();if(v){try{const old=await v.path();fs.renameSync(old,`${OUT}/videos/${String(ri+1).padStart(3,'0')}-${safe(handle)}-${handle}.webm`)}catch{}}
            rec.failedChecks=rec.checks.filter(x=>x.outcome!=='PASS').length;rec.fail=rec.status!==200||!!rec.refineError||rec.sidebarCount!==1||rec.nativeHorizontalFacets>0||rec.controlCount===0||!!rec.fatal||rec.failedChecks>0;results.push(rec);fs.writeFileSync(`${OUT}/results-${shard}.json`,JSON.stringify(results,null,2));
          }
          await browser.close();const summary={shard,roots:results.length,controls:results.reduce((n,r)=>n+(r.controlCount||0),0),failedRoots:results.filter(r=>r.fail).length,failedControls:results.reduce((n,r)=>n+(r.failedChecks||0),0),semanticCandidateCount:results.reduce((n,r)=>n+r.checks.reduce((m,c)=>m+c.semanticCandidates.length,0),0)};fs.writeFileSync(`${OUT}/summary-${shard}.json`,JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));if(summary.failedRoots)process.exitCode=2;
          EOF
          node refine-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-refine-semantic-${{ matrix.shard }}
          path: out
          retention-days: 7
