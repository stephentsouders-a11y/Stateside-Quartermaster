name: Sep18 full current draft 43 plus State Guard load audit
on:
  push:
    paths:
      - '.github/workflows/sep18-full-current-load-audit.yml'
      - '.github/scripts/sep18-full-current-discover.mjs'
      - '.github/scripts/sep18-full-current-shard.mjs'
      - '.github/scripts/sep18-full-current-aggregate.mjs'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      home_count: ${{ steps.discover.outputs.home_count }}
      sg_count: ${{ steps.discover.outputs.sg_count }}
      total: ${{ steps.discover.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - id: discover
        run: node .github/scripts/sep18-full-current-discover.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sep18-full-current-discovery-${{ github.run_id }}
          path: sep18-full-current-audit-discovery/
          retention-days: 14
  audit:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHARD: ${{ matrix.shard }}
      ROUTES_B64: ${{ matrix.routesB64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/scripts/sep18-full-current-shard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep18-full-current-audit-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: sep18-full-current-audit-shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14
  aggregate:
    needs: [discover, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sep18-full-current-audit-shard-*-${{ github.run_id }}
          path: sep18-full-current-audit-combined
      - run: node .github/scripts/sep18-full-current-aggregate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep18-full-current-audit-final-${{ github.run_id }}
          path: sep18-full-current-audit-final/
          retention-days: 14
