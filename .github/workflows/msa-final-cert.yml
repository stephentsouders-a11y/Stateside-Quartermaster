name: MSA final certification
on:
  push:
    paths:
      - '.github/workflows/msa-final-cert.yml'
permissions:
  contents: read
jobs:
  certify-msa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Certify MSA draft desktop and mobile
        run: |
          cat > msa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('out',{recursive:true});
          const base='https://www.statesideqm.com/collections/military-schools-academies?preview_theme_id=158561894555';
          const browser=await chromium.launch({headless:true});
          const results=[];
          for(const [device,viewport] of [['desktop',{width:1440,height:1100}],['mobile',{width:390,height:844}]]){
            await new Promise(r=>setTimeout(r,2500));
            const ctx=await browser.newContext({viewport}); const page=await ctx.newPage();
            const start=Date.now(); let status=null,error=null;
            try{const r=await page.goto(base,{waitUntil:'domcontentloaded',timeout:30000});status=r?.status()??null}catch(e){error=String(e)}
            let usable=null;
            if(status===200&&!error){for(let i=0;i<25;i++){const s=await page.evaluate(()=>{const m=document.querySelector('#MainContent');const t=(m?.innerText||'').replace(/\s+/g,' ').trim();const visible=[...(m?.querySelectorAll('a,.sqaca-card,.sqaca-all,.collection-card,.card')||[])].some(e=>{const r=e.getBoundingClientRect();return r.width>30&&r.height>20});return{bad:/just a moment|something went wrong|internal server error|there was a problem/i.test(document.title+' '+t),loading:/loading all products|checking items|tree unavailable|building the customer-facing product tree/i.test(t),visible}});if(!s.bad&&!s.loading&&s.visible){usable=Date.now()-start;break}await page.waitForTimeout(200)}}
            const d=await page.evaluate(()=>{const m=document.querySelector('#MainContent');const t=(m?.innerText||'').replace(/\s+/g,' ').trim();return{bad:/just a moment|something went wrong|internal server error|there was a problem/i.test(document.title+' '+t),availability:[...(m?.querySelectorAll('a[href*="filter.v.availability"]')||[])].length,broken:[...(m?.querySelectorAll('img')||[])].filter(x=>x.complete&&x.naturalWidth===0).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4}});
            const failed=status!==200||!!error||d.bad||usable===null||usable>5000||d.availability>0||d.broken>0||d.overflow;
            await page.screenshot({path:`out/msa-${device}.png`,fullPage:true});
            results.push({device,status,error,usableMs:usable,failed,...d}); console.log(JSON.stringify(results.at(-1)));
            await ctx.close();
          }
          await browser.close(); fs.writeFileSync('out/report.json',JSON.stringify(results,null,2));
          if(results.some(x=>x.failed))process.exitCode=2;
          EOF
          node msa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: msa-final-cert, path: out, retention-days: 7}
