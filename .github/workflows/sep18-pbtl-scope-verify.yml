name: Sep18 PBTL render scope verification
on:
  push:
    paths:
      - '.github/workflows/sep18-pbtl-scope-verify.yml'
      - '.github/scripts/sep18-pbtl-scope-verify.mjs'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { key: accessories, label: "Accessories", route: "/collections/accessories-gifts-collectibles", kind: "department" }
          - { key: ohio, label: "Ohio State Guard", route: "/collections/state-guard-series-ohio", kind: "state-guard" }
          - { key: south-carolina, label: "South Carolina State Guard", route: "/collections/state-guard-series-south-carolina", kind: "state-guard" }
          - { key: army, label: "U.S. Army Series", route: "/collections/products-built-for-the-line-u-s-army?filter.v.availability=1", kind: "pbtl" }
          - { key: navy, label: "U.S. Navy Series", route: "/collections/products-built-for-the-line-u-s-navy?filter.v.availability=1", kind: "pbtl" }
          - { key: space-force, label: "U.S. Space Force Series", route: "/collections/products-built-for-the-line-u-s-space-force?filter.v.availability=1", kind: "pbtl" }
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KEY: ${{ matrix.key }}
      LABEL: ${{ matrix.label }}
      ROUTE: ${{ matrix.route }}
      KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/scripts/sep18-pbtl-scope-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep18-pbtl-scope-${{ matrix.key }}-${{ github.run_id }}
          path: sep18-pbtl-scope-verify-${{ matrix.key }}/
          retention-days: 14
