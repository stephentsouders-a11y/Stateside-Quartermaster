name: Refine V3 active-duty PBTL category certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/scripts/refine-v3-pbtl-category-cert.mjs'
      - '.github/workflows/refine-v3-pbtl-category-cert.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify every active-duty PBTL Category route
        run: node .github/scripts/refine-v3-pbtl-category-cert.mjs
