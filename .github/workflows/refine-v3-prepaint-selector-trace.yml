name: Refine V3 prepaint selector trace
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/scripts/refine-v3-prepaint-selector-trace.mjs'
      - '.github/workflows/refine-v3-prepaint-selector-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node .github/scripts/refine-v3-prepaint-selector-trace.mjs
