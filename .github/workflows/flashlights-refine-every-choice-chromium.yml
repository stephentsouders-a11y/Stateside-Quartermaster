name: Flashlights Refine every-choice Chromium audit

on:
  push:
    paths:
      - '.github/workflows/flashlights-refine-every-choice-chromium.yml'
      - 'snippets/sq-refine-v3.liquid'
      - 'snippets/sq-global-refine-checkbox-controls.liquid'
      - 'sections/sq-refine-v3-product-grid.liquid'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  every-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click every Refine Products choice one by one
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const themeId='158561894555';
          const basePath='/collections/flashlights-lighting';
          const base=`https://www.statesideqm.com${basePath}?preview_theme_id=${themeId}&sq_per_page=250`;
          fs.mkdirSync('out/screens',{recursive:true});
          const report={base,startedAt:new Date().toISOString(),inventory:[],choices:[],failures:[],runtimeErrors:[]};
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
          const page=await ctx.newPage();
          page.setDefaultNavigationTimeout(90000);
          page.setDefaultTimeout(30000);
          page.on('pageerror',e=>report.runtimeErrors.push(String(e)));
          const safe=s=>(s||'choice').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,80).toLowerCase();

          async function ready(){
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:30000});
            await page.waitForTimeout(350);
          }
          async function openBase(){
            const r=await page.goto(base,{waitUntil:'domcontentloaded'});
            if(r?.status()!==200) throw new Error(`Base HTTP ${r?.status()}`);
            await ready();
          }
          await openBase();
          const init=await page.evaluate(()=>{
            const main=document.querySelector('#MainContent');
            const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};
            const side=main?.querySelector('.sq-refine-v3-sidebar,.sq-global-refine-sidebar');
            const old=[...main.querySelectorAll('.facets-block-wrapper--horizontal .facets__filters-wrapper,.facets-toggle__wrapper,theme-drawer#filters-drawer')].filter(vis).length;
            return {ready:main?.dataset.sqRefineV3Ready||null,sidebar:!!side,oldNativeVisible:old};
          });
          if(!init.sidebar) report.failures.push('Refine Products sidebar missing');
          if(init.oldNativeVisible) report.failures.push(`Old native filter surfaces visible: ${init.oldNativeVisible}`);

          report.inventory=await page.evaluate(()=>{
            const side=document.querySelector('#MainContent .sq-refine-v3-sidebar,#MainContent .sq-global-refine-sidebar');
            if(!side)return [];
            return [...side.querySelectorAll('details.sq-refine-v3-group')].flatMap((d,gi)=>{
              const group=(d.querySelector(':scope > summary')?.textContent||'').replace(/\s+/g,' ').trim();
              return [...d.querySelectorAll('input[type="checkbox"]')].map((i,ii)=>({group,gi,ii,value:i.value||'',target:i.dataset.target||'',filterName:i.dataset.filterName||'',polish:i.dataset.sqPolishParam||'',label:(i.closest('.sq-refine-v3-choice')?.innerText||i.value||'').replace(/\s+/g,' ').trim()}));
            });
          });
          if(!report.inventory.length) report.failures.push('No Refine checkbox choices found');

          for(let index=0;index<report.inventory.length;index++){
            const meta=report.inventory[index];
            await openBase();
            const details=page.locator('#MainContent details.sq-refine-v3-group').nth(meta.gi);
            if(!(await details.getAttribute('open'))) await details.locator(':scope > summary').click();
            const input=details.locator('input[type="checkbox"]').nth(meta.ii);
            const before=page.url();
            let clickError=null;
            try{
              await Promise.all([page.waitForURL(u=>u.href!==before,{timeout:15000}).catch(()=>null),input.click({force:true})]);
              await page.waitForLoadState('domcontentloaded').catch(()=>{});
              await ready().catch(()=>{});
            }catch(e){clickError=String(e)}
            const u=new URL(page.url());
            const state=await page.evaluate(()=>{
              const main=document.querySelector('#MainContent');
              const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};
              const results=main?.querySelector('.sq-refine-v3-results');
              const cards=[...(results?.querySelectorAll('.product-grid > *')||[])].filter(vis);
              const products=[...new Set([...cards].map(c=>c.querySelector('a[href*="/products/"]')).filter(Boolean).map(a=>({title:(a.textContent||a.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim(),href:a.getAttribute('href')})).filter(x=>x.href))];
              const otherGrids=[...main.querySelectorAll('.product-grid')].filter(g=>vis(g)&&!results?.contains(g)&&g.querySelector('a[href*="/products/"]')).length;
              return {ready:main?.dataset.sqRefineV3Ready||null,cards:cards.length,products,duplicate:otherGrids,error:main?.dataset.sqRefineV3Error||null};
            }).catch(()=>({ready:null,cards:0,products:[],duplicate:0,error:'evaluation failed'}));
            const errors=[];
            if(clickError) errors.push(`click/navigation error: ${clickError}`);
            if(state.ready!=='true') errors.push(`V3 not ready (${state.ready})`);
            if(state.duplicate) errors.push(`duplicate product grids: ${state.duplicate}`);
            if(state.error) errors.push(`V3 error: ${state.error}`);
            if(meta.group==='Shop by Category'){
              if(!u.pathname.startsWith('/collections/')) errors.push(`category did not navigate to collection: ${u.pathname}`);
              if(state.cards<1) errors.push('category returned zero visible product cards');
            } else {
              const param=meta.filterName||meta.polish;
              if(param && !u.searchParams.getAll(param).includes(meta.value)) errors.push(`filter URL missing ${param}=${meta.value}`);
              if(!param && !meta.target) errors.push('checkbox has no target/filter metadata');
            }
            const entry={index:index+1,...meta,url:u.href,cards:state.cards,products:state.products,errors};
            report.choices.push(entry);
            if(errors.length){report.failures.push(`${meta.group} > ${meta.label}: ${errors.join('; ')}`);await page.screenshot({path:`out/screens/${String(index+1).padStart(3,'0')}-${safe(meta.group)}-${safe(meta.label)}.png`,fullPage:true}).catch(()=>{});}
          }
          report.finishedAt=new Date().toISOString();
          fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({totalChoices:report.choices.length,failures:report.failures,choices:report.choices.map(x=>({group:x.group,label:x.label,url:x.url,cards:x.cards,products:x.products.map(p=>p.href),errors:x.errors}))},null,2));
          await browser.close();
          if(report.failures.length || report.runtimeErrors.length) process.exitCode=2;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashlights-refine-every-choice-chromium
          path: out
          retention-days: 14
