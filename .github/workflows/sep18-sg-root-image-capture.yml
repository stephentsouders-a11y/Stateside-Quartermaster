name: Sep18 State Guard root image capture
on:
  push:
    paths:
      - '.github/workflows/sep18-sg-root-image-capture.yml'
      - '.github/scripts/sep18-sg-root-image-capture.mjs'
permissions: { contents: read }
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/scripts/sep18-sg-root-image-capture.mjs
