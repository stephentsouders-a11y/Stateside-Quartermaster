name: Refine V3 corrected 41-route visual certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-41-visual-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run corrected 41-route certification
        run: |
          cat > cert41.mjs <<'EOF'
          import { chromium } from 'playwright';
          const BASE='https://www.statesideqm.com',THEME='158561894555';
          const routes=[
          ['Accessories, Gifts & Collectibles','/collections/accessories-gifts-collectibles'],['Airsoft & Milsim','/collections/airsoft-milsim'],['Apparel & Headwear','/collections/apparel'],['Armed Forces Gear','/collections/armed-forces-gear'],['Armored Vehicles','/pages/armored-vehicles-purchase-inquiry','page'],['Art & Military Prints','/collections/art'],['Body Armor & Ballistic Protection','/collections/body-armor-ballistic-protection'],['Books, Literature, Manuals & Reference','/collections/literature'],['Child Safety Shop','/collections/child-safety-shop'],['DIVE / SCUBA','/collections/dive-scuba'],['Firearm Accessories, Holsters & Shooting Gear','/collections/firearm-accessories'],['First Aid, Medical & IFAK','/collections/first-aid-medical-ifak'],['Flags, Displays & Memorials','/collections/flags-patriotic-decor'],['Flashlights, Lighting & Power','/collections/flashlights-lighting'],['Footwear, Gloves & Eyewear','/collections/footwear-gloves-eyewear'],['K9 & Working Dog Gear','/collections/k9-dog-gear'],['Knives, Axes & Multi-Tools','/collections/knives-axes-cutlery'],['Morale Patches, Stickers & Tactical ID','/collections/morale-patches-tactical-id'],['Outdoor, Survival & Preparedness','/collections/outdoor-preparedness-gear'],['Patriotic & American Heritage','/collections/patriotic-american-heritage'],['Safety, Rescue & Climbing','/collections/safety-rescue-climbing'],['Sta-Brite Insignia','/collections/sta-brite-insignia'],['Tactical Gear, Packs & Load Carriage','/collections/tactical-gear'],['Thin Line Shop','/collections/thin-line'],['Uniforms, Insignia & Identification','/collections/uniforms'],['Watches & Timepieces','/collections/watches'],['Zippo, Lighters & Fire Starters','/collections/zippos-lighters-torches'],['Logo Merch','/collections/stateside-quartermaster-logo-merch'],['Army National Guard Series','/collections/army-national-guard-series'],['Air National Guard Series','/collections/air-national-guard-series'],['U.S. Army Series','/collections/products-built-for-the-line-u-s-army'],['U.S. Navy Series','/collections/products-built-for-the-line-u-s-navy'],['U.S. Air Force Series','/collections/products-built-for-the-line-u-s-air-force'],['U.S. Marine Corps Series','/collections/products-built-for-the-line-u-s-marine-corps'],['U.S. Coast Guard Series','/collections/products-built-for-the-line-u-s-coast-guard'],['U.S. Space Force Series','/collections/products-built-for-the-line-u-s-space-force'],['ROTC Series','/collections/rotc-series'],['JROTC Series','/collections/jrotc-series'],['Military Schools & Academies','/collections/military-schools-academies'],['Law Enforcement & Corrections','/collections/law-enforcement-corrections'],['Firefighting, EMS & Search & Rescue','/collections/firefighting-ems-search-rescue']];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({headless:true});let failed=0,passed=0;
          function url(path){const u=new URL(path,BASE);u.searchParams.set('preview_theme_id',THEME);return u.toString()}
          async function nav(page,path){let r;for(let i=0;i<6;i++){r=await page.goto(url(path),{waitUntil:'domcontentloaded',timeout:90000});if(r?.status()===200)return r;if(![429,500,502,503,504].includes(r?.status()||0))return r;await sleep([5000,9000,15000,22000,30000,40000][i])}return r}
          async function inspectCollection(page,root){try{await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:35000})}catch{}await page.waitForTimeout(3000);return page.evaluate(root=>{const main=document.querySelector('#MainContent'),side=main?.querySelector('.sq-refine-v3-sidebar'),results=main?.querySelector('.sq-refine-v3-results'),grid=results?.querySelector('.product-grid');const cards=grid?[...grid.querySelectorAll(':scope > .product-grid__item')].filter(x=>!!x.querySelector('a[href*="/products/"]')):[];const visible=cards.filter(el=>{const s=getComputedStyle(el),b=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&b.width>0&&b.height>0});const rects=visible.slice(0,8).map(el=>{const r=el.getBoundingClientRect();return{x:Math.round(r.x),y:Math.round(r.y)}}),fy=rects[0]?.y;const groups=[...(side?.querySelectorAll('details.sq-refine-v3-group')||[])],struct=[...(side?.querySelectorAll('input[data-kind="structural"]')||[])],native=[...(side?.querySelectorAll('input[data-kind="native"]')||[])];const badStruct=struct.filter(i=>{const t=i.dataset.target||'';return !t.includes('/collections/')||!t.includes('sq_root='+encodeURIComponent(root))}).length;const badNative=native.filter(i=>!String(i.dataset.filterName||'').startsWith('filter.')).length;const legacy=[...document.querySelectorAll('[data-sq-refine-v3-hidden-nav="true"]')].filter(el=>{const s=getComputedStyle(el),b=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&b.width>0&&b.height>0}).length;return{ready:main?.dataset.sqRefineV3Ready==='true',error:main?.dataset.sqRefineV3Error||'',cleanup:main?.dataset.sqRefineV3RootCleanup==='true',isolation:document.querySelector('script[data-sq-refine-v3-legacy-isolation]')?.dataset.sqRefineV3LegacyIsolation||'',sidebar:!!side&&getComputedStyle(side).display!=='none',title:(side?.querySelector('.sq-refine-v3-sidebar__title')?.textContent||'').trim(),position:side?getComputedStyle(side).position:'',height:Math.round(side?.getBoundingClientRect().height||0),sizes:[...document.querySelectorAll('.sq-refine-v3-page-size input')].map(i=>i.value),default50:!!document.querySelector('.sq-refine-v3-page-size input[value="50"]:checked'),groups:groups.length,inactiveClosed:groups.filter(g=>g.dataset.active!=='true').every(g=>!g.open),activeOpen:groups.filter(g=>g.dataset.active==='true').every(g=>g.open),cards:visible.length,firstRow:rects.filter(x=>Math.abs(x.y-fy)<=3).length,badStruct,badNative,legacy,combined:groups.some(g=>/color\s*[\/&+]\s*pattern|color and pattern/i.test(g.querySelector('summary')?.textContent||''))}},root)}
          for(let i=0;i<routes.length;i++){
            const [name,path,type='collection']=routes[i];const page=await browser.newPage({viewport:{width:1440,height:1000}});const errors=[];page.on('pageerror',e=>errors.push(e.message));let reasons=[];
            try{const r=await nav(page,path);if(r?.status()!==200)reasons.push('HTTP '+(r?.status()||0));if(type==='page'){const d=await page.evaluate(()=>({v3:!!document.querySelector('[data-sq-refine-v3]'),sidebar:!!document.querySelector('.sq-refine-v3-sidebar')}));if(d.v3||d.sidebar)reasons.push('V3 present on special page')}else{const root=path.split('/collections/')[1];const d=await inspectCollection(page,root);if(!d.ready)reasons.push('not ready'+(d.error?' '+d.error:''));if(d.error)reasons.push(d.error);if(!d.cleanup)reasons.push('cleanup missing');if(d.isolation!==root)reasons.push('isolation '+d.isolation);if(!d.sidebar||d.title!=='Refine Products')reasons.push('sidebar/title');if(d.position!=='sticky'||d.height<600)reasons.push('sidebar geometry');if(d.sizes.join(',')!=='50,100,250'||!d.default50)reasons.push('page sizes');if(!d.groups||!d.inactiveClosed||!d.activeOpen)reasons.push('disclosure groups');if(!d.cards||d.cards>50)reasons.push('visible cards '+d.cards);if(d.firstRow!==Math.min(3,d.cards))reasons.push('visual columns '+d.firstRow);if(d.badStruct)reasons.push('bad structural targets '+d.badStruct);if(d.badNative)reasons.push('bad native filters '+d.badNative);if(d.legacy)reasons.push('legacy visible '+d.legacy);if(d.combined)reasons.push('combined color/pattern');}
            }catch(e){reasons.push(String(e))}if(errors.length)reasons.push('page errors '+errors.join(' | '));if(reasons.length){failed++;console.log(`FAIL ${i+1}/41 ${name} :: ${reasons.join(' | ')}`)}else{passed++;console.log(`PASS ${i+1}/41 ${name}`)}await page.close();await sleep(4500);
          }
          const guard=await browser.newPage({viewport:{width:1440,height:1000}});let guardReasons=[];try{const r=await nav(guard,'/collections/state-guard-series');if(r?.status()!==200)guardReasons.push('HTTP '+(r?.status()||0));await guard.waitForTimeout(2000);const d=await guard.evaluate(()=>({v3:!!document.querySelector('[data-sq-refine-v3]'),sidebar:!!document.querySelector('.sq-refine-v3-sidebar')}));if(d.v3||d.sidebar)guardReasons.push('V3/sidebar present')}catch(e){guardReasons.push(String(e))}console.log((guardReasons.length?'FAIL':'PASS')+' STATE_GUARD_FREEZE'+(guardReasons.length?' :: '+guardReasons.join(' | '):''));if(guardReasons.length)failed++;await guard.close();
          console.log('SUMMARY '+JSON.stringify({passed,failed,requested:41,stateGuard:guardReasons.length===0}));await browser.close();if(failed)process.exit(1);
          EOF
          node cert41.mjs
