name: Storefront inline script diagnostic
on:
  push:
    paths:
      - '.github/workflows/storefront-inline-script-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Find invalid inline scripts
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright'; import fs from 'fs';
          const BASE='https://www.statesideqm.com';
          const routes=['/collections/state-guard-series-ohio','/collections/state-guard-series-alabama','/collections/air-national-guard-flags-displays-memorials'];
          const browser=await chromium.launch({headless:true}); const out=[];
          for(const path of routes){const page=await browser.newPage();await page.goto(BASE+path,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(1200);const scripts=await page.locator('script:not([src])').evaluateAll(ss=>ss.map((s,i)=>({i,type:s.type||'',mark:[...s.attributes].filter(a=>a.name.startsWith('data-sq')).map(a=>a.name+'='+a.value).join(' '),text:s.textContent||''})));const invalid=[];for(const s of scripts){if(s.type&&s.type!=='text/javascript'&&s.type!=='application/javascript'&&s.type!=='module')continue;if(!s.text.trim())continue;try{if(s.type==='module'){continue}else new Function(s.text)}catch(e){invalid.push({i:s.i,mark:s.mark,error:String(e),length:s.text.length,head:s.text.slice(0,1000),tail:s.text.slice(-500)})}}out.push({path,invalid});await page.close();await new Promise(r=>setTimeout(r,2500))}await browser.close();fs.mkdirSync('out',{recursive:true});fs.writeFileSync('out/invalid-scripts.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));
          EOF
          node diag.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inline-script-diagnostic
          path: out
          retention-days: 7
