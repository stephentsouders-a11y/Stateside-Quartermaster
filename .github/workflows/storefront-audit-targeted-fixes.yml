name: Storefront targeted Chromium fixes
on:
  push:
    paths:
      - '.github/workflows/storefront-audit-targeted-fixes.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify changed routes in persistent Chromium sessions
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
        run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const routes=[
            ['thin-line','/collections/thin-line'],
            ['sta-brite','/collections/sta-brite-insignia'],
            ['afg','/collections/armed-forces-gear'],
            ['state-guard-alabama','/collections/state-guard-series-alabama'],
            ['thin-yellow','/collections/thin-line-shop-thin-yellow-line'],
            ['thin-yellow-products','/collections/thin-line-shop-thin-yellow-line?filter.p.product_type=First%20Responder%20Patches&sort_by=title-ascending'],
            ['army','/collections/products-built-for-the-line-u-s-army']
          ];
          fs.mkdirSync('out',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const all=Object.fromEntries(routes.map(([slug,path])=>[slug,{slug,path}]));
          const inspect=async page=>page.evaluate(()=>{
            const main=document.querySelector('#MainContent');
            const vis=e=>!!e&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden'&&e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0;
            const tx=e=>(e?.textContent||'').replace(/\s+/g,' ').trim();
            const rr=e=>e?(()=>{const r=e.getBoundingClientRect();return{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}})():null;
            const side=[...(main?.querySelectorAll('.sq-global-refine-sidebar')||[])].find(vis),primary=main?.querySelector('.sq-global-refine-main');
            const cards=[...(primary?.querySelectorAll('.sq-subcategory-card,.sq-afg-branch-card,.sq-ts-match-card,.sqbfl-card,.sg-entity,.sqsg-card,.product-card,.product-grid__item,.sqbfl-product,.sqsg-product,.sq-custom-color-product')||[])].filter(vis),r3=cards.slice(0,3).map(rr);
            const details=side?[...side.querySelectorAll('details')].map(d=>({summary:tx(d.querySelector('summary')),items:[...d.querySelectorAll('a[href]')].map(a=>tx(a.querySelector('span')||a)).slice(0,300)})):[];
            const body=tx(main);
            return {title:document.title,url:location.href,errorPage:/something went wrong|internal server error|there was a problem/i.test(document.title+' '+body),challenge:/just a moment/i.test(document.title),loading:/loading items|building the customer-facing product tree|checking items|tree unavailable/i.test(body),availableWording:/available items|currently available|in-stock only/i.test(body),sidebarCount:[...(main?.querySelectorAll('.sq-global-refine-sidebar')||[])].filter(vis).length,sidebarRect:rr(side),mainRect:rr(primary),details,horizontalFacets:[...(main?.querySelectorAll('.sq-facet-browser,.sq-maker-browser,[data-sq-facet-browser],.sqsg-facet')||[])].filter(vis).length,availabilityLinks:[...(main?.querySelectorAll('a[href]')||[])].filter(a=>(a.getAttribute('href')||'').includes('filter.v.availability')).map(a=>a.getAttribute('href')).slice(0,30),cardCount:cards.length,firstThree:r3,sameRow:r3.length===3&&Math.max(...r3.map(x=>x.y))-Math.min(...r3.map(x=>x.y))<6,fourColumnGate:side&&r3.length===3?Math.abs(side.getBoundingClientRect().width-r3[0].w)<=20&&Math.max(...r3.map(x=>x.y))-Math.min(...r3.map(x=>x.y))<6:null,brokenImages:[...(main?.querySelectorAll('img')||[])].filter(i=>i.complete&&i.naturalWidth===0).map(i=>({alt:i.alt,src:i.currentSrc||i.src})).slice(0,30),overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,bodyText:body.slice(0,6000)};
          });
          async function verifyViewport(kind,viewport){
            const ctx=await browser.newContext({viewport});const page=await ctx.newPage();page.setDefaultNavigationTimeout(60000);
            const warm=new URL('/',process.env.BASE);warm.searchParams.set('preview_theme_id',process.env.THEME);await page.goto(warm.toString(),{waitUntil:'domcontentloaded'}).catch(()=>{});await page.waitForTimeout(1800);
            for(const [slug,path] of routes){
              const u=new URL(path,process.env.BASE);u.searchParams.delete('filter.v.availability');u.searchParams.set('preview_theme_id',process.env.THEME);
              const t0=Date.now();let status=null,error=null;
              try{let r=await page.goto(u.toString(),{waitUntil:'domcontentloaded'});status=r?.status()??null;if(/just a moment/i.test(await page.title())){await page.waitForTimeout(8000);r=await page.reload({waitUntil:'domcontentloaded'});status=r?.status()??status}}catch(e){error=String(e)}
              let usableMs=null;for(let i=0;i<32;i++){const ok=await page.evaluate(()=>{const m=document.querySelector('#MainContent');if(!m)return false;const t=(m.textContent||'').replace(/\s+/g,' ');if(/loading items|building the customer-facing product tree|checking items|tree unavailable/i.test(t))return false;return [...m.querySelectorAll('a,.product-card,.product-grid__item,.sq-ts-match-card,.sqbfl-card,.sg-entity')].some(e=>{const r=e.getBoundingClientRect();return r.width>30&&r.height>20})}).catch(()=>false);if(ok){usableMs=Date.now()-t0;break}await page.waitForTimeout(250)}
              await page.waitForTimeout(1500);const data=await inspect(page).catch(e=>({extractError:String(e)}));await page.screenshot({path:`out/${slug}-${kind}.png`,fullPage:true}).catch(()=>{});all[slug][kind]={status,error,usableMs,...data};fs.writeFileSync('out/report.json',JSON.stringify(Object.values(all),null,2));await page.waitForTimeout(2200);
            }
            await ctx.close();
          }
          await verifyViewport('desktop',{width:1440,height:1100});
          await new Promise(r=>setTimeout(r,6000));
          await verifyViewport('mobile',{width:390,height:844});
          await browser.close();
          const rows=Object.values(all);console.log(JSON.stringify(rows.map(r=>({slug:r.slug,desktop:r.desktop&&{status:r.desktop.status,usableMs:r.desktop.usableMs,sidebar:r.desktop.sidebarCount,cards:r.desktop.cardCount,gate:r.desktop.fourColumnGate,loading:r.desktop.loading,challenge:r.desktop.challenge,errorPage:r.desktop.errorPage},mobile:r.mobile&&{status:r.mobile.status,usableMs:r.mobile.usableMs,sidebar:r.mobile.sidebarCount,cards:r.mobile.cardCount,loading:r.mobile.loading,challenge:r.mobile.challenge,errorPage:r.mobile.errorPage}})),null,2));
          EOF
          node verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-current-fixes-persistent
          path: out
          retention-days: 7
