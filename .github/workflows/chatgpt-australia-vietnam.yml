name: Australia Vietnam Roll Process
on:
  push:
    branches:
      - chatgpt-vietnam-casualty-data-process
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Extract official DVA Roll names
        run: |
          python -m pip install --quiet beautifulsoup4 requests
          python - <<'PY'
          import requests,re,csv,time,pathlib
          from bs4 import BeautifulSoup
          base='https://anzacportal.dva.gov.au/wars-and-missions/vietnam-war/commemoration/roll-of-honour-gallery'
          sess=requests.Session()
          sess.headers.update({'User-Agent':'Mozilla/5.0 (compatible; historical-research/1.0)'})
          names=[]; failures=[]
          for page in range(18):
              u=base if page==0 else f'{base}?page={page}'
              html=None
              for attempt in range(6):
                  try:
                      r=sess.get(u,timeout=(20,180))
                      print('DVA',page,'attempt',attempt+1,r.status_code,len(r.content))
                      if r.ok and len(r.text)>10000:
                          html=r.text; break
                  except Exception as e:
                      print('retry',page,attempt+1,repr(e))
                  time.sleep(2+attempt)
              if html is None:
                  failures.append(page); continue
              pathlib.Path(f'page_{page:02d}.html').write_text(html,encoding='utf-8')
              s=BeautifulSoup(html,'html.parser')
              # Names appear in the gallery content as surname, given names.
              for t in s.stripped_strings:
                  t=' '.join(t.split())
                  if ',' in t and len(t)<90 and not any(x in t.lower() for x in ['department','gpo box','dva (','brisbane','search']):
                      # require plausible personal-name format and exclude page prose
                      if re.fullmatch(r"[A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-öø-ÿ' .-]+,\s*[A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-öø-ÿ' .\"()-]+",t):
                          names.append(t)
          uniq=[]
          for n in names:
              if n not in uniq: uniq.append(n)
          print('failures',failures,'unique names',len(uniq))
          with open('australia_vietnam_roll_names.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f);w.writerow(['record_no','name_verbatim','source_url'])
              for i,n in enumerate(uniq,1): w.writerow([i,n,base])
          pathlib.Path('summary.txt').write_text(f'failures={failures}\nunique_names={len(uniq)}\n',encoding='utf-8')
          assert not failures, failures
          assert len(uniq)==524, len(uniq)
          PY
      - name: Upload Australia artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: australia-vietnam-roll
          path: |
            australia_vietnam_roll_names.csv
            summary.txt
            page_*.html
          retention-days: 1
