name: Sep16 Accessories depth discovery
on:
  push:
    paths:
      - '.github/workflows/sep16-accessories-depth-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect actual child pages
        run: |
          node - <<'EOF'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const c=await b.newContext({viewport:{width:1280,height:900}});
            const p=await c.newPage();
            await p.goto('https://www.statesideqm.com/?preview_theme_id=158770561179',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(1200);
            const root=await p.goto('https://www.statesideqm.com/collections/accessories-gifts-collectibles',{waitUntil:'domcontentloaded',timeout:60000});
            if(root?.status()===429){console.log('ROOT_429');process.exit(2)}
            await p.waitForTimeout(7000);
            const cats=await p.locator('[data-sq-context-categories-list] a[href]').evaluateAll(as=>as.map(a=>({label:(a.querySelector('.sq-collection-rail__link-label')?.textContent||a.textContent||'').trim(),href:a.href})));
            console.log('ROOT_CATEGORIES',JSON.stringify(cats));
            for(const cat of cats){
              await p.waitForTimeout(1700);
              const r=await p.goto(cat.href,{waitUntil:'domcontentloaded',timeout:60000});
              if(r?.status()===429){console.log('CHILD_429',cat.label,cat.href);await p.waitForTimeout(20000);continue}
              await p.waitForTimeout(2500);
              const data=await p.evaluate(()=>{
                const txt=e=>(e?.textContent||'').replace(/\s+/g,' ').trim();
                const links=(sel)=>[...document.querySelectorAll(sel)].map(a=>({label:txt(a.querySelector('.sq-subcategory-name,.sq-third-level__name,[class*="__name"],strong,h3,h4'))||txt(a),href:a.href})).filter(x=>x.label&&x.href);
                const groups=[...document.querySelectorAll('#MainContent section')].map(s=>({heading:txt(s.querySelector('h2,h3')),classes:s.className,links:[...s.querySelectorAll('a[href*="/collections/"]')].length})).filter(x=>x.links);
                return{sub:links('.sq-subcategory-section a[href*="/collections/"], a.sq-subcategory-card[href*="/collections/"]'),types:links('.sq-third-level__type[href],.sq-ptype-browser__card[href],.vac-service-card[href],.vac-knives-browser__button[href],.vac-armor-browser__card[href]'),groups};
              });
              console.log('CHILD',JSON.stringify({category:cat.label,url:cat.href,subCount:data.sub.length,typeCount:data.types.length,sub:data.sub.slice(0,20),types:data.types.slice(0,40),groups:data.groups.slice(0,20)}));
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
