name: Thin Line final loading Chromium certification
on:
  push:
    paths:
      - '.github/workflows/thin-line-final-loading-cert-0911.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: thin-line-final-loading-cert
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPT_OUT_INSTRUMENTATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and validation tools
        run: |
          mkdir -p out/screens out/videos out/source validation-tools
          npm install --no-save playwright@1.55.0 agent-browser yaml @shopify/theme-check-common @shopify/theme-check-node @shopify/theme-check-docs-updater
          npx playwright install --with-deps chromium
          curl --fail --retry 3 -L https://raw.githubusercontent.com/openai/plugins/main/plugins/shopify/skills/shopify-liquid/scripts/search_docs.mjs -o validation-tools/search_docs.mjs
          curl --fail --retry 3 -L https://raw.githubusercontent.com/openai/plugins/main/plugins/shopify/skills/shopify-liquid/scripts/validate.mjs -o validation-tools/validate.mjs
      - name: Search critical layout documentation
        run: node validation-tools/search_docs.mjs 'collection.handle critical CSS layout shift' --model 'GPT-6 Astra Pro' --client-name ChatGPT --client-version 1 > out/shopify-documentation.txt
      - name: Validate all modified theme files
        id: liquid
        continue-on-error: true
        run: |
          for f in sections/sq-thin-stabrite-subcategories.liquid sections/sq-thin-line-loading-space.liquid templates/collection.thin-stabrite-parent.json; do
            cp "$f" out/source/
            node validation-tools/validate.mjs --filename "$(basename "$f")" --filetype "${f%%/*}" --file "$f" --model 'GPT-6 Astra Pro' --client-name ChatGPT --client-version 1 --artifact-id "thin-line-final-$(basename "$f")" --revision 1 > "out/validate-$(basename "$f").txt" || exit 1
          done
      - name: Inspect draft using agent-browser
        run: |
          npx agent-browser --session thin-line-final open 'https://www.statesideqm.com/collections/thin-line?preview_theme_id=158561894555'
          npx agent-browser --session thin-line-final snapshot -i > out/agent-browser-snapshot.txt
          npx agent-browser --session thin-line-final screenshot out/screens/agent-browser.png
          npx agent-browser --session thin-line-final close
      - name: Repeat full Chromium suite with footer regression test
        id: browser
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import YAML from 'yaml';
          const workflow=YAML.parse(fs.readFileSync('.github/workflows/thin-line-zero-flash-cert-0911.yml','utf8'));
          const original=workflow.jobs.certify.steps.find(s=>s.id==='browser').run;
          const command=original.replace(/\nnode thin-line-cert\.mjs\s*$/,'');
          if(command===original)throw new Error('Cannot locate existing test invocation');
          execFileSync('bash',['-c',command],{stdio:'inherit'});
          let code=fs.readFileSync('thin-line-cert.mjs','utf8');
          function replaceOnce(from,to){if(!code.includes(from))throw new Error('Test source changed: '+from);code=code.replace(from,to);}
          replaceOnce('window.__thinPaint=[];window.__thinSamples=0;', 'window.__thinPaint=[];window.__thinSamples=0;window.__thinFooterFrames=[];');
          replaceOnce('if(main){const legacy=', 'if(main){const footer=document.querySelector("footer");if(footer&&main.dataset.sqRefineV3Ready!=="true"){const r=footer.getBoundingClientRect();if(visible(footer)&&r.top<innerHeight&&r.bottom>0)window.__thinFooterFrames.push({t:Math.round(performance.now()),top:r.top,mainHeight:main.getBoundingClientRect().height});}const legacy=');
          replaceOnce('return {url:location.href,theme:', 'return {footerFrames:window.__thinFooterFrames||[],spaceMarker:!!document.querySelector("[data-sq-thin-line-loading-space]"),minHeight:getComputedStyle(main).minHeight,url:location.href,theme:');
          replaceOnce("check(row,'Deployed first-paint fix',s.marker);", "check(row,'Deployed first-paint fix',s.marker);check(row,'Loading-space patch deployed',s.spaceMarker);check(row,'Footer never intrudes during grid loading',s.footerFrames.length===0,s.footerFrames);check(row,'Temporary loading height released',parseFloat(s.minHeight)<100,s.minHeight);");
          fs.writeFileSync('thin-line-final-cert.mjs',code);fs.writeFileSync('out/test-source.mjs',code);
          const files=['sections/sq-thin-stabrite-subcategories.liquid','sections/sq-thin-line-loading-space.liquid','templates/collection.thin-stabrite-parent.json'];
          fs.writeFileSync('out/deployment-manifest.json',JSON.stringify({commit:process.env.GITHUB_SHA,files:files.map(filename=>({filename,md5:crypto.createHash('md5').update(fs.readFileSync(filename)).digest('hex')}))},null,2));
          JS
          node --check thin-line-final-cert.mjs
          node thin-line-final-cert.mjs
      - name: Upload screenshots videos and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thin-line-final-loading-cert-0911
          path: out
          retention-days: 14
      - name: Final validation gate
        if: always()
        run: test '${{ steps.liquid.outcome }}' = success && test '${{ steps.browser.outcome }}' = success
