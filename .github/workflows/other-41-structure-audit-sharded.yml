name: Other 41 sharded Chromium structure audit
on:
  push:
    paths:
      - '.github/workflows/other-41-structure-audit-sharded.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Chromium audit shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cat > audit-shard.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base='https://www.statesideqm.com';
          const theme='158770561179';
          const shard=Number(process.env.SHARD);
          const shardCount=8;
          const allRoutes=[
            ['Tactical Gear','/collections/tactical-gear'],
            ['Uniforms','/collections/uniforms'],
            ['Firearm Accessories','/collections/firearm-accessories'],
            ['Body Armor & Ballistic Protection','/collections/body-armor-ballistic-protection'],
            ['Apparel','/collections/apparel'],
            ['Flags & Patriotic Decor','/collections/flags-patriotic-decor'],
            ['Literature','/collections/literature'],
            ['Outdoor & Preparedness Gear','/collections/outdoor-preparedness-gear'],
            ['First Aid, Medical & IFAK','/collections/first-aid-medical-ifak'],
            ['Flashlights & Lighting','/collections/flashlights-lighting'],
            ['Knives, Axes & Cutlery','/collections/knives-axes-cutlery'],
            ['Dive & Scuba','/collections/dive-scuba'],
            ['Armed Forces Gear','/collections/armed-forces-gear'],
            ['Morale Patches & Tactical ID','/collections/morale-patches-tactical-id'],
            ['Footwear, Gloves & Eyewear','/collections/footwear-gloves-eyewear'],
            ['Accessories, Gifts & Collectibles','/collections/accessories-gifts-collectibles'],
            ['Safety, Rescue & Climbing','/collections/safety-rescue-climbing'],
            ['Airsoft & Milsim','/collections/airsoft-milsim'],
            ['K9 & Dog Gear','/collections/k9-dog-gear'],
            ['Patriotic & American Heritage','/collections/patriotic-american-heritage'],
            ['Art','/collections/art'],
            ['Zippos, Lighters & Torches','/collections/zippos-lighters-torches'],
            ['Watches','/collections/watches'],
            ['Armored Vehicles','/pages/armored-vehicles-purchase-inquiry'],
            ['Child Safety Shop','/collections/child-safety-shop'],
            ['Thin Line','/collections/thin-line'],
            ['Sta-Brite Insignia','/collections/sta-brite-insignia'],
            ['Stateside Quartermaster Logo Merch','/collections/stateside-quartermaster-logo-merch'],
            ['Army National Guard Series','/collections/army-national-guard-series'],
            ['Air National Guard Series','/collections/air-national-guard-series'],
            ['U.S. Army','/collections/products-built-for-the-line-u-s-army'],
            ['U.S. Navy','/collections/products-built-for-the-line-u-s-navy'],
            ['U.S. Air Force','/collections/products-built-for-the-line-u-s-air-force'],
            ['U.S. Marine Corps','/collections/products-built-for-the-line-u-s-marine-corps'],
            ['U.S. Coast Guard','/collections/products-built-for-the-line-u-s-coast-guard'],
            ['U.S. Space Force','/collections/products-built-for-the-line-u-s-space-force'],
            ['ROTC','/collections/rotc-series'],
            ['JROTC','/collections/jrotc-series'],
            ['Military Schools & Academies','/collections/military-schools-academies'],
            ['Law Enforcement & Corrections','/collections/law-enforcement-corrections'],
            ['Firefighting, EMS & Search & Rescue','/collections/firefighting-ems-search-rescue']
          ];
          if(allRoutes.length!==41) throw new Error(`Expected 41 routes, got ${allRoutes.length}`);
          if(allRoutes.some(x=>/state-guard-series/i.test(x[1]))) throw new Error('State Guard must remain excluded');
          const routes=allRoutes.filter((_,i)=>i%shardCount===shard);
          if(!routes.length) throw new Error(`No routes for shard ${shard}`);

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            viewport:{width:1440,height:1000},
            locale:'en-US',
            userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36'
          });
          const page=await context.newPage();
          page.setDefaultNavigationTimeout(60000);

          async function blockedPage(){
            return page.locator('body').evaluate(body=>{
              const t=(body.innerText||'').toLowerCase();
              return t.includes('just a moment') || t.includes('something went wrong');
            }).catch(()=>false);
          }

          async function gotoWithBackoff(url,label){
            let response=null;
            let lastError=null;
            for(let attempt=0;attempt<5;attempt++){
              try{
                response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
                await sleep(6500);
              }catch(e){ lastError=String(e); }
              const status=response?.status()??null;
              const blocked=await blockedPage();
              if(status===200 && !blocked) return {response,attempts:attempt+1,lastError:null};
              if(attempt<4){
                const delay=10000 + attempt*15000 + shard*1200;
                console.log(`${label}: HTTP ${status}, blocked=${blocked}; retrying in ${delay}ms`);
                await sleep(delay);
              }
            }
            return {response,attempts:5,lastError};
          }

          const warm=new URL('/',base); warm.searchParams.set('preview_theme_id',theme);
          await gotoWithBackoff(warm.toString(),`shard ${shard} warmup`);
          await sleep(2500+shard*600);

          const results=[];
          for(let i=0;i<routes.length;i++){
            const [label,route]=routes[i];
            const consoleErrors=[];
            const listener=m=>{if(m.type()==='error')consoleErrors.push(m.text())};
            page.on('console',listener);
            const u=new URL(route,base);
            u.searchParams.set('preview_theme_id',theme);
            if(route.startsWith('/collections/'))u.searchParams.set('filter.v.availability','1');
            const nav=await gotoWithBackoff(u.toString(),label);
            const status=nav.response?.status()??null;

            const state=await page.evaluate(()=>{
              const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>1&&r.height>1};
              const visible=q=>[...document.querySelectorAll(q)].filter(vis);
              const txt=e=>(e?.innerText||e?.textContent||'').replace(/\s+/g,' ').trim();
              const getGroup=k=>{
                const item=document.querySelector('[data-sq-context-'+k+']');
                const list=document.querySelector('[data-sq-context-'+k+'-list]');
                const links=list?[...list.querySelectorAll('a[href]')].map(a=>({label:txt(a),href:a.getAttribute('href'),current:a.getAttribute('aria-current')||''})):[];
                return {exists:!!item,hiddenAttr:item?item.hidden:null,visible:item?vis(item):false,domCount:links.length,links};
              };
              const getRefinement=key=>{
                const item=document.querySelector('[data-sq-refinement-key="'+key+'"]');
                const links=item?[...item.querySelectorAll('a[href]')].map(a=>({label:txt(a),href:a.getAttribute('href')})):[];
                return {exists:!!item,hiddenAttr:item?item.hidden:null,visible:item?vis(item):false,domCount:links.length,links:links.slice(0,60)};
              };
              const bodySelectors=['.sq-subcategory-section','.sq-third-level','.sq-books-tree','.sq-afg-branch-section','.sq-line-series-categories','.sq-line-program-tree','.sq-ps-root','.sq-ts-match-section','.sq-child-safety-section','.sq-maker-browser','.vac-unified-maker-browser','.vac-merged-browser','.vac-firearm-browser','.vac-dive-browser','.vac-knives-browser','.vac-armor-browser'];
              const rail=document.querySelector('[data-sq-collection-rail]');
              return {
                title:document.title,
                path:location.pathname,
                railCount:document.querySelectorAll('[data-sq-collection-rail]').length,
                railVisible:rail?vis(rail):false,
                sourceButtonCount:rail?Number(rail.dataset.sqSourceButtonCount||0):0,
                mirroredLinkCount:rail?Number(rail.dataset.sqMirroredLinkCount||0):0,
                groups:{categories:getGroup('categories'),subcategories:getGroup('subcategories'),types:getGroup('types'),organizations:getGroup('organizations')},
                refinements:{manufacturer:getRefinement('manufacturer'),colorPattern:getRefinement('color-pattern'),price:getRefinement('price')},
                whiteRefineVisible:visible('.sq-global-refine-sidebar,.sqsg-refine-sidebar').length,
                nativeFiltersVisible:visible('.facets__filters-wrapper,.facets-horizontal-remove,.facets--filters-title,.facets-toggle__wrapper,theme-drawer#filters-drawer').length,
                productGridVisible:visible('collection-component,.product-grid,.product-grid-container').length,
                productCardsVisible:visible('.product-card,.product-grid__item,.card-product').length,
                bodyNav:bodySelectors.flatMap(q=>[...document.querySelectorAll(q)].map(e=>({selector:q,visible:vis(e),mirrored:e.getAttribute('data-sq-mirrored-to-rail')||'',text:txt(e).slice(0,260)}))),
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4
              };
            }).catch(e=>({evaluateError:String(e)}));

            if(route.startsWith('/collections/')){
              for(const key of ['categories','subcategories','types','organizations']){
                const trigger=page.locator(`[data-sq-context-${key}]:not([hidden]) > [data-sq-rail-trigger]`);
                if(await trigger.count()){
                  await trigger.first().click().catch(()=>{});
                  await sleep(250);
                  const expanded=await trigger.first().getAttribute('aria-expanded').catch(()=>null);
                  state.groups[key].openedExpanded=expanded;
                  const flyout=page.locator(`[data-sq-context-${key}] [data-sq-rail-flyout]`);
                  state.groups[key].flyoutVisible=await flyout.first().evaluate(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>1&&r.height>1}).catch(()=>false);
                  await trigger.first().click().catch(()=>{});
                  await sleep(120);
                }
              }
            }

            results.push({label,route,status,attempts:nav.attempts,lastError:nav.lastError,consoleErrors:consoleErrors.slice(0,25),...state});
            console.log(`${label}: status=${status} rail=${state.railCount??'n/a'} domCats=${state.groups?.categories?.domCount??0} domSub=${state.groups?.subcategories?.domCount??0} domTypes=${state.groups?.types?.domCount??0} makers=${state.refinements?.manufacturer?.domCount??0}`);
            page.off('console',listener);
            await sleep(3500+shard*400);
          }

          await context.close();
          await browser.close();
          fs.mkdirSync('audit-out',{recursive:true});
          fs.writeFileSync(`audit-out/shard-${shard}.json`,JSON.stringify({theme,shard,routeCount:routes.length,results},null,2));

          const bad=results.filter(r=>r.status!==200 || (r.route.startsWith('/collections/') && r.railCount!==1));
          if(bad.length){
            console.error(`Shard ${shard} has ${bad.length} HTTP/rail failures`);
            process.exitCode=2;
          }
          NODE
          node audit-shard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: other-41-audit-shard-${{ matrix.shard }}
          path: audit-out
          retention-days: 7
