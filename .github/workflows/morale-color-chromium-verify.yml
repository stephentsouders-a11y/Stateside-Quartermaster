name: Verify morale color filter in Chromium
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/morale-color-chromium-verify.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: morale-color-chromium-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-restart-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore the unchanged browser assertions from their audited commit
        run: |
          mkdir -p /tmp/morale-verify/out
          python - <<'PY'
          import pathlib, subprocess
          source = subprocess.check_output(['git', 'show', 'e42ab118a280bdadb41129eb78b2f8d5766ad249:.github/workflows/morale-color-chromium-verify.yml'], text=True)
          lines = source.splitlines()
          start = next(i for i, line in enumerate(lines) if "cat > /tmp/morale-verify/test.mjs <<'JS'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'JS')
          margin = len(lines[start]) - len(lines[start].lstrip())
          script = '\n'.join(line[margin:] for line in lines[start + 1:end]) + '\n'
          assert "if(report.status!=='PASS')process.exitCode=1;" in script
          pathlib.Path('/tmp/morale-verify/test.mjs').write_text(script)
          PY
          node --check /tmp/morale-verify/test.mjs
      - name: Install browser and validation tools
        run: |
          cd /tmp/morale-verify
          npm init -y >/dev/null
          npm install playwright@1.55.0 agent-browser @shopify/theme-check-common @shopify/theme-check-docs-updater @shopify/theme-check-node >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          curl -fsSL https://raw.githubusercontent.com/openai/plugins/main/plugins/shopify/skills/shopify-liquid/scripts/search_docs.mjs -o search_docs.mjs
          curl -fsSL https://raw.githubusercontent.com/openai/plugins/main/plugins/shopify/skills/shopify-liquid/scripts/validate.mjs -o validate.mjs
          node search_docs.mjs 'collection all_tags storefront product tag filtering' --model gpt-6-astra-pro --client-name ChatGPT --client-version '2026-09-11' > out/docs-search.txt
          node validate.mjs --filename sq-refine-v3-morale-color-pattern.liquid --filetype snippets --file "$GITHUB_WORKSPACE/snippets/sq-refine-v3-morale-color-pattern.liquid" --model gpt-6-astra-pro --client-name ChatGPT --client-version '2026-09-11' --artifact-id morale-color-pattern-0911 --revision 2 --json > out/liquid-validation.json
      - name: Inspect storefront with agent-browser Chromium
        continue-on-error: true
        run: |
          cd /tmp/morale-verify
          export AGENT_BROWSER_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx agent-browser --session morale open 'https://www.statesideqm.com/collections/morale-patches-tactical-id?preview_theme_id=158561894555'
          npx agent-browser --session morale wait '.sq-refine-v3-sidebar'
          npx agent-browser --session morale snapshot -i > out/agent-browser-snapshot.txt
          npx agent-browser --session morale screenshot out/agent-browser.png
          npx agent-browser --session morale close
      - name: Verify desktop mobile filtering and product truth
        run: |
          cd /tmp/morale-verify
          node test.mjs
      - name: Record actual verification report in GitHub
        if: always()
        run: |
          if [ -f /tmp/morale-verify/out/report.json ]; then
            mkdir -p .github/audits
            cp /tmp/morale-verify/out/report.json .github/audits/morale-color-chromium-report.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/audits/morale-color-chromium-report.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record actual morale Color Pattern Chromium test results'
              for attempt in 1 2 3; do
                git pull --rebase origin refine-restart-v3
                if git push origin HEAD:refine-restart-v3; then break; fi
              done
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morale-color-chromium-evidence
          path: /tmp/morale-verify/out
          retention-days: 14
