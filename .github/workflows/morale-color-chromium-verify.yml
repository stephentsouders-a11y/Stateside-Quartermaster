name: Verify morale color filter in Chromium
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/morale-color-chromium-verify.yml'
      - 'snippets/sq-refine-v3-morale-color-pattern.liquid'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: morale-color-chromium-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-restart-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and validation tools
        run: |
          mkdir -p /tmp/morale-verify/out
          cd /tmp/morale-verify
          npm init -y >/dev/null
          npm install playwright@1.55.0 agent-browser @shopify/theme-check-common @shopify/theme-check-docs-updater @shopify/theme-check-node >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          curl -fsSL https://raw.githubusercontent.com/openai/plugins/main/plugins/shopify/skills/shopify-liquid/scripts/search_docs.mjs -o search_docs.mjs
          curl -fsSL https://raw.githubusercontent.com/openai/plugins/main/plugins/shopify/skills/shopify-liquid/scripts/validate.mjs -o validate.mjs
          node search_docs.mjs 'collection product tag url filtering current_tags' --model gpt-6-astra-pro --client-name ChatGPT --client-version '2026-09-11' > out/docs-search.txt
          node validate.mjs --filename sq-refine-v3-morale-color-pattern.liquid --filetype snippets --file "$GITHUB_WORKSPACE/snippets/sq-refine-v3-morale-color-pattern.liquid" --model gpt-6-astra-pro --client-name ChatGPT --client-version '2026-09-11' --artifact-id morale-color-pattern-native-0911 --revision 2 --json > out/liquid-validation.json
      - name: Inspect storefront with agent-browser Chromium
        continue-on-error: true
        run: |
          cd /tmp/morale-verify
          export AGENT_BROWSER_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx agent-browser --session morale open 'https://www.statesideqm.com/collections/morale-patches-tactical-id?preview_theme_id=158561894555'
          npx agent-browser --session morale wait '.sq-refine-v3-sidebar'
          npx agent-browser --session morale snapshot -i > out/agent-browser-snapshot.txt
          npx agent-browser --session morale screenshot out/agent-browser.png
          npx agent-browser --session morale close
      - name: Verify desktop mobile native tag filtering and product truth
        run: |
          cat > /tmp/morale-verify/test.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const root='https://www.statesideqm.com/collections/morale-patches-tactical-id';
          const theme='158561894555';
          const base=root+'?preview_theme_id='+theme;
          const canonical=['Black','Blue','Brown / Tan','Camouflage','Gray','Green','Orange','Pink','Red','White'];
          const report={status:'RUNNING',theme,publication:'UNPUBLISHED',sourceCommit:process.env.GITHUB_SHA,started:new Date().toISOString(),checks:[],pageErrors:[],tests:[]};
          const out='/tmp/morale-verify/out';
          const browser=await chromium.launch({headless:true});
          report.browserVersion=browser.version();
          const context=await browser.newContext({viewport:{width:1440,height:1000},recordVideo:{dir:out+'/video',size:{width:1440,height:1000}}});
          await context.tracing.start({screenshots:true,snapshots:true,sources:true});
          const page=await context.newPage();
          page.setDefaultTimeout(30000); page.setDefaultNavigationTimeout(70000);
          page.on('pageerror',e=>report.pageErrors.push({url:page.url(),message:String(e)}));
          const side=()=>page.locator('.sq-refine-v3-sidebar');
          const group=()=>page.locator('.sq-refine-v3-sidebar > details').filter({has:page.locator(':scope > summary').filter({hasText:/^Shop by Color \/ Pattern$/})});
          const cards=()=>page.locator('.sq-refine-v3-results .product-grid > .product-grid__item');
          const productCache=new Map();
          const handleize=s=>String(s).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
          const expectedTag=label=>'SQ Color/Pattern: '+label;
          async function ready(){
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:65000});
            await page.waitForFunction(()=>!!document.querySelector('.sq-refine-v3-sidebar [data-sq-morale-color-pattern]'),null,{timeout:15000});
            assert.equal(String(await page.evaluate(()=>window.Shopify?.theme?.id)),theme,'Actual Shopify theme id');
            assert.equal(await side().count(),1,'One sidebar');
            assert.equal(await group().count(),1,'One combined color/pattern group');
          }
          async function go(url){const r=await page.goto(url,{waitUntil:'domcontentloaded'}); assert.ok(r?.ok(),'Page response '+r?.status()); await ready();}
          async function open(){if(!await group().evaluate(d=>d.open)) await group().locator(':scope > summary').click();}
          async function handles(){return cards().evaluateAll(es=>es.map(e=>{const a=e.querySelector('a[href*="/products/"]'); return a?new URL(a.href).pathname.split('/products/')[1].split('/')[0]:null}).filter(Boolean));}
          async function product(handle){if(productCache.has(handle)) return productCache.get(handle); const r=await page.request.get('https://www.statesideqm.com/products/'+handle+'.js'); assert.ok(r.ok(),'Product JSON '+handle+' '+r.status()); const data=await r.json(); productCache.set(handle,data); return data;}
          async function truth(tags,{allowEmpty=false}={}){const list=await handles(); if(!allowEmpty) assert.ok(list.length>0,'Filtered grid contains products'); assert.equal(new Set(list).size,list.length,'No repeated products in grid'); const samples=[]; for(const h of list.slice(0,12)){const p=await product(h); for(const t of tags) assert.ok(p.tags.includes(t),'Product '+h+' missing selected tag '+t); samples.push({handle:h,colorTags:p.tags.filter(t=>/^SQ Color\/Pattern:/.test(t))});} return {visibleCount:list.length,samples};}
          function input(label){return group().locator('input[data-sq-morale-color-tag='+JSON.stringify(expectedTag(label))+']');}
          async function select(label,on){await open(); const h=handleize(expectedTag(label)); await Promise.all([page.waitForURL(u=>{const seg=u.pathname.startsWith('/collections/morale-patches-tactical-id/')?u.pathname.split('/collections/morale-patches-tactical-id/')[1].split('/')[0]:''; const hs=seg?seg.split('+'):[]; return hs.includes(h)===on;},{waitUntil:'domcontentloaded'}),input(label).setChecked(on)]); await ready(); assert.equal(new URL(page.url()).searchParams.get('preview_theme_id'),theme,'Draft preview theme retained'); assert.equal(await input(label).isChecked(),on,'Correct checked state for '+label); assert.equal(new URL(page.url()).searchParams.has('filter.p.tag'),false,'Obsolete filter.p.tag is absent');}
          try{
            await go(base); await open();
            report.groups=await side().locator(':scope > details > summary').allTextContents();
            report.mode=await group().getAttribute('data-sq-morale-color-pattern');
            report.options=await group().locator('label').evaluateAll(es=>es.map(e=>({label:e.querySelector('span')?.textContent.trim(),tag:e.querySelector('input')?.dataset.sqMoraleColorTag,handle:e.querySelector('input')?.dataset.sqMoraleColorHandle})));
            assert.deepEqual(report.options.map(o=>o.label),canonical,'Exact canonical options and order');
            assert.deepEqual(report.options.map(o=>o.tag),canonical.map(expectedTag),'Exact canonical product tags');
            assert.ok(report.options.every(o=>o.handle===handleize(o.tag)),'Every checkbox carries correct native tag handle');
            const baseline=await handles(); report.baselineVisibleCount=baseline.length; assert.ok(baseline.length>0,'Baseline products render'); assert.equal(new Set(baseline).size,baseline.length,'Baseline products unique');
            await group().scrollIntoViewIfNeeded(); await page.screenshot({path:out+'/desktop-options.png'});
            report.checks.push('Desktop exact heading, 10 canonical tag-backed options, one sidebar, unique baseline grid');
            for(const label of ['Gray','Black','White']){await go(base); await select(label,true); const tag=expectedTag(label); const result=await truth([tag]); const filtered=await handles(); assert.notDeepEqual(filtered,baseline,label+' changes results'); assert.ok(await group().evaluate(d=>d.open),'Selected group remains open'); report.tests.push({label,tag,url:page.url(),...result}); await group().scrollIntoViewIfNeeded(); await page.screenshot({path:out+'/desktop-'+label.toLowerCase()+'.png'}); await select(label,false); assert.equal(new URL(page.url()).pathname,'/collections/morale-patches-tactical-id','Clearing '+label+' restores base collection route'); assert.deepEqual(await handles(),baseline,'Clearing '+label+' restores baseline');}
            report.checks.push('Gray Black White each change results and sampled products carry selected canonical tag; clear restores baseline');
            await go(base); await select('Gray',true); const persisted=page.url(); await page.reload({waitUntil:'domcontentloaded'}); await ready(); assert.ok(await input('Gray').isChecked(),'Gray persists after reload'); await truth([expectedTag('Gray')]); report.checks.push('Selected native tag persists after reload');
            await select('Black',true); const multiPath=new URL(page.url()).pathname; assert.ok(multiPath.includes('sq-color-pattern-gray')&&multiPath.includes('sq-color-pattern-black'),'Native multi-tag path contains both selections'); const multi=await truth([expectedTag('Gray'),expectedTag('Black')],{allowEmpty:true}); report.tests.push({label:'Gray + Black',url:page.url(),...multi}); assert.ok(await input('Gray').isChecked()&&await input('Black').isChecked(),'Both multi-select boxes remain checked'); await select('Black',false); await truth([expectedTag('Gray')]); assert.ok(await input('Gray').isChecked(),'Removing Black retains Gray'); report.checks.push('Multi-selection uses native + routes; removing one retains the other');
            for(const size of [100,250]){const u=new URL(persisted); u.searchParams.set('sq_per_page',String(size)); await go(u.href); assert.ok(await input('Gray').isChecked(),'Gray retained for '+size+' per page'); await truth([expectedTag('Gray')]); report.checks.push('Color remains applied at '+size+' products per page');}
            await page.setViewportSize({width:390,height:844}); await go(base); await open(); await group().scrollIntoViewIfNeeded(); await page.screenshot({path:out+'/mobile-options.png'}); await select('Gray',true); await truth([expectedTag('Gray')]); assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1),false,'No mobile horizontal overflow'); await group().scrollIntoViewIfNeeded(); await page.screenshot({path:out+'/mobile-gray.png'}); await select('Gray',false); assert.deepEqual(await handles(),baseline,'Mobile clear restores baseline'); report.checks.push('Mobile 390px Gray filters truthfully clears correctly and has no horizontal overflow');
            report.refineErrors=report.pageErrors.filter(e=>/sq-refine|sqMorale|morale.*color|SQ V3/i.test(e.message)); assert.equal(report.refineErrors.length,0,'No Refine or Morale Color controller page errors');
            report.status='PASS';
          } catch(error){report.status='FAIL'; report.failure=String(error.stack||error); report.failureUrl=page.url(); await page.screenshot({path:out+'/failure.png',fullPage:true}).catch(()=>{}); fs.writeFileSync(out+'/failure.html',await page.content().catch(()=>''));}
          finally{report.finished=new Date().toISOString(); await context.tracing.stop({path:out+'/trace.zip'}).catch(()=>{}); await context.close(); await browser.close(); fs.writeFileSync(out+'/report.json',JSON.stringify(report,null,2)); console.log(JSON.stringify(report,null,2));}
          if(report.status!=='PASS') process.exitCode=1;
          JS
          cd /tmp/morale-verify
          node --check test.mjs
          node test.mjs
      - name: Record actual verification report in GitHub
        if: always()
        run: |
          if [ -f /tmp/morale-verify/out/report.json ]; then
            mkdir -p .github/audits
            cp /tmp/morale-verify/out/report.json .github/audits/morale-color-chromium-report.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/audits/morale-color-chromium-report.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record actual morale Color Pattern Chromium test results'
              for attempt in 1 2 3; do git pull --rebase origin refine-restart-v3; if git push origin HEAD:refine-restart-v3; then break; fi; done
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morale-color-chromium-evidence
          path: /tmp/morale-verify/out
          retention-days: 14
