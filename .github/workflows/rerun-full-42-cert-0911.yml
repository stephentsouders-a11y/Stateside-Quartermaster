name: Trigger final full 42-route Chromium rerun
on:
  push:
    paths:
      - '.github/workflows/rerun-full-42-cert-0911.yml'
permissions:
  actions: write
  contents: read
jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Re-run exact full certification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/34654345833/rerun
          echo "Requested rerun of full certification run 34654345833"
