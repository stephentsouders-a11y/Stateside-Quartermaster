name: Refine V3 single-route certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-route-cert.yml'
      - '.github/scripts/refine-v3-route-cert.mjs'
      - 'snippets/sq-refine-v3-layout-fix.liquid'
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SQ_ROUTE_NAME: Accessories
      SQ_ROUTE: /collections/accessories-gifts-collectibles
      SQ_ROUTE_FIX: accessories-gifts-collectibles
      SQ_FALSE_HANDLES: all,stateside-quartermaster-logo-merch,air-national-guard-series,state-guard-series,rotc-series,jrotc-series,military-schools-academies,public-safety-series,army-national-guard-series
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run single-route certification
        run: node .github/scripts/refine-v3-route-cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-route-cert-accessories
          path: cert-v3-route/
          retention-days: 7
# trigger: accessories-1
