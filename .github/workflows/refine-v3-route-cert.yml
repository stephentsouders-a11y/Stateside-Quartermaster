name: Refine V3 single-route certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-route-cert.yml'
      - '.github/scripts/afg-grid-style-diagnostic.mjs'
      - '.github/scripts/refine-v3-route-cert-v2.mjs'
      - 'snippets/sq-refine-v3-layout-fix.liquid'
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Diagnose Armed Forces Gear grid visibility
        run: node .github/scripts/afg-grid-style-diagnostic.mjs
# route: 4-afg-diagnostic
