name: Refine V3 single-route certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-route-cert.yml'
      - '.github/scripts/body-armor-route-cert.mjs'
      - '.github/scripts/navy-v3-diagnostic.mjs'
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run Navy lifecycle diagnostic
        run: node .github/scripts/navy-v3-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-route-cert
          path: navy-*.png
          retention-days: 7
# route-cert-navy-diagnostic-v1