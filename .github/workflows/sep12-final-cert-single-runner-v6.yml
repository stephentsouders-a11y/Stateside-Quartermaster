name: Sep12 final certificate single runner v6
on:
  push:
    paths:
      - '.github/workflows/sep12-final-cert-single-runner-v6.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify frozen candidate on desktop and mobile
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
        run: |
          cat > certify.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          import fs from 'fs';
          const BASE=process.env.BASE,THEME=process.env.THEME,OUT='out';
          const routes=['/','/collections/products-built-for-the-line-u-s-army','/collections/army-national-guard-series','/collections/products-built-for-the-line-u-s-air-force','/collections/air-national-guard-series','/collections/products-built-for-the-line-u-s-navy','/collections/products-built-for-the-line-u-s-marine-corps','/collections/products-built-for-the-line-u-s-coast-guard','/collections/products-built-for-the-line-u-s-space-force','/collections/state-guard-series','/collections/rotc-series','/collections/jrotc-series','/collections/military-schools-academies','/collections/armed-forces-gear','/collections/accessories-gifts-collectibles','/collections/thin-line','/collections/sta-brite-insignia','/collections/state-guard-series-ohio'];
          fs.mkdirSync(`${OUT}/screens`,{recursive:true});fs.mkdirSync(`${OUT}/videos`,{recursive:true});
          const browser=await chromium.launch({headless:true}),results=[];
          const titleRequired=/^\/collections\/(products-built-for-the-line-u-s-(army|air-force|navy|marine-corps|coast-guard|space-force)|army-national-guard-series|air-national-guard-series|state-guard-series|rotc-series|jrotc-series|military-schools-academies)$/;
          const refineRequired=route=>route.startsWith('/collections/')&&route!=='/collections/state-guard-series';
          const productLinks='#MainContent collection-component a[href*="/products/"]:visible,#MainContent .sq-refine-v3-product-grid a[href*="/products/"]:visible,#MainContent .sq-taxonomy-products a[href*="/products/"]:visible,#MainContent [data-sq-stabrite-products] a[href*="/products/"]:visible,#MainContent .sq-global-refine-main .product-grid a[href*="/products/"]:visible';
          function safe(s){return s.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')||'home'}
          for(const device of ['desktop','mobile'])for(const route of routes){
            const u=new URL(route,BASE);u.searchParams.set('preview_theme_id',THEME);
            const context=await browser.newContext(device==='mobile'?{...devices['iPhone 13'],recordVideo:{dir:`${OUT}/videos`}}:{viewport:{width:1365,height:900},recordVideo:{dir:`${OUT}/videos`}});
            const page=await context.newPage();page.setDefaultTimeout(12000);page.setDefaultNavigationTimeout(35000);const r={device,route,failures:[]},t0=Date.now();
            try{
              const res=await page.goto(u.toString(),{waitUntil:'domcontentloaded'});r.status=res?.status()??null;await page.locator('#MainContent').waitFor({state:'attached',timeout:10000}).catch(()=>{});await page.waitForTimeout(Math.max(0,3500-(Date.now()-t0)));r.usableMs=Date.now()-t0;
              const body=((await page.locator('body').innerText().catch(()=>''))||'').slice(0,20000);r.title=await page.title();r.h1=((await page.locator('#MainContent h1,h1').first().innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim();
              r.sidebars=await page.locator('#MainContent .sq-refine-v3-sidebar:visible,#MainContent .sq-global-refine-sidebar:visible,#MainContent .sqsg-refine-sidebar:visible').count().catch(()=>0);r.horizontalFacets=await page.locator('#MainContent .facets-block-wrapper--horizontal:visible').count().catch(()=>0);r.spinner=await page.locator('text=/loading items|building the customer-facing product tree|checking items|organizing .* products/i').count().catch(()=>0);r.broken=await page.locator('#MainContent img').evaluateAll(xs=>xs.filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.alt||i.src).slice(0,20)).catch(()=>[]);r.overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+4).catch(()=>false);r.availabilityLinks=await page.locator('#MainContent a[href*="filter.v.availability"],#MainContent form[action*="filter.v.availability"]').count().catch(()=>0);r.urlAvailability=new URL(page.url()).searchParams.has('filter.v.availability');
              if(r.status!==200)r.failures.push(`HTTP_${r.status}`);if(/something went wrong|internal server error|there was a problem|404 not found|page not found/i.test((r.title||'')+' '+body))r.failures.push('ERROR_PAGE');if(r.spinner)r.failures.push('BLOCKING_SPINNER_AFTER_3_5S');if(r.broken.length)r.failures.push('BROKEN_IMAGES');if(r.overflow)r.failures.push('HORIZONTAL_OVERFLOW');if(r.horizontalFacets)r.failures.push('DUPLICATE_HORIZONTAL_FACETS');if(r.availabilityLinks||r.urlAvailability)r.failures.push('FORCED_AVAILABILITY_FILTER');if(titleRequired.test(route)&&!r.h1)r.failures.push('MISSING_VISIBLE_PAGE_TITLE');
              if(route==='/collections/state-guard-series'){
                if(r.sidebars!==0)r.failures.push(`STATE_GUARD_ROOT_SIDEBAR_${r.sidebars}`);r.sgCards=await page.locator('#MainContent .sg-entity:visible').count().catch(()=>0);r.sgMerch=await page.locator('#MainContent [data-sq-state-guard-merch-feature]:visible').count().catch(()=>0);if(r.sgCards<20)r.failures.push(`STATE_GUARD_CARD_COUNT_${r.sgCards}`);if(r.sgMerch!==1)r.failures.push(`STATE_GUARD_MERCH_COUNT_${r.sgMerch}`);r.sgOrder=await page.evaluate(()=>{const m=document.querySelector('[data-sq-state-guard-merch-feature]'),g=[...document.querySelectorAll('.sg-entity-grid')].find(x=>{const s=getComputedStyle(x),b=x.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&b.width>2&&b.height>2});return !!(m&&g&&(m.compareDocumentPosition(g)&Node.DOCUMENT_POSITION_FOLLOWING))}).catch(()=>false);if(!r.sgOrder)r.failures.push('STATE_GUARD_MERCH_NOT_ABOVE_GRID');if(device==='desktop'&&r.sgCards){r.sgCols=await page.locator('.sg-entity-grid:visible').first().evaluate(el=>getComputedStyle(el).gridTemplateColumns.split(' ').filter(Boolean).length).catch(()=>0);if(r.sgCols!==4)r.failures.push(`STATE_GUARD_DESKTOP_COLUMNS_${r.sgCols}`)}
              }else if(refineRequired(route)){
                if(r.sidebars!==1)r.failures.push(`SIDEBAR_COUNT_${r.sidebars}`);
                r.visibleProducts=await page.locator(productLinks).count().catch(()=>0);
                r.concept=await page.locator('#MainContent [data-pagination-design="concept-one"]:visible,#MainContent .sq-refine-v3-pager[data-sq-pagination-concept="one"]:visible,#MainContent .sq-taxonomy-concept-one-pager:visible,#MainContent .sq-stabrite-refine__pager[data-pagination-design="concept-one"]:visible').count().catch(()=>0);r.pageNumbers=await page.locator('#MainContent [data-vac-global-page]:visible,#MainContent .sq-refine-v3-page-btn--number:visible,#MainContent .sq-taxonomy-page-btn[data-sq-page-number]:visible,#MainContent .sq-stabrite-refine__pager button[data-page]:visible').count().catch(()=>0);
                r.per50=await page.locator('#MainContent [data-vac-page-size="50"]:visible,#MainContent input[name="sq_page_size"][value="50"]:visible,#MainContent input[name="sq_per_page_control"][value="50"]:visible,#MainContent input[name="sq_stabrite_page_size"][value="50"]:visible').count().catch(()=>0);r.per100=await page.locator('#MainContent [data-vac-page-size="100"]:visible,#MainContent input[name="sq_page_size"][value="100"]:visible,#MainContent input[name="sq_per_page_control"][value="100"]:visible,#MainContent input[name="sq_stabrite_page_size"][value="100"]:visible').count().catch(()=>0);
                const paginatedSurface=r.concept>0||r.pageNumbers>1||r.per50>0||r.per100>0||r.visibleProducts>=50;
                if(paginatedSurface&&(!r.per50||!r.per100))r.failures.push('PRODUCTS_PER_PAGE_50_100_MISSING');if(r.visibleProducts>=50&&(!r.concept||r.pageNumbers<2))r.failures.push('CONCEPT_ONE_NUMBERED_PAGINATION_MISSING');
              }
              if(route==='/'){
                r.homeLaw=await page.locator('#MainContent a:visible').evaluateAll(as=>as.filter(a=>/law enforcement/i.test((a.textContent||'').replace(/\s+/g,' '))).length).catch(()=>0);r.homeFire=await page.locator('#MainContent a:visible').evaluateAll(as=>as.filter(a=>/firefight|fire\/ems|fire & ems/i.test((a.textContent||'').replace(/\s+/g,' '))).length).catch(()=>0);if(r.homeLaw>1)r.failures.push(`DUPLICATE_HOME_LAW_${r.homeLaw}`);if(r.homeFire>1)r.failures.push(`DUPLICATE_HOME_FIRE_${r.homeFire}`);
              }
              await page.screenshot({path:`${OUT}/screens/${device}-${safe(route)}.png`,fullPage:true}).catch(()=>{});
            }catch(e){r.failures.push('EXCEPTION');r.error=String(e)}r.pass=r.failures.length===0;results.push(r);const v=page.video();await context.close();if(v){try{const p=await v.path();fs.renameSync(p,`${OUT}/videos/${device}-${safe(route)}.webm`)}catch{}}fs.writeFileSync(`${OUT}/results.json`,JSON.stringify(results,null,2));console.log(JSON.stringify({device,route,pass:r.pass,failures:r.failures,error:r.error||null}));
          }
          await browser.close();const summary={routes:results.length,passed:results.filter(x=>x.pass).length,failed:results.filter(x=>!x.pass).length,failures:results.filter(x=>!x.pass).map(x=>({device:x.device,route:x.route,failures:x.failures,error:x.error||null}))};fs.writeFileSync(`${OUT}/summary.json`,JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));if(summary.failed)process.exitCode=2;
          EOF
          node certify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-certificate-single-runner-v6
          path: out
          retention-days: 7
