name: Fred Taylor research capture

on:
  push:
    branches:
      - research/fred-taylor-video-capture
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip yt-dlp
          npm install -g playwright
          npx playwright install chromium --with-deps

      - name: Capture Historic Explorations page in Chromium
        run: |
          mkdir -p research_output/page research_output/video_frames
          cat > /tmp/capture.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport: { width: 1440, height: 2200 } });
            await page.goto('https://historicexplorations.com/american-history/sergeant-first-class-fred-taylor/', { waitUntil: 'networkidle', timeout: 120000 });
            await page.screenshot({ path: 'research_output/page/fred_taylor_article_full.png', fullPage: true });
            require('fs').writeFileSync('research_output/page/fred_taylor_article.html', await page.content());
            require('fs').writeFileSync('research_output/page/fred_taylor_article.txt', await page.locator('body').innerText());
            await browser.close();
          })();
          EOF
          NODE_PATH=$(npm root -g) node /tmp/capture.js

      - name: Download public memorial video
        run: |
          yt-dlp --no-playlist -f 'bv*+ba/b' --merge-output-format mp4 -o 'research_output/fred_taylor_memorial.%(ext)s' 'https://www.youtube.com/watch?v=4daoYCNbyBA'

      - name: Extract scene-change screenshots
        run: |
          VIDEO=$(find research_output -maxdepth 1 -name 'fred_taylor_memorial*.mp4' | head -1)
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$VIDEO" > research_output/video_duration_seconds.txt
          ffmpeg -hide_banner -loglevel warning -i "$VIDEO" -vf "select='gt(scene,0.08)',scale=1280:-2,showinfo" -vsync vfr research_output/video_frames/scene_%04d.jpg
          ffmpeg -hide_banner -loglevel warning -i "$VIDEO" -vf "fps=1/3,scale=960:-2" research_output/video_frames/every3s_%05d.jpg

      - name: Create contact sheets
        run: |
          mkdir -p research_output/contact_sheets
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          import glob,math,os
          files=sorted(glob.glob('research_output/video_frames/scene_*.jpg'))
          if not files:
              files=sorted(glob.glob('research_output/video_frames/every3s_*.jpg'))
          batch=25
          for bi in range(0,len(files),batch):
              chunk=files[bi:bi+batch]
              thumbs=[]
              for f in chunk:
                  im=Image.open(f).convert('RGB')
                  im.thumbnail((300,180))
                  canvas=Image.new('RGB',(320,220),'white')
                  canvas.paste(im,((320-im.width)//2,5))
                  ImageDraw.Draw(canvas).text((8,195),os.path.basename(f),fill='black')
                  thumbs.append(canvas)
              sheet=Image.new('RGB',(320*5,220*5),'white')
              for i,t in enumerate(thumbs):
                  sheet.paste(t,((i%5)*320,(i//5)*220))
              sheet.save(f'research_output/contact_sheets/scenes_{bi//batch+1:02d}.jpg',quality=92)
          PY

      - name: Upload capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: fred-taylor-research-capture
          path: research_output/
          retention-days: 7
