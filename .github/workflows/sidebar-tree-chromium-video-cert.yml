name: Sidebar tree Chromium Playwright video certification

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sidebar-tree-chromium-video-cert.mjs'
      - '.github/workflows/sidebar-tree-chromium-video-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Run sidebar tree audit with video
        run: |
          node .github/scripts/sidebar-tree-chromium-video-cert.mjs

      - name: Upload Chromium audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-tree-chromium-video-cert
          path: audit-out/sidebar-tree/
          retention-days: 14

      - name: Enforce audit gate
        if: always()
        run: |
          node - <<'EOF'
          const fs=require('fs');
          const p='audit-out/sidebar-tree/report.json';
          if(!fs.existsSync(p)){
            console.error('Missing report.json');
            process.exit(2);
          }
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          console.log(`PASS=${r.passed}`);
          console.log(`HOME=${r.homepageCoverage.passed}/${r.homepageCoverage.total}`);
          console.log(`STATE_GUARD=${r.stateGuardCoverage.passed}/${r.stateGuardCoverage.total}`);
          for(const f of r.failures) console.log(`FAIL: ${f}`);
          if(!r.passed) process.exit(2);
          EOF
