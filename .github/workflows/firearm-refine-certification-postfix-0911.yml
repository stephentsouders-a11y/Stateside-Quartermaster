name: Firearm Accessories post-fix exhaustive certification 0911
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/firearm-refine-certification-postfix-0911.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firearm-refine-postfix-0911
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Exhaustively test assigned Refine choices
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
          SHARD: ${{ matrix.shard }}
          SHARDS: '6'
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('out',{recursive:true});
          const base=process.env.BASE,theme=process.env.THEME,shard=+process.env.SHARD,shards=+process.env.SHARDS;
          const root=()=>{const u=new URL('/collections/firearm-accessories',base);u.searchParams.set('preview_theme_id',theme);return u.toString()};
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
          const page=await ctx.newPage();
          page.setDefaultTimeout(12000);page.setDefaultNavigationTimeout(35000);
          const badHttp=[],errors=[];
          page.on('response',r=>{if(r.status()===429||r.status()>=500)badHttp.push(`${r.status()} ${r.url()}`)});
          page.on('pageerror',e=>errors.push(String(e)));
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function ready(){await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:30000});await page.waitForTimeout(250)}
          async function openRoot(){let last;for(let a=0;a<3;a++){try{const r=await page.goto(root(),{waitUntil:'domcontentloaded'});if(r&&r.status()<500&&r.status()!==429){await ready();return}last=new Error(`root HTTP ${r?.status()}`)}catch(e){last=e}await sleep(1500*(a+1))}throw last||new Error('root navigation failed')}
          async function products(){return page.locator('#MainContent a[href*="/products/"]').evaluateAll(as=>[...new Set(as.filter(a=>{const r=a.getBoundingClientRect(),s=getComputedStyle(a);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'}).map(a=>new URL(a.href).pathname))].slice(0,20)).catch(()=>[])}
          function routeMatches(c,url){const u=new URL(url);if(c.target){const t=new URL(c.target,base);return u.pathname.replace(/\/$/,'')===t.pathname.replace(/\/$/,'')?null:`wrong destination expected ${t.pathname} got ${u.pathname}`}if(c.filterName&&c.filterValue){if(u.searchParams.getAll(c.filterName).includes(c.filterValue))return null;if(c.filterName==='filter.p.product_type'&&u.searchParams.getAll('sq_type_family').includes(c.filterValue))return null;return `missing selected parameter ${c.filterName}=${c.filterValue}`}return null}
          await openRoot();
          const revision=await page.locator('script[data-sq-refine-v3-click-rescue]').getAttribute('data-revision').catch(()=>null);
          if(revision!=='firearm-zero-result-prune-20260911-v1')throw new Error(`wrong deployed click-rescue revision: ${revision}`);
          const groups=await page.locator('.sq-refine-v3-sidebar > details.sq-refine-v3-group').evaluateAll(ds=>ds.map((d,gi)=>({gi,label:(d.querySelector(':scope > summary')?.textContent||'').replace(/\s+/g,' ').trim(),choices:[...d.querySelectorAll(':scope > .sq-refine-v3-choices input[type="checkbox"]')].map((i,ci)=>({ci,label:(i.closest('label')?.querySelector('span')?.textContent||i.closest('label')?.textContent||i.dataset.target||i.dataset.filterValue||i.value||`choice-${ci}`).replace(/\s+/g,' ').trim(),kind:i.dataset.kind||'',target:i.dataset.target||'',filterName:i.dataset.filterName||i.dataset.sqPolishParam||i.name||'',filterValue:i.dataset.filterValue||i.dataset.sqPolishValue||(i.value==='on'?'':i.value)||''}))})));
          const flat=[];let n=0;for(const g of groups)for(const c of g.choices)flat.push({...c,group:g.label,groupIndex:g.gi,globalIndex:n++});
          const assigned=flat.filter(x=>x.globalIndex%shards===shard);
          const report={root:root(),revision,shard,shards,totalChoices:flat.length,groups,tests:[],badHttp,errors};
          for(const c of assigned){const t={...c,pass:false,beforeUrl:null,afterUrl:null,products:[],reason:null};try{await openRoot();t.beforeUrl=page.url();const group=page.locator('.sq-refine-v3-sidebar > details.sq-refine-v3-group').nth(c.groupIndex);const input=group.locator(':scope > .sq-refine-v3-choices input[type="checkbox"]').nth(c.ci);if(!await input.count())throw new Error('choice missing after reload');const before=page.url();await input.evaluate(el=>el.click());await page.waitForFunction(u=>location.href!==u,before,{timeout:9000});await page.waitForLoadState('domcontentloaded',{timeout:18000}).catch(()=>{});await page.waitForTimeout(600);t.afterUrl=page.url();const mismatch=routeMatches(c,t.afterUrl);if(mismatch)throw new Error(mismatch);t.products=await products();if(!t.products.length)throw new Error('selection returned no visible products');t.pass=true}catch(e){t.reason=String(e?.message||e)}report.tests.push(t);console.log(`${t.pass?'PASS':'FAIL'} #${c.globalIndex} ${c.group} :: ${c.label}${t.reason?' :: '+t.reason:''}`);await sleep(250)}
          report.summary={assigned:assigned.length,totalChoices:flat.length,passed:report.tests.filter(x=>x.pass).length,failed:report.tests.filter(x=>!x.pass).length,badHttp:[...new Set(badHttp)].length,pageErrors:errors.length};
          fs.writeFileSync(`out/firearm-postfix-${shard}.json`,JSON.stringify(report,null,2));console.log('SUMMARY '+JSON.stringify(report.summary));await browser.close();
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firearm-postfix-${{ matrix.shard }}
          path: out
          retention-days: 7
  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firearm-postfix-*
          path: reports
          merge-multiple: true
      - name: Certify complete coverage
        run: |
          node <<'EOF'
          const fs=require('fs'),path=require('path');const files=fs.readdirSync('reports').filter(f=>f.endsWith('.json'));if(files.length!==6)throw new Error(`expected 6 shard reports, found ${files.length}`);const rs=files.map(f=>JSON.parse(fs.readFileSync(path.join('reports',f))));const tests=rs.flatMap(r=>r.tests),u=new Map(tests.map(t=>[t.globalIndex,t])),total=Math.max(...rs.map(r=>r.totalChoices)),fail=[...u.values()].filter(t=>!t.pass),http=[...new Set(rs.flatMap(r=>r.badHttp||[]))],pageErrors=rs.flatMap(r=>r.errors||[]);const summary={reports:files.length,totalChoices:total,uniqueTested:u.size,passed:[...u.values()].filter(t=>t.pass).length,failed:fail.length,badHttp:http.length,pageErrors:pageErrors.length,revisions:[...new Set(rs.map(r=>r.revision))]};console.log('CERTIFICATION '+JSON.stringify(summary));for(const f of fail)console.log(`FAILURE #${f.globalIndex} ${f.group} :: ${f.label} :: ${f.reason} :: ${f.afterUrl||''}`);fs.writeFileSync('firearm-postfix-certification.json',JSON.stringify({summary,failures:fail,badHttp:http,pageErrors},null,2));if(u.size!==total||fail.length||http.length||pageErrors.length)process.exit(2);
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firearm-postfix-certification
          path: firearm-postfix-certification.json
          retention-days: 7
