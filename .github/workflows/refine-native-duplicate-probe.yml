name: Refine native filter duplicate probe
# post-literature-fix valid-route rerun 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/refine-native-duplicate-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          cat > probe.mjs <<'EOF'
          import {chromium} from 'playwright';
          const routes=['/collections/literature','/collections/flashlights-lighting','/collections/footwear-gloves-eyewear','/collections/accessories-gifts-collectibles','/collections/survival-emergency-preparedness'];
          const b=await chromium.launch({headless:true}); let failed=0;
          for(const route of routes){for(const [device,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){const c=await b.newContext({viewport});const p=await c.newPage();p.setDefaultNavigationTimeout(30000);const u=new URL(route,'https://www.statesideqm.com');u.searchParams.set('preview_theme_id','158561894555');let status=null,error=null,d=null;
            for(let attempt=1;attempt<=3;attempt++){try{const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded'});status=r?.status()??null;await p.waitForTimeout(1200);d=await p.evaluate(()=>{const m=document.querySelector('#MainContent')||document.querySelector('main');if(!m)return null;const v=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity!==0&&r.width>1&&r.height>1};const sb=[...m.querySelectorAll('.sq-global-refine-sidebar')].filter(v);return{sidebar:sb.length,sidebarHeading:sb[0]?.querySelector('.sq-global-refine-sidebar__title')?.textContent?.trim()||'',nativeFilterWrappers:[...m.querySelectorAll('.facets__filters-wrapper')].filter(v).length,nativeMobileTriggers:[...m.querySelectorAll('.facets-toggle__button,.facets-toggle__wrapper')].filter(v).length,availabilityLinks:[...m.querySelectorAll('a[href*="filter.v.availability"]')].length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,products:[...m.querySelectorAll('a[href*="/products/"]')].filter(v).length,books:!!m.querySelector('.sq-books-tree'),bad:/just a moment|something went wrong|internal server error|there was a problem/i.test(document.title+' '+(m.innerText||''))}});if(status===200&&d&&!d.bad)break}catch(e){error=String(e)}await p.waitForTimeout(2500*attempt)}
            const row={route,device,status,error,...(d||{})};const bad=!d||status!==200||d.bad||d.sidebar!==1||d.sidebarHeading!=='Refine Products'||d.nativeFilterWrappers>0||d.nativeMobileTriggers>0||d.availabilityLinks>0||d.overflow; if(bad)failed++;console.log(JSON.stringify({...row,failed:bad}));await c.close()}}
          await b.close();if(failed){console.log(`PROBE FAILURES=${failed}`);process.exitCode=2}else console.log('PROBE 10/10 PASS');
          EOF
          node probe.mjs
