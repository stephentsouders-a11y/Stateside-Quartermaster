name: Refine native filter duplicate probe
# post-fix rerun 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/refine-native-duplicate-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          cat > probe.mjs <<'EOF'
          import {chromium} from 'playwright';
          const routes=['/collections/literature','/collections/flashlights-lighting','/collections/footwear-gloves-eyewear','/collections/first-aid-ifak-medical','/collections/tactical-gear-packs-load-carriage'];
          const b=await chromium.launch({headless:true});
          for(const route of routes){for(const [device,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){const c=await b.newContext({viewport});const p=await c.newPage();const u=new URL(route,'https://www.statesideqm.com');u.searchParams.set('preview_theme_id','158561894555');let r=await p.goto(u.toString(),{waitUntil:'domcontentloaded'});await p.waitForTimeout(1200);const d=await p.evaluate(()=>{const m=document.querySelector('#MainContent'),v=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>1&&r.height>1};return{sidebar:[...m.querySelectorAll('.sq-global-refine-sidebar')].filter(v).length,nativeHorizontal:[...m.querySelectorAll('.facets--horizontal')].filter(v).length,nativeFilterWrappers:[...m.querySelectorAll('.facets__filters-wrapper')].filter(v).length,nativeMobileTriggers:[...m.querySelectorAll('.facets-toggle__button,.facets-toggle__wrapper')].filter(v).length,products:[...m.querySelectorAll('a[href*="/products/"]')].filter(v).length}});console.log(JSON.stringify({route,device,status:r.status(),...d}));await c.close()}}
          await b.close();
          EOF
          node probe.mjs
