name: NARA Army Casualty Browser Discovery
on:
  push:
    branches:
      - chatgpt-vietnam-casualty-data-process
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Render NARA series page and capture links
        run: |
          python - <<'PY'
          import asyncio, json, pathlib
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch()
                  page=await b.new_page()
                  await page.goto('https://catalog.archives.gov/id/1888017',wait_until='networkidle',timeout=120000)
                  await page.wait_for_timeout(5000)
                  html=await page.content()
                  pathlib.Path('rendered.html').write_text(html,encoding='utf-8')
                  links=await page.locator('a').evaluate_all('(els)=>els.map(a=>({text:(a.innerText||a.textContent||""),href:a.href}))')
                  pathlib.Path('links.json').write_text(json.dumps(links,indent=2),encoding='utf-8')
                  print('title',await page.title(),'links',len(links))
                  for x in links:
                      t=(x.get('text') or '').lower(); h=(x.get('href') or '').lower()
                      if any(k in t+h for k in ['download','file','casual','1888017','tagcen']): print(x)
                  await b.close()
          asyncio.run(main())
          PY
      - name: Upload rendered discovery
        uses: actions/upload-artifact@v4
        with:
          name: nara-army-fileunit-discovery
          path: |
            rendered.html
            links.json
          retention-days: 1
