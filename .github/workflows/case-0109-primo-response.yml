name: Case 0109 Primo Response
on:
  push:
    branches: [case-0109-aerial-audit]
    paths: ['.github/workflows/case-0109-primo-response.yml']
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Capture collection search JSON in Chromium
        run: |
          mkdir out work && cd work
          npm init -y >/dev/null
          npm install playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > run.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1200}});
          let captured=[];
          page.on('response', async r=>{
            const u=r.url();
            if(u.includes('/primaws/rest/pub/pnxs?') && u.includes('cdparentid')){
              try { const t=await r.text(); captured.push({url:u,status:r.status(),text:t}); } catch(e){}
            }
          });
          await page.goto('https://maine.primo.exlibrisgroup.com/nde/collectionDiscovery?collectionId=81521275480008681&vid=01MAINE_INST:DigCol&lang=en',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(15000);
          fs.writeFileSync('../out/captured.json',JSON.stringify(captured,null,2));
          console.log('captured',captured.length);
          for(const c of captured){
            try{
              const d=JSON.parse(c.text);
              console.log('url',c.url,'status',c.status,'total',d?.info?.total,'docs',d?.docs?.length);
              for(const doc of (d.docs||[])){
                const s=JSON.stringify(doc);
                const m=s.match(/An Khe February 16 1966[^"\\]*/g);
                if(m) console.log('MATCH',m[0], s.match(/815\d{13,}/g)?.slice(0,5));
              }
            }catch(e){console.log('parse error',String(e))}
          }
          await browser.close();
          NODE
          node run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: case-0109-primo-response
          path: out/**
          retention-days: 30
