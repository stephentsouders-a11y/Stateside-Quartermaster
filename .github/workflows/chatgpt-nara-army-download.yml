name: NARA Army Casualty Full Download
on:
  push:
    branches:
      - chatgpt-vietnam-casualty-data-process
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download official NARA Army casualty public-use files
        run: |
          python - <<'PY'
          import requests, pathlib
          files={
            'CIS.PUBLIC.REV':'https://catalog.archives.gov/medialive/17/8880/1888017/content/arcmedia/electronic-records/rg-407/tagcen/CIS.PUBLIC.REV',
            '118.1DP.pdf':'https://catalog.archives.gov/medialive/17/8880/1888017/content/arcmedia/electronic-records/rg-407/tagcen/118.1DP.pdf',
            'TAGCEN_TSS118.pdf':'https://catalog.archives.gov/medialive/17/8880/1888017/content/arcmedia/electronic-records/rg-407/tagcen/TAGCEN_TSS118.pdf',
          }
          for fn,u in files.items():
              r=requests.get(u,timeout=180)
              print(fn,r.status_code,len(r.content),r.headers.get('content-type'))
              r.raise_for_status()
              pathlib.Path(fn).write_bytes(r.content)
          PY
          ls -lh CIS.PUBLIC.REV 118.1DP.pdf TAGCEN_TSS118.pdf
      - name: Extract documentation text
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          for fn in ['118.1DP.pdf','TAGCEN_TSS118.pdf']:
              r=PdfReader(fn)
              print(fn,'pages',len(r.pages))
              with open(fn+'.txt','w',encoding='utf-8') as f:
                  for i,p in enumerate(r.pages,1):
                      f.write(f'\n===== PAGE {i} =====\n')
                      f.write(p.extract_text() or '')
          PY
          wc -l 118.1DP.pdf.txt TAGCEN_TSS118.pdf.txt
          wc -c CIS.PUBLIC.REV
      - name: Upload Army casualty source
        uses: actions/upload-artifact@v4
        with:
          name: nara-army-casualty-public-use
          path: |
            CIS.PUBLIC.REV
            118.1DP.pdf
            118.1DP.pdf.txt
            TAGCEN_TSS118.pdf
            TAGCEN_TSS118.pdf.txt
          retention-days: 1
