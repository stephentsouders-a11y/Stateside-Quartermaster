name: REFINE V3 Button 01 Fresh Proofs

on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-button01-fresh-proofs.yml'
  workflow_dispatch:

jobs:
  type-direct:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Fresh direct Type load
        run: |
          mkdir -p evidence-type
          node <<'NODE'
          import fs from 'node:fs/promises'; import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true}); const c=await b.newContext({viewport:{width:1440,height:1000}}); const p=await c.newPage(); const r={pass:false,url:null,ready:null,error:null,cards:0,checked:false,challenge:false,responses:[]}; p.on('response',x=>{if(x.status()>=400)r.responses.push({status:x.status(),url:x.url()})});
          try{await p.goto('https://www.statesideqm.com/collections/accessories-gifts-collectibles?filter.p.product_type=accessories&preview_theme_id=158561894555',{waitUntil:'domcontentloaded',timeout:90000}); r.url=p.url(); r.challenge=/verify you are human|connection needs to be verified/i.test(await p.locator('body').innerText().catch(()=>'')); if(r.challenge)throw new Error('challenge'); await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000}); r.ready=await p.locator('#MainContent').getAttribute('data-sq-refine-v3-ready'); r.error=await p.locator('#MainContent').getAttribute('data-sq-refine-v3-error'); r.cards=await p.locator('#MainContent .sq-refine-v3-results .product-grid a[href*="/products/"]').count(); r.checked=await p.evaluate(()=>[...document.querySelectorAll('#MainContent .sq-refine-v3-sidebar input:checked')].some(i=>(i.dataset.filterName||i.dataset.sqPolishParam)==='filter.p.product_type'&&(i.dataset.filterValue||i.dataset.sqPolishValue||i.value)==='accessories')); if(!r.cards||!r.checked)throw new Error('filtered state incomplete'); await p.screenshot({path:'evidence-type/type-direct.png'}); r.pass=true}catch(e){r.error=r.error||String(e);r.challenge=/verify you are human|connection needs to be verified/i.test(await p.locator('body').innerText().catch(()=>''));await p.screenshot({path:'evidence-type/failure.png'}).catch(()=>{})} await fs.writeFile('evidence-type/report.json',JSON.stringify(r,null,2)); console.log(JSON.stringify(r,null,2)); await b.close(); if(!r.pass)process.exit(1);
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: button01-type-direct
          path: evidence-type
          retention-days: 14

  mobile-root:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Fresh mobile page-size visual proof
        run: |
          mkdir -p evidence-mobile
          node <<'NODE'
          import fs from 'node:fs/promises'; import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true}); const c=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:1}); const p=await c.newPage(); const r={pass:false,url:null,labels:null,columns:null,overflow:null,challenge:false}; try{await p.goto('https://www.statesideqm.com/collections/accessories-gifts-collectibles?preview_theme_id=158561894555',{waitUntil:'domcontentloaded',timeout:90000}); r.url=p.url(); r.challenge=/verify you are human|connection needs to be verified/i.test(await p.locator('body').innerText().catch(()=>'')); if(r.challenge)throw new Error('challenge'); await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000}); r.labels=await p.locator('#MainContent .sq-refine-v3-page-size').innerText(); r.columns=await p.evaluate(()=>{const cards=[...document.querySelectorAll('#MainContent .sq-refine-v3-results .product-grid > *')].filter(e=>e.getBoundingClientRect().width>0).slice(0,6);const xs=[...new Set(cards.map(e=>Math.round(e.getBoundingClientRect().left)))];return xs.length}); r.overflow=await p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2); await p.screenshot({path:'evidence-mobile/mobile-top.png',fullPage:false}); if(!/50/.test(r.labels)||!/100/.test(r.labels)||!/250/.test(r.labels)||r.columns!==2||r.overflow)throw new Error('mobile visual gate failed'); r.pass=true}catch(e){r.error=String(e);await p.screenshot({path:'evidence-mobile/failure.png'}).catch(()=>{})} await fs.writeFile('evidence-mobile/report.json',JSON.stringify(r,null,2)); console.log(JSON.stringify(r,null,2)); await b.close(); if(!r.pass)process.exit(1);
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: button01-mobile-root
          path: evidence-mobile
          retention-days: 14
