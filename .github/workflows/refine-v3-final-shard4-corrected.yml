name: Refine V3 final shard 4 corrected
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/refine-v3-final-shard4-corrected.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shard4:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify corrected shard 4
        run: |
          cat > shard4.mjs <<'EOF'
          import { chromium } from 'playwright';
          const B='https://www.statesideqm.com',T='158561894555',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const paths=['/collections/art','/collections/firearm-accessories','/collections/k9-dog-gear','/collections/safety-rescue-climbing','/collections/watches','/collections/products-built-for-the-line-u-s-army','/collections/products-built-for-the-line-u-s-space-force','/collections/firefighting-ems-search-rescue'];
          const url=path=>{const u=new URL(path,B);u.searchParams.set('preview_theme_id',T);return u.toString()};
          const browser=await chromium.launch({headless:true}),c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage(),fails=[];
          async function load(path){let last='';for(let a=0;a<5;a++){try{const r=await p.goto(url(path),{waitUntil:'domcontentloaded',timeout:70000});if(r?.status()!==200)throw new Error('HTTP '+r?.status());await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000});await p.waitForFunction(()=>{const vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};return [...document.querySelectorAll('.sq-refine-v3-results .product-grid')].some(g=>vis(g)&&[...g.querySelectorAll(':scope > .product-grid__item')].some(x=>vis(x)&&x.querySelector('a[href*="/products/"]')))},null,{timeout:12000});await sleep(700);return}catch(e){last=String(e);await sleep(2500*(a+1))}}throw new Error(last)}
          for(const path of paths){try{await load(path);const d=await p.evaluate(()=>{const m=document.querySelector('#MainContent'),vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0};const sides=[...m.querySelectorAll('.sq-refine-v3-sidebar')].filter(vis),side=sides[0],title=side?.querySelector('.sq-refine-v3-sidebar__title'),legacy=[...m.querySelectorAll('.sq-global-refine-sidebar,.sq-collection-sidebar,.facets-block-wrapper,.facets-container,.facets-wrapper,[class*="filter-sidebar"]')].filter(x=>vis(x)&&!x.classList.contains('sq-refine-v3-sidebar')).length,grids=[...m.querySelectorAll('.sq-refine-v3-results .product-grid')].filter(vis),g=grids.find(x=>x.classList.contains('sq-v3-authoritative-grid')&&x.querySelector('.product-grid__item a[href*="/products/"]'))||grids.find(x=>x.querySelector('.product-grid__item a[href*="/products/"]')),cards=g?[...g.querySelectorAll(':scope > .product-grid__item')].filter(x=>vis(x)&&x.querySelector('a[href*="/products/"]')):[],rr=cards.slice(0,9).map(x=>x.getBoundingClientRect()),row=rr.length?rr.filter(x=>Math.abs(x.y-rr[0].y)<4).length:0,sr=side?.getBoundingClientRect(),tr=title?.getBoundingClientRect(),groups=side?[...side.querySelectorAll(':scope > details.sq-refine-v3-group')].map(x=>({label:(x.querySelector(':scope>summary')?.textContent||'').replace(/\s+/g,' ').trim(),n:x.querySelectorAll('input[type=checkbox]').length,targets:[...x.querySelectorAll('input[data-kind=structural][data-target]')].map(i=>i.dataset.target||'')})):[];let cols=0;if(g){const tpl=getComputedStyle(g).gridTemplateColumns.trim();cols=tpl&&tpl!=='none'?tpl.split(/\s+/).length:0}return{ready:m.dataset.sqRefineV3Ready==='true',err:m.dataset.sqRefineV3Error||'',polish:m.dataset.sqRefineV3PolishError||'',sidebars:sides.length,legacy,title:(title?.textContent||'').trim(),titleBg:title?getComputedStyle(title).backgroundColor:'',sideBg:side?getComputedStyle(side).backgroundColor:'',gap:sr&&tr?Math.max(0,sr.right-tr.right):999,pos:side?getComputedStyle(side).position:'',cards:cards.length,row,width:rr[0]?Math.round(rr[0].width):0,cols,sizes:[...m.querySelectorAll('.sq-refine-v3-page-size input')].map(x=>x.value),groups}});const e=[];if(!d.ready||d.err||d.polish)e.push('runtime');if(d.sidebars!==1)e.push('sidebars='+d.sidebars);if(d.legacy)e.push('legacy='+d.legacy);if(d.title.toUpperCase()!=='REFINE PRODUCTS'||d.titleBg!=='rgb(8, 40, 63)'||d.sideBg!=='rgb(8, 40, 63)'||d.gap>1.5)e.push('header');if(d.pos!=='sticky')e.push('sticky');if(d.cards<1)e.push('cards');if(d.cols!==3)e.push('cols='+d.cols);if(d.cards>=3&&d.row!==3)e.push('row='+d.row);if(d.width<250)e.push('width='+d.width);if(d.sizes.join(',')!=='50,100,250')e.push('sizes');for(const g of d.groups){if(!g.n)e.push('empty '+g.label);for(const t of g.targets){const u=new URL(t,B);if(!u.pathname.startsWith('/collections/')||!u.searchParams.get('sq_root'))e.push('bad structural '+g.label)}}if(path==='/collections/firearm-accessories'&&!d.groups.some(g=>/Shop by Make \/ Model/i.test(g.label)&&g.n>=1))e.push('missing make/model');if(e.length)fails.push(path+' :: '+e.join(' | '));console.log((e.length?'FAIL ':'PASS ')+path+' '+JSON.stringify(d))}catch(e){fails.push(path+' :: '+String(e));console.log('FAIL '+path+' '+e)}await sleep(700)}
          await c.close();await browser.close();console.log('FAILURES='+JSON.stringify(fails));if(fails.length)process.exit(1);console.log('FINAL SHARD 4 GREEN');
          EOF
          node shard4.mjs
