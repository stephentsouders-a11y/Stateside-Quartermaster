name: PBTL Army Guard and Air Guard parity Chromium certification
on:
  push:
    paths:
      - '.github/workflows/pbtl-parity-final-cert.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base='https://www.statesideqm.com',theme='158561894555',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const pairs=[
            {name:'Army-ARNG',a:'products-built-for-the-line-u-s-army',b:'army-national-guard-series'},
            {name:'AirForce-ANG',a:'products-built-for-the-line-u-s-air-force',b:'air-national-guard-series'}
          ];
          async function externalHandles(handle){const out=[];for(let p=1;p<=24;p++){let j=null;for(let a=0;a<7;a++){const r=await fetch(`${base}/collections/${handle}/products.json?limit=250&page=${p}&sort_by=title-ascending`,{headers:{'user-agent':'StatesideQM-Parity-Cert/1.0'}}).catch(()=>null);if(r?.ok){j=await r.json();break}await sleep(1200*(a+1))}if(!j)throw new Error(`${handle} page ${p} exhausted retries`);const batch=Array.isArray(j.products)?j.products:[];if(!batch.length)break;for(const x of batch)if(x?.handle&&Array.isArray(x.variants)&&x.variants.some(v=>v.available))out.push(x.handle);if(batch.length<250)break;await sleep(700)}return [...new Set(out)].sort()}
          const browser=await chromium.launch({headless:true});let failed=false;
          async function ui(handle){const page=await browser.newPage({viewport:{width:1440,height:1100}}),u=new URL(`/collections/${handle}`,base);u.searchParams.set('preview_theme_id',theme);let status=null,valid=false;for(let a=0;a<4&&!valid;a++){const r=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:60000}).catch(()=>null);status=r?.status()??null;for(let i=0;i<40&&!valid;i++){await sleep(250);valid=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2},t=(m?.innerText||'').replace(/\s+/g,' '),loading=[...(m?.querySelectorAll('[data-sqbfl-load-state],p,small,span,div')||[])].filter(vis).some(e=>/loading items|checking items|tree unavailable|building the customer-facing product tree/i.test((e.innerText||'').trim()));return !!m&&!loading&&!/just a moment|something went wrong|internal server error|there was a problem/i.test(document.title+' '+t)&&[...(m.querySelectorAll('.sqbfl-card,.sq-subcategory-card')||[])].some(vis)}).catch(()=>false)}if(!valid)await sleep(1500*(a+1))}const d=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};return{sidebar:[...(m?.querySelectorAll('.sq-global-refine-sidebar')||[])].filter(vis).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,broken:[...(m?.querySelectorAll('img')||[])].filter(i=>i.complete&&i.naturalWidth===0).length,labels:[...(m?.querySelectorAll('.sqbfl-card,.sq-subcategory-card')||[])].filter(vis).map(e=>(e.querySelector('strong,h3,h2')?.textContent||e.textContent||'').replace(/\s+\d+\s*items?.*$/i,'').replace(/\s+/g,' ').trim()).filter(Boolean)}});await page.close();return{status,valid,...d}}
          for(const pair of pairs){const aUI=await ui(pair.a),bUI=await ui(pair.b);const a=await externalHandles(pair.a);await sleep(2500);const b=await externalHandles(pair.b);const missingInB=a.filter(x=>!b.includes(x)),extraInB=b.filter(x=>!a.includes(x));const bad=aUI.status!==200||bUI.status!==200||!aUI.valid||!bUI.valid||aUI.sidebar!==1||bUI.sidebar!==1||aUI.overflow||bUI.overflow||aUI.broken||bUI.broken||missingInB.length||extraInB.length;console.log(JSON.stringify({pair:pair.name,bad,aCount:a.length,bCount:b.length,missingInB:missingInB.slice(0,25),extraInB:extraInB.slice(0,25),aLabels:aUI.labels,bLabels:bUI.labels,aStatus:aUI.status,bStatus:bUI.status,aSidebar:aUI.sidebar,bSidebar:bUI.sidebar}));if(bad)failed=true;await sleep(3000)}
          await browser.close();if(failed)process.exit(1);
          EOF
          node verify.mjs
