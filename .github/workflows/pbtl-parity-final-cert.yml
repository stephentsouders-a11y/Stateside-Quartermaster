name: PBTL Army Guard and Air Guard parity Chromium certification
on:
  push:
    paths:
      - '.github/workflows/pbtl-parity-final-cert.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base='https://www.statesideqm.com',theme='158561894555';
          const pairs=[
            {name:'Army-ARNG',a:'/collections/products-built-for-the-line-u-s-army',b:'/collections/army-national-guard-series'},
            {name:'AirForce-ANG',a:'/collections/products-built-for-the-line-u-s-air-force',b:'/collections/air-national-guard-series'}
          ];
          const browser=await chromium.launch({headless:true});let failed=false;
          async function inspect(path){
            const page=await browser.newPage({viewport:{width:1440,height:1100}});const u=new URL(path,base);u.searchParams.set('preview_theme_id',theme);let valid=false,status=null;
            for(let a=0;a<4&&!valid;a++){const r=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:60000}).catch(()=>null);status=r?.status()??null;await page.waitForTimeout(2500);valid=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),t=(m?.innerText||'').replace(/\s+/g,' ');return !!m&&!/just a moment|something went wrong|internal server error|there was a problem/i.test(document.title+' '+t)}).catch(()=>false);if(!valid)await page.waitForTimeout(2000*(a+1))}
            const result=await page.evaluate(async()=>{const main=document.querySelector('#MainContent'),vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};for(let i=0;i<80;i++){const state=main?.querySelector('[data-sqbfl-load-state]')?.getAttribute('data-sqbfl-load-state');const cards=[...(main?.querySelectorAll('.sqbfl-card,.sq-subcategory-card')||[])].filter(vis);if((state==='ready'||state==='progressive'||!state)&&cards.length)break;await new Promise(r=>setTimeout(r,250))}const labels=[...(main?.querySelectorAll('.sqbfl-card,.sq-subcategory-card')||[])].filter(vis).map(e=>(e.querySelector('strong,h3,h2')?.textContent||e.textContent||'').replace(/\s+\d+\s*items?.*$/i,'').replace(/\s+/g,' ').trim()).filter(Boolean);const m=location.pathname.match(/\/collections\/([^/?#]+)/),handle=m?decodeURIComponent(m[1]):'';const products=[];for(let p=1;p<=24;p++){const r=await fetch('/collections/'+encodeURIComponent(handle)+'/products.json?limit=250&page='+p+'&sort_by=title-ascending',{credentials:'same-origin'});if(!r.ok)throw new Error('products page '+p+' HTTP '+r.status);const j=await r.json(),batch=Array.isArray(j.products)?j.products:[];if(!batch.length)break;for(const x of batch){if(x&&x.handle&&Array.isArray(x.variants)&&x.variants.some(v=>v.available))products.push(x.handle)}if(batch.length<250)break}return{labels:[...new Set(labels)].sort(),handles:[...new Set(products)].sort(),sidebar:[...(main?.querySelectorAll('.sq-global-refine-sidebar')||[])].filter(vis).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,broken:[...(main?.querySelectorAll('img')||[])].filter(i=>i.complete&&i.naturalWidth===0).length}}).catch(e=>({evalError:String(e),labels:[],handles:[],sidebar:0,overflow:false,broken:0}));await page.close();return{status,valid,...result}}
          for(const pair of pairs){const a=await inspect(pair.a),b=await inspect(pair.b);const missingInB=a.handles.filter(x=>!b.handles.includes(x)),extraInB=b.handles.filter(x=>!a.handles.includes(x)),labelsOnlyA=a.labels.filter(x=>!b.labels.includes(x)),labelsOnlyB=b.labels.filter(x=>!a.labels.includes(x));const bad=a.status!==200||b.status!==200||!a.valid||!b.valid||a.evalError||b.evalError||a.sidebar!==1||b.sidebar!==1||a.overflow||b.overflow||a.broken||b.broken||missingInB.length||extraInB.length||labelsOnlyA.length||labelsOnlyB.length;console.log(JSON.stringify({pair:pair.name,bad,aCount:a.handles.length,bCount:b.handles.length,aLabels:a.labels,bLabels:b.labels,missingInB:missingInB.slice(0,25),extraInB:extraInB.slice(0,25),labelsOnlyA,labelsOnlyB,aStatus:a.status,bStatus:b.status,aSidebar:a.sidebar,bSidebar:b.sidebar,aEval:a.evalError,bEval:b.evalError}));if(bad)failed=true}
          await browser.close();if(failed)process.exit(1);
          EOF
          node verify.mjs
