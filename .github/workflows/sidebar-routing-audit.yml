name: Sidebar Routing Chromium Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [sidebar-routing-repair-2026-09-23]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sidebar-routing-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run sidebar routing audit
        env:
          SQ_BASE_URL: https://www.statesideqm.com
          SQ_PREVIEW_THEME_ID: "159040962715"
        run: node audit/sidebar-routing.playwright.js
      - name: Upload Chromium audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-routing-audit-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
