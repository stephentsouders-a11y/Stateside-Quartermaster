name: Flashlights Refine draft inventory

on:
  push:
    paths:
      - '.github/workflows/flashlights-refine-preview-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inventory draft Refine Products
        run: |
          cat > inventory.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const url='https://www.statesideqm.com/collections/flashlights-lighting?preview_theme_id=158561894555&sq_per_page=50';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1000},locale:'en-US'});
          const page=await ctx.newPage();
          page.setDefaultNavigationTimeout(90000);
          const runtime=[];
          page.on('pageerror',e=>runtime.push(String(e)));
          let last='';
          for(let attempt=1;attempt<=4;attempt++){
            const r=await page.goto(url,{waitUntil:'domcontentloaded'}).catch(e=>{last=String(e);return null});
            const status=r?.status()||0;
            try{await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000});last='';break}catch(e){last=`HTTP ${status}; ${String(e)}`}
            await page.waitForTimeout(3000*attempt);
          }
          const data=await page.evaluate(()=>{
            const main=document.querySelector('#MainContent');
            const side=main?.querySelector('.sq-refine-v3-sidebar,.sq-global-refine-sidebar');
            const groups=side?[...side.querySelectorAll('details')].map((d,gi)=>({gi,summary:(d.querySelector(':scope > summary')?.textContent||'').replace(/\s+/g,' ').trim(),choices:[...d.querySelectorAll('input[type="checkbox"]')].map((i,ii)=>({ii,label:(i.closest('label')?.innerText||i.value||'').replace(/\s+/g,' ').trim(),value:i.value||'',target:i.dataset.target||'',filterName:i.dataset.filterName||'',polish:i.dataset.sqPolishParam||'',checked:i.checked}))})):[];
            const products=[...new Set([...(main?.querySelectorAll('.sq-refine-v3-results a[href*="/products/"]')||[])].map(a=>new URL(a.href,location.origin).pathname.split('/products/')[1]?.split(/[?#]/)[0]).filter(Boolean))];
            return {href:location.href,title:document.title,ready:main?.dataset.sqRefineV3Ready||null,error:main?.dataset.sqRefineV3Error||null,sidebar:!!side,groups,products,bodyText:(document.body?.innerText||'').slice(0,1000)};
          }).catch(e=>({evaluationError:String(e)}));
          fs.mkdirSync('out',{recursive:true});
          fs.writeFileSync('out/inventory.json',JSON.stringify({url,last,runtime,data},null,2));
          await page.screenshot({path:'out/page.png',fullPage:true}).catch(()=>{});
          console.log(JSON.stringify({url,last,runtime,data},null,2));
          await browser.close();
          if(last||!data?.ready||!data?.sidebar||!data?.groups?.length) process.exitCode=2;
          EOF
          node inventory.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashlights-refine-draft-inventory
          path: out
          retention-days: 14
