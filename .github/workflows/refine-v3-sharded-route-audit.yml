name: Refine V3 final all-route certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-sharded-route-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify route shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cat > final-routes.mjs <<'EOF'
          import { chromium } from 'playwright';
          const BASE='https://www.statesideqm.com',THEME='158561894555',shard=Number(process.env.SHARD||0),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const paths=['/collections/accessories-gifts-collectibles','/collections/airsoft-milsim','/collections/apparel','/collections/armed-forces-gear','/collections/art','/collections/body-armor-ballistic-protection','/collections/literature','/collections/child-safety-shop','/collections/dive-scuba','/collections/firearm-accessories','/collections/first-aid-medical-ifak','/collections/flags-patriotic-decor','/collections/flashlights-lighting','/collections/footwear-gloves-eyewear','/collections/k9-dog-gear','/collections/knives-axes-cutlery','/collections/morale-patches-tactical-id','/collections/outdoor-preparedness-gear','/collections/patriotic-american-heritage','/collections/safety-rescue-climbing','/collections/sta-brite-insignia','/collections/tactical-gear','/collections/thin-line','/collections/uniforms','/collections/watches','/collections/zippos-lighters-torches','/collections/stateside-quartermaster-logo-merch','/collections/army-national-guard-series','/collections/air-national-guard-series','/collections/products-built-for-the-line-u-s-army','/collections/products-built-for-the-line-u-s-navy','/collections/products-built-for-the-line-u-s-air-force','/collections/products-built-for-the-line-u-s-marine-corps','/collections/products-built-for-the-line-u-s-coast-guard','/collections/products-built-for-the-line-u-s-space-force','/collections/rotc-series','/collections/jrotc-series','/collections/military-schools-academies','/collections/law-enforcement-corrections','/collections/firefighting-ems-search-rescue'];
          const mine=paths.filter((_,i)=>i%5===shard);
          const url=path=>{const u=new URL(path,BASE);u.searchParams.set('preview_theme_id',THEME);return u.toString()};
          const browser=await chromium.launch({headless:true}),c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage(),fails=[];
          async function load(path){let last='';for(let a=0;a<5;a++){try{const r=await p.goto(url(path),{waitUntil:'domcontentloaded',timeout:70000});if(r?.status()!==200){last='HTTP '+r?.status();throw new Error(last)}await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000});await p.waitForFunction(()=>{const m=document.querySelector('#MainContent'),vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};return [...m.querySelectorAll('.sq-refine-v3-results .product-grid')].some(g=>vis(g)&&[...g.querySelectorAll(':scope > .product-grid__item')].some(x=>vis(x)&&x.querySelector('a[href*="/products/"]')))},null,{timeout:12000});await sleep(700);return}catch(e){last=String(e);console.log('RETRY',path,a+1,last.slice(0,180));await sleep(2500*(a+1))}}throw new Error('load failed '+last)}
          for(const path of mine){try{await load(path);const d=await p.evaluate(()=>{const m=document.querySelector('#MainContent'),vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0};const sides=[...m.querySelectorAll('.sq-refine-v3-sidebar')].filter(vis),side=sides[0],title=side?.querySelector('.sq-refine-v3-sidebar__title'),legacy=[...m.querySelectorAll('.sq-global-refine-sidebar,.sq-collection-sidebar,.facets-block-wrapper,.facets-container,.facets-wrapper,[class*="filter-sidebar"]')].filter(x=>vis(x)&&!x.classList.contains('sq-refine-v3-sidebar')).length,grids=[...m.querySelectorAll('.sq-refine-v3-results .product-grid')].filter(vis),g=grids.find(x=>x.classList.contains('sq-v3-authoritative-grid')&&x.querySelector('.product-grid__item a[href*="/products/"]'))||grids.find(x=>x.querySelector('.product-grid__item a[href*="/products/"]')),cards=g?[...g.querySelectorAll(':scope > .product-grid__item')].filter(x=>vis(x)&&x.querySelector('a[href*="/products/"]')):[],rr=cards.slice(0,9).map(x=>x.getBoundingClientRect()),row=rr.length?rr.filter(x=>Math.abs(x.y-rr[0].y)<4).length:0,sr=side?.getBoundingClientRect(),tr=title?.getBoundingClientRect(),groups=side?[...side.querySelectorAll(':scope > details.sq-refine-v3-group')].map(x=>({label:(x.querySelector(':scope>summary')?.textContent||'').replace(/\s+/g,' ').trim(),n:x.querySelectorAll('input[type=checkbox]').length,structural:[...x.querySelectorAll('input[data-kind=structural][data-target]')].map(i=>i.dataset.target||'')})):[];let gridCols=0;if(g){const tpl=getComputedStyle(g).gridTemplateColumns.trim();gridCols=tpl&&tpl!=='none'?tpl.split(/\s+/).length:0}return{ready:m.dataset.sqRefineV3Ready==='true',err:m.dataset.sqRefineV3Error||'',pageErrors:m.dataset.sqRefineV3PolishError||'',sidebars:sides.length,legacy,title:(title?.textContent||'').trim(),titleBg:title?getComputedStyle(title).backgroundColor:'',sideBg:side?getComputedStyle(side).backgroundColor:'',gap:sr&&tr?Math.max(0,sr.right-tr.right):999,pos:side?getComputedStyle(side).position:'',cards:cards.length,row,width:rr[0]?Math.round(rr[0].width):0,gridCols,sizes:[...m.querySelectorAll('.sq-refine-v3-page-size input')].map(x=>x.value),groups}});const e=[];if(!d.ready||d.err||d.pageErrors)e.push('runtime '+[d.err,d.pageErrors].filter(Boolean).join(','));if(d.sidebars!==1)e.push('sidebars='+d.sidebars);if(d.legacy)e.push('legacy='+d.legacy);if(d.title.toUpperCase()!=='REFINE PRODUCTS')e.push('title');if(d.titleBg!=='rgb(8, 40, 63)'||d.sideBg!=='rgb(8, 40, 63)'||d.gap>1.5)e.push('header');if(d.pos!=='sticky')e.push('sidebar-pos='+d.pos);if(d.cards<1)e.push('cards=0');if(d.gridCols!==3)e.push('grid-cols='+d.gridCols);if(d.cards>=3&&d.row!==3)e.push('first-row='+d.row);if(d.cards<3&&d.row!==d.cards)e.push('short-row='+d.row+'/'+d.cards);if(d.width<250)e.push('card-width='+d.width);if(d.sizes.join(',')!=='50,100,250')e.push('page-sizes='+d.sizes.join(','));for(const g of d.groups){if(!g.n)e.push('empty-group='+g.label);for(const t of g.structural){const u=new URL(t,BASE);if(!u.pathname.startsWith('/collections/')||!u.searchParams.get('sq_root'))e.push('bad-structural='+g.label)}}if(path==='/collections/firearm-accessories'&&!d.groups.some(g=>/Firearm Make \/ Model/i.test(g.label)&&g.n))e.push('missing-firearm-make-model');if(path==='/collections/literature'){for(const x of ['Shop by Author','Shop by Publisher','Shop by War / Conflict','Shop by Branch','Shop by Topic'])if(!d.groups.some(g=>g.label===x&&g.n))e.push('missing='+x);if(d.groups.some(g=>g.label==='Shop by Publishers'))e.push('plural-publisher')}if(e.length)fails.push(path+' :: '+e.join(' | '));console.log((e.length?'FAIL ':'PASS ')+path+' '+JSON.stringify(d))}catch(e){fails.push(path+' :: '+String(e));console.log('FAIL '+path+' '+e)}await sleep(700)}
          await c.close();await browser.close();console.log('SHARD_FAILURES='+JSON.stringify(fails));if(fails.length)process.exit(1);console.log('SHARD '+shard+' GREEN');
          EOF
          node final-routes.mjs
  protected-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify State Guard and Armored Vehicles isolation
        run: |
          cat > protected.mjs <<'EOF'
          import { chromium } from 'playwright';
          const B='https://www.statesideqm.com',T='158561894555',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({headless:true}),c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();
          for(const path of ['/collections/state-guard-series','/pages/armored-vehicles-purchase-inquiry']){const u=new URL(path,B);u.searchParams.set('preview_theme_id',T);let r;for(let a=0;a<4;a++){r=await p.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:70000}).catch(()=>null);if(r?.status()===200)break;await sleep(2500*(a+1))}if(r?.status()!==200)throw new Error(path+' HTTP '+r?.status());await sleep(1200);const d=await p.evaluate(()=>({v3:!!document.querySelector('[data-sq-refine-v3]'),active:document.querySelector('#MainContent')?.classList.contains('sq-refine-v3-active')||false,side:!!document.querySelector('.sq-refine-v3-sidebar')}));console.log(path,JSON.stringify(d));if(d.v3||d.active||d.side)throw new Error(path+' was captured by V3')}
          await c.close();await browser.close();console.log('PROTECTED ROUTES GREEN');
          EOF
          node protected.mjs
