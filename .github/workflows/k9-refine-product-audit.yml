name: K9 Refine Products Chromium Audit
on:
  push:
    paths:
      - '.github/workflows/k9-refine-product-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Discover and audit live K9 Refine Products controls
        run: |
          cat > k9-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const URL='https://www.statesideqm.com/collections/k9-dog-gear';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1200}});
          page.setDefaultTimeout(15000);
          const report={url:URL,base:{},controls:[],sections:[],errors:[]};
          page.on('console',m=>{if(m.type()==='error')report.errors.push(m.text())});
          const goto=async()=>{await page.goto(URL,{waitUntil:'domcontentloaded',timeout:60000});await page.locator('body').waitFor();await page.waitForTimeout(5000)};
          const visibleProducts=async()=>page.locator('a[href*="/products/"]').evaluateAll(as=>{
            const out=[]; const seen=new Set();
            for(const a of as){const r=a.getBoundingClientRect(),s=getComputedStyle(a);if(r.width<2||r.height<2||s.display==='none'||s.visibility==='hidden')continue;const href=(a.href||'').split('?')[0];if(seen.has(href))continue;seen.add(href);const card=a.closest('li,.card-wrapper,.product-card-wrapper,.grid__item,.sq-product-card,.product-card')||a;const t=(card.querySelector('h3,h2,.card__heading,.product-card__title,.product-title')?.textContent||a.textContent||'').replace(/\s+/g,' ').trim();if(t)out.push({title:t,href});}return out.slice(0,80);
          });
          await goto();
          const baseProducts=await visibleProducts();
          const bodyText=(await page.locator('body').innerText()).replace(/\s+/g,' ');
          report.base={title:await page.title(),hasRefineText:/Refine Products/i.test(bodyText),productCountVisible:baseProducts.length,containsCombatSuit:baseProducts.some(p=>/Army Tactical Desert Combat Suits with Knee Pads/i.test(p.title)),sample:baseProducts.slice(0,15)};
          report.controls=await page.locator('button,a,input,label,summary,select,[role="button"],[role="checkbox"],[role="radio"]').evaluateAll(els=>els.map((el,i)=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);const text=(el.innerText||el.textContent||el.getAttribute('aria-label')||el.getAttribute('value')||'').replace(/\s+/g,' ').trim();return {i,tag:el.tagName,role:el.getAttribute('role'),type:el.getAttribute('type'),text:text.slice(0,180),id:el.id||null,cls:el.className||null,href:el.href||null,visible:r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};}).filter(x=>x.visible&&x.text).slice(0,1200));
          const candidates=report.controls.filter(c=>/Refine Products|Shop by Category|Shop by Type|Manufacturer|Availability|Color|Pattern|Harness|Leash|Collar|K9|Dog/i.test(c.text));
          report.candidates=candidates;
          const refineText=page.getByText(/Refine Products/i).first();
          if(await refineText.count()){
            report.refineElement=await refineText.evaluate(el=>({tag:el.tagName,id:el.id||null,cls:el.className||null,parent:el.parentElement?.outerHTML?.slice(0,5000)||null})).catch(()=>null);
          }
          // Audit every visible checkbox/radio in the page, recording labels and resulting URL/products.
          const allInputs=page.locator('input[type="checkbox"],input[type="radio"]');
          const inputCount=await allInputs.count();
          report.inputCount=inputCount;
          for(let i=0;i<inputCount;i++){
            await goto();
            const inputs=page.locator('input[type="checkbox"],input[type="radio"]');
            if(i>=await inputs.count()) break;
            const inp=inputs.nth(i); const visible=await inp.isVisible().catch(()=>false); if(!visible) continue;
            const id=await inp.getAttribute('id'); const value=await inp.getAttribute('value'); const name=await inp.getAttribute('name');
            let label=''; if(id) label=(await page.locator(`label[for="${id}"]`).first().innerText().catch(()=>'')); if(!label) label=await inp.evaluate(el=>el.closest('label')?.innerText||el.getAttribute('aria-label')||el.value||''); label=label.replace(/\s+/g,' ').trim();
            if(!label) continue;
            let ok=true,err=null; try{await inp.check({force:true});await page.waitForTimeout(2200);}catch(e){ok=false;err=String(e).split('\n')[0]}
            report.sections.push({index:i,label,value,name,ok,error:err,url:page.url(),products:ok?await visibleProducts():[]});
          }
          fs.writeFileSync('k9-refine-audit.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({base:report.base,inputCount:report.inputCount,candidates:report.candidates,sections:report.sections.map(s=>({label:s.label,url:s.url,count:s.products.length}))},null,2));
          await page.screenshot({path:'k9-refine-live.png',fullPage:true}).catch(()=>{});
          await browser.close();
          EOF
          node k9-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k9-refine-audit
          path: |
            k9-refine-audit.json
            k9-refine-live.png
