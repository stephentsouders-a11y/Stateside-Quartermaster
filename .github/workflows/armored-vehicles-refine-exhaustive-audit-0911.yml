name: Armored Vehicles Refine Exhaustive Audit 0911
on:
  push:
    paths:
      - '.github/workflows/armored-vehicles-refine-exhaustive-audit-0911.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-restart-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Exhaustive Armored Vehicles Chromium audit
        env:
          TARGET: https://www.statesideqm.com/pages/armored-vehicles-purchase-inquiry?preview_theme_id=158561894555
        run: |
          cat > armored-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const target=process.env.TARGET;
          await fs.mkdir('out',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
          const page=await ctx.newPage();
          page.setDefaultTimeout(15000); page.setDefaultNavigationTimeout(60000);
          const consoleErrors=[]; page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          const badResponses=[]; page.on('response',r=>{if(r.status()>=400)badResponses.push({status:r.status(),url:r.url()})});
          const response=await page.goto(target,{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(1800);
          const base=await page.evaluate(()=>{
            const main=document.querySelector('#MainContent');
            const sidebar=document.querySelector('.sq-refine-v3-sidebar,.sq-global-refine-sidebar,[data-sq-refine-v3-sidebar]');
            const productLinks=[...document.querySelectorAll('#MainContent a[href*="/products/"]')].filter(a=>{const r=a.getBoundingClientRect(),s=getComputedStyle(a);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'}).map(a=>a.href);
            const visibleControls=sidebar?[...sidebar.querySelectorAll('input,button,a,summary')].filter(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'}).map((el,i)=>({i,tag:el.tagName,type:el.type||'',name:el.name||'',value:el.value||'',text:(el.innerText||el.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim(),href:el.href||''})):[];
            return {title:document.title,url:location.href,mainText:(main?.innerText||'').replace(/\s+/g,' ').trim().slice(0,5000),v3Script:!!document.querySelector('[data-sq-refine-v3]'),v3Sidebar:!!document.querySelector('.sq-refine-v3-sidebar'),anyRefineSidebar:!!sidebar,productLinkCount:new Set(productLinks).size,visibleControls};
          });
          const tests=[];
          if(base.anyRefineSidebar){
            const checks=page.locator('.sq-refine-v3-sidebar input[type="checkbox"],.sq-refine-v3-sidebar input[type="radio"],.sq-global-refine-sidebar input[type="checkbox"],.sq-global-refine-sidebar input[type="radio"]');
            const count=await checks.count();
            for(let i=0;i<count;i++){
              await page.goto(target,{waitUntil:'domcontentloaded'}); await page.waitForTimeout(900);
              const all=page.locator('.sq-refine-v3-sidebar input[type="checkbox"],.sq-refine-v3-sidebar input[type="radio"],.sq-global-refine-sidebar input[type="checkbox"],.sq-global-refine-sidebar input[type="radio"]');
              if(i>=await all.count()) break;
              const box=all.nth(i); const meta=await box.evaluate(el=>({name:el.name||'',value:el.value||'',id:el.id||'',label:el.closest('label')?.innerText?.replace(/\s+/g,' ').trim()||''}));
              try{await box.check({force:true}); await page.waitForTimeout(1200);}catch(e){tests.push({...meta,error:String(e)});continue}
              const state=await page.evaluate(()=>({url:location.href,products:[...new Set([...document.querySelectorAll('#MainContent a[href*="/products/"]')].filter(a=>{const r=a.getBoundingClientRect(),s=getComputedStyle(a);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'}).map(a=>a.href))].slice(0,25)}));
              const metadata=[];
              for(const href of state.products.slice(0,8)){
                try{const u=new URL(href);const m=u.pathname.match(/^\/products\/([^/?#]+)/);if(!m)continue;const r=await ctx.request.get(`${u.origin}/products/${m[1]}.js`,{timeout:15000});if(r.ok()){const p=await r.json();metadata.push({handle:m[1],title:p.title,vendor:p.vendor,type:p.type,tags:p.tags||[]})}}catch{}
              }
              let semanticMatch=null;
              if(meta.name==='filter.p.vendor') semanticMatch=metadata.every(p=>String(p.vendor).toLowerCase()===String(meta.value).toLowerCase());
              if(meta.name==='filter.p.product_type') semanticMatch=metadata.every(p=>String(p.type).toLowerCase()===String(meta.value).toLowerCase());
              if(meta.name==='filter.p.tag') semanticMatch=metadata.every(p=>(p.tags||[]).some(t=>String(t).toLowerCase()===String(meta.value).toLowerCase()));
              tests.push({...meta,resultUrl:state.url,productCount:state.products.length,metadata,semanticMatch});
            }
          }
          const expectedNoRefine=!base.v3Script&&!base.v3Sidebar&&!base.anyRefineSidebar;
          const hasRequiredContent=/armored\s+vehicles/i.test(base.mainText)&&/inquiry|purchase/i.test(base.mainText);
          const report={http:response?.status()||0,base,expectedNoRefine,hasRequiredContent,tests,consoleErrors,badResponses:[...new Map(badResponses.map(x=>[x.status+' '+x.url,x])).values()].slice(0,50)};
          report.pass=report.http===200&&expectedNoRefine&&hasRequiredContent&&tests.length===0;
          report.conclusion=report.pass?'PASS: this special inquiry page correctly has no Refine Products collection UI, so there are no filter-product assignments to transfer.':'FAIL: unexpected refine/product behavior is present and needs source repair.';
          await page.screenshot({path:'out/armored-vehicles.png',fullPage:true});
          await fs.writeFile('out/report.json',JSON.stringify(report,null,2));
          console.log('ARMOR AUDIT REPORT\n'+JSON.stringify(report,null,2));
          await browser.close();
          if(!report.pass) process.exitCode=2;
          EOF
          node armored-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: armored-vehicles-refine-audit-0911
          path: out
          retention-days: 7
