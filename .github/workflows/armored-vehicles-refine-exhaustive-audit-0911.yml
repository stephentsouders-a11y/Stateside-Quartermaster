name: Armored Vehicles Refine Exhaustive Audit 0911
on:
  push:
    paths:
      - '.github/workflows/armored-vehicles-refine-exhaustive-audit-0911.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: live
            target: https://www.statesideqm.com/pages/armored-vehicles-purchase-inquiry
          - label: preview
            target: https://www.statesideqm.com/pages/armored-vehicles-purchase-inquiry?preview_theme_id=158561894555
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-restart-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify source gate
        run: |
          grep -F "{% if request.page_type == 'collection' and collection.handle != 'state-guard-series' %}" snippets/sq-refine-v3.liquid
      - name: Exhaustive Armored Vehicles Chromium audit
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
        run: |
          cat > armored-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const target=process.env.TARGET;
          const label=process.env.LABEL;
          await fs.mkdir('out',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
          const page=await ctx.newPage();
          page.setDefaultTimeout(15000); page.setDefaultNavigationTimeout(60000);
          const consoleErrors=[]; page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          const badResponses=[]; page.on('response',r=>{if(r.status()>=400)badResponses.push({status:r.status(),url:r.url()})});
          const response=await page.goto(target,{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(1800);
          const base=await page.evaluate(()=>{
            const main=document.querySelector('#MainContent');
            const sidebar=document.querySelector('.sq-refine-v3-sidebar,.sq-global-refine-sidebar,[data-sq-refine-v3-sidebar]');
            const productLinks=[...document.querySelectorAll('#MainContent a[href*="/products/"]')].filter(a=>{const r=a.getBoundingClientRect(),s=getComputedStyle(a);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'}).map(a=>a.href);
            const visibleControls=sidebar?[...sidebar.querySelectorAll('input,button,a,summary')].filter(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'}).map((el,i)=>({i,tag:el.tagName,type:el.type||'',name:el.name||'',value:el.value||'',text:(el.innerText||el.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim(),href:el.href||''})):[];
            return {title:document.title,url:location.href,mainText:(main?.innerText||'').replace(/\s+/g,' ').trim().slice(0,5000),v3Script:!!document.querySelector('[data-sq-refine-v3]'),v3Sidebar:!!document.querySelector('.sq-refine-v3-sidebar'),anyRefineSidebar:!!sidebar,productLinkCount:new Set(productLinks).size,visibleControls};
          });
          const expectedNoRefine=!base.v3Script&&!base.v3Sidebar&&!base.anyRefineSidebar;
          const hasRequiredContent=/armored\s+vehicles/i.test(base.mainText)&&/inquiry|purchase/i.test(base.mainText);
          const report={label,http:response?.status()||0,base,expectedNoRefine,hasRequiredContent,consoleErrors,badResponses:[...new Map(badResponses.map(x=>[x.status+' '+x.url,x])).values()].slice(0,50)};
          report.pass=report.http===200&&expectedNoRefine&&hasRequiredContent&&base.productLinkCount===0&&base.visibleControls.length===0;
          report.conclusion=report.pass?'PASS: inquiry page is correctly isolated from Refine Products and product-grid routing.':'FAIL: unexpected Refine Products/product-grid behavior is present.';
          await page.screenshot({path:`out/armored-vehicles-${label}.png`,fullPage:true});
          await fs.writeFile(`out/report-${label}.json`,JSON.stringify(report,null,2));
          console.log('ARMOR AUDIT REPORT '+label+'\n'+JSON.stringify(report,null,2));
          await browser.close();
          if(!report.pass) process.exitCode=2;
          EOF
          node armored-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: armored-vehicles-refine-audit-0911-${{ matrix.label }}
          path: out
          retention-days: 7
