name: Refine V3 customer journey certification v3
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/scripts/refine-v3-customer-journey-v3.mjs'
      - '.github/workflows/refine-v3-customer-journey-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-journey-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run customer journey v3
        run: node .github/scripts/refine-v3-customer-journey-v3.mjs
