name: Storefront audit - Accessories sidebar final
on:
  push:
    paths:
      - '.github/workflows/storefront-audit-accessories-sidebar-final.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Accessories sidebar
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
        run: |
          cat > audit.mjs <<'EOF'
          import {chromium} from 'playwright';import fs from 'fs';
          const b=await chromium.launch({headless:true});
          const c=await b.newContext({viewport:{width:1440,height:1100}});
          const p=await c.newPage();
          const u=new URL('/collections/accessories-gifts-collectibles?filter.v.availability=1',process.env.BASE);u.searchParams.set('preview_theme_id',process.env.THEME);
          const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForTimeout(9000);
          await p.addStyleTag({content:'html,body{height:auto!important;min-height:100%!important;overflow:visible!important}.page-wrapper{height:auto!important;min-height:100vh!important;overflow:visible!important;max-height:none!important}'}).catch(()=>{});
          const data=await p.evaluate(()=>{
            const vis=e=>!!e&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden'&&e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0;
            const tx=e=>(e?.textContent||'').replace(/\s+/g,' ').trim();
            const rect=e=>e?(()=>{const r=e.getBoundingClientRect();return{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}})():null;
            const all=[...document.querySelectorAll('#MainContent *')];
            const hMan=all.filter(e=>vis(e)&&/^shop by manufacturer$/i.test(tx(e))).map(rect);
            const hColor=all.filter(e=>vis(e)&&/^shop by color\s*\/\s*pattern$/i.test(tx(e))).map(rect);
            const side=document.querySelector('#MainContent .sq-global-refine-sidebar');
            const layout=document.querySelector('#MainContent .sq-global-refine-layout');
            const main=document.querySelector('#MainContent .sq-global-refine-main');
            const cards=[...document.querySelectorAll('#MainContent .sq-global-refine-main .sq-subcategory-card')].filter(vis);
            const imgs=[...document.querySelectorAll('#MainContent .sq-global-refine-main .sq-subcategory-card img')];
            const oldSides=[...document.querySelectorAll('#MainContent .sq-collection-sidebar:not(.sq-global-refine-sidebar),#MainContent .sq-custom-render-sidebar:not(.sq-global-refine-sidebar)')].filter(vis);
            return {
              url:location.href,title:document.title,height:document.documentElement.scrollHeight,
              globalSidebarCount:[...document.querySelectorAll('#MainContent .sq-global-refine-sidebar')].filter(vis).length,
              oldVisibleSidebarCount:oldSides.length,
              layout:rect(layout),sidebar:rect(side),main:rect(main),
              sidebarText:tx(side),sidebarDetails:side?[...side.querySelectorAll('summary')].map(tx):[],
              visibleManufacturerHeadingCount:hMan.length,visibleManufacturerHeadingRects:hMan,
              visibleColorHeadingCount:hColor.length,visibleColorHeadingRects:hColor,
              categoryCardCount:cards.length,firstFourCards:cards.slice(0,4).map(e=>({text:tx(e).slice(0,100),rect:rect(e)})),
              brokenCardImages:imgs.filter(i=>i.complete&&i.naturalWidth===0).map(i=>({alt:i.alt,src:i.currentSrc||i.src})),
              availabilityLinks:[...document.querySelectorAll('#MainContent a[href]')].filter(a=>(a.getAttribute('href')||'').includes('filter.v.availability')).length,
              memorial:[...document.querySelectorAll('#MainContent .sq-subcategory-card')].filter(e=>/Memorial & Personalized Gifts/i.test(tx(e))).map(e=>{const i=e.querySelector('img');return{text:tx(e),rect:rect(e),src:i?.currentSrc||i?.src||'',naturalWidth:i?.naturalWidth||0}})
            };
          });
          fs.mkdirSync('audit-out',{recursive:true});fs.writeFileSync('audit-out/report.json',JSON.stringify({status:r?.status(),...data},null,2));await p.screenshot({path:'audit-out/accessories.png',fullPage:true});await b.close();
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: storefront-audit-accessories-sidebar-final
          path: audit-out
          retention-days: 7
