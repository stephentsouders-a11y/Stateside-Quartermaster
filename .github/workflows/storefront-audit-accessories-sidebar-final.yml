name: Storefront audit - Accessories live exhaustive
on:
  push:
    paths:
      - '.github/workflows/storefront-audit-accessories-sidebar-final.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Audit exact live Accessories collection
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright'; import fs from 'fs';
          fs.mkdirSync('audit-out/videos',{recursive:true});
          const target='https://www.statesideqm.com/collections/accessories-gifts-collectibles';
          const results=[];
          for (const [device,viewport] of [['desktop',{width:1440,height:1100}],['mobile',{width:390,height:844}]]) {
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport,recordVideo:{dir:'audit-out/videos',size:viewport}});
            const page=await ctx.newPage(); page.setDefaultNavigationTimeout(60000);
            const consoleErrors=[],pageErrors=[],failedRequests=[];
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failedRequests.push({url:r.url(),error:r.failure()?.errorText||''}));
            await page.addInitScript(()=>{window.__audit={lcp:0,cls:0,longtasks:0};try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__audit.lcp=Math.max(window.__audit.lcp,e.startTime)}).observe({type:'largest-contentful-paint',buffered:true})}catch{}try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)window.__audit.cls+=e.value}).observe({type:'layout-shift',buffered:true})}catch{}try{new PerformanceObserver(l=>window.__audit.longtasks+=l.getEntries().length).observe({type:'longtask',buffered:true})}catch{}});
            const started=Date.now(); let response=null,navError=null;
            try{response=await page.goto(target,{waitUntil:'domcontentloaded'})}catch(e){navError=String(e)}
            let usableMs=null;
            for(let i=0;i<60&&!navError;i++){const ok=await page.evaluate(()=>{const m=document.querySelector('#MainContent')||document.querySelector('main');if(!m)return false;const t=(m.innerText||'').replace(/\s+/g,' ');const bad=/just a moment|something went wrong|internal server error|there was a problem/i.test(document.title+' '+t);const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>30&&r.height>20};return !bad&&[...m.querySelectorAll('a[href*="/products/"],.sq-subcategory-card,.product-card,.product-grid__item')].some(vis)}).catch(()=>false);if(ok){usableMs=Date.now()-started;break}await page.waitForTimeout(200)}
            await page.waitForTimeout(1200);
            const data=await page.evaluate(()=>{const m=document.querySelector('#MainContent')||document.querySelector('main');const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity!==0&&r.width>2&&r.height>2};const tx=e=>(e?.innerText||e?.textContent||'').replace(/\s+/g,' ').trim();const nav=performance.getEntriesByType('navigation')[0];const side=[...(m?.querySelectorAll('.sq-global-refine-sidebar')||[])].filter(vis);const productLinks=[...(m?.querySelectorAll('a[href*="/products/"]')||[])].filter(vis);const cards=[...(m?.querySelectorAll('.sq-subcategory-card,.product-card,.product-grid__item')||[])].filter(vis);const images=[...(m?.querySelectorAll('img')||[])];const nativeDesktop=[...(m?.querySelectorAll('.facets-block-wrapper .facets--horizontal,.facets--horizontal.facets')||[])].filter(vis);const nativeMobile=[...(m?.querySelectorAll('.facets-toggle__wrapper,.facets-toggle__button')||[])].filter(vis);const body=tx(m);return{title:document.title,url:location.href,itemCount:(body.match(/([\d,]+)\s+items/i)||[])[1]||null,categoryCards:[...(m?.querySelectorAll('.sq-subcategory-card')||[])].filter(vis).length,productLinks:productLinks.length,visibleCards:cards.length,sidebarCount:side.length,nativeDesktopFilters:nativeDesktop.length,nativeMobileFilters:nativeMobile.length,brokenImages:images.filter(i=>i.complete&&i.naturalWidth===0).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,stateGuardContamination:/State Guard Uniform Builder|Build Your Uniform|PT Uniform/i.test(body),stateGuardMatches:(body.match(/State Guard Uniform Builder|Build Your Uniform|PT Uniform/gi)||[]),sortSelects:[...m.querySelectorAll('select')].filter(vis).filter(s=>[...s.options].some(o=>/price, low to high/i.test(o.text))).length,refineTriggers:[...m.querySelectorAll('button,summary')].filter(vis).filter(e=>/refine products|filter/i.test(tx(e))).map(e=>tx(e).slice(0,80)),perf:nav?{ttfb:Math.round(nav.responseStart),domContentLoaded:Math.round(nav.domContentLoadedEventEnd),load:Math.round(nav.loadEventEnd),transferSize:nav.transferSize,decodedBodySize:nav.decodedBodySize}:null,vitals:window.__audit||null}});
            await page.screenshot({path:`audit-out/${device}-initial.png`,fullPage:true});
            let refine={attempted:false,opened:false,label:null};
            const refineLoc=page.locator('button,summary').filter({hasText:/Refine Products|Filter/i}).filter({visible:true}).first();
            if(await refineLoc.count().catch(()=>0)){refine.attempted=true;refine.label=(await refineLoc.innerText().catch(()=>''));await refineLoc.click().catch(()=>{});await page.waitForTimeout(600);refine.opened=await page.evaluate(()=>{const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>50&&r.height>50};return [...document.querySelectorAll('dialog,[role="dialog"],.facets__form,.facets-drawer,.sq-global-refine-sidebar')].some(vis)}).catch(()=>false);await page.screenshot({path:`audit-out/${device}-refine.png`,fullPage:true});}
            let sort={attempted:false,worked:false,before:page.url(),after:null};
            const sorts=page.locator('select').filter({has:page.locator('option', {hasText:/Price, low to high/i})});
            if(await sorts.count().catch(()=>0)){const sel=sorts.first();if(await sel.isVisible().catch(()=>false)){sort.attempted=true;const value=await sel.locator('option').filter({hasText:/Price, low to high/i}).first().getAttribute('value').catch(()=>null);if(value){await Promise.all([page.waitForLoadState('domcontentloaded').catch(()=>{}),sel.selectOption(value).catch(()=>{})]);await page.waitForTimeout(800);sort.after=page.url();sort.worked=/sort_by=price-ascending/i.test(sort.after)||sort.after!==sort.before;}}}
            const categoryHrefs=await page.evaluate(()=>[...document.querySelectorAll('#MainContent .sq-subcategory-card a[href],#MainContent a.sq-subcategory-card[href]')].map(a=>a.href).filter((v,i,a)=>a.indexOf(v)===i).slice(0,8));
            const categoryStatuses=[];for(const href of categoryHrefs){try{const r=await ctx.request.get(href,{timeout:20000});categoryStatuses.push({href,status:r.status()})}catch(e){categoryStatuses.push({href,status:null,error:String(e)})}}
            results.push({device,status:response?.status()??null,navError,usableMs,consoleErrors,pageErrors,failedRequests:failedRequests.slice(0,25),data,refine,sort,categoryStatuses});
            fs.writeFileSync('audit-out/report.json',JSON.stringify({target,results},null,2));
            await page.waitForTimeout(300);await ctx.close();await browser.close();
          }
          const hardFailures=[];for(const r of results){if(r.status!==200)hardFailures.push(`${r.device}: status ${r.status}`);if(r.navError)hardFailures.push(`${r.device}: ${r.navError}`);if(r.usableMs===null||r.usableMs>5000)hardFailures.push(`${r.device}: usable ${r.usableMs}`);if(r.data.brokenImages)hardFailures.push(`${r.device}: broken images ${r.data.brokenImages}`);if(r.data.overflow)hardFailures.push(`${r.device}: horizontal overflow`);if(r.refine.attempted&&!r.refine.opened)hardFailures.push(`${r.device}: refine did not open`);if(r.sort.attempted&&!r.sort.worked)hardFailures.push(`${r.device}: sort did not work`);if(r.categoryStatuses.some(x=>x.status!==200))hardFailures.push(`${r.device}: category link failure`)}
          const warnings=[];for(const r of results){if(r.data.stateGuardContamination)warnings.push(`${r.device}: State Guard builder content present`);if(r.consoleErrors.length)warnings.push(`${r.device}: ${r.consoleErrors.length} console errors`);if(r.failedRequests.length)warnings.push(`${r.device}: ${r.failedRequests.length} failed requests`)}
          fs.writeFileSync('audit-out/verdict.json',JSON.stringify({hardFailures,warnings},null,2));console.log(JSON.stringify({results,hardFailures,warnings},null,2));if(hardFailures.length)process.exitCode=2;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessories-live-exhaustive-audit
          path: audit-out
          retention-days: 7
