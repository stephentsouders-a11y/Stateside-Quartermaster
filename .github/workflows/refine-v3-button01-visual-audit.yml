name: REFINE V3 Button 01 Forensic Visual Audit

on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/scripts/refine-v3-button01-visual-audit-v4.mjs'
      - '.github/workflows/refine-v3-button01-visual-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium audit dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run button 01 forensic Chromium audit
        run: node .github/scripts/refine-v3-button01-visual-audit-v4.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: button-01-forensic-audit
          path: audit-evidence/button-01/current
          if-no-files-found: warn
          retention-days: 14

# Dedicated route-by-route release gate: button 01 must pass before button 02.
