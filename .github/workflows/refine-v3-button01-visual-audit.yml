name: REFINE V3 Button 01 Forensic Visual Audit

on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/scripts/refine-v3-button01-final-cert-v5.mjs'
      - '.github/workflows/refine-v3-button01-visual-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium audit dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run final button 01 Chromium certification
        run: node .github/scripts/refine-v3-button01-final-cert-v5.mjs
      - name: Upload final visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: button-01-final-v5
          path: audit-evidence/button-01/final-v5
          if-no-files-found: warn
          retention-days: 14

# Button 01 must pass automated and manual Chromium review before button 02 begins.
