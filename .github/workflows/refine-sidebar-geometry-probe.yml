name: Refine Products focused geometry probe
on:
  push:
    paths:
      - '.github/workflows/refine-sidebar-geometry-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe current draft geometry
        run: |
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base='https://www.statesideqm.com',theme='158561894555';
          const routes=[
            '/collections/literature',
            '/collections/alabama-state-guard-female-pt-uniform',
            '/collections/ohmr-female-pt-uniform',
            '/collections/army-service-flags',
            '/collections/medical-bags-packs-pouches',
            '/collections/flashlights-lighting'
          ];
          const b=await chromium.launch({headless:true});let failures=0;
          for(const route of routes){for(const [device,viewport] of [['desktop',{width:1440,height:1100}],['mobile',{width:390,height:844}]]){
            const c=await b.newContext({viewport});const p=await c.newPage();p.setDefaultNavigationTimeout(30000);const u=new URL(route,base);u.searchParams.delete('filter.v.availability');u.searchParams.set('preview_theme_id',theme);let status=null,d=null,error=null;
            for(let attempt=1;attempt<=3;attempt++){try{const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded'});status=r?.status()??null;await p.waitForTimeout(1400);d=await p.evaluate(device=>{const m=document.querySelector('#MainContent')||document.querySelector('main');if(!m)return null;const v=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity!==0&&r.width>2&&r.height>2};const sb=[...m.querySelectorAll('.sq-global-refine-sidebar')].filter(v),side=sb[0]||null,layout=m.querySelector('.sq-global-refine-layout'),body=layout?.querySelector(':scope > .sq-global-refine-main');const candidates=[...m.querySelectorAll('.sq-subcategory-card,.sqbfl-card,.sg-entity,.sq-afg-branch-card,.sq-third-level__type,.sq-msa-card,.sq-thin-line-card,.sq-books-tree a[href],.product-grid__item,.product-card,.sq-type-family-product,.sq-custom-color-products__item,a[href*="/products/"]')].filter(e=>v(e)&&!side?.contains(e)).sort((a,b)=>a.getBoundingClientRect().top-b.getBoundingClientRect().top||a.getBoundingClientRect().left-b.getBoundingClientRect().left);const first=candidates[0]||null,sr=side?.getBoundingClientRect(),fr=first?.getBoundingClientRect();let overlap=false,under=false,left=true;if(sr&&fr){overlap=!(sr.right<=fr.left+8||fr.right<=sr.left+8||sr.bottom<=fr.top+8||fr.bottom<=sr.top+8);under=fr.top>sr.bottom-8;left=sr.left<fr.left&&sr.right<=fr.left+16}const nativeDesktop=[...m.querySelectorAll('.facets__filters-wrapper')].filter(v).length,nativeMobile=[...m.querySelectorAll('.facets-toggle__button,.facets-toggle__wrapper')].filter(v).length;return{bad:/just a moment|something went wrong|internal server error|there was a problem/i.test(document.title+' '+(m.innerText||'')),sidebar:sb.length,heading:side?.querySelector('.sq-global-refine-sidebar__title')?.textContent?.trim()||'',nativeDesktop,nativeMobile,availability:[...m.querySelectorAll('a[href*="filter.v.availability"]')].length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,firstClass:first?.className||first?.tagName||'',surfaceClass:first?.closest('.sq-subcategory-section,.sq-subcategory-wrap,.sq-third-level,.sq-third-level__wrap,.sq-line-series-categories,.sq-line-series-categories__wrap,.sq-line-program-tree,.sq-line-program-tree__wrap,.sq-afg-branch-section,.sq-books-tree,.sg-entities,.sqsg,.sq-ts-match,.sq-ptype-browser,.vac-category-section,.vac-series-section,.vac-military-folders,.vac-guard-folders,.vac-armor-browser,.vac-gift-categories,.vac-knives-browser')?.className||'',inBody:!!(first&&body?.contains(first)),under,overlap,left,sideRect:sr?{x:sr.x,y:sr.y,w:sr.width,h:sr.height}:null,firstRect:fr?{x:fr.x,y:fr.y,w:fr.width,h:fr.height}:null};},device);if(status===200&&d&&!d.bad)break}catch(e){error=String(e)}await p.waitForTimeout(2200*attempt)}
            const failed=!d||status!==200||d.bad||d.sidebar!==1||d.heading!=='Refine Products'||d.nativeDesktop>0||d.nativeMobile>0||d.availability>0||d.overflow||(device==='desktop'&&(!d.inBody||d.under||d.overlap||!d.left));if(failed)failures++;console.log(JSON.stringify({route,device,status,error,failed,...(d||{})}));await c.close();
          }}
          await b.close();console.log(`GEOMETRY ${12-failures}/12 PASS; ${failures} FAIL`);if(failures)process.exitCode=2;
          EOF
          node probe.mjs
