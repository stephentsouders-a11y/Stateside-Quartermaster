name: Sep18 retry invalid and State Guard slow routes
on:
  push:
    paths:
      - '.github/workflows/sep18-single-route-retries.yml'
      - '.github/scripts/sep18-single-route-verify.mjs'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { key: k9, label: "K9 Working Dog Gear", route: "/collections/k9-dog-gear", group: "homepage" }
          - { key: knives, label: "Knives Axes Multi-Tools", route: "/collections/knives-axes-cutlery", group: "homepage" }
          - { key: alabama, label: "Alabama State Guard", route: "/collections/state-guard-series-alabama", group: "state-guard-root" }
          - { key: south-carolina, label: "South Carolina State Guard", route: "/collections/state-guard-series-south-carolina", group: "state-guard-root" }
          - { key: indiana, label: "Indiana Guard Reserve", route: "/collections/state-guard-series-indiana", group: "state-guard-root" }
          - { key: oregon, label: "Oregon Civil Defense Force", route: "/collections/state-guard-series-oregon", group: "state-guard-root" }
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KEY: ${{ matrix.key }}
      LABEL: ${{ matrix.label }}
      ROUTE: ${{ matrix.route }}
      GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/scripts/sep18-single-route-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep18-single-route-${{ matrix.key }}-${{ github.run_id }}
          path: sep18-single-route-${{ matrix.key }}/
          retention-days: 14
