name: Accessories V3 isolated 250 certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/accessories-v3-250-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-250:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify isolated 250 product load
        run: |
          cat > exact250.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          const u='https://www.statesideqm.com/collections/accessories-gifts-collectibles?preview_theme_id=158561894555&sq_per_page=250&sq_view_page=1';
          let r;for(let i=0;i<6;i++){r=await page.goto(u,{waitUntil:'domcontentloaded',timeout:90000});if(r?.status()===200)break;if(![429,500,502,503,504].includes(r?.status()||0))break;await page.waitForTimeout([8000,15000,25000,35000,45000,60000][i])}
          try{await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:90000})}catch{}
          await page.waitForTimeout(10000);
          const d=await page.evaluate(()=>{const main=document.querySelector('#MainContent'),grid=main?.querySelector('.sq-refine-v3-results .product-grid'),side=main?.querySelector('.sq-refine-v3-sidebar');const cards=grid?[...grid.querySelectorAll(':scope > .product-grid__item')].filter(x=>!!x.querySelector('a[href*="/products/"]')):[];const visible=cards.filter(el=>{const s=getComputedStyle(el),b=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&b.width>0&&b.height>0});const rects=visible.slice(0,6).map(x=>{const r=x.getBoundingClientRect();return{x:Math.round(r.x),y:Math.round(r.y)}});const firstY=rects[0]?.y;return{ready:main?.dataset.sqRefineV3Ready==='true',error:main?.dataset.sqRefineV3Error||'',cards:cards.length,visibleCards:visible.length,checked:!!document.querySelector('.sq-refine-v3-page-size input[value="250"]:checked'),sizes:[...document.querySelectorAll('.sq-refine-v3-page-size input')].map(i=>i.value),firstRowCount:rects.filter(x=>Math.abs(x.y-firstY)<=3).length,sticky:side?getComputedStyle(side).position:''}});
          const ok=r?.status()===200&&errors.length===0&&d.ready&&!d.error&&d.cards===250&&d.visibleCards===250&&d.checked&&d.sizes.join(',')==='50,100,250'&&d.firstRowCount===3&&d.sticky==='sticky';
          console.log('EXACT_250 '+JSON.stringify({http:r?.status()||0,errors,d,ok}));
          await browser.close();if(!ok)process.exit(1);
          EOF
          node exact250.mjs
