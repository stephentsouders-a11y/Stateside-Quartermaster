name: Medical Refine every-choice Chromium audit

on:
  push:
    paths:
      - '.github/workflows/medical-refine-every-choice-chromium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  every-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click every Medical Refine Products choice one by one
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const themeId='158561894555';
          const basePath='/collections/first-aid-medical-ifak';
          const base=`https://www.statesideqm.com${basePath}?preview_theme_id=${themeId}&sq_per_page=50`;
          const expectedCategories=new Map([
            ['Bleeding Control, Bandages & Tourniquets','bleeding-control-bandages-tourniquets'],
            ['First Aid, IFAK & Trauma Kits','first-aid-ifak-trauma-kits'],
            ['Medical Bags, Packs & Pouches','medical-bags-packs-pouches'],
            ['Medical Supplies, Medicine & Hygiene','medical-supplies-medicine-hygiene'],
            ['Medical Tools, Training & Evacuation','medical-tools-training-evacuation'],
          ]);
          const forbidden=/State Guard Uniform Builder|Build Your Uniform|PT Uniform/i;
          fs.mkdirSync('out/screens',{recursive:true});
          const report={base,startedAt:new Date().toISOString(),inventory:[],choices:[],failures:[],warnings:[]};
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
          const page=await ctx.newPage();
          page.setDefaultNavigationTimeout(90000); page.setDefaultTimeout(30000);
          const runtimeErrors=[]; page.on('pageerror',e=>runtimeErrors.push(String(e)));
          async function ready(){await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:30000}); await page.waitForTimeout(500)}
          async function openBase(){const r=await page.goto(base,{waitUntil:'domcontentloaded'}); if(r?.status()!==200)throw new Error(`Base HTTP ${r?.status()}`); await ready()}
          const safe=s=>(s||'choice').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,80).toLowerCase();
          async function collectionProducts(handle){return await page.evaluate(async ({handle,themeId})=>{const all=[];for(let p=1;p<=10;p++){const u=`/collections/${encodeURIComponent(handle)}/products.json?limit=250&page=${p}&preview_theme_id=${themeId}`;const r=await fetch(u,{credentials:'same-origin'});if(!r.ok)throw new Error(`${handle} products.json HTTP ${r.status}`);const j=await r.json(),a=Array.isArray(j?.products)?j.products:[];all.push(...a.map(x=>({id:x.id,title:x.title,handle:x.handle,vendor:x.vendor,product_type:x.product_type,tags:Array.isArray(x.tags)?x.tags:String(x.tags||'').split(',').map(t=>t.trim()).filter(Boolean)})));if(a.length<250)break}return all},{handle,themeId})}
          await openBase();
          const initial=await page.evaluate(()=>{const main=document.querySelector('#MainContent');const side=main?.querySelector('.sq-refine-v3-sidebar,.sq-global-refine-sidebar');const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};const old=[...main.querySelectorAll('.facets-block-wrapper--horizontal .facets__filters-wrapper,.facets-toggle__wrapper,theme-drawer#filters-drawer')].filter(vis).length;return{ready:main?.dataset.sqRefineV3Ready||null,sidebar:!!side,oldNativeVisible:old,text:main?.innerText||''}});
          if(!initial.sidebar)report.failures.push('Refine Products sidebar missing'); if(initial.oldNativeVisible)report.failures.push(`Old native filter surfaces visible: ${initial.oldNativeVisible}`); if(forbidden.test(initial.text))report.failures.push('State Guard builder contamination visible on medical root');
          const inventory=await page.evaluate(()=>{const side=document.querySelector('#MainContent .sq-refine-v3-sidebar,#MainContent .sq-global-refine-sidebar');if(!side)return[];return[...side.querySelectorAll('details.sq-refine-v3-group')].flatMap((d,gi)=>{const group=(d.querySelector(':scope > summary')?.textContent||'').replace(/\s+/g,' ').trim();return[...d.querySelectorAll('input[type="checkbox"]')].map((i,ii)=>({group,gi,ii,value:i.value||'',target:i.dataset.target||'',filterName:i.dataset.filterName||'',polish:i.dataset.sqPolishParam||'',label:(i.closest('.sq-refine-v3-choice')?.innerText||i.value||'').replace(/\s+/g,' ').trim()}))})});
          report.inventory=inventory; if(!inventory.length)report.failures.push('No Refine checkbox choices found');
          const categoryChoices=inventory.filter(x=>x.group==='Shop by Category'); if(categoryChoices.length!==expectedCategories.size)report.failures.push(`Expected ${expectedCategories.size} Shop by Category choices, found ${categoryChoices.length}: ${categoryChoices.map(x=>x.label).join(' | ')}`); for(const [label] of expectedCategories){if(!categoryChoices.some(x=>x.label===label))report.failures.push(`Missing expected medical category: ${label}`)}
          for(let index=0;index<inventory.length;index++){
            const meta=inventory[index]; await openBase(); const details=page.locator('#MainContent details.sq-refine-v3-group').nth(meta.gi); if(!(await details.getAttribute('open')))await details.locator(':scope > summary').click(); const input=details.locator('input[type="checkbox"]').nth(meta.ii); const beforeUrl=page.url(); let clickError=null;
            try{await Promise.all([page.waitForURL(u=>u.href!==beforeUrl,{timeout:15000}).catch(()=>null),input.click({force:true})]);await page.waitForLoadState('domcontentloaded').catch(()=>{});await ready().catch(()=>{})}catch(e){clickError=String(e)}
            const u=new URL(page.url()); const state=await page.evaluate(()=>{const main=document.querySelector('#MainContent');const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};const cards=[...main.querySelectorAll('.sq-refine-v3-results .product-grid > *')].filter(vis);const handles=[...new Set(cards.map(c=>c.querySelector('a[href*="/products/"]')?.getAttribute('href')||'').map(h=>{const m=h.match(/\/products\/([^?/#]+)/);return m?m[1]:''}).filter(Boolean))];return{ready:main?.dataset.sqRefineV3Ready||null,cards:cards.length,handles,text:main?.innerText||'',duplicate:[...main.querySelectorAll('.product-grid')].filter(g=>vis(g)&&!main.querySelector('.sq-refine-v3-results')?.contains(g)&&g.querySelector('a[href*="/products/"]')).length}}).catch(()=>({ready:null,cards:0,handles:[],text:'',duplicate:0}));
            const errors=[]; if(clickError)errors.push(`click/navigation error: ${clickError}`); if(state.ready!=='true')errors.push(`V3 not ready (${state.ready})`); if(state.duplicate)errors.push(`duplicate product grids: ${state.duplicate}`); if(forbidden.test(state.text))errors.push('State Guard builder contamination visible after selection');
            if(meta.group==='Shop by Category'){const expected=expectedCategories.get(meta.label);if(!expected)errors.push(`unexpected category label ${meta.label}`);else{if(u.pathname!==`/collections/${expected}`)errors.push(`wrong category target ${u.pathname}; expected /collections/${expected}`);if(state.cards<1)errors.push('category returned zero visible product cards');try{const products=await collectionProducts(expected);if(!products.length)errors.push('category collection has zero products');const bad=products.filter(p=>p.tags.some(t=>/^SQ Exclude:\s*Medical IFAK$/i.test(t)));if(bad.length)errors.push(`category includes explicit Medical IFAK exclusions: ${bad.map(p=>p.title).join(' | ')}`);const rootBad=products.filter(p=>!p.tags.some(t=>/^SQ Verified Medical IFAK$/i.test(t)));if(rootBad.length)errors.push(`category includes products missing SQ Verified Medical IFAK: ${rootBad.map(p=>p.title).join(' | ')}`)}catch(e){errors.push(`category taxonomy fetch failed: ${String(e)}`)}}}else{const param=meta.filterName||meta.polish;if(param&&!u.searchParams.getAll(param).includes(meta.value))errors.push(`filter URL missing ${param}=${meta.value}`);if(!param&&!meta.target)errors.push('checkbox has no target/filter metadata')}
            report.choices.push({index:index+1,...meta,url:u.href,cards:state.cards,visibleHandles:state.handles,errors}); if(errors.length){report.failures.push(`${meta.group} > ${meta.label}: ${errors.join('; ')}`);await page.screenshot({path:`out/screens/${String(index+1).padStart(3,'0')}-${safe(meta.group)}-${safe(meta.label)}.png`,fullPage:true}).catch(()=>{})}
          }
          try{const rootProducts=await collectionProducts('first-aid-medical-ifak');report.rootProductCount=rootProducts.length;report.rootExplicitExclusions=rootProducts.filter(p=>p.tags.some(t=>/^SQ Exclude:\s*Medical IFAK$/i.test(t))).map(p=>({title:p.title,handle:p.handle,tags:p.tags}));report.rootMissingVerifiedTag=rootProducts.filter(p=>!p.tags.some(t=>/^SQ Verified Medical IFAK$/i.test(t))).map(p=>({title:p.title,handle:p.handle,tags:p.tags}));if(report.rootExplicitExclusions.length)report.failures.push(`Medical root includes ${report.rootExplicitExclusions.length} products explicitly tagged SQ Exclude: Medical IFAK`);if(report.rootMissingVerifiedTag.length)report.failures.push(`Medical root includes ${report.rootMissingVerifiedTag.length} products missing SQ Verified Medical IFAK`)}catch(e){report.failures.push(`Root taxonomy fetch failed: ${String(e)}`)}
          report.runtimeErrors=runtimeErrors;if(runtimeErrors.length)report.failures.push(`Runtime page errors: ${runtimeErrors.slice(0,10).join(' | ')}`);report.finishedAt=new Date().toISOString();fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify({totalChoices:report.choices.length,rootProductCount:report.rootProductCount,rootExplicitExclusions:report.rootExplicitExclusions?.map(x=>x.title),rootMissingVerifiedTag:report.rootMissingVerifiedTag?.map(x=>x.title),failures:report.failures,choices:report.choices.map(x=>({group:x.group,label:x.label,url:x.url,cards:x.cards,errors:x.errors}))},null,2));await browser.close();if(report.failures.length)process.exitCode=2;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medical-refine-every-choice-chromium
          path: out
          retention-days: 14
