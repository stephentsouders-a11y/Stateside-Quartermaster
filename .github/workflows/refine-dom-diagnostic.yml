name: Refine DOM diagnostic
on:
  push:
    paths:
      - '.github/workflows/refine-dom-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect live Refine markup
        run: |
          cat > diagnose.mjs <<'EOF'
          import { chromium } from 'playwright';
          const routes=[
            '/collections/tactical-gear',
            '/collections/accessories-gifts-collectibles',
            '/collections/k9-dog-gear',
            '/collections/uniforms',
            '/collections/watches',
            '/collections/state-guard-series'
          ];
          const browser=await chromium.launch({headless:true});
          for(const path of routes){
            const page=await browser.newPage({viewport:{width:1365,height:900}});
            const res=await page.goto('https://www.statesideqm.com'+path,{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1200);
            const inventory=await page.locator('#MainContent input, #MainContent label, #MainContent button, #MainContent a, #MainContent [role=checkbox], #MainContent [class*=refine], #MainContent [class*=facet], #MainContent [class*=filter]').evaluateAll(es=>es.map(e=>({tag:e.tagName,type:e.getAttribute('type'),role:e.getAttribute('role'),cls:String(e.className||'').slice(0,180),text:(e.innerText||e.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim().slice(0,220),href:e.getAttribute('href'),checked:'checked' in e?e.checked:null})).filter(x=>/refine|filter|category|type|availability|shop by|chest rig|belt|helmet|flashlight|medical|footwear|glove|eyewear|knife|patch/i.test([x.cls,x.text,x.href].join(' '))).slice(0,220));
            console.log('\n=== ROUTE '+path+' status='+res?.status()+' ===');
            console.log(JSON.stringify(inventory,null,2));
            await page.close();
          }
          await browser.close();
          EOF
          node diagnose.mjs
