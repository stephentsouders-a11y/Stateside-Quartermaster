name: Dive Scuba Refine full Chromium certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/dive-scuba-refine-certification-v3.yml'
      - 'snippets/sq-refine-v3-root-cleanup.liquid'
      - 'snippets/sq-refine-v3-sidebar-header-edge-fix.liquid'
      - 'snippets/sq-refine-v3.liquid'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click every Refine choice one by one
        run: |
          mkdir -p out
          cat > dive-cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const BASE='https://www.statesideqm.com';
          const THEME='158561894555';
          const ROOT='/collections/dive-scuba';
          const rootUrl=()=>`${BASE}${ROOT}?preview_theme_id=${THEME}&sq_root=dive-scuba&sq_per_page=50`;
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
          const page=await ctx.newPage();
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));

          async function waitV3(timeout=30000){
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{}, {timeout});
            await page.waitForFunction(()=>{
              const m=document.querySelector('#MainContent');
              if(!m||!m.querySelector('.sq-refine-v3-sidebar'))return false;
              return [...m.querySelectorAll('.sq-refine-v3-results .product-grid')].some(g=>g.getBoundingClientRect().width>1&&g.getBoundingClientRect().height>1&&getComputedStyle(g).display!=='none');
            },{}, {timeout});
          }

          async function openRoot(){
            let last;
            for(let i=0;i<3;i++){
              try{
                const r=await page.goto(rootUrl(),{waitUntil:'domcontentloaded',timeout:60000});
                if(!r||r.status()>=500)throw new Error(`root HTTP ${r?.status()}`);
                await waitV3(30000);
                return;
              }catch(e){last=e; await page.waitForTimeout(800*(i+1));}
            }
            throw last;
          }

          async function snapshot(){
            return await page.evaluate(()=>{
              const isVis=e=>e&&e.getBoundingClientRect().width>1&&e.getBoundingClientRect().height>1&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden';
              const m=document.querySelector('#MainContent');
              if(!m)return {missingMain:true,url:location.href};
              const side=[...m.querySelectorAll('.sq-refine-v3-sidebar')].find(isVis);
              const groups=side?[...side.querySelectorAll(':scope > details.sq-refine-v3-group')].map((d,gi)=>({
                groupIndex:gi,
                label:(d.querySelector(':scope > summary')?.textContent||'').replace(/\s+/g,' ').trim(),
                choices:[...d.querySelectorAll('input[type=checkbox]')].map((i,ci)=>({
                  choiceIndex:ci,
                  label:(i.closest('label')?.textContent||'').replace(/\s+/g,' ').trim(),
                  kind:i.dataset.kind||'',
                  target:i.dataset.target||'',
                  filterName:i.dataset.filterName||i.name||'',
                  filterValue:i.dataset.filterValue||i.value||'',
                  checked:i.checked
                }))
              })):[];
              const grids=[...m.querySelectorAll('.sq-refine-v3-results .product-grid')].filter(isVis);
              const grid=grids.find(g=>g.classList.contains('sq-v3-authoritative-grid'))||grids[0];
              const cards=grid?[...grid.querySelectorAll(':scope > .product-grid__item')].filter(isVis).map(c=>{
                const a=c.querySelector('a[href*="/products/"]');
                return {title:(c.querySelector('.card__heading,.card-information__text,h3,h2')?.textContent||a?.textContent||'').replace(/\s+/g,' ').trim(),href:a?.href||''};
              }).filter(x=>x.href):[];
              return {
                missingMain:false,
                ready:m.dataset.sqRefineV3Ready||'',
                runtimeError:m.dataset.sqRefineV3Error||'',
                cleanup:m.dataset.sqDiveScubaCleanup||'',
                groups,
                visibleGrids:grids.length,
                cards,
                hasStateGuard:/state guard uniform builder|pt uniform checklist/i.test(m.innerText||''),
                hasDutyBelts:/\bduty belts\b/i.test(side?.innerText||''),
                hasDutyBeltProduct:cards.some(x=>{try{return new URL(x.href).pathname==='/products/duty-belt'}catch{return false}}),
                url:location.href
              };
            });
          }

          function flatten(groups){
            const out=[];
            for(const g of groups)for(const c of g.choices)out.push({...c,group:g.label,groupIndex:g.groupIndex});
            return out;
          }

          async function currentInput(spec){
            const groups=page.locator('.sq-refine-v3-sidebar > details.sq-refine-v3-group');
            const d=groups.nth(spec.groupIndex);
            await d.evaluate(el=>el.open=true);
            return d.locator('input[type=checkbox]').nth(spec.choiceIndex);
          }

          function assess(spec,snap,expectTarget=false){
            const errors=[];
            if(snap.missingMain)errors.push('MainContent missing');
            if(snap.runtimeError)errors.push('runtime '+snap.runtimeError);
            if(snap.visibleGrids!==1)errors.push(`visible grids ${snap.visibleGrids}`);
            if(!snap.cards?.length)errors.push('no visible products');
            if(snap.hasStateGuard)errors.push('State Guard contamination visible');
            if(snap.hasDutyBelts)errors.push('Duty Belts Refine contamination visible');
            if(snap.hasDutyBeltProduct)errors.push('Duty Belt product contamination visible');
            if(expectTarget&&spec.target){
              try{
                const got=new URL(snap.url).pathname;
                const wanted=new URL(spec.target,BASE).pathname;
                if(got!==wanted)errors.push(`structural target mismatch ${got} != ${wanted}`);
              }catch(e){errors.push('target URL parse failed '+e);}
            }
            return errors;
          }

          await openRoot();
          const baseline=await snapshot();
          const all=flatten(baseline.groups);
          const structural=all.filter(x=>x.kind==='structural');
          const native=all.filter(x=>x.kind!=='structural');
          const results=[];

          if(baseline.hasStateGuard)throw new Error('Baseline still contains State Guard contamination');
          if(baseline.hasDutyBelts)throw new Error('Baseline still exposes Duty Belts Refine choice');
          if(baseline.hasDutyBeltProduct)throw new Error('Baseline still exposes Duty Belt product');
          if(baseline.visibleGrids!==1)throw new Error(`Baseline visible grids ${baseline.visibleGrids}`);
          if(!baseline.cards.length)throw new Error('Baseline has no products');
          if(baseline.cleanup!=='true')throw new Error(`Dive cleanup marker missing: ${baseline.cleanup}`);

          console.log(`BASELINE choices=${all.length} structural=${structural.length} native=${native.length} products=${baseline.cards.length} cleanup=${baseline.cleanup}`);

          for(let i=0;i<structural.length;i++){
            const spec=structural[i];
            let errors=[];
            try{
              await openRoot();
              const input=await currentInput(spec);
              await input.scrollIntoViewIfNeeded();
              await input.click({timeout:12000});
              const wanted=new URL(spec.target,BASE).pathname;
              await page.waitForFunction(p=>location.pathname===p,wanted,{timeout:20000});
              await waitV3(20000);
              const snap=await snapshot();
              errors=assess(spec,snap,true);
              results.push({group:spec.group,label:spec.label,kind:spec.kind,target:spec.target,url:snap.url,products:snap.cards?.map(x=>x.title)||[],errors});
            }catch(e){
              errors.push(String(e));
              results.push({group:spec.group,label:spec.label,kind:spec.kind,target:spec.target,url:page.url(),products:[],errors});
            }
            console.log(`${errors.length?'FAIL':'PASS'} STRUCT ${i+1}/${structural.length} ${spec.label}${errors.length?' :: '+errors.join(' | '):''}`);
            if(errors.length)await page.screenshot({path:`out/fail-struct-${String(i+1).padStart(2,'0')}.png`,fullPage:true}).catch(()=>{});
          }

          for(let i=0;i<native.length;i++){
            const spec=native[i];
            let errors=[];
            try{
              await openRoot();
              const input=await currentInput(spec);
              await input.scrollIntoViewIfNeeded();
              if(await input.isChecked())throw new Error('native choice unexpectedly checked at clean root');
              await input.click({timeout:12000});
              await page.waitForFunction(({n,v})=>new URL(location.href).searchParams.getAll(n).includes(v),{n:spec.filterName,v:spec.filterValue},{timeout:20000});
              await waitV3(20000);
              const snap=await snapshot();
              errors=assess(spec,snap,false);
              const u=new URL(snap.url);
              if(!u.searchParams.getAll(spec.filterName).includes(spec.filterValue))errors.push(`filter URL missing ${spec.filterName}=${spec.filterValue}`);
              results.push({group:spec.group,label:spec.label,kind:spec.kind,filterName:spec.filterName,filterValue:spec.filterValue,url:snap.url,products:snap.cards?.map(x=>x.title)||[],errors});
            }catch(e){
              errors.push(String(e));
              results.push({group:spec.group,label:spec.label,kind:spec.kind,filterName:spec.filterName,filterValue:spec.filterValue,url:page.url(),products:[],errors});
            }
            console.log(`${errors.length?'FAIL':'PASS'} NATIVE ${i+1}/${native.length} ${spec.group} > ${spec.label}${errors.length?' :: '+errors.join(' | '):''}`);
            if(errors.length)await page.screenshot({path:`out/fail-native-${String(i+1).padStart(3,'0')}.png`,fullPage:true}).catch(()=>{});
          }

          await openRoot();
          const finalSnap=await snapshot();
          const finalErrors=assess({label:'final root'},finalSnap,false);
          if(finalSnap.cleanup!=='true')finalErrors.push('final cleanup marker missing');
          if(finalErrors.length)results.push({group:'Final',label:'Root regression check',kind:'final',url:finalSnap.url,products:finalSnap.cards?.map(x=>x.title)||[],errors:finalErrors});

          const failures=results.filter(r=>r.errors.length);
          const report={theme:THEME,root:ROOT,baseline:{cleanup:baseline.cleanup,visibleGrids:baseline.visibleGrids,products:baseline.cards.length,hasStateGuard:baseline.hasStateGuard,hasDutyBelts:baseline.hasDutyBelts,hasDutyBeltProduct:baseline.hasDutyBeltProduct},choiceCount:all.length,structuralCount:structural.length,nativeCount:native.length,pageErrors,failures,results};
          fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));
          fs.writeFileSync('out/summary.txt',`theme ${THEME}\nchoices ${all.length}\nstructural ${structural.length}\nnative ${native.length}\nbaseline_products ${baseline.cards.length}\nbaseline_state_guard_contamination ${baseline.hasStateGuard}\nbaseline_duty_belts_refine ${baseline.hasDutyBelts}\nbaseline_duty_belt_product ${baseline.hasDutyBeltProduct}\nbaseline_cleanup ${baseline.cleanup}\nfailures ${failures.length}\npage_errors ${pageErrors.length}\n`);
          await page.screenshot({path:'out/final.png',fullPage:true}).catch(()=>{});
          await ctx.close();
          await browser.close();
          if(failures.length||pageErrors.length)process.exitCode=2;
          EOF
          node dive-cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dive-scuba-refine-certification-v3
          path: out
          retention-days: 14
