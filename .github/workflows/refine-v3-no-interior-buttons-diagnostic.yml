name: Refine V3 no interior buttons diagnostic
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/refine-v3-no-interior-buttons-diagnostic.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4]
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect every V3 route before and after refine navigation
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const B='https://www.statesideqm.com',T='158561894555',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const all=['accessories-gifts-collectibles','airsoft-milsim','apparel','armed-forces-gear','art','body-armor-ballistic-protection','literature','child-safety-shop','dive-scuba','firearm-accessories','first-aid-medical-ifak','flags-patriotic-decor','flashlights-lighting','footwear-gloves-eyewear','k9-dog-gear','knives-axes-cutlery','morale-patches-tactical-id','outdoor-preparedness-gear','patriotic-american-heritage','safety-rescue-climbing','sta-brite-insignia','tactical-gear','thin-line','uniforms','watches','zippos-lighters-torches','stateside-quartermaster-logo-merch','army-national-guard-series','air-national-guard-series','products-built-for-the-line-u-s-army','products-built-for-the-line-u-s-navy','products-built-for-the-line-u-s-air-force','products-built-for-the-line-u-s-marine-corps','products-built-for-the-line-u-s-coast-guard','products-built-for-the-line-u-s-space-force','rotc-series','jrotc-series','military-schools-academies','law-enforcement-corrections','firefighting-ems-search-rescue'];
          const shard=Number(process.env.SHARD||0),routes=all.filter((_,i)=>i%5===shard);
          const browser=await chromium.launch({headless:true}),c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();
          const make=h=>{const u=new URL('/collections/'+h,B);u.searchParams.set('preview_theme_id',T);return u.toString()};
          async function settle(){await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:60000});await p.waitForSelector('#MainContent .sq-refine-v3-sidebar',{state:'visible',timeout:20000});await sleep(1000)}
          async function scan(label){const out=await p.evaluate(()=>{const m=document.querySelector('#MainContent'),layout=m?.querySelector('.sq-refine-v3-layout');const vis=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'};return [...m.querySelectorAll('section,div,nav,ul')].filter(e=>vis(e)&&!e.closest('.sq-refine-v3-sidebar,.sq-refine-v3-results,.sq-refine-v3-page-size')&&!(layout&&layout.contains(e))).map(e=>{const cs=[...e.querySelectorAll('a[href*="/collections/"]')].filter(vis),ps=e.querySelectorAll('a[href*="/products/"]').length;if(cs.length<2||ps)return null;return{tag:e.tagName,id:e.id,cls:String(e.className||''),links:cs.slice(0,12).map(a=>({text:(a.textContent||'').replace(/\s+/g,' ').trim().slice(0,80),href:a.getAttribute('href'),cls:String(a.className||'')}))}}).filter(Boolean).slice(0,30)});console.log(label,JSON.stringify(out));return out}
          let failures=0;
          for(const h of routes){try{let r=await p.goto(make(h),{waitUntil:'domcontentloaded',timeout:90000});if(r?.status()!==200)throw new Error('HTTP '+r?.status());await settle();const before=await scan('BEFORE '+h);if(before.length)failures++;const q=p.locator('.sq-refine-v3-sidebar input[data-kind="structural"][data-target^="/collections/"]').first();if(await q.count()){const target=await q.getAttribute('data-target');console.log('TARGET '+h+' '+target);await q.check({force:true}).catch(()=>{});await p.waitForLoadState('domcontentloaded',{timeout:90000}).catch(()=>{});await settle().catch(()=>{});const after=await scan('AFTER '+h);if(after.length)failures++}console.log('DONE '+h+' legacyFailures='+failures)}catch(e){failures++;console.log('ERROR '+h+' '+String(e))}await sleep(700)}
          await browser.close();if(failures)process.exitCode=1;
          EOF
          node diag.mjs
