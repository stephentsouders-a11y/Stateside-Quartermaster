name: Morale Patches exhaustive refine certification
on:
  push:
    paths:
      - '.github/workflows/morale-refine-full-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click and validate every refine option
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const BASE='https://www.statesideqm.com';
          const PATH='/collections/morale-patches-tactical-id';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
          const page=await ctx.newPage();
          page.setDefaultTimeout(15000); page.setDefaultNavigationTimeout(60000);
          const report={route:PATH,status:null,groups:[],checks:[],failures:[],consoleErrors:[],httpErrors:[]};
          page.on('console',m=>{if(m.type()==='error')report.consoleErrors.push(m.text())});
          page.on('response',r=>{if(r.status()>=400)report.httpErrors.push(`${r.status()} ${r.url()}`)});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const visibleHandles=async()=>await page.locator('#MainContent .sq-refine-taxonomy-product').evaluateAll(xs=>xs.filter(x=>{const s=getComputedStyle(x),r=x.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2}).slice(0,12).map(a=>new URL(a.href).pathname.split('/products/')[1]?.split(/[?#]/)[0]).filter(Boolean));
          try{
            const resp=await page.goto(BASE+PATH,{waitUntil:'domcontentloaded'}); report.status=resp?.status()??null;
            await page.locator('#MainContent .sq-global-refine-sidebar').first().waitFor({state:'visible',timeout:20000});
            await page.locator('#MainContent .sq-refine-taxonomy-products').first().waitFor({state:'attached',timeout:20000});
            await sleep(800);
            report.groups=await page.locator('#MainContent .sq-refine-taxonomy__group>summary').allTextContents();
            const specs=await page.locator('#MainContent .sq-refine-taxonomy input[type="checkbox"]').evaluateAll(xs=>xs.map((i,n)=>({n,value:i.value,group:i.dataset.group||'',label:(i.closest('label')?.textContent||'').replace(/\s+/g,' ').trim()})));
            for(const spec of specs){
              const box=page.locator('#MainContent .sq-refine-taxonomy input[type="checkbox"]').nth(spec.n);
              const row={...spec,checked:false,count:0,handles:[],authoritativeCount:null,outside:[],vendors:[]};
              try{
                await box.scrollIntoViewIfNeeded().catch(()=>{}); await box.check({force:true}); await sleep(650);
                row.checked=await box.isChecked().catch(()=>false); row.count=await page.locator('#MainContent .sq-refine-taxonomy-product').count(); row.handles=await visibleHandles();
                const group=String(spec.group||''); const child=String(spec.value||'');
                if(child && !/^shop by (author|publisher|war|topic|branch|color|pattern|manufacturer|artist|availability)/i.test(group)){
                  const r=await ctx.request.get(`${BASE}/collections/${encodeURIComponent(child)}/products.json?limit=250&page=1`,{timeout:20000}).catch(()=>null);
                  if(r?.ok()){
                    const j=await r.json().catch(()=>null); const auth=(j?.products||[]).map(p=>p.handle); row.authoritativeCount=auth.length; row.outside=row.handles.filter(h=>!auth.includes(h));
                  }
                }
                if(/manufacturer|artist/i.test(group) && spec.value){
                  for(const h of row.handles.slice(0,5)){
                    const r=await ctx.request.get(`${BASE}/products/${h}.js`,{timeout:15000}).catch(()=>null); if(r?.ok()){const j=await r.json().catch(()=>null); if(j?.vendor)row.vendors.push(String(j.vendor));}
                  }
                  if(row.vendors.length && row.vendors.some(v=>v.toLowerCase()!==String(spec.value).toLowerCase())) report.failures.push(`${spec.group} :: ${spec.label} returned wrong vendor ${row.vendors.join(', ')}`);
                }
                if(!row.checked) report.failures.push(`${spec.group} :: ${spec.label} would not remain checked`);
                if(row.count===0) report.failures.push(`${spec.group} :: ${spec.label} returned zero products`);
                if(row.outside.length) report.failures.push(`${spec.group} :: ${spec.label} returned products outside selected destination: ${row.outside.join(', ')}`);
              }catch(e){report.failures.push(`${spec.group} :: ${spec.label} interaction error: ${String(e).split('\n')[0]}`)}
              finally{await box.uncheck({force:true}).catch(()=>{}); await sleep(250);}
              report.checks.push(row); console.log(`CHECK ${report.checks.length}/${specs.length} ${spec.group} :: ${spec.label} => ${row.count}`);
            }
            const selected=await page.locator('#MainContent .sq-refine-taxonomy input[type="checkbox"]:checked').count(); if(selected)report.failures.push(`${selected} filters remained checked after audit`);
            if(report.status!==200)report.failures.push(`HTTP ${report.status}`);
          }catch(e){report.failures.push(`fatal: ${String(e).split('\n')[0]}`)}
          fs.writeFileSync('morale-refine-report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          process.exit(report.failures.length?1:0);
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morale-refine-report
          path: morale-refine-report.json
