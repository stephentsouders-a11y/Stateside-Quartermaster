name: Sep12 no availability leak v1
on:
  push:
    paths:
      - '.github/workflows/sep12-no-availability-leak-v1.yml'
      - 'sections/**'
      - 'snippets/**'
permissions:
  contents: read
jobs:
  availability-leak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify candidate theme exposes no forced availability filters
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const routes=['/collections/state-guard-series','/collections/state-guard-series-ohio','/collections/products-built-for-the-line-u-s-army','/collections/army-national-guard-series','/collections/products-built-for-the-line-u-s-air-force','/collections/air-national-guard-series','/collections/thin-line','/collections/sta-brite-insignia'];
          const browser=await chromium.launch({headless:true});
          const out=[];
          for(const route of routes){
            const ctx=await browser.newContext({viewport:{width:1365,height:900}}); const page=await ctx.newPage();
            const u=new URL(route,process.env.BASE);u.searchParams.set('preview_theme_id',process.env.THEME);
            const rec={route,leaks:[],activeAvailability:false};
            try{
              await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:35000}); await page.waitForTimeout(2500);
              rec.leaks=await page.locator('#MainContent a[href*="filter.v.availability"],#MainContent form[action*="filter.v.availability"]').evaluateAll(es=>es.map(e=>({tag:e.tagName,text:(e.innerText||'').replace(/\s+/g,' ').trim().slice(0,120),href:e.href||e.getAttribute('action')})).slice(0,100)).catch(()=>[]);
              rec.activeAvailability=await page.evaluate(()=>new URL(location.href).searchParams.has('filter.v.availability')).catch(()=>false);
              rec.fail=rec.leaks.length>0||rec.activeAvailability;
            }catch(e){rec.fail=true;rec.error=String(e)}
            out.push(rec);await ctx.close();
          }
          await browser.close();fs.writeFileSync('availability-leak-results.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));if(out.some(x=>x.fail))process.exitCode=2;
          EOF
          node check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: availability-leak-results
          path: availability-leak-results.json
          retention-days: 7
