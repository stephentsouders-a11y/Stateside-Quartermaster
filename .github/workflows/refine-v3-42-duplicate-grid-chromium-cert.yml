name: Refine V3 42-route Chromium certification
on:
  push:
    paths:
      - '.github/workflows/refine-v3-42-duplicate-grid-chromium-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-restart-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run hardened storefront certification
        run: |
          mkdir -p out/screens out/videos
          cat > cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const BASE='https://www.statesideqm.com';
          const THEME='158561894555';
          const routes=[
            ['Accessories','/collections/accessories-gifts-collectibles','v3'],
            ['Airsoft','/collections/airsoft-milsim','v3'],
            ['Apparel','/collections/apparel','v3'],
            ['Armed Forces Gear','/collections/armed-forces-gear','v3'],
            ['Armored Vehicles','/pages/armored-vehicles-purchase-inquiry','legacy'],
            ['Art','/collections/art','v3'],
            ['Body Armor','/collections/body-armor-ballistic-protection','v3'],
            ['Books','/collections/literature','v3'],
            ['Child Safety','/collections/child-safety-shop','v3'],
            ['DIVE / SCUBA','/collections/dive-scuba','v3'],
            ['Firearm Accessories','/collections/firearm-accessories','v3'],
            ['First Aid','/collections/first-aid-medical-ifak','v3'],
            ['Flags','/collections/flags-patriotic-decor','v3'],
            ['Flashlights','/collections/flashlights-lighting','v3'],
            ['Footwear','/collections/footwear-gloves-eyewear','v3'],
            ['K9','/collections/k9-dog-gear','v3'],
            ['Knives','/collections/knives-axes-cutlery','v3'],
            ['Morale Patches','/collections/morale-patches-tactical-id','v3'],
            ['Outdoor','/collections/outdoor-preparedness-gear','v3'],
            ['Patriotic','/collections/patriotic-american-heritage','v3'],
            ['Safety Rescue','/collections/safety-rescue-climbing','v3'],
            ['Sta-Brite','/collections/sta-brite-insignia','v3'],
            ['Tactical Gear','/collections/tactical-gear','v3'],
            ['Thin Line','/collections/thin-line','v3'],
            ['Uniforms','/collections/uniforms','v3'],
            ['Watches','/collections/watches','v3'],
            ['Lighters','/collections/zippos-lighters-torches','v3'],
            ['Logo Merch','/collections/stateside-quartermaster-logo-merch','v3'],
            ['Army National Guard','/collections/army-national-guard-series','v3'],
            ['Air National Guard','/collections/air-national-guard-series','v3'],
            ['State Guard','/collections/state-guard-series','state'],
            ['U.S. Army','/collections/products-built-for-the-line-u-s-army','v3'],
            ['U.S. Navy','/collections/products-built-for-the-line-u-s-navy','v3'],
            ['U.S. Air Force','/collections/products-built-for-the-line-u-s-air-force','v3'],
            ['U.S. Marines','/collections/products-built-for-the-line-u-s-marine-corps','v3'],
            ['U.S. Coast Guard','/collections/products-built-for-the-line-u-s-coast-guard','v3'],
            ['U.S. Space Force','/collections/products-built-for-the-line-u-s-space-force','v3'],
            ['ROTC','/collections/rotc-series','v3'],
            ['JROTC','/collections/jrotc-series','v3'],
            ['Military Schools & Academies','/collections/military-schools-academies','v3'],
            ['Law Enforcement & Corrections','/collections/law-enforcement-corrections','v3'],
            ['Firefighting, EMS & SAR','/collections/firefighting-ems-search-rescue','v3']
          ];
          const colorRoutes=new Set([
            '/collections/body-armor-ballistic-protection','/collections/child-safety-shop',
            '/collections/footwear-gloves-eyewear','/collections/k9-dog-gear',
            '/collections/morale-patches-tactical-id','/collections/patriotic-american-heritage',
            '/collections/safety-rescue-climbing','/collections/tactical-gear','/collections/uniforms'
          ]);
          const viewports=[['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]];
          const browser=await chromium.launch({headless:true});
          const report={theme:THEME,generatedAt:new Date().toISOString(),routes:[],thinLineCold:[],failures:[]};
          const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
          const visibleFn=`el=>{if(!el)return false;const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0}`;

          function normalizeLabel(s){return String(s||'').toLowerCase().replace(/manufacturers?/g,'manufacturer').replace(/shop by /g,'').replace(/\s+/g,' ').trim()}
          function routeFailures(row){
            const f=[]; const a=row.audit||{};
            if(row.status!==200)f.push(`HTTP ${row.status}`);
            if(row.navigationError)f.push(`navigation ${row.navigationError}`);
            if(row.pageErrors?.length)f.push(`pageerror ${row.pageErrors[0]}`);
            if(row.type==='legacy')return f;
            if(row.type==='state'){
              if(!a.main)f.push('MainContent missing');
              if(!a.sidebarCount)f.push('State Guard refine sidebar missing');
              if(a.legacyPaints?.length)f.push(`legacy navigation painted at ${a.legacyPaints[0].t}ms`);
              return f;
            }
            if(a.sidebarCount!==1)f.push(`visible V3 sidebars ${a.sidebarCount}`);
            if(a.productGridCount!==1)f.push(`product-bearing visible grids ${a.productGridCount}`);
            if(a.cards<1)f.push('no visible product cards');
            if(a.duplicateHandles?.length)f.push(`duplicate cards ${a.duplicateHandles.slice(0,5).join(',')}`);
            const expected=Math.min(row.device==='desktop'?3:2,a.cards||0);
            if(expected&&a.firstRowCount!==expected)f.push(`${row.device} first row ${a.firstRowCount}, expected ${expected}`);
            if(!['50','100','250'].every(x=>a.pageSizes?.includes(x)))f.push(`page sizes ${JSON.stringify(a.pageSizes||[])}`);
            if(a.sidebarBg!=='rgb(255, 255, 255)')f.push(`sidebar body ${a.sidebarBg}`);
            if(a.titleBg!=='rgb(8, 40, 63)'||String(a.title||'').trim().toUpperCase()!=='REFINE PRODUCTS'||a.titleRightGap>2)f.push('Refine header edge/color');
            if(a.legacyPaints?.length)f.push(`legacy navigation painted at ${a.legacyPaints[0].t}ms: ${a.legacyPaints[0].selector}`);
            if(row.usableMs==null||row.usableMs>3500)f.push(`usable ${row.usableMs==null?'timeout':row.usableMs+'ms'}`);
            if(a.fcp!=null&&a.fcp>2500)f.push(`FCP ${Math.round(a.fcp)}ms`);
            const labels=(a.summaries||[]).map(normalizeLabel);
            const has=x=>labels.some(y=>y===x||y.startsWith(x));
            if(!has('type'))f.push('missing Shop by Type');
            if(row.path==='/collections/armed-forces-gear'){
              const allowed=new Set(['branch','availability','type']);
              if(labels.length!==3||labels.some(x=>!allowed.has(x))||![...allowed].every(x=>labels.includes(x)))f.push(`AFG filters ${a.summaries?.join(' | ')}`);
            }
            if(row.path==='/collections/apparel'){
              const need=['category','type','manufacturer / artist','availability'];
              if(labels.length!==4||!need.every(x=>labels.includes(x)))f.push(`Apparel filters ${a.summaries?.join(' | ')}`);
            }
            if(row.path==='/collections/literature'){
              for(const req of ['author','publisher','branch','topic'])if(!has(req))f.push(`Books missing ${req}`);
              if(!labels.some(x=>/^war( \/ (era \/ )?conflict)?$/.test(x)||x.startsWith('war / conflict')))f.push('Books missing War / Conflict');
            }
            if(row.path==='/collections/firearm-accessories'&&!labels.some(x=>x.includes('firearm make / model')||x==='make / model'))f.push('Firearm Make / Model missing');
            if(colorRoutes.has(row.path)){
              if(!labels.some(x=>x==='color / pattern'||x==='color' || x==='pattern'))f.push('Shop by Color / Pattern missing');
              if(a.colorInputs<1)f.push('Color / Pattern has no loaded checkboxes');
            }
            return f;
          }

          async function addInit(page){
            await page.addInitScript(()=>{
              window.__sqLegacyPaints=[];
              window.__sqLcp=null;
              try{new PerformanceObserver(list=>{for(const e of list.getEntries())window.__sqLcp=e.startTime}).observe({type:'largest-contentful-paint',buffered:true})}catch{}
              const selectors=['[class*="button-tree"]','[class*="root-categories"]','[class*="subcategory"]','[class*="third-level"]','[class*="branch-grid"]','[class*="type-grid"]','[class*="program-tree"]','[class*="category-grid"]','[class*="navigation-grid"]'];
              const vis=el=>{if(!el)return false;const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0};
              let pending=false;
              const sample=()=>{pending=false;for(const sel of selectors){for(const el of document.querySelectorAll(sel)){if(el.closest('.sq-refine-v3-sidebar,.sq-refine-v3-results'))continue;if(vis(el)){window.__sqLegacyPaints.push({t:Math.round(performance.now()),selector:sel,text:(el.innerText||'').replace(/\s+/g,' ').trim().slice(0,120)});return}}}};
              const schedule=()=>{if(!pending){pending=true;requestAnimationFrame(sample)}};
              new MutationObserver(schedule).observe(document,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','hidden']});
              requestAnimationFrame(sample);[75,150,250,500,750,1000,1500,2000,3000].forEach(t=>setTimeout(sample,t));
            });
          }

          async function auditRoute(name,path,type,device,viewport){
            const videoDir='out/videos';
            const context=await browser.newContext({viewport,recordVideo:{dir:videoDir,size:viewport}});
            const page=await context.newPage(); await addInit(page);
            const pageErrors=[],requestFailures=[],serverErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>{try{const u=new URL(r.url());if(u.hostname.endsWith('statesideqm.com'))requestFailures.push(`${r.method()} ${u.pathname}: ${r.failure()?.errorText||'failed'}`)}catch{}});
            page.on('response',r=>{try{const u=new URL(r.url());if(u.hostname.endsWith('statesideqm.com')&&r.status()>=500)serverErrors.push(`${r.status()} ${u.pathname}`)}catch{}});
            const url=new URL(path,BASE);url.searchParams.set('preview_theme_id',THEME);
            const started=Date.now(); let status=null,navigationError=null,usableMs=null;
            try{
              const res=await page.goto(url.toString(),{waitUntil:'domcontentloaded',timeout:90000});status=res?.status()??null;
              const ready=()=>page.evaluate((kind)=>{
                const vis=el=>{if(!el)return false;const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0};
                const main=document.querySelector('#MainContent');if(!main)return false;
                if(kind==='legacy')return true;
                const side=[...main.querySelectorAll('.sq-refine-v3-sidebar,.sq-global-refine-sidebar')].find(vis);
                if(kind==='state')return !!side;
                const grids=[...main.querySelectorAll('.product-grid')].filter(g=>vis(g)&&[...g.querySelectorAll(':scope > .product-grid__item')].some(c=>vis(c)&&c.querySelector('a[href*="/products/"]')));
                return !!side&&grids.length>0;
              },type);
              const deadline=Date.now()+30000;
              while(Date.now()<deadline){if(await ready()){usableMs=Date.now()-started;break}await page.waitForTimeout(100)}
              await page.waitForTimeout(650);
            }catch(e){navigationError=String(e)}

            let colorInputs=0;
            if(type==='v3'&&colorRoutes.has(path)){
              const details=page.locator('#MainContent .sq-refine-v3-sidebar details').filter({has:page.locator('summary', {hasText:/Color \/ Pattern|Color|Pattern/i})}).first();
              if(await details.count()){
                if(!(await details.getAttribute('open')))await details.locator('summary').click().catch(()=>{});
                await page.waitForTimeout(1000);
                colorInputs=await details.locator('input[type="checkbox"]').count().catch(()=>0);
              }
            }

            const audit=await page.evaluate((colorInputs)=>{
              const main=document.querySelector('#MainContent');
              const vis=el=>{if(!el)return false;const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0};
              const sidebars=main?[...main.querySelectorAll('.sq-refine-v3-sidebar')].filter(vis):[];
              const side=sidebars[0]||null,title=side?.querySelector('.sq-refine-v3-sidebar__title');
              const sr=side?.getBoundingClientRect(),tr=title?.getBoundingClientRect();
              const grids=main?[...main.querySelectorAll('.product-grid')].filter(g=>vis(g)&&[...g.querySelectorAll(':scope > .product-grid__item')].some(c=>vis(c)&&c.querySelector('a[href*="/products/"]'))):[];
              const preferred=grids.find(g=>g.closest('.sq-refine-v3-results'))||grids[0]||null;
              const cards=preferred?[...preferred.querySelectorAll(':scope > .product-grid__item')].filter(c=>vis(c)&&c.querySelector('a[href*="/products/"]')):[];
              const handles=cards.map(c=>{const a=c.querySelector('a[href*="/products/"]');try{return new URL(a.href,location.origin).pathname.match(/^\/products\/([^/?#]+)/)?.[1]||''}catch{return''}}).filter(Boolean);
              const seen=new Set(),dups=[];for(const h of handles){if(seen.has(h)&&!dups.includes(h))dups.push(h);seen.add(h)}
              const rects=cards.slice(0,12).map(c=>c.getBoundingClientRect());const firstRowCount=rects.length?rects.filter(r=>Math.abs(r.top-rects[0].top)<4).length:0;
              const summaries=side?[...side.querySelectorAll(':scope > details > summary')].map(s=>(s.textContent||'').replace(/\s+/g,' ').trim()):[];
              const pageSizes=[...document.querySelectorAll('#MainContent .sq-refine-v3-page-size input,#MainContent .sq-refine-v3-page-size select option')].map(x=>x.value).filter(Boolean);
              const paints=performance.getEntriesByType('paint');const fcp=paints.find(x=>x.name==='first-contentful-paint')?.startTime??null;
              return {main:!!main,sidebarCount:sidebars.length,sidebarBg:side?getComputedStyle(side).backgroundColor:null,title:(title?.textContent||'').trim(),titleBg:title?getComputedStyle(title).backgroundColor:null,titleRightGap:sr&&tr?Math.max(0,sr.right-tr.right):999,productGridCount:grids.length,cards:cards.length,firstRowCount,duplicateHandles:dups,pageSizes:[...new Set(pageSizes)],summaries,colorInputs,legacyPaints:(window.__sqLegacyPaints||[]).slice(0,5),fcp,lcp:window.__sqLcp??null};
            },colorInputs).catch(e=>({evalError:String(e),colorInputs}));
            const row={name,path,type,device,status,navigationError,usableMs,pageErrors,requestFailures:requestFailures.slice(0,10),serverErrors:serverErrors.slice(0,10),audit};
            row.failures=routeFailures(row); report.routes.push(row); row.failures.forEach(x=>report.failures.push(`${device}/${name}: ${x}`));
            const shot=`out/screens/${String(routes.findIndex(r=>r[1]===path)+1).padStart(2,'0')}-${slug(name)}-${device}.png`;
            await page.screenshot({path:shot,fullPage:false}).catch(()=>{});
            const video=page.video(); await page.close().catch(()=>{}); const vp=video?await video.path().catch(()=>null):null; await context.close().catch(()=>{});
            if(vp){const keep=name==='Thin Line'||row.failures.length;if(keep){try{fs.renameSync(vp,`out/videos/${slug(name)}-${device}.webm`)}catch{}}else{try{fs.unlinkSync(vp)}catch{}}}
            console.log(`${row.failures.length?'FAIL':'PASS'} ${device} ${name} usable=${usableMs} fcp=${audit.fcp==null?'n/a':Math.round(audit.fcp)} grids=${audit.productGridCount??'n/a'} cards=${audit.cards??'n/a'}${row.failures.length?' :: '+row.failures.join(' | '):''}`);
          }

          for(const [device,viewport] of viewports){for(const [name,path,type] of routes)await auditRoute(name,path,type,device,viewport)}

          // Two additional cold Chromium samples for Thin Line to catch intermittent delays.
          for(let i=0;i<2;i++){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});const page=await context.newPage();await addInit(page);const u=`${BASE}/collections/thin-line?preview_theme_id=${THEME}`;const started=Date.now();let usableMs=null,status=null;
            try{const r=await page.goto(u,{waitUntil:'domcontentloaded',timeout:90000});status=r?.status()??null;const deadline=Date.now()+30000;while(Date.now()<deadline){const ok=await page.evaluate(()=>{const vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'};const m=document.querySelector('#MainContent');return !!m&&[...m.querySelectorAll('.sq-refine-v3-sidebar')].some(vis)&&[...m.querySelectorAll('.product-grid')].some(g=>vis(g)&&[...g.querySelectorAll(':scope > .product-grid__item')].some(c=>vis(c)&&c.querySelector('a[href*="/products/"]')))});if(ok){usableMs=Date.now()-started;break}await page.waitForTimeout(100)}}catch{}
            const metrics=await page.evaluate(()=>({fcp:performance.getEntriesByType('paint').find(x=>x.name==='first-contentful-paint')?.startTime??null,legacy:(window.__sqLegacyPaints||[]).slice(0,3)})).catch(()=>({}));report.thinLineCold.push({sample:i+2,status,usableMs,...metrics});await context.close();
          }
          await browser.close();
          const thinPrimary=report.routes.find(r=>r.name==='Thin Line'&&r.device==='desktop');if(thinPrimary)report.thinLineCold.unshift({sample:1,status:thinPrimary.status,usableMs:thinPrimary.usableMs,fcp:thinPrimary.audit?.fcp??null,legacy:thinPrimary.audit?.legacyPaints||[]});
          const vals=report.thinLineCold.map(x=>x.usableMs).filter(Number.isFinite).sort((a,b)=>a-b);report.thinLineMedianUsable=vals.length?vals[Math.floor(vals.length/2)]:null;
          report.pass=report.failures.length===0;
          fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));
          fs.writeFileSync('out/summary.txt',`routes=${routes.length}\nchecks=${report.routes.length}\nfailures=${report.failures.length}\nthinLineMedianUsable=${report.thinLineMedianUs}\npass=${report.pass}\n`);
          console.log('SUMMARY '+JSON.stringify({routes:routes.length,checks:report.routes.length,failures:report.failures.length,thinLineMedianUsable:report.thinLineMedianUs,pass:report.pass}));
          if(!report.pass)process.exit(2);
          EOF
          node cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-42-chromium-cert
          path: out
          retention-days: 14
