name: Refine V3 42-route duplicate-grid Chromium certification
on:
  push:
    paths:
      - '.github/workflows/refine-v3-42-duplicate-grid-chromium-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-restart-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run storefront certification
        run: |
          mkdir -p out/videos out/screens
          cat > cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const routes = [
            '/collections/accessories-gifts-collectibles','/collections/airsoft-milsim','/collections/apparel','/collections/armed-forces-gear','/pages/armored-vehicles-purchase-inquiry','/collections/art','/collections/body-armor-ballistic-protection','/collections/literature','/collections/child-safety-shop','/collections/dive-scuba','/collections/firearm-accessories','/collections/first-aid-medical-ifak','/collections/flags-patriotic-decor','/collections/flashlights-lighting','/collections/footwear-gloves-eyewear','/collections/k9-dog-gear','/collections/knives-axes-cutlery','/collections/morale-patches-tactical-id','/collections/outdoor-preparedness-gear','/collections/patriotic-american-heritage','/collections/safety-rescue-climbing','/collections/sta-brite-insignia','/collections/tactical-gear','/collections/thin-line','/collections/uniforms','/collections/watches','/collections/zippos-lighters-torches','/collections/stateside-quartermaster-logo-merch','/collections/army-national-guard-series','/collections/air-national-guard-series','/collections/state-guard-series','/collections/products-built-for-the-line-u-s-army','/collections/products-built-for-the-line-u-s-navy','/collections/products-built-for-the-line-u-s-air-force','/collections/products-built-for-the-line-u-s-marine-corps','/collections/products-built-for-the-line-u-s-coast-guard','/collections/products-built-for-the-line-u-s-space-force','/collections/rotc-series','/collections/jrotc-series','/collections/military-schools-academies','/collections/law-enforcement-corrections','/collections/firefighting-ems-search-rescue'
          ];
          const base='https://www.statesideqm.com';
          const theme='158561894555';
          const browser=await chromium.launch({headless:true});
          const report=[];
          const slug=s=>s.replace(/^\//,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'');
          const collectionPath=p=>p.startsWith('/collections/');
          for (const path of routes) {
            const name=slug(path);
            const context=await browser.newContext({viewport:{width:1440,height:1000},recordVideo:{dir:'out/videos',size:{width:1440,height:1000}}});
            const page=await context.newPage();
            const pageErrors=[], consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{ if(m.type()==='error' && !/shop\.app|favicon/i.test(m.text())) consoleErrors.push(m.text()) });
            const url=`${base}${path}${path.includes('?')?'&':'?'}preview_theme_id=${theme}`;
            let status=null, navError=null;
            try { const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000}); status=r?.status()??null; }
            catch(e){ navError=String(e); }
            await page.waitForTimeout(6500);
            const maxH=Math.min(await page.evaluate(()=>document.documentElement.scrollHeight).catch(()=>0),70000);
            for(let y=0;y<maxH;y+=900){ await page.evaluate(v=>scrollTo(0,v),y).catch(()=>{}); await page.waitForTimeout(55); }
            await page.waitForTimeout(1200);
            const state=await page.evaluate((isCollection)=>{
              const main=document.querySelector('#MainContent');
              const visible=e=>{ if(!e)return false; const s=getComputedStyle(e),r=e.getBoundingClientRect(); return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>2&&r.height>2; };
              const anchors=main?[...main.querySelectorAll('a[href*="/products/"]')].filter(visible):[];
              const handles=anchors.map(a=>{ try { const m=new URL(a.href,location.origin).pathname.match(/^\/products\/([^/?#]+)/); return m?decodeURIComponent(m[1]):'' } catch { return '' } }).filter(Boolean);
              const unique=[...new Set(handles)];
              const counts={}; handles.forEach(h=>counts[h]=(counts[h]||0)+1);
              const duplicateHandles=Object.entries(counts).filter(([,n])=>n>1).sort((a,b)=>b[1]-a[1]).slice(0,30);
              const productCards=main?[...main.querySelectorAll('[data-product-id], [data-product-handle], .product-grid__item')].filter(visible):[];
              const cardKeys=productCards.map(c=>c.getAttribute('data-product-id')||c.getAttribute('data-product-handle')||c.querySelector('a[href*="/products/"]')?.getAttribute('href')||'').filter(Boolean);
              const cardDup=[...new Set(cardKeys.filter((x,i)=>cardKeys.indexOf(x)!==i))];
              const visibleGrids=main?[...main.querySelectorAll('.product-grid,#product-grid,collection-component')].filter(visible).length:0;
              const sidebar=!!(main&&[...main.querySelectorAll('.sq-global-refine-sidebar,.sq-refine-v3-sidebar')].some(visible));
              const pageSizes=[...document.querySelectorAll('.sq-refine-v3-page-size input,.sq-refine-v3-page-size select option')].map(x=>x.value).filter(Boolean);
              const zippoText='(12 Cans) Zippo Lighter Fluid';
              const zippoOccurrences=(document.body.innerText.match(new RegExp(zippoText.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length;
              return {main:!!main,visibleProductAnchors:handles.length,uniqueProductHandles:unique.length,duplicateHandles,cardCount:cardKeys.length,duplicateCardKeys:cardDup.slice(0,30),visibleGrids,sidebar,pageSizes:[...new Set(pageSizes)],zippoOccurrences,isCollection};
            },collectionPath(path)).catch(e=>({evalError:String(e)}));
            await page.screenshot({path:`out/screens/${name}.png`,fullPage:false}).catch(()=>{});
            const video=page.video();
            await page.close().catch(()=>{});
            const videoPath=video?await video.path().catch(()=>null):null;
            if(videoPath){ try{ fs.renameSync(videoPath,`out/videos/${name}.webm`);}catch{} }
            await context.close().catch(()=>{});
            report.push({path,url,status,navError,pageErrors,consoleErrors:consoleErrors.slice(0,20),state});
          }
          await browser.close();
          fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));
          const failures=[];
          for(const r of report){
            if(r.status!==200) failures.push(`${r.path}: HTTP ${r.status}`);
            if(r.navError) failures.push(`${r.path}: nav ${r.navError}`);
            if(r.pageErrors.length) failures.push(`${r.path}: pageerror ${r.pageErrors[0]}`);
            if(r.state?.duplicateCardKeys?.length) failures.push(`${r.path}: duplicate card keys ${r.state.duplicateCardKeys.slice(0,5).join(',')}`);
            if(r.path==='/collections/zippos-lighters-torches' && r.state?.zippoOccurrences>1) failures.push(`${r.path}: Zippo regression text occurs ${r.state.zippoOccurrences} times`);
            if(r.state?.isCollection && !r.state?.sidebar) failures.push(`${r.path}: Refine sidebar missing`);
            if(r.state?.isCollection && r.state?.pageSizes?.length && !['50','100','250'].every(x=>r.state.pageSizes.includes(x))) failures.push(`${r.path}: page-size controls incomplete ${JSON.stringify(r.state.pageSizes)}`);
          }
          fs.writeFileSync('out/failures.txt',failures.join('\n'));
          console.log(JSON.stringify(report,null,2));
          if(failures.length){ console.error('\nFAILURES\n'+failures.join('\n')); process.exit(2); }
          EOF
          node cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-42-duplicate-grid-chromium-cert
          path: out
          retention-days: 7
