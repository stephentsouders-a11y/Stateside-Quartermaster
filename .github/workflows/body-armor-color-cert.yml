name: Body Armor Color Pattern Chromium Cert
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/body-armor-color-cert.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify Body Armor color pattern behavior
        run: |
          cat > cert.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const base='https://www.statesideqm.com/collections/body-armor-ballistic-protection?preview_theme_id=158561894555';
          const needed=['Black','Coyote','MultiCam / OCP','OD / Olive Green','Ranger Green'];
          const reports=[];
          async function ready(page,filtered=false){
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqUniformColorReady==='true'&&window.__sqUniformColor?.ready===true,{timeout:90000});
            if(filtered)await page.waitForFunction(()=>document.documentElement.classList.contains('sq-ucp-filtered'),{timeout:30000});
          }
          async function openDetails(locator){
            const details=locator.locator('xpath=ancestor::details[1]');
            if(await details.count() && !(await details.getAttribute('open')))await details.locator(':scope > summary').click();
          }
          async function certify(name,viewport){
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            const pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const r=await page.goto(base,{waitUntil:'domcontentloaded',timeout:90000});
            await ready(page);
            const before=await page.evaluate(()=>{const g=document.querySelector('[data-sq-ucp-group]'),u=new URL(location.href);return{heading:g?.querySelector('summary')?.textContent?.trim(),choices:window.__sqUniformColor?.choices||[],total:window.__sqUniformColor?.total||0,root:u.searchParams.get('sq_root'),path:u.pathname,nativeCards:document.querySelectorAll('.sq-refine-v3-results collection-component .product-grid > .product-grid__item').length}});
            const colorGroup=page.locator('[data-sq-ucp-group]');
            await openDetails(colorGroup);
            const black=colorGroup.locator('label').filter({hasText:/^Black\s*\(/}).locator('input');
            if(await black.count()!==1)throw Error(name+': Black choice missing or duplicated');
            await Promise.all([page.waitForNavigation({waitUntil:'domcontentloaded',timeout:90000}),black.check()]);
            await ready(page,true);
            const filtered=await page.evaluate(()=>{const u=new URL(location.href);return{params:u.searchParams.getAll('sq_ucp'),root:u.searchParams.get('sq_root'),path:u.pathname,matches:window.__sqUniformColor?.matches||0,cards:document.querySelectorAll('[data-sq-ucp-results] .product-grid__item').length,checked:[...document.querySelectorAll('[data-sq-ucp-group] input:checked')].map(i=>i.value),pageSize:window.__sqUniformColor?.pageSize}});
            const pageSize100=page.locator('.sq-refine-v3-page-size input[value="100"], .sq-refine-v3-page-size a').filter({hasText:/100/}).first();
            let size100={tested:false};
            if(await pageSize100.count()){
              size100.tested=true;
              if((await pageSize100.getAttribute('type'))==='radio')await Promise.all([page.waitForNavigation({waitUntil:'domcontentloaded',timeout:90000}),pageSize100.check()]);
              else await Promise.all([page.waitForNavigation({waitUntil:'domcontentloaded',timeout:90000}),pageSize100.click()]);
              await ready(page,true);
              size100=await page.evaluate(()=>({tested:true,param:new URL(location.href).searchParams.get('sq_per_page'),pageSize:window.__sqUniformColor?.pageSize,cards:document.querySelectorAll('[data-sq-ucp-results] .product-grid__item').length}));
            }
            const structural=page.locator('.sq-refine-v3-sidebar input[data-kind="structural"][data-target]').first();
            let structuralResult={tested:false};
            if(await structural.count()){
              await openDetails(structural);
              const target=await structural.getAttribute('data-target');
              await Promise.all([page.waitForNavigation({waitUntil:'domcontentloaded',timeout:90000}),structural.check()]);
              await ready(page,true);
              const child=await page.evaluate(()=>{const u=new URL(location.href);return{path:u.pathname,root:u.searchParams.get('sq_root'),colors:u.searchParams.getAll('sq_ucp'),matches:window.__sqUniformColor?.matches||0}});
              const selectedStructural=page.locator('.sq-refine-v3-sidebar input[data-kind="structural"]:checked').first();
              if(await selectedStructural.count()){
                await openDetails(selectedStructural);
                await Promise.all([page.waitForNavigation({waitUntil:'domcontentloaded',timeout:90000}),selectedStructural.uncheck()]);
                await ready(page,true);
              }
              const returned=await page.evaluate(()=>{const u=new URL(location.href);return{path:u.pathname,root:u.searchParams.get('sq_root'),colors:u.searchParams.getAll('sq_ucp')}});
              structuralResult={tested:true,target,child,returned};
            }
            if(new URL(page.url()).pathname!=='/collections/body-armor-ballistic-protection')await page.goto(base+'&sq_ucp=black',{waitUntil:'domcontentloaded',timeout:90000});
            await ready(page,true);
            const checked=page.locator('[data-sq-ucp-group] input[value="black"]');
            await openDetails(checked);
            await Promise.all([page.waitForNavigation({waitUntil:'domcontentloaded',timeout:90000}),checked.uncheck()]);
            await ready(page);
            const cleared=await page.evaluate(()=>{const u=new URL(location.href);return{params:u.searchParams.getAll('sq_ucp'),root:u.searchParams.get('sq_root'),path:u.pathname,filtered:document.documentElement.classList.contains('sq-ucp-filtered'),nativeCards:document.querySelectorAll('.sq-refine-v3-results collection-component .product-grid > .product-grid__item').length}});
            const labels=before.choices.map(x=>x.label);
            const structuralOk=!structuralResult.tested||(structuralResult.child.path!=='/collections/uniforms'&&structuralResult.child.colors.includes('black')&&structuralResult.returned.path==='/collections/body-armor-ballistic-protection'&&structuralResult.returned.path!=='/collections/uniforms'&&structuralResult.returned.colors.includes('black')&&structuralResult.returned.root!=='uniforms');
            const sizeOk=!size100.tested||(size100.param==='100'&&size100.pageSize===100&&size100.cards>0);
            const ok=r.status()===200&&pageErrors.length===0&&before.heading==='Shop by Color / Pattern'&&before.total>0&&before.nativeCards>0&&needed.every(x=>labels.includes(x))&&before.root===null&&filtered.params.includes('black')&&filtered.root===null&&filtered.path==='/collections/body-armor-ballistic-protection'&&filtered.matches>0&&filtered.cards>0&&filtered.checked.includes('black')&&sizeOk&&structuralOk&&cleared.params.length===0&&cleared.root===null&&cleared.path==='/collections/body-armor-ballistic-protection'&&!cleared.filtered&&cleared.nativeCards>0;
            const report={name,viewport,http:r.status(),pageErrors,consoleErrors,before,filtered,size100,structuralResult,cleared,ok};
            reports.push(report);
            await page.screenshot({path:`body-armor-color-${name}.png`,fullPage:true});
            await context.close();
          }
          try{
            await certify('desktop',{width:1440,height:1000});
            await certify('mobile',{width:390,height:844});
          }catch(e){reports.push({fatal:String(e?.stack||e),ok:false})}
          const ok=reports.length===2&&reports.every(r=>r.ok);
          fs.writeFileSync('body-armor-color-report.json',JSON.stringify({ok,reports},null,2));
          console.log('BODY_ARMOR_COLOR_CERT '+JSON.stringify({ok,reports}));
          await browser.close();
          if(!ok)process.exit(1);
          JS
          node cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: body-armor-color-cert
          path: |
            body-armor-color-report.json
            body-armor-color-desktop.png
            body-armor-color-mobile.png
          if-no-files-found: ignore
          retention-days: 7
