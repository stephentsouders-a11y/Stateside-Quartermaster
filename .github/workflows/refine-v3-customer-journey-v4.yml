name: Refine V3 customer journey v4
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-customer-journey-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-journey-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run corrected customer journey v4
        run: |
          cat > customer-v4.mjs <<'EOF'
          import { chromium } from 'playwright';
          const BASE='https://www.statesideqm.com',THEME='158561894555';
          const routes=[['Accessories','/collections/accessories-gifts-collectibles'],['Airsoft','/collections/airsoft-milsim'],['Apparel','/collections/apparel'],['Armed Forces Gear','/collections/armed-forces-gear'],['Art','/collections/art'],['Body Armor','/collections/body-armor-ballistic-protection'],['Books','/collections/literature'],['Child Safety','/collections/child-safety-shop'],['DIVE / SCUBA','/collections/dive-scuba'],['Firearm Accessories','/collections/firearm-accessories'],['First Aid','/collections/first-aid-medical-ifak'],['Flags','/collections/flags-patriotic-decor'],['Flashlights','/collections/flashlights-lighting'],['Footwear','/collections/footwear-gloves-eyewear'],['K9','/collections/k9-dog-gear'],['Knives','/collections/knives-axes-cutlery'],['Morale Patches','/collections/morale-patches-tactical-id'],['Outdoor','/collections/outdoor-preparedness-gear'],['Patriotic','/collections/patriotic-american-heritage'],['Safety Rescue','/collections/safety-rescue-climbing'],['Sta-Brite','/collections/sta-brite-insignia'],['Tactical Gear','/collections/tactical-gear'],['Thin Line','/collections/thin-line'],['Uniforms','/collections/uniforms'],['Watches','/collections/watches'],['Lighters','/collections/zippos-lighters-torches'],['Logo Merch','/collections/stateside-quartermaster-logo-merch'],['Army National Guard','/collections/army-national-guard-series'],['Air National Guard','/collections/air-national-guard-series'],['U.S. Army','/collections/products-built-for-the-line-u-s-army'],['U.S. Navy','/collections/products-built-for-the-line-u-s-navy'],['U.S. Air Force','/collections/products-built-for-the-line-u-s-air-force'],['U.S. Marines','/collections/products-built-for-the-line-u-s-marine-corps'],['U.S. Coast Guard','/collections/products-built-for-the-line-u-s-coast-guard'],['U.S. Space Force','/collections/products-built-for-the-line-u-s-space-force'],['ROTC','/collections/rotc-series'],['JROTC','/collections/jrotc-series'],['Military Schools','/collections/military-schools-academies'],['Law Enforcement','/collections/law-enforcement-corrections'],['Fire EMS SAR','/collections/firefighting-ems-search-rescue']];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const u=(path,extra={})=>{const x=new URL(path,BASE);x.searchParams.set('preview_theme_id',THEME);for(const[k,v]of Object.entries(extra))x.searchParams.set(k,String(v));return x.toString()};
          async function go(p,path,extra={}){const r=await p.goto(u(path,extra),{waitUntil:'domcontentloaded',timeout:70000});if(r?.status()!==200)throw new Error('HTTP '+(r?.status()||0));await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:40000});await p.waitForSelector('#MainContent .sq-refine-v3-sidebar',{state:'visible',timeout:12000});await sleep(700)}
          async function snap(p){return p.evaluate(()=>{const m=document.querySelector('#MainContent');const vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0};const side=[...m.querySelectorAll('.sq-refine-v3-sidebar')].filter(vis);const legacy=[...m.querySelectorAll('.sq-global-refine-sidebar,.sq-collection-sidebar,.facets-block-wrapper,.facets-container,.facets-wrapper,[class*="filter-sidebar"]')].filter(e=>vis(e)&&!e.classList.contains('sq-refine-v3-sidebar'));const grids=[...m.querySelectorAll('.sq-refine-v3-results .product-grid')].filter(vis);const g=grids.find(x=>x.classList.contains('sq-v3-authoritative-grid'))||grids[0];const cards=g?[...g.querySelectorAll(':scope > .product-grid__item')].filter(x=>vis(x)&&x.querySelector('a[href*="/products/"]')):[];const rr=cards.slice(0,12).map(x=>x.getBoundingClientRect());const row=rr.length?rr.filter(x=>Math.abs(x.y-rr[0].y)<4).length:0;const s=side[0],t=s?.querySelector('.sq-refine-v3-sidebar__title'),sr=s?.getBoundingClientRect(),tr=t?.getBoundingClientRect();const groups=s?[...s.querySelectorAll(':scope > details.sq-refine-v3-group')].map(d=>({label:(d.querySelector(':scope > summary')?.textContent||'').trim(),inputs:d.querySelectorAll('input[type=checkbox]').length,targets:[...d.querySelectorAll('input[data-kind=structural][data-target]')].map(i=>i.dataset.target||'')})):[];return{sidebars:side.length,legacy:legacy.length,title:(t?.textContent||'').trim(),titleBg:t?getComputedStyle(t).backgroundColor:'',sideBg:s?getComputedStyle(s).backgroundColor:'',gap:sr&&tr?Math.max(0,sr.right-tr.right):999,pos:s?getComputedStyle(s).position:'',cards:cards.length,row,width:rr.length?Math.round(rr[0].width):0,pageSizes:[...m.querySelectorAll('.sq-refine-v3-page-size input')].map(i=>i.value),groups}})}
          function validate(d,path){const e=[];if(d.sidebars!==1)e.push('sidebars='+d.sidebars);if(d.legacy)e.push('legacy='+d.legacy);if(d.title.toUpperCase()!=='REFINE PRODUCTS')e.push('title');if(d.titleBg!=='rgb(8, 40, 63)'||d.sideBg!=='rgb(8, 40, 63)'||d.gap>1.5)e.push('header');if(d.pos!=='sticky')e.push('sidebar='+d.pos);if(d.cards<1)e.push('no products');if(d.row!==3)e.push('row='+d.row);if(d.width<250)e.push('width='+d.width);if(d.pageSizes.join(',')!=='50,100,250')e.push('pageSizes='+d.pageSizes.join(','));for(const g of d.groups){if(!g.inputs)e.push('empty '+g.label);for(const target of g.targets){if(!target.startsWith('/collections/'))e.push('bad structural '+g.label);else if(!new URL(target,BASE).searchParams.get('sq_root'))e.push('missing sq_root '+g.label)}}if(path==='/collections/literature'){for(const name of ['Shop by Publisher','Shop by War / Conflict','Shop by Branch','Shop by Topic'])if(!d.groups.some(g=>g.label===name&&g.inputs))e.push('missing '+name)}if(path==='/collections/firearm-accessories'&&!d.groups.some(g=>/Make \/ Model/i.test(g.label)&&g.inputs))e.push('missing Make / Model');return e}
          const browser=await chromium.launch({headless:true});const c=await browser.newContext({viewport:{width:1440,height:1000}});const p=await c.newPage();const failures=[];
          p.on('pageerror',e=>{if(/sq-refine|sq-v3/i.test(e.stack||e.message||''))failures.push('pageerror '+e.message)});
          for(let i=0;i<routes.length;i++){const[n,path]=routes[i];try{await go(p,path);const d=await snap(p),e=validate(d,path);if(e.length)failures.push(n+': '+e.join(' | '));console.log((e.length?'FAIL ':'PASS ')+(i+1)+'/40 '+n+' '+JSON.stringify(d))}catch(e){failures.push(n+': '+String(e));console.log('FAIL '+n+' '+e)}await sleep(500)}
          for(const[path,label]of [['/collections/state-guard-series','State Guard'],['/pages/armored-vehicles-purchase-inquiry','Armored Vehicles']]){try{const r=await p.goto(u(path),{waitUntil:'domcontentloaded',timeout:70000});await sleep(800);const x=await p.evaluate(()=>({v3:!!document.querySelector('[data-sq-refine-v3]'),side:!!document.querySelector('.sq-refine-v3-sidebar')}));if(r?.status()!==200||x.v3||x.side)failures.push(label+' isolation '+JSON.stringify(x));console.log(label.toUpperCase()+' '+JSON.stringify(x))}catch(e){failures.push(label+': '+e)}}
          async function openGroupFor(input){const d=input.locator('xpath=ancestor::details[1]');if(await d.count()&&await d.getAttribute('open')===null)await d.locator(':scope > summary').click()}
          for(const path of ['/collections/accessories-gifts-collectibles','/collections/apparel','/collections/firearm-accessories','/collections/products-built-for-the-line-u-s-navy']){try{await go(p,path);const d=p.locator('.sq-refine-v3-sidebar details.sq-refine-v3-group').filter({has:p.locator('input[type=checkbox]')}).first();if(await d.count()){if(await d.getAttribute('open')!==null)await d.locator(':scope > summary').click();await d.locator(':scope > summary').click();if(await d.getAttribute('open')===null)failures.push(path+' disclosure failed open');await d.locator(':scope > summary').click();if(await d.getAttribute('open')!==null)failures.push(path+' disclosure failed close')}const card=p.locator('.sq-refine-v3-results .product-grid:visible .product-grid__item:visible').first();const link=card.locator('a[href*="/products/"]').first();const href=await link.getAttribute('href');if(!href)throw new Error('no product link');await p.goto(new URL(href,BASE).toString(),{waitUntil:'domcontentloaded',timeout:70000});if(!p.url().includes('/products/'))failures.push(path+' product navigation');await p.goBack({waitUntil:'domcontentloaded',timeout:70000});await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:40000});console.log('DEEP PASS '+path)}catch(e){failures.push(path+' deep '+String(e))}}
          for(const path of ['/collections/accessories-gifts-collectibles','/collections/apparel']){try{await go(p,path);const input=p.locator('.sq-refine-v3-sidebar input[data-kind=native][data-filter-name][data-filter-value]:not(:checked)').first();if(await input.count()){await openGroupFor(input);const name=await input.getAttribute('data-filter-name'),value=await input.getAttribute('data-filter-value');await input.check();await p.waitForLoadState('domcontentloaded',{timeout:30000}).catch(()=>{});await sleep(1000);const q=new URL(p.url());if(!q.searchParams.getAll(name).includes(value))failures.push(path+' native URL');await p.reload({waitUntil:'domcontentloaded',timeout:70000});await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:40000});const checked=await p.locator(`.sq-refine-v3-sidebar input[data-kind=native][data-filter-name="${name}"][data-filter-value="${value}"]`).first().isChecked().catch(()=>false);if(!checked)failures.push(path+' native persistence');console.log('FILTER PASS '+path)}else console.log('FILTER SKIP '+path)}catch(e){failures.push(path+' native '+String(e))}}
          for(const path of ['/collections/products-built-for-the-line-u-s-navy','/collections/literature']){try{await go(p,path);const input=p.locator('.sq-refine-v3-sidebar input[data-kind=structural][data-target^="/collections/"]').first();if(await input.count()){await openGroupFor(input);const target=await input.getAttribute('data-target');if(!new URL(target,BASE).searchParams.get('sq_root'))failures.push(path+' structural root');await input.check();await p.waitForLoadState('domcontentloaded',{timeout:30000}).catch(()=>{});await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:40000});if(!p.url().includes('/collections/'))failures.push(path+' structural left collection');console.log('STRUCTURAL PASS '+path)}else failures.push(path+' structural candidate missing')}catch(e){failures.push(path+' structural '+String(e))}}
          for(const target of ['50','100','250']){try{await go(p,'/collections/accessories-gifts-collectibles');const input=p.locator(`.sq-refine-v3-page-size input[value="${target}"]`);await input.check();await p.waitForLoadState('domcontentloaded',{timeout:30000}).catch(()=>{});await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:40000});await sleep(target==='250'?2500:1200);const q=new URL(p.url());if(q.searchParams.get('sq_per_page')!==target)failures.push('page size '+target+' URL');const count=await p.locator('.sq-refine-v3-results .product-grid:visible .product-grid__item:visible').count();if(count!==Number(target))failures.push('page size '+target+' count='+count);console.log('PAGE SIZE '+target+' '+count)}catch(e){failures.push('page size '+target+' '+String(e))}}
          const mc=await browser.newContext({viewport:{width:390,height:844}}),mp=await mc.newPage();for(const path of ['/collections/accessories-gifts-collectibles','/collections/apparel','/collections/literature','/collections/products-built-for-the-line-u-s-navy']){try{await go(mp,path);const d=await mp.evaluate(()=>{const vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};const m=document.querySelector('#MainContent'),s=[...m.querySelectorAll('.sq-refine-v3-sidebar')].filter(vis),g=[...m.querySelectorAll('.sq-refine-v3-results .product-grid')].filter(vis)[0],cards=g?[...g.querySelectorAll(':scope > .product-grid__item')].filter(x=>vis(x)&&x.querySelector('a[href*="/products/"]')).slice(0,8):[],r=cards.map(x=>x.getBoundingClientRect()),row=r.length?r.filter(x=>Math.abs(x.y-r[0].y)<4).length:0;return{sidebars:s.length,pos:s[0]?getComputedStyle(s[0]).position:'',row,cards:cards.length}});if(d.sidebars!==1||d.pos==='sticky'||d.row!==2)failures.push('mobile '+path+' '+JSON.stringify(d));console.log('MOBILE '+path+' '+JSON.stringify(d))}catch(e){failures.push('mobile '+path+' '+String(e))}}
          await mc.close();await c.close();await browser.close();console.log('FAILURES='+JSON.stringify(failures));if(failures.length)process.exit(1);console.log('ALL CUSTOMER JOURNEYS GREEN');
          EOF
          node customer-v4.mjs
# trigger 2026-09-10 education and no-interior-button repairs
