# Certify K9 Refine V3 by the same visible rows customers click.
name: K9 Refine V3 membership certification
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/k9-refine-membership-certify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium tools
        run: |
          npm init -y >/dev/null
          npm install playwright@1.55.0 agent-browser @shopify/liquid-html-parser >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          npx agent-browser install >/dev/null
      - name: Validate K9 Liquid and JavaScript
        run: |
          mkdir -p proof
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),{toLiquidHtmlAST}=require('@shopify/liquid-html-parser');
          const files=['snippets/sq-refine-v3.liquid','snippets/sq-refine-v3-sidebar-polish.liquid','snippets/sq-refine-v3-k9-color-pattern.liquid','snippets/sq-refine-v3-k9-membership-guard.liquid','snippets/sq-refine-v3-product-scale-lock.liquid'];
          for(const f of files){const s=fs.readFileSync(f,'utf8');toLiquidHtmlAST(s);for(const m of s.matchAll(/<script(?![^>]*application\/json)[^>]*>([\s\S]*?)<\/script>/g))new vm.Script(m[1]);console.log('PASS '+f)}
          NODE
      - name: Exhaustive Playwright Chromium certification
        run: |
          cat > certify.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base='https://www.statesideqm.com/collections/k9-dog-gear?preview_theme_id=158561894555';
          const bad=['Army Tactical Desert Combat Suits with Knee Pads - G3','FRENCH CCE CAMO FLEECE SHIRT W/ZIPPER NEW Unissued','GERMAN OD TRICOT SHIRT W/ZIPPER USED (L)','Harlej Bag - Car Seat Organizer, Mobile Office','LULA® Loader / Unloader - Ruger 10/22® .22LR','Meow Morale Patch','ROTC Collar Insignia','SpikeVest for Cats','Surfing Surfboard SUP Coil Paddle Leash Cord'];
          const browser=await chromium.launch({headless:true});
          const report={commit:process.env.GITHUB_SHA,theme:158561894555,choices:[],errors:[],tests:[]};
          const metaOf=el=>({label:(el.closest('label')?.querySelector('span')?.textContent||el.getAttribute('aria-label')||el.dataset.sqPolishValue||el.dataset.filterValue||'').replace(/\s+/g,' ').replace(/\s*\(\d+\)\s*$/,'').trim(),group:(el.closest('details')?.querySelector(':scope>summary')?.textContent||'').replace(/\s+/g,' ').trim(),kind:el.dataset.kind||'',target:el.dataset.target||'',param:el.dataset.sqPolishParam||el.dataset.filterName||'',value:el.dataset.sqPolishValue||el.dataset.filterValue||el.value||'',color:el.dataset.sqK9Color==='true'});
          function wire(page){page.on('pageerror',e=>report.errors.push(e.message));}
          async function load(page,url=base){for(let a=0;a<2;a++){try{await page.goto(url,{waitUntil:'domcontentloaded',timeout:35000});await page.waitForSelector('.sq-refine-v3-sidebar',{timeout:15000});await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:15000});return}catch(e){if(a)throw e}}}
          async function visibleTitles(page){return page.locator('#MainContent a[href*="/products/"]').evaluateAll(as=>{const seen=new Set(),out=[];for(const a of as){const c=a.closest('.product-grid__item,product-card,.product-card,.card-wrapper,.grid__item')||a;if(c.getAttribute('data-sq-k9-membership-rejected')==='true')continue;const t=(c.innerText||a.innerText||'').replace(/\s+/g,' ').trim(),h=(a.getAttribute('href')||'').split('?')[0];if(t&&!seen.has(h)){seen.add(h);out.push(t)}}return out});}
          async function assertClean(page,label){const ts=await visibleTitles(page);for(const needle of bad)assert.ok(!ts.some(t=>t.toLowerCase().includes(needle.toLowerCase())),label+' leaked '+needle);return ts.length;}
          async function locateRow(page,c){const rows=page.locator('.sq-refine-v3-sidebar label.sq-refine-v3-choice');const n=await rows.count();for(let i=0;i<n;i++){const input=rows.nth(i).locator('input[type="checkbox"]');if(!await input.count())continue;const m=await input.evaluate(metaOf);if(m.label===c.label&&m.group===c.group&&m.target===c.target&&m.param===c.param&&m.value===c.value)return rows.nth(i)}throw new Error('choice not found: '+c.group+' > '+c.label);}
          const discovery=await browser.newPage({viewport:{width:1440,height:1100}});wire(discovery);await load(discovery);
          assert.equal(await discovery.evaluate(()=>Shopify.theme.id),158561894555,'wrong preview theme');
          assert.ok(await discovery.locator('script[data-sq-refine-v3]').count(),'Refine V3 core missing');
          assert.ok(await discovery.locator('script[data-sq-k9-membership-guard]').count(),'K9 guard missing');
          assert.ok(await discovery.getByText('REFINE PRODUCTS',{exact:true}).count(),'Refine Products title missing');
          await discovery.waitForFunction(()=>document.querySelector('[data-sq-k9-color-pattern]')&&document.querySelector('#MainContent')?.dataset.sqK9ColorReady==='true',null,{timeout:30000}).catch(()=>{});
          await assertClean(discovery,'baseline');
          const choices=await discovery.locator('.sq-refine-v3-sidebar input[type="checkbox"]').evaluateAll(ins=>ins.map(metaOf).filter(x=>x.label));
          report.discovered=choices;console.log('DISCOVERED',choices.length,'choices');
          await discovery.close();
          const normal=choices.filter(c=>!c.color),colors=choices.filter(c=>c.color);
          let cursor=0;
          async function worker(id){const page=await browser.newPage({viewport:{width:1440,height:1100}});wire(page);while(true){const pos=cursor++;if(pos>=normal.length)break;const c=normal[pos];let rec={...c,pass:false};try{await load(page);const row=await locateRow(page,c);await row.evaluate(el=>{const d=el.closest('details');if(d)d.open=true});await row.scrollIntoViewIfNeeded();const before=page.url();
              const expected=c.target?new URL(c.target,'https://www.statesideqm.com'):null;
              const nav=c.target||c.param?page.waitForURL(u=>{if(c.target)return u.pathname===expected.pathname;if(c.param)return u.searchParams.getAll(c.param).includes(c.value);return false},{timeout:15000}).catch(()=>null):Promise.resolve();
              await row.click();await nav;
              const after=page.url();if(c.target)assert.equal(new URL(after).pathname,expected.pathname,'structural control navigated to wrong collection');else if(c.param)assert.ok(new URL(after).searchParams.getAll(c.param).includes(c.value),`missing ${c.param}=${c.value} after visible-row click`);else assert.notEqual(after,before,'control produced no observable URL change');
              const count=await assertClean(page,c.group+' > '+c.label);rec={...rec,pass:true,url:after,visibleProducts:count};console.log('PASS',id,c.group,'>',c.label);
            }catch(e){rec.error=e.message;console.error('FAIL',id,c.group,'>',c.label,e.message)}report.choices.push(rec)}await page.close()}
          await Promise.all(Array.from({length:Math.min(8,Math.max(1,normal.length))},(_,i)=>worker(i+1)));
          if(colors.length){const page=await browser.newPage({viewport:{width:1440,height:1100}});wire(page);await load(page);await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqK9ColorReady==='true',null,{timeout:30000});for(const c of colors){let rec={...c,pass:false};try{let row=await locateRow(page,c);await row.evaluate(el=>{const d=el.closest('details');if(d)d.open=true});await row.scrollIntoViewIfNeeded();await row.click();await page.waitForFunction(v=>new URL(location.href).searchParams.getAll('sq_k9_color').includes(v),c.value,{timeout:10000});await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqK9ColorReady==='true',null,{timeout:30000});const count=await assertClean(page,c.group+' > '+c.label);rec={...rec,pass:true,url:page.url(),visibleProducts:count};console.log('PASS color',c.label);row=await locateRow(page,c);await row.evaluate(el=>{const d=el.closest('details');if(d)d.open=true});await row.click();await page.waitForFunction(v=>!new URL(location.href).searchParams.getAll('sq_k9_color').includes(v),c.value,{timeout:10000});await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqK9ColorReady==='true',null,{timeout:30000});}catch(e){rec.error=e.message;console.error('FAIL color',c.label,e.message);await load(page)}report.choices.push(rec)}await page.close()}
          const failed=report.choices.filter(x=>!x.pass);const dedupErrors=[...new Set(report.errors)];report.errors=dedupErrors;report.tests=[{name:'Refine V3 core present',pass:true},{name:'K9 membership guard present',pass:true},{name:'all choices audited',pass:report.choices.length===choices.length,total:choices.length,audited:report.choices.length},{name:'all choices pass',pass:failed.length===0,failed:failed.length},{name:'no known non-K9 leakage',pass:!failed.some(x=>/ leaked /.test(x.error||''))},{name:'no page errors',pass:dedupErrors.length===0,errors:dedupErrors}];
          fs.writeFileSync('proof/k9-refine-membership-report.json',JSON.stringify(report,null,2));
          const shot=await browser.newPage({viewport:{width:1440,height:1100}});await load(shot);await shot.screenshot({path:'proof/k9-refine-certified.png',fullPage:true});await shot.close();await browser.close();
          if(report.choices.length!==choices.length||failed.length||dedupErrors.length)process.exit(1);
          EOF
          node certify.mjs
      - name: Agent-browser Chromium proof
        if: always()
        run: |
          npx agent-browser open 'https://www.statesideqm.com/collections/k9-dog-gear?preview_theme_id=158561894555'
          npx agent-browser wait '.sq-refine-v3-sidebar'
          npx agent-browser snapshot -i > proof/k9-agent-browser-snapshot.txt
          npx agent-browser screenshot proof/k9-agent-browser.png
          npx agent-browser close
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k9-refine-membership-certification
          path: proof
          retention-days: 14
