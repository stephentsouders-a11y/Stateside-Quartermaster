name: Top Row Circle Size Audit 0909
on:
  push:
    paths:
      - '.github/workflows/top-row-circle-size-audit-0909.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 sharp@0.34.3 >/dev/null 2>&1 && npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Measure visible circle diameters
        run: |
          mkdir -p audit-output/top-row-circle-size
          cat > measure.mjs <<'EOF'
          import { chromium } from 'playwright';
          import sharp from 'sharp';
          import fs from 'fs';
          const out='audit-output/top-row-circle-size';
          const url='https://www.statesideqm.com/?preview_theme_id=158561894555';
          const handles=['stateside-quartermaster-logo-merch','army-national-guard-series','air-national-guard-series','state-guard-series','products-built-for-the-line-u-s-army'];
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1150},deviceScaleFactor:1});
          await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(3500);
          await page.locator('[data-sq-series-handle="air-national-guard-series"]').scrollIntoViewIfNeeded();
          await page.waitForTimeout(1000);
          const rows=[];
          for(const h of handles){
            const card=page.locator(`[data-sq-series-handle="${h}"]`);
            const img=card.locator('.sqhc-series-logo img');
            const box=await img.boundingBox();
            const bg=await card.evaluate(el=>getComputedStyle(el).getPropertyValue('--bg').trim() || getComputedStyle(el).backgroundColor);
            const buf=await img.screenshot();
            const {data,info}=await sharp(buf).removeAlpha().raw().toBuffer({resolveWithObject:true});
            let bgRGB=null;
            if(bg.startsWith('#')){const s=bg.slice(1); bgRGB=s.length===6?[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)]:null;}
            if(!bgRGB){bgRGB=[data[0],data[1],data[2]];}
            let minX=info.width,minY=info.height,maxX=-1,maxY=-1,count=0;
            for(let y=0;y<info.height;y++) for(let x=0;x<info.width;x++){
              const i=(y*info.width+x)*3;
              const d=Math.max(Math.abs(data[i]-bgRGB[0]),Math.abs(data[i+1]-bgRGB[1]),Math.abs(data[i+2]-bgRGB[2]));
              if(d>18){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);count++;}
            }
            const visible=maxX>=0?{w:maxX-minX+1,h:maxY-minY+1,diameter:Math.max(maxX-minX+1,maxY-minY+1),bounds:[minX,minY,maxX,maxY]}:null;
            rows.push({handle:h,imgBox:box?{w:+box.width.toFixed(2),h:+box.height.toFixed(2)}:null,bg,visible});
            await card.screenshot({path:`${out}/${h}.png`});
          }
          const ref=rows.find(x=>x.handle==='air-national-guard-series')?.visible?.diameter||0;
          for(const r of rows){r.referenceDiameter=ref;r.deltaPx=r.visible? r.visible.diameter-ref:null;r.scaleToReference=r.visible? +(ref/r.visible.diameter).toFixed(4):null;}
          const pass=rows.every(r=>r.visible && Math.abs(r.visible.diameter-ref)<=2);
          fs.writeFileSync(`${out}/audit.json`,JSON.stringify({pass,reference:'air-national-guard-series',rows},null,2));
          await page.locator('[data-sq-line-series-root]').screenshot({path:`${out}/top-row-series.png`});
          await browser.close();
          EOF
          node measure.mjs
      - name: Commit measurement evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-output/top-row-circle-size
          git diff --cached --quiet || git commit -m 'Store top-row circle logo size audit'
          git push
