name: Refine V3 homepage 41-button customer stress audit
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-homepage-customer-stress.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
        shard: [0,1,2,3,4]
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click homepage cards and stress collection transitions
        env:
          SHARD: ${{ matrix.shard }}
          VIEWPORT: ${{ matrix.viewport }}
        run: |
          cat > stress.mjs <<'EOF'
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright';
          const BASE='https://www.statesideqm.com';
          const THEME='158561894555';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const routes=[
            ['Accessories','accessories-gifts-collectibles',1],['Airsoft','airsoft-milsim',1],['Apparel','apparel',1],['Armed Forces Gear','armed-forces-gear',1],['Art','art',1],['Body Armor','body-armor-ballistic-protection',1],['Books','literature',1],['Child Safety','child-safety-shop',1],['DIVE SCUBA','dive-scuba',1],['Firearm Accessories','firearm-accessories',1],['First Aid','first-aid-medical-ifak',1],['Flags','flags-patriotic-decor',1],['Flashlights','flashlights-lighting',1],['Footwear','footwear-gloves-eyewear',1],['K9','k9-dog-gear',1],['Knives','knives-axes-cutlery',1],['Morale Patches','morale-patches-tactical-id',1],['Outdoor','outdoor-preparedness-gear',1],['Patriotic','patriotic-american-heritage',1],['Safety Rescue','safety-rescue-climbing',1],['Sta-Brite','sta-brite-insignia',1],['Tactical Gear','tactical-gear',1],['Thin Line','thin-line',1],['Uniforms','uniforms',1],['Watches','watches',1],['Zippo','zippos-lighters-torches',1],['Logo Merch','stateside-quartermaster-logo-merch',1],['Army National Guard','army-national-guard-series',1],['Air National Guard','air-national-guard-series',1],['Army','products-built-for-the-line-u-s-army',1],['Navy','products-built-for-the-line-u-s-navy',1],['Air Force','products-built-for-the-line-u-s-air-force',1],['Marine Corps','products-built-for-the-line-u-s-marine-corps',1],['Coast Guard','products-built-for-the-line-u-s-coast-guard',1],['Space Force','products-built-for-the-line-u-s-space-force',1],['ROTC','rotc-series',1],['JROTC','jrotc-series',1],['Military Schools','military-schools-academies',1],['Law Enforcement','law-enforcement-corrections',1],['Fire EMS SAR','firefighting-ems-search-rescue',1],['State Guard','state-guard-series',0]
          ];
          const shard=Number(process.env.SHARD||0),mode=process.env.VIEWPORT||'desktop';
          const subset=routes.filter((_,i)=>i%5===shard);
          const viewport=mode==='mobile'?{width:390,height:844}:{width:1440,height:1000};
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport});
          const page=await context.newPage();
          await fs.mkdir('shots',{recursive:true});
          await page.addInitScript(()=>{
            window.__sqCustomerAudit={events:[],seen:new Set(),start:performance.now()};
            const record=(type,extra={})=>{
              const a=window.__sqCustomerAudit;if(!a)return;
              const key=type+'|'+JSON.stringify(extra);if(a.seen.has(key))return;a.seen.add(key);
              a.events.push({type,t:Math.round(performance.now()),path:location.pathname+location.search,...extra});
            };
            const visible=e=>{if(!e||!e.isConnected)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'};
            const scan=()=>{
              const main=document.querySelector('#MainContent');if(!main)return;
              const side=[...main.querySelectorAll('.sq-refine-v3-sidebar')].find(visible);
              const grid=[...main.querySelectorAll('.sq-refine-v3-results .product-grid')].find(visible);
              const product=grid?[...grid.querySelectorAll(':scope > .product-grid__item')].find(e=>visible(e)&&e.querySelector('a[href*="/products/"]')):null;
              if(side)record('refine-visible',{title:(side.querySelector('.sq-refine-v3-sidebar__title')?.textContent||'').trim()});
              if(product)record('product-visible',{title:(product.textContent||'').replace(/\s+/g,' ').trim().slice(0,100)});
              const selectors='[class*="button-tree"],[class*="root-categories"],[class*="third-level"],[class*="branch-grid"],[class*="type-grid"],[class*="program-tree"],[class*="category-grid"],[class*="navigation-grid"],.sqbfl';
              const old=[...main.querySelectorAll(selectors)].filter(e=>visible(e)&&!e.closest('.sq-refine-v3-sidebar,.sq-refine-v3-results'));
              if(old.length)record('legacy-visible',{count:old.length,sample:(old[0].textContent||'').replace(/\s+/g,' ').trim().slice(0,140)});
              if(location.pathname!='/collections/state-guard-series'){
                const candidates=[...main.querySelectorAll('h1,h2,h3,p,div,section')].filter(visible);
                const sg=candidates.find(e=>/State Guard Uniform Builder|Build Your Uniform|PT Uniform — Full Head-to-Toe Shopping Checklist/i.test((e.textContent||'').trim()));
                if(sg)record('foreign-state-guard-visible',{sample:(sg.textContent||'').replace(/\s+/g,' ').trim().slice(0,160)});
              }
            };
            const start=()=>{try{new MutationObserver(scan).observe(document.documentElement||document,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style','hidden']});}catch{};scan();setInterval(scan,20)};
            if(document.documentElement)start();else document.addEventListener('readystatechange',()=>document.documentElement&&start(),{once:true});
          });
          let routeErrors=[];
          page.on('pageerror',e=>routeErrors.push('pageerror: '+String(e)));
          page.on('requestfailed',r=>{try{const u=new URL(r.url());if((u.hostname==='www.statesideqm.com'||u.hostname.endsWith('shopify.com'))&&['document','script','stylesheet'].includes(r.resourceType()))routeErrors.push('requestfailed '+r.resourceType()+': '+r.url()+' '+(r.failure()?.errorText||''));}catch{}});
          async function openHome(){
            const u=`${BASE}/?preview_theme_id=${THEME}&sq_customer_audit=${Date.now()}`;
            let last;for(let a=0;a<4;a++){try{const r=await page.goto(u,{waitUntil:'domcontentloaded',timeout:90000});if(r?.status()===200){await sleep(1000);return}last=new Error('HTTP '+r?.status())}catch(e){last=e}await sleep(2500*(a+1))}throw last;
          }
          async function findHomeLink(handle){
            const links=page.locator(`#MainContent a[href*="/collections/${handle}"]`);
            const n=await links.count();
            for(let i=0;i<n;i++){const l=links.nth(i);if(await l.isVisible().catch(()=>false))return l}
            return null;
          }
          async function finalInspect(expectV3){return page.evaluate(expect=>{
            const visible=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'};
            const main=document.querySelector('#MainContent');const side=main?[...main.querySelectorAll('.sq-refine-v3-sidebar')].find(visible):null;const grid=main?[...main.querySelectorAll('.sq-refine-v3-results .product-grid')].find(visible):null;
            const cards=grid?[...grid.querySelectorAll(':scope > .product-grid__item')].filter(e=>visible(e)&&e.querySelector('a[href*="/products/"]')):[];
            const rects=cards.slice(0,8).map(e=>e.getBoundingClientRect());const row=rects.length?rects.filter(r=>Math.abs(r.y-rects[0].y)<4).length:0;
            const title=side?.querySelector('.sq-refine-v3-sidebar__title');const sr=side?.getBoundingClientRect(),tr=title?.getBoundingClientRect();
            const legacy=main?[...main.querySelectorAll('[class*="button-tree"],[class*="root-categories"],[class*="third-level"],[class*="branch-grid"],[class*="type-grid"],[class*="program-tree"],[class*="category-grid"],[class*="navigation-grid"],.sqbfl')].filter(e=>visible(e)&&!e.closest('.sq-refine-v3-sidebar,.sq-refine-v3-results')).length:0;
            const sg=location.pathname!='/collections/state-guard-series'&&main?[...main.querySelectorAll('h1,h2,h3,p,div,section')].some(e=>visible(e)&&/State Guard Uniform Builder|Build Your Uniform|PT Uniform — Full Head-to-Toe Shopping Checklist/i.test((e.textContent||'').trim())):false;
            const first=cards.slice(0,6).map(e=>(e.querySelector('a[href*="/products/"]')?.textContent||e.textContent||'').replace(/\s+/g,' ').trim().slice(0,120));
            return {expect,ready:main?.dataset.sqRefineV3Ready==='true',error:main?.dataset.sqRefineV3Error||'',side:!!side,title:(title?.textContent||'').trim(),headerBg:title?getComputedStyle(title).backgroundColor:'',headerGap:sr&&tr?Math.round(Math.max(0,sr.right-tr.right)*10)/10:null,sidePos:side?getComputedStyle(side).position:'',cards:cards.length,row,legacy,foreignStateGuard:sg,first,events:(window.__sqCustomerAudit?.events||[]).slice(0,120),child:document.documentElement.dataset.sqRefineV3ChildIsolation||''};
          },expectV3)}
          async function waitV3(){await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:60000});await page.waitForSelector('#MainContent .sq-refine-v3-sidebar',{state:'visible',timeout:20000});await sleep(900)}
          async function stressFilter(){
            const before=await page.evaluate(()=>[...document.querySelectorAll('#MainContent .sq-refine-v3-results .product-grid a[href*="/products/"]')].slice(0,8).map(a=>a.href));
            const boxes=page.locator('#MainContent .sq-refine-v3-sidebar details.sq-refine-v3-group input[type="checkbox"]:not([disabled])');
            let box=null,label='';for(let i=0;i<Math.min(await boxes.count(),40);i++){const b=boxes.nth(i);if(await b.isVisible().catch(()=>false)){box=b;label=await b.evaluate(e=>{const id=e.id;const l=id?document.querySelector(`label[for="${CSS.escape(id)}"]`):e.closest('label');return (l?.textContent||e.value||'').replace(/\s+/g,' ').trim().slice(0,100)});break}}
            if(!box)return {skipped:'no visible checkbox'};
            const oldUrl=page.url();await box.check({force:true}).catch(async()=>box.click({force:true}));await Promise.race([page.waitForLoadState('domcontentloaded',{timeout:12000}).catch(()=>{}),sleep(1800)]);await sleep(1500);
            const afterUrl=page.url();const after=await page.evaluate(()=>[...document.querySelectorAll('#MainContent .sq-refine-v3-results .product-grid a[href*="/products/"]')].slice(0,8).map(a=>a.href));
            const sideStill=await page.locator('#MainContent .sq-refine-v3-sidebar').filter({visible:true}).count().catch(()=>0);
            const changed=oldUrl!==afterUrl||JSON.stringify(before)!==JSON.stringify(after);
            let restored=true;
            if(oldUrl!==afterUrl){await page.goBack({waitUntil:'domcontentloaded',timeout:90000}).catch(()=>{});await waitV3().catch(()=>{});restored=new URL(page.url()).pathname===new URL(oldUrl).pathname;}
            else{await box.uncheck({force:true}).catch(()=>{});await sleep(1200)}
            return {label,oldUrl,afterUrl,changed,sideStill:sideStill>0,restored};
          }
          const failures=[],warnings=[],results=[];
          for(const [name,handle,expectV3] of subset){
            routeErrors=[];const errs=[],warn=[];let cardInfo=null,filter=null,d=null;
            try{
              await openHome();
              const link=await findHomeLink(handle);if(!link){errs.push('homepage button/link not found');throw new Error('homepage button/link not found')}
              cardInfo=await link.evaluate(a=>{const img=a.querySelector('img');const r=a.getBoundingClientRect();return{text:(a.textContent||'').replace(/\s+/g,' ').trim().slice(0,120),href:a.href,w:Math.round(r.width),h:Math.round(r.height),img:img?{complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,alt:img.alt}:null}});
              if(cardInfo.img&&(!cardInfo.img.complete||cardInfo.img.naturalWidth<10))errs.push('homepage button image broken');
              await link.click();await page.waitForLoadState('domcontentloaded',{timeout:90000});
              if(expectV3)await waitV3();else await sleep(1800);
              d=await finalInspect(!!expectV3);
              const flashes=d.events.filter(e=>e.type==='legacy-visible'||e.type==='foreign-state-guard-visible');
              if(expectV3){
                if(!d.ready||d.error||!d.side)errs.push('V3 did not become ready/visible');
                if(d.title!=='REFINE PRODUCTS')errs.push('Refine title wrong');
                if(d.headerBg!=='rgb(8, 40, 63)')errs.push('Refine header navy wrong');
                if(d.headerGap!==null&&d.headerGap>1.5)errs.push('Refine header right seam '+d.headerGap);
                if(d.legacy)errs.push('legacy navigation visible final='+d.legacy);
                if(d.foreignStateGuard)errs.push('State Guard content visible on wrong collection');
                if(flashes.length)errs.push('transient wrong/legacy content flashed='+JSON.stringify(flashes.slice(0,6)));
                if(d.cards<1)errs.push('no visible product cards');
                if(mode==='desktop'&&d.cards>=3&&d.row!==3)errs.push('desktop product row='+d.row);
                if(mode==='mobile'&&d.cards>=2&&d.row!==2)errs.push('mobile product row='+d.row);
                if(mode==='desktop'&&d.sidePos!=='sticky')errs.push('desktop Refine not sticky');
                if(mode==='mobile'&&d.sidePos==='sticky')errs.push('mobile Refine unexpectedly sticky');
                filter=await stressFilter();
                if(filter.skipped)warn.push(filter.skipped);else{if(!filter.changed)errs.push('checkbox did not change URL or product set: '+filter.label);if(!filter.sideStill)errs.push('Refine disappeared after checkbox: '+filter.label);if(!filter.restored)errs.push('Back did not restore root after checkbox: '+filter.label)}
              }else{
                if(d.side||d.ready||d.child)errs.push('State Guard was touched by V3');
              }
              if(routeErrors.length)warn.push(...routeErrors.slice(0,8));
              if(d?.events){const rv=d.events.find(e=>e.type==='refine-visible'),pv=d.events.find(e=>e.type==='product-visible');if(expectV3&&!rv)errs.push('Refine never observed during render');if(expectV3&&!pv)errs.push('product never observed during render');if(rv&&rv.t>7000)warn.push('Refine first visible slow '+rv.t+'ms');if(pv&&pv.t>7000)warn.push('first product slow '+pv.t+'ms')}
            }catch(e){if(!errs.some(x=>x.includes('homepage button/link not found')))errs.push(String(e))}
            const safe=String(routes.findIndex(r=>r[1]===handle)+1).padStart(2,'0')+'-'+handle+'-'+mode;
            await page.screenshot({path:`shots/${safe}.png`,fullPage:false}).catch(()=>{});
            const result={name,handle,mode,cardInfo,filter,d,errs,warn};results.push(result);console.log('CUSTOMER_ROUTE',JSON.stringify(result));
            if(errs.length)failures.push({name,handle,mode,errs});if(warn.length)warnings.push({name,handle,mode,warn});await sleep(500);
          }
          await fs.writeFile(`shots/results-${mode}-shard-${shard}.json`,JSON.stringify({results,failures,warnings},null,2));
          await browser.close();
          console.log('CUSTOMER_STRESS_SUMMARY',JSON.stringify({mode,shard,tested:subset.length,failures,warnings}));
          if(failures.length)process.exit(1);
          EOF
          node stress.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-stress-${{ matrix.viewport }}-${{ matrix.shard }}
          path: shots/
          retention-days: 7
