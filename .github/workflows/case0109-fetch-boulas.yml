name: CASE0109 Fetch Boulas Gallery
on:
  push:
    branches: [case0109-boulas-fetch]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Acquire 1965 Boulas gallery with Chromium Playwright
        run: |
          cat > /tmp/fetch_boulas.py <<'PY'
          import os,re,json,time,hashlib
          from urllib.parse import urljoin
          import requests
          from playwright.sync_api import sync_playwright

          PAGE='https://projectdelta-b52.com/new/master-gallery.html#1965-boulas'
          OUT='boulas_1965'
          os.makedirs(OUT,exist_ok=True)
          found={}
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={'width':1600,'height':1200})
              page.goto(PAGE,wait_until='domcontentloaded',timeout=120000)
              page.wait_for_timeout(5000)
              # Try to activate Boulas section explicitly if a matching control exists.
              for sel in ["text=1965 — BOULAS","text=1965 - BOULAS","[href='#1965-boulas']"]:
                  try:
                      loc=page.locator(sel)
                      if loc.count():
                          loc.first.click(timeout=3000)
                          page.wait_for_timeout(2500)
                          break
                  except Exception:
                      pass
              # Collect from DOM attributes likely to carry full images or thumbnails.
              data=page.eval_on_selector_all('img, a', '''els => els.map(e => ({tag:e.tagName,src:e.src||'',href:e.href||'',alt:e.alt||'',title:e.title||'',text:(e.textContent||'').trim(),data:[...e.attributes].reduce((o,a)=>(o[a.name]=a.value,o),{})}))''')
              for item in data:
                  vals=[item.get('src',''),item.get('href','')]+list(item.get('data',{}).values())
                  for v in vals:
                      if not isinstance(v,str): continue
                      m=re.search(r'([^/]*boulas[_-]?(\d+)\.(?:jpe?g|png))',v,re.I)
                      if m:
                          num=int(m.group(2))
                          u=urljoin(page.url,v)
                          # normalize likely relative/absolute url
                          found.setdefault(num,{'url':u,'alt':item.get('alt',''),'title':item.get('title',''),'text':item.get('text','')})
              # Persist page source and screenshot for provenance.
              open(f'{OUT}/master-gallery.html','w',encoding='utf-8').write(page.content())
              page.screenshot(path=f'{OUT}/master-gallery-boulas.png',full_page=True)
              b.close()

          # If DOM exposed only some items, probe the documented sequential naming scheme 1..34.
          # Existing dossier provenance already verifies URLs such as boulas_2, _7, _11, _15, _16, _17.
          base='https://projectdelta-b52.com/1965/boulas_{}.jpg'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          results=[]
          for n in range(1,35):
              candidates=[]
              if n in found: candidates.append(found[n]['url'])
              candidates.append(base.format(n))
              ok=None; content=None; ctype=''
              for u in dict.fromkeys(candidates):
                  try:
                      r=s.get(u,timeout=30)
                      ctype=r.headers.get('content-type','')
                      if r.status_code==200 and len(r.content)>1000 and ('image' in ctype or r.content[:3]==b'\xff\xd8\xff' or r.content[:8]==b'\x89PNG\r\n\x1a\n'):
                          ok=u; content=r.content; break
                  except Exception:
                      pass
              rec={'number':n,'url':ok,'dom':found.get(n),'downloaded':bool(ok)}
              if ok:
                  ext='.png' if content[:8]==b'\x89PNG\r\n\x1a\n' else '.jpg'
                  fn=f'{OUT}/boulas_{n}{ext}'
                  open(fn,'wb').write(content)
                  rec.update({'file':fn,'bytes':len(content),'sha256':hashlib.sha256(content).hexdigest()})
              results.append(rec)
          open(f'{OUT}/manifest.json','w',encoding='utf-8').write(json.dumps(results,indent=2,ensure_ascii=False))
          got=sum(r['downloaded'] for r in results)
          print('downloaded',got,'of 34')
          for r in results: print(r)
          if got != 34:
              raise SystemExit(f'Expected 34 images, got {got}')
          PY
          python /tmp/fetch_boulas.py
      - name: Upload Boulas gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: case0109-boulas-1965-34photos
          path: boulas_1965/
          if-no-files-found: error
