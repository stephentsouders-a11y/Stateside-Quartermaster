name: Sep18 final 503 route retries
on:
  push:
    paths:
      - '.github/workflows/sep18-final-503-retries.yml'
      - '.github/scripts/sep18-final-503-retries.mjs'
permissions: { contents: read }
jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { label: "Connecticut State Militia Units", route: "/collections/state-guard-series-connecticut" }
          - { label: "Rhode Island Independent Military Organizations", route: "/collections/state-guard-series-rhode-island" }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LABEL: ${{ matrix.label }}
      ROUTE: ${{ matrix.route }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/scripts/sep18-final-503-retries.mjs
