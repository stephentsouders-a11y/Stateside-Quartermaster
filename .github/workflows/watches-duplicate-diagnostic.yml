name: Watches duplicate diagnostic
on:
  push:
    paths:
      - '.github/workflows/watches-duplicate-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Diagnose Watches
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          const browser=await chromium.launch({headless:true}); const page=await browser.newPage({viewport:{width:1440,height:1000}}); const errors=[]; page.on('pageerror',e=>errors.push(e.message));
          await page.goto('https://www.statesideqm.com/collections/watches',{waitUntil:'domcontentloaded',timeout:60000}); await page.waitForTimeout(8000);
          const state=await page.evaluate(()=>{const vis=e=>e.getClientRects().length>0&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden'; const grids=[...document.querySelectorAll('#MainContent .product-grid,#MainContent .sq-refine-v3-grid')].map(g=>({id:g.id,cls:g.className,visible:vis(g),top:g.getBoundingClientRect().top+scrollY,count:g.querySelectorAll('.product-grid__item').length,links:[...new Set([...g.querySelectorAll('a[href*="/products/"]')].map(a=>new URL(a.href).pathname))],html:g.outerHTML.slice(0,2000)})); return {url:location.href,theme:window.Shopify?.theme,main:document.querySelector('#MainContent')?.className,layouts:document.querySelectorAll('.sq-refine-v3-layout').length,grids,collectionComponents:[...document.querySelectorAll('#MainContent collection-component')].map(x=>({visible:vis(x),cls:x.className,gridCount:x.querySelectorAll('.product-grid').length,top:x.getBoundingClientRect().top+scrollY}))};});
          await page.screenshot({path:'watches-before.png',fullPage:true}); await browser.close(); fs.writeFileSync('watches-diagnostic.json',JSON.stringify({errors,state},null,2)); console.log(JSON.stringify({errors,state},null,2));
          EOF
          node diag.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: watches-before
          path: |
            watches-before.png
            watches-diagnostic.json
      - name: Commit diagnosis
        run: |
          mkdir -p audit-output
          cp watches-diagnostic.json audit-output/watches-diagnostic.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add audit-output/watches-diagnostic.json
          git diff --cached --quiet || git commit -m 'test(watches): save duplicate diagnosis [skip ci]'
          git push
