name: Storefront Chromium refine semantic audit v2
on:
  push:
    paths:
      - '.github/workflows/storefront-refine-semantic-audit-v2.yml'
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 fast-xml-parser@4.5.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Audit dynamic Refine checkboxes and product fit
        env:
          BASE: https://www.statesideqm.com
          SHARD: ${{ matrix.shard }}
          SHARDS: '4'
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { XMLParser } from 'fast-xml-parser';
          import fs from 'fs'; import crypto from 'crypto';
          const BASE=process.env.BASE, shard=+process.env.SHARD, shards=+process.env.SHARDS;
          const parser=new XMLParser({ignoreAttributes:false}), OUT='out'; fs.mkdirSync(`${OUT}/screens`,{recursive:true});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms)); const H=s=>parseInt(crypto.createHash('sha1').update(s).digest('hex').slice(0,8),16); const safe=s=>crypto.createHash('sha1').update(s).digest('hex').slice(0,12);
          const norm=raw=>{try{const u=new URL(raw,BASE);if(u.origin!==new URL(BASE).origin||!u.pathname.startsWith('/collections/'))return null;u.search='';u.hash='';return u.pathname}catch{return null}};
          async function routes(){const x=parser.parse(await (await fetch(`${BASE}/sitemap.xml`)).text());let maps=x?.sitemapindex?.sitemap||[];if(!Array.isArray(maps))maps=[maps];const out=new Set();for(const m of maps){if(!/sitemap_collections/i.test(m.loc||''))continue;const sx=parser.parse(await (await fetch(m.loc)).text());let us=sx?.urlset?.url||[];if(!Array.isArray(us))us=[us];for(const z of us){const n=norm(z.loc);if(n)out.add(n)}}return [...out].filter(p=>H(p)%shards===shard).sort()}
          function mismatch(label,titles){const l=label.toLowerCase(),bad=[];for(const title of titles){const t=title.toLowerCase();if(/chest rigs?/.test(l)&&/\bbelt\b|buckle|waist belt|duty belt|web belt/.test(t))bad.push({title,why:'belt-like product under Chest Rigs'});if(/\bbelts?\b/.test(l)&&/chest rig|plate carrier|body armor|helmet/.test(t))bad.push({title,why:'carrier/armor product under Belts'});if(/helmets?/.test(l)&&/\bboot|glove|belt|shirt|pants?|trouser|backpack|chest rig/.test(t))bad.push({title,why:'non-helmet product under Helmets'});if(/flashlight|lighting/.test(l)&&/shirt|pants?|trouser|boot|belt|patch|insignia|book/.test(t))bad.push({title,why:'non-lighting product'});if(/first aid|medical|ifak/.test(l)&&/shirt|pants?|trouser|boot|belt buckle|book|flag/.test(t))bad.push({title,why:'obvious non-medical product'});if(/footwear|boots?/.test(l)&&/shirt|pants?|trouser|belt|patch|insignia|chest rig|plate carrier/.test(t))bad.push({title,why:'non-footwear product'});if(/gloves?/.test(l)&&/shirt|pants?|trouser|boot|belt|patch|insignia|chest rig/.test(t))bad.push({title,why:'non-glove product'});if(/eyewear|glasses|goggles/.test(l)&&/shirt|pants?|trouser|boot|belt|patch|insignia|chest rig/.test(t))bad.push({title,why:'non-eyewear product'});if(/knives|knife|axes|multi-tools?/.test(l)&&/shirt|pants?|trouser|boot|belt|patch|insignia|chest rig|plate carrier/.test(t))bad.push({title,why:'obvious non-tool product'})}return bad.slice(0,50)}
          const browser=await chromium.launch({headless:true}), rs=await routes(), results=[];
          for(let ri=0;ri<rs.length;ri++){const path=rs[ri],ctx=await browser.newContext({viewport:{width:1365,height:900}}),page=await ctx.newPage();page.setDefaultTimeout(15000);page.setDefaultNavigationTimeout(45000);const rec={path,status:null,h1:'',controls:[],errors:[],challenge:false};page.on('pageerror',e=>rec.errors.push(e.message));
            try{const res=await page.goto(new URL(path,BASE).toString(),{waitUntil:'domcontentloaded'});rec.status=res?.status()??null;await page.waitForTimeout(1200);rec.challenge=await page.evaluate(()=>/connection needs to be verified|verify you are human|just a moment/i.test((document.title||'')+' '+(document.body?.innerText||''))).catch(()=>false);if(rec.status===200&&!rec.challenge){await page.waitForFunction(()=>document.querySelector('.sq-global-refine-sidebar')||document.querySelector('.sq-refine-taxonomy'),null,{timeout:9000}).catch(()=>{});await page.waitForFunction(()=>document.querySelector('.sq-global-refine-sidebar input[type="checkbox"],.sq-refine-taxonomy input[type="checkbox"]'),null,{timeout:9000}).catch(()=>{});rec.h1=((await page.locator('h1').first().textContent().catch(()=>''))||'').trim();const controls=await page.locator('.sq-global-refine-sidebar input[type=checkbox],.sq-refine-taxonomy input[type=checkbox]').evaluateAll(xs=>xs.map((x,i)=>({i,label:x.getAttribute('aria-label')||x.closest('.sq-global-refine-sidebar__choice')?.innerText||x.value||'',value:x.value||''})).filter(x=>x.label));for(let ci=0;ci<controls.length;ci++){const c=controls[ci];let outcome='PASS',titles=[],bad=[],error=null;try{const input=page.locator('.sq-global-refine-sidebar input[type=checkbox],.sq-refine-taxonomy input[type=checkbox]').nth(ci);await input.scrollIntoViewIfNeeded();await input.click({timeout:10000});await page.waitForTimeout(700);titles=await page.locator('#MainContent a[href*="/products/"]:visible').evaluateAll(as=>[...new Set(as.map(a=>(a.closest('.product-card,.product-grid__item,[class*=product]')?.innerText||a.innerText||'').replace(/\s+/g,' ').trim().split('\n')[0]).filter(Boolean))].slice(0,100)).catch(()=>[]);bad=mismatch(c.label,titles);const body=((await page.locator('#MainContent').innerText().catch(()=>''))||'').slice(0,7000);if(/something went wrong|internal server error|there was a problem/i.test((await page.title())+' '+body))outcome='FAIL_ERROR_PAGE';if(bad.length)outcome='FAIL_SEMANTIC_CANDIDATES';if(await input.isChecked().catch(()=>false)){await input.click({timeout:10000}).catch(()=>{});await page.waitForTimeout(250)}}catch(e){outcome='FAIL_EXCEPTION';error=String(e);await page.goto(new URL(path,BASE).toString(),{waitUntil:'domcontentloaded'}).catch(()=>{});await page.waitForTimeout(500)}rec.controls.push({label:c.label,value:c.value,outcome,productSample:titles.length,semanticCandidates:bad,error})}await page.screenshot({path:`${OUT}/screens/${String(ri+1).padStart(4,'0')}-${safe(path)}.png`,fullPage:false}).catch(()=>{})}}catch(e){rec.errors.push('fatal:'+String(e))}await ctx.close();rec.failedControls=rec.controls.filter(c=>c.outcome!=='PASS').length;rec.fail=(rec.status!==200&&!rec.challenge)||rec.errors.length>0||rec.failedControls>0;results.push(rec);fs.writeFileSync(`${OUT}/results-${shard}.json`,JSON.stringify(results,null,2));await sleep(1600)}
          await browser.close();const summary={shard,routes:results.length,challengeRoutes:results.filter(r=>r.challenge).length,controls:results.reduce((n,r)=>n+r.controls.length,0),failedRoutes:results.filter(r=>r.fail).length,failedControls:results.reduce((n,r)=>n+r.failedControls,0),semanticCandidates:results.reduce((n,r)=>n+r.controls.reduce((m,c)=>m+c.semanticCandidates.length,0),0)};fs.writeFileSync(`${OUT}/summary-${shard}.json`,JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));if(summary.failedRoutes)process.exitCode=2;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-semantic-v2-${{ matrix.shard }}
          path: out
          retention-days: 7
