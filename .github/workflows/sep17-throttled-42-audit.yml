name: Sep17 throttled current-theme 42 audit
on:
  push:
    paths:
      - '.github/workflows/sep17-throttled-42-audit.yml'
      - '.github/scripts/sep17-throttled-42-audit.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [1,2,3,4,5,6]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Audit batch ${{ matrix.batch }}
        run: node .github/scripts/sep17-throttled-42-audit.mjs ${{ matrix.batch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep17-42-audit-batch-${{ matrix.batch }}
          path: sep17-42-audit/
          if-no-files-found: warn
          retention-days: 7
