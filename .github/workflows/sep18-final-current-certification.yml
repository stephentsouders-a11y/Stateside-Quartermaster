name: Sep18 final current draft load certification
on:
  push:
    paths:
      - '.github/workflows/sep18-final-current-certification.yml'
      - '.github/scripts/sep18-final-cert-discover.mjs'
      - '.github/scripts/sep18-final-cert-route.mjs'
      - '.github/scripts/sep18-final-cert-aggregate.mjs'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      home_count: ${{ steps.discover.outputs.home_count }}
      sg_count: ${{ steps.discover.outputs.sg_count }}
      total: ${{ steps.discover.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - id: discover
        run: node .github/scripts/sep18-final-cert-discover.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sep18-final-cert-discovery-${{ github.run_id }}
          path: sep18-final-cert-discovery/
          retention-days: 14
  audit:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KEY: ${{ matrix.key }}
      ROUTE_B64: ${{ matrix.routeB64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/scripts/sep18-final-cert-route.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep18-final-cert-${{ matrix.key }}-${{ github.run_id }}
          path: sep18-final-cert-${{ matrix.key }}/
          if-no-files-found: warn
          retention-days: 14
  aggregate:
    needs: [discover, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sep18-final-cert-*-${{ github.run_id }}
          path: sep18-final-cert-all
      - run: node .github/scripts/sep18-final-cert-aggregate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep18-final-cert-summary-${{ github.run_id }}
          path: sep18-final-cert-summary/
          retention-days: 14
