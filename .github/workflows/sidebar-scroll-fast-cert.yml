name: Fast all-sidebar scroll certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/sidebar-scroll-fast-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify all V3 sidebars
        run: |
          cat > fast-cert.mjs <<'EOF'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const theme=158561894555;
          const controller=fs.readFileSync('snippets/sq-refine-v3.liquid','utf8');
          const match=controller.match(/var ROOTS=new Set\(\[([^\]]+)\]\)/);
          const roots=Array.from(match?.[1]?.matchAll(/'([^']+)'/g)||[],m=>m[1]);
          if(roots.length!==40)throw new Error('Expected 40 V3 roots, got '+roots.length);
          const browser=await chromium.launch({headless:true});
          const jobs=roots.flatMap(handle=>[{handle,width:1366,height:768},{handle,width:390,height:844}]);
          const results=[];let cursor=0;
          async function check(job){
            const ctx=await browser.newContext({viewport:{width:job.width,height:job.height}}),p=await ctx.newPage();
            const r={...job,passed:false};
            try{
              const res=await p.goto(`https://www.statesideqm.com/collections/${job.handle}?preview_theme_id=${theme}`,{waitUntil:'domcontentloaded',timeout:60000});
              if(res?.status()!==200)throw new Error('HTTP '+res?.status());
              await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true'&&document.querySelector('#MainContent .sq-refine-v3-sidebar'),null,{timeout:35000});
              await p.waitForTimeout(500);
              const side=p.locator('#MainContent .sq-refine-v3-sidebar');
              if(await side.count()!==1)throw new Error('Sidebar count '+await side.count());
              const before=await side.evaluate(e=>{const s=getComputedStyle(e),b=getComputedStyle(e,'::before'),t=e.querySelector('.sq-refine-v3-sidebar__title');return{bg:s.backgroundColor,pseudo:b.content,header:t?getComputedStyle(t).backgroundColor:'',max:e.scrollHeight-e.clientHeight}});
              const groups=side.locator(':scope > details');for(let i=0;i<await groups.count();i++){const d=groups.nth(i);if(await d.isVisible()&&!await d.evaluate(e=>e.open)){await d.locator(':scope > summary').focus();await p.keyboard.press('Enter');}}
              if(job.width>900){await side.evaluate(e=>e.scrollTop=e.scrollHeight);await p.waitForTimeout(150);}else{await side.evaluate(e=>window.scrollTo(0,Math.max(0,e.getBoundingClientRect().top+window.scrollY+e.scrollHeight-innerHeight)));await p.waitForTimeout(150);}
              const after=await side.evaluate(e=>{const s=getComputedStyle(e),b=getComputedStyle(e,'::before'),t=e.querySelector('.sq-refine-v3-sidebar__title');return{bg:s.backgroundColor,pseudo:b.content,header:t?getComputedStyle(t).backgroundColor:'',scrollTop:e.scrollTop,max:e.scrollHeight-e.clientHeight,pageY:window.scrollY}});
              const expectedWhite='rgb(255, 255, 255)',expectedNavy='rgb(8, 40, 63)';
              r.before=before;r.after=after;
              r.passed=before.bg===expectedWhite&&after.bg===expectedWhite&&before.pseudo==='none'&&after.pseudo==='none'&&before.header===expectedNavy&&after.header===expectedNavy&&(job.width<=900||after.max<=0||after.scrollTop>0);
              if(!r.passed)throw new Error('Style/scroll assertion failed');
            }catch(e){r.error=String(e);await p.screenshot({path:`failure-${job.handle}-${job.width}.png`,fullPage:true}).catch(()=>{});}finally{await ctx.close();}
            results.push(r);console.log('CASE '+JSON.stringify(r));
          }
          await Promise.all(Array.from({length:10},async()=>{while(cursor<jobs.length)await check(jobs[cursor++]);}));
          await browser.close();
          const failures=results.filter(r=>!r.passed);
          fs.writeFileSync('fast-cert-report.json',JSON.stringify({theme,total:results.length,passed:results.length-failures.length,failed:failures.length,failures,results},null,2));
          console.log('FINAL '+JSON.stringify({total:results.length,passed:results.length-failures.length,failed:failures.length,failures:failures.map(x=>({handle:x.handle,width:x.width,error:x.error}))}));
          if(failures.length)process.exit(1);
          EOF
          node fast-cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-all-sidebar-cert
          path: |
            fast-cert-report.json
            failure-*.png
          retention-days: 14
