name: Sep12 Art Refine physical hit v3
on:
  push:
    paths:
      - '.github/workflows/sep12-art-refine-hit-v3.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Physical exact-checkbox retest
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
        run: |
          cat > t.mjs <<'EOF'
          import {chromium} from 'playwright';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const labels=['Ben Cantwell Tactical, Weapons & Morale Art','Don Troiani Historical Military Art','Historical Art Prints'];
          const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:1365,height:900}});p.setDefaultTimeout(12000);
          const u=()=>{const x=new URL('/collections/art',process.env.BASE);x.searchParams.set('preview_theme_id',process.env.THEME);return x.toString()};
          async function strip(){await p.evaluate(()=>{for(const s of ['#PBarNextFrameWrapper','#PBarNextFrame','iframe[src*="shopifycloud/preview-bar"]'])document.querySelectorAll(s).forEach(e=>{try{e.hidePopover?.()}catch{}e.style.setProperty('display','none','important');e.style.setProperty('pointer-events','none','important')})})}
          async function load(){let e;for(let n=0;n<6;n++){try{const r=await p.goto(u(),{waitUntil:'domcontentloaded',timeout:35000});if(!r||r.status()===429||r.status()>=500){e=new Error('HTTP '+(r?.status()||0));await sleep(1800*(n+1));continue}await p.locator('#MainContent .sq-refine-v3-sidebar').waitFor({state:'attached'});await p.locator('#MainContent details.sq-refine-v3-group').evaluateAll(ds=>ds.forEach(d=>d.open=true)).catch(()=>{});await strip();await sleep(350);return}catch(x){e=x;await sleep(1800*(n+1))}}throw e}
          async function find(label){for(let n=0;n<20;n++){const i=await p.locator('#MainContent .sq-refine-v3-choice input[type=checkbox]').evaluateAll((xs,l)=>xs.findIndex(x=>((x.getAttribute('aria-label')||x.parentElement?.querySelector('span')?.textContent||'').replace(/\s+/g,' ').trim())===l),label);if(i>=0)return p.locator('#MainContent .sq-refine-v3-choice input[type=checkbox]').nth(i);await sleep(100)}throw new Error('not found '+label)}
          let failed=0;
          for(const label of labels){await load();let x=await find(label);await x.scrollIntoViewIfNeeded();await strip();await sleep(100);x=await find(label);const box=await x.boundingBox();const hit=await p.evaluate(({x,y})=>{const e=document.elementFromPoint(x,y);return {tag:e?.tagName,html:e?.outerHTML?.slice(0,250)}},{x:box.x+box.width/2,y:box.y+box.height/2});const before=p.url();await p.mouse.click(box.x+box.width/2,box.y+box.height/2);await Promise.race([p.waitForURL(z=>z.toString()!==before,{timeout:6000}).catch(()=>{}),sleep(1200)]);const after=p.url();const checked=after===before?await (await find(label)).isChecked().catch(()=>false):null;const owner=await p.evaluate(()=>window.__sqRefineV3LastBoxOwner||null).catch(()=>null);const pass=hit.tag==='INPUT'&&(after!==before||checked===true);if(!pass)failed++;console.log(JSON.stringify({label,hit,before,after,checked,owner,pass}))}
          await b.close();if(failed)process.exitCode=2;
          EOF
          node t.mjs
