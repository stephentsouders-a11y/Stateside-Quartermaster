name: Airsoft Refine every-choice Chromium audit

on:
  push:
    paths:
      - '.github/workflows/airsoft-refine-every-choice-chromium.yml'
      - 'snippets/sq-refine-v3.liquid'
      - 'snippets/sq-refine-v3-layout-fix.liquid'
      - 'sections/sq-refine-v3-product-grid.liquid'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  every-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click every Airsoft Refine Products choice one by one
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const themeId='158561894555';
          const basePath='/collections/airsoft-milsim';
          const base=`https://www.statesideqm.com${basePath}?preview_theme_id=${themeId}&sq_per_page=50`;
          const expectedCategories=new Map([
            ['SQ Airsoft Accessories','airsoft-milsim-airsoft-accessories'],
            ['SQ Ammo & Magazines','airsoft-milsim-airsoft-ammo-magazines'],
            ['Batteries & Chargers','airsoft-milsim-batteries-chargers'],
            ['Field Gear & Training','airsoft-milsim-field-gear-training'],
            ['Internal Parts & Electronics','airsoft-milsim-internal-parts-electronics'],
            ['Protection & Apparel','airsoft-milsim-protection-apparel'],
            ['SQ Replicas & Launchers','airsoft-milsim-airsoft-replicas-launchers'],
            ['Starter Kits & Bundles','airsoft-milsim-starter-kits-bundles'],
          ]);

          fs.mkdirSync('out/screens',{recursive:true});
          const report={base,startedAt:new Date().toISOString(),choices:[],failures:[],warnings:[]};
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
          const page=await ctx.newPage();
          page.setDefaultNavigationTimeout(90000);
          page.setDefaultTimeout(30000);
          const runtimeErrors=[];
          page.on('pageerror',e=>runtimeErrors.push(String(e)));

          async function ready(){
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:30000});
            await page.waitForTimeout(400);
          }
          async function openBase(){
            const r=await page.goto(base,{waitUntil:'domcontentloaded'});
            if(r?.status()!==200) throw new Error(`Base HTTP ${r?.status()}`);
            await ready();
          }
          const visible=async loc=>await loc.evaluate(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2});
          const safe=s=>(s||'choice').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,80).toLowerCase();

          await openBase();
          const initial=await page.evaluate(()=>{
            const main=document.querySelector('#MainContent');
            const side=main?.querySelector('.sq-refine-v3-sidebar,.sq-global-refine-sidebar');
            const old=[...main.querySelectorAll('.facets-block-wrapper--horizontal .facets__filters-wrapper,.facets-toggle__wrapper,theme-drawer#filters-drawer')].filter(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2}).length;
            const oldButtons=[...main.querySelectorAll('.sq-subcategory-section,.sq-subcategory-card')].filter(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2}).length;
            return {ready:main?.dataset.sqRefineV3Ready||null,sidebar:!!side,oldNativeVisible:old,oldButtonsVisible:oldButtons,stateGuard:/State Guard Uniform Builder|Build Your Uniform|PT Uniform/i.test(main?.innerText||'')};
          });
          if(!initial.sidebar) report.failures.push('Refine Products sidebar missing');
          if(initial.oldNativeVisible) report.failures.push(`Old native filter surfaces visible: ${initial.oldNativeVisible}`);
          if(initial.oldButtonsVisible) report.failures.push(`Legacy Shop-by-Category button surfaces visible: ${initial.oldButtonsVisible}`);
          if(initial.stateGuard) report.failures.push('State Guard builder contamination visible');

          const inventory=await page.evaluate(()=>{
            const side=document.querySelector('#MainContent .sq-refine-v3-sidebar,#MainContent .sq-global-refine-sidebar');
            if(!side)return [];
            return [...side.querySelectorAll('details.sq-refine-v3-group')].flatMap((d,gi)=>{
              const group=(d.querySelector(':scope > summary')?.textContent||'').replace(/\s+/g,' ').trim();
              return [...d.querySelectorAll('input[type="checkbox"]')].map((i,ii)=>({
                group,gi,ii,value:i.value||'',target:i.dataset.target||'',filterName:i.dataset.filterName||'',polish:i.dataset.sqPolishParam||'',label:(i.closest('.sq-refine-v3-choice')?.innerText||i.value||'').replace(/\s+/g,' ').trim()
              }));
            });
          });
          if(!inventory.length) report.failures.push('No Refine checkbox choices found');

          for(let index=0;index<inventory.length;index++){
            const meta=inventory[index];
            await openBase();
            const details=page.locator('#MainContent details.sq-refine-v3-group').nth(meta.gi);
            if(!(await details.getAttribute('open'))) await details.locator(':scope > summary').click();
            const input=details.locator('input[type="checkbox"]').nth(meta.ii);
            const row=input.locator('xpath=ancestor::*[contains(concat(" ",normalize-space(@class)," ")," sq-refine-v3-choice ")][1]');
            if(!(await visible(input).catch(()=>false)) && await row.count()) await row.scrollIntoViewIfNeeded().catch(()=>{});
            const beforeUrl=page.url();
            let clickError=null;
            try{
              await Promise.all([
                page.waitForURL(u=>u.href!==beforeUrl,{timeout:15000}).catch(()=>null),
                input.click({force:true})
              ]);
              await page.waitForLoadState('domcontentloaded').catch(()=>{});
              await ready().catch(()=>{});
            }catch(e){clickError=String(e)}

            const u=new URL(page.url());
            const state=await page.evaluate(()=>{
              const main=document.querySelector('#MainContent');
              const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};
              const cards=[...main.querySelectorAll('.sq-refine-v3-results .product-grid > *')].filter(vis);
              const titles=cards.map(c=>(c.querySelector('a[href*="/products/"]')?.textContent||c.textContent||'').replace(/\s+/g,' ').trim()).filter(Boolean);
              return {ready:main?.dataset.sqRefineV3Ready||null,cards:cards.length,titles,error:main?.dataset.sqRefineV3Error||null,duplicate:[...main.querySelectorAll('.product-grid')].filter(g=>vis(g)&&!main.querySelector('.sq-refine-v3-results')?.contains(g)&&g.querySelector('a[href*="/products/"]')).length};
            }).catch(()=>({ready:null,cards:0,titles:[],error:'evaluation failed',duplicate:0}));

            const errors=[];
            if(clickError) errors.push(`click/navigation error: ${clickError}`);
            if(state.ready!=='true') errors.push(`V3 not ready (${state.ready})`);
            if(state.duplicate) errors.push(`duplicate product grids: ${state.duplicate}`);
            if(meta.group==='Shop by Category'){
              const expected=expectedCategories.get(meta.label);
              if(!expected) errors.push(`unexpected category label ${meta.label}`);
              else if(u.pathname!==`/collections/${expected}`) errors.push(`wrong category target ${u.pathname}; expected /collections/${expected}`);
              if(state.cards<1) errors.push('category returned zero visible product cards');
            } else {
              const param=meta.filterName||meta.polish;
              if(param && !u.searchParams.getAll(param).includes(meta.value)) errors.push(`filter URL missing ${param}=${meta.value}`);
              if(!param && !meta.target) errors.push('checkbox has no target/filter metadata');
            }
            const entry={index:index+1,...meta,url:u.href,cards:state.cards,titles:state.titles,errors};
            report.choices.push(entry);
            if(errors.length){
              report.failures.push(`${meta.group} > ${meta.label}: ${errors.join('; ')}`);
              await page.screenshot({path:`out/screens/${String(index+1).padStart(3,'0')}-${safe(meta.group)}-${safe(meta.label)}.png`,fullPage:true}).catch(()=>{});
            }
          }

          report.runtimeErrors=runtimeErrors;
          report.finishedAt=new Date().toISOString();
          fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({totalChoices:report.choices.length,failures:report.failures,runtimeErrors:runtimeErrors.slice(0,20),choices:report.choices.map(x=>({group:x.group,label:x.label,url:x.url,cards:x.cards,errors:x.errors}))},null,2));
          await browser.close();
          if(report.failures.length || runtimeErrors.length) process.exitCode=2;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airsoft-refine-every-choice-chromium
          path: out
          retention-days: 14
