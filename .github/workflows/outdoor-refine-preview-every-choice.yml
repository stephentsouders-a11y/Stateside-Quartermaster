name: Outdoor Refine preview every-choice Chromium certification

on:
  push:
    paths:
      - '.github/workflows/outdoor-refine-preview-every-choice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  every-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Test every Outdoor Refine choice on current draft theme
        run: |
          mkdir -p out/screens
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const theme='158561894555';
          const root='outdoor-preparedness-gear';
          const base=`https://www.statesideqm.com/collections/${root}?preview_theme_id=${theme}&sq_per_page=50`;
          const expected=new Map([
            ['Bushcraft, Field Tools & Carabiners','bushcraft-field-tools-carabiners'],
            ['Camp Cooking & Utensils','camp-cooking-utensils'],
            ['Cold Weather & Thermal Gear','cold-weather-thermal-gear'],
            ['Emergency Food & Camp Meals','emergency-food-camp-meals-1'],
            ['Fire Starting & Hand Warmers','fire-starting-hand-warmers'],
            ['Fishing, Hunting & Trail Gear','fishing-hunting-trail-gear'],
            ['Navigation, Binoculars & Signaling','navigation-binoculars-signaling'],
            ['Outdoor Lighting & Headlamps','outdoor-lighting-headlamps-1'],
            ['Outdoor Packs, Pouches & Dry Bags','outdoor-packs-pouches-dry-bags'],
            ['Sleeping Systems','sleeping-systems'],
            ['Solar & Portable Power','solar-portable-power-1'],
            ['Survival & Emergency Kits','survival-emergency-kits-1'],
            ['Tents, Shelters & Weather Protection','tents-shelters-weather-protection'],
            ['Water & Hydration','water-hydration-1']
          ]);
          const report={base,initial:null,inventory:[],choices:[],failures:[],consoleErrors:[]};
          const browser=await chromium.launch({headless:true});
          async function open(label){
            const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
            const page=await ctx.newPage();
            page.setDefaultTimeout(30000); page.setDefaultNavigationTimeout(90000);
            page.on('pageerror',e=>report.consoleErrors.push(`${label}: pageerror ${e}`));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon|ERR_BLOCKED_BY_CLIENT/i.test(m.text()))report.consoleErrors.push(`${label}: ${m.text()}`)});
            const r=await page.goto(base,{waitUntil:'domcontentloaded'});
            if(r?.status()!==200) throw new Error(`HTTP ${r?.status()}`);
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:45000});
            await page.waitForTimeout(800);
            return {ctx,page};
          }
          const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};
          try{
            const seed=await open('seed');
            report.initial=await seed.page.evaluate(()=>{const m=document.querySelector('#MainContent'),v=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};return {theme:window.Shopify?.theme?.id||null,ready:m?.dataset.sqRefineV3Ready||null,sidebar:[...m.querySelectorAll('.sq-refine-v3-sidebar')].filter(v).length,legacyCards:[...m.querySelectorAll('.sq-subcategory-card')].filter(v).length,nativeFilters:[...m.querySelectorAll('.facets-block-wrapper--horizontal .facets__filters-wrapper,.facets-toggle__wrapper,theme-drawer#filters-drawer')].filter(v).length,visibleGrids:[...m.querySelectorAll('.product-grid')].filter(g=>v(g)&&g.querySelector('a[href*="/products/"]')).length,stateGuard:/State Guard Uniform Builder|Build Your Uniform|PT Uniform/i.test(m.innerText||'')}});
            if(report.initial.sidebar!==1) report.failures.push(`sidebar count ${report.initial.sidebar}`);
            if(report.initial.legacyCards) report.failures.push(`legacy category cards visible ${report.initial.legacyCards}`);
            if(report.initial.nativeFilters) report.failures.push(`native filters visible ${report.initial.nativeFilters}`);
            if(report.initial.visibleGrids!==1) report.failures.push(`visible product grids ${report.initial.visibleGrids}`);
            if(report.initial.stateGuard) report.failures.push('State Guard contamination');
            report.inventory=await seed.page.evaluate(()=>{const side=document.querySelector('#MainContent .sq-refine-v3-sidebar');return [...side.querySelectorAll('details.sq-refine-v3-group')].flatMap((d,gi)=>{const group=(d.querySelector(':scope > summary')?.textContent||'').replace(/\s+/g,' ').trim();return [...d.querySelectorAll('input[type="checkbox"]')].map((i,ii)=>({group,gi,ii,label:(i.closest('label')?.querySelector('span')?.textContent||i.closest('label')?.textContent||i.value||'').replace(/\s+/g,' ').trim(),value:i.value||'',target:i.dataset.target||'',filterName:i.dataset.filterName||'',polish:i.dataset.sqPolishParam||''}))})});
            await seed.ctx.close();
            const cats=report.inventory.filter(x=>x.group==='Shop by Category');
            if(cats.length!==14) report.failures.push(`Shop by Category count ${cats.length}, expected 14`);
            for(const [lab] of expected) if(!cats.some(x=>x.label===lab)) report.failures.push(`missing category ${lab}`);
            for(const c of cats) if(!expected.has(c.label)) report.failures.push(`unexpected category ${c.label}`);
            for(let n=0;n<report.inventory.length;n++){
              const meta=report.inventory[n]; let s;
              try{
                s=await open(`choice-${n+1}`); const p=s.page;
                const d=p.locator('#MainContent details.sq-refine-v3-group').nth(meta.gi);
                if(!(await d.getAttribute('open'))) await d.locator(':scope > summary').click();
                const input=d.locator('input[type="checkbox"]').nth(meta.ii); await input.scrollIntoViewIfNeeded();
                const before=p.url(); await input.click({force:true});
                await p.waitForURL(u=>u.href!==before,{timeout:20000}).catch(()=>{}); await p.waitForLoadState('domcontentloaded').catch(()=>{}); await p.waitForTimeout(900);
                await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:30000}).catch(()=>{});
                const u=new URL(p.url());
                const state=await p.evaluate(()=>{const m=document.querySelector('#MainContent'),v=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};const rg=m.querySelector('.sq-refine-v3-results .product-grid');return {ready:m?.dataset.sqRefineV3Ready||null,cards:rg?[...rg.children].filter(v).length:0,grids:[...m.querySelectorAll('.product-grid')].filter(g=>v(g)&&g.querySelector('a[href*="/products/"]')).length,legacy:[...m.querySelectorAll('.sq-subcategory-card')].filter(v).length,native:[...m.querySelectorAll('.facets-block-wrapper--horizontal .facets__filters-wrapper,.facets-toggle__wrapper,theme-drawer#filters-drawer')].filter(v).length}});
                const errors=[];
                if(state.ready!=='true') errors.push(`ready=${state.ready}`);
                if(state.grids!==1) errors.push(`grids=${state.grids}`);
                if(state.legacy) errors.push(`legacy=${state.legacy}`);
                if(state.native) errors.push(`native=${state.native}`);
                if(meta.group==='Shop by Category'){
                  const h=expected.get(meta.label); if(!h) errors.push('unexpected category'); else if(u.pathname!==`/collections/${h}`) errors.push(`path ${u.pathname} expected /collections/${h}`); if(state.cards<1) errors.push('zero products');
                }else{
                  if(meta.target){const t=new URL(meta.target,base);if(u.pathname!==t.pathname)errors.push(`target path ${u.pathname} expected ${t.pathname}`)} else {const param=meta.filterName||meta.polish;if(!param)errors.push('no filter metadata');else if(!u.searchParams.getAll(param).includes(meta.value))errors.push(`missing ${param}=${meta.value}`)}
                  if(state.cards<1) errors.push('zero products');
                }
                report.choices.push({...meta,url:u.href,cards:state.cards,errors});
                if(errors.length){report.failures.push(`${meta.group} > ${meta.label}: ${errors.join('; ')}`);await p.screenshot({path:`out/screens/${String(n+1).padStart(3,'0')}.png`,fullPage:true}).catch(()=>{})}
              }catch(e){report.failures.push(`${meta.group} > ${meta.label}: ${String(e)}`)} finally {if(s)await s.ctx.close().catch(()=>{})}
            }
          }catch(e){report.failures.push(`fatal: ${String(e)}`)}
          fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({initial:report.initial,total:report.inventory.length,groups:[...new Set(report.inventory.map(x=>x.group))],tested:report.choices.length,failures:report.failures,consoleErrors:report.consoleErrors.slice(0,30)},null,2));
          await browser.close();
          if(report.failures.length||report.consoleErrors.length) process.exitCode=2;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outdoor-refine-preview-every-choice
          path: out
          retention-days: 14
