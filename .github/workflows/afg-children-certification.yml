name: AFG child branch certification
on:
  push:
    paths:
      - '.github/workflows/afg-children-certification.yml'
permissions:
  contents: read
jobs:
  certify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        branch: [army, navy, air-force, marine-corps, coast-guard, space-force]
        viewport: [desktop, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Certify branch
        env:
          BRANCH: ${{ matrix.branch }}
          VIEWPORT: ${{ matrix.viewport }}
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base='https://www.statesideqm.com',theme='158561894555',branch=process.env.BRANCH;const vp=process.env.VIEWPORT==='mobile'?{width:390,height:844}:{width:1440,height:1100};
          const browser=await chromium.launch({headless:true}),ctx=await browser.newContext({viewport:vp}),page=await ctx.newPage();const u=`${base}/collections/armed-forces-gear-u-s-${branch}?preview_theme_id=${theme}`;const start=Date.now();const r=await page.goto(u,{waitUntil:'domcontentloaded',timeout:30000});let state,usable=null;
          for(let i=0;i<35;i++){state=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),t=(m?.innerText||'').replace(/\s+/g,' ').trim();const cards=[...m.querySelectorAll('.sq-third-level__type,.sq-afg-branch-card')].filter(e=>{const r=e.getBoundingClientRect();return r.width>30&&r.height>20});return{loading:/loading items|checking items|tree unavailable|building the customer-facing product tree/i.test(t),cards:cards.length,fake150:/\b150 items\b/i.test(t),availability:[...m.querySelectorAll('a[href*="filter.v.availability"]')].length,broken:[...m.querySelectorAll('img')].filter(x=>x.complete&&x.naturalWidth===0).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,text:t.slice(0,600)}});if(!state.loading&&state.cards>0){usable=Date.now()-start;break}await page.waitForTimeout(200)}
          const failed=r.status()!==200||usable===null||usable>5000||state.loading||state.cards===0||state.fake150||state.availability||state.broken||state.overflow;console.log(JSON.stringify({branch,viewport:process.env.VIEWPORT,status:r.status(),usableMs:usable,failed,...state}));await browser.close();if(failed)process.exitCode=2;
          EOF
          node check.mjs
