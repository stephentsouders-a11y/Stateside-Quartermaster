name: Diagnose Armed Forces Gear page error
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/diagnose-afg-coast-guard.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Map malformed AFG script to owning source
        run: |
          cat > trace.mjs <<'EOF'
          import { chromium } from 'playwright';
          const url='https://www.statesideqm.com/collections/armed-forces-gear?preview_theme_id=158561894555';
          const browser=await chromium.launch({headless:true});
          for(let attempt=1;attempt<=6;attempt++){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage(); let detail=null;
            const cdp=await context.newCDPSession(page); await cdp.send('Runtime.enable');
            cdp.on('Runtime.exceptionThrown',e=>{const d=e.exceptionDetails||{};const desc=d.exception?.description||'';if(desc.includes('SyntaxError'))detail={description:desc,line:Number(d.lineNumber||0),column:Number(d.columnNumber||0),url:d.url||''};});
            let r=null;try{r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000})}catch(e){console.log('GOTO_ERROR '+String(e))}
            const status=r?.status()||0;console.log(`ATTEMPT ${attempt} HTTP ${status}`);
            if(status===200){
              await page.waitForTimeout(2500);
              const raw=await r.text();
              const lines=raw.split(/\r?\n/);
              console.log('DETAIL '+JSON.stringify(detail));
              const target=Math.max(0,(detail?.line||30580)-1);
              console.log(`RAW_LINES ${lines.length} TARGET ${target+1}`);
              for(let n=Math.max(0,target-12);n<Math.min(lines.length,target+13);n++)console.log(String(n+1).padStart(6)+': '+lines[n]);
              const needles=['U.S. Air Force','U.S. Coast Guard','U.S. Space Force','U.S. Marine Corps',',,'];
              for(const needle of needles){let from=0,hits=0;while((from=raw.indexOf(needle,from))!==-1&&hits<20){const a=Math.max(0,from-450),b=Math.min(raw.length,from+needle.length+700);console.log(`RAW_MATCH ${JSON.stringify(needle)} AT ${from}\n`+raw.slice(a,b));from+=needle.length;hits++;}}
              const scriptInfo=[]; const re=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi; let m,idx=0;
              while((m=re.exec(raw))){const text=m[2]||'';if(/U\.S\. Air Force|U\.S\. Coast Guard|armed-forces|branch|refine/i.test(text)){scriptInfo.push({idx,start:m.index,end:re.lastIndex,attrs:m[1].slice(0,500),text:text.slice(0,20000)});}idx++;}
              console.log('MATCHING_SCRIPT_COUNT '+scriptInfo.length);
              for(const s of scriptInfo){console.log(`SCRIPT ${s.idx} START ${s.start} END ${s.end} ATTRS ${s.attrs}\n${s.text}`)}
              const domScripts=await page.evaluate(()=>[...document.scripts].map((s,i)=>({i,id:s.id||'',src:s.src||'',type:s.type||'',parent:s.parentElement?.tagName||'',parentId:s.parentElement?.id||'',parentClass:s.parentElement?.className||'',text:(s.textContent||'').slice(0,20000)})).filter(x=>/U\.S\. Air Force|U\.S\. Coast Guard|armed-forces|branch|refine/i.test(x.text)));
              console.log('DOM_MATCHING_SCRIPTS '+JSON.stringify(domScripts,null,2));
              await context.close();await browser.close();process.exit(detail?0:3);
            }
            await context.close();await new Promise(r=>setTimeout(r,attempt*3000));
          }
          await browser.close();process.exit(2);
          EOF
          node trace.mjs
