name: Diagnose AFG Coast Guard loader
on:
  push:
    paths:
      - '.github/workflows/diagnose-afg-coast-guard.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Locate stale loading elements
        run: |
          cat > diagnose.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
          const page=await ctx.newPage();
          const url='https://www.statesideqm.com/collections/armed-forces-gear-u-s-coast-guard?preview_theme_id=158561894555';
          const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
          console.log('HTTP',r?.status());
          await page.waitForTimeout(7000);
          const data=await page.evaluate(()=>{
            const re=/loading items|checking items|tree unavailable|building the customer-facing product tree|loading all products/i;
            const all=[...document.querySelectorAll('#MainContent *')];
            const hits=all.filter(e=>re.test((e.innerText||'').trim())).map(e=>({tag:e.tagName,id:e.id,cls:String(e.className||''),text:(e.innerText||'').replace(/\s+/g,' ').trim().slice(0,260),parent:e.parentElement?`${e.parentElement.tagName}#${e.parentElement.id}.${String(e.parentElement.className||'')}`:''})).slice(-30);
            const cards=[...document.querySelectorAll('.sq-afg-branch-card')].slice(0,6).map(a=>({href:a.getAttribute('href'),name:a.querySelector('.sq-afg-branch-name')?.textContent?.trim(),meta:a.querySelector('.sq-afg-branch-count')?.textContent?.trim()}));
            return {hits,cards,htmlClass:document.documentElement.className};
          });
          console.log(JSON.stringify(data,null,2));
          await browser.close();
          EOF
          node diagnose.mjs
