name: Diagnose AFG Coast Guard loader
on:
  push:
    paths:
      - '.github/workflows/diagnose-afg-coast-guard.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Locate stale loading elements and script source
        run: |
          cat > diagnose.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
          const page=await ctx.newPage();
          const url='https://www.statesideqm.com/collections/armed-forces-gear-u-s-coast-guard?preview_theme_id=158561894555';
          const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
          console.log('HTTP',r?.status()); await page.waitForTimeout(5000);
          const data=await page.evaluate(()=>{
            const re=/checking items|loading items/i;
            const scripts=[...document.scripts].map((s,i)=>({i,src:s.src||'',attrs:[...s.attributes].reduce((o,a)=>(o[a.name]=a.value,o),{}),text:(s.textContent||'')})).filter(s=>re.test(s.text)).map(s=>({i:s.i,src:s.src,attrs:s.attrs,snippets:[...s.text.matchAll(/.{0,180}(?:Checking items|Loading items).{0,260}/gi)].map(m=>m[0].replace(/\s+/g,' ').slice(0,520)).slice(0,8)}));
            const cards=[...document.querySelectorAll('.sq-third-level__type')].slice(0,8).map(a=>({href:a.getAttribute('href'),type:a.dataset.productType,text:(a.innerText||'').replace(/\s+/g,' ').trim(),count:a.querySelector('.sq-nav-count')?.textContent?.trim()}));
            return {scripts,cards};
          }); console.log(JSON.stringify(data,null,2)); await browser.close();
          EOF
          node diagnose.mjs
