name: Diagnose Armed Forces Gear page error
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/diagnose-afg-coast-guard.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Extract exact malformed AFG document script
        run: |
          cat > trace.mjs <<'EOF'
          import { chromium } from 'playwright';
          const url='https://www.statesideqm.com/collections/armed-forces-gear?preview_theme_id=158561894555';
          const browser=await chromium.launch({headless:true});
          for(let attempt=1;attempt<=5;attempt++){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage(); let detail=null;
            const cdp=await context.newCDPSession(page); await cdp.send('Runtime.enable');
            cdp.on('Runtime.exceptionThrown',e=>{const d=e.exceptionDetails||{};if((d.exception?.description||'').includes('SyntaxError'))detail={line:Number(d.lineNumber||0),column:Number(d.columnNumber||0),url:d.url||''};});
            let r=null;try{r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000})}catch{}
            const status=r?.status()||0;console.log(`ATTEMPT ${attempt} HTTP ${status}`);
            if(status===200){await page.waitForTimeout(3000);const html=await page.content();const lines=html.split(/\n/);console.log('DETAIL '+JSON.stringify(detail));if(detail){for(let n=Math.max(0,detail.line-8);n<Math.min(lines.length,detail.line+9);n++)console.log(String(n+1).padStart(6)+': '+lines[n]);}
              const scripts=await page.evaluate(()=>[...document.scripts].map((s,i)=>({i,src:s.src||'',text:s.textContent||'',outer:s.outerHTML||''})).filter(x=>x.text));
              for(const s of scripts){if(/armed|forces|branch|manufacturer|refine|collection|products/i.test(s.text)){console.log(`INLINE_SCRIPT ${s.i} LEN ${s.text.length}`);console.log(s.text.slice(0,12000));}}
              await context.close();await browser.close();process.exit(0)}
            await context.close();await new Promise(r=>setTimeout(r,attempt*3000));
          }
          await browser.close();process.exit(2);
          EOF
          node trace.mjs
