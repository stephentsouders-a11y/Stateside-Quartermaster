name: Focused ARNG route certification
on:
  push:
    paths:
      - '.github/workflows/diagnose-afg-coast-guard.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Certify ARNG Field Gear and Redemption Tactical
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base='https://www.statesideqm.com',theme='158561894555';
          const routes=[['field-gear','/collections/army-national-guard-series?sq_bfl_category=Field+Gear%2C+Packs+%26+Equipment'],['redemption','/collections/army-national-guard-series?filter.p.vendor=Redemption+Tactical']];
          const browser=await chromium.launch({headless:true});
          for(const [key,route] of routes){for(const [name,vp] of [['desktop',{width:1440,height:1100}],['mobile',{width:390,height:844}]]){const ctx=await browser.newContext({viewport:vp}),page=await ctx.newPage();const u=new URL(route,base);u.searchParams.set('preview_theme_id',theme);const start=Date.now();const r=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:30000});let usable=null,state;
            for(let i=0;i<40;i++){state=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),t=(m?.innerText||'').replace(/\s+/g,' ').trim();const visible=[...m.querySelectorAll('a,.sqbfl-card,.product-card,.product-grid__item')].some(e=>{const r=e.getBoundingClientRect();return r.width>30&&r.height>20});return{loading:/loading items|checking items|tree unavailable|building the customer-facing product tree|loading all products/i.test(t),visible,availability:[...m.querySelectorAll('a[href*="filter.v.availability"]')].length,broken:[...m.querySelectorAll('img')].filter(x=>x.complete&&x.naturalWidth===0).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,text:t.slice(0,700)}});if(!state.loading&&state.visible){usable=Date.now()-start;break}await page.waitForTimeout(150)}
            const failed=r.status()!==200||usable===null||usable>5000||state.loading||!state.visible||state.availability||state.broken||state.overflow;console.log(JSON.stringify({key,name,status:r.status(),usableMs:usable,failed,...state}));await ctx.close();if(failed)process.exitCode=2;}}
          await browser.close();
          EOF
          node check.mjs
