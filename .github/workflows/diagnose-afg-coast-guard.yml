name: Diagnose Armed Forces Gear page error
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/diagnose-afg-coast-guard.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture malformed AFG script and source context
        run: |
          cat > trace.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const url='https://www.statesideqm.com/collections/armed-forces-gear?preview_theme_id=158561894555';
          const browser=await chromium.launch({headless:true});
          let completed=false;
          for(let attempt=1;attempt<=6&&!completed;attempt++){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            const cdp=await context.newCDPSession(page); await cdp.send('Runtime.enable'); await cdp.send('Debugger.enable');
            let detail=null,scriptSource='';
            cdp.on('Runtime.exceptionThrown',async e=>{
              const d=e.exceptionDetails||{},desc=d.exception?.description||'';
              if(!desc.includes('SyntaxError'))return;
              detail={description:desc,line:Number(d.lineNumber||0),column:Number(d.columnNumber||0),url:d.url||'',scriptId:d.scriptId||''};
              try{if(d.scriptId){const x=await cdp.send('Debugger.getScriptSource',{scriptId:d.scriptId});scriptSource=x.scriptSource||'';}}catch(_){}
            });
            let r=null;try{r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000})}catch(e){console.log('GOTO_ERROR '+String(e))}
            const status=r?.status()||0; console.log(`ATTEMPT ${attempt} HTTP ${status}`);
            if(status===200){
              await page.waitForTimeout(3000);
              const raw=await r.text(); fs.writeFileSync('raw.html',raw);
              fs.writeFileSync('detail.json',JSON.stringify(detail,null,2));
              fs.writeFileSync('offending-script.js',scriptSource||'');
              const lines=raw.split(/\r?\n/),target=Math.max(0,(detail?.line||30580)-1),a=Math.max(0,target-20),b=Math.min(lines.length,target+21);
              fs.writeFileSync('raw-context.txt',lines.slice(a,b).map((x,i)=>String(a+i+1).padStart(6)+': '+x).join('\n'));
              const scripts=[...raw.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].map((m,i)=>({i,attrs:m[1],text:m[2]})).filter(x=>/U\.S\. Air Force|U\.S\. Coast Guard|U\.S\. Space Force|U\.S\. Marine Corps|canonical|branch/i.test(x.text));
              fs.writeFileSync('matching-scripts.txt',scripts.map(s=>`SCRIPT ${s.i} ATTRS ${s.attrs}\n${s.text}\n\n`).join(''));
              console.log('DETAIL '+JSON.stringify(detail));
              console.log(fs.readFileSync('raw-context.txt','utf8'));
              console.log('OFFENDING_SCRIPT_START\n'+(scriptSource||'').slice(0,12000)+'\nOFFENDING_SCRIPT_END');
              completed=true;
            }
            await context.close();
            if(!completed)await new Promise(r=>setTimeout(r,attempt*3000));
          }
          await browser.close();
          if(!completed)process.exit(2);
          EOF
          node trace.mjs
      - name: Upload AFG diagnostic source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afg-malformed-script-source
          path: |
            raw.html
            detail.json
            offending-script.js
            raw-context.txt
            matching-scripts.txt
          if-no-files-found: warn
