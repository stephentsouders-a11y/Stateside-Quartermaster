# Child Safety certification trigger 2026-09-11
name: Child Safety exhaustive Refine Products Chromium certification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click every Child Safety refine choice and verify products
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('out',{recursive:true});
          const BASE='https://www.statesideqm.com';
          const THEME='158561894555';
          const ROOT='child-safety-shop';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const norm=s=>String(s||'').replace(/\s+/g,' ').trim().toLowerCase();
          const report={theme:THEME,root:ROOT,rootProducts:[],discovered:[],controls:[],failures:[],consoleErrors:[],rateLimitRetries:0,fatal:null};
          let browser;
          try {
            browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1100}});
            const page=await context.newPage();
            page.on('console',m=>{if(m.type()==='error'&&!/shop\.app|monorail|analytics|favicon/i.test((m.location()?.url||'')+' '+m.text()))report.consoleErrors.push(m.text())});
            page.on('pageerror',e=>report.consoleErrors.push(String(e)));
            async function requestJson(url,tries=6){let last='';for(let i=0;i<tries;i++){try{const r=await context.request.get(url,{timeout:30000});if(r.status()===429){report.rateLimitRetries++;await sleep(2500*(i+1));continue}if(!r.ok()){last=`HTTP ${r.status()}`;await sleep(1200*(i+1));continue}return await r.json()}catch(e){last=String(e);await sleep(1200*(i+1))}}throw new Error(`request failed ${url}: ${last}`)}
            async function productMeta(handle){try{return await requestJson(`${BASE}/products/${handle}.js`,4)}catch{return null}}
            async function openRoot(){const url=`${BASE}/collections/${ROOT}?preview_theme_id=${THEME}`;let last='';for(let i=0;i<6;i++){try{const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});if(r?.status()===429){report.rateLimitRetries++;await sleep(3500*(i+1));continue}if(r&&!r.ok()){last=`HTTP ${r.status()}`;await sleep(2000*(i+1));continue}await page.waitForTimeout(1800);await page.locator('#MainContent .sq-refine-v3-sidebar').waitFor({state:'attached',timeout:20000});await page.locator('#MainContent .sq-refine-v3-results').waitFor({state:'attached',timeout:20000});return}catch(e){last=String(e);await sleep(2000*(i+1))}}throw new Error(`unable to open Child Safety preview after retries: ${last}`)}
            async function visibleHandles(){return page.locator('#MainContent .sq-refine-v3-results a[href*="/products/"]').evaluateAll(as=>[...new Set(as.filter(a=>{const r=a.getBoundingClientRect(),s=getComputedStyle(a);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'}).map(a=>{try{return new URL(a.href).pathname.match(/^\/products\/([^/?#]+)/)?.[1]}catch{return null}}).filter(Boolean))])}
            async function readControls(){return page.locator('#MainContent .sq-refine-v3-sidebar input').evaluateAll(els=>els.map(el=>{const label=el.closest('label');const details=el.closest('details');const summary=details?.querySelector(':scope > summary');return {type:el.type||'',name:el.name||'',value:el.value||'',label:(label?.innerText||el.getAttribute('aria-label')||el.value||'').replace(/\s+/g,' ').trim(),group:(summary?.innerText||'').replace(/\s+/g,' ').trim(),disabled:el.disabled,checked:el.checked}}).filter(x=>!x.disabled&&['checkbox','radio'].includes(x.type)))}
            async function findControl(spec){const all=page.locator('#MainContent .sq-refine-v3-sidebar input');for(let i=0;i<await all.count();i++){const el=all.nth(i);try{const info=await el.evaluate(e=>{const l=e.closest('label'),d=e.closest('details'),s=d?.querySelector(':scope > summary');return {type:e.type,name:e.name||'',value:e.value||'',label:(l?.innerText||e.getAttribute('aria-label')||e.value||'').replace(/\s+/g,' ').trim(),group:(s?.innerText||'').replace(/\s+/g,' ').trim()}});if(info.type===spec.type&&info.name===spec.name&&info.value===spec.value&&info.label===spec.label&&info.group===spec.group)return el}catch{}}return null}
            async function activate(spec){for(let attempt=0;attempt<4;attempt++){const target=await findControl(spec);if(!target){await sleep(250);continue}try{await target.evaluate(el=>{const d=el.closest('details');if(d)d.open=true;el.click()});return true}catch{await sleep(300)}}return false}
            const rootData=await requestJson(`${BASE}/collections/${ROOT}/products.json?limit=250`);const rootProducts=rootData.products||[];const rootHandles=new Set(rootProducts.map(p=>p.handle));report.rootProducts=rootProducts.map(p=>({handle:p.handle,title:p.title,vendor:p.vendor,tags:p.tags||[],available:(p.variants||[]).some(v=>v.available)}));if(rootHandles.size!==5)report.failures.push(`expected 5 Child Safety products, collection API returned ${rootHandles.size}`);
            await openRoot();const baseHandles=await visibleHandles();if(baseHandles.length!==rootHandles.size)report.failures.push(`root visible product count ${baseHandles.length} != collection count ${rootHandles.size}`);for(const h of baseHandles)if(!rootHandles.has(h))report.failures.push(`foreign product on root: ${h}`);report.discovered=await readControls();const requiredGroups=['shop by category','shop by type','shop by color / pattern','shop by manufacturers','availability'];const groups=new Set(report.discovered.map(c=>norm(c.group)));for(const g of requiredGroups)if(!groups.has(g))report.failures.push(`missing required refine group: ${g}`);
            for(const spec of report.discovered){await openRoot();if(spec.type==='radio'&&spec.checked){report.controls.push({...spec,passed:true,skipped:'default radio already selected'});continue}const ok=await activate(spec);if(!ok){report.failures.push(`could not activate control: ${spec.group} / ${spec.label}`);report.controls.push({...spec,passed:false,reasons:['activation failed']});continue}await Promise.race([page.waitForLoadState('domcontentloaded').catch(()=>{}),sleep(1600)]);await sleep(900);const handles=await visibleHandles().catch(()=>[]);const row={...spec,url:page.url(),visible:handles,passed:true,reasons:[]};if(!handles.length){row.passed=false;row.reasons.push('no visible products')}for(const h of handles)if(!rootHandles.has(h)){row.passed=false;row.reasons.push(`foreign product ${h}`)}const g=norm(spec.group),label=norm(spec.label),value=String(spec.value||'');if(/category|type|subcategory|branch/.test(g)){let child='';try{const u=new URL(page.url());const m=u.pathname.match(/^\/collections\/([^/?#]+)/);if(m&&m[1]!==ROOT)child=m[1]}catch{}if(!child&&/^sq-/.test(value))child=value;if(child){try{const j=await requestJson(`${BASE}/collections/${child}/products.json?limit=250`,4);const allowed=new Set((j.products||[]).map(p=>p.handle));for(const h of handles)if(!allowed.has(h)){row.passed=false;row.reasons.push(`${h} not in structural destination ${child}`)}}catch(e){row.passed=false;row.reasons.push(`unable to validate destination ${child}: ${e}`)}}}if(/manufacturer|artist|brand/.test(g)){const expected=norm(value||spec.label.replace(/\(\d+\).*$/,''));for(const h of handles){const p=await productMeta(h);if(!p){row.passed=false;row.reasons.push(`unable to load ${h}`);continue}if(norm(p.vendor)!==expected){row.passed=false;row.reasons.push(`${h} vendor ${p.vendor} != ${expected}`)}}}if(/availability/.test(g)&&/available|in stock/.test(label+' '+norm(value))){for(const h of handles){const p=await productMeta(h);if(p&&!p.available){row.passed=false;row.reasons.push(`${h} is not available`)}}}if(/color|pattern|camo/.test(g)){const expected=norm(value||spec.label.replace(/\(\d+\).*$/,''));for(const h of handles){const p=await productMeta(h);if(!p)continue;const hay=norm([...(p.tags||[]),...(p.options||[]).flatMap(o=>o.values||[]),...(p.variants||[]).flatMap(v=>[v.option1,v.option2,v.option3])].join(' | '));if(expected&&!hay.includes(expected)){row.passed=false;row.reasons.push(`${h} lacks color/pattern ${expected}`)}}}if(!row.passed)report.failures.push(`${spec.group} / ${spec.label}: ${row.reasons.join('; ')}`);report.controls.push(row)}
            await openRoot();const clear=page.locator('#MainContent .sq-refine-v3-sidebar button').filter({hasText:/clear|reset/i}).first();if(await clear.count()){try{await clear.evaluate(el=>el.click());await sleep(700)}catch{}const h=await visibleHandles();if(h.length!==rootHandles.size)report.failures.push(`clear/reset restored ${h.length}, expected ${rootHandles.size}`)}await page.screenshot({path:'out/child-safety-final.png',fullPage:true}).catch(()=>{});
          } catch(e){report.fatal=String(e?.stack||e);report.failures.push(`fatal harness/browser error: ${String(e?.message||e)}`)} finally {report.consoleErrors=[...new Set(report.consoleErrors)];if(report.consoleErrors.length)report.failures.push(`${report.consoleErrors.length} browser console/page errors`);report.failures=[...new Set(report.failures)];report.outcome=report.failures.length?'FAIL':'PASS';fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));if(browser)await browser.close().catch(()=>{})}
          if(report.failures.length)process.exitCode=2;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: child-safety-refine-exhaustive
          path: out
          retention-days: 14
