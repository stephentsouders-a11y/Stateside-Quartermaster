name: Public Safety V3 focused certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/law-enforcement-v3-focused-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify-public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify remaining Public Safety views
        run: |
          cat > public.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let failed=false;
          async function check(root,device,viewport,wantCols){
            const ctx=await browser.newContext({viewport}); const page=await ctx.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            const u=`https://www.statesideqm.com/collections/${root}?preview_theme_id=158561894555`;
            let r;
            for(let i=0;i<5;i++){r=await page.goto(u,{waitUntil:'domcontentloaded',timeout:60000});if((r?.status()||0)===200)break;if(![429,500,502,503,504].includes(r?.status()||0))break;await sleep([4000,8000,12000,18000,24000][i])}
            try{await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:30000})}catch{}
            await page.waitForTimeout(5000);
            const d=await page.evaluate(()=>{const main=document.querySelector('#MainContent'),side=main?.querySelector('.sq-refine-v3-sidebar'),results=main?.querySelector('.sq-refine-v3-results'),grid=results?.querySelector('.product-grid'),cc=results?.querySelector('collection-component'),cs=cc?getComputedStyle(cc):null;const all=grid?[...grid.querySelectorAll(':scope > .product-grid__item')]:[];const visible=all.filter(el=>{const s=getComputedStyle(el),b=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&b.width>0&&b.height>0&&!!el.querySelector('a[href*="/products/"]')});const tpl=grid?getComputedStyle(grid).gridTemplateColumns:'';return{ready:main?.dataset.sqRefineV3Ready==='true',error:main?.dataset.sqRefineV3Error||'',cleanup:main?.dataset.sqRefineV3RootCleanup==='true',isolation:document.querySelector('script[data-sq-refine-v3-legacy-isolation]')?.dataset.sqRefineV3LegacyIsolation||'',override:!!document.querySelector('style[data-sq-refine-v3-public-safety-product-visibility]'),sidebar:!!side&&getComputedStyle(side).display!=='none',sticky:side?getComputedStyle(side).position:'',allCards:all.length,visibleCards:visible.length,ccDisplay:cs?.display||'',ccVisibility:cs?.visibility||'',cols:tpl&&tpl!=='none'?tpl.trim().split(/\s+/).length:0,legacyVisible:[...document.querySelectorAll('[data-sq-refine-v3-hidden-nav="true"]')].filter(el=>{const s=getComputedStyle(el),b=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&b.width>0&&b.height>0}).length}},);
            const stickyOk=device==='mobile'?d.sticky!=='sticky':d.sticky==='sticky';
            const ok=r?.status()===200&&errors.length===0&&d.ready&&!d.error&&d.cleanup&&d.isolation===root&&d.override&&d.sidebar&&stickyOk&&d.allCards===50&&d.visibleCards===50&&d.ccDisplay!=='none'&&d.ccVisibility!=='hidden'&&d.cols===wantCols&&d.legacyVisible===0;
            console.log('PUBLIC_FOCUSED '+JSON.stringify({root,device,http:r?.status()||0,errors,d,ok})); if(!ok)failed=true; await ctx.close();
          }
          await check('law-enforcement-corrections','mobile',{width:390,height:844},2); await sleep(8000);
          await check('firefighting-ems-search-rescue','desktop',{width:1440,height:1000},3); await sleep(8000);
          await check('firefighting-ems-search-rescue','mobile',{width:390,height:844},2);
          await browser.close(); if(failed)process.exit(1);
          EOF
          node public.mjs
