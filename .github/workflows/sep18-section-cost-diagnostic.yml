name: Sep18 current section cost diagnostic
on:
  push:
    paths:
      - '.github/workflows/sep18-section-cost-diagnostic.yml'
      - '.github/scripts/sep18-section-cost-diagnostic.mjs'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/scripts/sep18-section-cost-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep18-section-cost-diagnostic-${{ github.run_id }}
          path: sep18-section-cost-diagnostic/
          retention-days: 14
