name: Refine V3 Books interaction certification
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/refine-v3-books-interaction-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  books:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify Books refinements and clicks
        run: |
          cat > books.mjs <<'EOF'
          import { chromium } from 'playwright';
          const B='https://www.statesideqm.com',T='158561894555',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const u=path=>{const x=new URL(path,B);x.searchParams.set('preview_theme_id',T);return x.toString()};
          const browser=await chromium.launch({headless:true}),c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();
          async function root(extra=''){let r;for(let a=0;a<5;a++){r=await p.goto(u('/collections/literature'+extra),{waitUntil:'domcontentloaded',timeout:70000}).catch(()=>null);if(r?.status()===200)break;console.log('RETRY',a+1,r?.status());await sleep(3000*(a+1))}if(r?.status()!==200)throw new Error('root HTTP '+r?.status());await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000});await sleep(5200)}
          const groups=()=>p.evaluate(()=>[...document.querySelectorAll('.sq-refine-v3-sidebar > details.sq-refine-v3-group')].map(g=>({label:(g.querySelector(':scope>summary')?.textContent||'').replace(/\s+/g,' ').trim(),inputs:[...g.querySelectorAll('input[type=checkbox]')].slice(0,10).map(i=>({text:(i.closest('label')?.textContent||'').replace(/\s+/g,' ').trim(),kind:i.dataset.kind||'',target:i.dataset.target||'',author:i.dataset.author||'',checked:i.checked}))})));
          await root();let d=await groups();console.log('GROUPS='+JSON.stringify(d));
          const required=['Shop by Author','Shop by Publisher','Shop by War / Conflict','Shop by Branch','Shop by Topic'];for(const label of required){if(!d.some(g=>g.label===label&&g.inputs.length))throw new Error('missing '+label)}
          if(d.some(g=>g.label==='Shop by Publishers'))throw new Error('plural Publisher remains');
          const author=d.find(g=>g.label==='Shop by Author');if(!author.inputs.every(i=>i.kind==='author'&&i.target.startsWith('/collections/literature?')&&new URL(i.target,B).searchParams.get('sq_author')&&!/catalog search|description|paperback|hardcover|publication date|isbn/i.test(i.text)))throw new Error('bad Author controls '+JSON.stringify(author.inputs));
          const pub=d.find(g=>g.label==='Shop by Publisher');if(!pub.inputs.every(i=>i.target.startsWith('/collections/literature?')&&new URL(i.target,B).searchParams.get('filter.p.vendor')&&!/supplier metadata/i.test(i.text)))throw new Error('bad Publisher controls '+JSON.stringify(pub.inputs));
          const a=author.inputs[0];await root('?sq_root=literature&sq_author='+encodeURIComponent(a.author));await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Author||document.querySelector('#MainContent')?.dataset.sqRefineV3AuthorError,null,{timeout:45000});await sleep(1200);let s=await p.evaluate(()=>({author:document.querySelector('#MainContent')?.dataset.sqRefineV3Author||'',err:document.querySelector('#MainContent')?.dataset.sqRefineV3AuthorError||'',count:Number(document.querySelector('#MainContent')?.dataset.sqRefineV3AuthorCount||0),url:location.href,checked:[...document.querySelectorAll('.sq-refine-v3-sidebar input[data-kind=author]:checked')].map(i=>i.dataset.author)}));console.log('AUTHOR='+JSON.stringify(s));if(s.err||s.author!==a.author||s.count<1||!new URL(s.url).searchParams.get('sq_author')||!s.checked.includes(a.author))throw new Error('Author filter failed '+JSON.stringify(s));
          await root();d=await groups();const p0=d.find(g=>g.label==='Shop by Publisher').inputs[0];const target=new URL(p0.target,B);await root('?filter.p.vendor='+encodeURIComponent(target.searchParams.get('filter.p.vendor'))+'&sq_root=literature');d=await groups();const pd=d.find(g=>g.label==='Shop by Publisher');if(!pd||!pd.inputs.length)throw new Error('Publisher group vanished');const urlNow=new URL(p.url());if(!urlNow.searchParams.getAll('filter.p.vendor').includes(target.searchParams.get('filter.p.vendor')))throw new Error('Publisher URL failed '+p.url());console.log('PUBLISHER PASS',p.url());
          console.log('BOOKS ALL GREEN');await c.close();await browser.close();
          EOF
          node books.mjs
