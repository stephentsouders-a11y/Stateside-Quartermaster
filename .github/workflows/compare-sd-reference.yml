name: Compare SD Supply Reference
on:
  push:
    branches:
      - rebuild/stateside-retail-sd-style
    paths:
      - '.github/workflows/compare-sd-reference.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture reference and rebuild
        run: |
          mkdir -p evidence
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const targets = [
            {key:'sd-home', url:'https://sd-supply.com/'},
            {key:'sq-home', url:'https://www.statesideqm.com/?preview_theme_id=158872600731'},
            {key:'sq-accessories', url:'https://www.statesideqm.com/collections/accessories-gifts-collectibles?filter.v.availability=1&preview_theme_id=158872600731'}
          ];
          const viewports = [
            {name:'desktop',width:1440,height:1200},
            {name:'mobile',width:390,height:844}
          ];
          const browser = await chromium.launch({headless:true});
          const all = [];
          for (const vp of viewports) {
            for (const t of targets) {
              const page = await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              let response = null;
              try {
                response = await page.goto(t.url,{waitUntil:'domcontentloaded',timeout:120000});
                await page.waitForTimeout(8000);
              } catch (e) {
                all.push({viewport:vp.name,key:t.key,error:String(e)});
                await page.close();
                continue;
              }
              const data = await page.evaluate(() => {
                const vis = el => {
                  if(!el) return false;
                  const s=getComputedStyle(el),r=el.getBoundingClientRect();
                  return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>2&&r.height>2;
                };
                const rect = el => {
                  if(!el) return null;
                  const r=el.getBoundingClientRect();
                  return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)};
                };
                const header = [...document.querySelectorAll('header,[role=banner],.header,.site-header')].find(vis);
                const navs = [...document.querySelectorAll('nav')].filter(vis);
                const h1 = [...document.querySelectorAll('h1')].find(vis);
                const imgs = [...document.images].filter(vis);
                const links = [...document.querySelectorAll('a[href]')].filter(vis);
                const products = [...document.querySelectorAll('product-card,.product-card,.card--product,.grid-product,.product-grid__item,[data-product-id]')].filter(vis);
                const sections = [...document.querySelectorAll('main section, main .shopify-section, #MainContent > *')].filter(vis).slice(0,20).map(el=>({
                  tag:el.tagName.toLowerCase(),
                  id:el.id||'',
                  cls:String(el.className||'').slice(0,180),
                  text:(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,180),
                  rect:rect(el)
                }));
                return {
                  title:document.title,
                  url:location.href,
                  bodyClass:document.body.className,
                  h1Text:(h1?.textContent||'').replace(/\s+/g,' ').trim(),
                  h1Rect:rect(h1),
                  headerRect:rect(header),
                  navRects:navs.slice(0,6).map(n=>({rect:rect(n),text:(n.textContent||'').replace(/\s+/g,' ').trim().slice(0,220)})),
                  firstLinks:links.slice(0,40).map(a=>({text:(a.textContent||'').replace(/\s+/g,' ').trim().slice(0,100),href:a.href,rect:rect(a)})),
                  imageCount:imgs.length,
                  productCount:products.length,
                  sections,
                  scrollHeight:document.documentElement.scrollHeight,
                  scrollWidth:document.documentElement.scrollWidth,
                  innerWidth
                };
              });
              data.status = response?.status() ?? null;
              data.viewport = vp.name;
              data.key = t.key;
              all.push(data);
              await page.screenshot({path:`evidence/${vp.name}-${t.key}.png`,fullPage:true});
              await page.close();
            }
          }
          fs.writeFileSync('evidence/compare.json',JSON.stringify(all,null,2));
          console.log(JSON.stringify(all,null,2));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sd-reference-compare
          path: evidence/
          retention-days: 14
# manual rerun trigger 2026-09-17
