name: CASE 0109 BrowserAct handshake fixed

on:
  push:
    branches:
      - research/browseract-case0109
  workflow_dispatch:

jobs:
  browseract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BrowserAct CLI
        run: |
          python -m pip install --upgrade pip uv
          uv tool install browser-act-cli --python 3.12
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Perform required BrowserAct main handshake
        run: |
          mkdir -p browseract_fixed
          export PATH="$HOME/.local/bin:$PATH"
          browser-act get-skills main | tee browseract_fixed/main_skill.txt
          test -s browseract_fixed/main_skill.txt
      - name: Confirm advanced capability after handshake
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          browser-act get-skills advanced | tee browseract_fixed/advanced_skill.txt
      - name: Run CASE 0109 BrowserAct public extraction
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          set +e
          browser-act stealth-extract 'https://dpaa-mil.sites.crmforce.mil/dpaaProfile?id=a0Jt0000000KYjOEAW' --content-type markdown > browseract_fixed/dpaa.md 2> browseract_fixed/dpaa.err
          echo $? > browseract_fixed/dpaa.exit
          browser-act stealth-extract 'https://projectdelta-b52.com/' --content-type markdown > browseract_fixed/projectdelta.md 2> browseract_fixed/projectdelta.err
          echo $? > browseract_fixed/projectdelta.exit
          browser-act stealth-extract 'https://historicexplorations.com/american-history/sergeant-first-class-fred-taylor/' --content-type markdown > browseract_fixed/historic.md 2> browseract_fixed/historic.err
          echo $? > browseract_fixed/historic.exit
          echo '--- RESULTS ---'
          printf 'DPAA='; cat browseract_fixed/dpaa.exit
          printf 'PROJECT_DELTA='; cat browseract_fixed/projectdelta.exit
          printf 'HISTORIC='; cat browseract_fixed/historic.exit
          echo '--- DPAA first lines ---'; head -40 browseract_fixed/dpaa.md
          echo '--- Project Delta first lines ---'; head -40 browseract_fixed/projectdelta.md
          echo '--- Historic first lines ---'; head -40 browseract_fixed/historic.md
          set -e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case0109-browseract-handshake-fixed
          path: browseract_fixed/
          retention-days: 7
