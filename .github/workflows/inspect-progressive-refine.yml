name: Inspect progressive refine counts
on:
  push:
    paths:
      - '.github/workflows/inspect-progressive-refine.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify progressive refine counts are hidden
        run: |
          cat > inspect.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:1440,height:1100}}),p=await c.newPage();
          const u='https://www.statesideqm.com/collections/products-built-for-the-line-u-s-army?sq_bfl_category=Flags%2C+Displays+%26+Memorials&preview_theme_id=158561894555';
          await p.goto(u,{waitUntil:'domcontentloaded',timeout:30000});
          for(let i=0;i<40;i++){const s=await p.evaluate(()=>({state:document.querySelector('.sqbfl')?.getAttribute('data-sqbfl-load-state'),cards:document.querySelectorAll('.sqbfl-card').length}));if(s.state==='progressive'&&s.cards){break}await p.waitForTimeout(100)}
          const d=await p.evaluate(()=>{const root=document.querySelector('.sqbfl'),counts=[...document.querySelectorAll('.sqbfl .sq-global-refine-sidebar__item small')];const rows=counts.map(e=>{const cs=getComputedStyle(e),r=e.getBoundingClientRect();return{text:(e.textContent||'').trim(),visibility:cs.visibility,display:cs.display,opacity:cs.opacity,visible:cs.visibility!=='hidden'&&cs.display!=='none'&&parseFloat(cs.opacity||'1')>0&&r.width>0&&r.height>0}});return{bflState:root?.getAttribute('data-sqbfl-load-state'),countNodes:rows.length,visibleCountNodes:rows.filter(x=>x.visible).length,sample:rows.slice(0,8)};});
          console.log(JSON.stringify(d,null,2));await b.close();if(d.bflState!=='progressive'||d.visibleCountNodes!==0)process.exitCode=2;
          EOF
          node inspect.mjs
