name: Refine V3 final three blocker diagnostics
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-three-blockers-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Diagnose AFG Literature Logo Merch
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const THEME='158561894555',BASE='https://www.statesideqm.com';
          function url(path){const u=new URL(path,BASE);u.searchParams.set('preview_theme_id',THEME);return u.toString()}
          async function nav(page,path){let r;for(let i=0;i<5;i++){r=await page.goto(url(path),{waitUntil:'domcontentloaded',timeout:90000});if(r?.status()===200)return r;if(![429,500,502,503,504].includes(r?.status()||0))return r;await sleep([5000,9000,15000,22000,30000][i])}return r}
          async function afg(){const page=await browser.newPage({viewport:{width:1440,height:1000}});const pageErrors=[],consoleErrors=[];page.on('pageerror',e=>pageErrors.push({message:e.message,stack:e.stack||''}));page.on('console',m=>{if(m.type()==='error')consoleErrors.push({text:m.text(),loc:m.location()})});const r=await nav(page,'/collections/armed-forces-gear');try{await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:35000})}catch{}await page.waitForTimeout(4000);const scripts=await page.evaluate(()=>[...document.scripts].map((s,i)=>({i,src:s.src||'',type:s.type||'',marker:[...s.attributes].filter(a=>a.name.startsWith('data-')).map(a=>`${a.name}=${a.value}`).join(' '),head:(s.src?'':(s.textContent||'').trim().slice(0,220))})).filter(x=>/afg|armed|refine|branch/i.test(`${x.src} ${x.marker} ${x.head}`)).slice(0,80));console.log('AFG_DIAG '+JSON.stringify({http:r?.status()||0,pageErrors,consoleErrors,scripts}));await page.close()}
          async function literature(){const page=await browser.newPage({viewport:{width:1440,height:1000}});const r=await nav(page,'/collections/literature');try{await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:35000})}catch{}await page.waitForTimeout(4000);const d=await page.evaluate(()=>{const side=document.querySelector('.sq-refine-v3-sidebar');return[...(side?.querySelectorAll('.sq-refine-v3-group')||[])].map(g=>({label:(g.querySelector('summary')?.textContent||'').trim(),targets:[...g.querySelectorAll('input[data-kind="structural"]')].map(i=>i.dataset.target||''),count:g.querySelectorAll('input[data-kind="structural"]').length})).filter(g=>g.count)});console.log('LITERATURE_DIAG '+JSON.stringify({http:r?.status()||0,groups:d}));await page.close()}
          async function logo(){const page=await browser.newPage({viewport:{width:1440,height:1000}});const pageErrors=[];page.on('pageerror',e=>pageErrors.push({message:e.message,stack:e.stack||''}));const r=await nav(page,'/collections/stateside-quartermaster-logo-merch');try{await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:35000})}catch{}await page.waitForTimeout(4000);const d=await page.evaluate(()=>{const main=document.querySelector('#MainContent'),results=main?.querySelector('.sq-refine-v3-results'),grid=results?.querySelector('.product-grid'),cc=results?.querySelector('collection-component');const cards=grid?[...grid.querySelectorAll(':scope > .product-grid__item')]:[];return{ready:main?.dataset.sqRefineV3Ready==='true',error:main?.dataset.sqRefineV3Error||'',isolation:document.querySelector('script[data-sq-refine-v3-legacy-isolation]')?.dataset.sqRefineV3LegacyIsolation||'',allCards:cards.length,productLinks:cards.filter(x=>!!x.querySelector('a[href*="/products/"]')).length,visible:cards.filter(el=>{const s=getComputedStyle(el),b=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&b.width>0&&b.height>0}).length,gridDisplay:grid?getComputedStyle(grid).display:'',gridVisibility:grid?getComputedStyle(grid).visibility:'',gridRect:grid?{w:grid.getBoundingClientRect().width,h:grid.getBoundingClientRect().height}:null,ccDisplay:cc?getComputedStyle(cc).display:'',ccVisibility:cc?getComputedStyle(cc).visibility:'',ccRect:cc?{w:cc.getBoundingClientRect().width,h:cc.getBoundingClientRect().height}:null,markers:[...document.querySelectorAll('[class*="logo"],[id*="logo"],[data-sq-refine-v3-hidden-nav="true"]')].slice(0,80).map(el=>({tag:el.tagName,id:el.id,cls:String(el.className||''),hidden:el.hidden,display:getComputedStyle(el).display,visibility:getComputedStyle(el).visibility,w:Math.round(el.getBoundingClientRect().width),h:Math.round(el.getBoundingClientRect().height)}))};});console.log('LOGO_DIAG '+JSON.stringify({http:r?.status()||0,pageErrors,d}));await page.close()}
          await afg();await sleep(7000);await literature();await sleep(7000);await logo();await browser.close();
          EOF
          node diag.mjs
