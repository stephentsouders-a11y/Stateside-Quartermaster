name: Refine V3 final blocker diagnostics
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-three-blockers-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Diagnose Books, Firearm and Logo Merch
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const BASE='https://www.statesideqm.com',THEME='158561894555';
          function U(path){const u=new URL(path,BASE);u.searchParams.set('preview_theme_id',THEME);return u.toString()}
          async function go(page,path){let last;for(let i=0;i<5;i++){try{const r=await page.goto(U(path),{waitUntil:'domcontentloaded',timeout:90000});if(r?.status()===200)return r;last=new Error('HTTP '+(r?.status()||0))}catch(e){last=e}await sleep([4000,7000,11000,16000,22000][i])}throw last||new Error('navigation failed')}
          async function snap(page,label){
            const d=await page.evaluate(()=>{
              const main=document.querySelector('#MainContent');
              const vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),c=getComputedStyle(e);return r.width>1&&r.height>1&&c.display!=='none'&&c.visibility!=='hidden'&&Number(c.opacity||1)>0};
              const info=e=>{if(!e)return null;const r=e.getBoundingClientRect(),c=getComputedStyle(e);return{tag:e.tagName,id:e.id||'',cls:typeof e.className==='string'?e.className:'',text:(e.textContent||'').replace(/\s+/g,' ').trim().slice(0,180),w:Math.round(r.width),h:Math.round(r.height),x:Math.round(r.x),y:Math.round(r.y),display:c.display,visibility:c.visibility,position:c.position}};
              const groups=[...main.querySelectorAll('.sq-refine-v3-sidebar > details.sq-refine-v3-group')].map(g=>({label:(g.querySelector(':scope > summary')?.textContent||'').trim(),open:g.open,inputs:[...g.querySelectorAll('input')].slice(0,120).map(i=>({text:(i.parentElement?.textContent||'').replace(/\s+/g,' ').trim().slice(0,160),kind:i.dataset.kind||'',target:i.dataset.target||'',filter:i.dataset.filterName||'',value:i.dataset.filterValue||'',polishParam:i.dataset.sqPolishParam||'',polishValue:i.dataset.sqPolishValue||''}))}));
              const grids=[...main.querySelectorAll('.sq-refine-v3-results .product-grid')].map(g=>{const r=g.getBoundingClientRect(),c=getComputedStyle(g);const cards=[...g.querySelectorAll(':scope > .product-grid__item')].filter(x=>x.querySelector('a[href*="/products/"]')).slice(0,8).map(info);return{cls:typeof g.className==='string'?g.className:'',w:Math.round(r.width),h:Math.round(r.height),display:c.display,visibility:c.visibility,visible:vis(g),cards}});
              const products=[...main.querySelectorAll('.sq-refine-v3-results a[href*="/products/"]')].slice(0,40).map(a=>({href:a.getAttribute('href'),text:(a.textContent||'').replace(/\s+/g,' ').trim().slice(0,100),self:info(a),parent:info(a.closest('.product-grid__item,product-card,.product-card'))}));
              const v3=[...main.querySelectorAll('.sq-refine-v3-sidebar')].filter(vis).map(info);
              const legacy=[...main.querySelectorAll('.sq-global-refine-sidebar,.sq-collection-sidebar,.facets-block-wrapper,.facets-container,.facets-wrapper')].filter(vis).map(info);
              const scripts={authorSafety:!!document.querySelector('[data-sq-refine-v3-literature-author-safety]'),repair:!!document.querySelector('[data-sq-refine-v3-structural-link-repair]'),rescue:!!document.querySelector('[data-sq-refine-v3-sidebar-polish-rescue]')};
              return{href:location.href,ready:main?.dataset.sqRefineV3Ready||'',error:main?.dataset.sqRefineV3Error||'',polishError:main?.dataset.sqRefineV3PolishError||'',v3Count:v3.length,v3,legacy,groups,grids,products,scripts,resultsText:(main.querySelector('.sq-refine-v3-results')?.textContent||'').replace(/\s+/g,' ').trim().slice(0,600)};
            });
            console.log(label+' '+JSON.stringify(d));
          }
          for(const path of ['/collections/literature','/collections/firearm-accessories','/collections/stateside-quartermaster-logo-merch']){
            const page=await browser.newPage({viewport:{width:1440,height:1000}});await go(page,path);for(const [wait,label] of [[1000,'T1'],[2500,'T3.5'],[3500,'T7'],[4000,'T11']]){await sleep(wait);await snap(page,label+' '+path)}await page.screenshot({path:path.split('/').pop()+'.png',fullPage:true});await page.close();await sleep(3500);
          }
          await browser.close();
          EOF
          node diag.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-blocker-screenshots
          path: '*.png'
