name: Refine V3 Child Safety Chromium event probe
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-three-blockers-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Probe trusted Child Safety parent click propagation
        run: |
          cat > child-safety-event-probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const BASE='https://www.statesideqm.com';
          const ROOT='/collections/child-safety-shop';
          const THEME='158561894555';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          await page.addInitScript(() => {
            try { sessionStorage.removeItem('sqProbeEvents'); } catch (_) {}
            const push=(where,e)=>{try{const a=JSON.parse(sessionStorage.getItem('sqProbeEvents')||'[]');a.push({where,type:e.type,target:e.target?.tagName||'',cls:e.target?.className||'',kind:e.target?.dataset?.kind||'',targetUrl:e.target?.dataset?.target||'',checked:e.target?.checked,phase:e.eventPhase,defaultPrevented:e.defaultPrevented,time:Date.now()});sessionStorage.setItem('sqProbeEvents',JSON.stringify(a.slice(-50)));}catch(_){}};
            window.addEventListener('click',e=>push('window-capture',e),true);
            document.addEventListener('click',e=>push('document-capture-early',e),true);
            document.addEventListener('click',e=>push('document-bubble-early',e),false);
            window.addEventListener('beforeunload',e=>push('beforeunload',e),true);
          });
          const url=new URL(ROOT,BASE);url.searchParams.set('preview_theme_id',THEME);
          const response=await page.goto(url.toString(),{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{},{timeout:45000});
          await page.waitForTimeout(1200);
          const input=page.locator('#MainContent .sq-refine-v3-sidebar details.sq-refine-v3-group').filter({has:page.locator('summary',{hasText:'Shop by Category'})}).locator('label.sq-refine-v3-choice').filter({hasText:'Ballistic Backpacks & Inserts'}).locator('input[data-kind="structural"]').first();
          await input.evaluate(el=>{el.addEventListener('click',e=>{try{const a=JSON.parse(sessionStorage.getItem('sqProbeEvents')||'[]');a.push({where:'input-direct',type:e.type,target:e.target?.tagName||'',kind:e.target?.dataset?.kind||'',targetUrl:e.target?.dataset?.target||'',checked:e.target?.checked,phase:e.eventPhase,defaultPrevented:e.defaultPrevented,time:Date.now()});sessionStorage.setItem('sqProbeEvents',JSON.stringify(a.slice(-50)));}catch(_){}})});
          const before=await page.evaluate(()=>({href:location.href,fix:document.querySelector('#MainContent')?.dataset.sqChildSafetyFix||'',taxonomy:document.querySelector('#MainContent')?.dataset.sqChildSafetyTaxonomy||'',scriptPresent:!!document.querySelector('script[data-sq-refine-v3-child-safety-taxonomy]'),input:[...document.querySelectorAll('#MainContent .sq-refine-v3-sidebar input[data-kind="structural"][data-target]')].map(i=>({label:(i.closest('label')?.textContent||'').replace(/\s+/g,' ').trim(),target:i.dataset.target,checked:i.checked}))}));
          let clickError='';
          try{await input.click({force:true,noWaitAfter:true,timeout:10000})}catch(e){clickError=String(e)}
          await page.waitForTimeout(2500).catch(()=>{});
          const afterUrl=page.url();
          let after={};
          try{after=await page.evaluate(()=>({href:location.href,fix:document.querySelector('#MainContent')?.dataset.sqChildSafetyFix||'',taxonomy:document.querySelector('#MainContent')?.dataset.sqChildSafetyTaxonomy||'',events:JSON.parse(sessionStorage.getItem('sqProbeEvents')||'[]')}))}catch(e){after={evalError:String(e)}}
          const report={status:response?.status()||0,before,clickError,afterUrl,after};
          console.log(JSON.stringify(report,null,2));
          fs.writeFileSync('child-safety-event-probe.json',JSON.stringify(report,null,2));
          await page.screenshot({path:'child-safety-event-probe.png',fullPage:true}).catch(()=>{});
          await browser.close();
          EOF
          node child-safety-event-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: child-safety-event-probe
          path: |
            child-safety-event-probe.json
            child-safety-event-probe.png
