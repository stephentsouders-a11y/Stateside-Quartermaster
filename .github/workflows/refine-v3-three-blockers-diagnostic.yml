name: Refine V3 final three blocker diagnostics
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-three-blockers-diagnostic.yml'
      - 'snippets/sq-refine-v3-sidebar-polish-rescue.liquid'
      - 'snippets/sq-refine-v3-sidebar-header-edge-fix.liquid'
      - 'snippets/sq-refine-v3-product-scale-lock.liquid'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Diagnose current V3 blockers
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const THEME='158561894555',BASE='https://www.statesideqm.com';
          function url(path){const u=new URL(path,BASE);u.searchParams.set('preview_theme_id',THEME);return u.toString()}
          async function nav(page,path){let last;for(let i=0;i<5;i++){try{const r=await page.goto(url(path),{waitUntil:'domcontentloaded',timeout:90000});const s=r?.status()||0;if(s===200)return r;last=new Error('HTTP '+s);if(![429,500,502,503,504].includes(s))throw last}catch(e){last=e}await sleep([5000,9000,15000,22000,30000][i])}throw last||new Error('navigation failed')}
          async function run(path){
            const page=await browser.newPage({viewport:{width:1440,height:1000}}),pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push({message:e.message,stack:e.stack||''}));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push({text:m.text(),loc:m.location()})});
            let http=0,navError='';try{http=(await nav(page,path)).status()}catch(e){navError=String(e)}
            try{await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000})}catch(e){navError+=(navError?' | ':'')+String(e)}
            await sleep(2500);
            const d=await page.evaluate(()=>{
              const main=document.querySelector('#MainContent'),side=main?.querySelector('.sq-refine-v3-sidebar'),title=side?.querySelector('.sq-refine-v3-sidebar__title'),grid=main?.querySelector('.sq-refine-v3-results .product-grid'),layout=main?.querySelector('.sq-refine-v3-layout'),results=main?.querySelector('.sq-refine-v3-results'),core=document.querySelector('script[data-sq-refine-v3]'),polish=document.querySelector('script[data-sq-refine-v3-sidebar-polish]'),rescue=document.querySelector('script[data-sq-refine-v3-sidebar-polish-rescue]'),meta=document.querySelector('[data-sq-refine-v3-polish-meta]');
              const cards=grid?[...grid.querySelectorAll(':scope > .product-grid__item')].filter(x=>x.querySelector('a[href*="/products/"]')):[];
              const r0=cards[0]?.getBoundingClientRect(),lr=layout?.getBoundingClientRect(),rr=results?.getBoundingClientRect(),sr=side?.getBoundingClientRect(),tr=title?.getBoundingClientRect();
              let corner='';if(sr){let n=document.elementFromPoint(Math.max(0,sr.right-3),Math.max(0,sr.top+3));while(n&&n!==document.documentElement){let b=getComputedStyle(n).backgroundColor;if(b&&b!=='rgba(0, 0, 0, 0)'&&b!=='transparent'){corner=b;break}n=n.parentElement}}
              return {
                href:location.href,ready:main?.dataset.sqRefineV3Ready||'',v3Error:main?.dataset.sqRefineV3Error||'',polishError:main?.dataset.sqRefineV3PolishError||'',coreCurrent:core?.dataset.currentHandle||'',polishScript:!!polish,rescueScript:!!rescue,polished:side?.dataset.sqRefineV3Polished||'',rescued:side?.dataset.sqRefineV3PolishRescued||'',metaText:(meta?.textContent||'').slice(0,1500),metaLength:(meta?.textContent||'').length,
                groups:side?[...side.querySelectorAll(':scope > details.sq-refine-v3-group')].map(g=>({label:(g.querySelector(':scope > summary')?.textContent||'').trim(),inputs:g.querySelectorAll('input').length})):[],
                sidebar:{position:side?getComputedStyle(side).position:'',overflowY:side?getComputedStyle(side).overflowY:'',width:sr?.width||0,height:sr?.height||0},
                title:{text:title?.textContent||'',width:tr?.width||0,rightGap:sr&&tr?sr.right-tr.right:null,bg:title?getComputedStyle(title).backgroundColor:'',corner},
                layout:{width:lr?.width||0,columns:layout?getComputedStyle(layout).gridTemplateColumns:''},resultsWidth:rr?.width||0,
                grid:{width:grid?.getBoundingClientRect().width||0,template:grid?getComputedStyle(grid).gridTemplateColumns:'',justify:grid?getComputedStyle(grid).justifyContent:'',maxWidth:grid?getComputedStyle(grid).maxWidth:'',cardWidth:r0?.width||0,cards:cards.length}
              }
            });
            console.log('DIAG '+path+' '+JSON.stringify({http,navError,pageErrors,consoleErrors,d}));
            await page.close();
          }
          for(const p of ['/collections/accessories-gifts-collectibles','/collections/apparel','/collections/literature','/collections/firearm-accessories']){await run(p);await sleep(8000)}
          await browser.close();
          EOF
          node diag.mjs
