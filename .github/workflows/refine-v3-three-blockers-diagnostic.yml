name: Refine V3 route failure diagnostics
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-three-blockers-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Diagnose failed V3 routes
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const base='https://www.statesideqm.com',theme='158561894555';
          const U=(p)=>{let u=new URL(p,base);u.searchParams.set('preview_theme_id',theme);return u.toString()};
          async function go(page,p){for(let i=0;i<4;i++){try{let r=await page.goto(U(p),{waitUntil:'domcontentloaded',timeout:90000});if(r?.status()===200)return}catch(e){}await sleep(6000*(i+1))}}
          async function inspect(p,w){let page=await browser.newPage({viewport:{width:w,height:w<600?844:1000}});await go(page,p);try{await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000})}catch(e){}await sleep(2000);let d=await page.evaluate(()=>{let main=document.querySelector('#MainContent'),grid=main?.querySelector('.sq-refine-v3-results .product-grid'),items=grid?[...grid.querySelectorAll(':scope > .product-grid__item')]:[],it=items[0],prod=it?.querySelector('product-card,.product-card'),link=it?.querySelector('a[href*="/products/"]'),side=main?.querySelector('.sq-refine-v3-sidebar'),title=side?.querySelector('.sq-refine-v3-sidebar__title');function S(e){if(!e)return null;let r=e.getBoundingClientRect(),c=getComputedStyle(e);return{tag:e.tagName,cls:typeof e.className==='string'?e.className:'',w:r.width,h:r.height,x:r.x,y:r.y,display:c.display,position:c.position,visibility:c.visibility,opacity:c.opacity,overflow:c.overflow,gridColumn:c.gridColumn,gridRow:c.gridRow,width:c.width,maxWidth:c.maxWidth,minWidth:c.minWidth,transform:c.transform}}let chain=[],x=it;while(x&&chain.length<10){chain.push(S(x));x=x.parentElement}let sr=side?.getBoundingClientRect(),pts=[];if(sr)for(let dx of [1,2,3,4,5,6])for(let dy of [1,2,3,4,5,6]){let n=document.elementFromPoint(sr.right-dx,sr.top+dy);pts.push({dx,dy,tag:n?.tagName||'',cls:typeof n?.className==='string'?n.className:'',bg:n?getComputedStyle(n).backgroundColor:''})}return{href:location.href,grid:S(grid),items:items.length,item:S(it),product:S(prod),link:S(link),chain,side:S(side),title:S(title),cornerPts:pts,styleSheets:[...document.querySelectorAll('style')].map(s=>s.textContent||'').filter(t=>/product-grid__item|sq-refine-v3-results|sq-collection-layout/.test(t)).slice(-12).map(t=>t.slice(0,2500))}});console.log('DIAG '+w+' '+p+' '+JSON.stringify(d));await page.close()}
          for(let p of ['/collections/air-national-guard-series','/collections/products-built-for-the-line-u-s-army','/collections/jrotc-series','/collections/stateside-quartermaster-logo-merch','/collections/accessories-gifts-collectibles','/collections/sta-brite-insignia']){await inspect(p,1440);await sleep(4000)}
          await inspect('/collections/products-built-for-the-line-u-s-navy',390);await browser.close();
          EOF
          node diag.mjs
