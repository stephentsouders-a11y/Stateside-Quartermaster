name: Refine V3 Books author semantic certification
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/refine-v3-books-author-semantic-cert.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  books-author:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify author choices return matching books
        run: |
          cat > books-author.mjs <<'EOF'
          import { chromium } from 'playwright';
          const B='https://www.statesideqm.com',T='158561894555',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({headless:true}),c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();
          const u=(path,params={})=>{const x=new URL(path,B);x.searchParams.set('preview_theme_id',T);for(const[k,v]of Object.entries(params))x.searchParams.set(k,v);return x.toString()};
          async function goto(url){let r;for(let a=0;a<5;a++){r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:70000}).catch(()=>null);if(r?.status()===200)return r;await sleep(2000*(a+1))}throw new Error('HTTP '+r?.status())}
          await goto(u('/collections/literature'));
          await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:60000});
          await p.waitForSelector('.sq-refine-v3-sidebar [data-sq-author-refine] input[data-kind=author]',{timeout:30000});
          const authors=await p.locator('.sq-refine-v3-sidebar [data-sq-author-refine] input[data-kind=author]').evaluateAll(xs=>xs.slice(0,5).map(i=>({author:i.dataset.author,target:i.dataset.target})));
          if(authors.length<1)throw new Error('No real author choices available');
          console.log('AUTHORS',JSON.stringify(authors));
          const failures=[];
          for(const a of authors.slice(0,3)){
            const target=new URL(a.target,B);target.searchParams.set('preview_theme_id',T);
            await goto(target.toString());
            await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:60000});
            await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3AuthorCount!==undefined,null,{timeout:50000}).catch(()=>{});
            await sleep(1800);
            const state=await p.evaluate(()=>{const m=document.querySelector('#MainContent');const cards=[...m.querySelectorAll('.sq-refine-v3-results .product-grid:visible .product-grid__item')].filter(x=>x.querySelector('a[href*="/products/"]'));return{error:m?.dataset.sqRefineV3AuthorError||'',count:Number(m?.dataset.sqRefineV3AuthorCount||cards.length),hrefs:cards.slice(0,3).map(x=>x.querySelector('a[href*="/products/"]')?.href).filter(Boolean)}});
            if(state.error)failures.push(a.author+': feed error '+state.error);
            if(state.count<1||state.hrefs.length<1){failures.push(a.author+': no products');continue}
            let matched=0,checked=0;
            for(const href of state.hrefs){await goto(href);const text=(await p.locator('body').innerText()).replace(/\s+/g,' ').toLowerCase();checked++;if(text.includes(a.author.toLowerCase()))matched++}
            console.log('AUTHOR RESULT',a.author,JSON.stringify({count:state.count,checked,matched,hrefs:state.hrefs}));
            if(matched!==checked)failures.push(a.author+': only '+matched+'/'+checked+' sampled product pages contain author name');
          }
          await browser.close();console.log('FAILURES',JSON.stringify(failures));if(failures.length)process.exit(1);console.log('BOOKS AUTHOR SEMANTICS GREEN');
          EOF
          node books-author.mjs
