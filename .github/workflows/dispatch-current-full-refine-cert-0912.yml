name: Dispatch fresh full Refine V3 certification 0912
on:
  push:
    paths:
      - '.github/workflows/dispatch-current-full-refine-cert-0912.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current 42-route robust certification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/refine-v3-42-final-robust-cert-0911.yml/dispatches \
            -f ref=refine-restart-v3
          echo FULL_REFINE_CERT_DISPATCHED
