name: Sep18 fast current baseline
on:
  push:
    paths:
      - '.github/workflows/sep18-fast-current-baseline.yml'
      - '.github/scripts/sep18-fast-baseline-current.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/scripts/sep18-fast-baseline-current.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep18-fast-baseline-${{ github.run_id }}
          path: sep18-fast-baseline/
          retention-days: 7
