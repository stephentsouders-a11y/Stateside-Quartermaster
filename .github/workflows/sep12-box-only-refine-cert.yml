name: Sep12 box-only Refine certification
on:
  push:
    paths:
      - '.github/workflows/sep12-box-only-refine-cert.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify only checkbox squares activate
        run: |
          cat > cert.mjs <<'EOF'
          import { chromium } from 'playwright'; import fs from 'fs';
          const base='https://www.statesideqm.com',theme='158561894555';
          const routes=['/collections/state-guard-series-texas','/collections/state-guard-series-california','/collections/tactical-gear','/collections/accessories-gifts-collectibles'];
          const browser=await chromium.launch({headless:true}),rows=[];
          for(const path of routes){const page=await browser.newPage({viewport:{width:1440,height:1000}}),rec={path,status:null,controls:[],revision:[]};const u=new URL(path,base);u.searchParams.set('preview_theme_id',theme);try{const r=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:60000});rec.status=r?.status()??null;await page.waitForTimeout(1200);await page.locator('#MainContent details').evaluateAll(ds=>ds.forEach(d=>d.open=true)).catch(()=>{});await page.waitForTimeout(300);rec.revision=await page.locator('script[data-sq-refine-checkbox-controls],script[data-sq-refine-v3-click-rescue]').evaluateAll(ss=>ss.map(s=>({mark:[...s.attributes].map(a=>a.name+'='+a.value).join(' ')})));const sel='.sq-global-refine-sidebar input[type=checkbox],.sq-refine-taxonomy input[type=checkbox],.sq-refine-v3-sidebar input[type=checkbox]';const count=await page.locator(sel).count();for(let i=0;i<count;i++){let input=page.locator(sel).nth(i);if(!await input.isVisible().catch(()=>false))continue;const c={i,label:await input.getAttribute('aria-label')||await input.inputValue().catch(()=>''),textInert:null,boxActivates:null};const row=input.locator('xpath=ancestor::*[self::label or self::a or contains(@class,"choice") or self::li][1]');if(await row.count()){const target=row.locator('span,small,strong').first();if(await target.count()&&await target.isVisible().catch(()=>false)){const url0=page.url(),v0=await input.isChecked().catch(()=>false);const box=await target.boundingBox();if(box){await page.mouse.click(box.x+Math.min(10,box.width/2),box.y+Math.min(10,box.height/2));await page.waitForTimeout(350);const v1=await input.isChecked().catch(()=>false);c.textInert=v0===v1&&page.url()===url0}}}if(c.textInert!==false){const current=page.locator(sel).nth(i);const url0=page.url(),v0=await current.isChecked().catch(()=>false);await current.click({timeout:8000}).catch(()=>{});await page.waitForTimeout(500);c.boxActivates=(await current.isChecked().catch(()=>!v0))!==v0||page.url()!==url0;await page.goto(u.toString(),{waitUntil:'domcontentloaded'}).catch(()=>{});await page.waitForTimeout(500);await page.locator('#MainContent details').evaluateAll(ds=>ds.forEach(d=>d.open=true)).catch(()=>{});}rec.controls.push(c);if(rec.controls.length>=12)break}}catch(e){rec.error=String(e)}rec.fail=rec.status!==200||rec.controls.length===0||rec.controls.some(c=>c.textInert===false||c.boxActivates===false);rows.push(rec);await page.close();await new Promise(r=>setTimeout(r,2000))}await browser.close();fs.mkdirSync('out',{recursive:true});fs.writeFileSync('out/results.json',JSON.stringify(rows,null,2));console.log(JSON.stringify(rows,null,2));if(rows.some(r=>r.fail))process.exitCode=2;
          EOF
          node cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep12-box-only-refine
          path: out
          retention-days: 7
