name: Safety Color Pattern Chromium Audit
on:
  push:
    paths:
      - '.github/workflows/safety-color-pattern-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 agent-browser >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect color values and current sidebar
        run: |
          mkdir -p safety-audit
          cat > audit.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const base='https://www.statesideqm.com/collections/safety-rescue-climbing';
          const browser=await chromium.launch();
          const context=await browser.newContext({viewport:{width:1440,height:1000},recordVideo:{dir:'safety-audit/video'}});
          const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
          const reports=[];
          for(const [label,url] of [['live',base],['draft',base+'?preview_theme_id=158561894555']]){
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(7000);
            const state=await page.evaluate(()=>({theme:window.Shopify?.theme,ready:{...document.querySelector('#MainContent')?.dataset},groups:[...document.querySelectorAll('.sq-refine-v3-sidebar > details')].map(d=>({label:d.querySelector('summary')?.textContent,choices:[...d.querySelectorAll('input')].map(i=>({label:i.closest('label')?.textContent,data:{...i.dataset}}))})),native:[...document.querySelectorAll('input[name^="filter."]')].map(i=>({name:i.name,value:i.value})),cards:[...document.querySelectorAll('.sq-refine-v3-results .product-grid__item')].map(c=>({id:c.dataset.productId,title:c.innerText}))}));
            reports.push({label,state});fs.writeFileSync('safety-audit/'+label+'.html',await page.content());
            await page.locator('.sq-refine-v3-sidebar').first().scrollIntoViewIfNeeded().catch(()=>{});await page.screenshot({path:'safety-audit/'+label+'.png'});
          }
          const products=[];for(let n=1;n<=5;n++){const r=await context.request.get(base+'/products.json?limit=250&page='+n);if(!r.ok())throw Error('Catalog HTTP '+r.status());const j=await r.json();products.push(...j.products);if(j.products.length<250)break;}
          fs.writeFileSync('safety-audit/catalog.json',JSON.stringify(products));
          const colorStats={},tagStats={};for(const p of products){for(const o of p.options||[]){if(/color|colour|pattern|camo/i.test(o.name)){for(const v of o.values||[])colorStats[v]=(colorStats[v]||0)+1;}}for(const t of p.tags||[])if(/color|colour|pattern|camo/i.test(t))tagStats[t]=(tagStats[t]||0)+1;}
          const r=await context.request.get(base+'?preview_theme_id=158561894555&filter.v.option.color=Orange&view=sq-refine-v3-products');const html=await r.text();
          const probe={status:r.status(),productIds:[...new Set([...html.matchAll(/data-product-id="(\d+)"/g)].map(m=>m[1]))]};
          const report={reports,total:products.length,colorStats,tagStats,probe,errors};fs.writeFileSync('safety-audit/report.json',JSON.stringify(report,null,2));console.log('SAFETY_REPORT '+JSON.stringify(report));
          await context.close();await browser.close();
          const env={...process.env,AGENT_BROWSER_EXECUTABLE_PATH:chromium.executablePath()};
          execFileSync('npx',['agent-browser','open',base+'?preview_theme_id=158561894555'],{env,stdio:'inherit'});
          fs.writeFileSync('safety-audit/agent-snapshot.txt',execFileSync('npx',['agent-browser','snapshot','-i'],{env}));
          execFileSync('npx',['agent-browser','close'],{env,stdio:'inherit'});
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-color-pattern-audit
          path: safety-audit
          retention-days: 7
