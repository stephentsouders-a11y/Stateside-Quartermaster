name: Refine V3 Full Pagination Chromium Certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-pagination-full-cert-0911.yml'
      - 'snippets/sq-refine-v3-pagination-repair.liquid'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify-pagination:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Browser-certify Refine V3 logical pagination
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cat > pagination-full-cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('out',{recursive:true});
          const theme='158561894555';
          const origin='https://www.statesideqm.com';
          const marker='assembly-rescue-20260911-v4';
          const allRoutes=[
            {handle:'accessories-gifts-collectibles'},{handle:'airsoft-milsim'},{handle:'apparel'},{handle:'armed-forces-gear'},
            {handle:'art'},{handle:'body-armor-ballistic-protection'},{handle:'literature'},{handle:'child-safety-shop'},{handle:'dive-scuba'},
            {handle:'firearm-accessories'},{handle:'first-aid-medical-ifak'},{handle:'flags-patriotic-decor'},{handle:'flashlights-lighting'},
            {handle:'footwear-gloves-eyewear'},{handle:'k9-dog-gear'},{handle:'knives-axes-cutlery'},{handle:'morale-patches-tactical-id'},
            {handle:'outdoor-preparedness-gear'},{handle:'patriotic-american-heritage'},{handle:'safety-rescue-climbing'},
            {handle:'sta-brite-insignia'},{handle:'tactical-gear'},{handle:'thin-line'},{handle:'uniforms'},{handle:'watches'},{handle:'zippos-lighters-torches'},
            {handle:'stateside-quartermaster-logo-merch'},{handle:'army-national-guard-series'},{handle:'air-national-guard-series'},
            {handle:'products-built-for-the-line-u-s-army'},{handle:'products-built-for-the-line-u-s-navy'},
            {handle:'products-built-for-the-line-u-s-air-force'},{handle:'products-built-for-the-line-u-s-marine-corps'},
            {handle:'products-built-for-the-line-u-s-coast-guard'},{handle:'products-built-for-the-line-u-s-space-force'},
            {handle:'rotc-series'},{handle:'jrotc-series'},{handle:'military-schools-academies'},{handle:'law-enforcement-corrections'},
            {handle:'firefighting-ems-search-rescue'},
            {handle:'literature-u-s-army',root:'literature',special:true}
          ];
          const shard=Number(process.env.SHARD||0);
          const routes=allRoutes.filter((_,i)=>i%5===shard);
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000}});
          const report={theme,marker,shard,routes:routes.map(x=>x.handle),cases:[],failures:[]};
          const fail=(key,msg)=>report.failures.push(`${key}: ${msg}`);
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function url(route,size,pageNo){
            const u=new URL(`/collections/${route.handle}`,origin);
            u.searchParams.set('preview_theme_id',theme);
            if(route.root)u.searchParams.set('sq_root',route.root);
            u.searchParams.set('sq_per_page',String(size));
            u.searchParams.set('sq_view_page',String(pageNo));
            u.searchParams.set('sq_cert',`${Date.now()}-${shard}-${size}-${pageNo}`);
            return u.toString();
          }
          async function gotoRetry(page,target,label){
            let last='';
            for(let i=0;i<6;i++){
              try{
                const r=await page.goto(target,{waitUntil:'domcontentloaded',timeout:90000});
                if(r?.ok())return;
                last=`HTTP ${r?.status()}`;
                if(r?.status()!==429&&(r?.status()||0)<500)throw new Error(last);
              }catch(e){last=String(e);if(!/429|5\d\d|Timeout/i.test(last))throw e}
              await sleep(Math.min(12000,1200*Math.pow(2,i)));
            }
            throw new Error(`${label} failed after retries: ${last}`);
          }
          async function ready(page){
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset?.sqRefineV3Ready==='true',{timeout:110000});
            await page.waitForTimeout(1200);
          }
          async function visibleProducts(page){
            return page.evaluate(()=>[...new Set([...document.querySelectorAll('#MainContent .sq-refine-v3-results .product-grid a[href*="/products/"]')].filter(a=>{const r=a.getBoundingClientRect(),s=getComputedStyle(a);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'}).map(a=>a.href.split('?')[0]))]);
          }
          async function controls(page,size){
            return page.evaluate((size)=>{const box=document.querySelector('#MainContent .sq-refine-v3-page-size');const inputs=box?[...box.querySelectorAll('input')]:[];const vals=inputs.map(i=>String(i.value));const checked=inputs.filter(i=>i.checked).map(i=>String(i.value));return{exists:!!box,has50:vals.includes('50'),has100:vals.includes('100'),has250:vals.includes('250'),selected:checked.includes(String(size))}},size);
          }
          async function pager(page){
            return page.evaluate(()=>{const p=document.querySelector('#MainContent .sq-refine-v3-pager');if(!p)return{exists:false,visible:false,links:[],text:''};const r=p.getBoundingClientRect(),s=getComputedStyle(p);return{exists:true,visible:r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0',links:[...p.querySelectorAll('a')].map(a=>({text:(a.textContent||'').trim(),href:a.href})),text:(p.textContent||'').replace(/\s+/g,' ').trim()}});
          }
          async function diagnostics(page){return page.$eval('#MainContent',el=>({...el.dataset})).catch(()=>({}))}
          if(shard===0){
            const p=await context.newPage();
            await gotoRetry(p,url({handle:'literature-u-s-army',root:'literature'},50,1),'preflight');
            const rev=await p.getAttribute('script[data-sq-refine-v3-pagination-repair]','data-revision');
            if(rev!==marker)fail('PREFLIGHT',`expected ${marker}, got ${rev||'missing'}`);
            await p.close();
          }
          for(const route of routes){
            for(const size of [50,100,250]){
              const key=`${route.handle}[${size}]`;
              const page=await context.newPage();
              const jsErrors=[];page.on('pageerror',e=>jsErrors.push(String(e)));
              const row={route:route.handle,size,page1:null,page2:null};
              try{
                await gotoRetry(page,url(route,size,1),`${key} page1`);await ready(page);
                const p1=await visibleProducts(page),c1=await controls(page,size),pg1=await pager(page),d1=await diagnostics(page);
                row.page1={count:p1.length,controls:c1,pager:pg1,data:d1};
                if(!p1.length)fail(key,'page 1 has no visible products');
                if(p1.length>size)fail(key,`page 1 shows ${p1.length}, above ${size}`);
                if(!c1.exists||!c1.has50||!c1.has100||!c1.has250)fail(key,'50/100/250 controls are incomplete');
                if(!c1.selected)fail(key,`${size} is not selected`);
                if(pg1.exists&&!pg1.visible)fail(key,'page 1 pager exists but is not visible');
                if(d1.sqRefineV3PaginationRepairError)fail(key,`page 1 repair error: ${d1.sqRefineV3PaginationRepairError}`);

                const page2=await context.newPage();
                const page2Errors=[];page2.on('pageerror',e=>page2Errors.push(String(e)));
                let p2=[],pg2={exists:false,visible:false,links:[],text:''},d2={},page2Ready=false;
                try{
                  await gotoRetry(page2,url(route,size,2),`${key} direct page2`);await ready(page2);page2Ready=true;
                  p2=await visibleProducts(page2);pg2=await pager(page2);d2=await diagnostics(page2);
                }catch(e){row.page2Error=String(e)}
                if(page2Ready&&p2.length){
                  const next=pg1.links.find(x=>/next/i.test(x.text)||new URL(x.href).searchParams.get('sq_view_page')==='2');
                  const prev=pg2.links.find(x=>/previous/i.test(x.text)||new URL(x.href).searchParams.get('sq_view_page')==='1');
                  const overlap=p2.filter(x=>p1.includes(x));
                  if(!pg1.exists||!pg1.visible||!next)fail(key,'page 2 has products but page 1 lacks visible Next');
                  if(!pg2.exists||!pg2.visible||!prev)fail(key,'page 2 has products but lacks visible Previous');
                  if(p2.length>size)fail(key,`page 2 shows ${p2.length}, above ${size}`);
                  if(overlap.length)fail(key,`page 2 repeats ${overlap.length} page-1 products`);
                  if(d2.sqRefineV3PaginationRepairError)fail(key,`page 2 repair error: ${d2.sqRefineV3PaginationRepairError}`);
                  if(next){
                    await gotoRetry(page,next.href,`${key} click-next`);await ready(page);
                    if(new URL(page.url()).searchParams.get('sq_view_page')!=='2')fail(key,'Next did not navigate to sq_view_page=2');
                  }
                }else if(page2Ready&&!p2.length){
                  const next=pg1.links.find(x=>/next/i.test(x.text)||new URL(x.href).searchParams.get('sq_view_page')==='2');
                  if(next)fail(key,'page 2 is empty but page 1 still shows Next');
                }else{
                  fail(key,`direct logical page 2 did not become ready: ${row.page2Error||'unknown'}`);
                }
                row.page2={count:p2.length,pager:pg2,data:d2};
                if(jsErrors.length)fail(key,`page 1 JS errors: ${jsErrors.slice(0,2).join(' | ')}`);
                if(page2Errors.length)fail(key,`page 2 JS errors: ${page2Errors.slice(0,2).join(' | ')}`);
                await page2.close();
              }catch(e){fail(key,String(e))}
              if(report.failures.some(x=>x.startsWith(key+':'))||route.special)await page.screenshot({path:`out/${route.handle}-${size}.png`,fullPage:true}).catch(()=>{});
              report.cases.push(row);await page.close();await sleep(900);
            }
          }
          await browser.close();
          report.summary={cases:report.cases.length,failures:report.failures.length};
          fs.writeFileSync(`out/report-shard-${shard}.json`,JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(report.failures.length)process.exitCode=2;
          EOF
          node pagination-full-cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-pagination-full-cert-shard-${{ matrix.shard }}
          path: out
          retention-days: 14
