name: REFINE V3 Button 01 Type Proof Alt Host

on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-button01-type-proof-alt-host.yml'
  workflow_dispatch:

jobs:
  prove:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Test Type flow through Shopify host
        run: |
          mkdir -p evidence
          node <<'NODE'
          import fs from 'node:fs/promises'; import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true}); const c=await b.newContext({viewport:{width:1440,height:1000},recordVideo:{dir:'evidence/video',size:{width:960,height:666}}}); const p=await c.newPage(); const video=p.video();
          const r={pass:false,steps:{},errors:[],responses:[]}; p.on('response',x=>{if(x.status()>=400)r.responses.push({status:x.status(),url:x.url()})});
          const challenge=async()=>/verify you are human|connection needs to be verified/i.test(await p.locator('body').innerText().catch(()=>'')); const ready=async()=>p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:60000});
          try{
            await p.goto('https://veteran-apparel-co.myshopify.com/collections/accessories-gifts-collectibles?preview_theme_id=158561894555',{waitUntil:'domcontentloaded',timeout:90000}); r.steps.root=p.url(); if(await challenge())throw new Error('challenge root'); await ready();
            const d=p.locator('#MainContent .sq-refine-v3-sidebar details').filter({has:p.locator(':scope>summary',{hasText:'Shop by Type'})}).first(); if(await d.getAttribute('open')===null)await d.locator('summary').click(); const i=d.locator('input:not(:checked)').first(); const m=await i.evaluate(e=>({name:e.dataset.filterName||e.dataset.sqPolishParam,value:e.dataset.filterValue||e.dataset.sqPolishValue||e.value})); r.steps.meta=m; const before=p.url(); await i.locator('xpath=ancestor::label[1]').click({noWaitAfter:true}); await p.waitForFunction(x=>location.href!==x,before,{timeout:20000}); await p.waitForTimeout(2500); r.steps.after=p.url(); if(await challenge())throw new Error('challenge after'); if(!new URL(p.url()).searchParams.getAll(m.name).includes(m.value))throw new Error('filter missing'); await ready(); r.steps.cards=await p.locator('#MainContent .sq-refine-v3-results .product-grid a[href*="/products/"]').count(); r.steps.checked=await p.evaluate(m=>[...document.querySelectorAll('#MainContent .sq-refine-v3-sidebar input:checked')].some(e=>(e.dataset.filterName||e.dataset.sqPolishParam)===m.name&&(e.dataset.filterValue||e.dataset.sqPolishValue||e.value)===m.value),m); if(!r.steps.cards||!r.steps.checked)throw new Error('filtered state incomplete'); await p.screenshot({path:'evidence/type.png'}); r.pass=true;
          }catch(e){r.errors.push(String(e));r.steps.final=p.url();r.steps.challenge=await challenge();r.steps.v3error=await p.locator('#MainContent').getAttribute('data-sq-refine-v3-error').catch(()=>null);await p.screenshot({path:'evidence/failure.png'}).catch(()=>{})}
          await fs.writeFile('evidence/report.json',JSON.stringify(r,null,2)); console.log(JSON.stringify(r,null,2)); await p.close(); await c.close(); if(video)await fs.copyFile(await video.path(),'evidence/type.webm').catch(()=>{}); await b.close(); if(!r.pass)process.exit(1);
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: button01-type-proof-alt-host
          path: evidence
          retention-days: 14
