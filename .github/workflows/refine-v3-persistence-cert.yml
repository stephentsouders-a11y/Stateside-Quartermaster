name: Refine V3 persistence certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-persistence-cert.yml'
      - 'layout/theme.liquid'
      - 'snippets/sq-refine-v3-child-route-isolation.liquid'
      - 'snippets/sq-refine-v3-structural-link-repair.liquid'
      - 'snippets/sq-refine-v3-literature-author-filter.liquid'
      - 'snippets/sq-refine-v3-literature-author-tag-authority.liquid'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Chromium certify persistence and filtering
        run: |
          cat > persistence.mjs <<'EOF'
          import { chromium } from 'playwright';
          const BASE='https://www.statesideqm.com',THEME='158561894555',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const themed=path=>{const u=new URL(path,BASE);u.searchParams.set('preview_theme_id',THEME);return u.toString()};
          async function nav(page,path){let response,last;for(let i=0;i<5;i++){try{response=await page.goto(themed(path),{waitUntil:'domcontentloaded',timeout:90000});if(response?.status()===200)break;last=new Error('HTTP '+response?.status())}catch(e){last=e}await sleep(4000*(i+1))}if(response?.status()!==200)throw last||new Error('navigation failed');await ready(page)}
          async function ready(page){await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:50000});await page.waitForFunction(()=>{const v=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};return [...document.querySelectorAll('#MainContent .sq-refine-v3-sidebar')].some(v)},null,{timeout:20000});await sleep(1200)}
          async function state(page){return page.evaluate(()=>{const vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'};const main=document.querySelector('#MainContent'),side=[...main.querySelectorAll('.sq-refine-v3-sidebar')].find(vis),grid=[...main.querySelectorAll('.sq-refine-v3-results .product-grid')].find(vis),products=grid?[...grid.querySelectorAll('a[href*="/products/"]')].filter(vis).map(a=>new URL(a.href,location.origin).pathname).filter((x,i,a)=>a.indexOf(x)===i):[],legacy=[...main.querySelectorAll('[class*="button-tree"],[class*="root-categories"],[class*="third-level"],[class*="branch-grid"],[class*="type-grid"],[class*="program-tree"],[class*="category-grid"],[class*="navigation-grid"],.sqbfl')].filter(e=>!e.closest('.sq-refine-v3-sidebar,.sq-refine-v3-results')&&vis(e));return{url:location.href,side:!!side,title:(side?.querySelector('.sq-refine-v3-sidebar__title')?.textContent||'').trim(),products,legacy:legacy.length,ready:main?.dataset.sqRefineV3Ready==='true',error:main?.dataset.sqRefineV3Error||'',childIsolation:document.documentElement.dataset.sqRefineV3ChildIsolation||'',childRoot:document.documentElement.dataset.sqRefineV3ChildRoot||'',authorAuthority:main?.dataset.sqRefineV3AuthorAuthority||'',author:main?.dataset.sqRefineV3Author||'',authorError:main?.dataset.sqRefineV3AuthorError||''}})}
          const changed=(a,b)=>a.length&&b.length&&(a.length!==b.length||a.some(x=>!b.includes(x))||b.some(x=>!a.includes(x)));
          function assertState(label,s){if(!s.ready||s.error)throw new Error(label+' V3 not ready '+JSON.stringify(s));if(!s.side||s.title!=='REFINE PRODUCTS')throw new Error(label+' sidebar missing '+JSON.stringify(s));if(s.legacy)throw new Error(label+' legacy navigation visible '+JSON.stringify(s));if(s.authorError)throw new Error(label+' author error '+s.authorError)}
          const browser=await chromium.launch({headless:true});

          // Structural filter: root -> child -> refresh -> Back. Refine must remain authoritative throughout.
          {
            const c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();await nav(p,'/collections/accessories-gifts-collectibles');const before=await state(p);assertState('STRUCTURAL root',before);
            const input=p.locator('#MainContent .sq-refine-v3-sidebar input[data-kind="structural"][data-target^="/collections/"]').first();if(!await input.count())throw new Error('STRUCTURAL checkbox missing');const d=input.locator('xpath=ancestor::details[1]');if(await d.getAttribute('open')===null)await d.locator(':scope > summary').click();const target=await input.getAttribute('data-target'),tu=new URL(target,BASE);if(tu.searchParams.get('sq_root')!=='accessories-gifts-collectibles')throw new Error('STRUCTURAL target missing root '+target);
            const old=p.url();await input.evaluate(i=>i.click());await p.waitForFunction(u=>location.href!==u,old,{timeout:30000});await ready(p);const child=await state(p);assertState('STRUCTURAL child',child);const cu=new URL(child.url);if(cu.pathname==='/collections/accessories-gifts-collectibles'||cu.searchParams.get('sq_root')!=='accessories-gifts-collectibles')throw new Error('STRUCTURAL bad child '+child.url);if(child.childIsolation!=='true'||child.childRoot!=='accessories-gifts-collectibles')throw new Error('STRUCTURAL isolation inactive '+JSON.stringify(child));if(!changed(before.products,child.products))throw new Error('STRUCTURAL products unchanged');
            await p.reload({waitUntil:'domcontentloaded',timeout:90000});await ready(p);const refreshed=await state(p);assertState('STRUCTURAL refresh',refreshed);if(refreshed.childIsolation!=='true'||new URL(refreshed.url).searchParams.get('sq_root')!=='accessories-gifts-collectibles')throw new Error('STRUCTURAL refresh lost root');
            await p.goBack({waitUntil:'domcontentloaded',timeout:90000});await ready(p);const back=await state(p);assertState('STRUCTURAL back',back);if(new URL(back.url).pathname!=='/collections/accessories-gifts-collectibles')throw new Error('STRUCTURAL back route '+back.url);console.log('STRUCTURAL PASS',JSON.stringify({target,before:before.products.length,child:child.products.length}));await c.close();
          }

          // Books Author: prefer real native Author: tags when present; otherwise certify the existing search-backed
          // author filter. In both modes the checkbox must stay inside Refine, change the visible product set,
          // survive refresh, clear cleanly, and allow switching to another author.
          {
            const c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();await nav(p,'/collections/literature');await sleep(1800);const root=await state(p);assertState('BOOKS root',root);
            async function controls(){
              await p.waitForFunction(()=>{const m=document.querySelector('#MainContent');return m?.dataset.sqRefineV3AuthorAuthority||document.querySelector('#MainContent .sq-refine-v3-sidebar details[data-sq-author-refine="true"]')},null,{timeout:15000});
              const native=p.locator('#MainContent .sq-refine-v3-sidebar details[data-sq-author-tag-authority="true"] input[data-kind="native"][data-filter-name="filter.p.tag"][data-filter-value]');
              if(await native.count()>=2)return{mode:'native-tag',inputs:native,param:'filter.p.tag',value:async i=>native.nth(i).getAttribute('data-filter-value')};
              const fallback=p.locator('#MainContent .sq-refine-v3-sidebar details[data-sq-author-refine="true"] input[data-kind="author"][data-author][data-target]');
              if(await fallback.count()>=2)return{mode:'search-fallback',inputs:fallback,param:'sq_author',value:async i=>fallback.nth(i).getAttribute('data-author')};
              const diag=await p.evaluate(()=>({authority:document.querySelector('#MainContent')?.dataset.sqRefineV3AuthorAuthority||'',meta:document.querySelector('[data-sq-literature-meta]')?.textContent?.slice(0,500)||'',tags:document.querySelector('[data-sq-refine-v3-book-tags]')?.textContent?.slice(0,500)||'',groups:[...document.querySelectorAll('#MainContent .sq-refine-v3-sidebar > details > summary')].map(x=>x.textContent.trim())}));throw new Error('BOOKS author controls missing '+JSON.stringify(diag));
            }
            let ctl=await controls(),first=await ctl.value(0),second=await ctl.value(1);console.log('BOOKS MODE',ctl.mode,JSON.stringify({first,second}));
            let old=p.url();await ctl.inputs.nth(0).evaluate(i=>i.click());await p.waitForFunction(u=>location.href!==u,old,{timeout:30000});await ready(p);await sleep(2200);let one=await state(p);assertState('BOOKS author 1',one);if(!new URL(one.url).searchParams.getAll(ctl.param).includes(first))throw new Error('BOOKS author 1 URL missing '+first+' '+one.url);if(!changed(root.products,one.products))throw new Error('BOOKS author 1 products unchanged '+JSON.stringify({mode:ctl.mode,first,root:root.products.slice(0,8),one:one.products.slice(0,8)}));
            await p.reload({waitUntil:'domcontentloaded',timeout:90000});await ready(p);await sleep(2200);let re=await state(p);assertState('BOOKS author refresh',re);ctl=await controls();const checked=ctl.inputs.filter(':checked');if(await checked.count()!==1)throw new Error('BOOKS author checked state lost after refresh '+JSON.stringify(re));
            old=p.url();await checked.first().evaluate(i=>i.click());await p.waitForFunction(u=>location.href!==u,old,{timeout:30000});await ready(p);await sleep(1500);let cleared=await state(p);assertState('BOOKS author cleared',cleared);if(new URL(cleared.url).searchParams.getAll(ctl.param).length)throw new Error('BOOKS author did not clear '+cleared.url);
            ctl=await controls();let secondIndex=-1;for(let i=0;i<await ctl.inputs.count();i++){if(await ctl.value(i)===second){secondIndex=i;break}}if(secondIndex<0)throw new Error('BOOKS second author control missing '+second);old=p.url();await ctl.inputs.nth(secondIndex).evaluate(i=>i.click());await p.waitForFunction(u=>location.href!==u,old,{timeout:30000});await ready(p);await sleep(2200);let two=await state(p);assertState('BOOKS author 2',two);if(!new URL(two.url).searchParams.getAll(ctl.param).includes(second))throw new Error('BOOKS author 2 URL missing '+second+' '+two.url);if(!changed(root.products,two.products))throw new Error('BOOKS author 2 products unchanged '+JSON.stringify({mode:ctl.mode,second,root:root.products.slice(0,8),two:two.products.slice(0,8)}));console.log('BOOKS AUTHOR PASS',JSON.stringify({mode:ctl.mode,first,second,one:one.products.length,two:two.products.length}));await c.close();
          }
          await browser.close();console.log('PERSISTENCE CERT PASS');
          EOF
          node persistence.mjs