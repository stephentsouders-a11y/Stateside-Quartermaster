name: Refine V3 fast 41-route gate
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/scripts/refine-v3-fast-cert.mjs'
      - '.github/workflows/refine-v3-fast-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run fast certification
        run: node .github/scripts/refine-v3-fast-cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-fast-cert
          path: cert-v3-fast/
          retention-days: 7
