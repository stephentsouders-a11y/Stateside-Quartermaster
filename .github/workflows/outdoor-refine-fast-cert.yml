# certification trigger
name: Outdoor Refine fast Chromium certification
on:
  push:
    paths:
      - '.github/workflows/outdoor-refine-fast-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click every Refine Products choice on draft theme
        run: |
          mkdir -p out/screens
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const theme='158561894555';
          const root='outdoor-preparedness-gear';
          const base=`https://www.statesideqm.com/collections/${root}?preview_theme_id=${theme}&sq_per_page=50`;
          const expected=new Map([
            ['Bushcraft, Field Tools & Carabiners','bushcraft-field-tools-carabiners'],
            ['Camp Cooking & Utensils','camp-cooking-utensils'],
            ['Cold Weather & Thermal Gear','cold-weather-thermal-gear'],
            ['Emergency Food & Camp Meals','emergency-food-camp-meals-1'],
            ['Fire Starting & Hand Warmers','fire-starting-hand-warmers'],
            ['Fishing, Hunting & Trail Gear','fishing-hunting-trail-gear'],
            ['Navigation, Binoculars & Signaling','navigation-binoculars-signaling'],
            ['Outdoor Lighting & Headlamps','outdoor-lighting-headlamps-1'],
            ['Outdoor Packs, Pouches & Dry Bags','outdoor-packs-pouches-dry-bags'],
            ['Sleeping Systems','sleeping-systems'],
            ['Solar & Portable Power','solar-portable-power-1'],
            ['Survival & Emergency Kits','survival-emergency-kits-1'],
            ['Tents, Shelters & Weather Protection','tents-shelters-weather-protection'],
            ['Water & Hydration','water-hydration-1']
          ]);
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const report={base,initial:null,inventory:[],choices:[],failures:[],consoleErrors:[],startedAt:new Date().toISOString()};
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1100}});
          const page=await ctx.newPage();
          page.setDefaultTimeout(15000); page.setDefaultNavigationTimeout(45000);
          let currentLabel='seed';
          page.on('pageerror',e=>report.consoleErrors.push(`${currentLabel}: pageerror ${e}`));
          page.on('console',m=>{if(m.type()==='error'&&!/favicon|ERR_BLOCKED_BY_CLIENT|shop\.app|Content Security Policy|Failed to load resource.*(?:403|429)/i.test(m.text()))report.consoleErrors.push(`${currentLabel}: ${m.text()}`)});
          async function gotoWithBackoff(url){
            let lastStatus=0;
            for(let attempt=0;attempt<6;attempt++){
              const r=await page.goto(url,{waitUntil:'domcontentloaded'}).catch(()=>null);
              lastStatus=r?.status()||0;
              if(lastStatus===200)return r;
              if(lastStatus!==429&&lastStatus!==502&&lastStatus!==503&&lastStatus!==504)throw new Error(`HTTP ${lastStatus||'navigation failure'}`);
              const wait=Math.min(30000,4000*Math.pow(1.7,attempt));
              console.log(`backoff HTTP ${lastStatus} for ${Math.round(wait)}ms`);
              await sleep(wait);
            }
            throw new Error(`HTTP ${lastStatus} after retries`);
          }
          async function openBase(){
            await gotoWithBackoff(base);
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:25000});
            await page.waitForTimeout(500);
          }
          const snapshot=()=>page.evaluate(()=>{const m=document.querySelector('#MainContent'),v=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};const rg=m?.querySelector('.sq-refine-v3-results .product-grid');return {theme:String(window.Shopify?.theme?.id||''),ready:m?.dataset.sqRefineV3Ready||null,sidebar:[...(m?.querySelectorAll('.sq-refine-v3-sidebar')||[])].filter(v).length,legacy:[...(m?.querySelectorAll('.sq-subcategory-card')||[])].filter(v).length,native:[...(m?.querySelectorAll('.facets-block-wrapper--horizontal .facets__filters-wrapper,.facets-toggle__wrapper,theme-drawer#filters-drawer')||[])].filter(v).length,grids:[...(m?.querySelectorAll('.product-grid')||[])].filter(g=>v(g)&&g.querySelector('a[href*="/products/"]')).length,cards:rg?[...rg.children].filter(v).length:0,stateGuard:/State Guard Uniform Builder|Build Your Uniform|PT Uniform/i.test(m?.innerText||'')}});
          try{
            await openBase();
            report.initial=await snapshot();
            if(report.initial.theme!==theme)report.failures.push(`wrong preview theme ${report.initial.theme}`);
            if(report.initial.sidebar!==1)report.failures.push(`sidebar=${report.initial.sidebar}`);
            if(report.initial.legacy)report.failures.push(`legacy cards=${report.initial.legacy}`);
            if(report.initial.native)report.failures.push(`native filters=${report.initial.native}`);
            if(report.initial.grids!==1)report.failures.push(`visible grids=${report.initial.grids}`);
            if(report.initial.stateGuard)report.failures.push('State Guard contamination');
            report.inventory=await page.evaluate(()=>{const side=document.querySelector('#MainContent .sq-refine-v3-sidebar');return [...side.querySelectorAll('details.sq-refine-v3-group')].flatMap((d,gi)=>{const group=(d.querySelector(':scope > summary')?.textContent||'').replace(/\s+/g,' ').trim();return [...d.querySelectorAll('input[type="checkbox"]')].map((i,ii)=>({group,gi,ii,label:(i.closest('label')?.querySelector('span')?.textContent||i.closest('label')?.textContent||i.dataset.filterValue||i.value||'').replace(/\s+/g,' ').trim(),target:i.dataset.target||'',filterName:i.dataset.filterName||'',filterValue:i.dataset.filterValue||'',kind:i.dataset.kind||''}))})});
            const cats=report.inventory.filter(x=>x.group==='Shop by Category');
            if(cats.length!==14)report.failures.push(`category count ${cats.length}`);
            for(const [lab] of expected)if(!cats.some(x=>x.label===lab))report.failures.push(`missing category ${lab}`);
            for(const c of cats)if(!expected.has(c.label))report.failures.push(`unexpected category ${c.label}`);
            for(let n=0;n<report.inventory.length;n++){
              const meta=report.inventory[n]; currentLabel=`${meta.group} > ${meta.label}`;
              const errors=[];
              try{
                if(n>0)await sleep(1800);
                await openBase();
                const d=page.locator('#MainContent details.sq-refine-v3-group').nth(meta.gi);
                if(!(await d.getAttribute('open')))await d.locator(':scope > summary').click();
                const input=d.locator('input[type="checkbox"]').nth(meta.ii);
                await input.scrollIntoViewIfNeeded();
                const before=page.url();
                await input.click({force:true});
                await page.waitForFunction(old=>location.href!==old,before,{timeout:10000}).catch(()=>{});
                await page.waitForLoadState('domcontentloaded').catch(()=>{});
                if((await page.locator('body').count())===0)throw new Error('empty document');
                await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:20000}).catch(()=>{});
                await page.waitForTimeout(450);
                if((await page.locator('body').innerText().catch(()=>''))==='')throw new Error('empty body');
                const u=new URL(page.url()), state=await snapshot();
                if(state.ready!=='true')errors.push(`ready=${state.ready}`);
                if(state.sidebar!==1)errors.push(`sidebar=${state.sidebar}`);
                if(state.grids!==1)errors.push(`grids=${state.grids}`);
                if(state.legacy)errors.push(`legacy=${state.legacy}`);
                if(state.native)errors.push(`native=${state.native}`);
                if(meta.group==='Shop by Category'){
                  const h=expected.get(meta.label);
                  if(!h)errors.push('unexpected category');
                  else if(u.pathname!==`/collections/${h}`)errors.push(`path=${u.pathname} expected=/collections/${h}`);
                  if(state.cards<1)errors.push('zero products');
                }else if(meta.kind==='structural'){
                  const t=new URL(meta.target,base);if(u.pathname!==t.pathname)errors.push(`path=${u.pathname} expected=${t.pathname}`);if(state.cards<1)errors.push('zero products');
                }else{
                  if(!meta.filterName||!meta.filterValue)errors.push('missing filter metadata');
                  else if(!u.searchParams.getAll(meta.filterName).includes(meta.filterValue))errors.push(`missing ${meta.filterName}=${meta.filterValue}`);
                  if(state.cards<1)errors.push('zero products');
                }
                report.choices.push({...meta,url:u.href,cards:state.cards,errors});
              }catch(e){errors.push(String(e));report.choices.push({...meta,url:page.url(),cards:0,errors})}
              if(errors.length){report.failures.push(`${currentLabel}: ${errors.join('; ')}`);await page.screenshot({path:`out/screens/${String(n+1).padStart(3,'0')}.png`,fullPage:true}).catch(()=>{})}
              console.log(`${n+1}/${report.inventory.length} ${currentLabel}: ${errors.length?'FAIL':'PASS'}`);
            }
          }catch(e){report.failures.push(`fatal: ${String(e)}`)}
          report.finishedAt=new Date().toISOString();
          fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({initial:report.initial,total:report.inventory.length,tested:report.choices.length,failures:report.failures,consoleErrors:report.consoleErrors.slice(0,50)},null,2));
          await browser.close();
          if(report.failures.length||report.consoleErrors.length)process.exitCode=2;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: outdoor-refine-fast-cert, path: out, retention-days: 14}
