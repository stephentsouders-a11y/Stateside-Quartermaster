name: Sep15 ARNG repeated render diagnostic
on:
  push:
    paths:
      - '.github/workflows/sep12-spinner-source-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Retry ARNG current-draft rendering three times
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright'; import fs from 'fs';
          const base='https://www.statesideqm.com',theme='158770561179',handle='army-national-guard-series';
          const browser=await chromium.launch({headless:true}); const rows=[];
          for(let attempt=1;attempt<=3;attempt++){
            const context=await browser.newContext({viewport:{width:1440,height:1000}}); const page=await context.newPage();
            const u=new URL('/collections/'+handle,base); u.searchParams.set('preview_theme_id',theme); u.searchParams.set('_sq_attempt',String(attempt));
            const rec={attempt,status:null,requests:[],nodes:[]};
            page.on('response',r=>{if(r.status()>=400||/collections\/.+(products\.json|view=|section_id)/.test(r.url()))rec.requests.push({status:r.status(),url:r.url()})});
            try{
              const r=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:60000}); rec.status=r?.status()??null;
              await page.waitForTimeout(9000); rec.title=await page.title(); rec.h1=await page.locator('#MainContent h1,h1').first().innerText().catch(()=>null);
              rec.nodes=await page.evaluate(()=>{const rx=/checking items|loading items|counting items|building the customer-facing product tree|organizing .* products/i;return [...document.querySelectorAll('#MainContent *')].filter(e=>e.children.length===0&&rx.test((e.textContent||'').trim())).map(e=>(e.textContent||'').trim()).slice(0,30)});
              rec.loadState=await page.locator('[data-sqbfl-load-state]').first().getAttribute('data-sqbfl-load-state').catch(()=>null);
            }catch(e){rec.error=String(e)}
            rows.push(rec); console.log(JSON.stringify(rec)); await context.close();
            if(attempt<3) await new Promise(r=>setTimeout(r,15000));
          }
          await browser.close(); fs.mkdirSync('out',{recursive:true}); fs.writeFileSync('out/results.json',JSON.stringify(rows,null,2));
          EOF
          node diag.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep15-arng-repeated-render
          path: out
          retention-days: 7
