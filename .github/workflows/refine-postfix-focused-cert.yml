name: Refine post-fix focused Chromium regression
on:
  push:
    paths:
      - '.github/workflows/refine-postfix-focused-cert.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base='https://www.statesideqm.com',theme='158561894555';
          const paths=['/collections/accessories-gifts-collectibles','/collections/bfl-army-awards-ribbon-mounting-bars','/collections/alabama-state-guard-female-pt-uniform','/collections/body-armor-ballistic-protection','/collections/safety-gear','/collections/army-service-flags'];
          const browser=await chromium.launch({headless:true});let failed=false;
          for(const path of paths){const page=await browser.newPage({viewport:{width:1440,height:1100}});const u=new URL(path,base);u.searchParams.set('preview_theme_id',theme);let r=null;for(let a=0;a<3;a++){r=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:45000}).catch(()=>null);await page.waitForTimeout(1800);if(r?.status()===200)break;await page.waitForTimeout(1500)}const d=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity!==0&&r.width>2&&r.height>2};const side=[...(m?.querySelectorAll('.sq-global-refine-sidebar')||[])].filter(vis),sb=side[0]||null;const native=[...(m?.querySelectorAll('.facets-block-wrapper .facets--horizontal,.facets--horizontal.facets')||[])].filter(vis).flatMap(e=>[...e.querySelectorAll('.facets__filters-wrapper,.facets__summary')].filter(vis));const cards=[...(m?.querySelectorAll('.product-grid__item,.product-card,.sqbfl-product,.sq-type-family-product,.sq-ts-match-card,.sq-custom-color-products__item,.sq-subcategory-card,.sqbfl-card,.sg-entity,.sq-afg-branch-card,.sq-third-level__type,.sq-books-tree a,.sq-msa-card,.sq-thin-line-card,a[href*="/products/"]')||[])].filter(vis).filter(e=>!sb?.contains(e)).sort((a,b)=>a.getBoundingClientRect().top-b.getBoundingClientRect().top||a.getBoundingClientRect().left-b.getBoundingClientRect().left);const sr=sb?.getBoundingClientRect(),fr=cards[0]?.getBoundingClientRect();const under=!!(sr&&fr&&fr.top>sr.bottom-8),overlap=!!(sr&&fr&&!(sr.right<=fr.left+8||fr.right<=sr.left+8||sr.bottom<=fr.top+8||fr.bottom<=sr.top+8)),geometry=!sr||!fr?true:sr.left<fr.left&&sr.right<=fr.left+16&&!overlap&&!under;return{sidebar:side.length,native:native.length,geometry,under,overlap,sidebarRect:sr?{x:sr.x,y:sr.y,w:sr.width,h:sr.height}:null,firstRect:fr?{x:fr.x,y:fr.y,w:fr.width,h:fr.height}:null,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,broken:[...(m?.querySelectorAll('img')||[])].filter(i=>i.complete&&i.naturalWidth===0).length}});const bad=!r||r.status()!==200||d.sidebar!==1||d.native!==0||!d.geometry||d.overflow||d.broken>0;console.log(JSON.stringify({path,status:r?.status()??null,bad,...d}));if(bad)failed=true;await page.close()}await browser.close();if(failed)process.exit(1);
          EOF
          node verify.mjs
