name: Pagination First-Paint Sitewide Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pagination-first-paint-sitewide-audit.yml'
      - '.github/scripts/pagination-first-paint-audit.mjs'
      - 'snippets/pagination-controls.liquid'
      - 'snippets/sq-refine-v3-pagination-repair.liquid'
  workflow_dispatch:

permissions:
  contents: read

env:
  STORE_ORIGIN: https://www.statesideqm.com
  PREVIEW_THEME_ID: '158561894555'
  AUDIT_OUTPUT: audit-output/pagination-first-paint

jobs:
  chromium-playwright-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Run cold-load pagination flash audit with video, traces, screenshots, receipts
        run: node .github/scripts/pagination-first-paint-audit.mjs

      - name: Upload Chromium Playwright audit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pagination-first-paint-audit-${{ github.run_id }}
          path: audit-output/pagination-first-paint
          if-no-files-found: error
          retention-days: 30
