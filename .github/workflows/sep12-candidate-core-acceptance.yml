name: Sep12 candidate core acceptance gate
on:
  push:
    paths:
      - '.github/workflows/sep12-candidate-core-acceptance.yml'
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Audit candidate routes
        env: {SHARD: '${{ matrix.shard }}'}
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';import fs from 'fs';
          const base='https://www.statesideqm.com',theme='158561894555',shard=+process.env.SHARD,shards=4,out='out';fs.mkdirSync(`${out}/screens`,{recursive:true});
          const routes=[
            ['home','/',{home:true,noSidebar:true}],['state-root','/collections/state-guard-series',{stateRoot:true,noSidebar:true}],['state-ohio','/collections/state-guard-series-ohio',{sidebar:true}],
            ['army','/collections/products-built-for-the-line-u-s-army',{sidebar:true,title:/army/i}],['arng','/collections/army-national-guard-series',{sidebar:true,title:/army national guard/i}],['air-force','/collections/products-built-for-the-line-u-s-air-force',{sidebar:true,title:/air force/i}],['ang','/collections/air-national-guard-series',{sidebar:true,title:/air national guard/i}],['navy','/collections/products-built-for-the-line-u-s-navy',{sidebar:true,title:/navy/i}],['marines','/collections/products-built-for-the-line-u-s-marine-corps',{sidebar:true,title:/marine/i}],['coast-guard','/collections/products-built-for-the-line-u-s-coast-guard',{sidebar:true,title:/coast guard/i}],['space-force','/collections/products-built-for-the-line-u-s-space-force',{sidebar:true,title:/space force/i}],['rotc','/collections/rotc-series',{sidebar:true,title:/rotc/i}],['jrotc','/collections/jrotc-series',{sidebar:true,title:/jrotc/i}],['msa','/collections/military-schools-academies',{sidebar:true,title:/military schools|academ/i}],
            ['afg','/collections/armed-forces-gear',{sidebar:true}],['accessories','/collections/accessories-gifts-collectibles',{sidebar:true}],['sta-brite','/collections/sta-brite-insignia',{sidebar:true}],['thin-line','/collections/thin-line',{sidebar:true}],['tactical','/collections/tactical-gear',{sidebar:true}],['uniforms','/collections/uniforms',{sidebar:true}],['medical','/collections/first-aid-medical-ifak',{sidebar:true}],['k9','/collections/k9-dog-gear',{sidebar:true}],['lighting','/collections/flashlights-lighting',{sidebar:true}],['law','/collections/law-enforcement-corrections',{sidebar:true}],['fire-ems','/collections/firefighting-ems-search-rescue',{sidebar:true}],
            ['sf-rank','/collections/space-force-insignia-ranks-awards',{}],['displays','/collections/military-gifts-flags-memorial-displays',{}],['sleep','/collections/sleeping-bags-sleep-systems',{}],['medical-child','/collections/medical-first-aid',{}],['lit-field','/collections/literature-field-manuals-reference-guides',{}],['ifak','/collections/ifak-trauma-kits',{}],['tourniquets','/collections/tourniquets-bleeding-control',{}],['armyng-vietnam','/collections/armyng-vietnam',{}],['molle','/collections/packs-pouches-carry-gear-molle-pouches-organizers',{}],['sta-ribbons','/collections/sta-brite-ribbons-ribbon-mounts',{}],['sta-patches','/collections/sta-brite-patches-tactical-id',{}],['dress-shoes','/collections/bfl-army-uniform-dress-shoes',{}],['blousers','/collections/bfl-army-uniform-boot-blousers',{}],['army-art','/collections/bfl-army-art-historical-prints',{}],
            ['wwii','/collections/literature-u-s-conflicts-world-war-ii',{}],['shield','/collections/shield-republic-apparel',{}],['pew','/collections/pew-pews',{}]
          ];
          const mine=routes.filter((_,i)=>i%shards===shard),sleep=ms=>new Promise(r=>setTimeout(r,ms)),browser=await chromium.launch({headless:true}),rows=[];
          for(const [slug,path,opt] of mine){for(const [device,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){const ctx=await browser.newContext({viewport});const page=await ctx.newPage();page.setDefaultNavigationTimeout(60000);const rec={slug,path,device,status:null,usableMs:null,fcp:null,pageErrors:[],challenge:false};page.on('pageerror',e=>rec.pageErrors.push(e.message));try{const u=new URL(path,base);u.searchParams.set('preview_theme_id',theme);const start=Date.now(),r=await page.goto(u.toString(),{waitUntil:'domcontentloaded'});rec.status=r?.status()??null;await sleep(300);rec.fcp=await page.evaluate(()=>performance.getEntriesByName('first-contentful-paint')[0]?.startTime??null).catch(()=>null);for(let i=0;i<14;i++){const s=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),t=(m?.innerText||'').replace(/\s+/g,' ');return{challenge:/verify you are human|just a moment|connection needs to be verified/i.test((document.title||'')+' '+t),bad:/internal server error|something went wrong|there was a problem/i.test((document.title||'')+' '+t),loading:/loading items|checking items|counting items|building the customer-facing product tree|organizing .* products/i.test(t),visible:!!m&&m.getBoundingClientRect().height>20&&[...m.querySelectorAll('h1,a,.product-grid,.sqsg-grid,.sq-subcategory-grid,.sqbfl-grid')].some(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'})}});rec.challenge=s.challenge;if(!s.challenge&&!s.bad&&!s.loading&&s.visible){rec.usableMs=Date.now()-start;break}await sleep(250)}await sleep(300);Object.assign(rec,await page.evaluate(({opt})=>{const m=document.querySelector('#MainContent'),vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2};const t=(m?.innerText||'').replace(/\s+/g,' ');const side=[...(m?.querySelectorAll('.sq-global-refine-sidebar,.sq-refine-v3-sidebar,.sq-refine-taxonomy')||[])].filter(vis);const h1=(m?.querySelector('h1')?.textContent||'').replace(/\s+/g,' ').trim();const p=m?[...m.querySelectorAll('a[href*="page="],.pagination a,.pagination button,[data-page],[aria-label*="page" i]')].filter(vis).map(e=>({text:(e.textContent||'').trim(),href:e.getAttribute('href')||'',aria:e.getAttribute('aria-label')||''})).slice(0,50):[];const ppp=m?[...m.querySelectorAll('select,button,a,label')].filter(e=>vis(e)&&/products per page|\b50\b|\b100\b|\b250\b/i.test((e.textContent||'')+' '+(e.getAttribute('aria-label')||''))).map(e=>(e.textContent||e.getAttribute('aria-label')||'').trim()).slice(0,30):[];const homeTexts=m?[...m.querySelectorAll('a,button')].filter(vis).map(e=>(e.textContent||'').replace(/\s+/g,' ').trim()).filter(Boolean):[];const pub=homeTexts.filter(x=>/law enforcement|firefight|ems|search.*rescue/i.test(x));const sgPromo=document.querySelector('[data-sq-state-guard-merch-feature]'),sgGrid=document.querySelector('[data-sq-state-guard-root] .sg-entity-grid');const sgCols=sgGrid?getComputedStyle(sgGrid).gridTemplateColumns.split(' ').filter(Boolean).length:0;return{h1,loading:/loading items|checking items|counting items|building the customer-facing product tree|organizing .* products/i.test(t),bad:/internal server error|something went wrong|there was a problem/i.test((document.title||'')+' '+t),sidebarCount:side.length,brokenImages:m?[...m.querySelectorAll('img')].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.currentSrc||i.src):[],overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,pagination:p,productsPerPage:ppp,publicSafetyButtons:pub,statePromoBeforeGrid:!!(sgPromo&&sgGrid&&(sgPromo.compareDocumentPosition(sgGrid)&Node.DOCUMENT_POSITION_FOLLOWING)),stateGridCols:sgCols,footerOverlap:(()=>{const f=document.querySelector('footer');if(!f||!m)return false;const fr=f.getBoundingClientRect(),mr=m.getBoundingClientRect();return fr.top<mr.bottom-2})()}} ,{opt}));await page.screenshot({path:`${out}/screens/${slug}-${device}.png`,fullPage:false}).catch(()=>{})}catch(e){rec.error=String(e).split('\n')[0]}const titleOk=!opt.title||opt.title.test(rec.h1||'');const sideOk=opt.noSidebar?rec.sidebarCount===0:opt.sidebar?rec.sidebarCount===1:true;const perfOk=rec.usableMs!==null&&rec.usableMs<=3500&&(rec.fcp===null||rec.fcp<=2500);const stateOk=!opt.stateRoot||(device==='mobile'||rec.stateGridCols>=4)&&rec.statePromoBeforeGrid&&rec.sidebarCount===0;const homeOk=!opt.home||rec.publicSafetyButtons.length<=2;rec.fail=(!rec.challenge&&rec.status!==200)||rec.bad||rec.loading||rec.brokenImages?.length||rec.overflow||rec.footerOverlap||!titleOk||!sideOk||!perfOk||!stateOk||!homeOk||rec.pageErrors.some(x=>/syntaxerror|unexpected token/i.test(x));rows.push(rec);await ctx.close();await sleep(1800)}}await browser.close();const summary={shard,tested:rows.length,failed:rows.filter(r=>r.fail).length,challenges:rows.filter(r=>r.challenge).length,status500:rows.filter(r=>r.status>=500).map(r=>r.path),spinner:rows.filter(r=>r.loading).map(r=>r.path),broken:rows.filter(r=>r.brokenImages?.length).map(r=>r.path),missingTitles:rows.filter(r=>!r.h1).map(r=>r.path),perf:rows.filter(r=>r.usableMs===null||r.usableMs>3500||(r.fcp!==null&&r.fcp>2500)).map(r=>({path:r.path,device:r.device,usable:r.usableMs,fcp:r.fcp}))};fs.writeFileSync(`${out}/results-${shard}.json`,JSON.stringify(rows,null,2));fs.writeFileSync(`${out}/summary-${shard}.json`,JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));if(summary.failed)process.exitCode=2;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep12-core-${{ matrix.shard }}
          path: out
          retention-days: 7
