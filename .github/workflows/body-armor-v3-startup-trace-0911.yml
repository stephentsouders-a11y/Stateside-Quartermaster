name: Body Armor V3 Chromium startup trace
on:
  push:
    paths:
      - '.github/workflows/body-armor-v3-startup-trace-0911.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Compare Body Armor with Flashlights
        run: |
          cat > trace.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true});
          const tests=[['Body Armor','/collections/body-armor-ballistic-protection'],['Flashlights','/collections/flashlights-lighting']];
          for(const [name,path] of tests){
            for(let sample=1;sample<=3;sample++){
              const c=await b.newContext({viewport:{width:1440,height:1000}});const p=await c.newPage();const started=Date.now();const req=[];
              p.on('request',r=>{try{const u=new URL(r.url());if(u.hostname.endsWith('statesideqm.com')&&(u.pathname===path||u.searchParams.get('view')==='sq-refine-v3-products'))req.push({kind:'start',t:Date.now()-started,url:u.pathname+u.search})}catch{}});
              p.on('response',r=>{try{const u=new URL(r.url());if(u.hostname.endsWith('statesideqm.com')&&(u.pathname===path||u.searchParams.get('view')==='sq-refine-v3-products'))req.push({kind:'response',t:Date.now()-started,status:r.status(),url:u.pathname+u.search})}catch{}});
              await p.addInitScript(()=>{window.__timeline=[];const t=(label)=>window.__timeline.push({label,t:Math.round(performance.now())});t('init');document.addEventListener('DOMContentLoaded',()=>t('DOMContentLoaded'),{once:true});window.addEventListener('load',()=>t('load'),{once:true});const poll=setInterval(()=>{const m=document.querySelector('#MainContent');if(!m)return;const v=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'};const side=[...m.querySelectorAll('.sq-refine-v3-sidebar')].find(v),grid=[...m.querySelectorAll('.product-grid')].find(g=>v(g)&&[...g.querySelectorAll(':scope>.product-grid__item')].some(v));for(const [label,ok] of [['main',!!m],['sidebar',!!side],['grid',!!grid],['ready',m.dataset.sqRefineV3Ready==='true'],['fallback',m.dataset.sqRefineV3Fallback==='true'],['rescued',m.dataset.sqRefineV3VisibleGridRescued==='true']]){if(ok&&!window.__timeline.some(x=>x.label===label))t(label)}if(m.dataset.sqRefineV3Ready==='true')clearInterval(poll)},25)});
              const u=new URL(path,'https://www.statesideqm.com');u.searchParams.set('preview_theme_id','158561894555');let status=null;try{const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:60000});status=r?.status()??null}catch{}
              await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:12000}).catch(()=>{});await p.waitForTimeout(300);
              const state=await p.evaluate(()=>({timeline:window.__timeline||[],ready:document.querySelector('#MainContent')?.dataset.sqRefineV3Ready||null,fallback:document.querySelector('#MainContent')?.dataset.sqRefineV3Fallback||null,error:document.querySelector('#MainContent')?.dataset.sqRefineV3Error||null,grids:[...document.querySelectorAll('#MainContent .product-grid')].map(g=>({cards:g.querySelectorAll(':scope>.product-grid__item').length,display:getComputedStyle(g).display,inResults:!!g.closest('.sq-refine-v3-results')}))}));
              console.log('TRACE '+JSON.stringify({name,sample,status,requests:req,state}));await c.close();
            }
          }
          await b.close();
          EOF
          node trace.mjs
