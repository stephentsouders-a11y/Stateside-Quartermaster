name: Refine V3 Pagination Chromium Certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-pagination-chromium-cert.yml'
      - 'snippets/sq-refine-v3-pagination-repair.liquid'
      - 'snippets/sq-refine-v3.liquid'
      - 'sections/sq-refine-v3-product-grid.liquid'
      - 'layout/theme.liquid'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify-pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Exhaustively reconcile source products with every customer page
        run: |
          cat > pagination-cert.mjs <<'EOFJS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('out',{recursive:true});
          const theme='158561894555';
          const base='https://www.statesideqm.com/collections/';
          const sizes=[50,100,250];
          const roots=[
            'accessories-gifts-collectibles','airsoft-milsim','apparel','armed-forces-gear','art',
            'body-armor-ballistic-protection','literature','child-safety-shop','dive-scuba','firearm-accessories',
            'first-aid-medical-ifak','flags-patriotic-decor','flashlights-lighting','footwear-gloves-eyewear',
            'k9-dog-gear','knives-axes-cutlery','morale-patches-tactical-id','outdoor-preparedness-gear',
            'patriotic-american-heritage','safety-rescue-climbing','sta-brite-insignia','tactical-gear','thin-line',
            'uniforms','watches','zippos-lighters-torches','stateside-quartermaster-logo-merch',
            'army-national-guard-series','air-national-guard-series','products-built-for-the-line-u-s-army',
            'products-built-for-the-line-u-s-navy','products-built-for-the-line-u-s-air-force',
            'products-built-for-the-line-u-s-marine-corps','products-built-for-the-line-u-s-coast-guard',
            'products-built-for-the-line-u-s-space-force','rotc-series','jrotc-series','military-schools-academies',
            'law-enforcement-corrections','firefighting-ems-search-rescue'
          ];
          const routes=roots.map(handle=>({handle,root:null}));
          routes.push({handle:'literature-u-s-army',root:'literature'});
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000}});
          const report={theme,sizes,routes:routes.map(x=>x.handle),checked:[],source:[],failures:[]};
          const fail=(h,s,v,m)=>report.failures.push(`${h} @ ${s ?? 'source'} page ${v}: ${m}`);
          const norm=x=>{try{return new URL(x,'https://www.statesideqm.com').pathname.replace(/\/$/,'')}catch{return x}};
          const cardSelector='#MainContent .sq-refine-v3-results .product-grid > .product-grid__item';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function gotoWithRetry(page,url,label){
            let last=null;
            for(let attempt=1;attempt<=7;attempt++){
              try{
                const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
                const status=r?.status()||0;
                if(r?.ok()){
                  await sleep(350);
                  return r;
                }
                last=new Error(`HTTP ${status}`);
                if(status===429 || status>=500){
                  await sleep(Math.min(15000,1000*Math.pow(2,attempt-1)));
                  continue;
                }
                throw last;
              }catch(e){
                last=e;
                if(attempt===7)break;
                await sleep(Math.min(15000,1000*Math.pow(2,attempt-1)));
              }
            }
            throw new Error(`${label}: ${String(last)}`);
          }
          async function waitV3(page){
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset?.sqRefineV3Ready==='true',{timeout:45000});
            await page.waitForFunction(()=>{
              const d=document.querySelector('#MainContent')?.dataset||{};
              return d.sqRefineV3PaginationRepaired==='true'||!!d.sqRefineV3PaginationRepairError;
            },{timeout:30000}).catch(()=>{});
            await sleep(300);
          }
          async function customerHrefs(page){
            return await page.$$eval(cardSelector,els=>[...new Set(els.map(el=>el.querySelector('a[href*="/products/"]')?.href).filter(Boolean))]);
          }
          async function sourceHrefs(page){
            return await page.$$eval('.product-grid a[href*="/products/"]',els=>[...new Set(els.map(a=>a.href).filter(Boolean))]);
          }
          async function pagerState(page){
            return await page.evaluate(()=>{
              const all=[...document.querySelectorAll('#MainContent .sq-refine-v3-pager')];
              const p=all[0];
              if(!p)return {exists:false,count:0,next:null,previous:null,text:''};
              const links=[...p.querySelectorAll('a')].map(a=>({text:(a.textContent||'').trim(),href:a.href}));
              return {exists:true,count:all.length,text:(p.textContent||'').replace(/\s+/g,' ').trim(),next:links.find(x=>/next/i.test(x.text))||null,previous:links.find(x=>/previous/i.test(x.text))||null};
            });
          }
          function routeUrl(route){
            const u=new URL(`${base}${route.handle}`);
            u.searchParams.set('preview_theme_id',theme);
            if(route.root)u.searchParams.set('sq_root',route.root);
            return u;
          }
          function sourcePath(route){
            return route.handle==='air-national-guard-series'?'products-built-for-the-line-u-s-air-force':route.handle;
          }
          async function enumerateSource(route){
            const page=await context.newPage();
            const expected=new Set();
            const counts=[];
            let terminated=false;
            try{
              for(let nativePage=1;nativePage<=150;nativePage++){
                const u=new URL(`${base}${sourcePath(route)}`);
                u.searchParams.set('preview_theme_id',theme);
                u.searchParams.set('view','sq-refine-v3-products');
                u.searchParams.set('page',String(nativePage));
                if(route.root)u.searchParams.set('sq_root',route.root);
                await gotoWithRetry(page,u.toString(),`${route.handle} source page ${nativePage}`);
                const links=(await sourceHrefs(page)).map(norm);
                counts.push(links.length);
                if(!links.length){terminated=true;break;}
                links.forEach(x=>expected.add(x));
                if(links.length<50){terminated=true;break;}
                await sleep(400);
              }
              if(!terminated)fail(route.handle,null,150,'source enumeration did not terminate');
            }catch(e){fail(route.handle,null,counts.length+1,`source enumeration failed: ${String(e)}`)}
            await page.close();
            report.source.push({handle:route.handle,totalUniqueProducts:expected.size,nativePageCounts:counts});
            return expected;
          }
          for(const route of routes){
            const expected=await enumerateSource(route);
            if(expected.size<1){fail(route.handle,null,1,'source contains zero products');await sleep(1200);continue;}
            for(const size of sizes){
              const page=await context.newPage();
              const seen=new Set();
              const pages=[];
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              let view=1,finished=false,guard=0;
              while(!finished && guard<150){
                guard++;
                const u=routeUrl(route);
                u.searchParams.set('sq_per_page',String(size));
                u.searchParams.set('sq_view_page',String(view));
                try{
                  await gotoWithRetry(page,u.toString(),`${route.handle} customer ${size} page ${view}`);
                  await waitV3(page);
                }catch(e){fail(route.handle,size,view,`navigation/readiness failed: ${String(e)}`);break}
                const products=(await customerHrefs(page)).map(norm);
                const pager=await pagerState(page);
                const mainData=await page.$eval('#MainContent',el=>({...el.dataset})).catch(()=>({}));
                const duplicates=products.filter(x=>seen.has(x));
                products.forEach(x=>seen.add(x));
                pages.push({view,products:products.length,pagerText:pager.text,next:!!pager.next,previous:!!pager.previous,duplicates:duplicates.length,marker:mainData.sqRefineV3PaginationCertified||null});
                if(products.length<1)fail(route.handle,size,view,'customer page rendered zero products');
                if(products.length>size)fail(route.handle,size,view,`rendered ${products.length} products (> ${size})`);
                if(duplicates.length)fail(route.handle,size,view,`repeated ${duplicates.length} product(s)`);
                if((pager.count||0)!==1)fail(route.handle,size,view,`expected exactly one pager, found ${pager.count||0}`);
                if(view===1 && pager.previous)fail(route.handle,size,view,'Page 1 exposes Previous');
                if(view>1 && !pager.previous)fail(route.handle,size,view,'missing Previous');
                if(mainData.sqRefineV3PaginationRepairError)fail(route.handle,size,view,`repair error: ${mainData.sqRefineV3PaginationRepairError}`);
                if(mainData.sqRefineV3PaginationRepaired!=='true')fail(route.handle,size,view,'pagination repair marker missing');
                if(mainData.sqRefineV3PaginationPageSize!==String(size))fail(route.handle,size,view,`page-size marker is ${mainData.sqRefineV3PaginationPageSize||'missing'}`);
                if(pager.next){
                  const nextUrl=new URL(pager.next.href);const nextView=Number(nextUrl.searchParams.get('sq_view_page'));
                  if(nextView!==view+1)fail(route.handle,size,view,`Next targets page ${nextView}, expected ${view+1}`);
                  view++;
                }else finished=true;
                await sleep(450);
              }
              if(guard>=150 && !finished)fail(route.handle,size,view,'pagination did not terminate within 150 pages');
              if(errors.length)fail(route.handle,size,view,`${errors.length} uncaught browser page error(s)`);
              const missing=[...expected].filter(x=>!seen.has(x));
              const unexpected=[...seen].filter(x=>!expected.has(x));
              if(missing.length)fail(route.handle,size,view,`${missing.length} source product(s) never appeared to customer`);
              if(unexpected.length)fail(route.handle,size,view,`${unexpected.length} customer product(s) absent from source set`);
              if(seen.size!==expected.size)fail(route.handle,size,view,`customer unique ${seen.size} != source unique ${expected.size}`);
              report.checked.push({handle:route.handle,root:route.root,size,sourceUniqueProducts:expected.size,totalLogicalPages:pages.length,totalUniqueProducts:seen.size,missing:missing.slice(0,25),unexpected:unexpected.slice(0,25),finished,pages});
              if(route.handle==='literature-u-s-army'||report.failures.some(x=>x.startsWith(`${route.handle} @ ${size}`))){await page.screenshot({path:`out/${route.handle}-${size}-final.png`,fullPage:true}).catch(()=>{})}
              await page.close();
              await sleep(700);
            }
            await sleep(1200);
          }
          await browser.close();
          report.summary={routes:routes.length,sizes:sizes.length,cases:report.checked.length,totalLogicalPages:report.checked.reduce((n,x)=>n+x.totalLogicalPages,0),failures:report.failures.length};
          fs.writeFileSync('out/pagination-report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(report.failures.length)process.exitCode=2;
          EOFJS
          node pagination-cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-pagination-chromium-cert
          path: out
          retention-days: 14
