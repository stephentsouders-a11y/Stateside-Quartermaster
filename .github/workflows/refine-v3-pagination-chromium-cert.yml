name: Refine V3 Pagination Chromium Certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-pagination-chromium-cert.yml'
      - 'snippets/sq-refine-v3-pagination-repair.liquid'
      - 'snippets/sq-refine-v3.liquid'
      - 'sections/sq-refine-v3-product-grid.liquid'
      - 'layout/theme.liquid'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify-pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Exhaustively certify all customer-accessible product pages
        run: |
          cat > pagination-cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('out',{recursive:true});
          const theme='158561894555';
          const base='https://www.statesideqm.com/collections/';
          const sizes=[50,100,250];
          const handles=[
            'accessories-gifts-collectibles','airsoft-milsim','apparel','armed-forces-gear',
            'art','body-armor-ballistic-protection','literature','child-safety-shop','dive-scuba',
            'firearm-accessories','first-aid-medical-ifak','flags-patriotic-decor','flashlights-lighting',
            'footwear-gloves-eyewear','k9-dog-gear','knives-axes-cutlery','morale-patches-tactical-id',
            'outdoor-preparedness-gear','patriotic-american-heritage','safety-rescue-climbing',
            'sta-brite-insignia','tactical-gear','thin-line','uniforms','watches','zippos-lighters-torches',
            'stateside-quartermaster-logo-merch','army-national-guard-series','air-national-guard-series',
            'products-built-for-the-line-u-s-army','products-built-for-the-line-u-s-navy',
            'products-built-for-the-line-u-s-air-force','products-built-for-the-line-u-s-marine-corps',
            'products-built-for-the-line-u-s-coast-guard','products-built-for-the-line-u-s-space-force',
            'rotc-series','jrotc-series','military-schools-academies','law-enforcement-corrections',
            'firefighting-ems-search-rescue'
          ];
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000}});
          const report={theme,sizes,checked:[],failures:[]};
          const fail=(h,s,v,m)=>report.failures.push(`${h} @ ${s} page ${v}: ${m}`);
          const cardSelector='#MainContent .sq-refine-v3-results .product-grid > .product-grid__item';
          async function waitV3(page){
            await page.waitForLoadState('domcontentloaded');
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset?.sqRefineV3Ready==='true',{timeout:30000});
            await page.waitForTimeout(850);
          }
          async function hrefs(page){
            return await page.$$eval(cardSelector,els=>[...new Set(els.map(el=>el.querySelector('a[href*="/products/"]')?.href).filter(Boolean))]);
          }
          async function pagerState(page){
            return await page.evaluate(()=>{
              const all=[...document.querySelectorAll('#MainContent .sq-refine-v3-pager')];
              const p=all[0];
              if(!p)return {exists:false,count:0,next:null,previous:null,text:''};
              const links=[...p.querySelectorAll('a')].map(a=>({text:(a.textContent||'').trim(),href:a.href}));
              return {
                exists:true,
                count:all.length,
                text:(p.textContent||'').replace(/\s+/g,' ').trim(),
                next:links.find(x=>/next/i.test(x.text))||null,
                previous:links.find(x=>/previous/i.test(x.text))||null
              };
            });
          }
          for(const handle of handles){
            for(const size of sizes){
              const page=await context.newPage();
              const seen=new Set();
              const pages=[];
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              let view=1;
              let finished=false;
              let guard=0;
              while(!finished && guard<150){
                guard++;
                const u=new URL(`${base}${handle}`);
                u.searchParams.set('preview_theme_id',theme);
                u.searchParams.set('sq_per_page',String(size));
                u.searchParams.set('sq_view_page',String(view));
                try{
                  await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:90000});
                  await waitV3(page);
                }catch(e){
                  fail(handle,size,view,`navigation/readiness failed: ${String(e)}`);
                  break;
                }
                const products=await hrefs(page);
                const pager=await pagerState(page);
                const mainData=await page.$eval('#MainContent',el=>({...el.dataset})).catch(()=>({}));
                const duplicates=products.filter(x=>seen.has(x));
                products.forEach(x=>seen.add(x));
                pages.push({view,products:products.length,pagerText:pager.text,next:!!pager.next,previous:!!pager.previous,duplicates:duplicates.length,marker:mainData.sqRefineV3PaginationCertified||null});
                if(products.length<1)fail(handle,size,view,'customer page rendered zero products');
                if(products.length>size)fail(handle,size,view,`rendered ${products.length} products (> ${size})`);
                if(duplicates.length)fail(handle,size,view,`repeated ${duplicates.length} product(s) already shown on an earlier logical page`);
                if((pager.count||0)>1)fail(handle,size,view,`duplicate custom pagers detected: ${pager.count}`);
                if(view===1 && pager.previous)fail(handle,size,view,'Page 1 exposes a Previous link');
                if(view>1 && !pager.previous)fail(handle,size,view,'missing Previous link');
                if(mainData.sqRefineV3PaginationRepairError)fail(handle,size,view,`repair error: ${mainData.sqRefineV3PaginationRepairError}`);
                if(mainData.sqRefineV3PaginationPageSize && mainData.sqRefineV3PaginationPageSize!==String(size))fail(handle,size,view,`page-size marker is ${mainData.sqRefineV3PaginationPageSize}`);
                if(pager.next){
                  const nextUrl=new URL(pager.next.href);
                  const nextView=parseInt(nextUrl.searchParams.get('sq_view_page')||'0',10);
                  if(nextView!==view+1)fail(handle,size,view,`Next targets logical page ${nextView}, expected ${view+1}`);
                  view++;
                }else{
                  finished=true;
                }
              }
              if(guard>=150 && !finished)fail(handle,size,view,'pagination did not terminate within 150 logical pages');
              if(errors.length)fail(handle,size,view,`${errors.length} uncaught browser page error(s)`);
              report.checked.push({handle,size,totalLogicalPages:pages.length,totalUniqueProducts:seen.size,finished,pages});
              if(handle==='literature' || report.failures.some(x=>x.startsWith(`${handle} @ ${size}`))){
                await page.screenshot({path:`out/${handle}-${size}-final.png`,fullPage:true}).catch(()=>{});
              }
              await page.close();
            }
          }
          await browser.close();
          report.summary={cases:report.checked.length,routes:handles.length,sizes:sizes.length,totalLogicalPages:report.checked.reduce((n,x)=>n+x.totalLogicalPages,0),failures:report.failures.length};
          fs.writeFileSync('out/pagination-report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(report.failures.length)process.exitCode=2;
          EOF
          node pagination-cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-pagination-chromium-cert
          path: out
          retention-days: 14
