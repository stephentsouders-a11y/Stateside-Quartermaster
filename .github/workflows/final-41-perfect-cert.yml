name: Final 41 Perfect Chromium Certification
on:
  push:
    paths:
      - '.github/workflows/final-41-perfect-cert.yml'
      - '.github/scripts/final-41-perfect-cert-v2.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install real Chromium Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
        run: node .github/scripts/final-41-perfect-cert-v2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-41-perfect-v2-${{ matrix.shard }}
          path: evidence/
          retention-days: 14
