name: AFG draft Chromium cert 1548
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/afg-draft-chromium-cert-1548.yml']
permissions:
  contents: read
jobs:
  afg-draft-chromium-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify Armed Forces Gear draft
        run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1000}});
          const pageErrors=[];
          page.on('pageerror', e => pageErrors.push(String(e)));
          const response = await page.goto('https://www.statesideqm.com/collections/armed-forces-gear?preview_theme_id=158561894555', {waitUntil:'domcontentloaded',timeout:90000});
          await page.locator('.sq-refine-v3-sidebar').waitFor({state:'visible',timeout:60000});
          await page.waitForTimeout(5000);
          const result=await page.evaluate(()=>{
            const sidebar=document.querySelector('.sq-refine-v3-sidebar');
            const groups=[...sidebar.querySelectorAll('details')].map(d=>d.querySelector('summary')?.textContent?.replace(/\s+/g,' ').trim());
            const inputs=[...sidebar.querySelectorAll('input[type="checkbox"]')];
            const productCount=document.querySelectorAll('.sq-refine-v3-results .product-grid > *, .sq-refine-v3-results .grid__item').length;
            return {url:location.href,groups,checkboxCount:inputs.length,productCount,bodyText:sidebar.innerText};
          });
          result.httpStatus=response?.status();
          result.pageErrors=pageErrors;
          console.log('AFG_DRAFT_RESULT='+JSON.stringify(result));
          const expected=['Shop by Branch','Availability','Type'];
          if(JSON.stringify(result.groups)!==JSON.stringify(expected)) throw new Error('Wrong groups/order: '+JSON.stringify(result.groups));
          if(/Manufacturer|Price|Shop by Category/i.test(result.bodyText)) throw new Error('Forbidden group visible: '+result.bodyText);
          if(result.checkboxCount<3) throw new Error('Expected checkbox controls, got '+result.checkboxCount);
          if(!result.httpStatus || result.httpStatus>=400) throw new Error('HTTP status '+result.httpStatus);
          await page.screenshot({path:'afg-draft-certified.png',fullPage:true});
          await browser.close();
          EOF
          node verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afg-draft-chromium-cert-1548
          path: afg-draft-certified.png
          retention-days: 7
