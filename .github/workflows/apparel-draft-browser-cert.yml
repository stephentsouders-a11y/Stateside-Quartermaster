name: Apparel draft browser cert
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/apparel-draft-browser-cert.yml'

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Browser certify unpublished Apparel theme
        run: |
          cat > certify.mjs <<'JS'
          import { chromium } from 'playwright';
          const expected=['Shop by Category','Shop by Type','Shop by Manufacturer / Artist','Availability'];
          const url='https://www.statesideqm.com/collections/apparel?preview_theme_id=158561894555';
          const browser=await chromium.launch({headless:true});
          let failed=false;
          for (const [device,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]) {
            const ctx=await browser.newContext({viewport});
            const page=await ctx.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:40000});
            await page.waitForTimeout(2500);
            const data=await page.evaluate(()=>({
              themeId:String(window.Shopify?.theme?.id||''),
              ready:document.querySelector('#MainContent')?.dataset.sqRefineV3Ready||'',
              groups:[...document.querySelectorAll('.sq-refine-v3-sidebar>details')].map(d=>d.querySelector(':scope>summary')?.textContent.trim()),
              choices:[...document.querySelectorAll('.sq-refine-v3-sidebar>details')].map(d=>({label:d.querySelector(':scope>summary')?.textContent.trim(),count:d.querySelectorAll('input[type="checkbox"]').length})),
              visibleGrids:[...document.querySelectorAll('#MainContent .product-grid')].filter(g=>{const r=g.getBoundingClientRect(),s=getComputedStyle(g);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'}).length,
              cards:[...document.querySelectorAll('#MainContent .product-grid>.product-grid__item')].filter(x=>x.getBoundingClientRect().height>0).length,
              policy:document.querySelector('.sq-refine-v3-sidebar')?.dataset.sqRefineV3Policy||''
            }));
            const pass=data.themeId==='158561894555'&&JSON.stringify(data.groups)===JSON.stringify(expected)&&data.ready==='true'&&data.visibleGrids===1&&data.cards===50&&data.policy==='apparel'&&errors.length===0;
            console.log(JSON.stringify({device,pass,...data,errors}));
            await page.screenshot({path:`apparel-${device}.png`,fullPage:true});
            if(!pass) failed=true;
            await ctx.close();
          }
          await browser.close();
          if(failed) process.exit(1);
          JS
          node certify.mjs
