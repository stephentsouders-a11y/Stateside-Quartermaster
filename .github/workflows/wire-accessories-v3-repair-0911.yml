name: Wire Accessories V3 repair 0911
on:
  push:
    paths:
      - '.github/workflows/wire-accessories-v3-repair-0911.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-restart-v3
          fetch-depth: 0
      - name: Wire Accessories repair into active V3 path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('snippets/sq-storefront-content-guard.liquid')
          s=p.read_text()
          needle="    {% render 'sq-refine-v3-child-safety-fix' %}\n"
          add=needle+"    {% render 'sq-refine-v3-button01-accessories-fix' %}\n"
          if "{% render 'sq-refine-v3-button01-accessories-fix' %}" in s:
              print('Accessories repair already wired')
          else:
              if needle not in s:
                  raise SystemExit('Expected insertion point not found')
              p.write_text(s.replace(needle,add,1))
          PY
          git diff --check
          git diff -- snippets/sq-storefront-content-guard.liquid
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snippets/sq-storefront-content-guard.liquid
          git commit -m "Wire Accessories V3 hard repair into active storefront path"
          git push origin HEAD:refine-restart-v3
