name: Sep18 Vermont sidebar transient retry
on:
  push:
    paths:
      - '.github/workflows/sep18-vermont-sidebar-retry.yml'
      - '.github/scripts/sep18-vermont-sidebar-retry.mjs'
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/scripts/sep18-vermont-sidebar-retry.mjs
