name: Refine V3 visible persistence certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-visible-persistence-cert.yml'
      - 'snippets/sq-refine-v3-literature-author-visible-state.liquid'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify-visible-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Chromium certify visible Refine persistence
        run: |
          cat > visible-persistence.mjs <<'EOF'
          import { chromium } from 'playwright';
          const BASE='https://www.statesideqm.com',THEME='158561894555',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const themed=path=>{const u=new URL(path,BASE);u.searchParams.set('preview_theme_id',THEME);return u.toString()};
          async function ready(p){await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:50000});await p.waitForFunction(()=>{const v=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'};return [...document.querySelectorAll('#MainContent .sq-refine-v3-sidebar')].some(v)},null,{timeout:20000});await sleep(1500)}
          async function nav(p,path){let last;for(let i=0;i<5;i++){try{const r=await p.goto(themed(path),{waitUntil:'domcontentloaded',timeout:90000});if(r?.status()===200){await ready(p);return}last=new Error('HTTP '+r?.status())}catch(e){last=e}await sleep(3500*(i+1))}throw last||new Error('navigation failed')}
          async function state(p){return p.evaluate(()=>{const v=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'};const main=document.querySelector('#MainContent'),side=[...main.querySelectorAll('.sq-refine-v3-sidebar')].find(v),grid=[...main.querySelectorAll('.sq-refine-v3-results .product-grid')].find(v),products=grid?[...grid.querySelectorAll('a[href*="/products/"]')].filter(v).map(a=>new URL(a.href,location.origin).pathname).filter((x,i,a)=>a.indexOf(x)===i):[],legacy=[...main.querySelectorAll('[class*="button-tree"],[class*="root-categories"],[class*="third-level"],[class*="branch-grid"],[class*="type-grid"],[class*="program-tree"],[class*="category-grid"],[class*="navigation-grid"],.sqbfl')].filter(e=>!e.closest('.sq-refine-v3-sidebar,.sq-refine-v3-results')&&v(e)).length,authorInputs=side?[...side.querySelectorAll('details[data-sq-author-refine="true"] input[data-kind="author"][data-author]')]:[],nativeAuthorInputs=side?[...side.querySelectorAll('details[data-sq-author-tag-authority="true"] input[data-kind="native"][data-filter-name="filter.p.tag"]')]:[];return{url:location.href,side:!!side,title:(side?.querySelector('.sq-refine-v3-sidebar__title')?.textContent||'').trim(),products,legacy,ready:main?.dataset.sqRefineV3Ready==='true',error:main?.dataset.sqRefineV3Error||'',childIsolation:document.documentElement.dataset.sqRefineV3ChildIsolation||'',childRoot:document.documentElement.dataset.sqRefineV3ChildRoot||'',authorAuthority:main?.dataset.sqRefineV3AuthorAuthority||'',authorVisibleState:main?.dataset.sqRefineV3AuthorVisibleState||'',authorVisibleGroups:main?.dataset.sqRefineV3AuthorVisibleGroups||'',authors:authorInputs.map(i=>({name:i.dataset.author,checked:i.checked})),nativeAuthors:nativeAuthorInputs.map(i=>({value:i.dataset.filterValue,checked:i.checked}))}})}
          const changed=(a,b)=>a.length&&b.length&&(a.length!==b.length||a.some(x=>!b.includes(x))||b.some(x=>!a.includes(x)));
          function assert(label,s){if(!s.ready||s.error||!s.side||s.title!=='REFINE PRODUCTS'||s.legacy)throw new Error(label+' '+JSON.stringify(s))}
          const browser=await chromium.launch({headless:true});
          // Structural filter: visible checkbox -> child -> refresh -> Back.
          {
            const p=await browser.newPage({viewport:{width:1440,height:1000}});await nav(p,'/collections/accessories-gifts-collectibles');const before=await state(p);assert('STRUCTURAL root',before);
            const click=await p.evaluate(()=>{const v=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};const side=[...document.querySelectorAll('#MainContent .sq-refine-v3-sidebar')].find(v),i=side?.querySelector('input[data-kind="structural"][data-target^="/collections/"]');if(!i)return null;const t=i.dataset.target;i.click();return t});if(!click)throw new Error('STRUCTURAL visible checkbox missing');if(new URL(click,BASE).searchParams.get('sq_root')!=='accessories-gifts-collectibles')throw new Error('STRUCTURAL sq_root missing '+click);await p.waitForFunction(()=>new URL(location.href).pathname!='/collections/accessories-gifts-collectibles',null,{timeout:30000});await ready(p);const child=await state(p);assert('STRUCTURAL child',child);if(child.childIsolation!=='true'||child.childRoot!=='accessories-gifts-collectibles'||!changed(before.products,child.products))throw new Error('STRUCTURAL persistence/filter failure '+JSON.stringify({before:before.products.slice(0,8),child}));await p.reload({waitUntil:'domcontentloaded',timeout:90000});await ready(p);const refreshed=await state(p);assert('STRUCTURAL refresh',refreshed);if(refreshed.childIsolation!=='true'||new URL(refreshed.url).searchParams.get('sq_root')!=='accessories-gifts-collectibles')throw new Error('STRUCTURAL refresh root lost '+JSON.stringify(refreshed));await p.goBack({waitUntil:'domcontentloaded',timeout:90000});await ready(p);const back=await state(p);assert('STRUCTURAL back',back);if(new URL(back.url).pathname!=='/collections/accessories-gifts-collectibles')throw new Error('STRUCTURAL Back wrong '+back.url);console.log('STRUCTURAL VISIBLE PASS',JSON.stringify({target:click,before:before.products.length,child:child.products.length}));await p.close();
          }
          // Books author: only customer-visible sidebar state counts.
          {
            const p=await browser.newPage({viewport:{width:1440,height:1000}});await nav(p,'/collections/literature');await sleep(1800);const root=await state(p);assert('BOOKS root',root);
            const chosen=await p.evaluate(()=>{const v=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};const side=[...document.querySelectorAll('#MainContent .sq-refine-v3-sidebar')].find(v);let inputs=[...side.querySelectorAll('details[data-sq-author-refine="true"] input[data-kind="author"][data-author]')];if(inputs.length>=2){const first=inputs[0].dataset.author,second=inputs[1].dataset.author;inputs[0].click();return{mode:'search-fallback',param:'sq_author',first,second}}inputs=[...side.querySelectorAll('details[data-sq-author-tag-authority="true"] input[data-kind="native"][data-filter-name="filter.p.tag"]')];if(inputs.length>=2){const first=inputs[0].dataset.filterValue,second=inputs[1].dataset.filterValue;inputs[0].click();return{mode:'native-tag',param:'filter.p.tag',first,second}}return null});if(!chosen)throw new Error('BOOKS visible author controls missing '+JSON.stringify(root));await p.waitForFunction(({param,first})=>new URL(location.href).searchParams.getAll(param).includes(first),chosen,{timeout:30000});await ready(p);await sleep(2200);const one=await state(p);assert('BOOKS author selected',one);if(!changed(root.products,one.products))throw new Error('BOOKS author did not change products '+JSON.stringify({chosen,root:root.products.slice(0,8),one:one.products.slice(0,8)}));
            await p.reload({waitUntil:'domcontentloaded',timeout:90000});await ready(p);await sleep(2600);let re=await state(p);assert('BOOKS author refresh',re);const active=new URL(re.url).searchParams.getAll(chosen.param);if(!active.includes(chosen.first))throw new Error('BOOKS refresh URL lost author '+JSON.stringify(re));if(chosen.mode==='search-fallback'){const checked=re.authors.filter(a=>a.checked);if(checked.length!==1||checked[0].name!==chosen.first||re.authorVisibleState!=='checked')throw new Error('BOOKS visible checked state lost '+JSON.stringify({chosen,re}))}else{const checked=re.nativeAuthors.filter(a=>a.checked);if(checked.length!==1||checked[0].value!==chosen.first)throw new Error('BOOKS native checked state lost '+JSON.stringify({chosen,re}))}
            await p.evaluate(mode=>{const v=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};const side=[...document.querySelectorAll('#MainContent .sq-refine-v3-sidebar')].find(v),sel=mode==='search-fallback'?'details[data-sq-author-refine="true"] input:checked':'details[data-sq-author-tag-authority="true"] input:checked';side.querySelector(sel)?.click()},chosen.mode);await p.waitForFunction(param=>!new URL(location.href).searchParams.getAll(param).length,chosen.param,{timeout:30000});await ready(p);const cleared=await state(p);assert('BOOKS author cleared',cleared);
            await p.evaluate(({mode,second})=>{const v=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};const side=[...document.querySelectorAll('#MainContent .sq-refine-v3-sidebar')].find(v),inputs=[...side.querySelectorAll(mode==='search-fallback'?'details[data-sq-author-refine="true"] input[data-kind="author"]':'details[data-sq-author-tag-authority="true"] input[data-kind="native"]')],i=inputs.find(x=>(mode==='search-fallback'?x.dataset.author:x.dataset.filterValue)===second);i?.click()},chosen);await p.waitForFunction(({param,second})=>new URL(location.href).searchParams.getAll(param).includes(second),chosen,{timeout:30000});await ready(p);await sleep(2200);const two=await state(p);assert('BOOKS second author',two);if(!changed(root.products,two.products))throw new Error('BOOKS second author did not change products '+JSON.stringify({chosen,two}));console.log('BOOKS VISIBLE AUTHOR PASS',JSON.stringify({chosen,one:one.products.length,two:two.products.length,visibleState:re.authorVisibleState}));await p.close();
          }
          await browser.close();console.log('VISIBLE PERSISTENCE CERT PASS');
          EOF
          node visible-persistence.mjs