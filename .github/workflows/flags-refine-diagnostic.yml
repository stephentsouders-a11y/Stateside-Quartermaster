name: Flags Refine exhaustive Chromium audit
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/flags-refine-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Test every Refine Products choice one by one
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
        run: |
          mkdir -p out
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const base = process.env.BASE;
          const theme = process.env.THEME;
          const path = '/collections/flags-patriotic-decor';
          const startUrl = `${base}${path}?preview_theme_id=${theme}`;
          const browser = await chromium.launch({headless:true});
          const ctx = await browser.newContext({viewport:{width:1440,height:1100}});
          const page = await ctx.newPage();
          page.setDefaultTimeout(30000);
          page.setDefaultNavigationTimeout(90000);
          const jsErrors=[];
          page.on('pageerror', e=>jsErrors.push(String(e)));

          async function ready(){
            await page.locator('#MainContent .sq-refine-v3-sidebar').waitFor({state:'visible',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:60000}).catch(()=>{});
            await page.waitForTimeout(1200);
            const id=await page.evaluate(()=>window.Shopify?.theme?.id||window.Shopify?.theme?.theme_store_id||null);
            if(String(id)!==String(theme)) throw new Error(`Wrong theme ${id}`);
          }
          async function openFresh(){
            const r=await page.goto(startUrl,{waitUntil:'domcontentloaded'});
            if(!r||!r.ok()) throw new Error(`HTTP ${r&&r.status()}`);
            await ready();
          }
          function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}
          function norm(s){return clean(s).toLowerCase().replace(/[’']/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim()}
          async function gridHandles(){
            return await page.evaluate(()=>{
              const sels=['.sq-refine-taxonomy-product[href*="/products/"]','.sq-custom-color-product[href*="/products/"]','#MainContent .product-grid__item a[href*="/products/"]','#MainContent product-card a[href*="/products/"]'];
              const a=[];for(const s of sels)document.querySelectorAll(s).forEach(x=>a.push(x));
              return [...new Set(a.filter(x=>{const r=x.getBoundingClientRect(),cs=getComputedStyle(x);return r.width>2&&r.height>2&&cs.display!=='none'&&cs.visibility!=='hidden'}).map(x=>{const m=(x.getAttribute('href')||'').match(/\/products\/([^?#/]+)/);return m?decodeURIComponent(m[1]):''}).filter(Boolean))];
            });
          }
          async function loadCollection(handle){
            return await page.evaluate(async h=>{
              const out=[],seen=new Set();
              for(let pg=1;pg<=40;pg++){
                const r=await fetch(`/collections/${encodeURIComponent(h)}/products.json?limit=250&page=${pg}`,{credentials:'same-origin'});
                if(!r.ok) break;
                const j=await r.json(); const a=Array.isArray(j.products)?j.products:[];
                for(const p of a){if(p?.handle&&!seen.has(p.handle)){seen.add(p.handle);out.push({handle:p.handle,title:p.title||'',vendor:p.vendor||'',type:p.product_type||'',tags:Array.isArray(p.tags)?p.tags:[]})}}
                if(a.length<250) break;
              }
              return out;
            },handle);
          }
          function suspicious(label,p){
            const l=norm(label),t=norm(`${p.title} ${p.type} ${(p.tags||[]).join(' ')}`);
            if(!l||!t)return false;
            const tests=[
              [/flag pole|flagpole/,/flagpole|flag pole|pole|halyard/],
              [/flag case|display case/,/flag case|display case|shadow box|display/],
              [/memorial|memorials/,/memorial|burial|funeral|veteran|grave|cemetery|flag case/],
              [/american flag|u s flag|us flag/,/american flag|u s flag|usa flag|united states flag|stars and stripes/],
              [/military flag|service flag/,/army|navy|marine|air force|coast guard|space force|military|service flag|veteran/],
              [/state flag|states/,/state flag|alabama|alaska|arizona|arkansas|california|colorado|connecticut|delaware|florida|georgia|hawaii|idaho|illinois|indiana|iowa|kansas|kentucky|louisiana|maine|maryland|massachusetts|michigan|minnesota|mississippi|missouri|montana|nebraska|nevada|hampshire|jersey|mexico|york|carolina|dakota|ohio|oklahoma|oregon|pennsylvania|island|tennessee|texas|utah|vermont|virginia|washington|wisconsin|wyoming/]
            ];
            for(const [lk,pk] of tests) if(lk.test(l)&&!pk.test(t)) return true;
            return false;
          }

          await openFresh();
          const baseline=await gridHandles();
          const groups=await page.evaluate(()=>[...document.querySelectorAll('#MainContent .sq-refine-v3-sidebar details')].map((d,gi)=>({
            index:gi,
            title:(d.querySelector(':scope > summary')?.textContent||'').replace(/\s+/g,' ').trim(),
            choices:[...d.querySelectorAll('input[type="checkbox"]')].map((i,ii)=>({index:ii,value:i.value,label:(i.closest('label')?.textContent||i.value).replace(/\s+/g,' ').replace(/\d+\s*items?/i,'').trim(),group:i.dataset.group||'',name:i.name||'',outer:i.outerHTML.slice(0,700)}))
          })).filter(g=>g.choices.length));
          console.log('FLAGS_GROUPS',JSON.stringify(groups));
          const results=[];

          for(const g of groups){
            for(const c of g.choices){
              await openFresh();
              const det=page.locator('#MainContent .sq-refine-v3-sidebar details').filter({has:page.locator(':scope > summary',{hasText:g.title})}).first();
              if(await det.count()!==1){results.push({...c,groupTitle:g.title,pass:false,error:'group missing'});continue}
              if(!(await det.getAttribute('open'))) await det.locator(':scope > summary').click();
              let box=det.locator('input[type="checkbox"]').filter({has:page.locator('xpath=..')}).nth(c.index);
              if(await box.count()!==1) box=det.locator(`input[type="checkbox"][value="${c.value.replace(/"/g,'\\"')}"]`).first();
              const beforeUrl=page.url();
              try{
                await box.scrollIntoViewIfNeeded();
                await box.check();
                await page.waitForTimeout(2000);
                await ready();
                const checked=await page.locator('#MainContent .sq-refine-v3-sidebar input[type="checkbox"]:checked').count();
                const handles=await gridHandles();
                const url=page.url();
                const changed=url!==beforeUrl || JSON.stringify(handles)!==JSON.stringify(baseline);
                let expectedCount=null,wrongVisible=[],semanticSuspicious=[];
                const value=clean(c.value);
                if(value && /^[a-z0-9][a-z0-9-]+$/.test(value)){
                  const expected=await loadCollection(value);
                  expectedCount=expected.length;
                  const expectedSet=new Set(expected.map(x=>x.handle));
                  wrongVisible=handles.filter(h=>!expectedSet.has(h));
                  semanticSuspicious=expected.filter(p=>suspicious(c.label,p)).slice(0,100).map(p=>({handle:p.handle,title:p.title,type:p.type,vendor:p.vendor}));
                }
                const pass=checked>0 && changed && handles.length>0 && wrongVisible.length===0;
                const row={group:g.title,label:c.label,value:c.value,checked,visibleCount:handles.length,expectedCount,url,changed,wrongVisible,semanticSuspicious,pass};
                results.push(row);
                console.log('CHOICE',JSON.stringify(row));
              }catch(e){
                results.push({group:g.title,label:c.label,value:c.value,pass:false,error:String(e),url:page.url()});
                console.log('CHOICE_ERROR',g.title,c.label,String(e));
              }
            }
          }
          const failures=results.filter(x=>!x.pass);
          const semantic=results.filter(x=>x.semanticSuspicious?.length);
          const report={collection:path,theme,groupCount:groups.length,choiceCount:results.length,baselineVisible:baseline.length,groups,results,failures,semantic,jsErrors};
          await fs.writeFile('out/report.json',JSON.stringify(report,null,2));
          await page.goto(startUrl,{waitUntil:'domcontentloaded'});await ready();await page.screenshot({path:'out/flags-refine-final.png',fullPage:true});
          console.log('FLAGS_EXHAUSTIVE_SUMMARY',JSON.stringify({groupCount:groups.length,choiceCount:results.length,failures:failures.length,semanticGroups:semantic.length,jsErrors:jsErrors.length}));
          await browser.close();
          if(failures.length) process.exitCode=1;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flags-refine-exhaustive-evidence
          path: out
          retention-days: 14
