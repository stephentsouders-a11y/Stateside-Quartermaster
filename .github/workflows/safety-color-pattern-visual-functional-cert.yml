name: Safety Color Pattern Chromium Visual Functional Cert
on:
  push:
    branches:
      - refine-restart-v3
    paths:
      - '.github/workflows/safety-color-pattern-visual-functional-cert.yml'
      - '.github/scripts/safety-browser-cert-full.mjs'
      - 'snippets/sq-refine-v3.liquid'
      - 'snippets/sq-uniform-color-pattern-core.liquid'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run exhaustive Safety browser certification
        run: node .github/scripts/safety-browser-cert-full.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-color-pattern-visual-functional-cert
          path: out/safety-browser-cert
          retention-days: 14
