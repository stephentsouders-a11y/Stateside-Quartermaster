name: Case 0109 LOC fetch

on:
  push:
    branches:
      - tmp-case0109-loc-fetch-20260919
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and validate LOC PDFs
        shell: bash
        run: |
          set -euo pipefail
          out="CASE_0109_LOC_45_PDFS"
          mkdir -p "$out"

          cat > /tmp/loc.tsv <<'EOF'
159652	497/159652.pdf	FAMILY CONFERENCE REPORT REFNO 0109
159301	495/159301.pdf	FAMILY CONFERENCE REPORT REFNO 0109
54044	177/54044.pdf	FIELD INVESTIGATION REPORT CASE 0109
59313	200/59313.pdf	FIELD INVESTIGATION REPORT CASE 0109
145840	445/145840.pdf	CASE SUMMARY INFORMATION FOR REFERENCE NUMBER 0109
98125	338/98125.pdf	RESPONSE TO CE 86-0109
54045	177/54045.pdf	IIR 6024039293 FIELD INVESTIGATION REPORT OF PRIORITY CASE REFNO 0109
145841	445/145841.pdf	CASE SUMMARY INFORMATION FOR REFERENCE NUMBER 0109
114107	365/114107.pdf	BIOGRAPHIC SITE REPORT UPDATE FOR REFNO 0109
112267	359/112267.pdf	PRIORITY CASE INVESTIGATION TEAM REPORT CASE 0109
25731	77/25731.pdf	RESPONSE TO CE 86-0109 EVALUATION WORK SHEET
129313	381/129313.pdf	ANALYST TO ANALYST EXCHANGE OF INFORMATION FOR REFNO 0109
S130_268	S130/268.pdf	DETAILED REPORT OF INVESTIGATION OF CASE 0109 88TH JFA
S140_3_90	S140_3/90.pdf	EXCAVATION SUMMARY REPORT CASE 0109 SITE VM-00144
59301	200/59301.pdf	NOK NOTIFICATION OF CHANGE IN STATUS
54027	177/54027.pdf	STATUS REVIEW
54025	177/54025.pdf	REQUEST FROM ICRC FOR INCIDENT LOCATION
54029	177/54029.pdf	STATUS CHANGE
54030	177/54030.pdf	ARMY MASTER LIST
59302	200/59302.pdf	NOK NOTIFICATION
54021	177/54021.pdf	TELEGRAMS TO WIFE AND MOTHER
54023	177/54023.pdf	LETTER TO THE AMERICAN RED CROSS
54024	177/54024.pdf	LETTERS TO WIFE AND MOTHER
54026	177/54026.pdf	LETTERS AND TELEGRAM TO MOTHER AND WIFE
54028	177/54028.pdf	FINDING OF DEATH
59303	200/59303.pdf	REPORT OF PROCEEDINGS BY INVESTIGATING BOARD OF OFFICERS
54031	177/54031.pdf	BIOGRAPHIC SITE REPORT
54043	177/54043.pdf	NARRATIVE
59311	200/59311.pdf	BIOGRAPHIC SITE REPORT
54022	177/54022.pdf	REPORT OF PROCEEDINGS BY INVESTIGATING BOARD OF OFFICERS
59312	200/59312.pdf	NARRATIVE PASSED TO VIETNAMESE GOVERNMENT DURING 10-11 DEC 92 TECHNICAL MEETING
59309	200/59309.pdf	OBSERVATION OF THREE DEAD AMERICANS AND WRECKAGE OF ONE HELICOPTER IN BINH DINH EVALUATION
59310	200/59310.pdf	FORMER RVNAF HELICOPTER PILOT DESCRIBES LAMSON 719 AIRCRAFT CRASH SITE IN LAOS
S148-024	S148/S148-024.pdf	FIELD ACTIVITY SUMMARY ARCHAEOLOGICAL SURVEYS JFA 18-3VN
S148-025	S148/S148-025.pdf	FIELD ACTIVITY SUMMARY ARCHAEOLOGICAL SURVEYS JFA 18-3VN
7671	20/7671.pdf	REFUGEE REPORTS MIA SIGHTINGS
PDS63_47	PDS63/47.pdf	REFUGEE REPORTS MIA SIGHTINGS
97134	340/97134.pdf	FORMER RVNAF HELICOPTER PILOT DESCRIBES LAMSON 719 AIRCRAFT CRASH SITE IN LAOS
7673	20/7673.pdf	REFUGEE REPORTS MIA SIGHTINGS
161427	507/161427.pdf	JUNE PRIORITY DISCREPANCY CASE REVIEW
161315	507/161315.pdf	FAMILY NOTIFICATION OF RESULTS OF PRIORITY DISCREPANCY CASE REVIEW OF JUNE 9 1994
S164-005	S164/S164-005.pdf	LOCATION VISIT REPORT 2025-2VN
161847	508/161847.pdf	IIR 6024013502 SOURCE OF INFORMATION ON DEATH OF AN AMERICAN SERVICEMAN DAK DOA
37793	132/37793.pdf	OBSERVATION OF THREE DEAD AMERICANS AND WRECKAGE OF ONE HELICOPTER REFUGEE REPORT EVALUATION
130081	377/130081.pdf	DISCREPANCY CASE SUMMARIES COMPARISON OF VIETNAMESE AND UNITED STATES ASSESSMENT OF THE 135 CASES
EOF

          printf 'record_id,title,source_url,size_bytes,sha256\n' > "$out/00_MANIFEST.csv"
          count=0
          while IFS=$'\t' read -r id path title; do
            url="https://tile.loc.gov/storage-services/service/frd/pwmia/$path"
            safe_title="$(printf '%s' "$title" | tr -cs 'A-Za-z0-9._-' '_' | sed 's/^_*//;s/_*$//')"
            file="$out/$id-$safe_title.pdf"
            echo "Downloading $id"
            curl -fL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180               -A 'Mozilla/5.0 Case0109Research/1.0' "$url" -o "$file"
            test -s "$file"
            magic="$(head -c 5 "$file")"
            if [ "$magic" != "%PDF-" ]; then
              echo "ERROR: $id is not a PDF; magic=$magic" >&2
              exit 1
            fi
            size="$(stat -c %s "$file")"
            sha="$(sha256sum "$file" | awk '{print $1}')"
            esc_title="$(printf '%s' "$title" | sed 's/"/""/g')"
            printf '"%s","%s","%s","%s","%s"\n' "$id" "$esc_title" "$url" "$size" "$sha" >> "$out/00_MANIFEST.csv"
            count=$((count+1))
          done < /tmp/loc.tsv

          if [ "$count" -ne 45 ]; then
            echo "ERROR: expected 45 PDFs, got $count" >&2
            exit 1
          fi
          actual="$(find "$out" -maxdepth 1 -type f -name '*.pdf' | wc -l)"
          if [ "$actual" -ne 45 ]; then
            echo "ERROR: expected 45 PDF files, got $actual" >&2
            exit 1
          fi
          echo "Validated 45/45 PDFs."
          find "$out" -maxdepth 1 -type f -name '*.pdf' -printf '%f\n' | sort > "$out/00_FILE_LIST.txt"

      - name: Upload complete PDF corpus
        uses: actions/upload-artifact@v4
        with:
          name: CASE_0109_LOC_45_PDFS_COMPLETE_2026-09-19
          path: CASE_0109_LOC_45_PDFS/
          if-no-files-found: error
          retention-days: 7
