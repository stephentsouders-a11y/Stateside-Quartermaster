name: Accessories final Chromium video certification 3
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Record and certify desktop/mobile
        run: |
          cat > cert.mjs <<'EOF'
          import {chromium} from 'playwright';import fs from 'fs';fs.mkdirSync('out',{recursive:true});
          const U='https://www.statesideqm.com/collections/accessories-gifts-collectibles?preview_theme_id=158561894555';
          const expectedCats=['Challenge Coins & Displays','Collectibles & Cards','Drinkware','Keychains & Lanyards','Memorial & Personalized Gifts','Military Surplus & Collectibles','Pins, Buttons & Small Insignia','Sword & Knife Display Cases','Wallets & Pocket Gifts'];
          const expectedGroups=['Shop by Category','Shop by Type','Shop by Manufacturers','Availability'];
          const report={url:U,failures:[],devices:[]};
          const visibleFn=`e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>2&&r.height>2}`;
          for(const [name,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
            const b=await chromium.launch({headless:true});const c=await b.newContext({viewport,recordVideo:{dir:'out',size:{width:name==='desktop'?1280:390,height:720}}});const p=await c.newPage();p.setDefaultNavigationTimeout(90000);
            const pageErrors=[],consoleErrors=[];p.on('pageerror',e=>pageErrors.push(String(e)));p.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await p.addInitScript(()=>{window.__sqPaint=[];const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>2&&r.height>2};const clean=s=>String(s||'').replace(/\s+/g,' ').trim();const tick=()=>{const m=document.querySelector('#MainContent');if(m){const summaries=[...m.querySelectorAll('.sq-refine-v3-sidebar > details.sq-refine-v3-group > summary')].filter(vis).map(x=>clean(x.textContent));window.__sqPaint.push({t:Math.round(performance.now()),ready:m.dataset.sqRefineV3Ready||null,maker:[...m.querySelectorAll('.sq-maker-browser')].some(vis),oldCards:[...m.querySelectorAll('.sq-subcategory-section,.sq-subcategory-card,[class*="button-tree"],[class*="category-grid"]')].some(vis),native:[...m.querySelectorAll('.facets-block-wrapper--horizontal .facets__filters-wrapper,.facets-toggle__wrapper,theme-drawer#filters-drawer')].some(vis),stateGuard:/State Guard Uniform Builder|Build Your Uniform|PT Uniform/i.test(m.innerText||''),branch:summaries.includes('Shop by Branch'),groups:summaries});}if(performance.now()<7000)requestAnimationFrame(tick)};requestAnimationFrame(tick)});
            const r=await p.goto(U,{waitUntil:'domcontentloaded'}).catch(()=>null);
            const marks=[0,100,250,500,1000,2000,3000,4500,6000];let last=0;for(const ms of marks){if(ms>last)await p.waitForTimeout(ms-last);last=ms;await p.screenshot({path:`out/${name}-${ms}ms.png`}).catch(()=>{})}
            await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:30000}).catch(()=>{});await p.waitForTimeout(500);
            const state=await p.evaluate(({expectedCats,expectedGroups})=>{const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>2&&r.height>2};const clean=s=>String(s||'').replace(/\s+/g,' ').trim();const m=document.querySelector('#MainContent'),side=m?.querySelector('.sq-refine-v3-sidebar');const groups=side?[...side.querySelectorAll(':scope > details.sq-refine-v3-group')].filter(vis).map(d=>({title:clean(d.querySelector(':scope > summary')?.textContent),inputs:d.querySelectorAll('input[type="checkbox"]').length,values:[...d.querySelectorAll('.sq-refine-v3-choice span')].map(x=>clean(x.textContent))})):[];const cat=groups.find(g=>g.title==='Shop by Category');const cards=[...m.querySelectorAll('.sq-refine-v3-results .product-grid > *')].filter(vis);const xs=[...new Set(cards.slice(0,8).map(x=>Math.round(x.getBoundingClientRect().left)))];const invalid=side?[...side.querySelectorAll('input[type="checkbox"]')].filter(i=>!i.dataset.target&&!i.dataset.filterName&&!i.dataset.sqPolishParam).length:999;return{ready:m?.dataset.sqRefineV3Ready||null,groups,groupTitles:groups.map(g=>g.title),groupExact:JSON.stringify(groups.map(g=>g.title))===JSON.stringify(expectedGroups),categoryExact:JSON.stringify(cat?.values||[])===JSON.stringify(expectedCats),cards:cards.length,columns:xs.length,pageSize:clean(m.querySelector('.sq-refine-v3-page-size')?.innerText),maker:[...m.querySelectorAll('.sq-maker-browser')].some(vis),native:[...m.querySelectorAll('.facets-block-wrapper--horizontal .facets__filters-wrapper,.facets-toggle__wrapper,theme-drawer#filters-drawer')].some(vis),branch:groups.some(g=>g.title==='Shop by Branch'),stateGuard:/State Guard Uniform Builder|Build Your Uniform|PT Uniform/i.test(m.innerText||''),duplicate:[...m.querySelectorAll('.product-grid')].filter(g=>vis(g)&&!m.querySelector('.sq-refine-v3-results')?.contains(g)&&g.querySelector('a[href*="/products/"]')).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+3,broken:[...m.querySelectorAll('img')].filter(i=>i.complete&&i.naturalWidth===0).length,invalidInputs:invalid,paint:window.__sqPaint||[]};},{expectedCats,expectedGroups});
            const toggles=[];const sums=p.locator('#MainContent .sq-refine-v3-sidebar > details.sq-refine-v3-group > summary');for(let i=0,n=await sums.count();i<n;i++){const s=sums.nth(i),title=(await s.innerText()).trim(),a=await s.evaluate(e=>e.parentElement.open);await s.click();const x=await s.evaluate(e=>e.parentElement.open);await s.click();const y=await s.evaluate(e=>e.parentElement.open);toggles.push({title,ok:x!==a&&y===a})}
            const bad=state.paint.filter(x=>x.maker||x.oldCards||x.native||x.stateGuard||x.branch);const dev={name,status:r?.status()||null,state:{...state,paint:undefined},badPaintCount:bad.length,badPaint:bad.slice(0,10),toggles,pageErrors,consoleErrors};report.devices.push(dev);
            if(dev.status!==200)report.failures.push(`${name}: HTTP ${dev.status}`);if(state.ready!=='true')report.failures.push(`${name}: V3 not ready`);if(!state.groupExact)report.failures.push(`${name}: groups ${JSON.stringify(state.groupTitles)}`);if(!state.categoryExact)report.failures.push(`${name}: category taxonomy mismatch`);if(state.cards!==50)report.failures.push(`${name}: expected 50 cards got ${state.cards}`);if(name==='desktop'&&state.columns!==3)report.failures.push(`${name}: expected 3 columns got ${state.columns}`);if(name==='mobile'&&state.columns!==2)report.failures.push(`${name}: expected 2 columns got ${state.columns}`);if(!/50/.test(state.pageSize)||!/100/.test(state.pageSize)||!/250/.test(state.pageSize))report.failures.push(`${name}: page-size labels ${state.pageSize}`);if(state.maker||state.native||state.branch||state.stateGuard||state.duplicate||state.overflow||state.broken||state.invalidInputs)report.failures.push(`${name}: steady-state contamination/geometry failure`);if(bad.length)report.failures.push(`${name}: ${bad.length} bad first-paint frames`);if(toggles.some(x=>!x.ok))report.failures.push(`${name}: accordion toggle failure`);if(state.groups.some(g=>g.inputs<1))report.failures.push(`${name}: empty Refine group`);
            await p.screenshot({path:`out/${name}-final.png`,fullPage:true});const v=p.video();await p.close();await c.close();if(v){const src=await v.path();fs.copyFileSync(src,`out/${name}.webm`)}await b.close();
          }
          fs.writeFileSync('out/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));if(report.failures.length)process.exitCode=2;
          EOF
          node cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessories-final-video-cert-3
          path: out
          retention-days: 14