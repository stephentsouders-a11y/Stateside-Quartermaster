name: Sep12 every Refine control certification
on:
  push:
    paths:
      - '.github/workflows/sep12-every-refine-control-cert.yml'
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click every Refine checkbox
        env: {SHARD: '${{ matrix.shard }}'}
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';import fs from 'fs';
          const base='https://www.statesideqm.com',theme='158561894555',shard=+process.env.SHARD,shards=8,out='out';fs.mkdirSync(`${out}/videos`,{recursive:true});fs.mkdirSync(`${out}/screens`,{recursive:true});
          const routes=[
            ['accessories','/collections/accessories-gifts-collectibles'],['airsoft','/collections/airsoft-milsim'],['apparel','/collections/apparel'],['afg','/collections/armed-forces-gear'],['art','/collections/art'],['armor','/collections/body-armor-ballistic-protection'],['literature','/collections/literature'],['child','/collections/child-safety-shop'],['dive','/collections/dive-scuba'],['firearm','/collections/firearm-accessories'],['medical','/collections/first-aid-medical-ifak'],['flags','/collections/flags-patriotic-decor'],['lighting','/collections/flashlights-lighting'],['footwear','/collections/footwear-gloves-eyewear'],['k9','/collections/k9-dog-gear'],['knives','/collections/knives-axes-cutlery'],['morale','/collections/morale-patches-tactical-id'],['outdoor','/collections/outdoor-preparedness-gear'],['patriotic','/collections/patriotic-american-heritage'],['rescue','/collections/safety-rescue-climbing'],['sta-brite','/collections/sta-brite-insignia'],['tactical','/collections/tactical-gear'],['thin-line','/collections/thin-line'],['uniforms','/collections/uniforms'],['watches','/collections/watches'],['lighters','/collections/zippos-lighters-torches'],['logo','/collections/stateside-quartermaster-logo-merch'],['arng','/collections/army-national-guard-series'],['ang','/collections/air-national-guard-series'],['army','/collections/products-built-for-the-line-u-s-army'],['navy','/collections/products-built-for-the-line-u-s-navy'],['air-force','/collections/products-built-for-the-line-u-s-air-force'],['marines','/collections/products-built-for-the-line-u-s-marine-corps'],['coast-guard','/collections/products-built-for-the-line-u-s-coast-guard'],['space-force','/collections/products-built-for-the-line-u-s-space-force'],['rotc','/collections/rotc-series'],['jrotc','/collections/jrotc-series'],['msa','/collections/military-schools-academies'],['law','/collections/law-enforcement-corrections'],['fire-ems','/collections/firefighting-ems-search-rescue'],['state-ohio','/collections/state-guard-series-ohio'],['state-texas','/collections/state-guard-series-texas'],['state-ca','/collections/state-guard-series-california'],['state-ny','/collections/state-guard-series-new-york']
          ];
          const mine=routes.filter((_,i)=>i%shards===shard),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const sel='.sq-global-refine-sidebar input[type=checkbox],.sq-refine-taxonomy input[type=checkbox],.sq-refine-v3-sidebar input[type=checkbox]';
          function semantic(label,titles){const l=String(label||'').toLowerCase(),bad=[];for(const title of titles){const t=title.toLowerCase(),add=why=>bad.push({title,why});if(/chest rigs?/.test(l)&&/\bbelt\b|buckle|waist belt|duty belt|web belt/.test(t))add('belt-like product under Chest Rigs');if(/\bbelts?\b/.test(l)&&/chest rig|plate carrier|body armor|helmet/.test(t))add('carrier/armor product under Belts');if(/helmets?/.test(l)&&/\bboot|glove|belt|shirt|pants?|trouser|backpack|chest rig/.test(t))add('non-helmet product');if(/flashlight|lighting/.test(l)&&/shirt|pants?|trouser|boot|belt|patch|insignia|book/.test(t))add('non-lighting product');if(/first aid|medical|ifak/.test(l)&&/shirt|pants?|trouser|boot|belt buckle|book|flag/.test(t))add('obvious non-medical product');if(/footwear|boots?/.test(l)&&/shirt|pants?|trouser|belt|patch|insignia|chest rig|plate carrier/.test(t))add('non-footwear product');if(/gloves?/.test(l)&&/shirt|pants?|trouser|boot|belt|patch|insignia|chest rig/.test(t))add('non-glove product');if(/eyewear|goggles|glasses/.test(l)&&/shirt|pants?|trouser|boot|belt|patch|insignia|chest rig/.test(t))add('non-eyewear product');if(/knives|knife|axes|multi-tools?/.test(l)&&/shirt|pants?|trouser|boot|belt|patch|insignia|chest rig|plate carrier/.test(t))add('obvious non-tool product')}return bad.slice(0,50)}
          function metaFn(el){const row=el.closest('.sq-global-refine-sidebar__choice,.sq-refine-v3-choice,.sq-refine-taxonomy__choice,label,li,a')||el.parentElement;return{aria:el.getAttribute('aria-label')||'',value:el.value||'',name:el.name||'',kind:el.dataset.kind||'',target:el.dataset.target||'',filterName:el.dataset.filterName||el.dataset.sqPolishParam||'',filterValue:el.dataset.filterValue||el.dataset.sqPolishValue||'',label:(row?.innerText||'').replace(/\s+/g,' ').trim().slice(0,300)}}
          function same(a,b){return a.aria===b.aria&&a.value===b.value&&a.name===b.name&&a.kind===b.kind&&a.target===b.target&&a.filterName===b.filterName&&a.filterValue===b.filterValue&&a.label===b.label}
          const browser=await chromium.launch({headless:true}),rows=[];
          for(const [slug,path] of mine){const ctx=await browser.newContext({viewport:{width:1440,height:1000},recordVideo:{dir:`${out}/videos`,size:{width:960,height:600}}});const page=await ctx.newPage();page.setDefaultNavigationTimeout(60000);page.setDefaultTimeout(12000);const baseUrl=new URL(path,base);baseUrl.searchParams.set('preview_theme_id',theme);const rec={slug,path,status:null,sidebarCount:null,inventory:[],controls:[],pageErrors:[],challenge:false};page.on('pageerror',e=>rec.pageErrors.push(e.message));async function load(){const r=await page.goto(baseUrl.toString(),{waitUntil:'domcontentloaded'});await sleep(900);await page.locator('#MainContent details').evaluateAll(ds=>ds.forEach(d=>d.open=true)).catch(()=>{});await sleep(250);return r}
            try{let r=await load();rec.status=r?.status()??null;rec.challenge=await page.evaluate(()=>/verify you are human|connection needs to be verified|just a moment/i.test((document.title||'')+' '+(document.body?.innerText||''))).catch(()=>false);rec.sidebarCount=await page.locator('#MainContent .sq-global-refine-sidebar:visible,#MainContent .sq-refine-v3-sidebar:visible,#MainContent .sq-refine-taxonomy:visible').count();if(rec.status===200&&!rec.challenge){rec.inventory=await page.locator(sel).evaluateAll(xs=>xs.filter(x=>{const r=x.getBoundingClientRect(),s=getComputedStyle(x);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'}).map(metaFn));for(let ci=0;ci<rec.inventory.length;ci++){const want=rec.inventory[ci],c={index:ci,meta:want,boxActivated:false,textInert:null,outcome:'PASS',destination:'',productTitles:[],semanticCandidates:[],error:null};try{if(ci>0)await load();let candidates=page.locator(sel),count=await candidates.count(),idx=-1;for(let j=0;j<count;j++){const el=candidates.nth(j);if(!await el.isVisible().catch(()=>false))continue;const m=await el.evaluate(metaFn);if(same(m,want)){idx=j;break}}if(idx<0){c.outcome='FAIL_CONTROL_DISAPPEARED';throw new Error('control not found after reload')}let input=candidates.nth(idx);const row=input.locator('xpath=ancestor::*[contains(@class,"sq-global-refine-sidebar__choice") or contains(@class,"sq-refine-v3-choice") or contains(@class,"sq-refine-taxonomy__choice") or self::label or self::li or self::a][1]');if(await row.count()){const text=row.locator('span,small,strong').first();if(await text.count()&&await text.isVisible().catch(()=>false)){const u0=page.url(),v0=await input.isChecked().catch(()=>false),bb=await text.boundingBox();if(bb){await page.mouse.click(bb.x+Math.min(8,Math.max(2,bb.width/3)),bb.y+Math.min(8,Math.max(2,bb.height/2)));await sleep(250);c.textInert=(page.url()===u0&&(await input.isChecked().catch(()=>false))===v0);if(!c.textInert)c.outcome='FAIL_TEXT_ACTIVE';if(page.url()!==u0)await load();}}}
                candidates=page.locator(sel);count=await candidates.count();idx=-1;for(let j=0;j<count;j++){const el=candidates.nth(j);if(!await el.isVisible().catch(()=>false))continue;const m=await el.evaluate(metaFn);if(same(m,want)){idx=j;break}}if(idx<0){c.outcome='FAIL_CONTROL_DISAPPEARED';throw new Error('control missing before box click')}input=candidates.nth(idx);const u0=page.url(),v0=await input.isChecked().catch(()=>false);await input.scrollIntoViewIfNeeded();await input.click();await sleep(750);c.destination=page.url();const v1=await input.isChecked().catch(()=>v0);c.boxActivated=(c.destination!==u0)||(v1!==v0);if(!c.boxActivated&&c.outcome==='PASS')c.outcome='FAIL_BOX_NO_EFFECT';const state=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),rx=/loading items|checking items|counting items|building the customer-facing product tree|organizing .* products/i,t=(m?.innerText||'').replace(/\s+/g,' ');const titles=[...m.querySelectorAll('a[href*="/products/"]')].filter(a=>{const r=a.getBoundingClientRect(),s=getComputedStyle(a);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'}).map(a=>(a.closest('.product-card,.product-grid__item,.sq-custom-color-product,.sqsg-product,.sq-type-family-product,[class*=product]')?.innerText||a.innerText||'').replace(/\s+/g,' ').trim().split('\n')[0]).filter(Boolean);return{loading:rx.test(t),titles:[...new Set(titles)].slice(0,120),bad:/internal server error|something went wrong|there was a problem/i.test((document.title||'')+' '+t)}});c.productTitles=state.titles;c.semanticCandidates=semantic(want.aria||want.label,state.titles);if(state.loading&&c.outcome==='PASS')c.outcome='FAIL_LOADING';if(state.bad&&c.outcome==='PASS')c.outcome='FAIL_ERROR_PAGE';if(c.semanticCandidates.length&&c.outcome==='PASS')c.outcome='FAIL_SEMANTIC_CANDIDATES';}catch(e){c.error=String(e).split('\n')[0];if(c.outcome==='PASS')c.outcome='FAIL_EXCEPTION'}rec.controls.push(c);}
              await page.screenshot({path:`${out}/screens/${slug}.png`,fullPage:false}).catch(()=>{})}}catch(e){rec.fatal=String(e).split('\n')[0]}rec.failedControls=rec.controls.filter(c=>c.outcome!=='PASS').length;rec.fail=(rec.status!==200&&!rec.challenge)||rec.sidebarCount>1||rec.failedControls>0||rec.pageErrors.some(x=>/syntaxerror|unexpected token/i.test(x));rows.push(rec);fs.writeFileSync(`${out}/results-${shard}.json`,JSON.stringify(rows,null,2));await ctx.close();await sleep(1700)}await browser.close();const summary={shard,routes:rows.length,controls:rows.reduce((n,r)=>n+r.controls.length,0),failedRoutes:rows.filter(r=>r.fail).length,failedControls:rows.reduce((n,r)=>n+r.failedControls,0),semanticCandidates:rows.reduce((n,r)=>n+r.controls.reduce((m,c)=>m+c.semanticCandidates.length,0),0),challenges:rows.filter(r=>r.challenge).length};fs.writeFileSync(`${out}/summary-${shard}.json`,JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));if(summary.failedRoutes)process.exitCode=2;
          EOF
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep12-every-refine-${{ matrix.shard }}
          path: out
          retention-days: 7
