name: Sep12 Ohio Patches exact physical hit
on:
  push:
    paths:
      - '.github/workflows/sep12-ohio-patches-exact-hit.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Retest Ohio Patches physical input
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
        run: |
          cat > t.mjs <<'EOF'
          import {chromium} from 'playwright';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({headless:true});
          let pass=false,last={};
          for(let attempt=1;attempt<=5&&!pass;attempt++){
            const ctx=await browser.newContext({viewport:{width:1365,height:900}}),p=await ctx.newPage();p.setDefaultTimeout(12000);
            try{
              const u=new URL('/collections/state-guard-series-ohio',process.env.BASE);u.searchParams.set('preview_theme_id',process.env.THEME);
              const r=await p.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:40000});if(!r||r.status()===429){throw new Error('HTTP '+(r?.status()||0))}
              await p.locator('#MainContent').waitFor({state:'attached'});
              for(let n=0;n<50;n++){await p.evaluate(()=>{for(const s of ['#PBarNextFrameWrapper','#PBarNextFrame','iframe[src*="shopifycloud/preview-bar"]'])document.querySelectorAll(s).forEach(e=>{try{e.hidePopover?.()}catch{}e.style.setProperty('display','none','important');e.style.setProperty('pointer-events','none','important')})});const ls=await p.locator('#MainContent .sqsg-refine-choice input[type=checkbox]').evaluateAll(xs=>xs.map(x=>x.getAttribute('aria-label'))).catch(()=>[]);if(ls.length===8&&ls.includes('Patches')){await sleep(1200);break}await sleep(200)}
              const input=p.locator('#MainContent .sqsg-refine-choice input[aria-label="Patches"]').first();await input.scrollIntoViewIfNeeded();await sleep(150);await p.evaluate(()=>{for(const s of ['#PBarNextFrameWrapper','#PBarNextFrame','iframe[src*="shopifycloud/preview-bar"]'])document.querySelectorAll(s).forEach(e=>{try{e.hidePopover?.()}catch{}e.style.setProperty('display','none','important');e.style.setProperty('pointer-events','none','important')})});
              const before=p.url(),href=await input.getAttribute('data-sqsg-refine-href');
              const span=input.locator('xpath=..').locator('span').first(),sb=await span.boundingBox();if(!sb)throw new Error('text bbox missing');await p.mouse.click(sb.x+sb.width/2,sb.y+sb.height/2);await sleep(350);const textNoOp=p.url()===before&&!(await input.isChecked());
              let box,hit;
              for(let n=0;n<20;n++){const live=p.locator('#MainContent .sqsg-refine-choice input[aria-label="Patches"]').first();await live.scrollIntoViewIfNeeded();await sleep(80);box=await live.boundingBox();if(box){hit=await p.evaluate(({x,y})=>{const e=document.elementFromPoint(x,y);return {tag:e?.tagName||null,cls:String(e?.className||''),html:e?.outerHTML?.slice(0,300)||null}},{x:box.x+box.width/2,y:box.y+box.height/2});if(hit.tag==='INPUT')break}await sleep(120)}
              if(!box||hit?.tag!=='INPUT')throw new Error('INPUT never became physical hit target '+JSON.stringify(hit));await p.mouse.click(box.x+box.width/2,box.y+box.height/2);await Promise.race([p.waitForURL(z=>z.toString()!==before,{timeout:7000}).catch(()=>{}),sleep(1400)]);const after=p.url();pass=textNoOp&&after!==before;last={attempt,status:r.status(),href,before,textNoOp,hit,after,pass};console.log(JSON.stringify(last));
            }catch(e){last={attempt,error:String(e),pass:false};console.log(JSON.stringify(last))}
            await ctx.close();if(!pass)await sleep(1800*attempt);
          }
          await browser.close();if(!pass)process.exitCode=2;
          EOF
          node t.mjs
