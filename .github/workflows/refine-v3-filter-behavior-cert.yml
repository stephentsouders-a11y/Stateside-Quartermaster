name: Refine V3 synthetic Type filter certification
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/refine-v3-filter-behavior-cert.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  type-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Click and persist Shop by Type
        run: |
          cat > cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          const B='https://www.statesideqm.com',T='158561894555',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const url=()=>{const u=new URL('/collections/apparel',B);u.searchParams.set('preview_theme_id',T);return u.toString()};
          const browser=await chromium.launch({headless:true}),c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();
          let r;for(let a=0;a<5;a++){r=await p.goto(url(),{waitUntil:'domcontentloaded',timeout:70000}).catch(()=>null);if(r?.status()===200){try{await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000});break}catch(_){}}console.log('RETRY ROOT',a+1,r?.status());await sleep(3000*(a+1))}if(document.querySelector){}
          const group=p.locator('.sq-refine-v3-sidebar > details.sq-refine-v3-group').filter({has:p.locator(':scope > summary',{hasText:/^Shop by Type$/})}).first();if(!await group.count())throw new Error('type group missing');if(await group.getAttribute('open')===null)await group.locator(':scope > summary').evaluate(e=>e.click());const input=group.locator('input[data-sq-polish-param][data-sq-polish-value]').first();if(!await input.count())throw new Error('synthetic type filter missing');const d=await input.evaluate(i=>({name:i.dataset.sqPolishParam,value:i.dataset.sqPolishValue,text:(i.closest('label')?.textContent||'').trim()}));const before=p.url();await input.evaluate(e=>e.click());await p.waitForFunction(b=>location.href!==b,before,{timeout:30000});await p.waitForLoadState('domcontentloaded',{timeout:30000}).catch(()=>{});await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:45000});const q=new URL(p.url());if(!q.searchParams.getAll(d.name).includes(d.value))throw new Error('synthetic URL failed '+JSON.stringify(d)+' '+p.url());const persisted=await p.locator('.sq-refine-v3-sidebar input[data-sq-polish-param][data-sq-polish-value]').evaluateAll((els,x)=>els.some(i=>i.dataset.sqPolishParam===x.name&&i.dataset.sqPolishValue===x.value&&i.checked),d);if(!persisted)throw new Error('synthetic persistence failed '+JSON.stringify(d));console.log('SYNTHETIC TYPE PASS',JSON.stringify(d),p.url());await c.close();await browser.close();
          EOF
          node cert.mjs
