name: Sep15 repair gate - current unpublished draft
on:
  push:
    paths:
      - '.github/workflows/trigger-storefront-certification.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Slow Chromium repair certification
        env:
          BASE: https://www.statesideqm.com
          THEME: '158770561179'
        run: |
          cat > certify.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          import fs from 'fs';
          const BASE=process.env.BASE, THEME=process.env.THEME, OUT='out';
          const routes=[
            '/',
            '/collections/products-built-for-the-line-u-s-army',
            '/collections/army-national-guard-series',
            '/collections/products-built-for-the-line-u-s-air-force',
            '/collections/air-national-guard-series',
            '/collections/products-built-for-the-line-u-s-navy',
            '/collections/products-built-for-the-line-u-s-marine-corps',
            '/collections/products-built-for-the-line-u-s-coast-guard',
            '/collections/products-built-for-the-line-u-s-space-force',
            '/collections/state-guard-series',
            '/collections/state-guard-series-ohio',
            '/collections/armed-forces-gear',
            '/collections/accessories-gifts-collectibles',
            '/collections/uniforms',
            '/collections/tactical-gear',
            '/collections/k9-dog-gear',
            '/collections/outdoor-preparedness-gear',
            '/collections/sta-brite-insignia'
          ];
          fs.mkdirSync(`${OUT}/screens`,{recursive:true});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const safe=s=>s.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')||'home';
          const browser=await chromium.launch({headless:true});
          const results=[];
          let rateLimited=false;
          for(const device of ['desktop','mobile']){
            if(rateLimited) break;
            for(const route of routes){
              const context=await browser.newContext(device==='mobile'?devices['iPhone 13']:{viewport:{width:1365,height:900}});
              const page=await context.newPage();
              page.setDefaultTimeout(12000); page.setDefaultNavigationTimeout(35000);
              const url=new URL(route,BASE); url.searchParams.set('preview_theme_id',THEME);
              const r={device,route,failures:[]};
              try{
                const res=await page.goto(url.toString(),{waitUntil:'domcontentloaded'});
                r.status=res?.status()??null;
                await page.waitForTimeout(5500);
                const body=((await page.locator('body').innerText().catch(()=>''))||'').slice(0,25000);
                if(r.status===429||/verify you are human|too many requests|rate limit/i.test(body)){
                  r.failures.push('RATE_LIMITED'); rateLimited=true;
                } else {
                  r.title=(await page.title()).trim();
                  r.h1=((await page.locator('#MainContent h1,h1').first().innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim();
                  r.spinner=await page.locator('text=/loading items|building the customer-facing product tree|checking items|organizing .* products/i').count().catch(()=>0);
                  r.sidebars=await page.locator('#MainContent .sq-refine-v3-sidebar:visible,#MainContent .sq-global-refine-sidebar:visible,#MainContent .sqsg-refine-sidebar:visible,#MainContent .sq-stabrite-refine__side:visible').count().catch(()=>0);
                  r.brokenImages=await page.locator('#MainContent img').evaluateAll(xs=>xs.filter(i=>i.complete&&i.naturalWidth===0).length).catch(()=>0);
                  r.overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+4).catch(()=>false);
                  if(r.status!==200) r.failures.push(`HTTP_${r.status}`);
                  if(!r.title) r.failures.push('MISSING_DOCUMENT_TITLE');
                  if(route.includes('products-built-for-the-line')||route.includes('national-guard-series')) if(!r.h1) r.failures.push('MISSING_VISIBLE_PAGE_TITLE');
                  if(r.spinner) r.failures.push(`SPINNER_${r.spinner}`);
                  if(r.sidebars>1) r.failures.push(`DUPLICATE_SIDEBARS_${r.sidebars}`);
                  if(route==='/collections/state-guard-series'&&r.sidebars!==0) r.failures.push(`STATE_GUARD_ROOT_SIDEBAR_${r.sidebars}`);
                  if(r.brokenImages) r.failures.push(`BROKEN_IMAGES_${r.brokenImages}`);
                  if(r.overflow) r.failures.push('HORIZONTAL_OVERFLOW');
                  const link=page.locator('#MainContent a:visible:not([href*="/products/"])').filter({hasNotText:/skip to content/i}).first();
                  if(await link.count().catch(()=>0)){
                    const href=await link.getAttribute('href').catch(()=>null);
                    if(href&&href!=='#'){
                      await link.scrollIntoViewIfNeeded().catch(()=>{});
                      await Promise.all([page.waitForLoadState('domcontentloaded').catch(()=>{}),link.click({timeout:8000}).catch(e=>{r.clickError=String(e)})]);
                      await page.waitForTimeout(1200);
                      if(r.clickError) r.failures.push('FIRST_CONTROL_CLICK_FAILED');
                    }
                  }
                  await page.screenshot({path:`${OUT}/screens/${device}-${safe(route)}.png`,fullPage:true}).catch(()=>{});
                }
              } catch(e){r.failures.push('EXCEPTION');r.error=String(e)}
              r.pass=r.failures.length===0; results.push(r);
              fs.writeFileSync(`${OUT}/results.json`,JSON.stringify(results,null,2));
              console.log(JSON.stringify({device,route,pass:r.pass,failures:r.failures}));
              await context.close();
              await sleep(3000);
              if(rateLimited) break;
            }
          }
          await browser.close();
          const summary={theme:THEME,checked:results.length,passed:results.filter(r=>r.pass).length,failed:results.filter(r=>!r.pass).length,rateLimited,failures:results.filter(r=>!r.pass)};
          fs.writeFileSync(`${OUT}/summary.json`,JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          if(summary.failed&&!rateLimited) process.exitCode=2;
          if(rateLimited) process.exitCode=3;
          JS
          node certify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep15-repair-gate-current-draft
          path: out
          retention-days: 7
