name: Accessories first-paint manufacturer trace
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Trace visible legacy manufacturer surface
        run: |
          cat > trace.mjs <<'EOF'
          import {chromium} from 'playwright';import fs from 'fs';fs.mkdirSync('out',{recursive:true});
          const b=await chromium.launch();const c=await b.newContext({viewport:{width:390,height:844},recordVideo:{dir:'out',size:{width:390,height:720}}});const p=await c.newPage();
          await p.addInitScript(()=>{window.__manufacturerTrace=[];const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>2&&r.height>2};const phrase='Choose a manufacturer to narrow this collection';const clean=s=>String(s||'').replace(/\s+/g,' ').trim();const chain=e=>{const a=[];for(let n=e;n&&a.length<8;n=n.parentElement)a.push({tag:n.tagName,id:n.id||'',class:typeof n.className==='string'?n.className:''});return a};const tick=()=>{const main=document.querySelector('#MainContent');if(main){const candidates=[...main.querySelectorAll('*')].filter(e=>vis(e)&&clean(e.innerText).includes(phrase));let el=candidates.find(e=>![...e.children].some(ch=>vis(ch)&&clean(ch.innerText).includes(phrase)))||candidates[candidates.length-1]||null;const wrongBranch=[...main.querySelectorAll('summary')].filter(e=>vis(e)&&/^Shop by Branch$/i.test(clean(e.textContent))).map(e=>({outer:e.outerHTML.slice(0,1000),chain:chain(e)}));if(el||wrongBranch.length)window.__manufacturerTrace.push({t:Math.round(performance.now()),element:el?{tag:el.tagName,id:el.id||'',class:typeof el.className==='string'?el.className:'',text:clean(el.innerText).slice(0,600),outer:el.outerHTML.slice(0,5000),chain:chain(el)}:null,wrongBranch});}if(performance.now()<3000)requestAnimationFrame(tick)};requestAnimationFrame(tick)});
          const r=await p.goto('https://www.statesideqm.com/collections/accessories-gifts-collectibles?preview_theme_id=158561894555',{waitUntil:'domcontentloaded',timeout:90000}).catch(()=>null);await p.waitForTimeout(3500);await p.screenshot({path:'out/final.png',fullPage:true});const trace=await p.evaluate(()=>window.__manufacturerTrace||[]);fs.writeFileSync('out/trace.json',JSON.stringify({status:r?.status()||null,trace},null,2));console.log(JSON.stringify({status:r?.status()||null,count:trace.length,first:trace[0]||null,last:trace.at(-1)||null},null,2));const v=p.video();await p.close();await c.close();if(v){const src=await v.path();fs.copyFileSync(src,'out/mobile-trace.webm')}await b.close();
          EOF
          node trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessories-first-paint-manufacturer-trace
          path: out
          retention-days: 14