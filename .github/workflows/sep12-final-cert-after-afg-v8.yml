name: Sep12 final certificate after AFG v8
on:
  workflow_run:
    workflows: ['Sep12 AFG full physical after retry']
    types: [completed]
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Final low-noise desktop-mobile certificate
        env:
          BASE: https://www.statesideqm.com
          THEME: '158561894555'
        run: |
          cat > final-v8.mjs <<'EOF'
          import {chromium,devices} from 'playwright';import fs from 'fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms)),BASE=process.env.BASE,THEME=process.env.THEME,OUT='out';fs.mkdirSync(`${OUT}/screens`,{recursive:true});fs.mkdirSync(`${OUT}/videos`,{recursive:true});
          const routes=['/','/collections/products-built-for-the-line-u-s-army','/collections/army-national-guard-series','/collections/products-built-for-the-line-u-s-air-force','/collections/air-national-guard-series','/collections/products-built-for-the-line-u-s-navy','/collections/products-built-for-the-line-u-s-marine-corps','/collections/products-built-for-the-line-u-s-coast-guard','/collections/products-built-for-the-line-u-s-space-force','/collections/state-guard-series','/collections/rotc-series','/collections/jrotc-series','/collections/military-schools-academies','/collections/armed-forces-gear','/collections/accessories-gifts-collectibles','/collections/thin-line','/collections/sta-brite-insignia','/collections/state-guard-series-ohio'];
          const titleRequired=/^\/collections\/(products-built-for-the-line-u-s-(army|air-force|navy|marine-corps|coast-guard|space-force)|army-national-guard-series|air-national-guard-series|state-guard-series|rotc-series|jrotc-series|military-schools-academies)$/;
          const productLinks='#MainContent collection-component a[href*="/products/"]:visible,#MainContent .sq-refine-v3-product-grid a[href*="/products/"]:visible,#MainContent .sq-taxonomy-products a[href*="/products/"]:visible,#MainContent [data-sq-stabrite-products] a[href*="/products/"]:visible,#MainContent .sq-global-refine-main .product-grid a[href*="/products/"]:visible';
          const sidebars='#MainContent .sq-refine-v3-sidebar:visible,#MainContent .sq-global-refine-sidebar:visible,#MainContent .sqsg-refine-sidebar:visible,#MainContent .sq-stabrite-refine__side:visible';
          const safe=s=>s.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')||'home';
          const browser=await chromium.launch({headless:true}),results=[];
          async function strip(p){await p.evaluate(()=>{for(const s of ['#PBarNextFrameWrapper','#PBarNextFrame','iframe[src*="shopifycloud/preview-bar"]'])document.querySelectorAll(s).forEach(e=>{try{e.hidePopover?.()}catch{}e.style.setProperty('display','none','important');e.style.setProperty('pointer-events','none','important')})}).catch(()=>{})}
          async function load(p,route){let last;for(let a=0;a<6;a++){try{const u=new URL(route,BASE);u.searchParams.set('preview_theme_id',THEME);const t=Date.now(),r=await p.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:40000});if(!r||r.status()===429||r.status()>=500){last=new Error('HTTP '+(r?.status()||0));await sleep(2200*(a+1));continue}await p.locator('#MainContent').waitFor({state:'attached',timeout:12000});await sleep(Math.max(0,3500-(Date.now()-t)));await strip(p);return {r,usableMs:Date.now()-t}}catch(e){last=e;await sleep(2200*(a+1))}}throw last}
          for(const device of ['desktop','mobile'])for(const route of routes){const ctx=await browser.newContext(device==='mobile'?{...devices['iPhone 13'],recordVideo:{dir:`${OUT}/videos`,size:{width:390,height:844}}}:{viewport:{width:1365,height:900},recordVideo:{dir:`${OUT}/videos`,size:{width:960,height:633}}});const p=await ctx.newPage();p.setDefaultTimeout(12000);const o={device,route,failures:[]};try{const L=await load(p,route);o.status=L.r.status();o.usableMs=L.usableMs;const body=((await p.locator('body').innerText().catch(()=>''))||'').slice(0,20000);o.title=await p.title();o.h1=((await p.locator('#MainContent h1,h1').first().innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim();o.sidebars=await p.locator(sidebars).count().catch(()=>0);o.horizontalFacets=await p.locator('#MainContent .facets-block-wrapper--horizontal:visible').count().catch(()=>0);o.spinner=await p.locator('text=/loading items|building the customer-facing product tree|checking items|organizing .* products/i').count().catch(()=>0);o.broken=await p.locator('#MainContent img').evaluateAll(xs=>xs.filter(i=>i.complete&&i.naturalWidth===0).length).catch(()=>0);o.overflow=await p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+4).catch(()=>false);o.availability=await p.locator('#MainContent a[href*="filter.v.availability"],#MainContent form[action*="filter.v.availability"]').count().catch(()=>0);if(o.status!==200)o.failures.push('HTTP_'+o.status);if(/something went wrong|internal server error|there was a problem|404 not found|page not found/i.test((o.title||'')+' '+body))o.failures.push('ERROR_PAGE');if(o.spinner)o.failures.push('BLOCKING_SPINNER_AFTER_3_5S');if(o.broken)o.failures.push('BROKEN_IMAGES_'+o.broken);if(o.overflow)o.failures.push('HORIZONTAL_OVERFLOW');if(o.horizontalFacets)o.failures.push('DUPLICATE_HORIZONTAL_FACETS');if(o.availability||new URL(p.url()).searchParams.has('filter.v.availability'))o.failures.push('FORCED_AVAILABILITY_FILTER');if(titleRequired.test(route)&&!o.h1)o.failures.push('MISSING_VISIBLE_PAGE_TITLE');
              if(route==='/collections/state-guard-series'){if(o.sidebars!==0)o.failures.push('STATE_GUARD_ROOT_SIDEBAR_'+o.sidebars);o.sgCards=await p.locator('#MainContent .sg-entity:visible').count().catch(()=>0);o.sgMerch=await p.locator('#MainContent [data-sq-state-guard-merch-feature]:visible').count().catch(()=>0);if(o.sgCards<20)o.failures.push('STATE_GUARD_CARD_COUNT_'+o.sgCards);if(o.sgMerch!==1)o.failures.push('STATE_GUARD_MERCH_COUNT_'+o.sgMerch);o.sgOrder=await p.evaluate(()=>{const m=document.querySelector('[data-sq-state-guard-merch-feature]'),g=[...document.querySelectorAll('.sg-entity-grid')].find(x=>{const s=getComputedStyle(x),b=x.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&b.width>2&&b.height>2});return !!(m&&g&&(m.compareDocumentPosition(g)&Node.DOCUMENT_POSITION_FOLLOWING))}).catch(()=>false);if(!o.sgOrder)o.failures.push('STATE_GUARD_MERCH_NOT_ABOVE_GRID');if(device==='desktop'){o.sgCols=await p.locator('.sg-entity-grid:visible').first().evaluate(el=>getComputedStyle(el).gridTemplateColumns.split(' ').filter(Boolean).length).catch(()=>0);if(o.sgCols!==4)o.failures.push('STATE_GUARD_DESKTOP_COLUMNS_'+o.sgCols)}}else if(route.startsWith('/collections/')){if(o.sidebars!==1)o.failures.push('SIDEBAR_COUNT_'+o.sidebars);o.visibleProducts=await p.locator(productLinks).count().catch(()=>0);o.concept=await p.locator('#MainContent [data-pagination-design="concept-one"]:visible,#MainContent .sq-refine-v3-pager[data-sq-pagination-concept="one"]:visible,#MainContent .sq-taxonomy-concept-one-pager:visible,#MainContent .sq-stabrite-refine__pager[data-pagination-design="concept-one"]:visible').count().catch(()=>0);o.pageNumbers=await p.locator('#MainContent [data-vac-global-page]:visible,#MainContent .sq-refine-v3-page-btn--number:visible,#MainContent .sq-taxonomy-page-btn[data-sq-page-number]:visible,#MainContent .sq-stabrite-refine__pager button[data-page]:visible').count().catch(()=>0);o.per50=await p.locator('#MainContent [data-vac-page-size="50"]:visible,#MainContent input[name="sq_page_size"][value="50"]:visible,#MainContent input[name="sq_per_page_control"][value="50"]:visible,#MainContent input[name="sq_stabrite_page_size"][value="50"]:visible').count().catch(()=>0);o.per100=await p.locator('#MainContent [data-vac-page-size="100"]:visible,#MainContent input[name="sq_page_size"][value="100"]:visible,#MainContent input[name="sq_per_page_control"][value="100"]:visible,#MainContent input[name="sq_stabrite_page_size"][value="100"]:visible').count().catch(()=>0);if(route==='/collections/sta-brite-insignia'){o.per250=await p.locator('#MainContent input[name="sq_stabrite_page_size"][value="250"]:visible').count().catch(()=>0);o.staChoices=await p.locator('#MainContent .sq-stabrite-refine__choice input[type="checkbox"]:visible').count().catch(()=>0);if(o.per250!==1)o.failures.push('STABRITE_250_MISSING');if(o.staChoices!==11)o.failures.push('STABRITE_CHOICES_'+o.staChoices)}const paginated=o.concept>0||o.pageNumbers>1||o.per50>0||o.per100>0||o.visibleProducts>=50;if(paginated&&(!o.per50||!o.per100))o.failures.push('PRODUCTS_PER_PAGE_50_100_MISSING');if(o.visibleProducts>=50&&(!o.concept||o.pageNumbers<2))o.failures.push('CONCEPT_ONE_NUMBERED_PAGINATION_MISSING')}
              if(route==='/'){o.homeLaw=await p.locator('#MainContent a:visible').evaluateAll(as=>as.filter(a=>/law enforcement/i.test((a.textContent||'').replace(/\s+/g,' '))).length).catch(()=>0);o.homeFire=await p.locator('#MainContent a:visible').evaluateAll(as=>as.filter(a=>/firefight|fire\/ems|fire & ems/i.test((a.textContent||'').replace(/\s+/g,' '))).length).catch(()=>0);if(o.homeLaw>1)o.failures.push('DUPLICATE_HOME_LAW_'+o.homeLaw);if(o.homeFire>1)o.failures.push('DUPLICATE_HOME_FIRE_'+o.homeFire)}await p.screenshot({path:`${OUT}/screens/${device}-${safe(route)}.png`,fullPage:false}).catch(()=>{});
            }catch(e){o.failures.push('EXCEPTION');o.error=String(e)}o.pass=o.failures.length===0;results.push(o);console.log(JSON.stringify({device,route,pass:o.pass,failures:o.failures,error:o.error||null}));fs.writeFileSync(`${OUT}/results.json`,JSON.stringify(results,null,2));const v=p.video();await ctx.close();if(v){try{fs.renameSync(await v.path(),`${OUT}/videos/${device}-${safe(route)}.webm`)}catch{}}await sleep(500)}
          await browser.close();const summary={routes:results.length,passed:results.filter(x=>x.pass).length,failed:results.filter(x=>!x.pass).length,failures:results.filter(x=>!x.pass).map(x=>({device:x.device,route:x.route,failures:x.failures,error:x.error||null}))};fs.writeFileSync(`${OUT}/summary.json`,JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));if(summary.failed)process.exitCode=2;
          EOF
          node final-v8.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-certificate-after-afg-v8
          path: out
          retention-days: 7
