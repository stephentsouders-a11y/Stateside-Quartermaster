name: Storefront button certification - sharded
on:
  push:
    paths:
      - '.github/workflows/storefront-button-crawl-sharded.yml'
permissions:
  contents: read
jobs:
  crawl:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Certify shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cat > shard.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const shard=Number(process.env.SHARD), shards=8;
          fs.mkdirSync('out',{recursive:true});
          const base='https://www.statesideqm.com',theme='158561894555';
          const seeds=['/','/collections/products-built-for-the-line-u-s-army','/collections/army-national-guard-series','/collections/products-built-for-the-line-u-s-air-force','/collections/air-national-guard-series','/collections/state-guard-series','/collections/armed-forces-gear','/collections/thin-line','/collections/law-enforcement-corrections','/collections/firefighting-ems-search-rescue','/collections/rotc-series','/collections/jrotc-series','/collections/military-schools-academies'];
          const browser=await chromium.launch({headless:true});
          const discovered=new Map(); const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function clean(h){try{const u=new URL(h,base);if(u.origin!==base||!/^\/(collections|products)\//.test(u.pathname))return null;u.searchParams.delete('preview_theme_id');u.searchParams.delete('filter.v.availability');u.hash='';return u.pathname+(u.searchParams.toString()?'?'+u.searchParams.toString():'')}catch{return null}}
          async function open(route){for(let a=0;a<2;a++){const ctx=await browser.newContext({viewport:{width:1440,height:1100}}),page=await ctx.newPage();const u=new URL(route,base);u.searchParams.delete('filter.v.availability');u.searchParams.set('preview_theme_id',theme);let status=null,error=null;const start=Date.now();try{const r=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:18000});status=r?.status()??null}catch(e){error=String(e)}if((status===429||status===502||status===503)&&a===0){await ctx.close();await sleep(7000);continue}return{ctx,page,status,error,start}}}
          for(const seed of seeds){const n=await open(seed);if(!n)continue;const {ctx,page,status}=n;if(status===200){await page.waitForTimeout(700);const links=await page.evaluate(()=>[...document.querySelectorAll('#MainContent a[href]')].filter(a=>{const r=a.getBoundingClientRect();if(r.width<30||r.height<20)return false;const c=String(a.className||'');return /sq|card|button|tile|entity|branch|category|type|manufacturer/i.test(c)&&!/product-card|sqbfl-product/i.test(c)}).map(a=>({href:a.href,label:(a.innerText||a.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim().slice(0,160)}))).catch(()=>[]);for(const l of links){const h=clean(l.href);if(h&&!discovered.has(h))discovered.set(h,l.label)}}await ctx.close();await sleep(500)}
          const all=[...discovered.entries()], routes=all.filter((_,i)=>i%shards===shard); const results=[];
          console.log(`DISCOVERED ${all.length}; SHARD ${shard} TESTING ${routes.length}`);
          for(let i=0;i<routes.length;i++){
            const [route,label]=routes[i],n=await open(route);if(!n)continue;const{ctx,page,status,error,start}=n;let usable=null,state=null;
            if(status===200&&!error){for(let j=0;j<20;j++){state=await page.evaluate(()=>{const m=document.querySelector('#MainContent'),t=(m?.innerText||'').replace(/\s+/g,' ').trim();const visible=[...(m?.querySelectorAll('a,.product-card,.product-grid__item,.sqbfl-card,.sq-subcategory-card,.sg-entity,.sq-afg-branch-card,.sq-ts-match-card,.sq-type-family-product,.sqaca-card,.sqaca-all')||[])].some(e=>{const r=e.getBoundingClientRect();return r.width>30&&r.height>20});return{bad:/just a moment|something went wrong|internal server error|there was a problem/i.test(document.title+' '+t),loading:/loading items|checking items|tree unavailable|building the customer-facing product tree/i.test(t),visible,availability:[...(m?.querySelectorAll('a[href*="filter.v.availability"]')||[])].length,broken:[...(m?.querySelectorAll('img')||[])].filter(x=>x.complete&&x.naturalWidth===0).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4}}).catch(()=>({bad:true,loading:false,visible:false,availability:0,broken:0,overflow:false}));if(!state.bad&&!state.loading&&state.visible){usable=Date.now()-start;break}await page.waitForTimeout(200)}}
            state ||= {bad:true,loading:false,visible:false,availability:0,broken:0,overflow:false};
            const failed=status!==200||!!error||state.bad||state.loading||!state.visible||usable===null||usable>5000||state.availability>0||state.broken>0||state.overflow;
            const row={globalIndex:all.findIndex(x=>x[0]===route)+1,route,label,status,error,usableMs:usable,failed,...state};results.push(row);console.log(JSON.stringify(row));await ctx.close();await sleep(650);
          }
          await browser.close();fs.writeFileSync('out/report.json',JSON.stringify({discovered:all.length,shard,tested:results.length,failures:results.filter(x=>x.failed)},null,2));const failures=results.filter(x=>x.failed);console.log(`SHARD ${shard}: ${results.length-failures.length} PASS / ${failures.length} FAIL`);if(failures.length)process.exitCode=2;
          EOF
          node shard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: button-shard-${{ matrix.shard }}
          path: out/report.json
          retention-days: 7
