name: Accessories final zero-flash Chromium certification
on:
  push:
    paths:
      - '.github/workflows/accessories-final-zero-flash-cert.yml'
      - 'snippets/sq-refine-v3-button01-accessories-fix.liquid'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
      - name: Chromium desktop/mobile video and first-paint audit
        run: |
          cat > final-cert.mjs <<'EOF'
          import { chromium } from 'playwright'; import fs from 'fs'; import cp from 'child_process';
          fs.mkdirSync('out/videos',{recursive:true}); fs.mkdirSync('out/screens',{recursive:true}); fs.mkdirSync('out/frames',{recursive:true});
          const url='https://www.statesideqm.com/collections/accessories-gifts-collectibles?preview_theme_id=158561894555';
          const expected=['Challenge Coins & Displays','Collectibles & Cards','Drinkware','Keychains & Lanyards','Memorial & Personalized Gifts','Military Surplus & Collectibles','Pins, Buttons & Small Insignia','Sword & Knife Display Cases','Wallets & Pocket Gifts'];
          const report={url,failures:[],devices:[]};
          for (const [name,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]) {
            const b=await chromium.launch({headless:true}); const c=await b.newContext({viewport,recordVideo:{dir:'out/videos',size:{width:name==='desktop'?1280:390,height:720}}}); const p=await c.newPage();
            const errors=[]; p.on('pageerror',e=>errors.push(String(e))); p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await p.addInitScript(()=>{window.__audit={samples:[],readyAt:null}; const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>2&&r.height>2}; const tick=()=>{const m=document.querySelector('#MainContent'); if(m){const t=Math.round(performance.now()),text=(m.innerText||'').replace(/\s+/g,' '),ready=m.dataset.sqRefineV3Ready||null,native=[...m.querySelectorAll('.facets-block-wrapper--horizontal .facets__filters-wrapper,.facets-toggle__wrapper,theme-drawer#filters-drawer')].some(vis),legacy=/State Guard Uniform Builder|Build Your Uniform|PT Uniform|building the customer-facing product tree/i.test(text),oldCards=[...m.querySelectorAll('.sq-subcategory-section,.sq-subcategory-card')].some(vis); if(ready==='true'&&window.__audit.readyAt===null)window.__audit.readyAt=t; window.__audit.samples.push({t,ready,native,legacy,oldCards});} if(performance.now()<7000)requestAnimationFrame(tick)}; requestAnimationFrame(tick)});
            const r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:90000}).catch(()=>null);
            for(const [tag,ms] of [['0ms',0],['100ms',100],['250ms',150],['500ms',250],['1s',500],['2s',1000]]){if(ms)await p.waitForTimeout(ms);await p.screenshot({path:`out/screens/${name}-${tag}.png`}).catch(()=>{})}
            await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:30000}).catch(()=>{}); await p.waitForTimeout(500);
            const state=await p.evaluate(expected=>{const m=document.querySelector('#MainContent'),vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>2&&r.height>2}; const side=m?.querySelector('.sq-refine-v3-sidebar'); const groups=side?[...side.querySelectorAll('details.sq-refine-v3-group')].map(d=>({title:(d.querySelector('summary')?.textContent||'').trim(),inputs:d.querySelectorAll('input[type=checkbox]').length,choices:[...d.querySelectorAll('.sq-refine-v3-choice span')].filter(vis).map(x=>x.textContent.trim())})):[]; const cat=groups.find(g=>g.title==='Shop by Category'); const cards=[...m.querySelectorAll('.sq-refine-v3-results .product-grid > *')].filter(vis),xs=[...new Set(cards.slice(0,8).map(x=>Math.round(x.getBoundingClientRect().left)))]; return {ready:m?.dataset.sqRefineV3Ready||null,groups,categories:cat?.choices||[],categoryExact:JSON.stringify(cat?.choices||[])===JSON.stringify(expected),cards:cards.length,columns:xs.length,pageSize:(m.querySelector('.sq-refine-v3-page-size')?.innerText||'').replace(/\s+/g,' ').trim(),native:[...m.querySelectorAll('.facets-block-wrapper--horizontal .facets__filters-wrapper,.facets-toggle__wrapper,theme-drawer#filters-drawer')].filter(vis).length,legacy:/State Guard Uniform Builder|Build Your Uniform|PT Uniform/i.test(m.innerText||''),oldCards:[...m.querySelectorAll('.sq-subcategory-section,.sq-subcategory-card')].filter(vis).length,duplicate:[...m.querySelectorAll('.product-grid')].filter(g=>vis(g)&&!m.querySelector('.sq-refine-v3-results')?.contains(g)&&g.querySelector('a[href*="/products/"]')).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+3,broken:[...m.querySelectorAll('img')].filter(i=>i.complete&&i.naturalWidth===0).length,audit:window.__audit};},expected);
            const toggles=[]; for(let i=0,n=await p.locator('#MainContent .sq-refine-v3-sidebar details.sq-refine-v3-group > summary').count();i<n;i++){const s=p.locator('#MainContent .sq-refine-v3-sidebar details.sq-refine-v3-group > summary').nth(i);const title=(await s.innerText()).trim(),a=await s.evaluate(e=>e.parentElement.open);await s.click();const x=await s.evaluate(e=>e.parentElement.open);await s.click();const y=await s.evaluate(e=>e.parentElement.open);toggles.push({title,ok:x!==a&&y===a})}
            await p.screenshot({path:`out/screens/${name}-final.png`,fullPage:true}); const result={name,status:r?.status()||null,errors,state,toggles}; report.devices.push(result);
            const bad=state.audit.samples.filter(x=>x.native||x.legacy||x.oldCards); if(result.status!==200)report.failures.push(`${name}:HTTP ${result.status}`); if(state.audit.readyAt===null||state.audit.readyAt>5000)report.failures.push(`${name}:ready ${state.audit.readyAt}`); if(bad.length)report.failures.push(`${name}:old layout visible ${bad.length} frames`); if(state.ready!=='true'||!state.categoryExact||state.cards<1||state.native||state.legacy||state.oldCards||state.duplicate||state.overflow||state.broken)report.failures.push(`${name}:steady-state failed`); if(!/50/.test(state.pageSize)||!/100/.test(state.pageSize)||!/250/.test(state.pageSize))report.failures.push(`${name}:page size controls`); if(name==='mobile'&&state.columns!==2)report.failures.push(`${name}:columns ${state.columns}`); if(toggles.some(t=>!t.ok))report.failures.push(`${name}:accordion toggle`); if(state.groups.some(g=>g.inputs<1))report.failures.push(`${name}:empty refine group`);
            const v=p.video(); await p.close(); await c.close(); if(v){const src=await v.path();const dest=`out/videos/${name}.webm`;fs.copyFileSync(src,dest);try{cp.execFileSync('ffmpeg',['-hide_banner','-loglevel','error','-i',dest,'-vf','fps=2',`out/frames/${name}-%03d.png`])}catch{}} await b.close();
          }
          fs.writeFileSync('out/report.json',JSON.stringify(report,null,2)); console.log(JSON.stringify(report,null,2)); if(report.failures.length)process.exitCode=2;
          EOF
          node final-cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessories-final-zero-flash-cert
          path: out
          retention-days: 14