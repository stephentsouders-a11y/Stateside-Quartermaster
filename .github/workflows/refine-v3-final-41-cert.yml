name: Refine V3 final 41 collection certification
on:
  push:
    branches: [refine-restart-v3]
    paths:
      - '.github/workflows/refine-v3-final-41-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Chromium certify 40 V3 roots plus untouched State Guard
        run: |
          cat > final41.mjs <<'EOF'
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright';
          const BASE='https://www.statesideqm.com',THEME='158561894555',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const routes=[
            ['Accessories','accessories-gifts-collectibles'],['Airsoft','airsoft-milsim'],['Apparel','apparel'],['Armed Forces Gear','armed-forces-gear'],['Art','art'],['Body Armor','body-armor-ballistic-protection'],['Books','literature'],['Child Safety','child-safety-shop'],['DIVE SCUBA','dive-scuba'],['Firearm Accessories','firearm-accessories'],['First Aid','first-aid-medical-ifak'],['Flags','flags-patriotic-decor'],['Flashlights','flashlights-lighting'],['Footwear','footwear-gloves-eyewear'],['K9','k9-dog-gear'],['Knives','knives-axes-cutlery'],['Morale Patches','morale-patches-tactical-id'],['Outdoor','outdoor-preparedness-gear'],['Patriotic','patriotic-american-heritage'],['Safety Rescue','safety-rescue-climbing'],['Sta-Brite','sta-brite-insignia'],['Tactical Gear','tactical-gear'],['Thin Line','thin-line'],['Uniforms','uniforms'],['Watches','watches'],['Zippo','zippos-lighters-torches'],['Logo Merch','stateside-quartermaster-logo-merch'],['Army National Guard','army-national-guard-series'],['Air National Guard','air-national-guard-series'],['Army','products-built-for-the-line-u-s-army'],['Navy','products-built-for-the-line-u-s-navy'],['Air Force','products-built-for-the-line-u-s-air-force'],['Marine Corps','products-built-for-the-line-u-s-marine-corps'],['Coast Guard','products-built-for-the-line-u-s-coast-guard'],['Space Force','products-built-for-the-line-u-s-space-force'],['ROTC','rotc-series'],['JROTC','jrotc-series'],['Military Schools','military-schools-academies'],['Law Enforcement','law-enforcement-corrections'],['Fire EMS SAR','firefighting-ems-search-rescue']
          ];
          const url=h=>`${BASE}/collections/${h}?preview_theme_id=${THEME}`;
          async function nav(page,u){let last;for(let i=0;i<5;i++){try{const r=await page.goto(u,{waitUntil:'domcontentloaded',timeout:90000}),s=r?.status()||0;if(s===200){await sleep(1600);return}last=new Error('HTTP '+s)}catch(e){last=e}await sleep([4000,7000,11000,16000,22000][i])}throw last||new Error('navigation failed')}
          async function inspect(page){return page.evaluate(()=>{
            const visible=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'};
            const main=document.querySelector('#MainContent');
            const side=[...main.querySelectorAll('.sq-refine-v3-sidebar')].find(visible);
            const grid=[...main.querySelectorAll('.sq-refine-v3-results .product-grid')].find(visible);
            const cards=grid?[...grid.querySelectorAll(':scope > .product-grid__item')].filter(e=>visible(e)&&e.querySelector('a[href*="/products/"]')):[];
            const rects=cards.slice(0,12).map(e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height}});const firstY=rects[0]?.y;const row=rects.filter(r=>Math.abs(r.y-firstY)<4);const widths=row.map(r=>r.w).sort((a,b)=>a-b);const cardWidth=widths.length?Math.round(widths[Math.floor(widths.length/2)]):0;
            const title=side?.querySelector('.sq-refine-v3-sidebar__title');const titleStyle=title?getComputedStyle(title):null;const sr=side?.getBoundingClientRect(),tr=title?.getBoundingClientRect();
            const groups=side?[...side.querySelectorAll(':scope > details.sq-refine-v3-group')].filter(visible).map(d=>({label:(d.querySelector(':scope > summary')?.textContent||'').trim(),inputs:d.querySelectorAll('input[type="checkbox"]').length})):[];
            const legacy=[...main.querySelectorAll('[class*="button-tree"],[class*="root-categories"],[class*="third-level"],[class*="branch-grid"],[class*="type-grid"],[class*="program-tree"],[class*="category-grid"],[class*="navigation-grid"],.sqbfl')].filter(e=>!e.closest('.sq-refine-v3-sidebar,.sq-refine-v3-results')&&visible(e)).length;
            return {ready:main?.dataset.sqRefineV3Ready==='true',error:main?.dataset.sqRefineV3Error||'',side:!!side,polished:side?.dataset.sqRefineV3Polished==='true',title:(title?.textContent||'').trim(),bg:titleStyle?.backgroundColor||'',fg:titleStyle?.color||'',rightGap:sr&&tr?Math.round(Math.max(0,sr.right-tr.right)*10)/10:null,position:side?getComputedStyle(side).position:'',height:side?Math.round(side.getBoundingClientRect().height):0,cards:cards.length,row:row.length,cardWidth,groups,legacy};
          })}
          const hasAny=(d,labels)=>d.groups.some(g=>labels.some(label=>g.label.toLowerCase()===label.toLowerCase())&&g.inputs>0);
          await fs.mkdir('final41-shots',{recursive:true});const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1440,height:1000}});let failed=[];
          for(let i=0;i<routes.length;i++){
            const [name,h]=routes[i];let errs=[];try{await nav(page,url(h));await page.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:50000});await page.waitForFunction(()=>{const v=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};return [...document.querySelectorAll('#MainContent .sq-refine-v3-sidebar')].some(v)},null,{timeout:20000});await sleep(900);const d=await inspect(page);if(!d.ready||d.error||!d.side||!d.polished)errs.push('V3/polish');if(d.title!=='REFINE PRODUCTS')errs.push('title');if(d.bg!=='rgb(8, 40, 63)'||d.fg!=='rgb(255, 255, 255)')errs.push(`header ${d.bg}/${d.fg}`);if(d.rightGap!==null&&d.rightGap>1.5)errs.push(`header right gap ${d.rightGap}`);if(d.position!=='sticky'||d.height<650)errs.push(`desktop sidebar ${d.position}/${d.height}`);if(d.cards>=3&&d.row!==3)errs.push(`desktop row ${d.row}`);if(d.cards&&d.cardWidth<250)errs.push(`card width ${d.cardWidth}`);if(d.legacy)errs.push(`legacy nav ${d.legacy}`);if(!hasAny(d,['Shop by Type']))errs.push('missing type');if(!hasAny(d,['Shop by Manufacturers','Shop by Manufacturer']))errs.push('missing manufacturers');if(h==='literature'&&(!hasAny(d,['Shop by Author'])||!hasAny(d,['Shop by Publisher','Shop by Publishers'])))errs.push('books taxonomy');if(h==='firearm-accessories'&&!hasAny(d,['Shop by Firearm Make / Model']))errs.push('firearm make/model');console.log('ROUTE',JSON.stringify({n:i+1,name,h,errs,d}));if(errs.length||['literature','firearm-accessories','stateside-quartermaster-logo-merch','products-built-for-the-line-u-s-navy','military-schools-academies'].includes(h))await page.screenshot({path:`final41-shots/${String(i+1).padStart(2,'0')}-${h}.png`,fullPage:true});}catch(e){errs.push(String(e));console.log('ROUTE_ERROR',JSON.stringify({n:i+1,name,h,error:String(e)}))}if(errs.length)failed.push({n:i+1,name,h,errs});await sleep(2300);
          }
          for(const h of ['accessories-gifts-collectibles','literature','products-built-for-the-line-u-s-navy']){const p=await browser.newPage({viewport:{width:390,height:844}});try{await nav(p,url(h));await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',null,{timeout:50000});await sleep(1300);const d=await p.evaluate(()=>{const v=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};const side=[...document.querySelectorAll('#MainContent .sq-refine-v3-sidebar')].find(v),grid=[...document.querySelectorAll('#MainContent .sq-refine-v3-results .product-grid')].find(v),cards=grid?[...grid.querySelectorAll(':scope > .product-grid__item')].filter(e=>v(e)&&e.querySelector('a[href*="/products/"]')).slice(0,6):[],r=cards.map(e=>e.getBoundingClientRect()),row=r.length?r.filter(x=>Math.abs(x.y-r[0].y)<4).length:0;return{side:!!side,pos:side?getComputedStyle(side).position:'',cards:cards.length,row}});let errs=[];if(!d.side)errs.push('sidebar');if(d.pos==='sticky')errs.push('mobile sticky');if(d.cards>=2&&d.row!==2)errs.push(`mobile row ${d.row}`);console.log('MOBILE',JSON.stringify({h,d,errs}));if(errs.length)failed.push({name:'mobile '+h,errs});await p.screenshot({path:`final41-shots/mobile-${h}.png`,fullPage:true});}catch(e){failed.push({name:'mobile '+h,errs:[String(e)]})}await p.close()}
          {const p=await browser.newPage({viewport:{width:1440,height:1000}});let errs=[];try{await nav(p,url('state-guard-series'));const d=await p.evaluate(()=>({v3:!!document.querySelector('script[data-sq-refine-v3]'),sidebar:!!document.querySelector('.sq-refine-v3-sidebar'),child:document.documentElement.dataset.sqRefineV3ChildIsolation||''}));if(d.v3||d.sidebar||d.child)errs.push('State Guard touched by V3');console.log('STATE_GUARD_41',JSON.stringify({d,errs}));if(errs.length)failed.push({n:41,name:'State Guard untouched control',errs});await p.screenshot({path:'final41-shots/41-state-guard-control.png',fullPage:true});}catch(e){failed.push({n:41,name:'State Guard untouched control',errs:[String(e)]})}await p.close()}
          await browser.close();console.log('FINAL41',JSON.stringify({editedRoutes:routes.length,stateGuardControl:1,failed,totalCollections:routes.length+1}));if(failed.length)process.exit(1);
          EOF
          node final41.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refine-v3-final-41-cert
          path: final41-shots/
          retention-days: 7