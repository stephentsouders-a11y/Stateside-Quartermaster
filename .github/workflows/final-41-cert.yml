# Evidence generation: post Shopify fetch-scope fix 2026-09-17
name: Final 41 Route Chromium Certification
on:
  push:
    paths: ['.github/workflows/final-41-cert.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Certify shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cat > cert.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const base='https://www.statesideqm.com',theme='158770561179',shard=Number(process.env.SHARD),shards=8;
          const all=[
          ['Tactical Gear','/collections/tactical-gear'],['Uniforms','/collections/uniforms'],['Firearm Accessories','/collections/firearm-accessories'],['Body Armor & Ballistic Protection','/collections/body-armor-ballistic-protection'],['Apparel','/collections/apparel'],['Flags & Patriotic Decor','/collections/flags-patriotic-decor'],['Literature','/collections/literature'],['Outdoor & Preparedness Gear','/collections/outdoor-preparedness-gear'],['First Aid, Medical & IFAK','/collections/first-aid-medical-ifak'],['Flashlights & Lighting','/collections/flashlights-lighting'],['Knives, Axes & Cutlery','/collections/knives-axes-cutlery'],['Dive & Scuba','/collections/dive-scuba'],['Armed Forces Gear','/collections/armed-forces-gear'],['Morale Patches & Tactical ID','/collections/morale-patches-tactical-id'],['Footwear, Gloves & Eyewear','/collections/footwear-gloves-eyewear'],['Accessories, Gifts & Collectibles','/collections/accessories-gifts-collectibles'],['Safety, Rescue & Climbing','/collections/safety-rescue-climbing'],['Airsoft & Milsim','/collections/airsoft-milsim'],['K9 & Dog Gear','/collections/k9-dog-gear'],['Patriotic & American Heritage','/collections/patriotic-american-heritage'],['Art','/collections/art'],['Zippos, Lighters & Torches','/collections/zippos-lighters-torches'],['Watches','/collections/watches'],['Armored Vehicles','/pages/armored-vehicles-purchase-inquiry'],['Child Safety Shop','/collections/child-safety-shop'],['Thin Line','/collections/thin-line'],['Sta-Brite Insignia','/collections/sta-brite-insignia'],['Stateside Quartermaster Logo Merch','/collections/stateside-quartermaster-logo-merch'],['Army National Guard Series','/collections/army-national-guard-series'],['Air National Guard Series','/collections/air-national-guard-series'],['U.S. Army','/collections/products-built-for-the-line-u-s-army'],['U.S. Navy','/collections/products-built-for-the-line-u-s-navy'],['U.S. Air Force','/collections/products-built-for-the-line-u-s-air-force'],['U.S. Marine Corps','/collections/products-built-for-the-line-u-s-marine-corps'],['U.S. Coast Guard','/collections/products-built-for-the-line-u-s-coast-guard'],['U.S. Space Force','/collections/products-built-for-the-line-u-s-space-force'],['ROTC','/collections/rotc-series'],['JROTC','/collections/jrotc-series'],['Military Schools & Academies','/collections/military-schools-academies'],['Law Enforcement & Corrections','/collections/law-enforcement-corrections'],['Firefighting, EMS & Search & Rescue','/collections/firefighting-ems-search-rescue']];
          if(all.length!==41||all.some(([,r])=>/state-guard-series/i.test(r)))throw new Error('41-route scope violated: State Guard is forbidden');
          const routes=all.filter((_,i)=>i%shards===shard),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          fs.mkdirSync('evidence/screens',{recursive:true});fs.mkdirSync('evidence/videos',{recursive:true});
          const browser=await chromium.launch({headless:true}),results=[];
          const isBadBody=t=>/Just a moment|Something went wrong|Too Many Requests|429 Too Many Requests/i.test(t||'');
          async function loadRoute(page,url){
            const attempts=[];let resp=null;const waits=[0,10000,20000,40000,60000];
            for(let a=0;a<waits.length;a++){
              if(waits[a])await sleep(waits[a]);
              resp=await page.goto(url,{waitUntil:'domcontentloaded'}).catch(()=>null);
              await sleep(2500);
              const body=(await page.locator('body').innerText().catch(()=>'' )).slice(0,5000);
              attempts.push({attempt:a+1,status:resp?.status()||0,badBody:isBadBody(body)});
              if(resp?.status()===200&&!isBadBody(body))return {resp,attempts};
            }
            return {resp,attempts};
          }
          async function inspect(page){
            return page.evaluate(()=>{const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity!==0&&r.width>1&&r.height>1},visible=q=>[...document.querySelectorAll(q)].filter(vis),rails=[...document.querySelectorAll('[data-sq-collection-rail]')],rail=rails.find(vis)||rails[0]||null,grp=n=>{const i=rail?.querySelector(`[data-sq-context-${n}]`),l=rail?.querySelector(`[data-sq-context-${n}-list]`);return{hidden:i?i.hidden:null,visible:vis(i),count:l?l.querySelectorAll('a[href]').length:0,firstHref:l?.querySelector('a[href]')?.getAttribute('href')||null}};return{railCount:rails.length,railVisibleCount:rails.filter(vis).length,categories:grp('categories'),subcategories:grp('subcategories'),types:grp('types'),organizations:grp('organizations'),whiteRefine:visible('.sq-global-refine-sidebar,.sqsg-refine-sidebar').length,nativeFilters:visible('.facets__filters-wrapper,.facets-horizontal-remove,.facets--filters-title,.facets-toggle__wrapper,theme-drawer#filters-drawer').length,productGrid:visible('collection-component,.product-grid,.product-grid-container').length,bfl:visible('[data-sqbfl-root],.sqbfl').length,bodyNav:visible('.sq-subcategory-section,.sq-third-level,.sq-books-tree,.sq-afg-branch-section,.sq-line-series-categories,.sq-line-program-tree,.sq-ps-root,.sq-ts-match-section,.sq-child-safety-section,.sq-maker-browser,.vac-unified-maker-browser,.vac-merged-browser,.vac-firearm-browser,.vac-dive-browser,.vac-knives-browser,.vac-armor-browser').length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4}});
          }
          async function transientSample(page){return page.evaluate(()=>({white:[...document.querySelectorAll('.sq-global-refine-sidebar,.sqsg-refine-sidebar')].filter(e=>e.getClientRects().length).length,native:[...document.querySelectorAll('.facets__filters-wrapper,theme-drawer#filters-drawer')].filter(e=>e.getClientRects().length).length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+4,bfl:[...document.querySelectorAll('[data-sqbfl-root],.sqbfl')].filter(e=>e.getClientRects().length).length}))}
          const hierarchyHref=s=>s.categories.firstHref||s.subcategories.firstHref||s.types.firstHref||s.organizations.firstHref||null;
          for(const [vp,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
            for(const [label,route] of routes){
              if(/state-guard-series/i.test(route))throw new Error(`Forbidden State Guard route reached: ${route}`);
              const ctx=await browser.newContext({viewport,recordVideo:{dir:'evidence/videos',size:viewport}});
              const page=await ctx.newPage();page.setDefaultNavigationTimeout(60000);
              const consoleErrors=[];const failedRequests=[];page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});page.on('requestfailed',r=>failedRequests.push({url:r.url(),error:r.failure()?.errorText||''}));
              await page.goto(`${base}/?preview_theme_id=${theme}`,{waitUntil:'domcontentloaded'}).catch(()=>null);await sleep(1500);
              const u=new URL(route,base);u.searchParams.set('preview_theme_id',theme);if(route.startsWith('/collections/'))u.searchParams.set('filter.v.availability','1');
              const loaded=await loadRoute(page,u.toString()),resp=loaded.resp;await sleep(2500);const root=await inspect(page);
              const safe=label.toLowerCase().replace(/[^a-z0-9]+/g,'-');await page.screenshot({path:`evidence/screens/${vp}-${safe}.png`,fullPage:true});
              const samples=[];for(let i=0;i<8;i++){samples.push(await transientSample(page));await sleep(250)}
              const traversal=[];
              if(route.startsWith('/collections/')){
                let state=root;
                for(let depth=0;depth<3;depth++){
                  const href=hierarchyHref(state);if(!href)break;
                  const target=new URL(href,page.url());target.searchParams.set('preview_theme_id',theme);target.searchParams.set('filter.v.availability','1');
                  if(/state-guard-series/i.test(target.pathname))throw new Error(`Forbidden State Guard hierarchy target reached from ${label}: ${target.pathname}`);
                  const rr=await loadRoute(page,target.toString());await sleep(2500);const next=await inspect(page);const ts=[];for(let i=0;i<4;i++){ts.push(await transientSample(page));await sleep(250)}
                  traversal.push({depth:depth+1,href,target:page.url(),status:rr.resp?.status()||0,attempts:rr.attempts,state:next,samples:ts});
                  await page.screenshot({path:`evidence/screens/${vp}-${safe}-hierarchy-${depth+1}.png`,fullPage:true});
                  if(new URL(page.url()).pathname===new URL(u).pathname&&depth>0)break;
                  state=next;
                }
              }
              results.push({vp,label,route,status:resp?.status()||0,attempts:loaded.attempts,root,samples,traversal,consoleErrors:consoleErrors.slice(-30),failedRequests:failedRequests.slice(-30)});await ctx.close();await sleep(5000)
            }
          }
          await browser.close();fs.writeFileSync(`evidence/shard-${shard}.json`,JSON.stringify({shard,results},null,2));
          const bad=[];
          for(const r of results){
            const isCollection=r.route.startsWith('/collections/'),hierarchyTotal=r.root.categories.count+r.root.subcategories.count+r.root.types.count+r.root.organizations.count;
            if(r.status!==200)bad.push(`${r.vp} ${r.label}: HTTP ${r.status} after retries`);
            if(isCollection&&(r.root.railCount!==1||r.root.railVisibleCount!==1))bad.push(`${r.vp} ${r.label}: rail ${r.root.railCount}/${r.root.railVisibleCount} visible`);
            if(isCollection&&hierarchyTotal===0)bad.push(`${r.vp} ${r.label}: empty hierarchy`);
            if(isCollection&&r.traversal.length===0)bad.push(`${r.vp} ${r.label}: hierarchy traversal did not execute`);
            if(r.root.whiteRefine)bad.push(`${r.vp} ${r.label}: white refine`);if(r.root.nativeFilters)bad.push(`${r.vp} ${r.label}: native filters`);if(r.root.overflow||r.samples.some(x=>x.overflow))bad.push(`${r.vp} ${r.label}: overflow`);
            for(const t of r.traversal){if(t.status!==200||t.state.whiteRefine||t.state.nativeFilters||t.state.overflow||t.samples.some(x=>x.white||x.native||x.overflow))bad.push(`${r.vp} ${r.label}: hierarchy depth ${t.depth} failed/duplicate/overflow`)}
          }
          if(bad.length){console.error([...new Set(bad)].join('\n'));process.exit(2)}
          console.log(JSON.stringify(results.map(r=>({vp:r.vp,label:r.label,status:r.status,root:r.root,traversal:r.traversal.map(t=>({depth:t.depth,status:t.status,target:t.target}))})),null,2));
          EOF
          node cert.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-41-cert-shard-${{ matrix.shard }}
          path: evidence/
          retention-days: 14
