name: REFINE V3 Button 01 Desktop Flow Trace
on:
  push:
    branches: [refine-restart-v3]
    paths: ['.github/workflows/refine-v3-button01-flow-trace.yml']
  workflow_dispatch:
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Trace computed layout chain
        run: |
          cat > trace.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true});
          const c=await b.newContext({viewport:{width:1440,height:1000}});
          const p=await c.newPage();
          const u='https://www.statesideqm.com/collections/accessories-gifts-collectibles?preview_theme_id=158561894555';
          await p.goto(u,{waitUntil:'domcontentloaded',timeout:90000});
          await p.waitForFunction(()=>document.querySelector('#MainContent')?.dataset.sqRefineV3Ready==='true',{timeout:60000});
          await p.waitForTimeout(1500);
          const out=await p.evaluate(()=>{
            const grid=document.querySelector('#MainContent .sq-refine-v3-results .product-grid');
            const card=grid?.querySelector(':scope > .product-grid__item');
            function info(el){if(!el)return null;const s=getComputedStyle(el),r=el.getBoundingClientRect();return{tag:el.tagName,id:el.id,cls:String(el.className||'').slice(0,240),rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),bottom:Math.round(r.bottom)},position:s.position,display:s.display,height:s.height,minHeight:s.minHeight,maxHeight:s.maxHeight,overflow:s.overflow,overflowX:s.overflowX,overflowY:s.overflowY,contain:s.contain,contentVisibility:s.contentVisibility,transform:s.transform};}
            const chain=[];for(let el=card;el;el=el.parentElement)chain.push(info(el));
            const probes=['html','body','.page-wrapper','#MainContent','.sq-refine-v3-layout','.sq-refine-v3-results','collection-component','#ResultsList','.product-grid'].map(sel=>({sel,info:info(document.querySelector(sel))}));
            const scrollables=[...document.querySelectorAll('body *')].map(el=>({el,s:getComputedStyle(el)})).filter(x=>/(auto|scroll|hidden|clip)/.test(x.s.overflowY)&&x.el.scrollHeight>x.el.clientHeight+2).slice(0,30).map(x=>({...info(x.el),clientHeight:x.el.clientHeight,scrollHeight:x.el.scrollHeight,scrollTop:x.el.scrollTop}));
            return{doc:{innerHeight,scrollY,htmlClient:document.documentElement.clientHeight,htmlScroll:document.documentElement.scrollHeight,bodyClient:document.body.clientHeight,bodyScroll:document.body.scrollHeight},probes,chain,scrollables};
          });
          console.log(JSON.stringify(out,null,2));
          await b.close();
          EOF
          node trace.mjs
